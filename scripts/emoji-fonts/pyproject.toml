# SPDX-License-Identifier: AGPL-3.0-only
# The generation-time tools of the emoji fonts (ADR-0091 §9), which `scripts/task.sh emoji:generate` runs through uv
# with the versions of uv.lock. Nothing here is part of the server, the client's build, or `scripts/task.sh check`.
[project]
name = "my-emoji-fonts"
version = "0.0.0"
requires-python = "==3.13.*"
license = "AGPL-3.0-only"
dependencies = [
  "brotli",
  "fonttools",
  "lxml",
  "uharfbuzz",
]

[tool.uv]
package = false

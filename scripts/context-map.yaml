entries:
  - paths: ["**"]
    docs: ["docs/adr/0079-ci-single-gate-merge-queue.md", "docs/adr/0081-generated-files-policy.md", "docs/agents/releasing.md"]
    checks: [docs, go, i18n, api, ui, web, docker, agentkit, mykit]
    shared: true
  - paths: ["release-image.sh", "release-image-test.sh", "release-libraries.sh", "release-notes.sh", "release-notes-test.sh"]
    docs: ["docs/agents/releasing.md"]
  - paths: ["docs-site.sh", "docs-site-test.sh", "docs-site/**", "docs-screenshots.sh"]
    docs: ["docs/adr/0150-documentation-site.md", "docs/agents/releasing.md#the-documentation-site", "docs/agents/translating-docs.md"]
    userdocs: ["docs/reference/commands.md"]
    checks: [site, docs]
  - paths: ["mail-preview/**"]
    docs: ["docs/adr/0086-email-delivery.md#2-組み立てテンプレートと外枠"]
    userdocs: ["docs/reference/commands.md"]
    checks: [go]
  - paths: ["go-build-tags.sh"]
    docs: ["CONTRIBUTING.md#build-tags"]
    userdocs: ["docs/reference/build-tags.md", "docs/operations/overview.md"]
  - paths: ["plugin-*.sh"]
    docs: ["docs/adr/0146-plugin-protocol.md", "docs/adr/0147-decision-hooks.md"]
    userdocs: ["docs/operations/plugins.md", "docs/reference/build-tags.md", "docs/operations/running.md", "docs/plugins/overview.md", "docs/plugins/probe.md", "docs/plugins/translator.md", "docs/plugins/search.md", "docs/plugins/billing.md", "docs/plugins/mailer.md", "docs/plugins/media.md", "docs/plugins/key-manager.md", "docs/plugins/hooks.md"]
    checks: [api, go]
  - paths: ["db-lint.sh", "db-lint-test.sh", "schema-files.sh"]
    docs: ["docs/architecture/data-model/01-conventions.md#1-共通規約", "docs/adr/0020-data-modeling-principles.md", "docs/adr/0023-declarative-schema-management.md"]
    userdocs: ["docs/operations/privacy-policy-template.md", "docs/operations/processing-record-template.md"]
    checks: [schema, go]
    shared: true
  - paths: ["mykit-mod-check.sh"]
    docs: ["docs/adr/0093-api-client-library-mykit.md", "docs/architecture/client-api.md#4-認可oauth-20"]
    userdocs: ["docs/developers/libraries.md"]
    checks: [mykit]
  - paths: ["emoji-fonts/**"]
    docs: ["docs/adr/0091-composer-emoji-picker.md", "app/ui/README.md#typography"]
    checks: [ui, web]
  - paths: ["dev-compose.sh", "dev-cert.sh"]
    docs: ["CONTRIBUTING.md#local-development", "CONTRIBUTING.md#emails"]
    checks: [docker, shell]
  - paths: ["tofu-*"]
    docs: ["deploy/opentofu/README.md", "deploy/opentofu/modules/internal/README.md", "docs/operations/deploy-cloud-run.md", "docs/architecture/deployment-targets.md#google-cloud", "docs/adr/0164-opentofu-platform-modules.md"]
    userdocs: ["docs/operations/deploy-cloud-run.md", "docs/operations/email-ses.md"]
    checks: [tofu, shell, docs]
  - paths: ["federation-live.sh"]
    docs: ["test/federation-live/README.md", "docs/architecture/federation.md#12-テスト"]
    checks: [docker, go]
  - paths: ["upgrade-test.sh", "previous-minor.sh", "previous-minor-test.sh", "web-sign-in.sh"]
    docs: ["docs/agents/releasing.md#the-upgrade-test", "docs/operations/database.md#upgrading"]
    checks: [docker, shell]
  - paths: ["restore-drill.sh", "remote-test-server.sh"]
    docs: ["docs/operations/backup.md", "docs/operations/key-management.md#back-it-up"]
    userdocs: ["docs/operations/backup.md"]
    checks: [docker, shell, go]

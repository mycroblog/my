# SPDX-License-Identifier: AGPL-3.0-only
#
# The files each documentation rule of AGENTS.md ("Documentation") covers, checked by `agentkit docs lint`
# (scripts/task.sh docs:rules). Every Markdown file not skipped is also checked for relative links and #anchors
# that resolve. The inventories at the end are checked by `agentkit docs inventory` (scripts/task.sh agentkit:inventory).
#
# Patterns: `*` matches within one path segment, `**` any number of segments; a pattern that starts with `!`
# takes the files it matches out of its list.

# Files no rule reads.
skip:
  - "**/node_modules/**"
  - "**/testdata/**"
  # The translations of the documentation site: their links are written as in the English source they translate, and
  # `scripts/task.sh docs:site-translations-check` keeps each link target equal to the source's, whose links this checks.
  - "app/docs/i18n/**"
  # The map files name headings by their anchors, which are Japanese for the design documents; `agentkit map check` reads them.
  - "**/context-map.yaml"

# Written in English only: no Japanese outside code spans, code blocks, and link destinations. A line that must
# show Japanese (a UI string of the ja locale, say) carries `docs-lint: allow-japanese` in a comment on that line
# or the line before.
english:
  - "*.md"
  - "**/AGENTS.md"
  - "docs/README.md"
  - ".claude/**/*.md"
  - "docs/operations/**"
  - "docs/guide/**"
  - "docs/reference/**"
  - "docs/developers/**"
  - "docs/plugins/**"
  - "schema/README.md"
  - "deploy/**/*.md"
  - "deploy/**/*.yaml"
  - "deploy/**/*.yml"
  - "compose.yaml"
  - "test/**/*.md"
  - "test/**/*.yaml"
  - ".github/ISSUE_TEMPLATE/*"
  - ".github/pull_request_template.md"
  - "app/ui/README.md"
  - "app/docs/src/content/docs/index.mdx"
  - "pkg/**/README.md"
  - "tools/agentkit/README.md"

# For users and operators: they explain the behaviour themselves and neither link to nor cite ADRs,
# docs/requirements/, docs/architecture/, or GitHub issues and pull requests.
operator:
  - "README.md"
  - "SECURITY.md"
  # The landing page of the documentation site.
  - "app/docs/src/content/docs/index.mdx"
  - "docs/operations/**"
  - "docs/guide/**"
  - "docs/reference/**"
  - "docs/developers/**"
  - "docs/plugins/**"

# Written for people who run an instance, so they use none of these words of the project's own development, in
# prose or in code; HTML comments do not count. A passage that needs one belongs in a contributor document.
maintainer-terms:
  files:
    - "README.md"
    - "app/docs/src/content/docs/index.mdx"
    - "docs/operations/**"
    - "docs/guide/**"
    - "docs/reference/**"
    - "docs/developers/**"
    - "docs/plugins/**"
    # SECURITY.md tells a reporter not to open a public pull request, which is the word it needs; it is not in the
    # list above for that reason.
  terms:
    - "the decider"
    - "scripts/task.sh"
    - "scripts/agentkit.sh"
    - "agentkit"
    - "go-task"
    - "merge queue"
    - "pull request"
    - "preflight"
    - "slow suite"
    - "slow-suite.yml"
    - "orchestrator"

# The section a published document sits in (Operation, Using mycroblog, Developers, Reference) already says whom it
# is for, so its opening, the first line below the title outside code and HTML, says what the page is about instead.
# An opening that matches one of these regular expressions (whatever its case) states only its audience.
openings:
  files:
    - "docs/operations/**"
    - "docs/guide/**"
    - "docs/reference/**"
    - "docs/developers/**"
    - "docs/plugins/**"
  reject:
    # "A guide for operators.", "An explanation and verification guide for operators.", "A template for operators: ..."
    - '^an? [^.:]*\b(guide|reference|explanation|template|page|document)s? for\b'
    # "This page is for operators.", "This guide is for operators and moderators."
    - '^this (page|guide|document|reference|template) is (meant |written )?for\b'
    # "This page explains link previews to operators ..."
    - '^this (page|guide|document) (explains|describes) [^.]* to (operators|administrators|moderators|users|developers)\b'

# The index of the documents for users and operators: it links every file of the list.
index:
  file: docs/README.md
  files:
    - "docs/operations/*.md"
    - "docs/guide/*.md"
    - "docs/reference/*.md"
    - "docs/developers/*.md"
    - "docs/plugins/*.md"

# Files that do not follow a rule yet. Never add a file: write a new file to the rules. When you add or rewrite a
# section of a listed file, convert the whole file and remove it here; the check fails while a listed file already
# follows the rule.
pending:
  japanese: []
  design-links: []
  # ADRs that transcribe the implementation: longer than an ADR may be, a table of more rows than one may have, or a
  # code span that names a path, a file, a task, or a Go identifier. `bin/agentkit docs adr-shape` lists them.
  adr-shape:
    - docs/adr/0003-database-abstraction.md
    - docs/adr/0004-job-queue-abstraction.md
    - docs/adr/0005-blob-storage-and-media.md
    - docs/adr/0006-federation-protocol-scope.md

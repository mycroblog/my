#
# The files each documentation rule of AGENTS.md ("Documentation") covers, checked by `agentkit docs lint`
# (scripts/task.sh docs:rules). Every Markdown file not skipped is also checked for relative links and #anchors
# that resolve. The inventories at the end are checked by `agentkit docs inventory` (scripts/task.sh agentkit:inventory).
#
# Patterns: `*` matches within one path segment, `**` any number of segments; a pattern that starts with `!`
# takes the files it matches out of its list.

# Files no rule reads.
skip:
  - "**/node_modules/**"
  - "**/testdata/**"

# Written in English only: no Japanese outside code spans, code blocks, and link destinations. A line that must
# show Japanese (a UI string of the ja locale, say) carries `docs-lint: allow-japanese` in a comment on that line
# or the line before.
english:
  - "*.md"
  - "docs/README.md"
  - "docs/agents/**"
  - "docs/operations/**"
  - "docs/guide/**"
  - "docs/reference/**"
  - "schema/README.md"
  - "deploy/**/*.md"
  - "deploy/**/*.yaml"
  - "deploy/**/*.yml"
  - "compose.yaml"
  - "test/**/*.md"
  - "test/**/*.yaml"
  - ".github/ISSUE_TEMPLATE/*"
  - ".github/pull_request_template.md"
  - "app/ui/README.md"
  - "pkg/**/README.md"
  - "tools/agentkit/README.md"

# For users and operators: they explain the behaviour themselves and neither link to nor cite ADRs,
# docs/requirements/, docs/architecture/, or GitHub issues and pull requests.
operator:
  - "README.md"
  - "SECURITY.md"
  - "docs/operations/**"
  - "docs/guide/**"
  - "docs/reference/**"
  # The development tasks, for contributors: it may cite the ADR a task's rule comes from.
  - "!docs/reference/commands.md"

# Written for people who run an instance, so they use none of these words of the project's own development, in
# prose or in code; HTML comments do not count. A passage that needs one belongs in a contributor document.
maintainer-terms:
  files:
    - "README.md"
    - "docs/operations/**"
    - "docs/guide/**"
    - "docs/reference/**"
    # The development tasks, for contributors.
    - "!docs/reference/commands.md"
    # SECURITY.md tells a reporter not to open a public pull request, which is the word it needs; it is not in the
    # list above for that reason.
  terms:
    - "the decider"
    - "scripts/task.sh"
    - "scripts/agentkit.sh"
    - "agentkit"
    - "go-task"
    - "merge queue"
    - "pull request"
    - "preflight"
    - "slow suite"
    - "slow-suite.yml"
    - "orchestrator"

# The index of the documents for users and operators: it links every file of the list.
index:
  file: docs/README.md
  files:
    - "docs/operations/*.md"
    - "docs/guide/*.md"
    - "docs/reference/*.md"

# Files that do not follow a rule yet. Never add a file: write a new file to the rules. When you add or rewrite a
# section of a listed file, convert the whole file and remove it here; the check fails while a listed file already
# follows the rule.
pending:
  japanese: []
  design-links: []

# The ADRs and the citations of them: every ADR-NNNN and ADR-NNNN §k resolves and is not a retired number, a bare §k
# inside an ADR is a heading of that ADR, and an ADR has the sections of docs/adr/template.md and no quoted answers.
# Until `enforce` is set, `agentkit docs lint` prints the findings as warnings. The excluded files write ADR-NNNN for
# something else: agentkit's own records, and the examples of its tests and comments.
adrs:
  enforce: true
  exclude:
    - "tools/agentkit/docs/adr/**"
    - "tools/agentkit/README.md"
    - "scripts/agentkit-*.sh"
    - "tools/agentkit/internal/**/*_test.go"
    - "tools/agentkit/internal/adr/aliases.go"
    - "tools/agentkit/internal/docslint/*.go"

# The names users and operators see, which the code defines and a document must mention (agentkit docs inventory):
# the commands of `my` (README.md, docs/operations/, docs/reference/), the metrics (docs/operations/running.md), the
# webhook event types (docs/reference/webhooks.md), the build tags (docs/reference/build-tags.md), the tasks that
# `scripts/task.sh --list` lists (docs/reference/commands.md), and the job types and periodic jobs
# (docs/reference/jobs.md). Exclude a name here only with the reason in a comment;
# the check fails when an excluded name is mentioned after all or no longer defined.
inventory:
  exclude:
    cli: []
    metrics: []
    webhook-events: []
    build-tags: []
    tasks: []
    job-types: []
    job-schedules: []

    - docs/adr/0018-federated-uris.md
    - docs/adr/0019-security-baseline.md
    - docs/adr/0023-declarative-schema-management.md
    - docs/adr/0025-web-client-stack.md
    - docs/adr/0028-html-shell-link-previews-and-pwa.md
    - docs/adr/0050-stream-pubsub-across-processes.md
    - docs/adr/0051-custom-emoji.md
    - docs/adr/0055-service-observability.md
    - docs/adr/0057-crawler-opt-out.md
    - docs/adr/0058-moderation-admin-separation.md
    - docs/adr/0059-design-tokens-and-instance-theme.md
    - docs/adr/0060-instance-webhooks.md

  <text class="m" x="565.0" y="452" text-anchor="middle">role = all or sfu</text>
  <text class="m" x="565.0" y="474" text-anchor="middle">voice_sfu_public_url</text>
  <text class="m" x="565.0" y="496" text-anchor="middle">forwards the speakers' audio</text>
  <path class="audio" d="M 40 555 L 84 555"/>

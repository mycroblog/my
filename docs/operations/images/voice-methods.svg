  <text class="t b" x="195.0" y="430" text-anchor="middle">STUN and TURN</text>
  <text class="m" x="195.0" y="452" text-anchor="middle">voice_stun_urls</text>
  <text class="m" x="195.0" y="474" text-anchor="middle">voice_turn: coturn</text>
  <text class="m" x="195.0" y="496" text-anchor="middle">or cloudflare</text>
  <rect class="group" x="390" y="16" width="350" height="518" rx="12"/>
  <text class="h" x="404" y="46" text-anchor="start">voice = sfu</text>
  <rect class="proc" x="400" y="62" width="330" height="118" rx="8"/>
  <text class="t b" x="565.0" y="92" text-anchor="middle">my serve</text>
  <text class="m" x="565.0" y="114" text-anchor="middle">rooms, sessions, grants</text>
  <text class="m" x="565.0" y="136" text-anchor="middle">places rooms on nodes</text>
  <text class="m" x="565.0" y="158" text-anchor="middle">carries no audio</text>
  <rect class="client" x="420" y="260" width="100" height="60" rx="8"/>
  <rect class="client" x="570" y="260" width="100" height="60" rx="8"/>
  <text class="t b" x="470" y="295" text-anchor="middle">Browser</text>
  <path class="arrow" d="M 470 184 L 470 256" marker-start="url(#arrowhead)" marker-end="url(#arrowhead)"/>
  <path class="signal" d="M 461 324 L 461 396" marker-start="url(#signalhead)" marker-end="url(#signalhead)"/>
  <path class="audio" d="M 479 324 L 479 396" marker-start="url(#audiohead)" marker-end="url(#audiohead)"/>
  <text class="t b" x="620" y="295" text-anchor="middle">Browser</text>
  <path class="arrow" d="M 620 184 L 620 256" marker-start="url(#arrowhead)" marker-end="url(#arrowhead)"/>
  <path class="signal" d="M 611 324 L 611 396" marker-start="url(#signalhead)" marker-end="url(#signalhead)"/>

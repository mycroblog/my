  <text class="t b" x="195.0" y="92" text-anchor="middle">my serve</text>
  <text class="m" x="195.0" y="114" text-anchor="middle">rooms, sessions, grants</text>
  <text class="m" x="195.0" y="136" text-anchor="middle">relays the signals</text>
  <text class="m" x="195.0" y="158" text-anchor="middle">carries no audio</text>
  <rect class="client" x="60" y="260" width="100" height="60" rx="8"/>
  <rect class="client" x="230" y="260" width="100" height="60" rx="8"/>
  <text class="t b" x="110" y="295" text-anchor="middle">Browser</text>
  <path class="signal" d="M 110 184 L 110 256" marker-start="url(#signalhead)" marker-end="url(#signalhead)"/>
  <path class="audio" d="M 110 324 L 110 396" marker-start="url(#audiohead)" marker-end="url(#audiohead)"/>

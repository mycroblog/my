      .arrow { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .signal { stroke: #4493f8; }
      .signal-head { fill: #4493f8; }
      .audio { stroke: #3fb950; }
      .audio-head { fill: #3fb950; }
    }
  </style>

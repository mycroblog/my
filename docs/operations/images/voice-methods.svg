  <path class="signal" d="M 280 184 L 280 256" marker-start="url(#signalhead)" marker-end="url(#signalhead)"/>
  <path class="audio" d="M 280 324 L 280 396" marker-start="url(#audiohead)" marker-end="url(#audiohead)"/>
  <text class="m" x="195" y="225" text-anchor="middle">signals</text>
  <path class="audio" d="M 165 290 L 225 290" marker-start="url(#audiohead)" marker-end="url(#audiohead)"/>

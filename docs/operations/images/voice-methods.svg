<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 584" width="760" height="584" role="img" aria-labelledby="title desc">
<!-- SPDX-License-Identifier: AGPL-3.0-only -->
  <title id="title">How the audio travels with voice = p2p, livekit, and sora</title>
  <desc id="desc">Three methods side by side. With voice = p2p, the my serve process holds the rooms, the sessions, and the grants, carries no audio, and relays the signals between the browsers; the browsers send audio straight to each other, and the TURN server relays it when no direct path exists; the STUN and TURN servers come from voice_stun_urls and voice_turn (coturn or cloudflare). With voice = livekit, the browsers get grants from my serve and send their signals and audio to the LiveKit server at voice_livekit_url, which brings its own STUN and TURN; my serve creates the LiveKit rooms through LiveKit's API and receives its webhooks, and carries no audio. With voice = sora, the browsers get grants from my serve and send their signals and audio to the Sora server at voice_sora_signaling_urls, which brings its own STUN and TURN; my serve answers the auth webhook that Sora calls before every connection, and carries no audio.</desc>


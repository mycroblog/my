<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 584" width="760" height="584" role="img" aria-labelledby="title desc">
<!-- SPDX-License-Identifier: AGPL-3.0-only -->
  <title id="title">How the audio travels with voice = p2p and sfu</title>
  <desc id="desc">Two methods side by side. With voice = p2p, the my serve process holds the rooms, the sessions, and the grants, carries no audio, and relays the signals between the browsers; the browsers send audio straight to each other, and the TURN server relays it when no direct path exists; the STUN and TURN servers come from voice_stun_urls and voice_turn (coturn or cloudflare). With voice = sfu, the browsers get grants from my serve, which places each room on a media node and carries no audio; each browser sends its signals and its audio to the media node of its room at voice_sfu_public_url, a process with role = all or sfu, which forwards the audio of the speakers to the participants and reads the rooms that my serve holds.</desc>

  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .bg { fill: #ffffff; }
    .t { fill: #1f2328; font-size: 16px; }
    .b { font-weight: 600; }
    .m { fill: #59636e; font-size: 15px; }
    .h { fill: #1f2328; font-size: 17px; font-weight: 600; }
    .group { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1.5; }
    .client { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.5; }
    .proc { fill: #ddf4ff; stroke: #0969da; stroke-width: 2; }
    .port { fill: #ffffff; stroke: #8c959f; stroke-width: 1.5; }
    .svc { fill: #fbefff; stroke: #8250df; stroke-width: 1.5; }
    .arrow { stroke: #59636e; stroke-width: 2; fill: none; }
    .head { fill: #59636e; }
    .signal { stroke: #0969da; stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
    .signal-head { fill: #0969da; }
    .audio { stroke: #1a7f37; stroke-width: 3; fill: none; }
    .audio-head { fill: #1a7f37; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .t, .h { fill: #e6edf3; }
      .m { fill: #9198a1; }
      .group { fill: #151b23; stroke: #3d444d; }
      .client { fill: #0f2d1b; stroke: #3fb950; }
      .proc { fill: #0c2d6b; stroke: #4493f8; }
      .port { fill: #0d1117; stroke: #656c76; }
      .svc { fill: #2a1650; stroke: #ab7df8; }
      .arrow { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .signal { stroke: #4493f8; }
      .signal-head { fill: #4493f8; }
      .audio { stroke: #3fb950; }
      .audio-head { fill: #3fb950; }
    }
  </style>
  <defs>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 494" width="760" height="494" role="img" aria-labelledby="title desc">
<!-- SPDX-License-Identifier: AGPL-3.0-only -->
  <title id="title">What the server answers around a maintenance</title>
  <desc id="desc">What the server answers before, during, and after the maintenance mode, from left to right. Before: the maintenance is announced, and every path answers as usual: /healthz, /readyz, and /api/v1/instance/health answer 200 with status ok. In the maintenance mode, set with MY_MAINTENANCE=true: /healthz and /readyz answer 200 with status maintenance; /api/v1/instance/health answers 503 with status maintenance; the client API and OAuth answer 503 with the maintenance problem; ActivityPub, WebFinger, and NodeInfo answer 503 with error maintenance; pages and the web client get 503 with the maintenance page. Every response in the maintenance mode has Retry-After and Cache-Control: no-store. After: the server is redeployed without the maintenance mode, and every path answers as usual again.</desc>

  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .bg { fill: #ffffff; }
    .t { fill: #1f2328; font-size: 16px; }
    .b { font-weight: 600; }
    .m { fill: #59636e; font-size: 15px; }
    .h { fill: #1f2328; font-size: 17px; font-weight: 600; }
    .group { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1.5; }
    .proc { fill: #ddf4ff; stroke: #0969da; stroke-width: 2; }
    .port { fill: #ffffff; stroke: #8c959f; stroke-width: 1.5; }
    .svc { fill: #fbefff; stroke: #8250df; stroke-width: 1.5; }
    .arrow { stroke: #59636e; stroke-width: 2; fill: none; }
    .rule { stroke: #59636e; stroke-width: 1.5; stroke-dasharray: 6 5; fill: none; }
    .head { fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .t, .h { fill: #e6edf3; }
      .m { fill: #9198a1; }
      .group { fill: #151b23; stroke: #3d444d; }
      .proc { fill: #0c2d6b; stroke: #4493f8; }
      .port { fill: #0d1117; stroke: #656c76; }
      .svc { fill: #2a1650; stroke: #ab7df8; }
      .arrow, .rule { stroke: #9198a1; }
      .head { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="760" height="494" rx="12"/>
  <rect class="port" x="216" y="20" width="150" height="64" rx="8"/>
  <text class="t b" x="291.0" y="48.0" text-anchor="middle">Before</text>
  <text class="m" x="291.0" y="70.0" text-anchor="middle">announce it</text>
  <rect class="proc" x="376" y="20" width="214" height="64" rx="8"/>
  <text class="t b" x="483.0" y="48.0" text-anchor="middle">Maintenance mode</text>
  <text class="m" x="483.0" y="70.0" text-anchor="middle">MY_MAINTENANCE=true</text>
  <path class="arrow" d="M 367 52.0 L 373 52.0" marker-end="url(#arrowhead)"/>
  <rect class="port" x="600" y="20" width="140" height="64" rx="8"/>
  <text class="t b" x="670.0" y="48.0" text-anchor="middle">After</text>
  <text class="m" x="670.0" y="70.0" text-anchor="middle">redeploy without it</text>
  <path class="arrow" d="M 591 52.0 L 597 52.0" marker-end="url(#arrowhead)"/>
  <text class="h" x="20" y="58.0" text-anchor="start">Request</text>
  <path class="rule" d="M 20 101 L 740 101"/>
  <text class="t b" x="20" y="152.0" text-anchor="start">/healthz, /readyz</text>
  <rect class="port" x="216" y="118" width="150" height="56" rx="8"/>
  <text class="t b" x="291.0" y="142.0" text-anchor="middle">200</text>
  <text class="m" x="291.0" y="163.0" text-anchor="middle">{"status":"ok"}</text>
  <rect class="proc" x="376" y="118" width="214" height="56" rx="8"/>
  <text class="t b" x="483.0" y="142.0" text-anchor="middle">200</text>
  <text class="m" x="483.0" y="163.0" text-anchor="middle">{"status":"maintenance"}</text>
  <rect class="port" x="600" y="118" width="140" height="56" rx="8"/>
  <text class="t b" x="670.0" y="142.0" text-anchor="middle">200</text>
  <text class="m" x="670.0" y="163.0" text-anchor="middle">{"status":"ok"}</text>
  <text class="t b" x="20" y="220.0" text-anchor="start">/api/v1/instance/health</text>
  <rect class="port" x="216" y="186" width="150" height="56" rx="8"/>
  <text class="t b" x="291.0" y="210.0" text-anchor="middle">200</text>
  <text class="m" x="291.0" y="231.0" text-anchor="middle">{"status":"ok"}</text>
  <rect class="proc" x="376" y="186" width="214" height="56" rx="8"/>
  <text class="t b" x="483.0" y="210.0" text-anchor="middle">503</text>
  <text class="m" x="483.0" y="231.0" text-anchor="middle">{"status":"maintenance"}</text>
  <rect class="port" x="600" y="186" width="140" height="56" rx="8"/>
  <text class="t b" x="670.0" y="210.0" text-anchor="middle">200</text>
  <text class="m" x="670.0" y="231.0" text-anchor="middle">{"status":"ok"}</text>
  <text class="t b" x="20" y="288.0" text-anchor="start">Client API, OAuth</text>
  <rect class="port" x="216" y="254" width="150" height="56" rx="8"/>
  <text class="m" x="291.0" y="287.0" text-anchor="middle">as usual</text>
  <rect class="proc" x="376" y="254" width="214" height="56" rx="8"/>
  <text class="t b" x="483.0" y="278.0" text-anchor="middle">503</text>
  <text class="m" x="483.0" y="299.0" text-anchor="middle">maintenance problem</text>
  <rect class="port" x="600" y="254" width="140" height="56" rx="8"/>
  <text class="m" x="670.0" y="287.0" text-anchor="middle">as usual</text>
  <text class="t b" x="20" y="356.0" text-anchor="start"></text>
  <text class="t b" x="20" y="346.0" text-anchor="start">ActivityPub,</text>
  <text class="t b" x="20" y="366.0" text-anchor="start">WebFinger, NodeInfo</text>
  <rect class="port" x="216" y="322" width="150" height="56" rx="8"/>
  <text class="m" x="291.0" y="355.0" text-anchor="middle">as usual</text>
  <rect class="proc" x="376" y="322" width="214" height="56" rx="8"/>
  <text class="t b" x="483.0" y="346.0" text-anchor="middle">503</text>
  <text class="m" x="483.0" y="367.0" text-anchor="middle">{"error":"maintenance"}</text>
  <rect class="port" x="600" y="322" width="140" height="56" rx="8"/>
  <text class="m" x="670.0" y="355.0" text-anchor="middle">as usual</text>
  <text class="t b" x="20" y="424.0" text-anchor="start">Pages, web client</text>
  <rect class="port" x="216" y="390" width="150" height="56" rx="8"/>
  <text class="m" x="291.0" y="423.0" text-anchor="middle">as usual</text>
  <rect class="proc" x="376" y="390" width="214" height="56" rx="8"/>
  <text class="t b" x="483.0" y="414.0" text-anchor="middle">503</text>
  <text class="m" x="483.0" y="435.0" text-anchor="middle">maintenance page</text>
  <rect class="port" x="600" y="390" width="140" height="56" rx="8"/>
  <text class="m" x="670.0" y="423.0" text-anchor="middle">as usual</text>
  <text class="m" x="483.0" y="476" text-anchor="middle">all with Retry-After, no-store</text>
</svg>

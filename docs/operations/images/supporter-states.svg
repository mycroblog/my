<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 416" width="760" height="416" role="img" aria-labelledby="title desc">
<!-- SPDX-License-Identifier: AGPL-3.0-only -->
  <title id="title">The states of a supporter subscription and the plan's role</title>
  <desc id="desc">A subscription starts as pending, with no role. The first payment makes it active, which holds the plan's role. When a payment fails it becomes past_due and keeps the role; 7 days later it becomes lapsed and loses the role, and a payment after that makes it active again. A cancellation makes an active subscription canceling, which keeps the role until the end of the period and then becomes expired. A full refund or a chargeback makes it revoked, and a subscription that ends before its first payment becomes abandoned. Active, canceling, and past_due hold the plan's role; pending, lapsed, expired, revoked, and abandoned do not. Expired, revoked, and abandoned are final.</desc>

  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .bg { fill: #ffffff; }
    .t { fill: #1f2328; font-size: 16px; }
    .b { font-weight: 600; }
    .m { fill: #59636e; font-size: 15px; }
    .h { fill: #1f2328; font-size: 17px; font-weight: 600; }
    .proc { fill: #ddf4ff; stroke: #0969da; stroke-width: 2; }
    .port { fill: #ffffff; stroke: #8c959f; stroke-width: 1.5; }
    .arrow { stroke: #59636e; stroke-width: 2; fill: none; }
    .head { fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .t, .h { fill: #e6edf3; }
      .m { fill: #9198a1; }
      .proc { fill: #0c2d6b; stroke: #4493f8; }
      .port { fill: #0d1117; stroke: #656c76; }
      .arrow { stroke: #9198a1; }
      .head { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="760" height="416" rx="12"/>
  <text class="h" x="20" y="34" text-anchor="start">States of a subscription</text>

  <path class="arrow" d="M 684 84 L 684 64 L 278 64 L 278 80" marker-end="url(#arrowhead)"/>
  <text class="m" x="481" y="56" text-anchor="middle">paid after the grace period</text>

  <rect class="port" x="20" y="84" width="110" height="52" rx="8"/>
  <text class="t b" x="75" y="115" text-anchor="middle">pending</text>
  <path class="arrow" d="M 130 110 L 219 110" marker-end="url(#arrowhead)"/>
  <text class="m" x="176" y="102" text-anchor="middle">first</text>
  <text class="m" x="176" y="128" text-anchor="middle">payment</text>

  <rect class="proc" x="223" y="84" width="110" height="52" rx="8"/>
  <text class="t b" x="278" y="115" text-anchor="middle">active</text>
  <path class="arrow" d="M 333 110 L 422 110" marker-end="url(#arrowhead)"/>
  <text class="m" x="379" y="102" text-anchor="middle">payment</text>
  <text class="m" x="379" y="128" text-anchor="middle">fails</text>

  <rect class="proc" x="426" y="84" width="110" height="52" rx="8"/>
  <text class="t b" x="481" y="115" text-anchor="middle">past_due</text>
  <path class="arrow" d="M 536 110 L 625 110" marker-end="url(#arrowhead)"/>
  <text class="m" x="582" y="102" text-anchor="middle">7 days</text>
  <text class="m" x="582" y="128" text-anchor="middle">later</text>

  <rect class="port" x="629" y="84" width="110" height="52" rx="8"/>
  <text class="t b" x="684" y="115" text-anchor="middle">lapsed</text>

  <path class="arrow" d="M 278 136 L 278 200" marker-end="url(#arrowhead)"/>
  <text class="m" x="288" y="174" text-anchor="start">canceled</text>

  <rect class="proc" x="223" y="204" width="110" height="52" rx="8"/>
  <text class="t b" x="278" y="235" text-anchor="middle">canceling</text>
  <path class="arrow" d="M 333 230 L 422 230" marker-end="url(#arrowhead)"/>
  <text class="m" x="379" y="222" text-anchor="middle">end of</text>
  <text class="m" x="379" y="248" text-anchor="middle">period</text>

  <rect class="port" x="426" y="204" width="110" height="52" rx="8"/>
  <text class="t b" x="481" y="235" text-anchor="middle">expired</text>

  <rect class="port" x="20" y="300" width="110" height="52" rx="8"/>
  <text class="t b" x="75" y="331" text-anchor="middle">revoked</text>
  <text class="m" x="142" y="331" text-anchor="start">full refund or chargeback</text>

  <rect class="port" x="426" y="300" width="110" height="52" rx="8"/>
  <text class="t b" x="481" y="331" text-anchor="middle">abandoned</text>
  <text class="m" x="548" y="331" text-anchor="start">ends before paying</text>

  <rect class="proc" x="20" y="377" width="28" height="18" rx="4"/>
  <text class="m" x="56" y="391" text-anchor="start">holds the plan's role</text>
  <rect class="port" x="230" y="377" width="28" height="18" rx="4"/>
  <text class="m" x="266" y="391" text-anchor="start">no role</text>
  <text class="m" x="400" y="391" text-anchor="start">expired, revoked, abandoned: final</text>
</svg>

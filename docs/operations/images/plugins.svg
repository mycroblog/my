<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1000" width="760" height="1000" role="img" aria-labelledby="title desc">
<!-- SPDX-License-Identifier: AGPL-3.0-only -->
  <title id="title">Where plugins sit</title>
  <desc id="desc">The my process, with role web, worker, or all, holds two kinds of plugin calls. Ports it hands over, each on when a setting names plugin: translator (translation_providers = plugin), billing (billing_sources includes plugin), mailer (mail = plugin), media (media = plugin), and key_manager (key_manager = plugin). Decision hooks, asked unless hook_&lt;hook&gt;_mode is off: inbound.status for posts from other servers, inbound.follow for follows from other servers, signup.check for sign-ups, media.check for uploads, and local.status for posts of local accounts. Every call goes through the plugin client, which has one destination per kind (plugin_&lt;kind&gt;_address), a deadline (plugin_&lt;kind&gt;_timeout), and 8 calls at once (2 for media). It connects over unix://, https://, or, for some kinds only, http:// to your plugins: separate programs that you run as a sidecar, under systemd, or on another machine; the server only connects. When a call fails or times out: for billing, mailer, and media, the job that made the call runs again later; for translator, the next provider is asked, and with none left the reader sees it fail; key_manager fails closed, so what needs a key fails, and the server does not start without it; a decision hook does what hook_&lt;hook&gt;_on_failure says: pass, retry, or require_approval.</desc>

  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .bg { fill: #ffffff; }
    .t { fill: #1f2328; font-size: 16px; }
    .b { font-weight: 600; }
    .m { fill: #59636e; font-size: 15px; }
    .h { fill: #1f2328; font-size: 17px; font-weight: 600; }
    .group { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1.5; }
    .proc { fill: #ddf4ff; stroke: #0969da; stroke-width: 2; }
    .port { fill: #ffffff; stroke: #8c959f; stroke-width: 1.5; }
    .svc { fill: #fbefff; stroke: #8250df; stroke-width: 1.5; }
    .danger { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.5; }
    .arrow { stroke: #59636e; stroke-width: 2; fill: none; }
    .head { fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .t, .h { fill: #e6edf3; }
      .m { fill: #9198a1; }
      .group { fill: #151b23; stroke: #3d444d; }
      .proc { fill: #0c2d6b; stroke: #4493f8; }
      .port { fill: #0d1117; stroke: #656c76; }
      .svc { fill: #2a1650; stroke: #ab7df8; }
      .danger { fill: #3c1618; stroke: #f85149; }
      .arrow { stroke: #9198a1; }
      .head { fill: #9198a1; }
    }
  </style>
  <defs>

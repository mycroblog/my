<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 474" width="760" height="474" role="img" aria-labelledby="title desc">
<!-- SPDX-License-Identifier: AGPL-3.0-only -->
  <title id="title">What is lost with the KEK</title>
  <desc id="desc">A database backup is restored, but the KEK that wrapped its secrets is lost, or another one is set in its place. What is not sealed is still readable: posts, accounts, follows, and the rest of the database, and the media files in storage. The sealed values cannot be decrypted and fail with an unknown key-encryption key error: the actors' private keys, two-factor authentication secrets, client secrets of sign-in providers, webhook signing secrets, and the media proxy signing key. Without their private keys, the actors' identity is broken: other servers can no longer verify the actors' signatures.</desc>

  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .bg { fill: #ffffff; }
    .t { fill: #1f2328; font-size: 16px; }
    .b { font-weight: 600; }
    .m { fill: #59636e; font-size: 15px; }
    .h { fill: #1f2328; font-size: 17px; font-weight: 600; }
    .group { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1.5; }
    .client { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.5; }
    .proxy { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .proc { fill: #ddf4ff; stroke: #0969da; stroke-width: 2; }
    .port { fill: #ffffff; stroke: #8c959f; stroke-width: 1.5; }
    .svc { fill: #fbefff; stroke: #8250df; stroke-width: 1.5; }
    .lost { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.5; }
    .arrow { stroke: #59636e; stroke-width: 2; fill: none; }
    .head { fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .t, .h { fill: #e6edf3; }
      .m { fill: #9198a1; }
      .group { fill: #151b23; stroke: #3d444d; }
      .client { fill: #0f2d1b; stroke: #3fb950; }
      .proxy { fill: #0d1117; stroke: #9198a1; }
      .proc { fill: #0c2d6b; stroke: #4493f8; }
      .port { fill: #0d1117; stroke: #656c76; }
      .svc { fill: #2a1650; stroke: #ab7df8; }
      .lost { fill: #3c0d12; stroke: #f85149; }
      .arrow { stroke: #9198a1; }
      .head { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="760" height="474" rx="12"/>
  <rect class="port" x="20" y="16" width="350" height="80" rx="8"/>
  <text class="t b" x="195.0" y="50.0" text-anchor="middle">Database backup</text>
  <text class="m" x="195.0" y="72.0" text-anchor="middle">restored</text>
  <rect class="lost" x="390" y="16" width="350" height="80" rx="8"/>
  <text class="t b" x="565.0" y="50.0" text-anchor="middle">The KEK that wrapped its secrets</text>
  <text class="m" x="565.0" y="72.0" text-anchor="middle">lost, or another one set in its place</text>
  <path class="arrow" d="M 195 96 L 195 132" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M 250 96 L 510 132" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M 565 96 L 565 132" marker-end="url(#arrowhead)"/>
  <rect class="client" x="20" y="136" width="350" height="202" rx="12"/>
  <text class="h" x="40" y="166" text-anchor="start">Not sealed: still readable</text>
  <text class="t" x="40" y="190" text-anchor="start">posts, accounts, follows,</text>
  <text class="t" x="40" y="214" text-anchor="start">and the rest of the database</text>
  <text class="t" x="40" y="262" text-anchor="start">media files in storage</text>
  <rect class="lost" x="390" y="136" width="350" height="202" rx="12"/>
  <text class="h" x="410" y="166" text-anchor="start">Sealed: cannot be decrypted</text>
  <text class="m" x="410" y="190" text-anchor="start">error: unknown key-encryption key</text>
  <text class="t" x="410" y="226" text-anchor="start">actors' private keys</text>
  <text class="t" x="410" y="250" text-anchor="start">two-factor authentication secrets</text>
  <text class="t" x="410" y="274" text-anchor="start">client secrets of sign-in providers</text>
  <text class="t" x="410" y="298" text-anchor="start">webhook signing secrets</text>
  <text class="t" x="410" y="322" text-anchor="start">the media proxy signing key</text>
  <path class="arrow" d="M 565 338 L 565 374" marker-end="url(#arrowhead)"/>
  <rect class="lost" x="390" y="378" width="350" height="80" rx="8"/>
  <text class="t b" x="565.0" y="401.0" text-anchor="middle">Actors' identity is broken</text>
  <text class="m" x="565.0" y="423.0" text-anchor="middle">other servers can no longer</text>
  <text class="m" x="565.0" y="445.0" text-anchor="middle">verify the actors' signatures</text>
</svg>

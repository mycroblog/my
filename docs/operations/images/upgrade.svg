<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 648" width="760" height="648" role="img" aria-labelledby="title desc">
<!-- SPDX-License-Identifier: AGPL-3.0-only -->
  <title id="title">Upgrading to a new release</title>
  <desc id="desc">An upgrade from top to bottom, with what /readyz answers at each step. The previous release runs as usual and /readyz answers 200 with status ok. The server is switched to the maintenance mode with MY_MAINTENANCE=true; from then until the new release starts, /readyz answers 200 with status maintenance. Meanwhile: 1, back up the database and media; then three one-off jobs of the new release's image: 2, my db upgrade -check, which changes nothing; 3, my schema apply, after reading its -dry-run; 4, my db upgrade, which runs the data upgrade steps. 5, the new release starts without MY_MAINTENANCE; /readyz answers 200 with status ok, or 503 while a data upgrade step of its release is not recorded.</desc>

  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .bg { fill: #ffffff; }
    .t { fill: #1f2328; font-size: 16px; }
    .b { font-weight: 600; }
    .m { fill: #59636e; font-size: 15px; }
    .h { fill: #1f2328; font-size: 17px; font-weight: 600; }
    .group { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1.5; }
    .proc { fill: #ddf4ff; stroke: #0969da; stroke-width: 2; }
    .port { fill: #ffffff; stroke: #8c959f; stroke-width: 1.5; }
    .svc { fill: #fbefff; stroke: #8250df; stroke-width: 1.5; }
    .arrow { stroke: #59636e; stroke-width: 2; fill: none; }
    .rule { stroke: #59636e; stroke-width: 1.5; stroke-dasharray: 6 5; fill: none; }
    .head { fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .t, .h { fill: #e6edf3; }
      .m { fill: #9198a1; }
      .group { fill: #151b23; stroke: #3d444d; }
      .proc { fill: #0c2d6b; stroke: #4493f8; }
      .port { fill: #0d1117; stroke: #656c76; }
      .svc { fill: #2a1650; stroke: #ab7df8; }
      .arrow, .rule { stroke: #9198a1; }
      .head { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="760" height="648" rx="12"/>
  <text class="h" x="20" y="38" text-anchor="start">Step</text>
  <text class="h" x="470" y="38" text-anchor="start">/readyz answers</text>
  <rect class="group" x="20" y="288" width="400" height="270" rx="12"/>
  <text class="m" x="34" y="312" text-anchor="start">one-off jobs of the new image</text>
  <rect class="port" x="20" y="60" width="400" height="58" rx="8"/>
  <text class="t b" x="220.0" y="85.0" text-anchor="middle">Previous release</text>
  <text class="m" x="220.0" y="107.0" text-anchor="middle">running as usual</text>
  <rect class="proc" x="20" y="140" width="400" height="58" rx="8"/>
  <text class="t b" x="220.0" y="165.0" text-anchor="middle">Maintenance mode</text>
  <text class="m" x="220.0" y="187.0" text-anchor="middle">MY_MAINTENANCE=true</text>
  <path class="arrow" d="M 220.0 118 L 220.0 136" marker-end="url(#arrowhead)"/>
  <rect class="port" x="20" y="220" width="400" height="58" rx="8"/>
  <text class="t b" x="220.0" y="245.0" text-anchor="middle">1. Back up</text>
  <text class="m" x="220.0" y="267.0" text-anchor="middle">database and media</text>
  <path class="arrow" d="M 220.0 198 L 220.0 216" marker-end="url(#arrowhead)"/>
  <rect class="port" x="30" y="330" width="380" height="58" rx="8"/>
  <text class="t b" x="220.0" y="355.0" text-anchor="middle">2. my db upgrade -check</text>
  <text class="m" x="220.0" y="377.0" text-anchor="middle">changes nothing</text>
  <path class="arrow" d="M 220.0 278 L 220.0 326" marker-end="url(#arrowhead)"/>
  <rect class="port" x="30" y="410" width="380" height="58" rx="8"/>
  <text class="t b" x="220.0" y="435.0" text-anchor="middle">3. my schema apply</text>
  <text class="m" x="220.0" y="457.0" text-anchor="middle">read -dry-run first</text>
  <path class="arrow" d="M 220.0 388 L 220.0 406" marker-end="url(#arrowhead)"/>
  <rect class="port" x="30" y="490" width="380" height="58" rx="8"/>
  <text class="t b" x="220.0" y="515.0" text-anchor="middle">4. my db upgrade</text>
  <text class="m" x="220.0" y="537.0" text-anchor="middle">data upgrade steps</text>
  <path class="arrow" d="M 220.0 468 L 220.0 486" marker-end="url(#arrowhead)"/>
  <rect class="proc" x="20" y="570" width="400" height="58" rx="8"/>
  <text class="t b" x="220.0" y="595.0" text-anchor="middle">5. Start the new release</text>
  <text class="m" x="220.0" y="617.0" text-anchor="middle">without MY_MAINTENANCE</text>
  <path class="arrow" d="M 220.0 548 L 220.0 566" marker-end="url(#arrowhead)"/>
  <rect class="port" x="470" y="60" width="270" height="58" rx="8"/>
  <text class="t b" x="605.0" y="85.0" text-anchor="middle">200</text>
  <text class="m" x="605.0" y="107.0" text-anchor="middle">{"status":"ok"}</text>
  <rect class="proc" x="470" y="140" width="270" height="408" rx="8"/>
  <text class="t b" x="605.0" y="340.0" text-anchor="middle">200</text>
  <text class="m" x="605.0" y="362.0" text-anchor="middle">{"status":"maintenance"}</text>
  <rect class="proc" x="470" y="570" width="270" height="58" rx="8"/>
  <text class="t b" x="605.0" y="595.0" text-anchor="middle">200 when every step is recorded</text>
  <text class="m" x="605.0" y="617.0" text-anchor="middle">503 while one is missing</text>
  <path class="rule" d="M 422 89.0 L 468 89.0"/>
  <path class="rule" d="M 422 169.0 L 468 169.0"/>
  <path class="rule" d="M 422 599.0 L 468 599.0"/>
</svg>

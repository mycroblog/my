#
# Documentation and the repository's bookkeeping: markdownlint, the documentation rules, the ADR numbers, and that CI runs every check
# (the docs context of scripts/changed-contexts.sh).
version: "3"

vars:
  MARKDOWNLINT: bunx --bun markdownlint-cli2@0.23.2

tasks:
  check:
    desc: Run the documentation checks, markdownlint, the documentation rules, the ADR numbers, and the CI coverage of `check`, in parallel
    deps: [lint, rules, adr-numbers, ci-coverage]

  lint:
    desc: Lint Markdown files
    cmds:
      - "{{.MARKDOWNLINT}}"

  rules:
    desc: Fail when a relative link or its anchor does not resolve, an English-only document has Japanese, or an operator document points at design records (AGENTS.md "Documentation", docs/lint.yaml)
    deps: [":agentkit:build"]
    cmds:
      - bin/agentkit docs lint

  pr-impact:
    desc: 'Fail when a user or operator document that describes the paths changed since BASE is neither changed nor explained in the Documentation section of the pull request description in BODY: scripts/task.sh docs:pr-impact BODY=<file> [BASE=origin/main]'
    deps: [":agentkit:build"]
    requires:
      vars: [BODY]
    vars:
      BASE: '{{.BASE | default "origin/main"}}'
    cmds:
      - bin/agentkit docs impact --base {{shellQuote .BASE}} --pr-body {{shellQuote .BODY}}

  adr-numbers:
    desc: Fail if two files in docs/adr share a number
    cmds:
      - scripts/adr-numbers.sh

  ci-coverage:
    desc: Fail when a check of `check` runs in no step of .github/workflows and is not excluded with a reason (ADR-0079)
    cmds:
      - scripts/ci-coverage.sh

  adr-new:
    desc: 'Create a new ADR: scripts/task.sh docs:adr-new TITLE="..." [SLUG=kebab-slug]'
    requires:
      vars: [TITLE]
    cmds:
      - scripts/adr-new.sh {{shellQuote .TITLE}} {{.SLUG}}

  # The documentation site (app/docs, @my/docs; ADR-0150): Astro Starlight in the client workspace. Its package.json
  # scripts turn Astro's telemetry off, so the build needs no network beyond the package install.
  site-build:
    desc: Copy the published documents into the documentation site (app/docs) and build it into app/docs/dist as static files, with its Pagefind search index (DOCS_SITE_BASE sets the path prefix)
    deps: [":web:install"]
    dir: app/docs
    cmds:
      - bun run build

  site-dev:
    desc: Copy the published documents into the documentation site (app/docs) and start its Astro dev server on http://localhost:4321
    deps: [":web:install"]
    dir: app/docs
    cmds:
      - bun run dev

  # The translations of the site (app/docs/i18n/, ADR-0150 §9; docs/agents/translating-docs.md). An agent writes them;
  # this command lists what to translate and checks what it wrote.
  site-translations:
    desc: "Work on the translations of the documentation site (app/docs/i18n/<locale>/): `-- status [source...]` lists the sources and sections to translate, `-- todo <source>` prints the sections to translate with their markers, `-- glossary <source>` the UI terms it quotes in the locale's catalog, `-- check` checks the translations (--locale ja by default)"
    dir: app/docs
    cmds:
      - bun scripts/translations.ts {{.CLI_ARGS}}

  site-translations-check:
    desc: "Fail when a translation of the documentation site (app/docs/i18n/) is malformed: a marker that does not parse, a section that does not start with its heading, a current section whose code blocks, code spans or link targets differ from the English text, or a file that translates nothing (stale and missing sections never fail; site:check runs it)"
    dir: app/docs
    cmds:
      - bun scripts/translations.ts check

  screenshots:
    desc: Take the screenshots of the documentation site and the README (app/docs/src/assets/screenshots/*.webp) from the Showcase stories of the app/web Storybook in PLAYWRIGHT_IMAGE, light and dark (needs Docker); review and commit them
    deps: [":web:storybook-build"]
    env:
      PLAYWRIGHT_IMAGE: "{{.PLAYWRIGHT_IMAGE}}"
    cmds:
      - scripts/docs-screenshots.sh {{.CLI_ARGS}}

  site-typecheck:
    desc: Type-check the configuration of the documentation site (app/docs) with tsc (site:check runs it)
    deps: [":web:install"]
    dir: app/docs
    cmds:
      - bun run typecheck

  # web:oxlint and web:knip cover app/docs too, as part of the whole workspace; these two let the site context check
  # it without the client's generated files.
  site-lint:
    desc: Run Oxlint on the documentation site (app/docs) with the client workspace's configuration (app/.oxlintrc.json; site:check runs it)
    deps: [":web:install"]
    dir: app
    cmds:
      - bun run lint docs

  site-knip:
    desc: Find unused files, exports, and dependencies of the documentation site (app/docs) with knip (its workspace of app/knip.json; site:check runs it)
    deps: [":web:install"]
    dir: app
    cmds:
      - bun run knip --workspace docs

# SPDX-License-Identifier: AGPL-3.0-only
#
# Documentation and the repository's bookkeeping: markdownlint, the documentation rules, the ADR numbers, and that CI runs every check
# (the docs context of scripts/changed-contexts.sh).
version: "3"

vars:
  MARKDOWNLINT: bunx --bun markdownlint-cli2@0.23.2

tasks:
  check:
    desc: Run the documentation checks, markdownlint, the documentation rules, the ADR numbers, and the CI coverage of `check`, in parallel
    deps: [lint, rules, adr-numbers, ci-coverage]

  lint:
    desc: Lint Markdown files
    cmds:
      - "{{.MARKDOWNLINT}}"

  rules:
    desc: Fail when a relative link or its anchor does not resolve, an English-only document has Japanese, an operator document points at design records, or an ADR transcribes the implementation (docs/lint.yaml)
    deps: [":agentkit:build"]
    cmds:
      - bin/agentkit docs lint

  growth:
    desc: "Fail when the ADRs, the architecture, agentkit's ADRs, the context maps, or AGENTS.md / CLAUDE.md grew since the merge base with BASE (default origin/redesign-web), or a .claude document or the requirements are over their budget (ADR-0000 §6); ALLOW_GROWTH=true, the allow:docs-growth label in CI, lets the growth pass but not a budget"
    vars:
      BASE: '{{.BASE | default "origin/redesign-web"}}'
    cmds:
      - scripts/docs-growth.sh --base {{shellQuote .BASE}}{{if eq (.ALLOW_GROWTH | default "") "true"}} --allow-growth{{end}}

  adr-numbers:
    desc: Fail if two files in docs/adr share a number
    cmds:
      - scripts/adr-numbers.sh

  # A branch is rebased onto its base, never merged into (agentkit pr open refuses the same commits). The merge
  # queue's own merge commits are on the trunk, outside BASE..HEAD of a pull request.
  pr-commits:
    desc: 'Fail when BASE..HEAD holds a merge commit: scripts/task.sh docs:pr-commits [BASE=origin/redesign-web] [HEAD=HEAD]'
    vars:
      BASE: '{{.BASE | default "origin/redesign-web"}}'
      HEAD: '{{.HEAD | default "HEAD"}}'
    cmds:
      - |
        merges="$(git log --min-parents=2 --format='%h %s' {{shellQuote .BASE}}..{{shellQuote .HEAD}})"
        if [ -n "$merges" ]; then
          printf '%s..%s has merge commits; a branch is rebased, never merged into:\n%s\nfix: git rebase origin/redesign-web && scripts/agentkit.sh regen && git push --force-with-lease\n' {{shellQuote .BASE}} {{shellQuote .HEAD}} "$merges" >&2
          exit 1
        fi

  ci-coverage:
    desc: Fail when a check of `check` runs in no step of .github/workflows and is not excluded with a reason (ADR-0079)
    cmds:
      - scripts/ci-coverage.sh

  adr-new:
    desc: 'Create a new ADR: scripts/task.sh docs:adr-new TITLE="..." [SLUG=kebab-slug]'
    requires:
      vars: [TITLE]
    cmds:
      - scripts/adr-new.sh {{shellQuote .TITLE}} {{.SLUG}}

  # The documentation site (web/docs, @my/docs; ADR-0150): Astro Starlight in the Bun workspace. Its package.json
  # scripts turn Astro's telemetry off, so the build needs no network beyond the package install.
  site-build:
    desc: Copy the published documents into the documentation site (web/docs) and build it into web/docs/dist as static files, with its Pagefind search index (DOCS_SITE_BASE sets the path prefix)
    deps: [":web:install"]
    dir: web/docs
    cmds:
      - bun run build

  # The combined build of a deploy before any release (/next/ and the root), which also checks what the site tells
  # search engines; a Preview's build (build-preview) checks its own noindex.
  site-index-check:
    desc: "Build the documentation site as the deploy combines it, from this checkout alone (/next/ and the root, as before the first release), and fail when its robots.txt, root sitemap, noindex and canonical links, meta descriptions, or Open Graph tags are missing or wrong (site:check runs it)"
    deps: [":web:install"]
    env:
      DOCS_SITE_RELEASES: /dev/null
    cmds:
      - scripts/docs-site.sh build .tmp/docs-site/check

  site-dev:
    desc: Copy the published documents into the documentation site (web/docs) and start its Astro dev server on http://localhost:4321
    deps: [":web:install"]
    dir: web/docs
    cmds:
      - bun run dev

  # The translations of the site (web/docs/i18n/, ADR-0150 §9; .claude/skills/translate-docs). An agent writes them;
  # this command lists what to translate and checks what it wrote.
  site-translations:
    desc: "Work on the translations of the documentation site (web/docs/i18n/<locale>/): `-- status [source...]` lists the sources and sections to translate, `-- todo <source>` prints the sections to translate with their markers, `-- glossary <source>` the UI terms it quotes in the locale's catalog, `-- check` checks the translations (--locale ja by default)"
    dir: web/docs
    cmds:
      - bun scripts/translations.ts {{.CLI_ARGS}}

  site-translations-check:
    desc: "Fail when a translation of the documentation site (web/docs/i18n/) is malformed: a marker that does not parse, a section that does not start with its heading, a current section whose code blocks, code spans or link targets differ from the English text, or a file that translates nothing (stale and missing sections never fail; site:check runs it)"
    dir: web/docs
    cmds:
      - bun scripts/translations.ts check

  site-typecheck:
    desc: Type-check the configuration of the documentation site (web/docs) with tsc (site:check runs it)
    deps: [":web:install"]
    dir: web/docs
    cmds:
      - bun run typecheck

  site-test:
    desc: Run the unit tests of the documentation site (web/docs) with bun test (site:check runs it)
    deps: [":web:install"]
    dir: web/docs
    cmds:
      - bun run test

  site-lint:
    desc: Run Oxlint on the documentation site (web/docs) with the workspace's configuration (.oxlintrc.json; site:check runs it)
    deps: [":web:install"]
    cmds:
      - bun --bun oxlint web/docs

  site-knip:
    desc: Find unused files, exports, and dependencies of the documentation site (web/docs) with knip (its workspace of knip.json; site:check runs it)
    deps: [":web:install"]
    cmds:
      - bun --bun knip --workspace web/docs

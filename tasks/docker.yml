#
# The container image and the deployments (ADR-0010; the docker context of scripts/changed-contexts.sh).
version: "3"

vars:
  VERSION:
    sh: '{{if .VERSION}}echo {{shellQuote .VERSION}}{{else}}git describe --tags --always --dirty 2>/dev/null || echo dev{{end}}'

tasks:
  check:
    desc: Run the offline container image checks
    deps: [dockerfile-check]

  dockerfile-check:
    desc: Fail if the Dockerfile's Go, Node.js, or Bun image differs from the version in .tool-versions
    silent: true
    cmds:
      - |
        status=0
        for pair in GO_IMAGE:golang:golang NODE_IMAGE:node:nodejs BUN_IMAGE:oven/bun:bun; do
          arg="${pair%%:*}"; rest="${pair#*:}"; image="${rest%:*}"; tool="${rest##*:}"
          want="$image:$(awk -v t="$tool" '$1 == t { print $2 }' .tool-versions)-"
          grep -q "^ARG $arg=$want" Dockerfile || { echo "Dockerfile: $arg must start with $want" >&2; status=1; }
        done
        exit "$status"

  build:
    desc: Build the server image my:VERSION for the local platform (GO_TAGS as in go:bin)
    cmds:
      - docker build --build-arg VERSION={{.VERSION}} --build-arg GO_TAGS={{.GO_TAGS}} -t my:{{.VERSION}} .

  # The smoke test covers linux/amd64. The Go server cross-builds with CGO_ENABLED=0, so only a change to the Dockerfile
  # or the deployments makes the arm64 images differ (ADR-0010): CI builds them in the slow suite alone (ADR-0079).
  build-arm64:
    desc: Build both images (schema, app) for linux/arm64 (needs an arm64 host or QEMU)
    cmds:
      - docker build --platform linux/arm64 --target schema .
      - docker build --platform linux/arm64 --target app .

  smoke:
    desc: Start deploy/docker/compose.yaml, create an admin, check WebFinger / Actor / NodeInfo, tear down
    env:
      MY_VERSION: "{{.VERSION}}"
    cmds:
      - scripts/docker-smoke.sh

  mailpit:
    desc: Create the certificate of the development Mailpit and start it (deploy/docker/mailpit; SMTP on 127.0.0.1:1025, UI on http://127.0.0.1:8025)
    cmds:
      - scripts/mailpit-cert.sh
      - docker compose -f deploy/docker/mailpit/compose.yaml up -d --wait

  # Not part of `check`: it pulls Mastodon, GoToSocial, and Misskey and takes minutes (CI job federation-live, in the slow suite).
  federation-live:
    desc: Run the live interoperability scenarios against Mastodon, GoToSocial, and Misskey (deploy/docker/federation-live)
    env:
      MY_VERSION: "{{.VERSION}}"
    cmds:
      - scripts/federation-live.sh {{.FEDERATION_LIVE_FLAGS}}

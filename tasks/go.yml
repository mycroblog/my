# SPDX-License-Identifier: AGPL-3.0-only
#
# The Go server module (the go context of scripts/changed-contexts.sh): its checks, the sqlc code, the generated
# tables, and bin/my. `./...` covers the root module only; the nested tools/ and tools/agentkit modules are excluded.
version: "3"

vars:
  # Go tools (go-licenses, sqlc, oapi-codegen, go-task) are pinned with `tool` directives in tools/go.mod,
  # kept apart from the product module so their dependencies never affect ours.
  GO_TOOL: go tool -modfile=tools/go.mod
  # The PostgreSQL tests whose result can differ between pgmem and a real server (ADR-0015 §3): pgmem is PostgreSQL
  # itself, so the SQL of the repository contracts is already checked on it, and a container adds only the connection
  # over the network and its pool (Acquire*, OpenSQL*, Ready), Atlas against a real server (ApplySchema*), the
  # isolation, locks, and deadlocks between connections (TransactionsAreReadCommitted, RetriesDeadlocks, *Lock*,
  # TxReads*, UnitOfWorkContract, RejectsForeignTransactions), the planner (AccountSearchUsesTermIndex), the size of a
  # real database (DatabaseSizerContract), SKIP LOCKED and LISTEN/NOTIFY of the queue, the key-value store, and the
  # stream (TestPostgres* of kv/db and queue/db, every test of stream/postgres).
  POSTGRES_CONTAINER_PACKAGES: ./cmd/my/ ./internal/adapter/db/postgres/... ./internal/adapter/kv/db/ ./internal/adapter/queue/db/ ./internal/adapter/stream/postgres/
  POSTGRES_CONTAINER_TESTS: ^Test(Acquire|OpenSQL|Ready|ApplySchema|TransactionsAreReadCommitted|RetriesDeadlocks|AccountRestrictionsLock|TokenGrantsLock|TxReads|UnitOfWorkContract|RejectsForeignTransactions|AccountSearchUsesTermIndex|DatabaseSizerContract|Postgres|Stream|NewRejectsBadOptions|ListenURL)
  # The AI crawlers that /robots.txt names (ADR-0057), from ai-robots-txt/ai.robots.txt (MIT). To
  # update the list, change both to a newer commit, run go:ai-crawlers, and review the diff.
  AI_ROBOTS_COMMIT: a446ec974c221a133cb21cb96f30c4585b208998
  AI_ROBOTS_SHA256: b9dc1b13171c3440cd41a51ab9ac3f998b00e30b5987c4bdbecad4f8a21bc99e

tasks:
  # go:vet and go:test compile every package, so `check` needs no build of its own; CI builds first (go:build), so that
  # the checks after it read the build cache.
  check:
    desc: Run all offline Go checks in parallel
    deps: [mod-check, shard-check, vet, lint, test-sleep, test, fakes-check, licenses, sqlc-check]

  mod-check:
    desc: Fail if go.mod/go.sum (and those of tools and tools/buf) are not tidy, or go.work does not load or lists the wrong modules
    cmds:
      - go mod tidy -diff
      - cd tools && go mod tidy -diff
      - cd tools/buf && go mod tidy -diff
      - scripts/go-work-check.sh

  fmt-check:
    desc: Fail if a Go file of the server module is not gofmt-formatted
    cmds:
      - |
        files="$(git ls-files -co --exclude-standard -- '*.go' ':!:tools/**' | xargs -r gofmt -l)"
        if [ -n "$files" ]; then printf 'not gofmt-formatted (run gofmt -w):\n%s\n' "$files" >&2; exit 1; fi

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  # The shards (scripts/go-shard.sh) are for CI, which gives each a runner: golangci-lint and `go test` use every core.
  shard-check:
    desc: Fail if a package of the server module is in no shard of scripts/go-shard.sh, which no CI job would then test or lint
    cmds:
      - scripts/go-shard.sh --check

  # The benchmarker of test/bench (#3183), run by hand: no check, CI job or gate runs it.
  bench:
    desc: Measure the server under concurrent clients on SQLite or PostgreSQL and capture where the time goes (test/bench; CLI_ARGS go to `bench run`, such as -db sqlite,postgres -data large -cores 0-3)
    cmds:
      - go run ./test/bench run {{.CLI_ARGS}}

  # The measurement of a media node of voice = sfu (ADR-0101 §16), run by hand: no check, CI job or gate runs it.
  voice-sfu-measure:
    desc: Measure the memory and CPU of a voice = sfu media node on loopback, its simulated clients in a child process (about three minutes), and its forward path per packet
    env:
      TEST_VOICE_SFU_MEASURE: "1"
    cmds:
      - go test -count=1 -v -run '^TestMeasureCost$' -bench '^BenchmarkForward$' -benchmem ./internal/adapter/voice/sfu/node/

  lint:
    desc: Run golangci-lint (includes the depguard architecture boundaries) on the server module, or on its shard SHARD (scripts/go-shard.sh)
    vars:
      PACKAGES:
        sh: '{{if .SHARD}}scripts/go-shard.sh {{shellQuote .SHARD}}{{else}}echo ./...{{end}}'
    cmds:
      # golangci-lint holds a lock while it runs: wait for it rather than fail beside go:lint or agentkit:lint.
      - golangci-lint run --allow-serial-runners {{.PACKAGES}}

  # The Go tests of every module, not of the server alone. CI passes the pull request's base (BASE=HEAD^1).
  test-sleep:
    desc: Refuse time.Sleep in the Go tests beyond its baseline, which may only shrink since the merge base with BASE (default origin/main) (scripts/go-test-sleep.sh)
    vars:
      BASE: '{{.BASE | default "origin/main"}}'
    cmds:
      - scripts/go-test-sleep.sh --base {{shellQuote .BASE}}

  test:
    desc: Run the Go tests of the server module, or of its shard SHARD (scripts/go-shard.sh); the PostgreSQL tests run on pgmem (ADR-0015)
    vars:
      PACKAGES:
        sh: '{{if .SHARD}}scripts/go-shard.sh {{shellQuote .SHARD}}{{else}}echo ./...{{end}}'
    cmds:
      - go test {{.PACKAGES}}

  test-postgres:
    desc: Run the PostgreSQL tests whose result can differ from pgmem on a postgres container (needs Docker; CI in the slow suite, and in the merge queue when the PostgreSQL adapters change)
    env:
      TEST_POSTGRES: container
      TEST_POSTGRES_REQUIRED: "1"
    cmds:
      - go test -count=1 -run '{{.POSTGRES_CONTAINER_TESTS}}' {{.POSTGRES_CONTAINER_PACKAGES}}

  test-stream:
    desc: Run the stream.Bus contracts on broker containers instead of the in-process fakes (Valkey; Floci for SNS / SQS; the Pub/Sub emulator) (needs Docker; CI in the slow suite)
    env:
      TEST_STREAM: container
      TEST_VALKEY_REQUIRED: "1"
      TEST_AWS: container
      TEST_AWS_REQUIRED: "1"
      TEST_PUBSUB_REQUIRED: "1"
    cmds:
      - go test -count=1 ./internal/adapter/stream/...

  test-mail:
    desc: Run the mail = smtp integration tests on Mailpit containers (pkg/testkit/mailpittest) (needs Docker; CI in the slow suite)
    env:
      TEST_MAIL: container
    cmds:
      - go test -count=1 -run Mailpit ./internal/adapter/mail/smtp/ ./internal/platform/

  test-blob:
    desc: Run the BlobStore contract of blob = s3 on a Garage container (pkg/testkit/s3test), an S3-compatible server, instead of only the in-memory fake (needs Docker; CI in the slow suite)
    env:
      TEST_S3: container
    cmds:
      - go test -count=1 -run S3Server ./internal/adapter/blob/s3/

  test-acme:
    desc: Run the instance.ACMEClient contract of the ACME adapter and the server with tls = acme (-run Pebble in internal/adapter/acme and internal/platform) against Pebble, Let's Encrypt's test CA, run as a Go tool from tools/go.mod (pkg/testkit/pebbletest) (CI in the slow suite, and in the merge queue when the ACME code changes)
    env:
      TEST_ACME: pebble
    cmds:
      - go test -count=1 -run Pebble ./internal/adapter/acme/ ./internal/platform/

  test-search:
    desc: Run the search.Index contract of each search backend (-run SearchServer in internal/adapter/search) on a container of its engine, which go:test skips (needs Docker; CI in the slow suite)
    env:
      TEST_SEARCH: container
    cmds:
      - go test -count=1 -run SearchServer ./internal/adapter/search/...

  tools:
    desc: Build the Go tools of tools/go.mod and tools/buf/go.mod (sqlc, oapi-codegen, buf, ...) once, so that the checks of a CI job that run them do not each build them
    cmds:
      - go build -modfile=tools/go.mod tool
      - go build -modfile=tools/buf/go.mod tool

  build:
    desc: Build all packages statically (CGO_ENABLED=0)
    env:
      CGO_ENABLED: "0"
    cmds:
      - go build ./...

  # The fakes of the test build (ADR-0015 §6): one that records payments as paid must never reach a released binary.
  # It reads the packages cmd/my depends on (`go list -deps`) and builds nothing.
  fakes-check:
    desc: Fail when cmd/my without the build tag e2e_fakes depends on a fake or on a package only tests may link, or when cmd/my with e2e_fakes lacks a fake (scripts/go-fakes.sh)
    cmds:
      - scripts/go-fakes.sh

  # Not part of `check`: it compiles the test build's packages and their tests (CI in the slow suite).
  fakes-test:
    desc: Run go vet on the test build (the build tag e2e_fakes) and the tests that only it has, named *E2EFakes* (scripts/go-fakes.sh test)
    cmds:
      - scripts/go-fakes.sh test

  licenses:
    desc: Fail on dependency licenses incompatible with AGPL-3.0
    cmds:
      - "{{.GO_TOOL}} go-licenses check --allowed_licenses={{.GO_ALLOWED_LICENSES}} ./..."

  # The test build keeps the paths (no -trimpath): -trimpath is part of every package's key in the build cache, so a
  # build with it reads nothing of what the checks built, and compiles the whole server (ADR-0079 §7). A test build is
  # never released, so its paths reach no one.
  bin:
    desc: Build bin/my with the build of web:build embedded and the version from git (VERSION=v1.2.3 overrides; GO_TAGS passes build tags; GO_TAGS=e2e_fakes makes the test build, never to be released)
    deps: [":web:build"]
    vars:
      VERSION:
        sh: '{{if .VERSION}}echo {{shellQuote .VERSION}}{{else}}git describe --tags --match "v[0-9]*" --always --dirty 2>/dev/null || echo dev{{end}}'
      TRIMPATH: '{{if contains "e2e_fakes" .GO_TAGS}}{{else}}-trimpath{{end}}'
    env:
      CGO_ENABLED: "0"
    cmds:
      - go build {{.TRIMPATH}} -tags "{{.GO_TAGS}}" -ldflags "-X main.version={{.VERSION}}" -o bin/my ./cmd/my

  config-docs:
    desc: Regenerate docs/reference/configuration.md, deploy/docker/example.env, and the settings list of the OpenTofu modules from the config schema (go:test fails when they are stale)
    sources: ["internal/platform/config/**/*.go"]
    generates: [docs/reference/configuration.md, deploy/docker/example.env, deploy/opentofu/modules/internal/settings/settings.json]
    cmds:
      - go test ./internal/platform/config -run '^Test(Reference|ExampleEnv|SettingsJSON)UpToDate$' -update

  cli-docs:
    desc: Regenerate docs/reference/cli.md from the commands of cmd/my (go:test fails when it is stale)
    sources: ["cmd/my/*.go", "internal/platform/docsite/*.go"]
    generates: [docs/reference/cli.md]
    # cmd/my imports the sqlc packages, which sqlc rewrites: build it only after they are written.
    deps: [sqlc]
    cmds:
      - go test ./cmd/my -run '^TestCLIReferenceUpToDate$' -update

  sqlc:
    desc: Regenerate Go code from sqlc.yaml with the pinned sqlc (ADR-0003)
    # It empties its output directories before writing them: every caller in one run waits for the same run.
    run: once
    sources:
      - sqlc.yaml
      - "queries/**/*.sql"
      - "schema/*/*.sql"
      - scripts/sqlc.sh
      - tools/go.mod
    generates:
      - internal/adapter/db/sqlite/*gen/*.go
      - internal/adapter/db/postgres/*gen/*.go
      - internal/adapter/queue/db/internal/sqlitequeue/*.go
      - internal/adapter/queue/db/internal/postgresqueue/*.go
      - internal/adapter/kv/db/internal/sqlitekv/*.go
      - internal/adapter/kv/db/internal/postgreskv/*.go
    cmds:
      - scripts/sqlc.sh

  sqlc-check:
    desc: Fail if the committed sqlc-generated code is stale
    cmds:
      - scripts/sqlc.sh --check

  ai-crawlers:
    desc: Regenerate internal/interface/web/ai_crawlers.gen.go from ai.robots.txt's robots.json (AI_ROBOTS_COMMIT)
    vars:
      FILE: .tmp/ai-robots-{{.AI_ROBOTS_COMMIT}}.json
    cmds:
      - mkdir -p .tmp
      - curl -fsSL -o {{.FILE}} https://raw.githubusercontent.com/ai-robots-txt/ai.robots.txt/{{.AI_ROBOTS_COMMIT}}/robots.json
      - echo "{{.AI_ROBOTS_SHA256}}  {{.FILE}}" | sha256sum -c -
      - go run ./scripts/ai-crawlers -in {{.FILE}} -commit {{.AI_ROBOTS_COMMIT}} -out internal/interface/web/ai_crawlers.gen.go

#
# The server's table of Unicode emoji, generated from a pinned emoji-test.txt that the repository does not hold
# (ADR-0051 §6). Not part of `check` or `generate`: run it by hand after changing EMOJI_VERSION, and commit what it
# writes.
version: "3"

vars:
  # The Unicode emoji that emoji reactions accept and normalize: emoji-test.txt of
  # https://www.unicode.org/Public/<EMOJI_VERSION>/emoji/.
  EMOJI_VERSION: 18.0.0
  EMOJI_TEST_SHA256: 8f3735cda1f92a779d78af67cf86066bb1f07143dc22f2ac29394d9bc57ab21a

tasks:
  generate:
    desc: Regenerate the server's emoji table from emoji-test.txt (EMOJI_VERSION)
    deps: [emoji-test]
    cmds:
      - >-
        go run ./scripts/emoji-table
        -in .tmp/emoji/emoji-test-{{.EMOJI_VERSION}}.txt -version {{.EMOJI_VERSION}}
        -out internal/domain/content/emoji_table.gen.go

  # The download prints the digest it got when it differs from the pinned one, for a version update.
  emoji-test:
    internal: true
    vars:
      FILE: .tmp/emoji/emoji-test-{{.EMOJI_VERSION}}.txt
    cmds:
      - mkdir -p .tmp/emoji
      - curl -fsSL -o {{.FILE}} https://www.unicode.org/Public/{{.EMOJI_VERSION}}/emoji/emoji-test.txt
      - |
        if ! echo "{{.EMOJI_TEST_SHA256}}  {{.FILE}}" | sha256sum -c -; then
          echo "the digest of {{.FILE}} differs from EMOJI_TEST_SHA256; it is:" >&2
          sha256sum {{.FILE}} >&2
          exit 1
        fi

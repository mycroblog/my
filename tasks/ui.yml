#
# @my/ui in app/ui (ADR-0110; the ui context of scripts/changed-contexts.sh): its checks, Storybook, and the story
# tests. The story tests run every story in Chromium (Vitest browser mode, Playwright): axe must find no violation
# and each story must match its screenshots at 3 container widths × light / dark × LTR / RTL. They need a browser,
# so they are not part of `check`; CI runs ui:test in PLAYWRIGHT_IMAGE on every PR. Baselines
# (app/ui/src/__screenshots__/) come only from that image: ui:snapshots-update. Its dependent app/web is web:check.
# The tasks that read app/ui/src/themeTokens.gen.ts, which is not committed (ADR-0081), generate it first.
version: "3"

tasks:
  check:
    desc: Run the offline checks of app/ui (@my/ui) in parallel; its dependent app/web is web:check
    deps: [typecheck, unit-test]

  typecheck:
    desc: Type-check app/ui with tsc (incremental, node_modules/.cache/tsc)
    deps: [":web:tokens-gen-ts"]
    dir: app/ui
    cmds:
      - bun run typecheck

  unit-test:
    desc: Run the app/ui unit tests with Vitest (jsdom); the story tests are ui:test
    deps: [":web:tokens-gen-ts"]
    dir: app/ui
    cmds:
      - bun run test:unit

  storybook:
    desc: Start the @my/ui Storybook on http://localhost:6006
    deps: [":web:tokens-gen-ts"]
    dir: app/ui
    cmds:
      - bun run storybook

  storybook-build:
    desc: Build the static @my/ui Storybook into app/ui/storybook-static
    deps: [":web:tokens-gen-ts"]
    dir: app/ui
    cmds:
      - bun run build-storybook

  test:
    desc: Run the @my/ui story tests (axe + screenshots) in Chromium; screenshots match only in PLAYWRIGHT_IMAGE
    deps: [":web:tokens-gen-ts"]
    dir: app/ui
    cmds:
      - bun run test

  test-install:
    desc: Download the Chromium that ui:test uses (local runs only)
    deps: [":web:install"]
    dir: app/ui
    cmds:
      - bun run playwright install chromium

  test-docker:
    desc: Run the @my/ui story tests in PLAYWRIGHT_IMAGE, as CI does (needs Docker)
    deps: [":web:tokens-gen-ts"]
    env:
      PLAYWRIGHT_IMAGE: "{{.PLAYWRIGHT_IMAGE}}"
    cmds:
      - scripts/ui-test-docker.sh

  snapshots-update:
    desc: Regenerate the @my/ui screenshot baselines in PLAYWRIGHT_IMAGE (needs Docker); review and commit them
    deps: [":web:tokens-gen-ts"]
    env:
      PLAYWRIGHT_IMAGE: "{{.PLAYWRIGHT_IMAGE}}"
    cmds:
      - scripts/ui-test-docker.sh --update

# SPDX-License-Identifier: AGPL-3.0-only
#
# The database schema (ADR-0023; the schema context of scripts/changed-contexts.sh): db:apply, db:diff and
# db:reset apply it with `my schema apply` of the working tree, as deployments do; db:check verifies the result, and
# db:lint and db:lint-test check changes, with Atlas Community Edition, pinned and checksum-verified by
# scripts/install-atlas.sh; db:up runs the dev PostgreSQL container, the service postgres of the root compose.yaml.
# Pick the dialect with DB_DIALECT and point DB_URL / DB_DEV_URL elsewhere to override the defaults.
version: "3"

vars:
  ATLAS: bin/atlas
  DB_DIALECT: '{{.DB_DIALECT | default "sqlite"}}'
  PG_CONTAINER: '{{.PG_CONTAINER | default "my-postgres"}}'
  # Empty uses the pinned image of the root compose.yaml.
  PG_IMAGE: '{{.PG_IMAGE}}'
  PG_PORT: '{{.PG_PORT | default "5432"}}'
  # The target database, as an Atlas URL. PostgreSQL URLs are schema-scoped: Atlas manages only the `public` schema.
  DB_URL: >-
    {{if .DB_URL}}{{.DB_URL}}{{else if eq .DB_DIALECT "postgres"}}postgres://my:my@localhost:{{.PG_PORT}}/my?sslmode=disable&search_path=public{{else}}sqlite://my.db{{end}}
  # Atlas's dev database, for db:check's `atlas schema diff`.
  DB_DEV_URL: >-
    {{if .DB_DEV_URL}}{{.DB_DEV_URL}}{{else if eq .DB_DIALECT "postgres"}}postgres://my:my@localhost:{{.PG_PORT}}/my_dev?sslmode=disable&search_path=public{{else}}sqlite://dev?mode=memory{{end}}
  # `my schema apply` of the working tree on DB_URL as its `database_url` (a file path for SQLite). It builds the
  # desired schema in memory (SQLite) or in a temporary schema of the target database (PostgreSQL), which also gets
  # the bootstrap SQL from it.
  MY: bin/my-schema-apply
  MY_ENV: >-
    MY_CONFIG= MY_DATABASE={{shellQuote .DB_DIALECT}} MY_DATABASE_URL={{shellQuote (trimPrefix "sqlite://" .DB_URL)}}
  # db:lint's dev database, apart from DB_DEV_URL so that db:lint and db:check can run at once.
  DB_LINT_DEV_URL: >-
    {{if .DB_LINT_DEV_URL}}{{.DB_LINT_DEV_URL}}{{else if eq .DB_DIALECT "postgres"}}postgres://my:my@localhost:{{.PG_PORT}}/my_lint?sslmode=disable&search_path=public{{else}}sqlite://lint?mode=memory{{end}}

tasks:
  check:
    desc: Reset DB_URL, apply the DB_DIALECT schema with my schema apply, and fail if Atlas finds any diff left
    # Atlas reads the dialect's file of every module, copied in name order into one directory (scripts/schema-files.sh,
    # ADR-0081 §8).
    deps: [reset]
    cmds:
      - |
        dir="$(mktemp -d)" && trap 'rm -rf "$dir"' EXIT
        scripts/schema-files.sh '{{.DB_DIALECT}}' "$dir"
        diff="$({{.ATLAS}} schema diff --from '{{.DB_URL}}' --to "file://$dir" --dev-url '{{.DB_DEV_URL}}' --format '{{"{{"}} sql . {{"}}"}}')"
        if [ -n "$diff" ]; then printf 'schema diff is not empty after apply:\n%s\n' "$diff" >&2; exit 1; fi
      - "echo '{{.DB_DIALECT}}: schema applies cleanly and leaves no diff'"

  check-all:
    desc: Run db:check for SQLite and, on the db:up container, PostgreSQL (needs Docker)
    # In processes of their own: the dialect's variables (DB_URL, ...) derive from DB_DIALECT, and variables passed to
    # a task do not reach its dependencies. The container's variables are passed on, so the PostgreSQL check runs on
    # the container db:up started.
    cmds:
      - DB_DIALECT=sqlite scripts/task.sh db:check
      - task: up
      - >-
        DB_DIALECT=postgres PG_CONTAINER={{shellQuote .PG_CONTAINER}} PG_PORT={{shellQuote .PG_PORT}}
        PG_IMAGE={{shellQuote .PG_IMAGE}} scripts/task.sh db:check

  atlas:
    desc: Install the pinned Atlas Community Edition into bin/atlas
    run: once
    sources: [scripts/install-atlas.sh]
    generates: ["{{.ATLAS}}"]
    cmds:
      - scripts/install-atlas.sh {{.ATLAS}}

  up:
    desc: Start the dev PostgreSQL container (database `my`, and `my_dev` and `my_lint` for Atlas, bootstrapped)
    silent: true
    # The service alone (--no-deps): deploy/dev/postgres-init.sh creates and bootstraps the dev databases on a new volume.
    cmds:
      - >-
        PG_CONTAINER={{shellQuote .PG_CONTAINER}} PG_PORT={{shellQuote .PG_PORT}} PG_IMAGE={{shellQuote .PG_IMAGE}}
        docker compose up -d --wait --no-deps postgres
      - echo "PostgreSQL is up in container {{.PG_CONTAINER}} on localhost:{{.PG_PORT}}"

  down:
    desc: Remove the dev PostgreSQL container and its data
    cmds:
      - PG_CONTAINER={{shellQuote .PG_CONTAINER}} docker compose rm -sf postgres
      - docker volume rm -f my-dev_postgres

  my:
    desc: Build the working tree's my into bin/my-schema-apply for db:apply and db:diff (without the web client)
    internal: true
    run: once
    cmds:
      - go build -o {{.MY}} ./cmd/my

  apply:
    desc: Apply the DB_DIALECT schema to DB_URL with my schema apply (DB_DIALECT=sqlite|postgres; ALLOW_DESTRUCTIVE=true)
    preconditions: &dialect
      - sh: case '{{.DB_DIALECT}}' in sqlite|postgres) true;; *) false;; esac
        msg: DB_DIALECT must be sqlite or postgres, got "{{.DB_DIALECT}}"
    cmds:
      - task: my
      - '{{.MY_ENV}} {{.MY}} schema apply{{if eq (.ALLOW_DESTRUCTIVE | default "") "true"}} -allow-destructive{{end}}'

  diff:
    desc: Print the SQL that would bring DB_URL to the DB_DIALECT schema (my schema apply -dry-run)
    deps: [my]
    preconditions: *dialect
    cmds:
      - "{{.MY_ENV}} {{.MY}} schema apply -dry-run"

  reset:
    desc: Drop everything in DB_URL with atlas schema clean, then db:apply (destroys data)
    deps: [atlas]
    preconditions: *dialect
    cmds:
      - "{{.ATLAS}} schema clean --url '{{.DB_URL}}' --auto-approve"
      - task: apply

  lint:
    desc: Fail on a change of the DB_DIALECT schema since BASE (default origin/main) that can lose or rewrite data
    # scripts/db-lint.sh. PostgreSQL needs the db:up container (its my_lint database) or DB_LINT_DEV_URL.
    # ALLOW_DESTRUCTIVE=true reports destructive changes without failing on them; the change must still apply. CI sets
    # it from the db:destructive label on pull requests, and always in the merge queue.
    deps: [atlas]
    preconditions: *dialect
    vars:
      BASE: '{{.BASE | default "origin/main"}}'
    cmds:
      - >-
        scripts/db-lint.sh --dialect '{{.DB_DIALECT}}' --dev-url '{{.DB_LINT_DEV_URL}}' --base {{shellQuote .BASE}}
        --atlas '{{.ATLAS}}'{{if eq (.ALLOW_DESTRUCTIVE | default "") "true"}} --allow-destructive{{end}}

  lint-test:
    desc: Test db:lint on the fixtures of schema/testdata/lint/<DB_DIALECT>/ (PostgreSQL needs the db:up container)
    deps: [atlas]
    preconditions: *dialect
    cmds:
      - scripts/db-lint-test.sh --dialect '{{.DB_DIALECT}}' --dev-url '{{.DB_LINT_DEV_URL}}' --atlas '{{.ATLAS}}'

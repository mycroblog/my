#
# The OpenTofu modules of deploy/opentofu (ADR-0010; the tofu context of scripts/changed-contexts.sh). Nothing here
# reaches a cloud: init downloads the providers, validate reads the configuration, and the tests mock the providers.
version: "3"

vars:
  TOFU_DIRS:
    sh: printf '%s\n' deploy/opentofu/modules/* | tr '\n' ' '
  # One copy of the providers for every directory: each is over 100 MB.
  TF_PLUGIN_CACHE_DIR: "{{.ROOT_DIR}}/.tmp/tofu-plugins"

env:
  TF_PLUGIN_CACHE_DIR: "{{.TF_PLUGIN_CACHE_DIR}}"
  TF_IN_AUTOMATION: "1"

tasks:
  check:
    desc: Run the checks of deploy/opentofu (needs tofu)
    cmds:
      - task: fmt-check
      - task: env-check
      - task: sources
      - task: validate
      - task: test
      - task: example-test
      - task: git-source-test
      - task: state-test
      - task: db-state-test
      - task: aws-plan-test

  fmt-check:
    desc: Fail when the files of deploy/opentofu are not formatted as tofu fmt does
    cmds:
      - tofu fmt -check -recursive -diff deploy/opentofu

  env-check:
    desc: Fail when deploy/opentofu or its guide names a MY_ variable that the configuration does not have
    cmds:
      - scripts/tofu-env-check.sh deploy/opentofu docs/operations/deploy-cloud-run.md

  init:
    internal: true
    cmds:
      - mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - for: { var: TOFU_DIRS, as: DIR }
        cmd: tofu -chdir={{.DIR}} init -backend=false -input=false >/dev/null

  validate:
    desc: Run tofu validate on each module of deploy/opentofu
    deps: [init]
    cmds:
      - for: { var: TOFU_DIRS, as: DIR }
        cmd: tofu -chdir={{.DIR}} validate

  test:
    desc: Run the tests of deploy/opentofu, on mocked providers
    deps: [init]
    cmds:
      - for: [deploy/opentofu/modules/app-aws-ecs, deploy/opentofu/modules/app-aws-lambda, deploy/opentofu/modules/app-gcp-cloud-run, deploy/opentofu/modules/db-aws-rds, deploy/opentofu/modules/db-external, deploy/opentofu/modules/db-gcp-cloud-sql, deploy/opentofu/modules/db-neon, deploy/opentofu/modules/ingress-aws-alb, deploy/opentofu/modules/ingress-aws-cloudfront, deploy/opentofu/modules/ingress-cloudflare-app, deploy/opentofu/modules/ingress-cloudflare-media, deploy/opentofu/modules/kek-aws-kms, deploy/opentofu/modules/kek-aws-secrets-manager, deploy/opentofu/modules/mail-aws-ses, deploy/opentofu/modules/mail-smtp, deploy/opentofu/modules/queue-aws-sqs, deploy/opentofu/modules/queue-db, deploy/opentofu/modules/queue-gcp-cloud-tasks, deploy/opentofu/modules/secrets-aws-secrets-manager, deploy/opentofu/modules/secrets-gcp-secret-manager, deploy/opentofu/modules/stream-aws-sns]
        cmd: tofu -chdir={{.ITEM}} test

  state-test:
    desc: Prove against a local stub of Secret Manager that generated secrets have the right formats and reach neither the plan nor the state
    cmds:
      - mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - scripts/tofu-state-test.sh

  db-state-test:
    desc: Prove against a local stub of Cloud SQL and Secret Manager that a generated database password reaches the user and the URL secret, and neither the plan nor the state
    cmds:
      - mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - scripts/tofu-db-state-test.sh

  aws-plan-test:
    desc: Prove with a plan that makes no call that the AWS modules hold no generated value in the plan
    cmds:
      - mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - scripts/tofu-aws-plan-test.sh

  sources:
    desc: Fail when an example or a document of deploy/opentofu has a relative module source, or a ref other than MODULE_REF
    cmds:
      - scripts/tofu-examples.sh check

  example-test:
    desc: Run tofu validate and the tests of each example on a copy with local sources, which fetches nothing from GitHub
    cmds:
      - mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - scripts/tofu-examples.sh test

  git-source-test:
    desc: Prove the Git source from a copy of the example against a local bare repository with the tag
    cmds:
      - mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - scripts/tofu-examples.sh git-source-test

  lock:
    desc: Update the lock file of each example for the platforms operators run tofu on
    cmds:
      - mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - scripts/tofu-examples.sh lock

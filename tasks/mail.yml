# SPDX-License-Identifier: AGPL-3.0-only
#
# The layout of the HTML emails in app/mail (@my/mail, a package of the client workspace; ADR-0086 §2; the mail context
# of scripts/changed-contexts.sh): MJML compiles app/mail/frame.mjml into the Go html/template
# internal/app/kernel/mail_frame.gen.html, which is committed because Go embeds it (ADR-0081). MJML runs at development
# time only, so Go builds and tests need no Bun. Its npm packages are installed by web:install from app/bun.lock, and
# web:licenses checks their licenses with the rest of the workspace.
version: "3"

tasks:
  gen:
    desc: Regenerate internal/app/kernel/mail_frame.gen.html from app/mail/frame.mjml with MJML (commit it)
    deps: [":web:install"]
    run: once
    sources:
      - app/mail/frame.mjml
      - app/mail/src/*.ts
      - app/bun.lock
      - internal/domain/instance/theme_tokens.gen.go
    generates:
      - internal/app/kernel/mail_frame.gen.html
    cmds:
      - cd app/mail && bun run src/frame.ts

  check:
    desc: Fail on a stale email layout, type-check app/mail, and check the TS formatting (web:fmt-check), in parallel
    deps: [gen-check, typecheck, ":web:fmt-check"]

  gen-check:
    desc: Fail if the committed internal/app/kernel/mail_frame.gen.html differs from what app/mail/frame.mjml compiles to
    deps: [":web:install"]
    dir: app/mail
    cmds:
      - bun run src/frame.ts --check

  typecheck:
    desc: Type-check app/mail with tsc
    deps: [":web:install"]
    dir: app/mail
    cmds:
      - bun run typecheck

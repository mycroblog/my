#
# The message catalogs in locales/ and tools/i18n (ADR-0009; the i18n context of scripts/changed-contexts.sh).
version: "3"

tasks:
  # It skips while node_modules exists and the manifests are unchanged, as web:install does.
  install:
    desc: Install the pinned i18n tool dependencies (tools/i18n/bun.lock)
    run: once
    dir: tools/i18n
    sources: [bun.lock, bunfig.toml, package.json]
    status:
      - test -d node_modules
    cmds:
      - bun install --frozen-lockfile

  gen:
    desc: Regenerate pseudo-locales, typed accessors, and parity fixtures from locales/ (commit the files Go reads)
    deps: [install]
    run: once
    sources:
      - "locales/*/**/*.json"
      - exclude: "locales/en-XA/**"
      - exclude: "locales/ar-XB/**"
      - "tools/i18n/src/**/*.ts"
      - exclude: tools/i18n/src/runtime/messages.gen.ts
      - tools/i18n/bun.lock
    generates:
      - "locales/en-XA/**/*.json"
      - "locales/ar-XB/**/*.json"
      - internal/i18n/messages_gen.go
      - tools/i18n/src/runtime/messages.gen.ts
      - internal/i18n/testdata/golden.json
    cmds:
      - cd tools/i18n && bun run src/gen.ts

  # The generated files only the TS clients read are not committed (ADR-0081); every task that reads them
  # (here and in tasks/web.yml) depends on this. It skips while its sources are unchanged.
  gen-ts:
    desc: Generate the files only the TS clients read (client pseudo-locales, TS accessors) from locales/
    deps: [install]
    run: once
    sources:
      - "locales/*/**/*.json"
      - exclude: "locales/en-XA/**"
      - exclude: "locales/ar-XB/**"
      - "tools/i18n/src/**/*.ts"
      - exclude: tools/i18n/src/runtime/messages.gen.ts
      - tools/i18n/bun.lock
    generates:
      - "locales/en-XA/client*/**/*.json"
      - "locales/ar-XB/client*/**/*.json"
      - tools/i18n/src/runtime/messages.gen.ts
    cmds:
      - cd tools/i18n && bun run src/gen.ts --ts

  check:
    desc: Lint the catalogs, fail on stale committed i18n files, check npm licenses, test and type-check the TS runtime, check the TS formatting (web:fmt-check)
    deps: [lint, licenses, test, typecheck, ":web:fmt-check"]

  lint:
    desc: Lint the catalogs and fail on stale generated i18n files Go reads (server pseudo-locales, Go accessors, golden)
    deps: [install]
    dir: tools/i18n
    cmds:
      - bun run src/check.ts

  licenses:
    desc: Fail on tools/i18n npm dependency licenses incompatible with AGPL-3.0
    deps: [install]
    dir: tools/i18n
    cmds:
      - bun run src/licenses.ts {{.NPM_ALLOWED_LICENSES}}

  test:
    desc: Run the tools/i18n tests
    deps: [gen-ts]
    dir: tools/i18n
    cmds:
      - bun test

  typecheck:
    desc: Type-check tools/i18n with tsc
    deps: [gen-ts]
    dir: tools/i18n
    cmds:
      - bun --bun run tsc --noEmit -p .

#
# The message catalogs in locales/ and tools/i18n (ADR-0009; the i18n context of scripts/changed-contexts.sh).
# tools/i18n is a member of the Bun workspace at the repository root, installed by web:install.
version: "3"

tasks:
  gen:
    desc: Regenerate pseudo-locales, Go typed accessors, and parity fixtures from locales/ (commit the result)
    deps: [":web:install"]
    run: once
    sources:
      - "locales/*/**/*.json"
      - exclude: "locales/en-XA/**"
      - exclude: "locales/ar-XB/**"
      - "tools/i18n/src/**/*.ts"
      - bun.lock
    generates:
      - "locales/en-XA/**/*.json"
      - "locales/ar-XB/**/*.json"
      - internal/i18n/messages_gen.go
      - internal/i18n/testdata/golden.json
    cmds:
      - cd tools/i18n && bun src/gen.ts

  check:
    desc: Lint the catalogs, fail on stale generated i18n files, check npm licenses, test and type-check tools/i18n, check the TS formatting (web:fmt-check)
    deps: [lint, licenses, test, typecheck, knip, ":web:fmt-check"]

  lint:
    desc: Lint the catalogs, the copy of en and ja and its waivers among them, and fail on stale generated i18n files (pseudo-locales, Go accessors, golden)
    deps: [":web:install"]
    dir: tools/i18n
    cmds:
      - bun src/check.ts

  # Like docs:growth, it reads the change against its base, so the pull request's preflight runs it with BASE=HEAD^1.
  waivers:
    desc: Fail when more than three waivers of the copy lint (tools/i18n/waivers.json) were added since the merge base with BASE (default origin/redesign-web)
    deps: [":web:install"]
    dir: tools/i18n
    vars:
      BASE: '{{.BASE | default "origin/redesign-web"}}'
    cmds:
      - bun src/waivers.ts {{shellQuote .BASE}}

  # web:licenses checks every installed package of the workspace; this checks the ones tools/i18n runs on.
  licenses:
    desc: Fail on licenses of the npm dependencies of tools/i18n incompatible with AGPL-3.0
    deps: [":web:install"]
    dir: tools/i18n
    cmds:
      - bun src/licenses.ts {{.NPM_ALLOWED_LICENSES}} --deps-of .

  test:
    desc: Run the tools/i18n tests
    deps: [":web:install"]
    dir: tools/i18n
    cmds:
      - bun test

  knip:
    desc: Fail on unused files, exports, and dependencies of tools/i18n (knip.json)
    deps: [":web:install"]
    cmds:
      - bun --bun knip --workspace tools/i18n

  typecheck:
    desc: Type-check tools/i18n with tsc
    deps: [":web:install"]
    dir: tools/i18n
    cmds:
      - bun --bun tsc --noEmit -p .

# SPDX-License-Identifier: AGPL-3.0-only
#
# The Bun workspace at the repository root (ADR-0025 §2, §10; the web context of scripts/changed-contexts.sh): its
# members are the packages under web/, tools/i18n, pkg/mykit/ts, and pkg/mybot/ts, installed once from bun.lock.
# Every tool runs on Bun alone (ADR-0025 §10). The checks of each member live with its area: web/docs in
# tasks/docs.yml (site:check), tools/i18n and web/i18n in tasks/i18n.yml (web:lint lints web/i18n too, and the tasks
# that read a package's compiled catalog compile it first), the published packages in tasks/mykit.yml, and the
# development packages web/devtools and web/catalog (ADR-0168), the tokens of web/design-tokens (ADR-0059), the
# components of web/design-system, the shared components of web/app-components (ADR-0025 §4), and the server data of
# web/app-data (ADR-0028 §6) here.
version: "3"

vars:
  # The packages of the workspace that may have one license outside NPM_ALLOWED_LICENSES, each NAME=LICENSE
  # (a NAME ending in `*` is a prefix; tools/i18n/src/licenses.ts --exempt): any other package with that license still
  # fails.
  # - @img/sharp-libvips-*: the prebuilt libvips of sharp, the image library Astro uses when it builds the
  #   documentation site (web/docs). The FSF lists LGPLv3 as compatible with AGPLv3, and the site is a build tool,
  #   never shipped in the server image.
  NPM_LICENSE_EXEMPTIONS: "@img/sharp-libvips-*=LGPL-3.0-or-later"
  # internal/interface/web embeds what web:build places here with //go:embed all:dist (ADR-0028). Only its .gitkeep is
  # committed, so Go builds and tests need no Bun; go:bin embeds what web:build placed.
  WEB_EMBED_DIR: internal/interface/web/dist
  # The files bun fmt formats (web:fmt, web:fmt-check): the TypeScript and JavaScript of every member. The options are
  # in the [fmt] section of bunfig.toml; .prettierignore lists the files it leaves alone, besides .gitignore's.
  FMT_FILES: >-
    'web/**/*.{ts,tsx,js,mjs}' 'pkg/mykit/ts/**/*.{ts,tsx,js,mjs}' 'pkg/mybot/ts/**/*.{ts,tsx,js,mjs}'
    'tools/i18n/**/*.{ts,tsx,js,mjs}'

tasks:
  check:
    desc: Run the workspace-wide checks (bun fmt, the npm licenses) and those of web/design-tokens, web/design-system, web/app-components, web/app-data, web/devtools and web/catalog in parallel
    deps: [fmt-check, licenses, typecheck, lint, direction, knip, test, devtools-absent]

  # The page where the decider writes notes for an agent (ADR-0168). It prints `catalog: <url>` once it listens;
  # `scripts/agentkit.sh feedback url` prints the same URL, and `feedback wait` in the background receives the notes.
  # A worktree runs one dev server: while the one it recorded answers, this prints its URL and starts none.
  catalog:
    desc: Serve the catalog page (web/catalog) on Vite's dev server, with the feedback overlay of @my/devtools, unless the worktree's dev server already runs
    deps: [install, ":i18n:compile"]
    dir: web/catalog
    cmds:
      - |
        if url=$("{{.ROOT_DIR}}/scripts/agentkit.sh" feedback url 2>/dev/null); then
          echo "catalog: $url (already running in this worktree)"
          exit 0
        fi
        bun --bun vite {{.CLI_ARGS}}

  # What the visual evaluator sees (ADR-0169 §2): web/catalog/shot.ts prints the path of each shot.
  shot:
    desc: Screenshot the running catalog page, or one section with --section <id>, at the mobile, tablet and PC viewports in light and dark (--landscape rotates them, --lang <locale> shows the page in a locale such as ar-XB), once per variant with --options <id>
    deps: [install, ":i18n:compile"]
    dir: web/catalog
    cmds:
      - bun --bun shot.ts {{.CLI_ARGS}}

  typecheck:
    desc: Type-check web/design-tokens, web/design-system, web/app-components, web/app-data, web/devtools and web/catalog with tsc
    deps: [install, ":i18n:compile"]
    cmds:
      - cd web/design-tokens && bun --bun tsc -p .
      - cd web/design-system && bun --bun tsc -p .
      - cd web/app-components && bun --bun tsc -p .
      - cd web/app-data && bun --bun tsc -p .
      - cd web/devtools && bun --bun tsc -p .
      - cd web/catalog && bun --bun tsc -p .

  lint:
    desc: Run Oxlint on web/design-tokens, web/design-system, web/app-components, web/app-data, web/devtools, web/catalog and web/i18n with the workspace's configuration (.oxlintrc.json)
    deps: [install, ":i18n:compile"]
    cmds:
      - bun --bun oxlint web/design-tokens web/design-system web/app-components web/app-data web/devtools web/catalog web/i18n

  # A part lays out right-to-left under an RTL locale only when its styles name no physical side (ADR-0009 §1).
  direction:
    desc: Fail on a Tailwind utility (ml-, left-, text-left, rounded-l…), a CSS declaration (margin-left, left, text-align left…) or a React style key (marginLeft, left in an inline style) that sets a physical side in the TypeScript and CSS of web/design-tokens, web/design-system, web/app-components, web/app-data, web/devtools, web/catalog and web/i18n, naming the logical one
    cmds:
      - bun web/devtools/src/direction.ts web/design-tokens web/design-system web/app-components web/app-data web/devtools web/catalog web/i18n

  knip:
    desc: Fail on unused files, exports, and dependencies of web/design-tokens, web/design-system, web/app-components, web/app-data, web/devtools and web/catalog (knip.json)
    deps: [install, ":i18n:compile"]
    cmds:
      - bun --bun knip --workspace web/design-tokens --workspace web/design-system --workspace web/app-components --workspace web/app-data --workspace web/devtools --workspace web/catalog

  test:
    desc: Run the tests of web/design-tokens, web/design-system, web/app-components, web/app-data and web/devtools
    deps: [install, ":i18n:compile"]
    cmds:
      - cd web/design-tokens && bun test
      - cd web/design-system && bun test
      - cd web/app-components && bun test
      # The condition reads @mycroblog/mykit from its TypeScript sources, as tsconfig.json does.
      - cd web/app-data && bun test --conditions=@mycroblog/source
      - cd web/devtools && bun test

  # The production build of the catalog page stands for every production build: the plugin of @my/devtools refuses
  # an import of the package there, and this fails when the output still contains it.
  devtools-absent:
    desc: Build web/catalog for production and fail if the build contains @my/devtools (ADR-0168 §3)
    deps: [install, ":i18n:compile"]
    cmds:
      - cd web/catalog && bun --bun vite build --logLevel warn
      - bun web/devtools/src/absent.ts web/catalog/dist

  # It skips while node_modules exists and the manifests are unchanged, so that the tasks of several processes (the
  # parallel steps of a CI job, ADR-0079) never install at once after the job's first install.
  install:
    desc: Install the pinned dependencies of the workspace (bun.lock)
    run: once
    sources: [bun.lock, bunfig.toml, package.json, "web/*/package.json", tools/i18n/package.json, pkg/mykit/ts/package.json, pkg/mybot/ts/package.json]
    status:
      - test -d node_modules
    cmds:
      - bun install --frozen-lockfile

  # What the server embeds (internal/interface/web): the files of web/brand, whose icons it serves at the root and
  # lists in the Web App Manifest. There is no client build, so the shell loads no client script. The Dockerfile's
  # build stage mounts web/brand there the same way.
  build:
    desc: Place the build that the Go server embeds in internal/interface/web/dist (the brand assets of web/brand)
    cmds:
      - find {{.WEB_EMBED_DIR}} -mindepth 1 ! -name .gitkeep -delete
      - cp web/brand/* {{.WEB_EMBED_DIR}}/

  licenses:
    desc: Fail on npm dependency licenses of the workspace incompatible with AGPL-3.0
    deps: [install]
    dir: tools/i18n
    cmds:
      - bun src/licenses.ts {{.NPM_ALLOWED_LICENSES}} --exempt {{shellQuote .NPM_LICENSE_EXEMPTIONS}} ../../node_modules

  # Bun only: it reads no node_modules, so it needs no install.
  fmt:
    desc: Format the TypeScript and JavaScript of web/, pkg/mykit/ts, pkg/mybot/ts, and tools/i18n with bun fmt (the preflight checks it, so run it before committing them)
    cmds:
      - bun fmt {{.FMT_FILES}}

  # The i18n, site, and mykit checks run it too, for their packages' files.
  fmt-check:
    desc: Fail if bun fmt would change a TypeScript or JavaScript file of the workspace (scripts/task.sh web:fmt fixes them)
    run: once
    cmds:
      - bun fmt --check {{.FMT_FILES}}

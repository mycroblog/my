# SPDX-License-Identifier: AGPL-3.0-only
#
# The Bun workspace at the repository root (ADR-0025 §2, §10; the web context of scripts/changed-contexts.sh): its
# members are the packages under web/, tools/i18n, pkg/mykit/ts, and pkg/mybot/ts, installed once from bun.lock.
# Every tool runs on Bun alone (ADR-0025 §10). The checks of each member live with its area: web/docs in
# tasks/docs.yml (site:check), tools/i18n and web/i18n in tasks/i18n.yml (web:lint lints web/i18n too, and the tasks
# that read a package's compiled catalog compile it first), the published packages in tasks/mykit.yml, and the
# development packages web/devtools (ADR-0168) and web/storybook, the one Storybook host of the stories (ADR-0165 §1),
# the scenarios, demo and E2E tests of web/e2e (ADR-0015), the tokens of web/design-tokens (ADR-0059), the
# components of web/design-system, the shared components of web/app-components (ADR-0025 §4), the platform of
# web/platform (ADR-0028 §17), the server data of web/app-data (ADR-0028 §6), the features of web/app-features and
# the app of web/app (ADR-0025 §2) here.
version: "3"

vars:
  # The packages of the workspace that may have one license outside NPM_ALLOWED_LICENSES, each NAME=LICENSE
  # (a NAME ending in `*` is a prefix; tools/i18n/src/licenses.ts --exempt): any other package with that license still
  # fails.
  # - @img/sharp-libvips-*: the prebuilt libvips of sharp, the image library Astro uses when it builds the
  #   documentation site (web/docs). The FSF lists LGPLv3 as compatible with AGPLv3, and the site is a build tool,
  #   never shipped in the server image.
  # - caniuse-lite: the browser data that browserslist reads at build time, under the @babel/core of TanStack Router's
  #   route generator and Vite plugin (web/app); none of it is in the shipped bundle. The FSF lists CC BY 4.0 as
  #   compatible with GPLv3. The check reads every installed package, so it cannot hold this to build time alone.
  NPM_LICENSE_EXEMPTIONS: "@img/sharp-libvips-*=LGPL-3.0-or-later,caniuse-lite=CC-BY-4.0"
  # internal/interface/web embeds what web:build places here with //go:embed all:dist (ADR-0028). Only its .gitkeep is
  # committed, so Go builds and tests need no Bun; go:bin embeds what web:build placed.
  WEB_EMBED_DIR: internal/interface/web/dist

tasks:
  check:
    desc: Run the workspace-wide checks (bun fmt, the npm licenses) and those of web/design-tokens, web/design-system, web/app-components, web/platform, web/app-data, web/app-features, web/app, web/devtools and web/storybook in parallel, with the app's build
    deps: [fmt-check, licenses, typecheck, lint, direction, knip, test, build, devtools-absent]

  # The app's Vite dev server on http://localhost:5173, which passes /api, /oauth and /auth on to the server of
  # `docker compose up` (MY_SERVER=<origin> names another); `my serve -dev-vite-origin http://localhost:5173` loads the
  # client from it instead of the build it embeds.
  dev:
    desc: Serve the app (web/app) on Vite's dev server at http://localhost:5173, talking to the server at MY_SERVER (https://my.localhost by default)
    deps: [install, ":i18n:compile", routes]
    dir: web/app
    cmds:
      - bun --bun vite {{.CLI_ARGS}}

  # Its output is not committed (ADR-0081): the tasks that read the route tree depend on it.
  routes:
    desc: Generate the route tree of web/app (src/routeTree.gen.ts) from its file-based routes with TanStack Router's generator
    deps: [install]
    run: once
    sources: [web/app/src/routes/**/*.tsx, web/app/scripts/routes.ts, bun.lock]
    generates: [web/app/src/routeTree.gen.ts]
    cmds:
      - bun web/app/scripts/routes.ts

  # The stories of every layer in one Storybook (ADR-0165 §1), where the decider and an agent look at the tokens, the
  # components and the screens. A worktree runs one dev server: while the one it recorded answers
  # (`scripts/agentkit.sh feedback url`), this prints its URL and starts none.
  storybook:
    desc: Serve the Storybook host (web/storybook) on Storybook's dev server, unless the worktree's dev server already runs
    deps: [install, ":i18n:compile", routes]
    dir: web/storybook
    cmds:
      - |
        if url=$("{{.ROOT_DIR}}/scripts/agentkit.sh" feedback url 2>/dev/null); then
          echo "storybook: $url (already running in this worktree)"
          exit 0
        fi
        bun --bun storybook dev --ci {{.CLI_ARGS}}

  # The static build of the Storybook host (web/storybook/dist).
  stories:
    desc: Build the Storybook host (web/storybook) into web/storybook/dist
    deps: [install, ":i18n:compile", routes]
    dir: web/storybook
    cmds:
      - bun --bun storybook build -o dist --quiet

  # The story tests (ADR-0110 §9): Storybook's Vitest addon in browser mode (web/storybook/vitest.config.ts). Chromium
  # comes from `bun --bun playwright install chromium` in web/storybook. Not a part of `check`: CI runs it when the
  # stories context changes.
  stories-test:
    desc: Test every story of the Storybook host in Chromium at 320 px, in en and right-to-left in ar-XB, with axe and for sideways scrolling (CLI_ARGS go to Vitest)
    deps: [install, ":i18n:compile", routes]
    dir: web/storybook
    cmds:
      - bun --bun vitest run {{.CLI_ARGS}}

  # What the visual evaluator sees (ADR-0169 §2): web/storybook/shot.ts prints the path of each shot.
  shot:
    desc: Screenshot a story of the running Storybook (its URL, or --section <story id>[#<element id>]) at the mobile, tablet and PC viewports in light and dark (--landscape rotates them, --lang <locale> shows it in a locale such as ar-XB), once per variant with --options <id>
    deps: [install]
    dir: web/storybook
    cmds:
      - bun --bun shot.ts {{.CLI_ARGS}}

  # The demo server of web/e2e (ADR-0015 §8): the test build of bin/my with the web client, on a fresh database in
  # .tmp/demo/ seeded with the scenario, at http://localhost:8787 (DEMO_PORT moves it) until Ctrl-C.
  demo:
    desc: Build the test build of bin/my (GO_TAGS=e2e_fakes) and run the demo server seeded with the scenario of web/e2e, printing its URL and the people's sign-ins
    deps:
      - task: ":go:bin"
        vars: { GO_TAGS: e2e_fakes }
    cmds:
      - bun --conditions=@mycroblog/source web/e2e/src/server/main.ts

  # The E2E tests (ADR-0015 §1), against the same demo server, which their global setup starts. Chromium comes from
  # `bun --bun playwright install chromium` in web/e2e. Not a part of `check`: CI runs it when the e2e context changes.
  e2e:
    desc: Build the test build of bin/my (GO_TAGS=e2e_fakes) and run the Playwright tests of web/e2e against the demo server (CLI_ARGS go to Playwright)
    deps:
      - task: ":go:bin"
        vars: { GO_TAGS: e2e_fakes }
    dir: web/e2e
    cmds:
      - bun --bun playwright test {{.CLI_ARGS}}

  typecheck:
    desc: Type-check web/design-tokens, web/design-system, web/app-components, web/platform, web/app-data, web/app-features, web/app, web/devtools, web/storybook and web/e2e with tsc
    deps: [install, ":i18n:compile", routes]
    cmds:
      - cd web/design-tokens && bun --bun tsc -p .
      - cd web/design-system && bun --bun tsc -p .
      - cd web/app-components && bun --bun tsc -p .
      - cd web/platform && bun --bun tsc -p .
      - cd web/app-data && bun --bun tsc -p .
      - cd web/app-features && bun --bun tsc -p .
      - cd web/app && bun --bun tsc -p .
      - cd web/devtools && bun --bun tsc -p .
      - cd web/storybook && bun --bun tsc -p .
      - cd web/e2e && bun --bun tsc -p .

  # restrict/layer-imports refuses an import against the direction of the layers (ADR-0025 §3), and
  # restrict/platform-globals a check of the platform outside web/platform (ADR-0028 §17).
  lint:
    desc: Run Oxlint on web/design-tokens, web/design-system, web/app-components, web/platform, web/app-data, web/app-features, web/app, web/devtools, web/storybook and web/i18n with the workspace's configuration (.oxlintrc.json), and prove the rules of web/devtools/src/restrictions.js on their fixtures
    deps: [install, ":i18n:compile", routes]
    cmds:
      - bun --bun oxlint web/design-tokens web/design-system web/app-components web/platform web/app-data web/app-features web/app web/devtools web/storybook web/e2e web/i18n
      - bun test ./web/devtools/src/restrictions.test.js

  # A part lays out right-to-left under an RTL locale only when its styles name no physical side (ADR-0009 §1).
  direction:
    desc: Fail on a Tailwind utility (ml-, left-, text-left, rounded-l…), a CSS declaration (margin-left, left, text-align left…) or a React style key (marginLeft, left in an inline style) that sets a physical side in the TypeScript and CSS of web/design-tokens, web/design-system, web/app-components, web/platform, web/app-data, web/app-features, web/app, web/devtools, web/storybook and web/i18n, naming the logical one
    cmds:
      - bun web/devtools/src/direction.ts web/design-tokens web/design-system web/app-components web/platform web/app-data web/app-features web/app web/devtools web/storybook web/e2e web/i18n

  knip:
    desc: Fail on unused files, exports, and dependencies of web/design-tokens, web/design-system, web/app-components, web/platform, web/app-data, web/app-features, web/app, web/devtools, web/storybook and web/e2e (knip.json)
    deps: [install, ":i18n:compile", routes]
    cmds:
      - bun --bun knip --workspace web/design-tokens --workspace web/design-system --workspace web/app-components --workspace web/platform --workspace web/app-data --workspace web/app-features --workspace web/app --workspace web/devtools --workspace web/storybook --workspace web/e2e

  test:
    desc: Run the tests of web/design-tokens (which fail on a stale internal/domain/instance/theme_tokens.gen.go), web/design-system, web/app-components, web/platform, web/app-data, web/app-features, web/app and web/devtools
    deps: [install, ":i18n:compile", routes]
    cmds:
      - cd web/design-tokens && bun test
      - cd web/design-system && bun test
      - cd web/app-components && bun test
      - cd web/platform && bun test
      # The condition reads @mycroblog/mykit from its TypeScript sources, as tsconfig.json does.
      - cd web/app-data && bun test --conditions=@mycroblog/source
      - cd web/app-features && bun test --conditions=@mycroblog/source
      - cd web/app && bun test --conditions=@mycroblog/source
      - cd web/devtools && bun test

  # The tokens a server theme may override, for Go (ADR-0059, ADR-0081): committed, since Go reads it. Bun only: the
  # generator reads no node_modules.
  tokens-gen:
    desc: Regenerate internal/domain/instance/theme_tokens.gen.go from @my/design-tokens (commit the result)
    sources: [web/design-tokens/src/tokens.ts, web/design-tokens/src/theme-tokens.ts]
    generates: [internal/domain/instance/theme_tokens.gen.go]
    cmds:
      - bun web/design-tokens/src/theme-tokens.ts

  # The production build is the app's (web/app), which this builds apart from web:build's, into .tmp/, so that the two
  # can run at once; it fails when the output contains @my/devtools, which only the Storybook host loads.
  devtools-absent:
    desc: Build web/app for production into .tmp/devtools-absent and fail if the build contains @my/devtools (ADR-0168 §3)
    deps: [install, ":i18n:compile", routes]
    cmds:
      - cd web/app && bun --bun vite build --logLevel warn --outDir ../../.tmp/devtools-absent --emptyOutDir
      - bun web/devtools/src/absent.ts .tmp/devtools-absent

  # It skips while node_modules exists and the manifests are unchanged, so that the tasks of several processes (the
  # parallel steps of a CI job, ADR-0079) never install at once after the job's first install.
  install:
    desc: Install the pinned dependencies of the workspace (bun.lock)
    run: once
    sources: [bun.lock, bunfig.toml, package.json, "web/*/package.json", tools/i18n/package.json, pkg/mykit/ts/package.json, pkg/mybot/ts/package.json]
    status:
      - test -d node_modules
    cmds:
      - bun install --frozen-lockfile

  # What the server embeds (internal/interface/web): the Vite build of web/app, whose manifest the shell's tags come
  # from (ADR-0028 §4), and the files of web/brand, whose icons the server serves at the root and lists in the Web App
  # Manifest. The build fails when React Compiler skips a function (ADR-0025 §9). The Dockerfile's stage web and the
  # root compose.yaml (scripts/dev-compose.sh) run it too.
  build:
    desc: Build web/app with Vite into internal/interface/web/dist, which the Go server embeds, with the brand assets of web/brand
    deps: [install, ":i18n:compile", routes]
    cmds:
      - find {{.WEB_EMBED_DIR}} -mindepth 1 ! -name .gitkeep -delete
      - cd web/app && bun --bun vite build --logLevel warn
      - cp web/brand/* {{.WEB_EMBED_DIR}}/

  licenses:
    desc: Fail on npm dependency licenses of the workspace incompatible with AGPL-3.0
    deps: [install]
    dir: tools/i18n
    cmds:
      - bun src/licenses.ts {{.NPM_ALLOWED_LICENSES}} --exempt {{shellQuote .NPM_LICENSE_EXEMPTIONS}} ../../node_modules

  # Bun only: it reads no node_modules, so it needs no install. The [fmt] section of bunfig.toml holds the options and
  # the files: a bare `bun fmt` at the root is the same command.
  fmt:
    desc: Format the TypeScript and JavaScript of web/, pkg/mykit/ts, pkg/mybot/ts, and tools/i18n with bun fmt (the preflight checks it, so run it before committing them)
    cmds:
      - bun fmt

  # The i18n, site, and mykit checks run it too, for their packages' files.
  fmt-check:
    desc: Fail if bun fmt would change a TypeScript or JavaScript file of the workspace (scripts/task.sh web:fmt fixes them)
    run: once
    cmds:
      - bun fmt --check

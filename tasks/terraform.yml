#
# The OpenTofu modules of deploy/terraform (ADR-0010; the terraform context of scripts/changed-contexts.sh). Nothing here
# reaches a cloud: init downloads the providers, validate reads the configuration, and the tests mock the providers.
version: "3"

vars:
  TERRAFORM_DIRS:
    sh: printf '%s\n' deploy/terraform/modules/* | tr '\n' ' '
  # One copy of the providers for every directory: each is over 100 MB.
  TF_PLUGIN_CACHE_DIR: "{{.ROOT_DIR}}/.tmp/tofu-plugins"

env:
  TF_PLUGIN_CACHE_DIR: "{{.TF_PLUGIN_CACHE_DIR}}"
  TF_IN_AUTOMATION: "1"

tasks:
  check:
    desc: Run the checks of deploy/terraform (needs tofu)
    cmds:
      - task: fmt-check
      - task: env-check
      - task: sources
      - task: validate
      - task: test
      - task: example-test
      - task: git-source-test
      - task: state-test

  fmt-check:
    desc: Fail when the files of deploy/terraform are not formatted as tofu fmt does
    cmds:
      - tofu fmt -check -recursive -diff deploy/terraform

  env-check:
    desc: Fail when deploy/terraform or its guide names a MY_ variable that the configuration does not have
    cmds:
      - scripts/terraform-env-check.sh deploy/terraform docs/operations/deploy-cloud-run.md

  init:
    internal: true
    cmds:
      - mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - for: { var: TERRAFORM_DIRS, as: DIR }
        cmd: tofu -chdir={{.DIR}} init -backend=false -input=false >/dev/null

  validate:
    desc: Run tofu validate on each module of deploy/terraform
    deps: [init]
    cmds:
      - for: { var: TERRAFORM_DIRS, as: DIR }
        cmd: tofu -chdir={{.DIR}} validate

  test:
    desc: Run the tests of deploy/terraform, on mocked providers
    deps: [init]
    cmds:
      - for: [deploy/terraform/modules/app-gcp-cloud-run, deploy/terraform/modules/ingress-cloudflare-app, deploy/terraform/modules/ingress-cloudflare-media, deploy/terraform/modules/mail-smtp, deploy/terraform/modules/secrets-gcp-secret-manager]
        cmd: tofu -chdir={{.ITEM}} test

  state-test:
    desc: Prove against a local stub of Secret Manager that generated secrets have the right formats and reach neither the plan nor the state
    cmds:
      - mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - scripts/terraform-state-test.sh

  sources:
    desc: Fail when an example or a document of deploy/terraform has a relative module source, or a ref other than MODULE_REF
    cmds:
      - scripts/terraform-examples.sh check

  example-test:
    desc: Run tofu validate and the tests of each example on a copy with local sources, which fetches nothing from GitHub
    cmds:
      - mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - scripts/terraform-examples.sh test

  git-source-test:
    desc: Prove the Git source from a copy of the example against a local bare repository with the tag
    cmds:
      - mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - scripts/terraform-examples.sh git-source-test

  lock:
    desc: Update the lock file of each example for the platforms operators run tofu on
    cmds:
      - mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - scripts/terraform-examples.sh lock

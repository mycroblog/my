#
# The OpenTofu modules of deploy/terraform (ADR-0010; the terraform context of scripts/changed-contexts.sh). Nothing here
# reaches a cloud: init downloads the providers, validate reads the configuration, and the tests mock the providers.
version: "3"

vars:
  TERRAFORM_DIRS:
    sh: printf '%s\n' deploy/terraform/modules/* deploy/terraform/examples/* | tr '\n' ' '
  # One copy of the providers for every directory: each is over 100 MB.
  TF_PLUGIN_CACHE_DIR: "{{.ROOT_DIR}}/.tmp/tofu-plugins"

env:
  TF_PLUGIN_CACHE_DIR: "{{.TF_PLUGIN_CACHE_DIR}}"
  TF_IN_AUTOMATION: "1"

tasks:
  check:
    desc: Run the checks of deploy/terraform (needs tofu)
    cmds:
      - task: fmt-check
      - task: env-check
      - task: validate
      - task: test

  fmt-check:
    desc: Fail when the files of deploy/terraform are not formatted as tofu fmt does
    cmds:
      - tofu fmt -check -recursive -diff deploy/terraform

  env-check:
    desc: Fail when deploy/terraform or its guide names a MY_ variable that the configuration does not have
    cmds:
      - scripts/terraform-env-check.sh deploy/terraform docs/operations/deploy-cloud-run.md

  init:
    internal: true
    cmds:
      - mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - for: { var: TERRAFORM_DIRS, as: DIR }
        # An example keeps to the versions of its lock file; a module has none.
        cmd: >-
          lock=-lockfile=readonly;
          case "{{.DIR}}" in deploy/terraform/modules/*) lock= ;; esac;
          tofu -chdir={{.DIR}} init -backend=false -input=false $lock >/dev/null

  validate:
    desc: Run tofu validate on each module and example of deploy/terraform
    deps: [init]
    cmds:
      - for: { var: TERRAFORM_DIRS, as: DIR }
        cmd: tofu -chdir={{.DIR}} validate

  test:
    desc: Run the tests of deploy/terraform, on mocked providers
    deps: [init]
    cmds:
      - for: [deploy/terraform/modules/app-gcp-cloud-run, deploy/terraform/examples/gcp-cloud-run-neon]
        cmd: tofu -chdir={{.ITEM}} test

  lock:
    desc: Update the lock file of the example for the platforms operators run tofu on
    cmds:
      - tofu -chdir=deploy/terraform/examples/gcp-cloud-run-neon init -backend=false -input=false -upgrade >/dev/null
      - >-
        tofu -chdir=deploy/terraform/examples/gcp-cloud-run-neon providers lock
        -platform=linux_amd64 -platform=linux_arm64 -platform=darwin_amd64 -platform=darwin_arm64

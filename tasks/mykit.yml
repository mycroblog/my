# SPDX-License-Identifier: AGPL-3.0-only
#
# pkg/mykit and pkg/mybot, the MIT-licensed client libraries of the client API (ADR-0093, ADR-0094; the mykit context
# of scripts/changed-contexts.sh): the Go module pkg/mykit and the npm package @mycroblog/mykit in pkg/mykit/ts, and
# the Go module pkg/mybot and the npm package @mycroblog/mybot in pkg/mybot/ts, the bot library on top of mykit. The
# Go modules are modules of their own, so the root module's `./...`, depguard, and go:check never see them: these
# tasks check them (the mybot-* tasks pkg/mybot). The npm packages are packages of the client workspace
# (app/package.json), checked here by the ts-* and mybot-ts-* tasks.
# api:generate writes their generated code (pkg/mykit/api.gen.go, pkg/mykit/ts/src/schema.gen.ts).
#
# The integration tests (integration-vet, integration-test) live in pkg/mykit/integration, a test module that is never
# published and joins the server module and pkg/mykit by `replace`: the Go client drives a server that
# internal/platform/platformtest runs in the test process (ADR-0093 §8). They are part of this check, so they run in
# `check:changed` and in the merge queue's `check` (the repo job of ci.yml) whenever the mykit context is selected:
# a change of pkg/mykit, of the spec (api/), of internal/interface/clientapi/ (both through the api context), or of
# internal/platform/platformtest/. They take seconds after the server's packages are built, so they do not belong
# to the slow suite (ADR-0079).
version: "3"

vars:
  # The integration module requires the server module's dependencies at the versions its go.mod lists. GOFLAGS
  # -mod=mod lets a dependency update of the root go.mod (Dependabot) raise them instead of failing the build until
  # pkg/mykit/integration/go.mod is tidied too; commit the go.mod and go.sum that a run updates.
  INTEGRATION_GOFLAGS: -mod=mod
  # Permissive licenses only (ADR-0093 §2): the library's dependencies reach its users, so no copyleft license,
  # not even one compatible with AGPL-3.0 such as the GPL or MPL-2.0.
  MYKIT_ALLOWED_LICENSES: 0BSD,Apache-2.0,BSD-2-Clause,BSD-3-Clause,BSL-1.0,CC0-1.0,ISC,MIT,Unlicense,Zlib

tasks:
  check:
    desc: Check pkg/mykit (Go - tidy, vet, lint, tests, the CGO_ENABLED=0 build, dependency licenses, no dependency on the server module, the integration tests against an in-process server; TS - tsc, Oxlint, knip, bun test, the build, dependency licenses) and the same Go and TS checks of pkg/mybot
    # The license scope check (MIT in pkg/mykit and pkg/mybot) belongs to the api context, which a change of pkg/mykit alone does not
    # select. mybot-ts-runtimes is left out: it needs Node.js 22 and Deno, which the repo job of CI installs for it.
    deps: [mod-check, server-dep-check, vet, lint, test, build, licenses, integration-vet, integration-test, ts-typecheck, ts-lint, ts-knip, ts-test, ts-build, ts-licenses, mybot-mod-check, mybot-server-dep-check, mybot-vet, mybot-lint, mybot-test, mybot-build, mybot-licenses, mybot-ts-typecheck, mybot-ts-lint, mybot-ts-knip, mybot-ts-test, mybot-ts-build, mybot-ts-licenses, ":api:license-scope"]

  warm:
    desc: Download the modules and build the packages and test binaries of pkg/mykit, its integration tests (with the server's packages), and pkg/mybot once, so that their checks a CI job runs in parallel read the build cache
    cmds:
      - for: [pkg/mykit, pkg/mybot]
        cmd: cd {{.ITEM}} && go mod download && go build ./... && go test -run '^$' ./...
      - cmd: GOFLAGS={{.INTEGRATION_GOFLAGS}} go test -run '^$' ./...
        dir: pkg/mykit/integration

  mod-check:
    desc: Fail if pkg/mykit/go.mod and go.sum are not tidy
    dir: pkg/mykit
    cmds:
      - go mod tidy -diff

  server-dep-check:
    desc: Fail if pkg/mykit/go.mod requires or replaces the server module, or the root go.mod names pkg/mykit or its integration module (scripts/mykit-mod-check.sh)
    cmds:
      - scripts/mykit-mod-check.sh

  vet:
    desc: Run go vet on pkg/mykit
    dir: pkg/mykit
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint on pkg/mykit
    dir: pkg/mykit
    cmds:
      # golangci-lint holds a lock while it runs: wait for it rather than fail beside go:lint or agentkit:lint.
      - golangci-lint run --allow-serial-runners ./...

  test:
    desc: Run the pkg/mykit unit tests
    dir: pkg/mykit
    cmds:
      - go test ./...

  integration-vet:
    desc: Run go vet on the integration tests of pkg/mykit (pkg/mykit/integration)
    dir: pkg/mykit/integration
    env:
      GOFLAGS: "{{.INTEGRATION_GOFLAGS}}"
    cmds:
      - go vet ./...

  integration-test:
    desc: Run the integration tests of pkg/mykit - the Go client against a server in the test process (pkg/mykit/integration)
    dir: pkg/mykit/integration
    env:
      GOFLAGS: "{{.INTEGRATION_GOFLAGS}}"
    cmds:
      - go test ./...

  build:
    desc: Build pkg/mykit statically (CGO_ENABLED=0)
    dir: pkg/mykit
    env:
      CGO_ENABLED: "0"
    cmds:
      - go build ./...

  licenses:
    desc: Fail on dependency licenses of pkg/mykit outside the permissive allowlist
    dir: pkg/mykit
    cmds:
      - go tool -modfile=../../tools/go.mod go-licenses check --allowed_licenses={{.MYKIT_ALLOWED_LICENSES}} ./...

  ts-typecheck:
    desc: Type-check @mycroblog/mykit with tsc (the library without Node.js types, and its tests)
    deps: [":web:install"]
    dir: pkg/mykit/ts
    cmds:
      - bun run typecheck

  ts-lint:
    desc: Run Oxlint on @mycroblog/mykit (pkg/mykit/ts/.oxlintrc.json, which forbids Node.js built-in modules in the library)
    deps: [":web:install"]
    dir: pkg/mykit/ts
    cmds:
      - bun run lint

  ts-knip:
    desc: Find unused files, exports, and dependencies of @mycroblog/mykit with knip (its workspace of app/knip.json)
    deps: [":web:install"]
    dir: app
    cmds:
      - bun run knip --workspace ../pkg/mykit/ts

  ts-test:
    desc: Run the @mycroblog/mykit unit tests with bun test
    deps: [":web:install"]
    dir: pkg/mykit/ts
    cmds:
      - bun test

  ts-build:
    desc: Build @mycroblog/mykit into pkg/mykit/ts/dist (ESM JavaScript and type declarations)
    # Once, so that check and mybot-ts-build, which builds mybot on top of it, do not rewrite dist/ at the same time.
    run: once
    deps: [":web:install"]
    dir: pkg/mykit/ts
    cmds:
      - bun run build

  ts-licenses:
    desc: Fail on licenses outside the permissive allowlist among the npm packages that @mycroblog/mykit depends on at run time
    deps: [":web:install", ":i18n:install"]
    dir: tools/i18n
    cmds:
      - bun run src/licenses.ts {{.MYKIT_ALLOWED_LICENSES}} --deps-of ../../pkg/mykit/ts

  mybot-ts-typecheck:
    desc: Type-check @mycroblog/mybot with tsc (the library without Node.js types, and its tests), reading @mycroblog/mykit from its sources
    deps: [":web:install"]
    dir: pkg/mybot/ts
    cmds:
      - bun run typecheck

  mybot-ts-lint:
    desc: Run Oxlint on @mycroblog/mybot (pkg/mybot/ts/.oxlintrc.json, which forbids static imports of Node.js built-in modules in the library)
    deps: [":web:install"]
    dir: pkg/mybot/ts
    cmds:
      - bun run lint

  mybot-ts-knip:
    desc: Find unused files, exports, and dependencies of @mycroblog/mybot with knip (its workspace of app/knip.json)
    deps: [":web:install"]
    dir: app
    cmds:
      - bun run knip --workspace ../pkg/mybot/ts

  mybot-ts-test:
    desc: Run the @mycroblog/mybot unit tests with bun test, reading @mycroblog/mykit from its sources
    deps: [":web:install"]
    dir: pkg/mybot/ts
    cmds:
      - bun run test

  mybot-ts-build:
    desc: Build @mycroblog/mykit and then @mycroblog/mybot into their dist/ (ESM JavaScript and type declarations), mybot reading mykit's build as its users do
    deps: [":web:install"]
    cmds:
      - task: ts-build
      - cd pkg/mybot/ts && bun run build

  mybot-ts-licenses:
    desc: Fail on licenses outside the permissive allowlist among the npm packages that @mycroblog/mybot depends on at run time (@mycroblog/mykit and its own)
    deps: [":web:install", ":i18n:install"]
    dir: tools/i18n
    cmds:
      - bun run src/licenses.ts {{.MYKIT_ALLOWED_LICENSES}} --deps-of ../../pkg/mybot/ts

  mybot-ts-runtimes:
    desc: Load the build of @mycroblog/mybot on Node.js and Deno and run a bot on each (pkg/mybot/ts/test/runtimes.mjs); needs node and deno on PATH, which the repo job of CI installs (Node.js 22, the oldest supported)
    deps: [mybot-ts-build]
    dir: pkg/mybot/ts
    cmds:
      - node test/runtimes.mjs
      - deno run --no-lock --allow-read --allow-write --allow-env test/runtimes.mjs

  mybot-mod-check:
    desc: Fail if pkg/mybot/go.mod and go.sum are not tidy
    dir: pkg/mybot
    cmds:
      - go mod tidy -diff

  mybot-server-dep-check:
    desc: Fail if pkg/mybot/go.mod requires or replaces the server module, or replaces anything but pkg/mykit with ../mykit (scripts/mykit-mod-check.sh)
    cmds:
      - scripts/mykit-mod-check.sh pkg/mybot/go.mod

  mybot-vet:
    desc: Run go vet on pkg/mybot
    dir: pkg/mybot
    cmds:
      - go vet ./...

  mybot-lint:
    desc: Run golangci-lint on pkg/mybot
    dir: pkg/mybot
    cmds:
      # golangci-lint holds a lock while it runs: wait for it rather than fail beside go:lint or agentkit:lint.
      - golangci-lint run --allow-serial-runners ./...

  mybot-test:
    desc: Run the pkg/mybot unit tests
    dir: pkg/mybot
    cmds:
      - go test ./...

  mybot-build:
    desc: Build pkg/mybot statically (CGO_ENABLED=0)
    dir: pkg/mybot
    env:
      CGO_ENABLED: "0"
    cmds:
      - go build ./...

  mybot-licenses:
    desc: Fail on dependency licenses of pkg/mybot outside the permissive allowlist
    dir: pkg/mybot
    cmds:
      - go tool -modfile=../../tools/go.mod go-licenses check --allowed_licenses={{.MYKIT_ALLOWED_LICENSES}} ./...

#
# Shell scripts (the shell context of scripts/changed-contexts.sh).
version: "3"

tasks:
  check:
    desc: Run the shell script checks (shellcheck, the tests of the release scripts)
    deps: [lint, test]

  # Every tracked script, wherever it is, so that no directory falls outside the list.
  lint:
    desc: Lint every tracked shell script (*.sh) with shellcheck
    cmds:
      - git ls-files -z '*.sh' | xargs -0 shellcheck

  test:
    desc: Test the scripts of the release and the build checks (scripts/release-libraries-test.sh, scripts/release-notes-test.sh, scripts/previous-minor-test.sh, scripts/release-image-test.sh, scripts/check-release-build-test.sh, scripts/go-fakes-test.sh, scripts/docs-site-test.sh, scripts/ui-preview-test.sh, scripts/tofu-scripts-test.sh, scripts/changed-contexts-test.sh, scripts/changed-web-packages-test.sh, scripts/nightly-report-test.sh, scripts/nightly-ux-report-test.sh, scripts/changed-contracts-test.sh, scripts/docs-growth-test.sh, scripts/role-hook-test.sh, scripts/visual-agreement-test.sh, scripts/review-sessions-test.sh, scripts/go-test-sleep-test.sh, scripts/ci-jobs-test.sh)
    cmds:
      - scripts/release-libraries-test.sh
      - scripts/release-notes-test.sh
      - scripts/previous-minor-test.sh
      - scripts/release-image-test.sh
      - scripts/check-release-build-test.sh
      - scripts/go-fakes-test.sh
      - scripts/docs-site-test.sh
      - scripts/ui-preview-test.sh
      - scripts/tofu-scripts-test.sh
      - scripts/changed-contexts-test.sh
      - scripts/changed-web-packages-test.sh
      - scripts/nightly-report-test.sh
      - scripts/nightly-ux-report-test.sh
      - scripts/changed-contracts-test.sh
      - scripts/docs-growth-test.sh
      - scripts/role-hook-test.sh
      - scripts/visual-agreement-test.sh
      - scripts/review-sessions-test.sh
      - scripts/go-test-sleep-test.sh
      - scripts/ci-jobs-test.sh

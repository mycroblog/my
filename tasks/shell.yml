# Shell scripts (the shell context of scripts/changed-contexts.sh).
version: "3"

tasks:
  check:
    desc: Run the shell script checks (shellcheck, the tests of the release scripts)
    deps: [lint, test]

  lint:
    desc: Lint shell scripts with shellcheck
    cmds:
      - shellcheck scripts/*.sh deploy/opentofu/*.sh

  test:
    desc: Test the scripts of the release and the build checks (scripts/release-libraries-test.sh, scripts/release-notes-test.sh, scripts/previous-minor-test.sh, scripts/release-image-test.sh, scripts/check-release-build-test.sh, scripts/go-build-tags-test.sh, scripts/ui-preview-test.sh, scripts/docs-site-test.sh, scripts/tofu-scripts-test.sh)
    cmds:
      - scripts/release-libraries-test.sh
      - scripts/release-notes-test.sh
      - scripts/previous-minor-test.sh
      - scripts/release-image-test.sh
      - scripts/check-release-build-test.sh
      - scripts/go-build-tags-test.sh
      - scripts/ui-preview-test.sh
      - scripts/docs-site-test.sh
      - scripts/tofu-scripts-test.sh

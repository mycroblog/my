# SPDX-License-Identifier: AGPL-3.0-only
#
# Dependabot version updates (ADR-0081). Security alerts come from the repository's Dependabot Alerts.
# The 3-day cooldown matches the rule that no dependency version younger than three days is installed
# (app/bunfig.toml, tools/i18n/bunfig.toml). Cooldown applies to version updates only, so security updates
# still open immediately.
#
# Each ecosystem groups its updates so that one pull request changes go.mod / bun.lock at a time, across its directories,
# instead of many pull requests conflicting on the same lockfile. Minor and patch updates share one group; a major
# update opens its own pull request, since it often needs code changes and would hold the rest back. Security
# updates are grouped separately and are not delayed by the version updates.
version: 2
updates:
  - package-ecosystem: gomod
    # `/` has go.work, so its update covers the modules listed there: Dependabot runs `go get` in each, `go work sync`,
    # and `go mod tidy` in each, and one pull request carries them, so the integration modules that `replace` the root
    # stay tidy. Direct dependencies only, the default: updating indirect ones breaks builds that a direct dependency
    # pins to an older version. /tools keeps versions of its own, outside the workspace; every requirement there is
    # `// indirect` (the `tool` directives), so version updates leave it alone and the tools are raised by hand.
    # pkg/mykit and pkg/mybot are raised by hand too: their go.mod reaches their users, and a bump there alone can
    # leave the integration modules untidy.
    directories:
      - /
      - /tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      go:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
      go-security:
        applies-to: security-updates
        patterns: ["*"]
  # Bun workspaces with a text bun.lock.
  - package-ecosystem: bun
    directories:
      - /app
      - /tools/i18n
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      bun:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
      bun-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # @types/node follows the Node.js major in .tool-versions: its major is raised together with Node.js,
      # so the types never offer APIs that the runtime lacks.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  # Workflows pin every action, GitHub's own included, to a release's commit SHA with the full version in a
  # trailing comment (`uses: owner/repo@<sha> # vX.Y.Z`): a moving major tag can point at a release younger
  # than three days, and Dependabot updates the SHA and the comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
  # The Go, Node.js, and Bun image tags in the Dockerfile must match .tool-versions (scripts/task.sh docker:dockerfile-check),
  # so they are raised by hand and their versions are ignored below; Dependabot raises the digests of the FROM lines.
  - package-ecosystem: docker
    directories:
      - /
      - /pkg/mybot/examples
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      docker:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
      docker-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: golang
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: node
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: oven/bun
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]

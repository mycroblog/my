#
# CodeQL configuration of the javascript-typescript analysis (codeql.yml). The analysis reads the sources without
# building them, so it is limited to the members of the Bun workspace: the documentation site, the TypeScript packages
# of mykit and mybot, and the i18n tool; generated files and build output are left out. Tests (*.test.ts) stay in:
# they can hold real mistakes, and an alert about a deliberate test input is dismissed as "used in tests".
paths:
  - web
  - pkg/mykit/ts
  - pkg/mybot/ts
  - tools/i18n
paths-ignore:
  - "**/*.gen.ts"
  - "**/node_modules"
  - "**/dist"
  - "**/.astro"

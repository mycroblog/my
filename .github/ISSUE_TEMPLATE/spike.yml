name: Spike
description: Time-boxed investigation to answer a question before deciding or implementing
title: "[Spike] "
labels: ["type:spike"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: Method
      description: What to build or measure. Throwaway code goes on an unmerged spike/<issue>-<slug> branch (ADR-0022).
  - type: input
    id: timebox
    attributes:
      label: Timebox
      placeholder: "e.g. 1 day of agent work"
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Expected output
      value: |
        - [ ] Findings report posted as a comment on this issue (code linked by commit permalink)
        - [ ] Conclusions written into the related ADR / docs via a separate PR
    validations:
      required: true
  - type: input
    id: adrs
    attributes:
      label: Related ADRs

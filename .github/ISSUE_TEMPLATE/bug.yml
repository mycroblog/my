name: Bug
description: Something does not work as specified
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Target and adapters
      placeholder: "self-hosted docker, sqlite, queue-db"

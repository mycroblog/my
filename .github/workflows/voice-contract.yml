name: Voice contract

# The voice.Transport contract of voice = livekit on a livekit-server --dev container (pkg/testkit/livekittest): the
# adapter's calls of LiveKit's Twirp API checked against the real server rather than the httptest stand-in that pull
# requests and merge groups run (ADR-0102 §2). They need Docker and pull an image, which the offline `check` does not
# (ADR-0015), so they run in the slow suite (slow-suite.yml, ADR-0079) and by hand on any branch.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Use exactly the Go version from .tool-versions; never auto-download another toolchain.
  GOTOOLCHAIN: local

jobs:
  voice-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      # The Go cache that main.yml builds, without saving one.
      - name: Set up Go
        uses: ./.github/actions/setup-go
      # testcontainers-go starts livekit/livekit-server on the runner's Docker; TEST_LIVEKIT=container makes the tests
      # run, and a missing Docker fail them instead of skipping.
      - name: go:test-voice
        run: scripts/task.sh go:test-voice

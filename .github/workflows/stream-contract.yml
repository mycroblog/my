name: Stream contract

# The stream.Bus contracts of internal/adapter/stream on broker containers (the valkey/valkey container of
# pkg/testkit/valkeytest, the Floci AWS emulator of pkg/testkit/awstest, the Pub/Sub emulator) instead of the in-process
# fakes (miniredis, the SNS / SQS fake of pkg/testkit/awstest, pstest) that pull requests and merge groups run
# (ADR-0050 §5). Part of the slow suite (slow-suite.yml, ADR-0079) and runnable by hand on any branch.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Use exactly the Go version from .tool-versions; never auto-download another toolchain.
  GOTOOLCHAIN: local
  # The runner is thrown away with every container on it, so testcontainers-go's reaper (Ryuk) has nothing to clean up,
  # and a reaper that is slow to start fails every test of a package.
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
  stream-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      # The Go cache that main.yml builds, without saving one.
      - name: Set up Go
        uses: ./.github/actions/setup-go
      # testcontainers-go starts the brokers on the runner's Docker; the target makes a missing Docker fail the job
      # instead of skipping the tests.
      - name: go:test-stream
        run: scripts/task.sh go:test-stream

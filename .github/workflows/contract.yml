name: Contract

run-name: Contract (${{ inputs.contract }})

# One contract of an adapter on its real service (ADR-0015 §3, ADR-0079 §5): the tests that the in-process stand-ins
# of pull requests and merge groups cannot decide. The task `scripts/task.sh go:test-<contract>` (tasks/go.yml) says
# what each one runs:
#
#   postgres  the PostgreSQL tests whose result can differ between pgmem and a real server, on a postgres container
#   stream    the stream.Bus contracts on broker containers (ADR-0050)
#   mail      the mail = smtp integration tests on Mailpit
#   blob      the BlobStore contract of blob = s3 on Garage
#   voice     the voice.Transport contract of voice = livekit on livekit-server --dev (ADR-0101)
#   search    the search.Index contracts on the search engines (ADR-0149)
#   acme      the instance.ACMEClient contract against Pebble, Let's Encrypt's test CA (ADR-0163)
#
# ci.yml calls it for the contracts of the adapters a merge group changes (scripts/changed-contracts.sh), and
# slow-suite.yml for all of them, each as the job `server-contract (<contract>)`; it runs by hand on any branch:
# `gh workflow run contract.yml --ref <branch> -f contract=postgres`. A contract a runner: their containers do not
# start in time side by side.
#
# To add a contract: a task `go:test-<name>` in tasks/go.yml, which makes a missing Docker fail the tests; its name
# here (the list above and the options below), in the matrix of slow-suite.yml's server-contract, and in the list
# `ALL` of scripts/changed-contracts.sh, with a `case` there of the paths that select it (its adapter, its contract
# suite, its test server). scripts/changed-contracts-test.sh fails while the four lists differ. ci.yml needs no
# change: its server-contract runs whatever contracts that script prints for a merge group.
#
# No concurrency group: in a called workflow the group would be evaluated in the caller's context.

on:
  workflow_call:
    inputs:
      contract:
        description: "The contract to run: the suffix of its task go:test-<contract>."
        type: string
        required: true
  workflow_dispatch:
    inputs:
      contract:
        description: "The contract to run."
        type: choice
        options: [postgres, stream, mail, blob, voice, search, acme]
        required: true

permissions:
  contents: read

env:
  # Use exactly the Go version from .tool-versions; never auto-download another toolchain.
  GOTOOLCHAIN: local
  # The runner is thrown away with every container on it, so testcontainers-go's reaper (Ryuk) has nothing to clean up,
  # and a reaper that is slow to start fails every test of a package.
  TESTCONTAINERS_RYUK_DISABLED: "true"

defaults:
  run:
    # Named, so that a step runs with `-o pipefail`.
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      # The Go cache of main.yml, without saving one: the packages are built as the checks build them.
      - name: Set up Go
        uses: ./.github/actions/setup-go
      # testcontainers-go starts the service on the runner's Docker (Pebble runs as a Go tool); the task makes a
      # missing Docker fail the tests instead of skipping them.
      - name: go:test-${{ inputs.contract }}
        env:
          CONTRACT: ${{ inputs.contract }}
        run: scripts/task.sh "go:test-$CONTRACT"

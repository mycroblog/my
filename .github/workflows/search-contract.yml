name: Search contract

# The search.Index contract of each search backend on a container of its engine (Elasticsearch, OpenSearch,
# Meilisearch): the adapters checked against the real engines, which the httptest unit tests that pull
# requests and merge groups run cannot do (ADR-0149 §14). They need Docker and pull images, which the offline `check` does not
# (ADR-0015), so they run in the slow suite (slow-suite.yml, ADR-0079) and by hand on any branch.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Use exactly the Go version from .tool-versions; never auto-download another toolchain.
  GOTOOLCHAIN: local

jobs:
  search-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      # The Go cache that main.yml builds, without saving one.
      - name: Set up Go
        uses: ./.github/actions/setup-go
      # testcontainers-go starts each engine on the runner's Docker; TEST_SEARCH=container makes the tests
      # run, and a missing Docker fail them instead of skipping.
      - name: go:test-search
        run: scripts/task.sh go:test-search

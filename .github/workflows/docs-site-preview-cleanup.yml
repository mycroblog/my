name: Docs site preview cleanup

# Deletes the Previews pr-<number> of the documentation Worker my-docs whose pull requests are closed or merged
# (ADR-0150 §7), once every 24 hours and on demand, with `scripts/docs-site.sh cleanup`: it lists the Previews of the
# Worker through the Cloudflare API and asks GitHub for the state of each pull request. A scheduled run and
# workflow_dispatch both run main's workflow and script in the environment `doc-site` (deployment refs: main and the
# tags v*), which holds the secret CLOUDFLARE_API_TOKEN and the variable CLOUDFLARE_ACCOUNT_ID. It never checks out or
# downloads anything of a pull request, and the token of GitHub reads pull requests only. Run it with the input
# `dry-run` to list what it would delete without deleting anything.

on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: List the Previews it would delete without deleting them
        type: boolean
        default: false

permissions: {}

concurrency:
  group: docs-site-preview-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: doc-site
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
      - name: Install wrangler
        run: scripts/docs-site.sh install
      - name: Delete the Previews of closed pull requests
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DOCS_SITE_WORK: ${{ runner.temp }}/docs-site
          DRY_RUN: ${{ inputs.dry-run && '1' || '' }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: scripts/docs-site.sh cleanup

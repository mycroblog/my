name: CodeQL

# CodeQL code scanning (advanced setup): follows untrusted values to SQL, HTML, paths, redirects, and the like, which
# the pattern checks of gosec (golangci-lint) do not. It is part of the slow suite of ADR-0079: slow-suite.yml calls it
# for the release gate and the nightly run (which makes it daily while main moves), and it runs by hand on any branch;
# never on pull requests, merge groups, or pushes to main, and it is not part of the required `check`. A caller grants
# the job's permissions below, security-events: write included. It sets no concurrency: a workflow-level group would be
# the caller's, and a release run and a nightly run would cancel each other's analysis.
# The results go to the repository's Security tab, one category per language. It runs the default query suite: the
# security-extended suite mostly adds log-injection alerts on slog calls, whose handlers already quote the values.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.name || matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Go is analyzed from the CGO_ENABLED=0 build of the main module (manual build mode; Go has no `none` mode,
          # and autobuild would guess the build instead of building the main module alone), in two jobs. The extractor
          # holds the syntax and types of every package of the build and its dependencies in memory at once, and the
          # dependency github.com/shibukawa/pgmem (an in-memory PostgreSQL of about 6 million lines that only the test
          # helper pkg/testkit/pgtest imports) takes most of it: one build of ./... outgrows the 16 GB of the runner.
          # The first job builds every package but pgtest; the second builds pgtest alone, under its own category.
          # Nothing outside tests imports pgtest, so no data flow crosses the two analyses.
          - language: go
            build-mode: manual
            go-exclude: github.com/mycroblog/my/pkg/testkit/pgtest
          - language: go
            build-mode: manual
            name: go, pgtest
            category: /language:go/pgtest
            go-packages: ./pkg/testkit/pgtest
          # Read without building: app/ (the Bun workspace) and tools/i18n, as configured in the config file.
          - language: javascript-typescript
            build-mode: none
            config-file: ./.github/codeql/javascript-typescript.yml
          # The workflows and composite actions under .github/.
          - language: actions
            build-mode: none
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
          cache: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ${{ matrix.config-file }}
      - name: Build the Go packages
        if: matrix.language == 'go'
        env:
          # Use exactly the Go version from .tool-versions; never auto-download another toolchain.
          GOTOOLCHAIN: local
          CGO_ENABLED: "0"
          # The extractor is a Go program that reads this too: it collects garbage before its heap passes the limit,
          # which leaves room below the 16 GB of the runner for the build that runs beside it.
          GOMEMLIMIT: 12GiB
          GO_PACKAGES: ${{ matrix.go-packages }}
          GO_EXCLUDE: ${{ matrix.go-exclude }}
        run: |
          if [ -n "$GO_PACKAGES" ]; then
            read -ra packages <<< "$GO_PACKAGES"
          else
            mapfile -t packages < <(go list ./... | grep -v -x -F "$GO_EXCLUDE")
          fi
          go build "${packages[@]}"
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: ${{ matrix.category || format('/language:{0}', matrix.language) }}

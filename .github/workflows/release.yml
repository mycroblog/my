name: Release

# The only way a release is made (ADR-0079): run by hand with a version on the commit to release
# (`gh workflow run release.yml --ref main -f version=v0.1.0`). It runs the slow suite (slow-suite.yml) on that commit
# (github.sha) and, only when every job of the suite passed, tags the commit and creates a draft GitHub Release.
# The decider reads the draft and publishes it. docs/operations/releasing.md describes the procedure.
#
# The notes (scripts/release-notes.sh): the release job creates the draft with the facts, derived from the repository.
# release-notes-prose then asks Claude for the prose and checks it by program, and release-notes-edit puts prose and
# facts in the draft. A failure of those two jobs leaves the facts in place and stops nothing, as the tags exist by then.
#
# The client libraries are released with the server at the same version (ADR-0093 §8, ADR-0094 §1): the release job
# tags the Go module pkg/mykit as pkg/mykit/vX.Y.Z at the same commit, and pkg/mybot as pkg/mybot/vX.Y.Z at a commit
# made on top of it whose pkg/mybot/go.mod requires pkg/mykit vX.Y.Z (on main it requires a placeholder replaced by
# ../mykit). The npm job publishes @mycroblog/mykit and then @mycroblog/mybot, which depends on @mycroblog/mykit X.Y.Z
# exactly, as X.Y.Z with npm's trusted publishing (OIDC, with provenance; no npm token exists), a pre-release to the
# dist-tag `next`. scripts/release-libraries.sh holds the steps that version them.
#
# The container image is built from the same commit (ADR-0142 §6). The image job pushes it to ghcr.io/mycroblog/my by
# digest, with no tag, so that nothing reaches an operator before the notes. image-check runs its binary on each
# platform, image-attest signs the provenance of the digest and attaches the digest to the draft as image-digest.txt,
# and image-scan reports its vulnerabilities for the decider to read. release-image.yml tags the digest when the decider
# publishes the release; nothing here tags an image.
#
# No release ever publishes a test build (docs/reference/build-tags.md): image-check runs scripts/check-release-build.sh
# on the binary of each platform, which fails on the test-only build tag e2e_fakes, before the digest is attested or
# attached; the Dockerfile refuses that tag and runs the same check on the binary it builds.
#
# The version is vX.Y.Z or vX.Y.Z-<pre-release>. A ref other than main takes a pre-release version only, so that the
# gate can be tried on a branch without making a release of it. The suite's upgrade job upgrades from the latest patch
# of the previous minor version; a pre-release may name another tag in `previous`, so that the job runs before any
# minor version exists (`-f version=v0.0.0-test.2 -f previous=v0.0.0-test.1`).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release: vX.Y.Z, or vX.Y.Z-<pre-release> (e.g. v0.1.0-rc.1)."
        type: string
        required: true
      previous:
        description: "Pre-releases only: the tag the upgrade test upgrades from instead of the previous minor version's latest patch."
        type: string
        default: ""

permissions: {}

# One release at a time; a second one waits instead of cancelling the first.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate the version and check that its tag does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          PREVIOUS: ${{ inputs.previous }}
          REF: ${{ github.ref }}
        run: |
          if ! [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::The version must be vX.Y.Z or vX.Y.Z-<pre-release>: $VERSION"
            exit 1
          fi
          if [ "$REF" != refs/heads/main ] && [[ "$VERSION" != *-* ]]; then
            echo "::error::$REF is not main: release it as a pre-release version (vX.Y.Z-<pre-release>)."
            exit 1
          fi
          if [ -n "$PREVIOUS" ] && [[ "$VERSION" != *-* ]]; then
            echo "::error::previous is for pre-releases only: $VERSION upgrades from the previous minor version."
            exit 1
          fi
          for tag in "$VERSION" "pkg/mykit/$VERSION" "pkg/mybot/$VERSION"; do
            if gh api "repos/$GH_REPO/git/ref/tags/$tag" > /dev/null 2>&1; then
              echo "::error::The tag $tag already exists."
              exit 1
            fi
          done

  slow-suite:
    needs: validate
    uses: ./.github/workflows/slow-suite.yml
    with:
      version: ${{ inputs.version }}
      previous: ${{ inputs.previous }}
    # The permissions of slow-suite.yml's CodeQL job.
    permissions:
      actions: read
      contents: read
      security-events: write

  release:
    # Runs only when the slow suite passed: a failed or cancelled suite skips this job, and nothing is tagged.
    needs: [validate, slow-suite]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      facts: ${{ steps.draft.outputs.facts }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every tag and commit, to compare with the previous release (scripts/release-notes.sh).
          fetch-depth: 0
          persist-credentials: false
      # For `go mod edit` (scripts/release-libraries.sh go-mod) and the reading of the notes' draft
      # (scripts/release-notes.sh); no module or build cache is needed.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
          cache: false
      - name: Tag the commit and the libraries, and create a draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          PREVIOUS: ${{ inputs.previous }}
          SHA: ${{ github.sha }}
        run: |
          mapfile -t libraries < <(scripts/release-libraries.sh go-tags "$VERSION")
          # The suite takes hours; check again that no one made the tags or the release in the meantime.
          for tag in "$VERSION" "${libraries[@]}"; do
            if gh api "repos/$GH_REPO/git/ref/tags/$tag" > /dev/null 2>&1; then
              echo "::error::The tag $tag already exists."
              exit 1
            fi
          done
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "::error::A release named $VERSION already exists."
            exit 1
          fi
          # pkg/mybot's tag needs a go.mod that requires pkg/mykit at this release's tag, which main cannot hold
          # before the tag exists: make a commit on top of the tested one that changes only pkg/mybot/go.mod (its
          # `replace` stays and is ignored by the module's users) and tag that. It is on no branch; the tag keeps it.
          scripts/release-libraries.sh go-mod "$VERSION" pkg/mybot/go.mod
          blob="$(jq -n --rawfile c pkg/mybot/go.mod '{content: $c, encoding: "utf-8"}' |
            gh api "repos/$GH_REPO/git/blobs" --input - -q .sha)"
          tree="$(gh api "repos/$GH_REPO/git/commits/$SHA" -q .tree.sha)"
          tree="$(jq -n --arg base "$tree" --arg blob "$blob" \
            '{base_tree: $base, tree: [{path: "pkg/mybot/go.mod", mode: "100644", type: "blob", sha: $blob}]}' |
            gh api "repos/$GH_REPO/git/trees" --input - -q .sha)"
          mybot="$(jq -n --arg tree "$tree" --arg parent "$SHA" --arg v "$VERSION" \
            '{message: "chore(release): pkg/mybot \($v) requires pkg/mykit \($v)", tree: $tree, parents: [$parent]}' |
            gh api "repos/$GH_REPO/git/commits" --input - -q .sha)"
          # A draft release makes no tag until it is published: create the tags first, the server's and pkg/mykit's at
          # the tested commit. The Go proxy takes a library's version from its tag, so nothing else publishes the Go
          # modules.
          for tag in "$VERSION" "${libraries[@]}"; do
            at="$SHA"
            if [ "$tag" = "pkg/mybot/$VERSION" ]; then at="$mybot"; fi
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$at" > /dev/null
            echo "Tagged $tag at $at." >> "$GITHUB_STEP_SUMMARY"
          done
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          # The facts of the notes (scripts/release-notes.sh) make the draft; the job release-notes-prose adds the prose.
          # The tags exist by now and the suite took hours, so a failure here only leaves the sections for the decider
          # to write, with no facts for the prose to start from.
          notes="$RUNNER_TEMP/notes"
          if scripts/release-notes.sh facts "$VERSION" "$PREVIOUS" "$notes"; then
            echo "facts=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::scripts/release-notes.sh failed: the draft has no generated sections."
            echo "The release notes' facts failed; write the sections by hand." >> "$GITHUB_STEP_SUMMARY"
            mkdir -p "$notes"
            scripts/release-notes.sh skeleton "$VERSION" "$PREVIOUS" > "$notes/body.md"
          fi
          gh release create "$VERSION" --draft --verify-tag --notes-file "$notes/body.md" \
            "${prerelease[@]}" --title "$VERSION"
          echo "Draft release $VERSION created at $SHA." >> "$GITHUB_STEP_SUMMARY"
      # The facts as they were read before the tags existed: the comparison would change after them.
      - name: Keep the facts for the prose
        if: steps.draft.outputs.facts == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes-facts
          path: ${{ runner.temp }}/notes/
          retention-days: 7

  # Writes the prose of the notes (scripts/release-notes.sh prose). Claude's API is reached by Workload Identity
  # Federation (ADR-0115) in the environment `release-notes`, as the L4 job of nightly.yml does in its own: only here
  # and in that job. Only `main` deploys to the environment, so a trial on a branch keeps the facts alone. The job reads
  # PR and issue text, which is untrusted input, with no permission to write: the model gets no tool, and the output is
  # an artifact that a program checked and that the next job puts in a draft for the decider to read.
  #
  # Nothing here may fail the release: the job holds its failures and the draft keeps the facts. The cost is bounded by
  # the bounds of the input, three attempts at most, and the spend limit of the Claude Console workspace (ADR-0115).
  release-notes-prose:
    needs: [validate, release]
    if: needs.release.outputs.facts == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    environment: release-notes
    permissions:
      contents: read
      id-token: write
      issues: read
      pull-requests: read
    outputs:
      body: ${{ steps.prose.outputs.body }}
    steps:
      # The whole history, for the merged PRs since the previous release.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
          cache: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
      - name: Fetch the facts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes-facts
          path: ${{ runner.temp }}/notes
      - name: Read the merged PRs and the closed issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/release-notes.sh prs "$RUNNER_TEMP/notes"
      # The version that claudeModel in tools/agentkit/cmd/releaseprose/claude.go must be known to.
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.308
      # Claude Code exchanges the GitHub OIDC token in ANTHROPIC_IDENTITY_TOKEN_FILE; the step writes the file before
      # the call and every 2 minutes while it runs, as GitHub's token expires about 5 minutes after it is issued.
      # The command exits with 0 when the calls fail, and body.md then has the facts alone. No GitHub token is in this
      # step's environment, and the command passes Claude Code only the ANTHROPIC_ variables.
      - name: Write the prose
        id: prose
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/anthropic-identity-token
          VERSION: ${{ inputs.version }}
        run: |
          set -o pipefail
          fetch_token() {
            curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" |
              jq -er .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE.next"
            mv "$ANTHROPIC_IDENTITY_TOKEN_FILE.next" "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          }
          fetch_token || echo "::warning::Could not fetch the GitHub OIDC token."
          ( while sleep 120; do fetch_token || echo "::warning::Could not refresh the GitHub OIDC token."; done ) &
          refresher=$!
          trap 'kill "$refresher"' EXIT
          scripts/release-notes.sh prose "$VERSION" "$RUNNER_TEMP/notes" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "body=true" >> "$GITHUB_OUTPUT"
      - name: Keep the body
        if: steps.prose.outputs.body == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes-body
          path: ${{ runner.temp }}/notes/body.md
          retention-days: 7

  # Puts the body in the draft, apart from the job that holds the identity token. It replaces only a draft that still has
  # the facts alone, so that a run again never overwrites what the decider edited or published.
  release-notes-edit:
    needs: [validate, release-notes-prose]
    if: needs.release-notes-prose.outputs.body == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Fetch the body
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes-body
          path: ${{ runner.temp }}/body
      - name: Edit the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          current="$(gh release view "$VERSION" --json isDraft,body \
            --jq 'if .isDraft and (.body | startswith("<!-- release-notes: facts only.")) then "replace" else "keep" end')"
          if [ "$current" != replace ]; then
            echo "The draft was edited or published: the prose stays out of it." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release edit "$VERSION" --notes-file "$RUNNER_TEMP/body/body.md"

  image:
    # Pushes the image of the tested commit by digest. No cache: a release is built from the pinned base images and the
    # lockfiles alone. Buildx's own provenance is off: it would be an unsigned copy of what image-attest signs. A failed
    # job can be rerun; a new digest leaves the old one unreferenced.
    needs: [validate, release]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the labels and annotations
        id: metadata
        env:
          VERSION: ${{ inputs.version }}
          SHA: ${{ github.sha }}
        run: |
          meta="$(scripts/release-image.sh metadata "$VERSION" "$SHA" "$(git show -s --format=%cI HEAD)")"
          {
            echo "labels<<EOF"
            echo "$meta"
            echo "EOF"
            echo "annotations<<EOF"
            sed 's/^/index,manifest:/' <<<"$meta"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      # BuildKit is pinned too: the driver's default is a moving tag.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          target: app
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ inputs.version }}
          no-cache: true
          sbom: true
          provenance: false
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          outputs: type=image,name=ghcr.io/mycroblog/my,push-by-digest=true,name-canonical=true,push=true

  image-check:
    # On a runner of each platform, so that the binary really runs, and with no write permission.
    needs: [validate, image]
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # For `go version -m` in scripts/check-release-build.sh.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
          cache: false
      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Check the binary of the image
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ inputs.version }}
        run: scripts/release-image.sh check "$DIGEST" "$PLATFORM" "$VERSION" | tee -a "$GITHUB_STEP_SUMMARY"

  image-attest:
    # Signs the provenance of the checked digest (keyless, with Sigstore's public instance) and hands the digest to the
    # draft, where release-image.yml reads it. A rerun adds another attestation of the same commit, which does no harm.
    needs: [validate, image, image-check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Attest the provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/mycroblog/my
          subject-digest: ${{ needs.image.outputs.digest }}
          push-to-registry: true
          # A storage record needs one more permission (artifact-metadata: write) and nothing here reads it.
          create-storage-record: false
      - name: Attach the digest to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DIGEST: ${{ needs.image.outputs.digest }}
          VERSION: ${{ inputs.version }}
        run: |
          echo "$DIGEST" > "$RUNNER_TEMP/image-digest.txt"
          gh release upload "$VERSION" "$RUNNER_TEMP/image-digest.txt" --clobber
          echo "Image: \`ghcr.io/mycroblog/my@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

  image-scan:
    # A report for the decider, in this job's summary. It stops nothing: the tags exist by now, and many findings have no
    # fix. Grype runs in its own container, pinned by digest, without any credentials (scripts/release-image.sh).
    # Nightly fails on the fixable findings of the versions already published.
    needs: [validate, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Scan the image
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: scripts/release-image.sh scan "ghcr.io/mycroblog/my@$DIGEST"

  npm:
    # Publishes the npm packages of the libraries once the commit is tagged. npm's trusted publishing authenticates this
    # job by its OIDC token (id-token: write) as the trusted publisher registered on each package (this repository and
    # release.yml; docs/operations/releasing.md), so no npm token exists, and npm adds the provenance statement.
    # Re-running the job after a failure skips a version that is already on the registry.
    needs: [validate, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No package cache: the packages this job publishes are built from the lockfile's packages alone.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      # The Node.js of .tool-versions, whose npm publishes. No registry-url: trusted publishing needs no token in .npmrc.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
      - name: Check the versions of Node.js and npm for trusted publishing
        run: |
          # npm's trusted publishing needs npm 11.5.1 or later on Node.js 22.14.0 or later.
          at_least() { [ "$(printf '%s\n%s\n' "$2" "$1" | sort -V | head -n1)" = "$2" ]; }
          node="$(node --version)"
          npm="$(npm --version)"
          if ! at_least "${node#v}" 22.14.0 || ! at_least "$npm" 11.5.1; then
            echo "::error::Trusted publishing needs Node.js 22.14.0 and npm 11.5.1 or later: Node.js $node, npm $npm."
            exit 1
          fi
      - name: Install the packages
        working-directory: app
        run: bun install --frozen-lockfile
      # mybot is built on mykit's build, as its users read it.
      - name: Build @mycroblog/mykit and @mycroblog/mybot
        run: |
          (cd pkg/mykit/ts && bun run build)
          (cd pkg/mybot/ts && bun run build)
      # After the build: npm publishes package.json as it is, with the release's version, and mybot's dependency on
      # @mycroblog/mykit (workspace:* in the repository) pinned to the same version.
      - name: Set the versions
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/release-libraries.sh npm-version "$VERSION" pkg/mykit/ts pkg/mybot/ts
      - name: Publish @mycroblog/mykit and @mycroblog/mybot
        env:
          VERSION: ${{ inputs.version }}
        run: |
          tag="$(scripts/release-libraries.sh npm-dist-tag "$VERSION")"
          # mykit first: mybot depends on that version of it.
          for dir in pkg/mykit/ts pkg/mybot/ts; do
            name="$(jq -r .name "$dir/package.json")"
            version="$(jq -r .version "$dir/package.json")"
            if [ "$(npm view "$name@$version" version 2> /dev/null)" = "$version" ]; then
              echo "$name@$version is already on the registry." >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            (cd "$dir" && npm publish --provenance --access public --tag "$tag")
            echo "Published $name@$version (dist-tag $tag) with provenance." >> "$GITHUB_STEP_SUMMARY"
          done

name: Release

# The only way a release is made (ADR-0079): run by hand with a version on the commit to release
# (`gh workflow run release.yml --ref main -f version=v0.1.0`). It runs the slow suite (slow-suite.yml) on that commit
# (github.sha) and, only when every job of the suite passed, tags the commit and creates a draft GitHub Release.
# The decider reviews the draft and publishes it. docs/operations/releasing.md describes the procedure.
#
# The client libraries are released with the server at the same version (ADR-0093 §8): the release job tags the Go
# module pkg/mykit as pkg/mykit/vX.Y.Z at the same commit, and the npm job publishes @mycroblog/mykit as X.Y.Z with
# npm's trusted publishing (OIDC, with provenance; no npm token exists), a pre-release to the dist-tag `next`.
# scripts/release-libraries.sh holds the steps that version them.
#
# The version is vX.Y.Z or vX.Y.Z-<pre-release>. A ref other than main takes a pre-release version only, so that the
# gate can be tried on a branch without making a release of it.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release: vX.Y.Z, or vX.Y.Z-<pre-release> (e.g. v0.1.0-rc.1)."
        type: string
        required: true

permissions: {}

# One release at a time; a second one waits instead of cancelling the first.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate the version and check that its tag does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          REF: ${{ github.ref }}
        run: |
          if ! [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::The version must be vX.Y.Z or vX.Y.Z-<pre-release>: $VERSION"
            exit 1
          fi
          if [ "$REF" != refs/heads/main ] && [[ "$VERSION" != *-* ]]; then
            echo "::error::$REF is not main: release it as a pre-release version (vX.Y.Z-<pre-release>)."
            exit 1
          fi
          for tag in "$VERSION" "pkg/mykit/$VERSION"; do
            if gh api "repos/$GH_REPO/git/ref/tags/$tag" > /dev/null 2>&1; then
              echo "::error::The tag $tag already exists."
              exit 1
            fi
          done

  slow-suite:
    needs: validate
    uses: ./.github/workflows/slow-suite.yml
    # The permissions of slow-suite.yml's CodeQL job.
    permissions:
      actions: read
      contents: read
      security-events: write

  release:
    # Runs only when the slow suite passed: a failed or cancelled suite skips this job, and nothing is tagged.
    needs: [validate, slow-suite]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag the commit and the libraries, and create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          SHA: ${{ github.sha }}
        run: |
          mapfile -t libraries < <(scripts/release-libraries.sh go-tags "$VERSION")
          # The suite takes hours; check again that no one made the tags or the release in the meantime.
          for tag in "$VERSION" "${libraries[@]}"; do
            if gh api "repos/$GH_REPO/git/ref/tags/$tag" > /dev/null 2>&1; then
              echo "::error::The tag $tag already exists."
              exit 1
            fi
          done
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "::error::A release named $VERSION already exists."
            exit 1
          fi
          # A draft release makes no tag until it is published: create the tags first, at the tested commit. The Go
          # proxy takes a library's version from its tag (pkg/mykit/vX.Y.Z), so nothing else publishes the Go modules.
          for tag in "$VERSION" "${libraries[@]}"; do
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$SHA" > /dev/null
            echo "Tagged $tag at $SHA." >> "$GITHUB_STEP_SUMMARY"
          done
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          # The libraries' section (scripts/release-libraries.sh notes) comes before the generated list of changes;
          # the decider fills it in before publishing the release.
          scripts/release-libraries.sh notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "$VERSION" --draft --verify-tag --generate-notes --notes-file "$RUNNER_TEMP/notes.md" \
            "${prerelease[@]}" --title "$VERSION"
          echo "Draft release $VERSION created at $SHA." >> "$GITHUB_STEP_SUMMARY"

      # M5 (#30) adds the release artefacts here, after the draft exists and before it is published: publishing the
      # container images of the tagged commit and writing the release notes.

  npm:
    # Publishes the npm packages of the libraries once the commit is tagged. npm's trusted publishing authenticates this
    # job by its OIDC token (id-token: write) as the trusted publisher registered on each package (this repository and
    # release.yml; docs/operations/releasing.md), so no npm token exists, and npm adds the provenance statement.
    # Re-running the job after a failure skips a version that is already on the registry.
    needs: [validate, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No package cache: the packages this job publishes are built from the lockfile's packages alone.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      # The Node.js of .tool-versions, whose npm publishes. No registry-url: trusted publishing needs no token in .npmrc.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
      - name: Check the versions of Node.js and npm for trusted publishing
        run: |
          # npm's trusted publishing needs npm 11.5.1 or later on Node.js 22.14.0 or later.
          at_least() { [ "$(printf '%s\n%s\n' "$2" "$1" | sort -V | head -n1)" = "$2" ]; }
          node="$(node --version)"
          npm="$(npm --version)"
          if ! at_least "${node#v}" 22.14.0 || ! at_least "$npm" 11.5.1; then
            echo "::error::Trusted publishing needs Node.js 22.14.0 and npm 11.5.1 or later: Node.js $node, npm $npm."
            exit 1
          fi
      - name: Install the packages
        working-directory: app
        run: bun install --frozen-lockfile
      - name: Build @mycroblog/mykit
        working-directory: pkg/mykit/ts
        run: bun run build
      # After the build: npm publishes package.json as it is, with the release's version.
      - name: Set the version
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/release-libraries.sh npm-version "$VERSION" pkg/mykit/ts
      - name: Publish @mycroblog/mykit
        working-directory: pkg/mykit/ts
        env:
          VERSION: ${{ inputs.version }}
        run: |
          name="$(jq -r .name package.json)"
          version="$(jq -r .version package.json)"
          tag="$(../../../scripts/release-libraries.sh npm-dist-tag "$VERSION")"
          if [ "$(npm view "$name@$version" version 2> /dev/null)" = "$version" ]; then
            echo "$name@$version is already on the registry." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npm publish --provenance --access public --tag "$tag"
          echo "Published $name@$version (dist-tag $tag) with provenance." >> "$GITHUB_STEP_SUMMARY"

name: Web E2E

# Playwright E2E of the web client (ADR-0015, ADR-0027) in three stages (ADR-0047): one build of app/web/dist and
# bin/my, Playwright `--shard` jobs that all test that same build, and one HTML report merged from the shards' blob
# reports. The slow suite (slow-suite.yml, ADR-0079) calls it with the full width × locale matrix
# (app/web/playwright.config.ts) on 8 shards. Pull requests never start it on their own: run it by hand on any branch
# with `gh workflow run web-e2e.yml --ref <branch>` (or the Actions tab), with the default subset (`matrix: pr`) on
# 4 shards or `-f matrix=full`.

on:
  workflow_call:
    inputs:
      matrix:
        description: "`pr` for the default subset, `full` for every width × locale project."
        type: string
        required: true
      shards:
        description: "The number of shard jobs; 0 picks 4 for `pr` and 8 for `full`."
        type: number
        default: 0
      workers:
        description: "Playwright workers in each shard job."
        type: number
        default: 2
  workflow_dispatch:
    inputs:
      matrix:
        description: "`pr` for the default subset, `full` for every width × locale project."
        type: choice
        options: [pr, full]
        default: pr
      shards:
        description: "The number of shard jobs; 0 picks 4 for `pr` and 8 for `full`."
        type: number
        default: 0
      workers:
        description: "Playwright workers in each shard job."
        type: number
        default: 2

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.shards.outputs.list }}
      total: ${{ steps.shards.outputs.total }}
    steps:
      - name: List the shards
        id: shards
        env:
          MATRIX: ${{ inputs.matrix }}
          SHARDS: ${{ inputs.shards }}
        run: |
          total="$SHARDS"
          if [ "$total" -le 0 ]; then
            if [ "$MATRIX" = full ]; then total=8; else total=4; fi
          fi
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "list=$(jq -nc --argjson n "$total" '[range(1; $n + 1)]')" >> "$GITHUB_OUTPUT"
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      # Use the Node.js from .tool-versions (ADR-0025).
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
      - name: Restore the Bun package cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('app/bun.lock', 'tools/i18n/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
          cache-dependency-path: |
            go.mod
            go.sum
      # go:bin builds app/web/dist (vite preview serves it) and bin/my with it embedded (e2e/server.ts
      # starts it), and generates the client pseudo-locales, which the specs read and the repository does not
      # commit (ADR-0081).
      - name: go:bin
        run: scripts/task.sh go:bin
      # Artifacts drop file modes, so the build travels as a tarball that keeps bin/my executable.
      - name: Pack the build
        run: tar -cf "$RUNNER_TEMP/e2e-build.tar" bin/my app/web/dist locales/en-XA/client* locales/ar-XB/client*
      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-build-${{ inputs.matrix }}-w${{ inputs.workers }}
          path: ${{ runner.temp }}/e2e-build.tar
          retention-days: 1

  shard:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.build.outputs.shards) }}
    name: shard ${{ matrix.shard }}/${{ needs.build.outputs.total }}
    # The official Playwright image, pinned by digest, provides the browsers and their system libraries.
    # Its tag must match @playwright/test in app/web/package.json, and it must equal PLAYWRIGHT_IMAGE in Taskfile.yml
    # (`scripts/task.sh web:playwright-image-check`).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    env:
      E2E_MATRIX: ${{ inputs.matrix }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The image lacks the unzip that setup-bun extracts Bun with.
      - name: Install unzip
        run: apt-get update && apt-get install -y --no-install-recommends unzip
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      # Use the Node.js from .tool-versions rather than the image's (ADR-0025).
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-e2e-${{ runner.os }}-${{ hashFiles('app/bun.lock') }}
          restore-keys: bun-e2e-${{ runner.os }}-
      - name: Install the client packages
        working-directory: app
        run: bun install --frozen-lockfile
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-build-${{ inputs.matrix }}-w${{ inputs.workers }}
          path: ${{ runner.temp }}
      - name: Unpack the build
        run: tar -xf "$RUNNER_TEMP/e2e-build.tar"
      - name: playwright test --shard=${{ matrix.shard }}/${{ needs.build.outputs.total }}
        working-directory: app/web
        env:
          SHARD: ${{ matrix.shard }}/${{ needs.build.outputs.total }}
          WORKERS: ${{ inputs.workers }}
          # The job runs as root, but the runner sets HOME to /github/home, owned by another user, and Firefox
          # refuses to start then.
          HOME: /root
        run: bun run playwright test --shard="$SHARD" --workers="$WORKERS" --reporter=github,blob
      - name: Upload the blob report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: e2e-blob-${{ inputs.matrix }}-w${{ inputs.workers }}-${{ matrix.shard }}
          path: app/web/blob-report/
          retention-days: 1

  report:
    # Merges the blob reports even when shards failed; a cancelled run skips it.
    needs: [build, shard]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
      - name: Restore the Bun package cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('app/bun.lock', 'tools/i18n/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install the client packages
        working-directory: app
        run: bun install --frozen-lockfile
      - name: Download the blob reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-blob-${{ inputs.matrix }}-w${{ inputs.workers }}-*
          path: ${{ runner.temp }}/blob-reports
          merge-multiple: true
      - name: playwright merge-reports
        working-directory: app/web
        run: bun run playwright merge-reports --reporter html "$RUNNER_TEMP/blob-reports"
      # The merged report holds every shard's results and the traces of the failed tests.
      - name: Upload the Playwright report
        if: ${{ needs.shard.result != 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ inputs.matrix }}
          path: app/web/playwright-report/
          retention-days: 7

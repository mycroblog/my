name: Main

# The caches that pull requests and merge groups restore (ADR-0079). A main commit is the head of a merge group that
# the merge queue has already checked, so a push to main checks nothing: it only builds the caches, which only main can
# share (a cache saved on a pull request or a merge group ref serves that ref alone). Each job first looks its key up
# and does nothing when the cache already exists, so most pushes finish in seconds.

on:
  push:
    branches: [main]

permissions:
  contents: read

# One group for main, never cancelled: a cancelled build would leave the day without its cache, and the runs after the
# first of the day only look the keys up.
concurrency:
  group: main
  cancel-in-progress: false

env:
  # Use exactly the Go version from .tool-versions; never auto-download another toolchain.
  GOTOOLCHAIN: local

jobs:
  go-cache:
    # The Go module, build, and golangci-lint cache that .github/actions/setup-go restores in ci.yml,
    # postgres-contract.yml, stream-contract.yml, mail-integration.yml, and voice-contract.yml. It is built from empty directories once a day (the date is in the
    # key) and for each new Go or go.sum, so it holds one build's worth of entries instead of growing with every push.
    # It holds exactly what the jobs that restore it read, built one after another with their settings (setup-go sets
    # CGO_ENABLED=0 in both): the modules, the builds of the packages and the Go tools (go:warm), the test binaries
    # (server-test), go vet's results (server-static), agentkit's, pkg/mykit's, and pkg/mybot's builds with their integration tests (repo), and golangci-lint's analysis (the lint
    # job of pull requests). It checks nothing: golangci-lint does not fail on issues here. Of the modules it holds the
    # downloaded zips alone, which restore in a tenth of the time of the extracted tree: go extracts the ones a build
    # needs from them, offline.
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: ./.github/actions/setup-go
        id: go
        with:
          restore: false
      # The paths must equal those of .github/actions/setup-go: they are part of the cache's version.
      - name: Look up the Go cache
        id: lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: ${{ steps.go.outputs.key }}
          lookup-only: true
      - name: Set up go-task
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-task
      - name: Install golangci-lint
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v${{ steps.go.outputs.golangci-lint }}
          install-only: true
      - name: Build the packages and the Go tools
        if: steps.lookup.outputs.cache-hit != 'true'
        run: scripts/task.sh go:warm agentkit:warm mykit:warm
      - name: Build the test binaries
        if: steps.lookup.outputs.cache-hit != 'true'
        run: go test -run '^$' ./...
      - name: Run go vet
        if: steps.lookup.outputs.cache-hit != 'true'
        run: |
          go vet ./...
          (cd tools/agentkit && go vet ./...)
      - name: Run golangci-lint for its cache
        if: steps.lookup.outputs.cache-hit != 'true'
        run: |
          golangci-lint run --issues-exit-code=0 ./...
          (cd tools/agentkit && golangci-lint run --issues-exit-code=0 ./...)
      - name: Save the Go cache
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: ${{ steps.go.outputs.key }}

  bun-cache:
    # The Bun package cache that .github/actions/setup-bun restores in ci.yml, and of web-e2e.yml's build, keyed by
    # the lockfiles alone.
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      ui: ${{ steps.ui.outputs.missing }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Look up the Bun package cache
        id: lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('app/bun.lock', 'tools/i18n/bun.lock') }}
          lookup-only: true
      # The bun-ui cache is saved in the Playwright image, whose tar compresses with gzip instead of zstd: that changes
      # the cache's version, so actions/cache cannot look it up from here. The bun-ui-cache job pulls the image only
      # when main has no cache of that key.
      - name: Look up the Bun package cache of the story tests
        id: ui
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: bun-ui-${{ runner.os }}-${{ hashFiles('app/bun.lock') }}
        run: |
          n="$(gh cache list -R "$GITHUB_REPOSITORY" --ref refs/heads/main --key "$KEY" --json key \
            --jq "map(select(.key == \"$KEY\")) | length")"
          if [ "$n" = 0 ]; then echo missing=true; else echo missing=false; fi >> "$GITHUB_OUTPUT"
      - name: Set up go-task
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-task
      - name: Set up Bun
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - name: Install the client and i18n tool packages
        if: steps.lookup.outputs.cache-hit != 'true'
        run: scripts/task.sh --parallel web:install i18n:install
      - name: Save the Bun package cache
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('app/bun.lock', 'tools/i18n/bun.lock') }}

  bun-ui-cache:
    # The Bun package cache that ui-test.yml restores, saved in the same image: the container's home differs from the
    # runner's.
    needs: bun-cache
    if: needs.bun-cache.outputs.ui == 'true'
    runs-on: ubuntu-latest
    # Must equal the image of ui-test.yml.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      # The image lacks the unzip that setup-bun extracts Bun with.
      - name: Install unzip
        run: apt-get update && apt-get install -y --no-install-recommends unzip
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - name: Install the client packages
        run: scripts/task.sh web:install
      - name: Save the Bun package cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-ui-${{ runner.os }}-${{ hashFiles('app/bun.lock') }}

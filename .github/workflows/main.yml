name: Main

# The caches that pull requests and merge groups restore (ADR-0079). A main commit is the head of a merge group that
# the merge queue has already checked, so a push to main checks nothing: it only builds the caches, which only main can
# share (a cache saved on a pull request or a merge group ref serves that ref alone). Each job first looks its key up
# and does nothing when the cache already exists, so most pushes finish in seconds.

on:
  push:
    branches: [main]

permissions:
  contents: read

# One group for main, never cancelled: a cancelled build would leave the day without its cache, and the runs after the
# first of the day only look the keys up.
concurrency:
  group: main
  cancel-in-progress: false

env:
  # Use exactly the Go version from .tool-versions; never auto-download another toolchain.
  GOTOOLCHAIN: local

jobs:
  go-cache:
    # The Go module, build, test result, and golangci-lint cache that .github/actions/setup-go restores in ci.yml and
    # the contract workflows (ADR-0079 §7). Every push restores this week's cache, runs the Go tests so that their
    # results are cached (a merge group then runs only the tests whose packages or files changed since), adds the
    # builds, vet's results, and golangci-lint's analysis, saves it under a key of its own, and deletes the Go caches
    # it replaces, so that one stays (the repository holds 10 GB of caches). A new week starts from empty, which keeps
    # it to a week of entries. The test run's failure does not fail the job: main is already merged, and the merge
    # queue checked it; the job warns instead. Everything runs with the settings of the jobs that restore it
    # (setup-go sets CGO_ENABLED=0 and GOWORK=off; go:test runs as server-test runs it).
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: ./.github/actions/setup-go
        id: go
        with:
          restore: false
      - name: Pick the keys
        id: keys
        env:
          SUMS: ${{ steps.go.outputs.sums }}
        run: |
          week="$(date -u +%G%V)"
          echo "prefix=${SUMS}w${week}-" >> "$GITHUB_OUTPUT"
          echo "key=${SUMS}w${week}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
      # The paths must equal those of .github/actions/setup-go: they are part of the cache's version.
      - name: Restore this week's Go cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: ${{ steps.keys.outputs.key }}
          restore-keys: ${{ steps.keys.outputs.prefix }}
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v${{ steps.go.outputs.golangci-lint }}
          install-only: true
      - name: Build the packages and the Go tools
        run: scripts/task.sh go:warm agentkit:warm mykit:warm
      # The files' mtimes from their content, as server-test sets them: Go keys a file a test opens on its mtime.
      - name: Set the files' mtimes from their content
        run: scripts/stable-mtime.py
      # As server-test runs it, so that the results match what a merge group looks up.
      - name: go:test (for the test result cache)
        env:
          TEST_VALKEY_REQUIRED: "1"
        run: |
          if ! scripts/task.sh go:test; then
            echo "::warning::go test failed on main; the failed packages' results are not cached."
            echo "go test failed on main at $GITHUB_SHA: the merge queue passed this commit, so look for a flaky test." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Run go vet
        run: |
          go vet ./...
          (cd tools/agentkit && go vet ./...)
      - name: Run golangci-lint for its cache
        run: |
          golangci-lint run --issues-exit-code=0 ./...
          (cd tools/agentkit && golangci-lint run --issues-exit-code=0 ./...)
      - name: Save the Go cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod/cache/download
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: ${{ steps.keys.outputs.key }}
      - name: Delete the Go caches this one replaces
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OS_PREFIX: ${{ steps.go.outputs.os }}
          KEY: ${{ steps.keys.outputs.key }}
        run: |
          gh cache list --ref refs/heads/main --key "$OS_PREFIX" --limit 100 --json id,key \
            --jq ".[] | select(.key != \"$KEY\") | .id" | xargs -r -n 1 gh cache delete

  bun-cache:
    # The Bun package cache that .github/actions/setup-bun restores in ci.yml, and of web-e2e.yml's build, keyed by
    # the lockfiles alone.
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      ui: ${{ steps.ui.outputs.missing }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Look up the Bun package cache
        id: lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('app/bun.lock', 'tools/i18n/bun.lock') }}
          lookup-only: true
      # The bun-ui cache is saved in the Playwright image, whose tar compresses with gzip instead of zstd: that changes
      # the cache's version, so actions/cache cannot look it up from here. The bun-ui-cache job pulls the image only
      # when main has no cache of that key.
      - name: Look up the Bun package cache of the story tests
        id: ui
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: bun-ui-${{ runner.os }}-${{ hashFiles('app/bun.lock') }}
        run: |
          n="$(gh cache list -R "$GITHUB_REPOSITORY" --ref refs/heads/main --key "$KEY" --json key \
            --jq "map(select(.key == \"$KEY\")) | length")"
          if [ "$n" = 0 ]; then echo missing=true; else echo missing=false; fi >> "$GITHUB_OUTPUT"
      - name: Set up go-task
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-task
      - name: Set up Bun
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - name: Install the client and i18n tool packages
        if: steps.lookup.outputs.cache-hit != 'true'
        run: scripts/task.sh --parallel web:install i18n:install
      - name: Save the Bun package cache
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('app/bun.lock', 'tools/i18n/bun.lock') }}

  bun-ui-cache:
    # The Bun package cache that ui-test.yml restores, saved in the same image: the container's home differs from the
    # runner's.
    needs: bun-cache
    if: needs.bun-cache.outputs.ui == 'true'
    runs-on: ubuntu-latest
    # Must equal the image of ui-test.yml.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      # The image lacks the unzip that setup-bun extracts Bun with.
      - name: Install unzip
        run: apt-get update && apt-get install -y --no-install-recommends unzip
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - name: Install the client packages
        run: scripts/task.sh web:install
      - name: Save the Bun package cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-ui-${{ runner.os }}-${{ hashFiles('app/bun.lock') }}

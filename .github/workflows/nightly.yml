name: Nightly

# A run of some of the jobs is titled for them, as `Nightly (l4)`. A run titled just `Nightly` is a full one: it ran every
# job, or, on a schedule, skipped them because a full run had already passed on this commit. The `changes` job and the
# check before a release (docs/agents/releasing.md) read this title.
run-name: ${{ inputs.jobs && inputs.jobs != 'all' && format('Nightly ({0})', inputs.jobs) || 'Nightly' }}

# Every night on the head of main: the slow suite (slow-suite.yml, ADR-0079), so that a regression in the checks too
# slow for the merge queue is found within a day, the web E2E of the demo server (ADR-0015), and the L4 task tests of
# the screens (ADR-0015). A scheduled run is skipped when main has not moved since the last successful full run; a run
# by hand always runs (`gh workflow run nightly.yml`, with `-f jobs=l4`, `-f jobs=demo-e2e`, `-f jobs=slow-suite`, or
# `-f jobs=image-scan` for one of them). The scan of the published images runs every night, whether or not main moved.
# The report job files the failures of a full run on main as an issue (scripts/nightly-report.sh).
# When the slow suite passes on main, the nightly-image jobs publish the image of that commit as
# ghcr.io/mycroblog/my:nightly (ADR-0010 §5), with no git tag and no GitHub Release.

on:
  schedule:
    - cron: "0 18 * * *" # 03:00 JST
  workflow_dispatch:
    inputs:
      jobs:
        description: "The jobs to run: `all`, `slow-suite`, `demo-e2e` (the web E2E of the demo server), `l4` (the L4 task tests), or `image-scan` (the published images)."
        type: choice
        options: [all, slow-suite, demo-e2e, l4, image-scan]
        default: all
      screens:
        description: "L4: the screens to measure, by the names of their L1 files (`badges,settings-menu`); empty for every screen."
        type: string
        default: ""
      l4_dry_run:
        description: "L4: do everything but call the agent (no Claude API use, no issues)."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.compare.outputs.run }}
      since: ${{ steps.compare.outputs.since }}
    steps:
      # A skipped run succeeds with the same head, so the comparison holds until main moves. A partial run never counts,
      # even `slow-suite` alone: the other jobs still have to run on its commit. `since` is the head of the last
      # successful full run, from which the L4 job picks the screens that changed. When none of the latest 100 successful
      # runs is a full one, tonight's run is.
      - name: Compare main with the last successful full run
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" != schedule ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last="$(gh api "repos/$GH_REPO/actions/workflows/nightly.yml/runs?branch=main&status=success&per_page=100" \
            --jq '[.workflow_runs[] | select(.display_title == "Nightly")][0].head_sha // ""')"
          if [ "$last" = "$HEAD_SHA" ]; then
            echo "main ($HEAD_SHA) has not moved since the last successful full run: skipping the nightly jobs."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Last successful full run: ${last:-none}; main: $HEAD_SHA."
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "since=$last" >> "$GITHUB_OUTPUT"
          fi

  slow-suite:
    needs: changes
    if: needs.changes.outputs.run == 'true' && inputs.jobs != 'l4' && inputs.jobs != 'demo-e2e' && inputs.jobs != 'image-scan'
    uses: ./.github/workflows/slow-suite.yml
    # The permissions of slow-suite.yml's CodeQL job.
    permissions:
      actions: read
      contents: read
      security-events: write

  # A red Nightly stops the line (ADR-0079 §8): on a full run of main, opens the issue of the failing Nightly or comments
  # on the open one, with the failed jobs and the commits since the last green run, and closes it when the Nightly
  # passes again (scripts/nightly-report.sh). It also lists the E2E tests that passed only on a retry. A partial run
  # by hand, a run on another branch, and a run that a newer one cancelled report nothing.
  report:
    needs: [changes, slow-suite, demo-e2e, nightly-image, nightly-image-check, nightly-image-attest, nightly-image-tag]
    if: ${{ always() && needs.changes.outputs.run == 'true' && (inputs.jobs == '' || inputs.jobs == 'all') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the list of flaky tests
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-flaky-full
          path: ${{ runner.temp }}/flaky
      - name: Report the Nightly
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULTS: ${{ toJSON(needs) }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          SINCE: ${{ needs.changes.outputs.since }}
          FLAKY: ${{ runner.temp }}/flaky/flaky.txt
        run: |
          # The changes job itself is not a check of main.
          RESULTS="$(jq 'del(.changes)' <<< "$RESULTS")" scripts/nightly-report.sh

  # The published images of the two latest minor versions, which operators upgrade through: a failure means a fixable
  # HIGH or above in a published version, not a fault of main, and the answer is a patch release (ADR-0010 §8). It runs
  # without a token, so it reads only what an operator can pull, and passes while no image is public.
  image-scan:
    if: inputs.jobs == '' || inputs.jobs == 'all' || inputs.jobs == 'image-scan'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan the latest patch of each minor version
        run: |
          list="$(scripts/release-image.sh list-tags | scripts/release-image.sh series)"
          if [ -z "$list" ]; then
            echo "No public image to scan." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          status=0
          for tag in $list; do
            scripts/release-image.sh scan --fail "ghcr.io/mycroblog/my:$tag" || status=1
          done
          exit "$status"

  # The image of the commit whose slow suite passed, built and checked as a release's is (release.yml: both platforms,
  # SBOM, no cache, check-release-build.sh, a provenance attestation) and tagged `nightly` alone (ADR-0010 §5): no
  # sha-<commit> tag, so a build is pinned by its digest, and no git tag or GitHub Release. Its version is a
  # pseudo-version after the latest release tag (scripts/release-image.sh nightly-version), which `my version` and
  # NodeInfo report. An older nightly image stays as an untagged version: nothing deletes it, as a deletion of
  # untagged versions by age would also take the per-platform manifests of the release images.
  nightly-image:
    needs: slow-suite
    if: needs.slow-suite.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tags, for the latest release that the version follows.
          fetch-depth: 0
          persist-credentials: false
      - name: Read the version, the labels, and the annotations
        id: metadata
        env:
          SHA: ${{ github.sha }}
        run: |
          latest="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)"
          time="$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)"
          version="$(scripts/release-image.sh nightly-version "$latest" "$SHA" "$time")"
          meta="$(scripts/release-image.sh metadata "$version" "$SHA" "$(git show -s --format=%cI HEAD)" "$SHA")"
          {
            echo "version=$version"
            echo "labels<<EOF"
            echo "$meta"
            echo "EOF"
            echo "annotations<<EOF"
            sed 's/^/index,manifest:/' <<<"$meta"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      # BuildKit is pinned too: the driver's default is a moving tag.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          target: app
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.metadata.outputs.version }}
          no-cache: true
          sbom: true
          provenance: false
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          outputs: type=image,name=ghcr.io/mycroblog/my,push-by-digest=true,name-canonical=true,push=true

  nightly-image-check:
    # On a runner of each platform, so that the binary really runs, and with no write permission.
    needs: nightly-image
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # For `go version -m` in scripts/check-release-build.sh.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
          cache: false
      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Check the binary of the image
        env:
          DIGEST: ${{ needs.nightly-image.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.nightly-image.outputs.version }}
        run: scripts/release-image.sh check "$DIGEST" "$PLATFORM" "$VERSION" | tee -a "$GITHUB_STEP_SUMMARY"

  nightly-image-attest:
    # As release.yml's image-attest: kept in the repository's attestations, not pushed to ghcr.io (ADR-0010 §8).
    needs: [nightly-image, nightly-image-check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Attest the provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/mycroblog/my
          subject-digest: ${{ needs.nightly-image.outputs.digest }}
          push-to-registry: false
          # A storage record needs one more permission (artifact-metadata: write) and nothing here reads it.
          create-storage-record: false

  # Moves `nightly` to the checked and attested digest, the last step, so that the tag never names an image that failed
  # a check.
  nightly-image-tag:
    needs: [nightly-image, nightly-image-attest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tag the image nightly
        env:
          DIGEST: ${{ needs.nightly-image.outputs.digest }}
          VERSION: ${{ needs.nightly-image.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          scripts/release-image.sh tag "$DIGEST" nightly | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo
            echo "Version \`$VERSION\` of $SHA. To pin this build:"
            echo
            echo '```'
            echo "ghcr.io/mycroblog/my:nightly@$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The web E2E of the demo server (app/web/e2e/demo-*.spec.ts, the project `demo-chromium`, ADR-0015 §8): the demo
  # scenario signs in, a second run of the seed adds nothing, a password reset arrives in Mailpit, and a reply reaches
  # the Service Worker as a Web Push notification through the fake push service (ADR-0015 §12). The specs need
  # the test build of `bin/my` (`GO_TAGS=e2e_fakes`) and Mailpit, so they run here every night rather than in the
  # merge queue. The demo server has Web Push on: `node e2e/server.ts demo` starts the test build's fake push service
  # (`my dev push-service`) with the certificate that start-mailpit's scripts/mailpit-cert.sh writes, here and in the
  # l4 job alike. The test build stays in the job and is never uploaded.
  demo-e2e:
    needs: changes
    if: needs.changes.outputs.run == 'true' && inputs.jobs != 'l4' && inputs.jobs != 'slow-suite' && inputs.jobs != 'image-scan'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The Playwright image of the l4 job below (`scripts/task.sh web:playwright-image-check`).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    steps:
      # The image lacks the unzip that setup-bun extracts Bun with.
      - name: Install unzip
        run: apt-get update && apt-get install -y --no-install-recommends unzip
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The job runs as root in the container, and the workspace belongs to the runner's user: git refuses the
      # checkout as of dubious ownership, and go build cannot stamp the VCS information of bin/my without it.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Set up Bun and Node
        uses: ./.github/actions/setup-bun
      - name: Set up Go
        uses: ./.github/actions/setup-go
      - name: Start Mailpit
        uses: ./.github/actions/start-mailpit
        with:
          container-id: ${{ job.container.id }}
      - name: go:bin (the test build)
        run: scripts/task.sh go:bin GO_TAGS=e2e_fakes
      - name: playwright test --project=demo-chromium
        working-directory: app/web
        env:
          E2E_DEMO: "1"
          # The job runs as root, but the runner sets HOME to /github/home, owned by another user.
          HOME: /root
        run: bun run playwright test --project=demo-chromium
      - name: Upload the report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-e2e-report
          path: |
            app/web/playwright-report/
            app/web/test-results/
          retention-days: 14

  # The L4 task tests (ADR-0110 §7, ADR-0015; `scripts/task.sh web:l4`, app/web/l4/run.ts): Claude Code, run
  # non-interactively, does each task of the screens' L1 files through the Playwright MCP server, which gives it ARIA
  # snapshots and no screenshots, against the demo server (ADR-0015 §8: the test build of `bin/my` with the demo
  # scenario), signed in as the person of the scenario that the front matter of the screen's L1 file names. Mailpit runs in
  # the job (.github/actions/start-mailpit), and a task that reads email reads it in Mailpit's web UI, whose steps are
  # recorded apart from the lostness. A scheduled run measures the screens whose L1 file or the paths of its front matter changed
  # since the last successful full run; a run by hand measures the `screens` input, or every screen.
  #
  # Per-night cap: at most 10 tasks a night (CAP below), taking the selected screens in turn, each a Claude Code session
  # of at most 40 turns and US$1 (L4_MAX_TURNS, L4_BUDGET_USD). The spend limit of the Claude Console workspace that
  # the federation rule targets bounds the total (ADR-0079).
  #
  # The job authenticates to the Claude API with Workload Identity Federation (ADR-0079), never an API key: it runs in
  # the environment `ux-nightly` (main only), which holds the four IDs as variables, and only it has `id-token: write`.
  # Claude Code exchanges the GitHub OIDC token in ANTHROPIC_IDENTITY_TOKEN_FILE; the step writes the file before the
  # tests and every 2 minutes while they run, as GitHub's token expires about 5 minutes after it is issued.
  l4:
    needs: changes
    if: needs.changes.outputs.run == 'true' && inputs.jobs != 'slow-suite' && inputs.jobs != 'demo-e2e' && inputs.jobs != 'image-scan'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: ux-nightly
    permissions:
      contents: read
      id-token: write
    outputs:
      results: ${{ steps.results.outputs.found }}
    # The official Playwright image, pinned by digest, provides the Chromium of @playwright/test, which the sign-in
    # and the Playwright MCP server drive, with its system libraries. On the runner itself Chromium finds no usable
    # sandbox (Ubuntu 24.04 restricts unprivileged user namespaces). Must equal PLAYWRIGHT_IMAGE in Taskfile.yml
    # (`scripts/task.sh web:playwright-image-check`).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    steps:
      # The image lacks the unzip that setup-bun extracts Bun with, and the jq that reads the identity token.
      - name: Install unzip and jq
        run: apt-get update && apt-get install -y --no-install-recommends unzip jq
      # The whole history, for the diff since the last successful full run.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The job runs as root in the container, and the workspace belongs to the runner's user: git refuses the
      # checkout as of dubious ownership, and go build cannot stamp the VCS information of bin/my without it.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Set up Bun and Node
        uses: ./.github/actions/setup-bun
      - name: Set up Go
        uses: ./.github/actions/setup-go
      - name: web:install
        run: scripts/task.sh web:install
      - name: Start Mailpit
        uses: ./.github/actions/start-mailpit
        with:
          container-id: ${{ job.container.id }}
      - name: Install Claude Code
        if: ${{ !inputs.l4_dry_run }}
        run: npm install --global @anthropic-ai/claude-code@2.1.308
      - name: web:l4
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/anthropic-identity-token
          SINCE: ${{ needs.changes.outputs.since }}
          SCREEN: ${{ inputs.screens }}
          DRY_RUN: ${{ inputs.l4_dry_run && '1' || '' }}
          # The job runs as root in the container, where Chromium refuses to start in its sandbox; the browser loads
          # only the app of `my serve` and Mailpit's web UI on localhost.
          L4_NO_SANDBOX: "1"
          # Started above; web:l4 would start it with `docker compose` on the host's ports otherwise.
          MAILPIT_RUNNING: "1"
        run: |
          if [ -z "$DRY_RUN" ]; then
            fetch_token() {
              curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" |
                jq -er .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE.next"
              mv "$ANTHROPIC_IDENTITY_TOKEN_FILE.next" "$ANTHROPIC_IDENTITY_TOKEN_FILE"
            }
            fetch_token
            ( while sleep 120; do fetch_token || echo "::warning::Could not refresh the GitHub OIDC token."; done ) &
            refresher=$!
            trap 'kill "$refresher"' EXIT
          fi
          scripts/task.sh web:l4 CAP=10 SINCE="$SINCE" SCREEN="$SCREEN" DRY_RUN="$DRY_RUN"
      # l4-issues runs only when the tests wrote their results, not after a failure before them.
      - name: Find the results
        id: results
        if: ${{ !cancelled() }}
        run: |
          if [ -f .tmp/l4/results.json ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::web:l4 wrote no .tmp/l4/results.json: no issues are filed."
          fi
      # The results, the agent's transcripts, and the server's log; never the identity token, which is outside .tmp.
      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: l4-results
          path: |
            .tmp/l4/
            !.tmp/l4/**/storage-state.json
          retention-days: 30

  # Files or updates one issue per screen for the tasks with lostness above 0.4, apart from the job that holds the
  # identity token. It runs when the tests wrote their results, also after some of them failed, so the measured tasks
  # still count, and is skipped when the l4 job stopped before them.
  l4-issues:
    needs: l4
    if: ${{ !cancelled() && needs.l4.outputs.results == 'true' && !inputs.l4_dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
      - name: Download the results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: l4-results
          path: .tmp/l4
      - name: web:l4-issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/task.sh web:l4-issues

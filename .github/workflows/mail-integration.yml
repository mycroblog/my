name: Mail integration

# The mail = smtp integration tests on Mailpit containers (pkg/testkit/mailpittest): the adapter's messages read back
# from a real SMTP server, with STARTTLS and authentication, and registration and a password reset through the links of
# the emails that Mailpit received. They need Docker and pull an image, which the offline `check` of pull requests and
# merge groups does not (ADR-0015), so they run in the slow suite (slow-suite.yml, ADR-0079) and by hand on any branch;
# pull requests run the adapter on the in-process SMTP stand-in of internal/adapter/mail/smtp.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Use exactly the Go version from .tool-versions; never auto-download another toolchain.
  GOTOOLCHAIN: local

jobs:
  mail-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      # The Go cache that main.yml builds, without saving one.
      - name: Set up Go
        uses: ./.github/actions/setup-go
      # testcontainers-go starts axllent/mailpit on the runner's Docker; TEST_MAIL=container makes the tests run, and a
      # missing Docker fail them instead of skipping.
      - name: go:test-mail
        run: scripts/task.sh go:test-mail

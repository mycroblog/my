name: UI story tests

# The story tests in the pinned Playwright image, called by ci.yml on pull requests (ADR-0079): the @my/ui stories
# (ui:test, ADR-0110: play functions and axe on every story in light / dark × LTR / RTL) when the ui context changes,
# and the app/web screen stories (web:story-test, ADR-0165 §1: their play functions and axe) when the client changes.
# Each runs as two Vitest shards in two jobs, which halves the wait of a pull request.

on:
  workflow_call:
    inputs:
      task:
        description: The task that runs the story tests, ui:test or web:story-test
        type: string
        default: ui:test

permissions:
  contents: read

jobs:
  ui-test:
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    runs-on: ubuntu-latest
    # Must equal PLAYWRIGHT_IMAGE in Taskfile.yml (`scripts/task.sh web:playwright-image-check`).
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
      options: --ipc=host
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      # The image lacks the unzip that setup-bun extracts Bun with, and has npm.
      - name: Set up Bun
        run: scripts/ci-bun-npm.sh
      # Use the Node.js from .tool-versions rather than the image's (ADR-0025).
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
      # main.yml's bun-ui-cache job builds it in the same image.
      - name: Restore the Bun package cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-ui-${{ runner.os }}-${{ hashFiles('app/bun.lock') }}
          restore-keys: bun-ui-${{ runner.os }}-
      - name: ${{ inputs.task }}
        run: scripts/task.sh "$TASK" SHARD="$SHARD"
        env:
          TASK: ${{ inputs.task }}
          SHARD: ${{ matrix.shard }}

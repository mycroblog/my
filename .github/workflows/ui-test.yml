name: UI story tests

# The story tests in the pinned Playwright image, called by ci.yml on pull requests (ADR-0079): the @my/ui stories
# (ui:test, ADR-0027: axe on every story and the screenshots at 3 container widths × light / dark × LTR / RTL) when the
# ui context changes, and the app/web screen stories (web:story-test, ADR-0112 §1: their play functions and axe, no
# screenshots) when the client changes.

on:
  workflow_call:
    inputs:
      task:
        description: The task that runs the story tests, ui:test or web:story-test
        type: string
        default: ui:test

permissions:
  contents: read

jobs:
  ui-test:
    # The baselines were generated in this same image (`scripts/task.sh ui:snapshots-update`).
    runs-on: ubuntu-latest
    # Must equal PLAYWRIGHT_IMAGE in Taskfile.yml (`scripts/task.sh web:playwright-image-check`).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      # The image lacks the unzip that setup-bun extracts Bun with.
      - name: Install unzip
        run: apt-get update && apt-get install -y --no-install-recommends unzip
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      # Use the Node.js from .tool-versions rather than the image's (ADR-0025).
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
      # main.yml's bun-ui-cache job builds it in the same image.
      - name: Restore the Bun package cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-ui-${{ runner.os }}-${{ hashFiles('app/bun.lock') }}
          restore-keys: bun-ui-${{ runner.os }}-
      - name: ${{ inputs.task }}
        run: scripts/task.sh "$TASK"
        env:
          TASK: ${{ inputs.task }}
      # On a visual difference, the actual and diff images are under app/ui/.vitest/attachments/.
      - name: Upload the screenshot diffs
        if: failure() && inputs.task == 'ui:test'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-test-screenshots
          path: app/ui/.vitest/
          retention-days: 7

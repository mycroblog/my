name: Slow suite

# A run by hand of the release jobs alone is titled `Slow suite (release)`, which release.yml's gate does not count as a
# passed suite.
run-name: ${{ inputs.scope == 'release' && 'Slow suite (release)' || 'Slow suite' }}

# The checks too slow for the merge queue (ADR-0079): the web E2E over the full width × locale matrix on 8 shards, the
# live interoperability test with Mastodon, GoToSocial, Misskey, and Akkoma, the PostgreSQL tests on a real postgres container
# (ADR-0015), the stream.Bus contracts on broker containers (ADR-0050), the mail = smtp integration tests on Mailpit, the
# LiveKit transport contract on livekit-server --dev (ADR-0101), the blob = s3 contract on Garage, the search.Index contracts on the
# search engines (ADR-0149), the Docker Compose smoke test (linux/amd64)
# with the linux/arm64 image builds, the upgrade from the previous minor version (ADR-0023 §7), the restore drill, golangci-lint over everything with the build tag sets,
# and CodeQL. nightly.yml calls it every night, and it runs by hand on any branch:
# `gh workflow run slow-suite.yml --ref <branch>`. release.yml calls it as the release gate: the whole suite, or, when a
# run of it already passed on the commit, `scope: release`, which runs only the jobs that check the commit's images
# against a release (upgrade, restore-drill). Every job checks out the commit
# of the run (github.sha), so a caller tests the commit it was started on.
#
# No concurrency group: in a called workflow the group would be evaluated in the caller's context, and a release and
# a nightly run on the same commit must not cancel each other. The callers set their own groups.

# The inputs choose the release that the upgrade job upgrades from (docs/agents/releasing.md, "The upgrade test"):
# `version`, the candidate, upgrades from the latest patch of the previous minor version; with no `version` (nightly),
# from the latest release. `previous` names the tag instead, for a pre-release tried from a branch:
# `gh workflow run slow-suite.yml --ref <branch> -f previous=v0.0.0-test.1`.
on:
  workflow_call:
    inputs:
      version:
        description: "The version the commit is released as (vX.Y.Z or vX.Y.Z-<pre-release>); empty for the head of main."
        type: string
        default: ""
      previous:
        description: "The tag to upgrade from instead of the one the version picks."
        type: string
        default: ""
      scope:
        description: "`all` runs every job; `release` runs only the jobs that check this commit's images for a release (upgrade, restore-drill), for a commit whose suite already passed."
        type: string
        default: all
  workflow_dispatch:
    inputs:
      version:
        description: "The version the commit is released as (vX.Y.Z or vX.Y.Z-<pre-release>); empty for the head of main."
        type: string
        default: ""
      previous:
        description: "The tag to upgrade from instead of the one the version picks (e.g. v0.0.0-test.1)."
        type: string
        default: ""
      scope:
        description: "`all` runs every job; `release` runs only upgrade and restore-drill."
        type: choice
        options: [all, release]
        default: all

permissions:
  contents: read

jobs:
  web-e2e:
    if: inputs.scope != 'release'
    uses: ./.github/workflows/web-e2e.yml
    with:
      matrix: full
      shards: 8

  federation-live:
    if: inputs.scope != 'release'
    uses: ./.github/workflows/federation-live.yml

  postgres-contract:
    if: inputs.scope != 'release'
    uses: ./.github/workflows/postgres-contract.yml

  stream-contract:
    if: inputs.scope != 'release'
    uses: ./.github/workflows/stream-contract.yml

  mail-integration:
    if: inputs.scope != 'release'
    uses: ./.github/workflows/mail-integration.yml

  voice-contract:
    if: inputs.scope != 'release'
    uses: ./.github/workflows/voice-contract.yml

  blob-contract:
    if: inputs.scope != 'release'
    uses: ./.github/workflows/blob-contract.yml

  search-contract:
    if: inputs.scope != 'release'
    uses: ./.github/workflows/search-contract.yml

  docker:
    if: inputs.scope != 'release'
    # The docker job of ci.yml, with the linux/arm64 image builds whatever changed.
    runs-on: ubuntu-latest
    steps:
      # The images take their version from `git describe`.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - parallel:
          - name: docker:smoke
            run: scripts/task.sh docker:smoke
          - name: docker:build-arm64
            run: scripts/task.sh docker:build-arm64
      - name: docker:web-reproducible
        run: scripts/task.sh docker:web-reproducible

  upgrade:
    # A database made and filled by the previous release's images, upgraded with this commit's server image in the order
    # of deploy/docker/compose.yaml (my db upgrade -check, my schema apply, my db upgrade), on SQLite and PostgreSQL
    # (scripts/upgrade-test.sh). The previous release's image is the published one (MY_PREVIOUS_IMAGE), or is built from
    # its tag when the registry has none. Without a previous minor version (the first one, v0.1.0) the test is skipped and the job passes.
    runs-on: ubuntu-latest
    steps:
      # Every tag, to pick the previous release and build its images; the images take their version from `git describe`.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Pick the previous release
        id: previous
        env:
          VERSION: ${{ inputs.version }}
          PREVIOUS: ${{ inputs.previous }}
        run: |
          if [ -n "$PREVIOUS" ]; then
            if ! [[ "$PREVIOUS" =~ ^v[0-9] ]] || ! git rev-parse -q --verify "refs/tags/$PREVIOUS" > /dev/null; then
              echo "::error::previous must be a release tag (v...): $PREVIOUS"
              exit 1
            fi
            tag="$PREVIOUS"
          else
            tag="$(git tag -l 'v[0-9]*' | scripts/previous-minor.sh "$VERSION")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -z "$tag" ]; then
            echo "No minor version before ${VERSION:-the head of main}: the upgrade test is skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Upgrading from $tag to ${VERSION:-the head of main} ($GITHUB_SHA)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Set up go-task
        if: steps.previous.outputs.tag != ''
        uses: ./.github/actions/setup-task
      - name: docker:upgrade-test
        if: steps.previous.outputs.tag != ''
        env:
          PREVIOUS: ${{ steps.previous.outputs.tag }}
        run: |
          image="ghcr.io/mycroblog/my:${PREVIOUS#v}"
          if docker buildx imagetools inspect "$image" > /dev/null 2>&1; then
            export MY_PREVIOUS_IMAGE="$image"
          fi
          scripts/task.sh docker:upgrade-test PREVIOUS="$PREVIOUS"

  restore-drill:
    # An instance filled through this commit's images, backed up while it runs (my db backup or pg_dump, then the
    # media), lost with every container and volume, and restored into new ones, on SQLite and PostgreSQL: the data, the
    # Actors' keys, a signed delivery, and the failures without the KEK (scripts/restore-drill.sh).
    runs-on: ubuntu-latest
    steps:
      # The images take their version from `git describe`.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: docker:restore-drill
        run: scripts/task.sh docker:restore-drill

  go-static:
    if: inputs.scope != 'release'
    # The Go checks the merge queue leaves out (ADR-0079): golangci-lint over everything, where pull requests only
    # lint the modules they change, and the builds of the build tag sets that leave adapters out.
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Set up Go
        uses: ./.github/actions/setup-go
        id: go
      # As in ci.yml: build the packages once before the parallel Go steps.
      - name: Build the packages and the Go tools once
        run: scripts/task.sh go:warm agentkit:warm mykit:warm
      # One install of golangci-lint for every lint: four instances of the action each download it to the same path,
      # and one overwriting the binary while another runs it fails with `Text file busy`.
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v${{ steps.go.outputs.golangci-lint }}
          install-only: true
          skip-cache: true
      # The lint tasks pass --allow-serial-runners, so the instances wait for each other's lock.
      - parallel:
          - name: go:lint
            run: scripts/task.sh go:lint
          - name: agentkit:lint
            run: scripts/task.sh agentkit:lint
          - name: mykit:lint
            run: scripts/task.sh mykit:lint
          - name: mykit:mybot-lint
            run: scripts/task.sh mykit:mybot-lint
          - name: go:build-tags
            run: scripts/task.sh go:build-tags

  codeql:
    if: inputs.scope != 'release'
    uses: ./.github/workflows/codeql.yml
    # The analysis uploads its results to the Security tab. A caller grants the same permissions to the job that calls
    # this workflow.
    permissions:
      actions: read
      contents: read
      security-events: write

  # The one result of the suite: fails when any job above failed or was cancelled, so that a caller can depend on it.
  # A job is skipped only by `scope: release`, and a skipped job counts as passed.
  result:
    if: always()
    needs: [web-e2e, federation-live, postgres-contract, stream-contract, mail-integration, voice-contract, blob-contract, search-contract, docker, upgrade, restore-drill, go-static, codeql]
    runs-on: ubuntu-latest
    steps:
      - name: Summarise the results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed=0
          {
            echo "| Job | Result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r job result; do
            echo "| $job | $result |" >> "$GITHUB_STEP_SUMMARY"
            echo "$job: $result"
            if [ "$result" != success ] && [ "$result" != skipped ]; then failed=1; fi
          done < <(jq -r 'to_entries[] | [.key, .value.result] | @tsv' <<< "$RESULTS")
          exit "$failed"

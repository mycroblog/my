name: Slow suite

# A run by hand of the release jobs alone is titled `Slow suite (release)`, which release.yml's find-suite does not
# count as a passed suite.
run-name: ${{ inputs.scope == 'release' && 'Slow suite (release)' || 'Slow suite' }}

# The checks too slow for the merge queue (ADR-0079 §8), on one commit. A check belongs here when it takes minutes
# whatever changed, needs what the merge queue has not (other servers, a release to upgrade from, tofu's providers), or
# looks at everything where a pull request looks at what it changes. nightly.yml calls it every night, so that a
# regression is found within a day and a red Nightly stops the line; release.yml calls it as the release gate; and it
# runs by hand on any branch: `gh workflow run slow-suite.yml --ref <branch>`.
#
# The jobs, each named `<subject>-<kind>` as in ci.yml (ADR-0079 §11); a job with the name of a job of ci.yml checks
# the same thing, on everything:
#
#   federation-live                          this server with Mastodon, GoToSocial, Misskey, Akkoma, and Bonfire Social
#   server-contract                          every contract of the adapters on its real service (contract.yml)
#   server-lint, agentkit-lint, mykit-lint   golangci-lint on every module, where a pull request lints after its change
#                                            (the lint step of ci.yml's server-test, agentkit-test, and mykit-test)
#   server-fakes-test                        go vet and the tests of the test build (the build tag e2e_fakes)
#   deps-license                             the licenses of every dependency, where a pull request checks them when a
#                                            manifest changes
#   image-build                              not a check: the server image, built once for the jobs that start it
#   docker-smoke, docker-arm64-build         the image and the Compose files; the image for linux/arm64
#   image-upgrade, image-restore             an upgrade from the previous release; a backup restored
#   tofu-test                                the OpenTofu modules under tofu (validate and the tests)
#   web-test                                 the tests of every web package, where ci.yml runs those a change reaches
#   web-stories-scan                         every story of the catalog, for an error, sideways scrolling and axe, in
#                                            four shards
#   web-e2e-build, web-e2e                   the E2E tests twice over, never run again when they fail
#   web-browser-image                        not a check: the image the browser jobs run in, when the registry has it
#   code-scan                                CodeQL (codeql.yml)
#   result                                   the one result of the suite, for the callers
#
# Two subjects name the image: `docker` is the Dockerfile and the Compose files, built and started as a deployment
# starts them; `image` is the built image as what a release ships, upgraded to and restored from. The kinds are those
# of ci.yml, and these of this suite: `live`, against other servers; `scan`, which walks everything for one class of
# defect; `upgrade` and `restore`, a release's data carried over.
#
# `scope` picks the jobs: `all`; `release`, only the jobs that check the commit's images against a release
# (image-upgrade, image-restore), for a commit whose suite already passed; `none`, which runs nothing, for a
# pre-release released without the suite in an emergency (`skip_slow_suite`). Every job checks out the commit of the
# run (github.sha), so a caller tests the commit it was started on.
#
# To add a check: a step in the job with its subject and kind, or, when none fits, a job with
# `if: inputs.scope == 'all'`, its name in `needs` of `result`, and a line in the list above;
# scripts/ci-jobs-test.sh (the shell-test job of ci.yml) fails when `result` does not need a job. Only image-upgrade
# and image-restore have `!= 'none'` instead: ADR-0079 §8 names the two checks that every release runs on its own
# image, even when the suite already passed on the commit. A new job is `== 'all'` unless that section gains it.
# Its steps are named after the tasks they run, one after another: what uses every core does not share a runner
# (ADR-0079 §11). A job here gates the releases and the nightly image, and a failure of it opens the Nightly's issue:
# a check that only informs does not belong here.
#
# No concurrency group: in a called workflow the group would be evaluated in the caller's context, and a release and
# a nightly run on the same commit must not cancel each other. The callers set their own groups.

# The inputs choose the release that image-upgrade upgrades from (scripts/previous-minor.sh, scripts/upgrade-test.sh):
# `version`, the candidate, upgrades from the latest patch of the previous minor version; with no `version` (nightly),
# from the latest release. `previous` names the tag instead, for a pre-release tried from a branch:
# `gh workflow run slow-suite.yml --ref <branch> -f previous=v0.0.0-test.1`. `allow_destructive` applies the schema
# with -allow-destructive in the upgrade, for a pre-release before v0.1.0 that drops a column or a table on purpose.
on:
  workflow_call:
    inputs:
      version:
        description: "The version the commit is released as (vX.Y.Z or vX.Y.Z-<pre-release>); empty for the head of main."
        type: string
        default: ""
      previous:
        description: "The tag to upgrade from instead of the one the version picks."
        type: string
        default: ""
      scope:
        description: "`all` runs every job; `release` runs only the jobs that check this commit's images for a release (image-upgrade, image-restore), for a commit whose suite already passed; `none` runs none, for a pre-release that skips the suite in an emergency."
        type: string
        default: all
      allow_destructive:
        description: "image-upgrade applies the schema with -allow-destructive, for a pre-release whose notes call for it."
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: "The version the commit is released as (vX.Y.Z or vX.Y.Z-<pre-release>); empty for the head of main."
        type: string
        default: ""
      previous:
        description: "The tag to upgrade from instead of the one the version picks (e.g. v0.0.0-test.1)."
        type: string
        default: ""
      scope:
        description: "`all` runs every job; `release` runs only image-upgrade and image-restore."
        type: choice
        options: [all, release]
        default: all
      allow_destructive:
        description: "image-upgrade applies the schema with -allow-destructive, for a pre-release whose notes call for it."
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Use exactly the Go version from .tool-versions; never auto-download another toolchain.
  GOTOOLCHAIN: local

defaults:
  run:
    # Named, so that a step runs with `-o pipefail`: without it a check piped into another command cannot fail.
    shell: bash

jobs:
  federation-live:
    needs: image-build
    if: inputs.scope == 'all'
    uses: ./.github/workflows/federation-live.yml
    with:
      built-image: true

  server-contract:
    # Every contract of the adapters on its real service, a runner each, where the merge queue runs those of the
    # adapters a group changes (contract.yml, ADR-0079 §5): a dependency update breaks a contract without touching
    # its adapter.
    if: inputs.scope == 'all'
    strategy:
      fail-fast: false
      matrix:
        contract: [postgres, stream, mail, blob, voice, search, acme]
    uses: ./.github/workflows/contract.yml
    with:
      contract: ${{ matrix.contract }}

  server-lint:
    if: inputs.scope == 'all'
    # golangci-lint over the whole server module, where a pull request lints after its own change (ADR-0079 §3): what
    # two pull requests add together shows here. One runner: the cache of main.yml holds the analysis of the commit.
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Set up Go
        uses: ./.github/actions/setup-go
        id: go
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v${{ steps.go.outputs.golangci-lint }}
          install-only: true
          skip-cache: true
      - name: go:lint
        run: scripts/task.sh go:lint

  agentkit-lint:
    if: inputs.scope == 'all'
    # golangci-lint on tools/agentkit, as server-lint.
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Set up Go
        uses: ./.github/actions/setup-go
        id: go
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v${{ steps.go.outputs.golangci-lint }}
          install-only: true
          skip-cache: true
      - name: agentkit:lint
        run: scripts/task.sh agentkit:lint

  mykit-lint:
    if: inputs.scope == 'all'
    # golangci-lint on pkg/mykit and pkg/mybot, as server-lint.
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Set up Go
        uses: ./.github/actions/setup-go
        id: go
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v${{ steps.go.outputs.golangci-lint }}
          install-only: true
          skip-cache: true
      - name: mykit:lint
        run: scripts/task.sh mykit:lint
      - name: mykit:mybot-lint
        run: scripts/task.sh mykit:mybot-lint

  server-fakes-test:
    if: inputs.scope == 'all'
    # The test build of the server (the build tag e2e_fakes, ADR-0015 §6): go vet, and the tests that only it has. The
    # merge queue builds it for the E2E tests and checks which fakes cmd/my links (go:fakes-check); it does not
    # compile these tests.
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Set up Go
        uses: ./.github/actions/setup-go
      - name: go:fakes-test
        run: scripts/task.sh go:fakes-test

  deps-license:
    if: inputs.scope == 'all'
    # The licenses of every dependency, as ci.yml's deps-license, which runs when a manifest, a lockfile, or an
    # allowlist changes: an import of a package under another license inside a module already required changes none
    # of them, and a release ships what the licenses allow.
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Set up Go
        uses: ./.github/actions/setup-go
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
      - name: Install the Bun packages
        run: scripts/task.sh web:install
      - name: go:licenses
        run: scripts/task.sh go:licenses
      - name: mykit:licenses
        run: scripts/task.sh mykit:licenses
      - name: mykit:mybot-licenses
        run: scripts/task.sh mykit:mybot-licenses
      - name: web:licenses
        run: scripts/task.sh web:licenses
      - name: mykit:ts-licenses
        run: scripts/task.sh mykit:ts-licenses
      - name: mykit:mybot-ts-licenses
        run: scripts/task.sh mykit:mybot-ts-licenses

  image-build:
    if: inputs.scope != 'none'
    # Not a check: the server image of the commit (the Dockerfile's app stage), built once for the jobs that start it
    # (docker-smoke, image-upgrade, image-restore, federation-live), as web-e2e-build builds bin/my once (ADR-0079 §9):
    # every job then tests the same build. A job loads it with .github/actions/load-image, which sets MY_BUILT_IMAGE;
    # each script builds its own when run without it.
    runs-on: ubuntu-latest
    steps:
      # The image takes its version from `git describe`, as the scripts that start it expect.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: docker:build
        run: |
          version="$(git describe --tags --match 'v[0-9]*' --always --dirty)"
          scripts/task.sh docker:build VERSION="$version"
          mkdir -p .tmp/my-image
          docker save "my:$version" | gzip > .tmp/my-image/my-image.tar.gz
      - name: Keep the image for the jobs that start it
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: my-image
          path: .tmp/my-image/my-image.tar.gz
          retention-days: 1
          compression-level: 0

  docker-smoke:
    needs: image-build
    if: inputs.scope == 'all'
    # The Docker Compose smoke test, as ci.yml's docker-smoke, which runs when the Docker files change: a change of
    # the code can break the image too (a directory the Dockerfile does not copy), and shows here. It starts the image
    # of image-build; ci.yml's docker-smoke builds it through compose.build.yaml.
    runs-on: ubuntu-latest
    steps:
      # The images take their version from `git describe`.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Load the server image
        uses: ./.github/actions/load-image
      - name: docker:smoke
        run: scripts/task.sh docker:smoke

  docker-arm64-build:
    if: inputs.scope == 'all'
    # The server image for linux/arm64 (ADR-0079 §4): that the server compiles for arm64 and that the base image has
    # the platform. Every command of the Dockerfile runs on the build platform (the Go server cross-compiles, and the
    # final stage only copies), so the build needs no emulation; the release runs the binary on an arm64 runner
    # (release.yml's image-check).
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: docker:build-arm64
        run: scripts/task.sh docker:build-arm64

  image-upgrade:
    needs: image-build
    if: inputs.scope != 'none'
    # A database made and filled by the previous release's images, upgraded with this commit's server image in the order
    # of deploy/docker/compose.yaml (my db upgrade -check, my schema apply, my db upgrade), on SQLite and PostgreSQL
    # (scripts/upgrade-test.sh). The previous release's image is the published one (MY_PREVIOUS_IMAGE), or is built from
    # its tag when the registry has none. Without a previous minor version (the first one, v0.1.0) the test is skipped
    # and the job passes: the summary says so.
    runs-on: ubuntu-latest
    steps:
      # Every tag, to pick the previous release and build its images; the images take their version from `git describe`.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Pick the previous release
        id: previous
        env:
          VERSION: ${{ inputs.version }}
          PREVIOUS: ${{ inputs.previous }}
        run: |
          if [ -n "$PREVIOUS" ]; then
            if ! [[ "$PREVIOUS" =~ ^v[0-9] ]] || ! git rev-parse -q --verify "refs/tags/$PREVIOUS" > /dev/null; then
              echo "::error::previous must be a release tag (v...): $PREVIOUS"
              exit 1
            fi
            tag="$PREVIOUS"
          else
            tag="$(git tag -l 'v[0-9]*' | scripts/previous-minor.sh "$VERSION")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -z "$tag" ]; then
            echo "No minor version before ${VERSION:-the head of main}: the upgrade test is skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Upgrading from $tag to ${VERSION:-the head of main} ($GITHUB_SHA)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Set up go-task
        if: steps.previous.outputs.tag != ''
        uses: ./.github/actions/setup-task
      - name: Load the server image
        if: steps.previous.outputs.tag != ''
        uses: ./.github/actions/load-image
      - name: docker:upgrade-test
        if: steps.previous.outputs.tag != ''
        env:
          PREVIOUS: ${{ steps.previous.outputs.tag }}
          UPGRADE_TEST_ALLOW_DESTRUCTIVE: ${{ inputs.allow_destructive && '1' || '' }}
        run: |
          image="ghcr.io/mycroblog/my:${PREVIOUS#v}"
          if docker buildx imagetools inspect "$image" > /dev/null 2>&1; then
            export MY_PREVIOUS_IMAGE="$image"
          fi
          scripts/task.sh docker:upgrade-test PREVIOUS="$PREVIOUS"

  image-restore:
    needs: image-build
    if: inputs.scope != 'none'
    # An instance filled through this commit's images, backed up while it runs (my db backup or pg_dump, then the
    # media), lost with every container and volume, and restored into new ones, on SQLite and PostgreSQL: the data, the
    # Actors' keys, a signed delivery, and the failures without the KEK (scripts/restore-drill.sh).
    runs-on: ubuntu-latest
    steps:
      # The images take their version from `git describe`.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Load the server image
        uses: ./.github/actions/load-image
      - name: docker:restore-drill
        run: scripts/task.sh docker:restore-drill

  tofu-test:
    if: inputs.scope == 'all'
    # The checks of deploy/opentofu (ADR-0010) that run tofu: the modules call each other and the examples call the
    # modules. The steps are those of tofu:check after its formatting check (ci.yml's tofu-format) and its script
    # checks (ci.yml's tofu-static), in its order and one after another: validate and the tests already run 4 modules
    # at a time, and each init writes the plugin cache the others read. Nothing reaches a cloud: the tests mock the
    # providers or call a local stub.
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Read the OpenTofu version
        id: tofu
        run: echo "version=$(awk '$1 == "opentofu" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ steps.tofu.outputs.version }}
          tofu_wrapper: false
      - name: tofu:validate
        run: scripts/task.sh tofu:validate
      - name: tofu:test
        run: scripts/task.sh tofu:test
      - name: tofu:example-test
        run: scripts/task.sh tofu:example-test
      - name: tofu:git-source-test
        run: scripts/task.sh tofu:git-source-test
      - name: tofu:state-test
        run: scripts/task.sh tofu:state-test
      - name: tofu:db-state-test
        run: scripts/task.sh tofu:db-state-test
      - name: tofu:aws-plan-test
        run: scripts/task.sh tofu:aws-plan-test

  web-test:
    if: inputs.scope == 'all'
    # The tests of every web package, where ci.yml runs those of the packages a change reaches
    # (scripts/changed-web-packages.sh, ADR-0079 §18): a dependency between packages that no manifest declares fails
    # here within a day. web:test runs as many packages at once as the runner has cores.
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
      - name: Install the Bun packages
        run: scripts/task.sh web:install
      - name: web:test
        run: scripts/task.sh web:test

  web-browser-image:
    if: inputs.scope == 'all'
    # Not a check: the name of the image the browser tests run in, when the registry has it (ci.yml's
    # web-browser-image builds it; scripts/browser-image.sh). With no image the two jobs below install the browser on
    # the runner. It only reads: a called workflow gets no more than its caller grants.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Find the image
        id: image
        run: echo "image=$(scripts/browser-image.sh find)" >> "$GITHUB_OUTPUT"

  web-stories-scan:
    needs: web-browser-image
    if: inputs.scope == 'all'
    # The check of every story at once (ADR-0171 §6): each story of the built catalog at the minimum width, in both
    # directions and in the dark theme, for an error, sideways scrolling and axe, with the E2E tests' runner and no
    # server. No pull request runs it: it finds what the tests of the lower layers missed, and the fix adds a test
    # there. Four jobs, each building the catalog and checking one of Playwright's shards of its tests, so that each
    # stays well within the run's limit (`--global-timeout` of web:stories-check-built) as the catalog grows.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # The image of web-browser-image, which holds the browser, its system packages, and Bun. With no image (an empty
    # name) the job runs on the runner and installs them, in the two steps below.
    container:
      image: ${{ needs.web-browser-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # As Playwright's documentation runs its image: an init process, the host's shared memory, which Chromium needs,
      # and the runner's user, who owns the checkout.
      options: --init --ipc=host --user 1001
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Set up Bun
        if: needs.web-browser-image.outputs.image == ''
        uses: ./.github/actions/setup-bun
      - name: Install the Bun packages
        run: scripts/task.sh web:install
      # The whole browser, not the headless shell alone: the Web Push spec shows notifications, which the headless
      # shell refuses whatever is granted, so it runs in the new headless mode (web/e2e/src/web-push.ts).
      - name: Install Chromium
        if: needs.web-browser-image.outputs.image == ''
        working-directory: web/e2e
        run: bun --bun playwright install --with-deps chromium
      - name: Build the catalog
        run: scripts/task.sh web:stories
      - name: web:stories-check-built
        env:
          SHARD: ${{ matrix.shard }}
        run: scripts/task.sh web:stories-check-built -- --shard="$SHARD/4"

  web-e2e-build:
    if: inputs.scope == 'all'
    # The test build of bin/my, built once for the jobs of web-e2e (ADR-0079 §9), as in ci.yml.
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Set up Go
        uses: ./.github/actions/setup-go
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
      - name: Install the Bun packages
        run: scripts/task.sh web:install
      - name: Build bin/my for the tests
        run: scripts/task.sh go:bin GO_TAGS=e2e_fakes
      - name: Keep bin/my for the E2E jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-my
          path: bin/my
          retention-days: 1

  web-e2e:
    needs: [web-e2e-build, web-browser-image]
    if: inputs.scope == 'all'
    # The E2E tests of the web client, each twice on one seeded server and never run again when they fail: a test
    # that passes only sometimes, or only before its own writes are there, fails here, while ci.yml's web-e2e runs
    # each once and retries it. Four jobs, each with a server of its own and the spec files of one of Playwright's
    # shards. The files, not --shard itself: with --repeat-each it puts the two runs of a file in different jobs, on
    # different servers.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # The image of web-browser-image, which holds the browser, its system packages, and Bun. With no image (an empty
    # name) the job runs on the runner and installs them, in the two steps below.
    container:
      image: ${{ needs.web-browser-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # As Playwright's documentation runs its image: an init process, the host's shared memory, which Chromium needs,
      # and the runner's user, who owns the checkout.
      options: --init --ipc=host --user 1001
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Set up Bun
        if: needs.web-browser-image.outputs.image == ''
        uses: ./.github/actions/setup-bun
      - name: Install the Bun packages
        run: scripts/task.sh web:install
      # The whole browser, not the headless shell alone: the Web Push spec shows notifications, which the headless
      # shell refuses whatever is granted, so it runs in the new headless mode (web/e2e/src/web-push.ts).
      - name: Install Chromium
        if: needs.web-browser-image.outputs.image == ''
        working-directory: web/e2e
        run: bun --bun playwright install --with-deps chromium
      - name: Fetch bin/my
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-my
          path: bin
      # An artifact does not keep the file's mode.
      - name: Make bin/my executable
        run: chmod +x bin/my
      - name: List the spec files of the shard
        id: specs
        working-directory: web/e2e
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          files="$(bun --bun playwright test --list --reporter=json --shard="$SHARD/4" | jq -r '[.suites[].file] | unique | map("specs/" + .) | join(" ")')"
          test -n "$files"
          echo "files=$files" >> "$GITHUB_OUTPUT"
      - name: web:e2e-built
        env:
          FILES: ${{ steps.specs.outputs.files }}
        run: scripts/task.sh web:e2e-built -- --repeat-each=2 $FILES

  code-scan:
    if: inputs.scope == 'all'
    uses: ./.github/workflows/codeql.yml
    # The analysis uploads its results to the Security tab. A caller grants the same permissions to the job that calls
    # this workflow.
    permissions:
      actions: read
      contents: read
      security-events: write

  # The one result of the suite: fails when any job above failed or was cancelled, so that a caller can depend on it.
  # A job is skipped only by `scope: release` or `scope: none`, and a skipped job counts as passed. It is `result` and
  # not `gate`: a required check is matched by its name alone, and ci.yml's `gate` is the only job of that name
  # (ADR-0079 §11).
  result:
    if: always()
    needs: [federation-live, server-contract, server-lint, agentkit-lint, mykit-lint, server-fakes-test, deps-license, image-build, docker-smoke, docker-arm64-build, image-upgrade, image-restore, tofu-test, web-test, web-browser-image, web-stories-scan, web-e2e-build, web-e2e, code-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Summarise the results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed=0
          {
            echo "| Job | Result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r job result; do
            echo "| $job | $result |" >> "$GITHUB_STEP_SUMMARY"
            echo "$job: $result"
            if [ "$result" != success ] && [ "$result" != skipped ]; then failed=1; fi
          done < <(jq -r 'to_entries[] | [.key, .value.result] | @tsv' <<< "$RESULTS")
          exit "$failed"

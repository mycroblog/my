name: CI

# The pull request and merge queue checks (ADR-0079). One workflow and one required status check, `check`, whose jobs
# depend on the event:
#
# - pull_request: `preflight`, the checks a pull request's own files decide; golangci-lint (`lint`) when Go changes;
#   the Docker Compose smoke test (`docker-smoke`) when the docker context changes; the formatting of the OpenTofu
#   modules (`tofu-fmt`) when the tofu context changes; the destructive changes of the schema against the base
#   (`db-lint`) when the schema changes. The OpenTofu checks that need tofu itself run in the slow suite.
# - merge_group: the full check of the contexts the group changes (scripts/changed-contexts.sh): server-static,
#   server-test, and repo, and the container contracts of the adapters it changes (scripts/changed-contracts.sh);
#   repo also checks the documentation site (web/docs), the catalog tools (tools/i18n), and the published packages
#   when their contexts change; e2e runs the E2E tests of the web client when the e2e context changes, and stories
#   the story tests of the Storybook host when the stories context changes.
# - pull_request labelled `allow:full-ci`: both.
#
# Each job sets up its tools and generates what its checks read, then runs the checks as parallel steps (ADR-0079),
# each named after the one task it runs (`scripts/task.sh go:vet`), so that each check keeps its own log and time.
# Locally `scripts/task.sh check` runs the same tasks; scripts/ci-coverage.sh (docs:ci-coverage, in the repo job) fails
# when a check of `check` runs in no step. The workflow has no path filter, so it always runs and `check` always
# reports. Pushes to main run main.yml instead.

on:
  # labeled / unlabeled rerun the checks when `allow:full-ci` is added or removed, and the concurrency group cancels the
  # older run, so no result of the other set of jobs is left on the pull request. A draft runs nothing (an epic's draft
  # gets a commit per issue); ready_for_review runs the checks once it leaves draft.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  # The merge queue of main runs the same required `check` on each merge group before it merges the group.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push or label change replaces a PR's run. Each merge group has a ref of its own (gh-readonly-queue/main/...)
  # and is never cancelled here: the merge queue replaces the groups it rebuilds.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Use exactly the Go version from .tool-versions; never auto-download another toolchain.
  GOTOOLCHAIN: local

jobs:
  # Selects the jobs: whether the full check runs, and the contexts of scripts/changed-contexts.sh the change touches.
  changes:
    # Every other job needs this one, so skipping it on a draft skips them all.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.select.outputs.full }}
      server: ${{ steps.select.outputs.server }}
      i18n: ${{ steps.select.outputs.i18n }}
      docker: ${{ steps.select.outputs.docker }}
      lint-go: ${{ steps.select.outputs.lint-go }}
      lint-agentkit: ${{ steps.select.outputs.lint-agentkit }}
      mykit: ${{ steps.select.outputs.mykit }}
      schema: ${{ steps.select.outputs.schema }}
      tofu: ${{ steps.select.outputs.tofu }}
      site: ${{ steps.select.outputs.site }}
      web: ${{ steps.select.outputs.web }}
      e2e: ${{ steps.select.outputs.e2e }}
      stories: ${{ steps.select.outputs.stories }}
      contracts: ${{ steps.select.outputs.contracts }}
    steps:
      # A pull request checks out its merge commit, whose first parent is the base branch. A merge group checks out
      # its head commit and compares it with its base, the main commit the group is built on; that base is fetched by
      # SHA because a group queued behind others is several commits ahead of it.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Select the jobs
        id: select
        env:
          EVENT: ${{ github.event_name }}
          # The merge queue, or a pull request labelled `allow:full-ci`.
          FULL: ${{ github.event_name == 'merge_group' || contains(github.event.pull_request.labels.*.name, 'allow:full-ci') }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed"
          else
            git fetch --no-tags --depth=1 origin "$MERGE_GROUP_BASE_SHA"
            git diff --name-only "$MERGE_GROUP_BASE_SHA" "$MERGE_GROUP_HEAD_SHA" > "$RUNNER_TEMP/changed"
          fi
          contexts=" $(scripts/changed-contexts.sh --files "$RUNNER_TEMP/changed" | tr '\n' ' ')"
          echo "full: $FULL, contexts:$contexts"
          # touches JOB CONTEXT... sets the output JOB to whether the change touches one of the contexts.
          touches() {
            local job="$1" c value=false
            shift
            for c in "$@"; do
              case "$contexts" in *" $c "*) value=true ;; esac
            done
            echo "$job=$value" >> "$GITHUB_OUTPUT"
          }
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          touches server go schema api i18n
          touches i18n i18n
          touches lint-go go
          # tools/agentkit is a Go module of its own outside the go context.
          if grep -qE '^tools/agentkit/(.*\.go|go\.(mod|sum)|\.golangci\.yml)$' "$RUNNER_TEMP/changed"; then
            echo lint-agentkit=true
          else
            echo lint-agentkit=false
          fi >> "$GITHUB_OUTPUT"
          touches docker docker
          touches mykit mykit
          touches schema schema
          touches tofu tofu
          touches site site
          touches web web
          touches e2e e2e
          touches stories stories
          # The container contracts that the change can break (ADR-0079 §5), as ` postgres blob ` with a space on both
          # sides, so that a job's `if` finds a name with contains().
          contracts=" $(scripts/changed-contracts.sh "$RUNNER_TEMP/changed" | tr '\n' ' ')"
          echo "contracts:$contracts"
          if [ "$contracts" = " " ]; then contracts=""; fi
          echo "contracts=$contracts" >> "$GITHUB_OUTPUT"

  # --- Pull requests --------------------------------------------------------------------------------------------

  preflight:
    # Markdown, shellcheck, gofmt, the Go and npm licenses, the Dockerfile's image versions, and the Documentation
    # section of the description. A pull request's own files, lockfiles, or description decide each of them, so stacking pull
    # requests in the merge queue cannot break them and the queue does not run them again.
    # api:live-calls also runs here and in the merge queue's repo job: the spec and the live tests' calls can change in
    # two pull requests, and the live tests themselves run on neither.
    # The bun fmt check (web:fmt-check) runs here and again in the merge queue's repo job, because two pull requests
    # that each format their own lines can meet in one statement.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # docs:growth compares with the base, the first parent of the merge commit.
          fetch-depth: 2
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Set up Go
        uses: ./.github/actions/setup-go
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
      - name: Install the Bun packages
        run: scripts/task.sh web:install
      - parallel:
          - name: docs:lint
            run: scripts/task.sh docs:lint
          - name: shell:lint
            run: scripts/task.sh shell:lint
          - name: shell:test
            run: scripts/task.sh shell:test
          - name: go:fmt-check
            run: scripts/task.sh go:fmt-check
          # The OpenTofu checks that are scripts and need no tofu: the MY_ names, the backend fields, the
          # classification of every setting (ADR-0164 §12, so that a pull request that adds a setting decides how the
          # public modules take it), and the module sources.
          - name: tofu:env-check
            run: scripts/task.sh tofu:env-check
          - name: tofu:backend-fields
            run: scripts/task.sh tofu:backend-fields
          - name: tofu:coverage
            run: scripts/task.sh tofu:coverage
          - name: tofu:sources
            run: scripts/task.sh tofu:sources
          - name: web:fmt-check
            run: scripts/task.sh web:fmt-check
          - name: api:live-calls
            run: scripts/task.sh api:live-calls
          - name: go:licenses
            run: scripts/task.sh go:licenses
          - name: web:licenses
            run: scripts/task.sh web:licenses
          - name: i18n:licenses
            run: scripts/task.sh i18n:licenses
          - name: mykit:licenses
            run: scripts/task.sh mykit:licenses
          - name: mykit:ts-licenses
            run: scripts/task.sh mykit:ts-licenses
          - name: mykit:mybot-licenses
            run: scripts/task.sh mykit:mybot-licenses
          - name: mykit:mybot-ts-licenses
            run: scripts/task.sh mykit:mybot-ts-licenses
          # The prose agents maintain is no larger than at the base, the first parent of the merge commit, unless the
          # owner approved the growth with the allow:docs-growth label (labelling reruns the checks).
          - name: docs:growth
            env:
              APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'allow:docs-growth') }}
            run: scripts/task.sh docs:growth BASE=HEAD^1 ALLOW_GROWTH="$APPROVED"
          # At most three waivers of the copy lint in one change, against the same base.
          - name: i18n:waivers
            run: scripts/task.sh i18n:waivers BASE=HEAD^1
          - name: docker:dockerfile-check
            run: scripts/task.sh docker:dockerfile-check
          # The pull request's own commits hold no merge commit: a branch is rebased onto main, never merged into.
          # The checkout is the merge of the two with a depth of 2, so the commits are fetched first, one deeper
          # than the pull request has, which leaves the commit it branched from without parents. Dependabot rebases
          # its branches itself; `sync/main` is the merge of main into redesign-web, a merge by design.
          - name: docs:pr-commits
            env:
              AUTHOR: ${{ github.event.pull_request.user.login }}
              HEAD_REF: ${{ github.head_ref }}
              COMMITS: ${{ github.event.pull_request.commits }}
              BASE_SHA: ${{ github.event.pull_request.base.sha }}
              HEAD_SHA: ${{ github.event.pull_request.head.sha }}
            run: |
              if [ "$AUTHOR" = "dependabot[bot]" ] || [ "$HEAD_REF" = sync/main ]; then
                echo "A Dependabot update or the merge of main: skipped."
                exit 0
              fi
              git fetch --no-tags --quiet --depth="$((COMMITS + 1))" origin "$HEAD_SHA"
              scripts/task.sh docs:pr-commits BASE="$BASE_SHA" HEAD="$HEAD_SHA"

  lint:
    # golangci-lint over the modules a pull request changes (ADR-0079), through the area tasks. The merge queue does not
    # run it: stacking two pull requests rarely adds an issue, and never breaks the build; the slow suite lints
    # everything. Its speed comes from the golangci-lint cache that main.yml builds.
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      (needs.changes.outputs.lint-go == 'true' || needs.changes.outputs.lint-agentkit == 'true' || needs.changes.outputs.mykit == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: ./.github/actions/setup-go
        id: go
      # One install of golangci-lint for every lint, and no other use of the action: instances of it that run in
      # parallel read the event payload while each other writes it (`Unexpected end of JSON input`), and each downloads
      # the binary to the same path.
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v${{ steps.go.outputs.golangci-lint }}
          install-only: true
          skip-cache: true
      # The lint tasks pass --allow-serial-runners, so the instances wait for each other's lock.
      - parallel:
          - name: go:lint
            if: needs.changes.outputs.lint-go == 'true'
            run: scripts/task.sh go:lint
          - name: agentkit:lint
            if: needs.changes.outputs.lint-agentkit == 'true'
            run: scripts/task.sh agentkit:lint
          - name: mykit:lint
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh mykit:lint
          - name: mykit:mybot-lint
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh mykit:mybot-lint

  docker-smoke:
    # The Docker Compose smoke test (linux/amd64, ADR-0079): what only the images show, beyond the Go tests that already
    # assemble and start the server: that the Dockerfile builds, that .dockerignore keeps what the images need, the
    # wiring of deploy/docker/compose.yaml, and the runtime image. A pull request's own docker files decide it, so the
    # merge queue does not run it again; the slow suite runs it with the linux/arm64 builds. The promtool check of the
    # alerting rules (deploy/monitoring) runs first, in the same job, since it also needs Docker.
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      # The images take their version from `git describe`.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: docker:alert-rules
        run: scripts/task.sh docker:alert-rules
      - name: docker:smoke
        run: scripts/task.sh docker:smoke

  tofu-fmt:
    # The formatting of deploy/opentofu (ADR-0010), which each file decides alone, so the merge queue does not run it
    # again. The checks that run tofu on several modules run in the slow suite.
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.tofu == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Read the OpenTofu version
        id: tofu
        run: echo "version=$(awk '$1 == "opentofu" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ steps.tofu.outputs.version }}
          tofu_wrapper: false
      - name: tofu:fmt-check
        run: scripts/task.sh tofu:fmt-check

  db-lint:
    # The schema change of a pull request against its base, the first parent of its merge commit (ADR-0023 §6): it
    # fails on a change that can lose or rewrite data of an existing database, unless the decider approved it with the
    # allow:db-destructive label (labelling reruns the checks). The merge queue cannot read labels and checks only that the
    # change applies on top of its base (server-static). db:lint-test runs the lint on its fixtures.
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.schema == 'true'
    runs-on: ubuntu-latest
    env:
      APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'allow:db-destructive') }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Install Atlas and start PostgreSQL
        run: scripts/task.sh db:atlas db:up
      # db:lint (postgres) and db:lint-test (postgres) share the dev database my_lint, so they run one after the other.
      - parallel:
          - name: db:lint (sqlite)
            run: scripts/task.sh db:lint DB_DIALECT=sqlite BASE=HEAD^1 ALLOW_DESTRUCTIVE="$APPROVED"
          - name: db:lint (postgres)
            run: scripts/task.sh db:lint DB_DIALECT=postgres BASE=HEAD^1 ALLOW_DESTRUCTIVE="$APPROVED"
          - name: db:lint-test (sqlite)
            run: scripts/task.sh db:lint-test DB_DIALECT=sqlite
      - name: db:lint-test (postgres)
        run: scripts/task.sh db:lint-test DB_DIALECT=postgres

  # --- The full check: merge groups, and pull requests labelled allow:full-ci -------------------------------------------
  # A job whose `if` is false is skipped, and `check` counts a skipped job as passed.

  server-static:
    needs: changes
    if: needs.changes.outputs.full == 'true' && needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    env:
      MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Set up Go
        uses: ./.github/actions/setup-go
        id: go
      # The api checks bundle the spec with Redocly on Bun. i18n:lint runs once, in repo, which every i18n change also
      # selects.
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
      # The db:check and db:lint steps use Atlas, and the PostgreSQL ones the container of db:up. Mostly waiting on the
      # container, so it runs in the background while go:warm builds.
      - name: Install Atlas and start PostgreSQL
        id: db
        run: scripts/task.sh db:atlas db:up
        background: true
      # Parallel steps would each compile the same packages, since the build cache only holds a package once a
      # compile of it has finished: build them once first.
      - name: Build the packages and the Go tools once
        run: scripts/task.sh go:warm
      # api:lint and api:generate-check both run Redocly through bunx, which can fail when two processes install it at
      # once: fetch it before them.
      - name: Fetch the Redocly CLI once
        run: scripts/task.sh api:warm
      # api:generate-check runs the openapi-typescript of @mycroblog/mykit.
      - name: Install the Bun workspace
        run: scripts/task.sh web:install
      - name: Wait for Atlas and PostgreSQL
        wait: db
      # db:lint compares the schema with the main commit the group is built on, which a group queued behind others is
      # several commits ahead of.
      - name: Fetch the base of the merge group
        if: github.event_name == 'merge_group' && needs.changes.outputs.schema == 'true'
        run: git fetch --no-tags --depth=1 origin "$MERGE_GROUP_BASE_SHA"
      # golangci-lint runs on pull requests and the build tags in the slow suite (ADR-0079).
      - parallel:
          - name: go:vet
            run: scripts/task.sh go:vet
          - name: go:build
            run: scripts/task.sh go:build
          - name: db:check (postgres)
            run: scripts/task.sh db:check DB_DIALECT=postgres
          - name: db:check (sqlite)
            run: scripts/task.sh db:check DB_DIALECT=sqlite
          # The merge queue does not check the approval again (the pull request's db-lint did, and a merge group has no
          # labels): it reports destructive changes and fails only when the schema does not apply on top of the base.
          - name: db:lint (postgres)
            if: github.event_name == 'merge_group' && needs.changes.outputs.schema == 'true'
            run: scripts/task.sh db:lint DB_DIALECT=postgres BASE="$MERGE_GROUP_BASE_SHA" ALLOW_DESTRUCTIVE=true
          - name: db:lint (sqlite)
            if: github.event_name == 'merge_group' && needs.changes.outputs.schema == 'true'
            run: scripts/task.sh db:lint DB_DIALECT=sqlite BASE="$MERGE_GROUP_BASE_SHA" ALLOW_DESTRUCTIVE=true
          - name: go:sqlc-check
            run: scripts/task.sh go:sqlc-check
          - name: api:generate-check
            run: scripts/task.sh api:generate-check
          - name: api:lint
            run: scripts/task.sh api:lint
          - name: api:plugin-generate-check
            run: scripts/task.sh api:plugin-generate-check
          - name: api:plugin-lint
            run: scripts/task.sh api:plugin-lint
          - name: api:plugin-breaking
            run: scripts/task.sh api:plugin-breaking
          - name: api:plugin-docs-test
            run: scripts/task.sh api:plugin-docs-test
          - name: go:mod-check
            run: scripts/task.sh go:mod-check
          - name: api:spec-check
            run: scripts/task.sh api:spec-check
          - name: api:license-scope
            run: scripts/task.sh api:license-scope

  server-test:
    # The PostgreSQL tests run on pgmem inside the test processes, without Docker (ADR-0015); the slow suite runs them
    # on a real postgres container. The Valkey tests start valkey/valkey on the runner's Docker; TEST_VALKEY_REQUIRED
    # makes a missing Docker fail the job instead of skipping them.
    needs: changes
    if: needs.changes.outputs.full == 'true' && needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Set up Go
        uses: ./.github/actions/setup-go
      # Go keys a file that a test opens on its mtime, which the checkout sets to now: give each file an mtime from its
      # content, as main.yml does when it builds the test result cache.
      - name: Set the files' mtimes from their content
        run: scripts/stable-mtime.py
      - name: go:test
        run: scripts/task.sh go:test
        env:
          TEST_VALKEY_REQUIRED: "1"

  contracts:
    # The container contracts of the adapters the group changes (scripts/changed-contracts.sh, ADR-0079 §5), in one job,
    # one after another: a change to tasks/go.yml selects all seven, and their containers started at once on one runner
    # left Elasticsearch unable to start in time. The Nightly runs all of them. Each starts its containers on the
    # runner's Docker.
    needs: changes
    if: needs.changes.outputs.full == 'true' && needs.changes.outputs.contracts != ''
    runs-on: ubuntu-latest
    env:
      CONTRACTS: ${{ needs.changes.outputs.contracts }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Set up Go
        uses: ./.github/actions/setup-go
      - name: go:test-postgres
        if: contains(env.CONTRACTS, ' postgres ')
        run: scripts/task.sh go:test-postgres
      - name: go:test-stream
        if: contains(env.CONTRACTS, ' stream ')
        run: scripts/task.sh go:test-stream
      - name: go:test-mail
        if: contains(env.CONTRACTS, ' mail ')
        run: scripts/task.sh go:test-mail
      - name: go:test-blob
        if: contains(env.CONTRACTS, ' blob ')
        run: scripts/task.sh go:test-blob
      - name: go:test-voice
        if: contains(env.CONTRACTS, ' voice ')
        run: scripts/task.sh go:test-voice
      - name: go:test-search
        if: contains(env.CONTRACTS, ' search ')
        run: scripts/task.sh go:test-search
      - name: go:test-acme
        if: contains(env.CONTRACTS, ' acme ')
        run: scripts/task.sh go:test-acme

  repo:
    # agentkit and its context map, which must cover every path, the documentation rules (links and anchors across
    # files) and inventories (the names each document must mention), the ADR numbers, the bun fmt check of the TS packages, and that every check of `scripts/task.sh check` runs in a job: any change can break them. Also pkg/mykit and pkg/mybot, Go modules of their
    # own, their integration tests, and the npm packages @mycroblog/mykit and @mycroblog/mybot in pkg/mykit/ts and
    # pkg/mybot/ts when the mykit context changes (their licenses run in preflight). Also the build of the documentation
    # site (web/docs, ADR-0150 §7) and its tsc, Oxlint, and knip when the site context changes: the build fails on a
    # broken link or a page that does not render, which two pull requests can cause together (one removes a heading, the other links to it), so it runs on
    # the merge group and not in preflight. Also the catalog lint and the tests of tools/i18n when the i18n context
    # changes. A step here rather than a job of its own keeps a group small.
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Set up Go
        uses: ./.github/actions/setup-go
        id: go
      # As in server-static: build agentkit and its test binaries once before the parallel checks.
      - name: Build agentkit once
        run: scripts/task.sh agentkit:warm
      - name: Build pkg/mykit and pkg/mybot once
        if: needs.changes.outputs.mykit == 'true'
        run: scripts/task.sh mykit:warm
      # web:fmt-check needs only Bun. The TypeScript checks of the packages run with the workspace's packages, on Bun.
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
      - name: Install the Bun packages
        if: needs.changes.outputs.mykit == 'true' || needs.changes.outputs.site == 'true' || needs.changes.outputs.i18n == 'true' || needs.changes.outputs.web == 'true'
        run: scripts/task.sh web:install
      # agentkit:lint runs on pull requests and in the slow suite, like go:lint.
      - parallel:
          - name: agentkit:test
            run: scripts/task.sh agentkit:test
          - name: agentkit:vet
            run: scripts/task.sh agentkit:vet
          - name: agentkit:map-check
            run: scripts/task.sh agentkit:map-check
          - name: agentkit:inventory
            run: scripts/task.sh agentkit:inventory
          - name: agentkit:mod-check
            run: scripts/task.sh agentkit:mod-check
          - name: agentkit:deps-check
            run: scripts/task.sh agentkit:deps-check
          - name: docs:rules
            run: scripts/task.sh docs:rules
          - name: docs:adr-numbers
            run: scripts/task.sh docs:adr-numbers
          - name: docs:ci-coverage
            run: scripts/task.sh docs:ci-coverage
          # Also in preflight; here it checks the merge group, where two pull requests' formatted lines meet.
          - name: web:fmt-check
            run: scripts/task.sh web:fmt-check
          # Also in preflight; here it checks the merge group, where one pull request's spec meets another's live test.
          - name: api:live-calls
            run: scripts/task.sh api:live-calls
          # The tokens of web/design-tokens (ADR-0059), the components of web/design-system and web/app-components
          # (ADR-0025), the platform of web/platform and the server data of web/app-data (ADR-0028), the features and the app of web/app-features and
          # web/app with the app's build (ADR-0025 §9), the development packages web/devtools (ADR-0168) and
          # web/storybook (ADR-0165), and that no production build contains @my/devtools.
          - name: web:typecheck
            if: needs.changes.outputs.web == 'true'
            run: scripts/task.sh web:typecheck
          - name: web:lint
            if: needs.changes.outputs.web == 'true'
            run: scripts/task.sh web:lint
          - name: web:knip
            if: needs.changes.outputs.web == 'true'
            run: scripts/task.sh web:knip
          - name: web:test
            if: needs.changes.outputs.web == 'true'
            run: scripts/task.sh web:test
          - name: web:build
            if: needs.changes.outputs.web == 'true'
            run: scripts/task.sh web:build
          - name: web:devtools-absent
            if: needs.changes.outputs.web == 'true'
            run: scripts/task.sh web:devtools-absent
          - name: i18n:lint
            if: needs.changes.outputs.i18n == 'true'
            run: scripts/task.sh i18n:lint
          - name: i18n:typecheck
            if: needs.changes.outputs.i18n == 'true'
            run: scripts/task.sh i18n:typecheck
          - name: i18n:knip
            if: needs.changes.outputs.i18n == 'true'
            run: scripts/task.sh i18n:knip
          # The check of the site context (site:check): copy the published documents in and build the site as the
          # deploy combines it, checking what it tells search engines, and run its unit tests, tsc, Oxlint, and knip on
          # web/docs (its bun fmt is web:fmt-check above), and the check of its translations.
          - name: docs:site-index-check
            if: needs.changes.outputs.site == 'true'
            run: scripts/task.sh docs:site-index-check
          - name: docs:site-typecheck
            if: needs.changes.outputs.site == 'true'
            run: scripts/task.sh docs:site-typecheck
          - name: docs:site-test
            if: needs.changes.outputs.site == 'true'
            run: scripts/task.sh docs:site-test
          - name: docs:site-lint
            if: needs.changes.outputs.site == 'true'
            run: scripts/task.sh docs:site-lint
          - name: docs:site-knip
            if: needs.changes.outputs.site == 'true'
            run: scripts/task.sh docs:site-knip
          - name: docs:site-translations-check
            if: needs.changes.outputs.site == 'true'
            run: scripts/task.sh docs:site-translations-check
          - name: mykit:test
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh mykit:test
          # The Go client against a server in the test process (pkg/mykit/integration, ADR-0093 §8): seconds once
          # mykit:warm has built the server's packages, so they run here rather than in the slow suite.
          - name: mykit:integration-test
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh mykit:integration-test
          - name: mykit:integration-vet
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh mykit:integration-vet
          - name: mykit:vet
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh mykit:vet
          - name: mykit:build
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh mykit:build
          - name: mykit:mod-check
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh mykit:mod-check
          - name: mykit:server-dep-check
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh mykit:server-dep-check
          - name: mykit:mybot-test
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh mykit:mybot-test
          - name: mykit:mybot-vet
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh mykit:mybot-vet
          - name: mykit:mybot-build
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh mykit:mybot-build
          - name: mykit:mybot-mod-check
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh mykit:mybot-mod-check
          - name: mykit:mybot-server-dep-check
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh mykit:mybot-server-dep-check
          # An echo bot against a server in the test process, and the fake of mybottest against the spec
          # (pkg/mybot/integration, ADR-0093 §18), as mykit's integration tests.
          - name: mykit:mybot-integration-test
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh mykit:mybot-integration-test
          - name: mykit:mybot-integration-vet
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh mykit:mybot-integration-vet
          - name: api:license-scope (mykit)
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh api:license-scope
          - name: mykit:ts-typecheck
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh mykit:ts-typecheck
          - name: mykit:ts-lint
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh mykit:ts-lint
          - name: mykit:ts-knip
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh mykit:ts-knip
          - name: mykit:ts-test
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh mykit:ts-test
          - name: mykit:ts-build
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh mykit:ts-build
          - name: mykit:mybot-ts-typecheck
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh mykit:mybot-ts-typecheck
          - name: mykit:mybot-ts-lint
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh mykit:mybot-ts-lint
          - name: mykit:mybot-ts-knip
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh mykit:mybot-ts-knip
          - name: mykit:mybot-ts-test
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh mykit:mybot-ts-test

      # After the parallel checks: its tests start the CLI as a process per case, and the checks above, sharing the
      # runner, hold each case past bun test's 5 s.
      - name: i18n:test
        if: needs.changes.outputs.i18n == 'true'
        run: scripts/task.sh i18n:test

      # After the parallel checks, whose mykit:ts-build would rewrite mykit's dist/ beside the build of mybot: the ESM
      # build of @mycroblog/mybot on Node.js 22, the oldest Node.js it supports, and on Deno (ADR-0093 §9), a bot run on
      # each (pkg/mybot/ts/test/runtimes.mjs). Bun runs the unit tests above.
      - name: Set up Node.js 22
        if: needs.changes.outputs.mykit == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
      - name: Set up Deno
        if: needs.changes.outputs.mykit == 'true'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.7"
      - name: mykit:mybot-ts-build
        if: needs.changes.outputs.mykit == 'true'
        run: scripts/task.sh mykit:mybot-ts-build
      - name: mykit:mybot-ts-runtimes
        if: needs.changes.outputs.mykit == 'true'
        run: scripts/task.sh mykit:mybot-ts-runtimes

  e2e:
    # The E2E tests of the web client (ADR-0015 §1) against the demo server, which their global setup starts from the
    # test build of bin/my (web:e2e builds it, with the client embedded), when the e2e context changes: a workspace
    # package that @my/app or @my/e2e depends on, or the server code (scripts/changed-contexts.sh). Chromium comes from
    # Playwright's CLI, run on Bun.
    needs: changes
    if: needs.changes.outputs.full == 'true' && needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Set up Go
        uses: ./.github/actions/setup-go
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
      - name: Install the Bun packages
        run: scripts/task.sh web:install
      - name: Install Chromium
        working-directory: web/e2e
        run: bun --bun playwright install --with-deps --only-shell chromium
      - name: web:e2e
        # Each test twice on the one seeded server: a suite that passes only once depends on the order of its tests.
        run: scripts/task.sh web:e2e -- --repeat-each=2

  stories:
    # The static build of the Storybook host and the story tests (ADR-0110 §9): every story run by Storybook's Vitest
    # addon in Chromium with axe, at the minimum width and right-to-left, when the stories context changes: the host or
    # a workspace package it depends on, whose stories it composes (scripts/changed-contexts.sh). Chromium comes from
    # Playwright's CLI, run on Bun.
    needs: changes
    if: needs.changes.outputs.full == 'true' && needs.changes.outputs.stories == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
      - name: Install the Bun packages
        run: scripts/task.sh web:install
      - name: Install Chromium
        working-directory: web/storybook
        run: bun --bun playwright install --with-deps --only-shell chromium
      - name: web:stories
        run: scripts/task.sh web:stories
      - name: web:stories-test
        run: scripts/task.sh web:stories-test

  check:
    # The required status check of the protect-main ruleset, on pull requests and merge groups: it passes only when
    # every job above passed, or was skipped because the event or the change does not need it. A job that calls a
    # `always()` makes it report
    # a result even when every other job is skipped, so neither a pull request nor a merge group waits on it. A draft
    # reports nothing, rather than a pass that checked nothing.
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    needs: [changes, preflight, lint, docker-smoke, tofu-fmt, db-lint, server-static, server-test, contracts, repo, e2e, stories]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a check job failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key)\t\(.value.result)"' <<< "$RESULTS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$RESULTS" > /dev/null

name: CI

# The checks of a pull request and of the merge queue (ADR-0079), and the one required status check, `gate`.
#
# Two stages, and a check belongs to one of them (ADR-0079 §18), but for the tests of the Go modules:
#
# - A pull request runs what its own files decide, so that stacking pull requests in the merge queue cannot change the
#   result (ADR-0079 §2): formatting, the lints, the licenses of the dependencies, the image when the Docker files
#   change (ADR-0079 §4), and what only a pull request has, its base and its labels. The queue does not run these again.
# - The merge queue runs what the merged tree decides (ADR-0079 §1, §5): what compiles, runs tests, or compares files
#   across the tree. Two pull requests can each pass these and fail them together. A pull request labelled
#   `allow:full-ci` runs them too.
# - The Go modules are in both (ADR-0079 §3): a pull request lints a module and then runs its tests, in one job, so
#   that a change that fails them does not enter the queue; the queue runs the tests again on the merged tree.
#
# The jobs, each named `<subject>-<kind>` (ADR-0079 §11). The subject is what is checked, something whose paths can
# be listed (server is the Go module at the root; web, the client's packages under web/). The kind is how:
#
#   format    a formatter would change the file
#   lint      a linter's findings (golangci-lint, markdownlint, shellcheck)
#   license   the SPDX identifiers of the sources, the licenses of the dependencies
#   change    what the pull request adds against its base, which a label of the decider admits
#   static    reads the sources without running them: compiles, type-checks, compares generated files and lists
#   test      runs the subject's tests. Where a change always runs a subject's lint, static checks, and tests together,
#             and they fit one runner, they are one job of this kind, in that order, on one set-up (a Go module, the
#             catalogs, the site, the API); a subject too large for that keeps its static checks in a job of their own
#   build     makes what is shipped and checks what it holds
#   contract  an adapter against its real service, in a container
#   e2e       the whole system through a browser
#   smoke     the image and the Compose files, started as an operator starts them
#
#   select            which of the jobs below run (scripts/ci-jobs.sh)
#   on a pull request
#     go-format, ts-format, tofu-format        the formatters
#     source-license, deps-license             the SPDX identifiers; the licenses of the dependencies
#     docs-lint, shell-lint, go-tests-lint     markdownlint; shellcheck; time.Sleep in the Go tests
#     docs-change, i18n-change, schema-change  what the change adds, against its base, which a label of the decider admits
#     schema-test                              the tests of the schema lint
#     docker-static, docker-smoke              the image (ADR-0079 §4)
#     monitoring-test                          the alerting rules
#   on a pull request and in the merge queue
#     server-test, agentkit-test, mykit-test   a Go module's lint (on a pull request) and tests, with the static
#                                              checks of the two small modules
#   in the merge queue
#     server-static, server-contract                the server module as a whole; its adapters on their real services
#     schema-static, api-test                       the schema; the client API and the plugin protocol
#     docs-static, ci-static                        what the documents say of the tree; that every check has a step
#     mykit-ts-test                                 the npm packages of the client libraries
#     i18n-test                                     the catalogs and their tools
#     site-test, site-build                         the documentation site
#     tofu-static, shell-test                       the OpenTofu modules; the tests of the scripts
#     web-static, web-build, web-test               the web client
#     web-stories-test, web-e2e-build, web-e2e      its catalog in a browser; its E2E tests
#     web-browser-image                             not a check: the image those two run in
#   gate              the required status check: every job above passed or was not needed
#
# How a job is built (ADR-0079 §11):
#
# - Each check is a step named after the one task it runs (`scripts/task.sh go:vet`), so that the failed step's name is
#   the failed check's, with a log of its own. Locally `scripts/task.sh check` runs the checks that need no Docker and
#   no browser, by the same tasks (Taskfile.yml and tasks/<area>.yml define them: a task joins `check` through the
#   `check` task of its area).
# - The steps of a job run one after another. A compiler, a type checker, a linter, and a test run each use every core
#   of the runner: side by side they only wait for each other, and a test that waits passes its limit. `parallel:` is
#   for checks that read files and take a second or two.
# - What takes minutes and uses every core gets runners of its own, by layer (server-test), by package
#   (web-test), by contract (server-contract), or by shard (web-e2e).
# - A job sets up only what its checks need. The Go and Bun caches come from main.yml (ADR-0079 §7), which builds them
#   with the same tasks: a job that builds with other flags finds nothing there. The browser and Bun of the browser
#   jobs come in an image (web-browser-image).
#
# To add a check, first find where it goes:
#
# - Another pull request cannot change its result (it reads each file alone, or the pull request's base or labels):
#   a job of a pull request.
# - Its result depends on the merged tree, and it ends within the queue's longest job (about five minutes with its
#   set-up): a job of the merge queue.
# - It is the contract of an adapter on a real service: contract.yml, which says how to add one. No job is added here.
# - It takes longer, needs what the queue has not, or has nothing to do with what one change touches: slow-suite.yml,
#   which says how.
#
# Then find the job with its subject and kind and add a step named after its task, whose `run` is
# `scripts/task.sh <task>` (docs:ci-coverage matches a check of `check` to a step by that line, or by a step named
# exactly as the task). A check of a minute or less is a step; one that takes minutes and uses every core gets a job,
# so that it does not make its neighbours wait. When no job fits, add a job: its rule in scripts/ci-jobs.sh (which
# paths run it), its name in `needs` of `gate`, and a line in the list above; scripts/ci-jobs-test.sh (the shell-test
# job) fails while one of them is missing. A check of `scripts/task.sh check` that no step runs fails docs:ci-coverage
# (the ci-static job): a check that needs no Docker, no browser, and no network joins `check`, so that it runs
# locally too and that guard covers it; the others have their step alone. A job that slow-suite.yml has under the same
# name (deps-license, docker-smoke, web-test, web-e2e) gets the step there too. When the check builds Go code with
# other flags or tags than the jobs here do, or runs a Go tool of its own, main.yml must build the same, or the check
# compiles everything each time.
#
# The workflow has no path filter, so it always runs and `gate` always reports (ADR-0079 §6). Pushes to main run
# main.yml instead.

on:
  # labeled / unlabeled rerun the checks when `allow:full-ci` or a label that admits a change is added or removed, and
  # the concurrency group cancels the older run. A draft runs nothing (an epic's draft gets a commit per issue);
  # ready_for_review runs the checks once it leaves draft.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  # The merge queue of main runs the same required `gate` on each merge group before it merges the group.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push or label change replaces a PR's run. Each merge group has a ref of its own (gh-readonly-queue/main/...)
  # and is never cancelled here: the merge queue replaces the groups it rebuilds.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Use exactly the Go version from .tool-versions; never auto-download another toolchain.
  GOTOOLCHAIN: local

defaults:
  run:
    # Named, so that a step runs with `-o pipefail`: without it a check piped into another command cannot fail.
    shell: bash

jobs:
  # Picks the jobs: scripts/ci-jobs.sh holds the rules, by stage and by the paths a job's checks read. Every other job
  # needs this one and asks it by name, so skipping it on a draft skips them all.
  select:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.select.outputs.jobs }}
      web-packages: ${{ steps.select.outputs.web-packages }}
      contracts: ${{ steps.select.outputs.contracts }}
      go-shards: ${{ steps.select.outputs.go-shards }}
    steps:
      # A pull request checks out its merge commit, whose first parent is the base branch. A merge group checks out
      # its head commit and compares it with its base, the main commit the group is built on; that base is fetched by
      # SHA because a group queued behind others is several commits ahead of it.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Select the jobs
        id: select
        env:
          EVENT: ${{ github.event_name }}
          # The merge queue, or a pull request labelled `allow:full-ci`.
          FULL: ${{ github.event_name == 'merge_group' || contains(github.event.pull_request.labels.*.name, 'allow:full-ci') }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed"
          else
            git fetch --no-tags --depth=1 origin "$MERGE_GROUP_BASE_SHA"
            git diff --name-only "$MERGE_GROUP_BASE_SHA" "$MERGE_GROUP_HEAD_SHA" > "$RUNNER_TEMP/changed"
          fi
          args=(--event "$EVENT" --files "$RUNNER_TEMP/changed")
          if [ "$FULL" = true ]; then args+=(--full); fi
          jobs="$(scripts/ci-jobs.sh "${args[@]}")"
          echo "The jobs of this run:"
          echo "$jobs"
          # Lines to a JSON list, which a job's `if` and a matrix read.
          list() { jq -Rnc '[inputs | select(. != "")]'; }
          {
            echo "jobs=$(list <<< "$jobs")"
            # The web packages whose tests the change reaches (ADR-0079 §18), the contracts of the adapters it changes
            # (ADR-0079 §5), and the shards of the server module: the matrices of web-test, server-contract, and
            # server-test.
            echo "web-packages=$(scripts/changed-web-packages.sh --files "$RUNNER_TEMP/changed" | list)"
            echo "contracts=$(scripts/changed-contracts.sh "$RUNNER_TEMP/changed" | list)"
            echo "go-shards=$(scripts/go-shard.sh --list | list)"
          } >> "$GITHUB_OUTPUT"

  # --- A pull request: what its own files, its base, and its labels decide ------------------------------------------
  # None of these runs in the merge queue. A check belongs here only when no other pull request can change its result:
  # one that reads a second file belongs to the merge queue's jobs below. (The Go modules' jobs, further down, run in
  # both.)

  go-format:
    # gofmt on the Go files outside tools/. Each file decides alone. It needs Go alone, and no cache.
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'go-format')
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          restore: "false"
      - name: go:fmt-check
        run: scripts/task.sh go:fmt-check

  ts-format:
    # bun fmt on the TypeScript and JavaScript of the workspace. Each file decides alone. It needs Bun alone: bun fmt
    # reads no node_modules.
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'ts-format')
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          restore: "false"
      - name: web:fmt-check
        run: scripts/task.sh web:fmt-check

  tofu-format:
    # tofu fmt on deploy/opentofu (ADR-0010). Each file decides alone. The checks that compare the modules with the
    # rest of the tree run in tofu-static, and the ones that run tofu on the modules in the slow suite.
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'tofu-format')
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Read the OpenTofu version
        id: tofu
        run: echo "version=$(awk '$1 == "opentofu" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ steps.tofu.outputs.version }}
          tofu_wrapper: false
      - name: tofu:fmt-check
        run: scripts/task.sh tofu:fmt-check

  source-license:
    # The SPDX identifier at the head of each file: MIT in the client API and the libraries, AGPL-3.0-only elsewhere
    # (ADR-0093 §2). Each file decides alone, and any file can carry the wrong one, so every pull request runs it.
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'source-license')
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: api:license-scope
        run: scripts/task.sh api:license-scope

  deps-license:
    # The licenses of the dependencies: compatible with AGPL-3.0 for the server and the workspace (ADR-0011), permissive
    # for what the published libraries bring to their users (ADR-0093 §2). The manifests, the lockfiles, and the
    # allowlists decide it, so it runs when one of them changes: on Dependabot's pull requests above all, which no one
    # checks by hand. The slow suite runs it on everything before a release.
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'deps-license')
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      # The Go cache of main.yml holds the modules and the build of go-licenses.
      - name: Set up Go
        uses: ./.github/actions/setup-go
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
      - name: Install the Bun packages
        run: scripts/task.sh web:install
      - name: go:licenses
        run: scripts/task.sh go:licenses
      - name: mykit:licenses
        run: scripts/task.sh mykit:licenses
      - name: mykit:mybot-licenses
        run: scripts/task.sh mykit:mybot-licenses
      - name: web:licenses
        run: scripts/task.sh web:licenses
      - name: mykit:ts-licenses
        run: scripts/task.sh mykit:ts-licenses
      - name: mykit:mybot-ts-licenses
        run: scripts/task.sh mykit:mybot-ts-licenses

  docs-lint:
    # markdownlint. Each Markdown file decides alone. The rules that compare the documents with the tree (links,
    # inventories, the context maps) run in docs-static.
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'docs-lint')
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      # markdownlint-cli2 runs through bunx.
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
      - name: docs:lint
        run: scripts/task.sh docs:lint

  docs-change:
    # The prose agents maintain is no larger than at the base, the first parent of the merge commit, unless the
    # decider approved the growth with the allow:docs-growth label (ADR-0000 §6; labelling reruns the checks). Only a
    # pull request has a base of its own and labels.
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'docs-change')
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: docs:growth
        env:
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'allow:docs-growth') }}
        run: scripts/task.sh docs:growth BASE=HEAD^1 ALLOW_GROWTH="$APPROVED"

  i18n-change:
    # At most three waivers of the copy lint in one change, against the pull request's base (ADR-0009).
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'i18n-change')
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
      - name: Install the Bun packages
        run: scripts/task.sh web:install
      - name: i18n:waivers
        run: scripts/task.sh i18n:waivers BASE=HEAD^1

  schema-change:
    # The schema change of a pull request against its base (ADR-0023 §6): it fails on a change that can lose or
    # rewrite data of an existing database, unless the decider approved it with the allow:db-destructive label
    # (labelling reruns the checks). The merge queue cannot read labels: schema-static checks there only that the
    # change applies on top of the base.
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'schema-change')
    runs-on: ubuntu-latest
    env:
      APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'allow:db-destructive') }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Install Atlas and start PostgreSQL
        run: scripts/task.sh db:atlas db:up
      - name: db:lint (sqlite)
        run: scripts/task.sh db:lint DB_DIALECT=sqlite BASE=HEAD^1 ALLOW_DESTRUCTIVE="$APPROVED"
      - name: db:lint (postgres)
        run: scripts/task.sh db:lint DB_DIALECT=postgres BASE=HEAD^1 ALLOW_DESTRUCTIVE="$APPROVED"

  schema-test:
    # The schema lint on its own fixtures (schema/testdata/lint): that db:lint still finds what it must. The script and
    # the fixtures decide it.
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'schema-test')
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Install Atlas and start PostgreSQL
        run: scripts/task.sh db:atlas db:up
      - name: db:lint-test (sqlite)
        run: scripts/task.sh db:lint-test DB_DIALECT=sqlite
      - name: db:lint-test (postgres)
        run: scripts/task.sh db:lint-test DB_DIALECT=postgres

  shell-lint:
    # shellcheck. Each script decides alone; the scripts are given together, so that one that sources another is
    # followed. The tests of the scripts read the tree and run in shell-test.
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'shell-lint')
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: shell:lint
        run: scripts/task.sh shell:lint

  go-tests-lint:
    # No time.Sleep in a Go test of any module beyond the baseline (ADR-0170 §7), and a baseline that only shrinks
    # from the pull request's base, the first parent of the merge commit. Each test file decides against the baseline.
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'go-tests-lint')
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: go:test-sleep
        run: scripts/task.sh go:test-sleep BASE=HEAD^1

  docker-static:
    # The Go and Bun images of the Dockerfile are the versions of .tool-versions. The two files decide it.
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'docker-static')
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: docker:dockerfile-check
        run: scripts/task.sh docker:dockerfile-check

  docker-smoke:
    # The Docker Compose smoke test (linux/amd64, ADR-0079 §4): what only the image and the Compose files show. That
    # the Dockerfile builds, that .dockerignore keeps what the image needs, the wiring of deploy/docker/compose.yaml,
    # and what the image embeds; the Go tests and the E2E tests own what the server does. No other job of a pull
    # request or of the merge queue builds the image, so a pull request that changes the Docker files runs it, and
    # the queue does not run it again; the slow suite runs it whatever changed, with the linux/arm64 build.
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'docker-smoke')
    runs-on: ubuntu-latest
    steps:
      # The images take their version from `git describe`.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: docker:smoke
        run: scripts/task.sh docker:smoke

  monitoring-test:
    # promtool checks and unit-tests the Prometheus alerting rules of deploy/monitoring. The rules and their tests
    # decide it.
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'monitoring-test')
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: docker:alert-rules
        run: scripts/task.sh docker:alert-rules

  # --- The merge queue, and a pull request labelled allow:full-ci: what the merged tree decides ---------------------
  # A job whose rule does not hold is skipped, and `gate` counts a skipped job as passed. server-test, agentkit-test
  # and mykit-test run on every pull request that changes their module as well (ADR-0079 §3).

  server-static:
    # The server module compiles without cgo (ADR-0010), go vet finds nothing, its go.mod files are tidy and go.work
    # lists its modules, every package is in a shard of server-test, and cmd/my links the fakes of the test build with
    # the tag e2e_fakes alone (ADR-0015 §6). The build comes first: vet reads what it compiled. These read the module
    # as a whole, so they are not a step of each shard of server-test.
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'server-static')
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      # The Go cache of main.yml: the build and vet's results of the packages that did not change.
      - name: Set up Go
        uses: ./.github/actions/setup-go
      - name: go:build
        run: scripts/task.sh go:build
      - name: go:vet
        run: scripts/task.sh go:vet
      - name: go:mod-check
        run: scripts/task.sh go:mod-check
      - name: go:shard-check
        run: scripts/task.sh go:shard-check
      - name: go:fakes-check
        run: scripts/task.sh go:fakes-check

  server-test:
    # The server module, a runner per shard (a shard is the packages of a layer: scripts/go-shard.sh lists them): on a
    # pull request golangci-lint and then the Go tests, in the merge queue the tests again on the merged tree, which
    # alone is what reaches main (ADR-0079 §3). A change runs both, so they share one set-up and run one after the
    # other; both use every core. cmd/my and internal/platform depend on every package, so they run on any change, and
    # each takes as long as the rest together: on one runner they shared four cores with every other package.
    # golangci-lint's cache, which main.yml builds, is by package, and a change invalidates every package above the one
    # it touches. The PostgreSQL tests run on pgmem inside the test processes, without Docker (ADR-0015);
    # server-contract runs them on a real postgres. The Valkey tests start valkey/valkey on the runner's Docker;
    # TEST_VALKEY_REQUIRED makes a missing Docker fail the job instead of skipping them.
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'server-test')
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.go-shards) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      # The Go cache of main.yml holds golangci-lint's analysis of main, and the results of the tests whose packages
      # and files did not change since.
      - name: Set up Go
        uses: ./.github/actions/setup-go
        id: go
      - name: Install golangci-lint
        if: github.event_name == 'pull_request'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v${{ steps.go.outputs.golangci-lint }}
          install-only: true
          skip-cache: true
      # The merge queue does not lint: stacking two pull requests rarely adds an issue and never breaks the build, and
      # the slow suite lints everything (ADR-0079 §3).
      - name: go:lint
        if: github.event_name == 'pull_request'
        env:
          SHARD: ${{ matrix.shard }}
        run: scripts/task.sh go:lint SHARD="$SHARD"
      # Go keys a file that a test opens on its mtime, which the checkout sets to now: give each file an mtime from its
      # content, as main.yml does when it builds the test result cache.
      - name: Set the files' mtimes from their content
        run: scripts/stable-mtime.py
      - name: go:test
        env:
          SHARD: ${{ matrix.shard }}
          TEST_VALKEY_REQUIRED: "1"
        run: scripts/task.sh go:test SHARD="$SHARD"

  server-contract:
    # The contracts of the adapters the group changes, each on its real service (scripts/changed-contracts.sh,
    # ADR-0079 §5), a runner per contract: their containers started at once on one runner left Elasticsearch unable to
    # start in time, and one after another they were the longest job of the queue. The slow suite runs all of them
    # with the same workflow.
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'server-contract')
    strategy:
      fail-fast: false
      matrix:
        contract: ${{ fromJSON(needs.select.outputs.contracts) }}
    uses: ./.github/workflows/contract.yml
    with:
      contract: ${{ matrix.contract }}

  schema-static:
    # The schema (ADR-0023): the sqlc code is what the schema and the queries generate, `my schema apply` of the tree
    # leaves no diff on an empty database of each dialect, and in a merge group the change applies on top of the main
    # commit the group is built on. The schema, the queries, and the code that applies the schema decide it.
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'schema-static')
    runs-on: ubuntu-latest
    env:
      MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      # The Go cache of main.yml: sqlc, and the packages of cmd/my, which db:check builds to apply the schema.
      - name: Set up Go
        uses: ./.github/actions/setup-go
      # Mostly waiting on the container, so it runs in the background while sqlc works.
      - name: Install Atlas and start PostgreSQL
        id: db
        run: scripts/task.sh db:atlas db:up
        background: true
      - name: go:sqlc-check
        run: scripts/task.sh go:sqlc-check
      - name: Wait for Atlas and PostgreSQL
        wait: db
      - name: db:check (sqlite)
        run: scripts/task.sh db:check DB_DIALECT=sqlite
      - name: db:check (postgres)
        run: scripts/task.sh db:check DB_DIALECT=postgres
      # db:lint compares the schema with the main commit the group is built on, which a group queued behind others is
      # several commits ahead of. A merge group has no labels, and schema-change checked the approval on the pull
      # request: here it reports destructive changes and fails only when the schema does not apply on top of the base.
      - name: Fetch the base of the merge group
        if: github.event_name == 'merge_group'
        run: git fetch --no-tags --depth=1 origin "$MERGE_GROUP_BASE_SHA"
      - name: db:lint (sqlite)
        if: github.event_name == 'merge_group'
        run: scripts/task.sh db:lint DB_DIALECT=sqlite BASE="$MERGE_GROUP_BASE_SHA" ALLOW_DESTRUCTIVE=true
      - name: db:lint (postgres)
        if: github.event_name == 'merge_group'
        run: scripts/task.sh db:lint DB_DIALECT=postgres BASE="$MERGE_GROUP_BASE_SHA" ALLOW_DESTRUCTIVE=true

  api-test:
    # The client API (ADR-0016) and the plugin protocol (ADR-0146): the spec lists its files and passes its lint, the
    # bundle and the code generated from it are current, the plugin protocol passes buf's lint and breaks no release,
    # the scenarios and scripts of the slow suite call only what the spec has, and the tests of tools/protodoc, which
    # generates the reference pages of the plugin protocol. The spec, the generators, and those callers decide it.
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'api-test')
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      # The Go cache of main.yml: oapi-codegen and buf.
      - name: Set up Go
        uses: ./.github/actions/setup-go
      # Redocly bundles and lints the spec on Bun, and api:generate-check runs the openapi-typescript of
      # @mycroblog/mykit.
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
      - name: Install the Bun packages
        run: scripts/task.sh web:install
      - name: Fetch the Redocly CLI and build the Go tools
        run: scripts/task.sh api:warm go:tools
      - name: api:spec-check
        run: scripts/task.sh api:spec-check
      - name: api:lint
        run: scripts/task.sh api:lint
      - name: api:generate-check
        run: scripts/task.sh api:generate-check
      - name: api:plugin-lint
        run: scripts/task.sh api:plugin-lint
      - name: api:plugin-generate-check
        run: scripts/task.sh api:plugin-generate-check
      - name: api:plugin-breaking
        run: scripts/task.sh api:plugin-breaking
      - name: api:live-calls
        run: scripts/task.sh api:live-calls
      - name: api:plugin-docs-test
        run: scripts/task.sh api:plugin-docs-test

  docs-static:
    # What the documents say of the tree: every relative link and anchor resolves and the documents keep their rules,
    # every path is under a context map, every command, metric, webhook event, and queue job the server's code
    # defines is in its document,
    # and no two ADRs share a number. Any change can make one of them wrong (a file a document links to, a new
    # directory, a new metric), and two pull requests can together (each adds an ADR), so every merge group runs it.
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'docs-static')
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Set up Go
        uses: ./.github/actions/setup-go
      # Three of the checks run bin/agentkit: build it once, before them.
      - name: Build agentkit
        run: scripts/task.sh agentkit:build
      # They read files and take seconds.
      - parallel:
          - name: docs:rules
            run: scripts/task.sh docs:rules
          - name: agentkit:map-check
            run: scripts/task.sh agentkit:map-check
          - name: agentkit:inventory
            run: scripts/task.sh agentkit:inventory
          - name: docs:adr-numbers
            run: scripts/task.sh docs:adr-numbers

  ci-static:
    # Every check of `scripts/task.sh check` runs in a step of a workflow (ADR-0079 §11). The tasks and the workflows
    # decide it.
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'ci-static')
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: docs:ci-coverage
        run: scripts/task.sh docs:ci-coverage

  agentkit-test:
    # tools/agentkit, a Go module of its own, as server-test: on a pull request golangci-lint, then go vet, a tidy
    # go.mod, no module version the server's go.sum lacks, and the tests; in the merge queue the same without the lint.
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'agentkit-test')
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Set up Go
        uses: ./.github/actions/setup-go
        id: go
      - name: Install golangci-lint
        if: github.event_name == 'pull_request'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v${{ steps.go.outputs.golangci-lint }}
          install-only: true
          skip-cache: true
      - name: agentkit:lint
        if: github.event_name == 'pull_request'
        run: scripts/task.sh agentkit:lint
      - name: agentkit:vet
        run: scripts/task.sh agentkit:vet
      - name: agentkit:mod-check
        run: scripts/task.sh agentkit:mod-check
      - name: agentkit:deps-check
        run: scripts/task.sh agentkit:deps-check
      - name: agentkit:test
        run: scripts/task.sh agentkit:test

  mykit-test:
    # pkg/mykit and pkg/mybot, the Go modules of the client libraries (ADR-0093), as server-test: on a pull request
    # golangci-lint, then that their go.mod files are tidy and name no server module, go vet on them and on their
    # integration modules, and the tests, the Go client and an echo bot against a server in the test process among
    # them (ADR-0093 §8, §18); in the merge queue the same without the lint.
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'mykit-test')
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      # The Go cache of main.yml: the integration modules compile the server's packages.
      - name: Set up Go
        uses: ./.github/actions/setup-go
        id: go
      - name: Install golangci-lint
        if: github.event_name == 'pull_request'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v${{ steps.go.outputs.golangci-lint }}
          install-only: true
          skip-cache: true
      - name: mykit:lint
        if: github.event_name == 'pull_request'
        run: scripts/task.sh mykit:lint
      - name: mykit:mybot-lint
        if: github.event_name == 'pull_request'
        run: scripts/task.sh mykit:mybot-lint
      # The build of the libraries without cgo, which the checks after it read.
      - name: Build pkg/mykit and pkg/mybot
        run: scripts/task.sh mykit:warm
      - name: mykit:mod-check
        run: scripts/task.sh mykit:mod-check
      - name: mykit:server-dep-check
        run: scripts/task.sh mykit:server-dep-check
      - name: mykit:vet
        run: scripts/task.sh mykit:vet
      - name: mykit:integration-vet
        run: scripts/task.sh mykit:integration-vet
      - name: mykit:mybot-mod-check
        run: scripts/task.sh mykit:mybot-mod-check
      - name: mykit:mybot-server-dep-check
        run: scripts/task.sh mykit:mybot-server-dep-check
      - name: mykit:mybot-vet
        run: scripts/task.sh mykit:mybot-vet
      - name: mykit:mybot-integration-vet
        run: scripts/task.sh mykit:mybot-integration-vet
      - name: mykit:test
        run: scripts/task.sh mykit:test
      - name: mykit:integration-test
        run: scripts/task.sh mykit:integration-test
      - name: mykit:mybot-test
        run: scripts/task.sh mykit:mybot-test
      - name: mykit:mybot-integration-test
        run: scripts/task.sh mykit:mybot-integration-test

  mykit-ts-test:
    # @mycroblog/mykit and @mycroblog/mybot, the npm packages of the client libraries (pkg/mykit/ts, pkg/mybot/ts):
    # tsc, Oxlint, and knip, the unit tests on Bun, and the ESM build of @mycroblog/mybot loaded on Node.js 22, the
    # oldest Node.js it supports, and on Deno, with a bot run on each (ADR-0093 §9).
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'mykit-ts-test')
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
      - name: Install the Bun packages
        run: scripts/task.sh web:install
      - name: mykit:ts-typecheck
        run: scripts/task.sh mykit:ts-typecheck
      - name: mykit:ts-lint
        run: scripts/task.sh mykit:ts-lint
      - name: mykit:ts-knip
        run: scripts/task.sh mykit:ts-knip
      - name: mykit:mybot-ts-typecheck
        run: scripts/task.sh mykit:mybot-ts-typecheck
      - name: mykit:mybot-ts-lint
        run: scripts/task.sh mykit:mybot-ts-lint
      - name: mykit:mybot-ts-knip
        run: scripts/task.sh mykit:mybot-ts-knip
      - name: mykit:ts-test
        run: scripts/task.sh mykit:ts-test
      - name: mykit:mybot-ts-test
        run: scripts/task.sh mykit:mybot-ts-test
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.7"
      # It builds @mycroblog/mykit first, which mybot reads as its users do.
      - name: mykit:mybot-ts-build
        run: scripts/task.sh mykit:mybot-ts-build
      - name: mykit:mybot-ts-runtimes
        run: scripts/task.sh mykit:mybot-ts-runtimes

  i18n-test:
    # The catalogs and their tools (ADR-0009): the catalog lint with the copy lint and the generated files, the
    # catalogs of the web packages compile, tsc and knip pass on tools/i18n and web/i18n, and their tests. The tests
    # start the CLI as a process per case, and a case that waits for a core passes bun test's 5 s: they run last, with
    # nothing beside them.
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'i18n-test')
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
      - name: Install the Bun packages
        run: scripts/task.sh web:install
      - name: i18n:lint
        run: scripts/task.sh i18n:lint
      # The web tasks compile the catalogs first; a change to tools/i18n alone selects none of them.
      - name: i18n:compile
        run: scripts/task.sh i18n:compile
      - name: i18n:typecheck
        run: scripts/task.sh i18n:typecheck
      - name: i18n:knip
        run: scripts/task.sh i18n:knip
      - name: i18n:test
        run: scripts/task.sh i18n:test

  site-test:
    # The documentation site (web/docs, ADR-0150): tsc, Oxlint, and knip on its code, its translations against the
    # English text, and its unit tests.
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'site-test')
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
      - name: Install the Bun packages
        run: scripts/task.sh web:install
      - name: docs:site-typecheck
        run: scripts/task.sh docs:site-typecheck
      - name: docs:site-lint
        run: scripts/task.sh docs:site-lint
      - name: docs:site-knip
        run: scripts/task.sh docs:site-knip
      - name: docs:site-translations-check
        run: scripts/task.sh docs:site-translations-check
      - name: docs:site-test
        run: scripts/task.sh docs:site-test

  site-build:
    # The documentation site builds as the deploy combines it (ADR-0150 §7): every page renders, every link and anchor
    # between the pages resolves, and what it tells search engines is right. Two pull requests can break it together
    # (one removes a heading, the other links to it), so it runs on the merge group; a pull request that changes the
    # site gets its preview from docs-site-preview.yml.
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'site-build')
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
      - name: Install the Bun packages
        run: scripts/task.sh web:install
      - name: docs:site-index-check
        run: scripts/task.sh docs:site-index-check

  tofu-static:
    # The OpenTofu modules against the rest of the tree, by scripts that need no tofu (ADR-0010, ADR-0164 §12): the
    # MY_ names against the configuration reference, the modules against their contract and the server's job types,
    # every setting classified once, and the module sources. They compare files a second pull request can change, so
    # they run on the merge group.
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'tofu-static')
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      # They read files and take seconds.
      - parallel:
          - name: tofu:env-check
            run: scripts/task.sh tofu:env-check
          - name: tofu:backend-fields
            run: scripts/task.sh tofu:backend-fields
          - name: tofu:coverage
            run: scripts/task.sh tofu:coverage
          - name: tofu:sources
            run: scripts/task.sh tofu:sources

  shell-test:
    # The tests of the scripts (the release, the image, the selection of the jobs, the checks themselves). They read
    # what the scripts work on (the Dockerfile, the manifests, the tasks, the OpenTofu modules, the workspace), which
    # a second pull request can change, so they run on the merge group.
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'shell-test')
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      # Two of the tests build Go programs: the Go cache of main.yml holds agentkit's packages.
      - name: Set up Go
        uses: ./.github/actions/setup-go
      - name: shell:test
        run: scripts/task.sh shell:test

  web-static:
    # The web client's packages (ADR-0025): tsc, Oxlint with the rules of the layers and the styles (ADR-0171 §2),
    # no physical side in a style (ADR-0009 §1), and knip.
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'web-static')
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
      - name: Install the Bun packages
        run: scripts/task.sh web:install
      - name: web:typecheck
        run: scripts/task.sh web:typecheck
      - name: web:lint
        run: scripts/task.sh web:lint
      - name: web:direction
        run: scripts/task.sh web:direction
      - name: web:knip
        run: scripts/task.sh web:knip

  web-build:
    # The production build of the app, which the server embeds (ADR-0025 §9, ADR-0028), and what it holds: no
    # @my/devtools (ADR-0168 §3), the license notice of each font, and the editor in a chunk of its own.
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'web-build')
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
      - name: Install the Bun packages
        run: scripts/task.sh web:install
      - name: web:build
        run: scripts/task.sh web:build
      - name: web:build-check
        run: scripts/task.sh web:build-check

  web-test:
    # The tests of the web packages the change reaches (scripts/changed-web-packages.sh, ADR-0079 §18), which a change
    # outside the web context can do (pkg/mykit/ts); the slow suite runs every package. A package a runner: a test
    # process uses a core, and a test that waits for one passes its limit. `matrix.package` is the package's directory
    # under web/ (`app`, `app-data`).
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'web-test')
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.select.outputs.web-packages) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
      - name: Install the Bun packages
        run: scripts/task.sh web:install
      - name: web:test
        env:
          PACKAGE: ${{ matrix.package }}
        run: scripts/task.sh web:test PACKAGES="$PACKAGE"

  web-browser-image:
    # Not a check: the image the browser tests run in (.github/images/playwright), which holds Chromium, its system
    # packages and fonts, and Bun, so that no job installs them with apt on the runner, which took from 15 seconds to
    # over six minutes with the state of the package mirrors. The image is named after what it is made of
    # (scripts/browser-image.sh): this job finds it in the registry, or builds and pushes it when the Playwright or
    # the Bun of the tree is new. A pull request from a fork or from Dependabot may not push: the job then gives no
    # name, and the browser jobs install the browser as before. It alone may write packages.
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'web-browser-image')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Find or build the image
        id: image
        run: echo "image=" >> "$GITHUB_OUTPUT" # PROBE: no image, to run the jobs' fallback

  web-stories-test:
    # The tests in a browser on the built catalog of the Storybook host (ADR-0171 §1, §4), with the E2E tests' runner
    # and no server: the layout tests of the design system's layout parts and overlays, and the browser tests of the
    # parts.
    needs: [select, web-browser-image]
    if: contains(fromJSON(needs.select.outputs.jobs), 'web-stories-test')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # The image of web-browser-image, which holds the browser, its system packages, and Bun. With no image (an empty
    # name) the job runs on the runner and installs them, in the two steps below.
    container:
      image: ${{ needs.web-browser-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # As Playwright's documentation runs its image: an init process, the host's shared memory, which Chromium needs,
      # and the runner's user, who owns the checkout.
      options: --init --ipc=host --user 1001
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Set up Bun
        if: needs.web-browser-image.outputs.image == ''
        uses: ./.github/actions/setup-bun
      - name: Install the Bun packages
        run: scripts/task.sh web:install
      # The whole browser, not the headless shell alone: the Web Push spec shows notifications, which the headless
      # shell refuses whatever is granted, so it runs in the new headless mode (web/e2e/src/web-push.ts).
      - name: Install Chromium
        if: needs.web-browser-image.outputs.image == ''
        working-directory: web/e2e
        run: bun --bun playwright install --with-deps chromium
      # The catalog, built once for the two tests that open it.
      - name: Build the catalog
        run: scripts/task.sh web:stories
      - name: web:layout-test-built
        run: scripts/task.sh web:layout-test-built
      - name: web:browser-test-built
        run: scripts/task.sh web:browser-test-built

  web-e2e-build:
    # The test build of bin/my, with the web client embedded, built once for the jobs of web-e2e, so that every one of
    # them tests the same build (ADR-0079 §9). A test build keeps its paths (go:bin), so it reads the Go cache of
    # main.yml as the checks do and compiles only what the tag e2e_fakes and the embedded client change.
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'web-e2e-build')
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Set up Go
        uses: ./.github/actions/setup-go
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
      - name: Install the Bun packages
        run: scripts/task.sh web:install
      - name: Build bin/my for the tests
        run: scripts/task.sh go:bin GO_TAGS=e2e_fakes
      - name: Keep bin/my for the E2E jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-my
          path: bin/my
          retention-days: 1

  web-e2e:
    # The E2E tests of the web client (ADR-0015 §1) against the demo server, which their global setup starts from the
    # build of web-e2e-build. Four jobs side by side, each with a server of its own and a quarter of the spec files
    # (Playwright's --shard): the tests take most of the time, and the queue waits for the slowest job.
    needs: [select, web-e2e-build, web-browser-image]
    if: contains(fromJSON(needs.select.outputs.jobs), 'web-e2e')
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # The image of web-browser-image, which holds the browser, its system packages, and Bun. With no image (an empty
    # name) the job runs on the runner and installs them, in the two steps below.
    container:
      image: ${{ needs.web-browser-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # As Playwright's documentation runs its image: an init process, the host's shared memory, which Chromium needs,
      # and the runner's user, who owns the checkout.
      options: --init --ipc=host --user 1001
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Set up Bun
        if: needs.web-browser-image.outputs.image == ''
        uses: ./.github/actions/setup-bun
      - name: Install the Bun packages
        run: scripts/task.sh web:install
      # The whole browser, not the headless shell alone: the Web Push spec shows notifications, which the headless
      # shell refuses whatever is granted, so it runs in the new headless mode (web/e2e/src/web-push.ts).
      - name: Install Chromium
        if: needs.web-browser-image.outputs.image == ''
        working-directory: web/e2e
        run: bun --bun playwright install --with-deps chromium
      - name: Fetch bin/my
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-my
          path: bin
      # An artifact does not keep the file's mode.
      - name: Make bin/my executable
        run: chmod +x bin/my
      - name: web:e2e-built
        # What the client does, once: a test that fails runs again, twice at most, so that a test that fails only
        # sometimes does not hold the queue. The slow suite finds those tests (slow-suite.yml's web-e2e).
        env:
          SHARD: ${{ matrix.shard }}
        run: scripts/task.sh web:e2e-built -- --retries=2 --shard="$SHARD/4"

  gate:
    # The required status check of the protect-main ruleset (.github/rulesets/protect-main.json), on pull requests and
    # merge groups: it passes only when every job above passed, or was skipped because the event or the change does
    # not need it. `always()` makes it report a result even when every other job is skipped, so neither a pull request
    # nor a merge group waits on it. A draft reports nothing, rather than a pass that checked nothing.
    # A required check is matched by its name alone, whatever workflow reports it: no other workflow may have a job
    # named `gate`, or a run of it on the same commit would answer for this one (ADR-0079 §11).
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    needs: [select, go-format, ts-format, tofu-format, source-license, deps-license, docs-lint, docs-change, i18n-change, schema-change, schema-test, shell-lint, go-tests-lint, docker-static, docker-smoke, monitoring-test, server-static, server-test, server-contract, schema-static, api-test, docs-static, ci-static, agentkit-test, mykit-test, mykit-ts-test, i18n-test, site-test, site-build, tofu-static, shell-test, web-static, web-build, web-test, web-browser-image, web-stories-test, web-e2e-build, web-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a job failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key)\t\(.value.result)"' <<< "$RESULTS"
          failed="$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key' <<< "$RESULTS")"
          if [ -n "$failed" ]; then
            echo "::error::These jobs did not pass: $(tr '\n' ' ' <<< "$failed"). Open the failed job on this page: its failed step is named after the check (scripts/task.sh <name> runs it locally)."
            exit 1
          fi

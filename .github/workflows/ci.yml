name: CI

# The pull request and merge queue checks (ADR-0079). One workflow and one required status check, `check`, whose jobs
# depend on the event:
#
# - pull_request: `preflight`, the checks a pull request's own files decide; the @my/ui story tests (ui-test.yml) when
#   the ui context changes; golangci-lint (`lint`) when Go changes; the Docker Compose smoke test (`docker-smoke`) when
#   the docker context changes.
# - merge_group: the full check of the contexts the group changes (scripts/changed-contexts.sh): server-static,
#   server-test, client-static, client-test (2 shards), and repo, at most 6 jobs.
# - pull_request labelled `ci:full`: both.
#
# Each job sets up its tools and generates what its checks read, then runs the checks as parallel steps (ADR-0083),
# each named after the one task it runs (`scripts/task.sh go:vet`), so that each check keeps its own log and time.
# Locally `scripts/task.sh check` runs the same tasks; scripts/ci-coverage.sh (docs:ci-coverage, in the repo job) fails
# when a check of `check` runs in no step. The workflow has no path filter, so it always runs and `check` always
# reports. Pushes to main run main.yml instead.

on:
  # labeled / unlabeled rerun the checks when `ci:full` is added or removed, and the concurrency group cancels the
  # older run, so no result of the other set of jobs is left on the pull request.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # The merge queue of main runs the same required `check` on each merge group before it merges the group.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push or label change replaces a PR's run. Each merge group has a ref of its own (gh-readonly-queue/main/...)
  # and is never cancelled here: the merge queue replaces the groups it rebuilds.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Use exactly the Go version from .tool-versions; never auto-download another toolchain.
  GOTOOLCHAIN: local

jobs:
  # Selects the jobs: whether the full check runs, and the contexts of scripts/changed-contexts.sh the change touches.
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.select.outputs.full }}
      ui: ${{ steps.select.outputs.ui }}
      server: ${{ steps.select.outputs.server }}
      client: ${{ steps.select.outputs.client }}
      docker: ${{ steps.select.outputs.docker }}
      lint-go: ${{ steps.select.outputs.lint-go }}
      lint-agentkit: ${{ steps.select.outputs.lint-agentkit }}
      mykit: ${{ steps.select.outputs.mykit }}
    steps:
      # A pull request checks out its merge commit, whose first parent is the base branch. A merge group checks out
      # its head commit and compares it with its base, the main commit the group is built on; that base is fetched by
      # SHA because a group queued behind others is several commits ahead of it.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Select the jobs
        id: select
        env:
          EVENT: ${{ github.event_name }}
          # The merge queue, or a pull request labelled `ci:full`.
          FULL: ${{ github.event_name == 'merge_group' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed"
          else
            git fetch --no-tags --depth=1 origin "$MERGE_GROUP_BASE_SHA"
            git diff --name-only "$MERGE_GROUP_BASE_SHA" "$MERGE_GROUP_HEAD_SHA" > "$RUNNER_TEMP/changed"
          fi
          contexts=" $(scripts/changed-contexts.sh --files "$RUNNER_TEMP/changed" | tr '\n' ' ')"
          echo "full: $FULL, contexts:$contexts"
          # touches JOB CONTEXT... sets the output JOB to whether the change touches one of the contexts.
          touches() {
            local job="$1" c value=false
            shift
            for c in "$@"; do
              case "$contexts" in *" $c "*) value=true ;; esac
            done
            echo "$job=$value" >> "$GITHUB_OUTPUT"
          }
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          touches ui ui
          touches server go schema api i18n mail
          touches client ui web api i18n
          touches lint-go go
          # tools/agentkit is a Go module of its own outside the go context.
          if grep -qE '^tools/agentkit/(.*\.go|go\.(mod|sum)|\.golangci\.yml)$' "$RUNNER_TEMP/changed"; then
            echo lint-agentkit=true
          else
            echo lint-agentkit=false
          fi >> "$GITHUB_OUTPUT"
          touches docker docker
          touches mykit mykit

  # --- Pull requests --------------------------------------------------------------------------------------------

  preflight:
    # Markdown, shellcheck, gofmt, the Go and npm licenses, the Dockerfile and Playwright image versions, the design
    # tokens, the CSS 100vh check, and the types of the email layout's compiler (tools/mail). A pull request's own
    # files or lockfiles decide each of them, so stacking pull requests in the merge queue cannot break them and the
    # queue does not run them again.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Set up Go
        uses: ./.github/actions/setup-go
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          node: "false"
      - name: Install the Bun packages
        run: scripts/task.sh web:install i18n:install mail:install
      - parallel:
          - name: docs:lint
            run: scripts/task.sh docs:lint
          - name: shell:lint
            run: scripts/task.sh shell:lint
          - name: go:fmt-check
            run: scripts/task.sh go:fmt-check
          - name: go:licenses
            run: scripts/task.sh go:licenses
          - name: web:licenses
            run: scripts/task.sh web:licenses
          - name: i18n:licenses
            run: scripts/task.sh i18n:licenses
          - name: mykit:licenses
            run: scripts/task.sh mykit:licenses
          - name: mykit:ts-licenses
            run: scripts/task.sh mykit:ts-licenses
          - name: mykit:mybot-licenses
            run: scripts/task.sh mykit:mybot-licenses
          - name: mykit:mybot-ts-licenses
            run: scripts/task.sh mykit:mybot-ts-licenses
          - name: mail:licenses
            run: scripts/task.sh mail:licenses
          - name: mail:typecheck
            run: scripts/task.sh mail:typecheck
          - name: docker:dockerfile-check
            run: scripts/task.sh docker:dockerfile-check
          - name: web:playwright-image-check
            run: scripts/task.sh web:playwright-image-check
          - name: web:tokens
            run: scripts/task.sh web:tokens
          - name: web:lint-css
            run: scripts/task.sh web:lint-css

  ui-test:
    # The @my/ui story tests (ADR-0027), on pull requests alone: a pull request that changes a screenshot fixes its
    # baselines itself, and a change from stacking two of them is rare.
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.ui == 'true'
    uses: ./.github/workflows/ui-test.yml

  lint:
    # golangci-lint on the lines a pull request changes (ADR-0079). The merge queue does not run it: stacking two pull
    # requests rarely adds an issue, and never breaks the build; the slow suite lints everything. The analysis covers
    # every package either way, so its speed comes from the golangci-lint cache that main.yml builds.
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      (needs.changes.outputs.lint-go == 'true' || needs.changes.outputs.lint-agentkit == 'true' || needs.changes.outputs.mykit == 'true')
    runs-on: ubuntu-latest
    # only-new-issues reads the pull request's diff.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: ./.github/actions/setup-go
        id: go
      - parallel:
          # The action adds the issues to the pull request as annotations; its cache is the one setup-go restores.
          - name: go:lint
            if: needs.changes.outputs.lint-go == 'true'
            uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
            with:
              version: v${{ steps.go.outputs.golangci-lint }}
              only-new-issues: true
              skip-cache: true
              # golangci-lint runs one instance at a time: wait for the other step's instead of failing.
              args: --allow-serial-runners
          - name: agentkit:lint
            if: needs.changes.outputs.lint-agentkit == 'true'
            uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
            with:
              version: v${{ steps.go.outputs.golangci-lint }}
              working-directory: tools/agentkit
              only-new-issues: true
              skip-cache: true
              # golangci-lint runs one instance at a time: wait for the other step's instead of failing.
              args: --allow-serial-runners
          - name: mykit:lint
            if: needs.changes.outputs.mykit == 'true'
            uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
            with:
              version: v${{ steps.go.outputs.golangci-lint }}
              working-directory: pkg/mykit
              only-new-issues: true
              skip-cache: true
              # golangci-lint runs one instance at a time: wait for the other step's instead of failing.
              args: --allow-serial-runners
      # A fourth parallel instance of the action fails to read the event payload (`Unexpected end of JSON input`), so
      # the bot library's lint runs after the others.
      - name: mykit:mybot-lint
        if: needs.changes.outputs.mykit == 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v${{ steps.go.outputs.golangci-lint }}
          working-directory: pkg/mybot
          only-new-issues: true
          skip-cache: true

  docker-smoke:
    # The Docker Compose smoke test (linux/amd64, ADR-0079): what only the images show, beyond the Go tests that already
    # assemble and start the server: that the Dockerfile builds, that .dockerignore keeps what the images need, the
    # wiring of deploy/docker/compose.yaml, and the runtime image. A pull request's own docker files decide it, so the
    # merge queue does not run it again; the slow suite runs it with the linux/arm64 builds.
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      # The images take their version from `git describe`.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: docker:smoke
        run: scripts/task.sh docker:smoke

  # --- The full check: merge groups, and pull requests labelled ci:full -------------------------------------------
  # A job whose `if` is false is skipped, and `check` counts a skipped job as passed.

  server-static:
    needs: changes
    if: needs.changes.outputs.full == 'true' && needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Set up Go
        uses: ./.github/actions/setup-go
        id: go
      # The api checks bundle the spec with Redocly on Bun. i18n:lint runs once, in client-static, which every i18n change
      # also selects.
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
      # Both db:check steps use Atlas, and the PostgreSQL one the container of db:up. Mostly waiting on the container,
      # so it runs in the background while go:warm builds.
      - name: Install Atlas and start PostgreSQL
        id: db
        run: scripts/task.sh db:atlas db:up
        background: true
      # Parallel steps would each compile the same packages, since the build cache only holds a package once a
      # compile of it has finished: build them once first.
      - name: Build the packages and the Go tools once
        run: scripts/task.sh go:warm
      # api:lint and api:generate-check both run Redocly through bunx, which can fail when two processes install it at
      # once: fetch it before them.
      - name: Fetch the Redocly CLI once
        run: scripts/task.sh api:warm
      # mail:gen-check compiles the email layout with the token colors of the merged main: a pull request that changes
      # the tokens and one that changes the layout can each be fresh alone (ADR-0081).
      - name: Install the email layout's packages
        run: scripts/task.sh mail:install
      - name: Wait for Atlas and PostgreSQL
        wait: db
      # golangci-lint runs on pull requests and the build tags in the slow suite (ADR-0079).
      - parallel:
          - name: go:vet
            run: scripts/task.sh go:vet
          - name: go:build
            run: scripts/task.sh go:build
          - name: db:check (postgres)
            run: scripts/task.sh db:check DB_DIALECT=postgres
          - name: db:check (sqlite)
            run: scripts/task.sh db:check DB_DIALECT=sqlite
          - name: go:sqlc-check
            run: scripts/task.sh go:sqlc-check
          - name: api:generate-check
            run: scripts/task.sh api:generate-check
          - name: api:lint
            run: scripts/task.sh api:lint
          - name: go:mod-check
            run: scripts/task.sh go:mod-check
          - name: api:spec-check
            run: scripts/task.sh api:spec-check
          - name: api:license-scope
            run: scripts/task.sh api:license-scope
          - name: mail:gen-check
            run: scripts/task.sh mail:gen-check

  server-test:
    # The PostgreSQL tests run on pgmem inside the test processes, without Docker (ADR-0041); the slow suite runs them
    # on a real postgres container. The Valkey tests start valkey/valkey on the runner's Docker; TEST_VALKEY_REQUIRED
    # makes a missing Docker fail the job instead of skipping them.
    needs: changes
    if: needs.changes.outputs.full == 'true' && needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Set up Go
        uses: ./.github/actions/setup-go
      - name: go:test
        run: scripts/task.sh go:test
        env:
          TEST_VALKEY_REQUIRED: "1"

  client-static:
    needs: changes
    if: needs.changes.outputs.full == 'true' && needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
      # The packages and the generated files every step reads, once: the steps' own generators then skip.
      - name: Generate the client files
        run: scripts/task.sh web:generate
      # web:lint-rules copies its fixtures into app/web/src, so the steps that read app/web/src run after it.
      - parallel:
          - name: web:lint-rules
            run: scripts/task.sh web:lint-rules
          - name: ui:typecheck
            run: scripts/task.sh ui:typecheck
          - name: i18n:lint
            run: scripts/task.sh i18n:lint
          - name: i18n:typecheck
            run: scripts/task.sh i18n:typecheck
      - parallel:
          - name: web:typecheck
            run: scripts/task.sh web:typecheck
          - name: web:oxlint
            run: scripts/task.sh web:oxlint
          - name: web:knip
            run: scripts/task.sh web:knip
          - name: web:dist
            run: scripts/task.sh web:dist

  client-test:
    # Vitest of app/web in two shards, the longest job otherwise; the second shard, the shorter half, also runs app/ui
    # and tools/i18n. No explicit name: GitHub names the jobs `client-test (1/2)` and `client-test (2/2)`, and a skipped
    # job, whose matrix is never expanded, plain `client-test`.
    needs: changes
    if: needs.changes.outputs.full == 'true' && needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
      - name: Generate the client files
        run: scripts/task.sh web:generate
      - parallel:
          - name: web:test
            run: scripts/task.sh web:test SHARD=${{ matrix.shard }}
          # On the second shard, whose half of the web tests is the shorter one.
          - name: ui:unit-test
            if: matrix.shard == '2/2'
            run: scripts/task.sh ui:unit-test
          - name: i18n:test
            if: matrix.shard == '2/2'
            run: scripts/task.sh i18n:test

  repo:
    # agentkit and its context map, which must cover every path, the ADR numbers, and that every check of
    # `scripts/task.sh check` runs in a job: any change can break them. Also pkg/mykit and pkg/mybot, Go modules of their
    # own, and the npm packages @mycroblog/mykit and @mycroblog/mybot in pkg/mykit/ts and pkg/mybot/ts when the mykit
    # context changes (their licenses run in preflight).
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Set up Go
        uses: ./.github/actions/setup-go
        id: go
      # As in server-static: build agentkit and its test binaries once before the parallel checks.
      - name: Build agentkit once
        run: scripts/task.sh agentkit:warm
      - name: Build pkg/mykit and pkg/mybot once
        if: needs.changes.outputs.mykit == 'true'
        run: scripts/task.sh mykit:warm
      # The TypeScript checks of @mycroblog/mykit run with the client workspace's packages (tsc and Oxlint on Node.js).
      - name: Set up Bun
        if: needs.changes.outputs.mykit == 'true'
        uses: ./.github/actions/setup-bun
      - name: Install the Bun packages
        if: needs.changes.outputs.mykit == 'true'
        run: scripts/task.sh web:install
      # agentkit:lint runs on pull requests and in the slow suite, like go:lint.
      - parallel:
          - name: agentkit:test
            run: scripts/task.sh agentkit:test
          - name: agentkit:vet
            run: scripts/task.sh agentkit:vet
          - name: agentkit:map-check
            run: scripts/task.sh agentkit:map-check
          - name: agentkit:mod-check
            run: scripts/task.sh agentkit:mod-check
          - name: agentkit:deps-check
            run: scripts/task.sh agentkit:deps-check
          - name: docs:adr-numbers
            run: scripts/task.sh docs:adr-numbers
          - name: docs:ci-coverage
            run: scripts/task.sh docs:ci-coverage
          - name: mykit:test
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh mykit:test
          - name: mykit:vet
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh mykit:vet
          - name: mykit:build
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh mykit:build
          - name: mykit:mod-check
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh mykit:mod-check
          - name: mykit:server-dep-check
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh mykit:server-dep-check
          - name: mykit:mybot-test
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh mykit:mybot-test
          - name: mykit:mybot-vet
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh mykit:mybot-vet
          - name: mykit:mybot-build
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh mykit:mybot-build
          - name: mykit:mybot-mod-check
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh mykit:mybot-mod-check
          - name: mykit:mybot-server-dep-check
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh mykit:mybot-server-dep-check
          - name: api:license-scope (mykit)
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh api:license-scope
          - name: mykit:ts-typecheck
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh mykit:ts-typecheck
          - name: mykit:ts-lint
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh mykit:ts-lint
          - name: mykit:ts-knip
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh mykit:ts-knip
          - name: mykit:ts-test
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh mykit:ts-test
          - name: mykit:ts-build
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh mykit:ts-build
          - name: mykit:mybot-ts-typecheck
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh mykit:mybot-ts-typecheck
          - name: mykit:mybot-ts-lint
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh mykit:mybot-ts-lint
          - name: mykit:mybot-ts-knip
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh mykit:mybot-ts-knip
          - name: mykit:mybot-ts-test
            if: needs.changes.outputs.mykit == 'true'
            run: scripts/task.sh mykit:mybot-ts-test

      # After the parallel checks, whose mykit:ts-build would rewrite mykit's dist/ beside the build of mybot: the ESM
      # build of @mycroblog/mybot on Node.js 22, the oldest Node.js it supports, and on Deno (ADR-0094 §1), a bot run on
      # each (pkg/mybot/ts/test/runtimes.mjs). Bun runs the unit tests above.
      - name: Set up Node.js 22
        if: needs.changes.outputs.mykit == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
      - name: Set up Deno
        if: needs.changes.outputs.mykit == 'true'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.7"
      - name: mykit:mybot-ts-build
        if: needs.changes.outputs.mykit == 'true'
        run: scripts/task.sh mykit:mybot-ts-build
      - name: mykit:mybot-ts-runtimes
        if: needs.changes.outputs.mykit == 'true'
        run: scripts/task.sh mykit:mybot-ts-runtimes

  check:
    # The required status check of the protect-main ruleset, on pull requests and merge groups: it passes only when
    # every job above passed, or was skipped because the event or the change does not need it. A job that calls a
    # reusable workflow fails when a called job fails, so a failed story test fails `check`. `always()` makes it report
    # a result even when every other job is skipped, so neither a pull request nor a merge group waits on it.
    if: always()
    needs: [changes, preflight, ui-test, lint, docker-smoke, server-static, server-test, client-static, client-test, repo]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a check job failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key)\t\(.value.result)"' <<< "$RESULTS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$RESULTS" > /dev/null

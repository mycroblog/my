name: Federation live

# Live interoperability test (ADR-0006, ADR-0015, test/federation-live/README.md): this server federating with
# Mastodon, GoToSocial, Misskey, Akkoma, and Bonfire Social in test/federation-live, part of the slow suite
# (slow-suite.yml, ADR-0079) and runnable by hand on any branch.
# Not part of `scripts/task.sh check`. The logs of every server and the captured activities are kept as artifacts.

# `built-image`: the slow suite's call starts the server image of its image-build (the artifact my-image) instead of
# building one here. Run by hand, the job builds its own.
on:
  workflow_call:
    inputs:
      built-image:
        description: "Start the server image of the calling run's artifact my-image instead of building it."
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

env:
  # Use exactly the Go version from .tool-versions; never auto-download another toolchain.
  GOTOOLCHAIN: local

defaults:
  run:
    # Named, so that a step runs with `-o pipefail`.
    shell: bash

jobs:
  federation-live:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FEDERATION_LIVE_OUT: ${{ github.workspace }}/.tmp/federation-live-out
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      # The Go cache of main.yml, without saving one (actions/setup-go's own cache is saved by any ref, and only
      # main's would be shared).
      - name: Set up Go
        uses: ./.github/actions/setup-go
      # The images of the five servers and their builds fill the runner's disk, which has little room to spare and
      # differs between runners. Nothing this job uses lives in these directories.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Load the server image
        if: inputs.built-image
        uses: ./.github/actions/load-image
      - name: Run the live interoperability scenarios
        run: scripts/task.sh docker:federation-live
      - name: Upload the logs and captured activities
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: federation-live
          path: ${{ env.FEDERATION_LIVE_OUT }}
          if-no-files-found: warn
          retention-days: 14

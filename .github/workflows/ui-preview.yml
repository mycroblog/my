name: UI preview

# Builds the UI preview (ADR-0165 §2, §3), the static build of the Storybook host web/storybook
# (`scripts/ui-preview.sh build`), of a pull request that changes the web client and of each push to main, and uploads
# it as the artifact `ui-preview`. ui-preview-deploy.yml publishes it when this workflow completes: main's on the
# Worker my-ui, a pull request's on its Preview pr-<number>. This workflow holds no secret and no write permission, so
# it runs the same for pull requests from forks; it is not part of the required `gate` and never blocks a merge.

on:
  pull_request:
    paths: &paths
      # The packages of the web client, whose stories the host composes, and what builds them; not the documentation
      # site, which has a preview of its own (docs-site-preview.yml).
      - "web/**"
      - "!web/docs/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "tasks/web.yml"
      - "scripts/ui-preview.sh"
      - "scripts/ui-preview/**"
      - "scripts/workers-preview.sh"
      - ".github/workflows/ui-preview.yml"
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ui-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
      - name: Build the catalog
        run: scripts/ui-preview.sh build "$RUNNER_TEMP/ui-preview"
      # Fails the build that ui-preview-deploy.yml would refuse anyway, where the author sees it.
      - name: Check the build
        run: scripts/ui-preview.sh stage "$RUNNER_TEMP/ui-preview" "$RUNNER_TEMP/ui-preview-stage"
      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-preview
          path: ${{ runner.temp }}/ui-preview/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

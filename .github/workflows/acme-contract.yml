name: ACME contract

# The instance.ACMEClient contract of the ACME adapter and the server with tls = acme, against Pebble, Let's Encrypt's
# test CA (pkg/testkit/pebbletest), rather than the in-memory fake CA that pull requests and merge groups run (ADR-0163).
# Pebble and its DNS run as Go tools pinned in tools/go.mod, with no container, but the tests open listeners and run
# processes that the offline `check` does not (ADR-0015), so they run in the slow suite (slow-suite.yml, ADR-0079), in the
# merge queue when the ACME code changes, and by hand on any branch.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Use exactly the Go version from .tool-versions; never auto-download another toolchain.
  GOTOOLCHAIN: local

jobs:
  acme-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      # The Go cache that main.yml builds, without saving one.
      - name: Set up Go
        uses: ./.github/actions/setup-go
      # TEST_ACME=pebble makes the tests run; pkg/testkit/pebbletest builds pebble and pebble-challtestsrv from
      # tools/go.mod.
      - name: go:test-acme
        run: scripts/task.sh go:test-acme

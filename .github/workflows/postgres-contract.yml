name: PostgreSQL contract

# The PostgreSQL tests whose result can differ between pgmem and a real server (go:test-postgres: the pool, Atlas,
# isolation and locks between connections, SKIP LOCKED and LISTEN/NOTIFY) on a real postgres container (ADR-0015 §3).
# Part of the slow suite (slow-suite.yml, ADR-0079), run by the merge queue when the PostgreSQL adapters change
# (ci.yml's contracts job), and runnable by hand on any branch; merge groups run every PostgreSQL test on pgmem.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Use exactly the Go version from .tool-versions; never auto-download another toolchain.
  GOTOOLCHAIN: local
  # The runner is thrown away with every container on it, so testcontainers-go's reaper (Ryuk) has nothing to clean up,
  # and a reaper that is slow to start fails every test of a package.
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
  postgres-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      # The Go cache that main.yml builds, without saving one.
      - name: Set up Go
        uses: ./.github/actions/setup-go
      # testcontainers-go starts postgres:18-alpine on the runner's Docker; TEST_POSTGRES_REQUIRED makes a missing
      # Docker fail the job instead of skipping the tests.
      - name: go:test-postgres
        run: scripts/task.sh go:test-postgres

name: PostgreSQL contract

# The PostgreSQL tests (the repository contracts of internal/adapter/db/postgres, the kv and queue adapters, and the
# dual-dialect tests of internal/platform) on a real postgres container instead of pgmem (ADR-0015). Part of the slow
# suite (slow-suite.yml, ADR-0079) and runnable by hand on any branch; pull requests and merge groups run the same
# tests on pgmem.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Use exactly the Go version from .tool-versions; never auto-download another toolchain.
  GOTOOLCHAIN: local

jobs:
  postgres-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go-task
        uses: ./.github/actions/setup-task
      # The Go cache that main.yml builds, without saving one.
      - name: Set up Go
        uses: ./.github/actions/setup-go
      # testcontainers-go starts postgres:18-alpine on the runner's Docker; TEST_POSTGRES_REQUIRED makes a missing
      # Docker fail the job instead of skipping the tests.
      - name: go:test-postgres
        run: scripts/task.sh go:test-postgres

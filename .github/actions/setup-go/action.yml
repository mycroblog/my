# SPDX-License-Identifier: AGPL-3.0-only
name: Set up Go
description: >-
  Install the Go of .tool-versions and restore the Go module, build, and golangci-lint cache that main.yml builds
  from scratch once a day (ADR-0079), without saving one. Run it after actions/checkout.

inputs:
  restore:
    description: "`false` installs Go and computes the key without restoring the cache (main.yml, which builds it)."
    default: "true"

outputs:
  key:
    description: The key of today's cache for this Go and these go.sum files.
    value: ${{ steps.key.outputs.key }}
  golangci-lint:
    description: The golangci-lint version of .tool-versions, for golangci/golangci-lint-action (`v` + this).
    value: ${{ steps.key.outputs.golangci-lint }}

runs:
  using: composite
  steps:
    # setup-go's own cache is keyed on go.sum alone, never refreshed, and saved by any ref.
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: .tool-versions
        cache: false
    # The server builds without cgo (ADR-0010). Every job that uses this action, and main.yml that builds the cache,
    # builds with the same setting, since it is part of each build cache entry's key.
    - name: Build without cgo
      shell: bash
      run: echo CGO_ENABLED=0 >> "$GITHUB_ENV"
    # go.work is for Dependabot alone: every job checks each module as it stands alone. scripts/task.sh sets this too.
    - name: Leave workspace mode
      shell: bash
      run: echo GOWORK=off >> "$GITHUB_ENV"
    # A build cache only serves the same Go, and the module cache the same go.sum files. The date makes main.yml start
    # a new cache each day, so a cache holds one build's worth of entries instead of growing with every push.
    - name: Compute the Go cache key and read the golangci-lint version
      id: key
      shell: bash
      env:
        GOTOOLCHAIN: local
        SUMS: ${{ hashFiles('go.sum', 'tools/go.sum') }}
      run: |
        base="go-build-${RUNNER_OS}-$(go env GOVERSION)"
        {
          echo "os=go-build-${RUNNER_OS}-"
          echo "base=${base}-"
          echo "sums=${base}-${SUMS}-"
          echo "key=${base}-${SUMS}-$(date -u +%Y%m%d)"
          echo "golangci-lint=$(awk '$1 == "golangci-lint" { print $2 }' .tool-versions)"
        } >> "$GITHUB_OUTPUT"
    # Without today's cache, the newest one of the same go.sum files, then of the same Go, then any: the build cache
    # entries of the packages that did not change since still hit, and the modules of another Go still serve.
    - name: Restore the Go cache
      if: inputs.restore == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod/cache/download
          ~/.cache/go-build
          ~/.cache/golangci-lint
        key: ${{ steps.key.outputs.key }}
        restore-keys: |
          ${{ steps.key.outputs.sums }}
          ${{ steps.key.outputs.base }}
          ${{ steps.key.outputs.os }}

# SPDX-License-Identifier: AGPL-3.0-only
name: Set up Bun
description: >-
  Install the Bun of .tool-versions, which runs every tool of the workspace (ADR-0025 §10), and restore the Bun
  package cache that main.yml builds, without saving one (ADR-0079). Run it after actions/checkout.

runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: .tool-versions
    # The key must equal that of main.yml's bun-cache job.
    - name: Restore the Bun package cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

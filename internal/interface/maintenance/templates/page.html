<!doctype html>
<html lang="{{.Lang}}" dir="{{.Dir}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
{{with .MetaCSP}}<meta http-equiv="Content-Security-Policy" content="{{.}}">
{{end}}<title>{{.Title}}</title>
<style>{{.CSS}}</style>
</head>
<body>
<main>
{{range .Sections}}{{$s := .}}<section lang="{{.Lang}}" dir="{{.Dir}}" aria-labelledby="{{$.Kind}}-{{.Lang}}">
<p class="server" dir="auto">{{.ServerName}}</p>
<h1 id="{{$.Kind}}-{{.Lang}}">{{.Heading}}</h1>
<p>{{.Description}}</p>
{{with .Message}}<h2>{{$s.NoticeHeading}}</h2>
<p class="message" dir="auto" lang="">{{.}}</p>
{{end}}{{if .Date}}<dl>
<dt>{{.DateLabel}}</dt>
<dd><time datetime="{{.Date}}">{{.DateText}}</time></dd>
</dl>
{{end}}{{with .StatusPageURL}}<p><a href="{{.}}" rel="noopener">{{$s.StatusPageText}}</a></p>
{{end}}</section>
{{end}}</main>
</body>
</html>

#
# oapi-codegen (pinned in tools/go.mod) generates the strict net/http server of api/openapi.yaml
# into api.gen.go (ADR-0029). Run `scripts/task.sh api:generate` (scripts/generate.sh); never edit api.gen.go by hand.
package: clientapi
generate:
  models: true
  std-http-server: true
  strict-server: true
output-options:
  skip-prune: true
  # GET /streaming is a Server-Sent Events stream, which the strict server cannot serve
  # (ADR-0029): streaming.go implements it by hand, behind the same guard, and so does
  # voice_stream.go GET /voice/rooms/{id}/stream.
  exclude-operation-ids:
    - streamEvents
    - streamVoiceRoom
# Enum constants carry their type's name (VisibilityPublic, MediaAttachmentTypeImage), so that
# enums with the same values never collide in the package.
compatibility:
  always-prefix-enum-values: true

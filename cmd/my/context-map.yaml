entries:
  - paths: ["**"]
    docs: ["docs/architecture/overview.md#6-リポジトリ構成", "docs/adr/0010-configuration-and-packaging.md", "docs/operations/production-checklist.md"]
    checks: [go, docker]
  - paths: ["*.go"]
    userdocs: ["docs/reference/cli.md"]
  - paths: ["config.go", "configerror.go"]
    userdocs: ["docs/operations/production-checklist.md", "docs/operations/key-management.md#web-push-vapid-key"]
  - paths: ["dev_push_service.go"]
    docs: ["docs/adr/0015-testing-strategy.md", "CONTRIBUTING.md#the-fake-push-service"]
    userdocs: ["docs/reference/build-tags.md#test-builds"]
  - paths: ["main.go", "serve.go", "job.go"]
    userdocs: ["docs/operations/running.md", "docs/operations/monitoring.md#which-url-to-monitor"]
  - paths: ["admin.go", "media.go", "role.go", "audit.go"]
    userdocs: ["docs/operations/admin-cli.md"]
  - paths: ["account_actions.go", "appeal.go", "moderation.go", "domain_block.go", "refetch.go", "retention.go", "two_factor.go"]
    userdocs: ["docs/operations/moderation.md"]
  - paths: ["registration.go", "signup_block.go", "password_reset.go"]
    userdocs: ["docs/operations/registration.md", "docs/operations/moderation.md"]
  - paths: ["login_provider.go"]
    userdocs: ["docs/operations/login-providers.md"]
  - paths: ["instance*.go", "emoji*.go", "federation.go"]
    userdocs: ["docs/operations/instance-settings.md"]
  - paths: ["closure.go"]
    userdocs: ["docs/operations/service-closure.md", "docs/operations/admin-cli.md#announcing-the-end-of-the-service"]
  - paths: ["domain_subscription*.go"]
    docs: ["docs/adr/0159-federation-allowlist-and-blocklist-subscriptions.md#decision決定", "docs/architecture/data-model/04-tables/03-moderation.md#ドメインのブロックリストの購読"]
    userdocs: ["docs/operations/moderation.md#subscribing-to-blocklists", "docs/reference/jobs.md", "docs/reference/cli.md"]
  - paths: ["domain_allow.go"]
    docs: ["docs/adr/0159-federation-allowlist-and-blocklist-subscriptions.md#decision決定", "docs/architecture/federation.md#11-モデレーションとの連携", "docs/architecture/data-model/04-tables/03-moderation.md#43-moderation"]
    userdocs: ["docs/operations/moderation.md#federating-only-with-allowed-servers", "docs/operations/instance-settings.md", "docs/reference/jobs.md"]
  - paths: ["supporters.go"]
    docs: ["docs/architecture/data-model/04-tables/13-supporters.md#413-supporters", "docs/adr/0072-supporter-plans-and-roles.md", "docs/operations/supporters.md"]
    userdocs: ["docs/operations/supporters.md"]
  - paths: ["plugin*.go"]
    docs: ["docs/adr/0146-plugin-protocol.md", "docs/adr/0147-decision-hooks.md"]
    userdocs: ["docs/operations/plugins.md", "docs/reference/build-tags.md", "docs/operations/running.md", "docs/plugins/overview.md", "docs/plugins/probe.md", "docs/plugins/translator.md", "docs/plugins/search.md", "docs/plugins/billing.md", "docs/plugins/mailer.md", "docs/plugins/media.md", "docs/plugins/key-manager.md", "docs/plugins/hooks.md"]
    checks: [api, go]
  - paths: ["search.go"]
    docs: ["docs/adr/0149-full-text-search.md", "docs/adr/0146-plugin-protocol.md", "docs/architecture/data-model/04-tables/18-search.md"]
    userdocs: ["docs/reference/jobs.md#full-text-search", "docs/operations/running.md#splitting-workers-by-job-type", "docs/operations/search.md", "docs/operations/search-engines.md", "docs/operations/admin-cli.md#rebuilding-the-search-index", "docs/reference/build-tags.md", "docs/operations/plugins.md#searching-posts", "docs/plugins/search.md"]
  - paths: ["db.go", "db_test.go"]
    docs: ["docs/adr/0023-declarative-schema-management.md", "docs/architecture/data-model/04-tables/10-infrastructure.md#410-基盤アダプタ所有", "docs/agents/releasing.md"]
    userdocs: ["docs/operations/database.md#upgrading", "docs/operations/backup.md#sqlite"]
  - paths: ["schema*.go"]
    docs: ["docs/adr/0023-declarative-schema-management.md"]
    userdocs: ["docs/operations/database.md#with-my-schema-apply", "docs/reference/build-tags.md"]
    checks: [go, schema]
  - paths: ["projection.go"]
    docs: ["docs/architecture/data-model/09-projection-rebuild.md"]
    userdocs: ["docs/operations/database.md#checking-and-rebuilding-projections"]
  - paths: ["relay.go"]
    docs: ["docs/operations/relays.md"]
    userdocs: ["docs/operations/relays.md"]
  - paths: ["kek.go", "kek_test.go"]
    docs: ["docs/adr/0019-security-baseline.md", "docs/architecture/data-model/02-consistency.md#2-整合性モデル"]
    userdocs: ["docs/operations/key-management.md#rotate-the-kek"]
  - paths: ["maintenance*.go", "closure_export*.go"]
    docs: ["docs/adr/0088-service-shutdown-modes.md#8-メンテナンスモードの切り替え", "docs/adr/0088-service-shutdown-modes.md#18-メンテナンスモードとの関係", "docs/adr/0088-service-shutdown-modes.md#6-停止の後", "docs/operations/maintenance.md", "docs/operations/service-closure.md"]
    userdocs: ["docs/operations/maintenance.md", "docs/operations/service-closure.md#6-switching-to-the-static-page", "docs/operations/monitoring.md#telling-the-maintenance-mode-from-an-outage", "docs/operations/admin-cli.md#exporting-the-maintenance-page"]

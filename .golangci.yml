# golangci-lint v2 configuration. The golangci-lint version is pinned in .tool-versions.
version: "2"

run:
  modules-download-mode: readonly
  tests: true
  # The live interoperability scenarios (deploy/docker/federation-live) build only with this tag, so that
  # `go test ./...` never runs them; linting them keeps them compiling between nightly runs.
  build-tags:
    - federationlive

linters:
  default: standard
  enable:
    - depguard
    - errorlint
    - exhaustruct_v5
    - forbidigo
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
  settings:
    # Architecture boundaries (ADR-0002, docs/architecture/overview.md §2 and §6).
    # A file matched by several rules must satisfy all of them.
    # - domain/<module>: standard library and its own module's domain only.
    # - app/<module>: standard library, its own module's domain, any module's app package
    #   (the public API through which modules reach each other), and internal/i18n.
    # - i18n: a leaf library (message formatting, ADR-0009) usable from app and interface code;
    #   it imports only the standard library, the embedded catalogs, its MessageFormat engine, and x/text/language.
    # - interface/*, adapter/*, pkg/testkit: anything except the layers listed under deny.
    # - platform and cmd: anything (composition root). Nothing imports cmd.
    # Third-party packages for domain/app must be added to the allow list explicitly.
    depguard:
      rules:
        no-cmd:
          list-mode: lax
          files:
            - $all
          deny:
            - pkg: github.com/mycroblog/my/cmd
              desc: entrypoints are leaves; move shared code into internal/platform
        domain-identity:
          list-mode: strict
          files:
            - "**/internal/domain/identity/**"
          allow:
            - $gostd
            - github.com/mycroblog/my/internal/domain/identity
        app-identity:
          list-mode: strict
          files:
            - "**/internal/app/identity/**"
          allow:
            - $gostd
            - github.com/mycroblog/my/internal/domain/identity
            - github.com/mycroblog/my/internal/app
            - github.com/mycroblog/my/internal/i18n
            # Argon2id password hashing (ADR-0019 §3): a pure-Go algorithm, not an external resource.
            - golang.org/x/crypto/argon2
            # BCP 47 tag parsing and canonicalization for preferences (ADR-0009): pure-Go data, not an external resource.
            - golang.org/x/text/language
        domain-account:
          list-mode: strict
          files:
            - "**/internal/domain/account/**"
          allow:
            - $gostd
            - github.com/mycroblog/my/internal/domain/account
        app-account:
          list-mode: strict
          files:
            - "**/internal/app/account/**"
          allow:
            - $gostd
            - github.com/mycroblog/my/internal/domain/account
            - github.com/mycroblog/my/internal/app
            - github.com/mycroblog/my/internal/i18n
            # NFKC normalization of the account search terms (ADR-0092 §1, the same as hashtags): pure-Go Unicode data, not an external resource.
            - golang.org/x/text/unicode/norm
        domain-content:
          list-mode: strict
          files:
            - "**/internal/domain/content/**"
          allow:
            - $gostd
            - github.com/mycroblog/my/internal/domain/content
        app-content:
          list-mode: strict
          files:
            - "**/internal/app/content/**"
          allow:
            - $gostd
            - github.com/mycroblog/my/internal/domain/content
            - github.com/mycroblog/my/internal/app
            - github.com/mycroblog/my/internal/i18n
            # NFKC normalization of hashtags (data-model §4.4, tags.name_normalized): pure-Go Unicode data, not an external resource.
            - golang.org/x/text/unicode/norm
            # Reading the head of linked pages for link cards (ADR-0062 §2): a pure-Go HTML tokenizer and charset decoder, not an external resource.
            - golang.org/x/net/html
            # Cutting the values of link cards at grapheme cluster boundaries (ADR-0062 §2): pure-Go Unicode data, not an external resource.
            - github.com/rivo/uniseg
        domain-graph:
          list-mode: strict
          files:
            - "**/internal/domain/graph/**"
          allow:
            - $gostd
            - github.com/mycroblog/my/internal/domain/graph
        app-graph:
          list-mode: strict
          files:
            - "**/internal/app/graph/**"
          allow:
            - $gostd
            - github.com/mycroblog/my/internal/domain/graph
            - github.com/mycroblog/my/internal/app
            - github.com/mycroblog/my/internal/i18n
        domain-timeline:
          list-mode: strict
          files:
            - "**/internal/domain/timeline/**"
          allow:
            - $gostd
            - github.com/mycroblog/my/internal/domain/timeline
        app-timeline:
          list-mode: strict
          files:
            - "**/internal/app/timeline/**"
          allow:
            - $gostd
            - github.com/mycroblog/my/internal/domain/timeline
            - github.com/mycroblog/my/internal/app
            - github.com/mycroblog/my/internal/i18n
            # Counting the grapheme clusters of a list's name (ADR-0122 §1): pure-Go Unicode data, not an external resource.
            - github.com/rivo/uniseg
        domain-notification:
          list-mode: strict
          files:
            - "**/internal/domain/notification/**"
          allow:
            - $gostd
            - github.com/mycroblog/my/internal/domain/notification
        app-notification:
          list-mode: strict
          files:
            - "**/internal/app/notification/**"
          allow:
            - $gostd
            - github.com/mycroblog/my/internal/domain/notification
            - github.com/mycroblog/my/internal/app
            - github.com/mycroblog/my/internal/i18n
        domain-federation:
          list-mode: strict
          files:
            - "**/internal/domain/federation/**"
          allow:
            - $gostd
            - github.com/mycroblog/my/internal/domain/federation
        app-federation:
          list-mode: strict
          files:
            - "**/internal/app/federation/**"
          allow:
            - $gostd
            - github.com/mycroblog/my/internal/domain/federation
            - github.com/mycroblog/my/internal/app
            - github.com/mycroblog/my/internal/i18n
            # IDNA 2008 A-label canonicalization of remote hosts (federation.md §1.2): pure-Go Unicode data, not an external resource.
            - golang.org/x/net/idna
        domain-moderation:
          list-mode: strict
          files:
            - "**/internal/domain/moderation/**"
          allow:
            - $gostd
            - github.com/mycroblog/my/internal/domain/moderation
        app-moderation:
          list-mode: strict
          files:
            - "**/internal/app/moderation/**"
          allow:
            - $gostd
            - github.com/mycroblog/my/internal/domain/moderation
            - github.com/mycroblog/my/internal/app
            - github.com/mycroblog/my/internal/i18n
        domain-instance:
          list-mode: strict
          files:
            - "**/internal/domain/instance/**"
          allow:
            - $gostd
            - github.com/mycroblog/my/internal/domain/instance
        app-instance:
          list-mode: strict
          files:
            - "**/internal/app/instance/**"
          allow:
            - $gostd
            - github.com/mycroblog/my/internal/domain/instance
            - github.com/mycroblog/my/internal/app
            - github.com/mycroblog/my/internal/i18n
            # Counting the grapheme clusters of an announcement's title (ADR-0125 §1): pure-Go Unicode data, not an external resource.
            - github.com/rivo/uniseg
        domain-webhook:
          list-mode: strict
          files:
            - "**/internal/domain/webhook/**"
          allow:
            - $gostd
            - github.com/mycroblog/my/internal/domain/webhook
        app-webhook:
          list-mode: strict
          files:
            - "**/internal/app/webhook/**"
          allow:
            - $gostd
            - github.com/mycroblog/my/internal/domain/webhook
            - github.com/mycroblog/my/internal/app
            - github.com/mycroblog/my/internal/i18n
        domain-finance:
          list-mode: strict
          files:
            - "**/internal/domain/finance/**"
          allow:
            - $gostd
            - github.com/mycroblog/my/internal/domain/finance
        app-finance:
          list-mode: strict
          files:
            - "**/internal/app/finance/**"
          allow:
            - $gostd
            - github.com/mycroblog/my/internal/domain/finance
            - github.com/mycroblog/my/internal/app
            - github.com/mycroblog/my/internal/i18n
            # NFKC normalization of the providers (ADR-0067 §2, cost_item_label_revisions.provider_normalized): pure-Go Unicode data, not an external resource.
            - golang.org/x/text/unicode/norm
        domain-supporters:
          list-mode: strict
          files:
            - "**/internal/domain/supporters/**"
          allow:
            - $gostd
            - github.com/mycroblog/my/internal/domain/supporters
        app-supporters:
          list-mode: strict
          files:
            - "**/internal/app/supporters/**"
          allow:
            - $gostd
            - github.com/mycroblog/my/internal/domain/supporters
            - github.com/mycroblog/my/internal/app
            - github.com/mycroblog/my/internal/i18n
        domain-voice:
          list-mode: strict
          files:
            - "**/internal/domain/voice/**"
          allow:
            - $gostd
            - github.com/mycroblog/my/internal/domain/voice
        app-voice:
          list-mode: strict
          files:
            - "**/internal/app/voice/**"
          allow:
            - $gostd
            - github.com/mycroblog/my/internal/domain/voice
            - github.com/mycroblog/my/internal/app
            - github.com/mycroblog/my/internal/i18n
            # Counting the grapheme clusters of a room's name (ADR-0100 §3): pure-Go Unicode data, not an external resource.
            - github.com/rivo/uniseg
        domain-diagnostics:
          list-mode: strict
          files:
            - "**/internal/domain/diagnostics/**"
          allow:
            - $gostd
            - github.com/mycroblog/my/internal/domain/diagnostics
        app-diagnostics:
          list-mode: strict
          files:
            - "**/internal/app/diagnostics/**"
          allow:
            - $gostd
            - github.com/mycroblog/my/internal/domain/diagnostics
            - github.com/mycroblog/my/internal/app
            - github.com/mycroblog/my/internal/i18n
        # app/kernel holds the ports and helpers shared by every module (Clock, IDGenerator, KeyManager);
        # it depends on nothing in the repository so that any module can import it.
        app-kernel:
          list-mode: strict
          files:
            - "**/internal/app/kernel/**"
          allow:
            - $gostd
            - github.com/mycroblog/my/internal/app/kernel
        # app/uow holds the UnitOfWork port, its retry loop, and the synchronous projector registry
        # shared by every module and database adapter; like kernel, it depends on nothing in the repository.
        app-uow:
          list-mode: strict
          files:
            - "**/internal/app/uow/**"
          allow:
            - $gostd
            - github.com/mycroblog/my/internal/app/uow
        # app/queue holds the job queue ports, the handler registry, the retry policy, and the pull
        # runner shared by every module and queue adapter; it depends only on kernel and uow.
        app-queue:
          list-mode: strict
          files:
            - "**/internal/app/queue/**"
          allow:
            - $gostd
            - github.com/mycroblog/my/internal/app/queue
            - github.com/mycroblog/my/internal/app/kernel
            - github.com/mycroblog/my/internal/app/uow
        # app/projection rebuilds and verifies the projections (data-model §9) through rebuild
        # functions that the composition root takes from the modules; it owns no tables and
        # depends only on uow and queue.
        app-projection:
          list-mode: strict
          files:
            - "**/internal/app/projection/**"
          allow:
            - $gostd
            - github.com/mycroblog/my/internal/app/projection
            - github.com/mycroblog/my/internal/app/queue
            - github.com/mycroblog/my/internal/app/uow
        # app/dbupgrade runs and records the data upgrade steps of `my db upgrade` (ADR-0087 §2, §4)
        # through step functions and a projection rebuild that the composition root passes; it
        # depends only on kernel (Clock) and uow.
        app-dbupgrade:
          list-mode: strict
          files:
            - "**/internal/app/dbupgrade/**"
          allow:
            - $gostd
            - github.com/mycroblog/my/internal/app/dbupgrade
            - github.com/mycroblog/my/internal/app/kernel
            - github.com/mycroblog/my/internal/app/uow
        # app/rewrap re-wraps the stored sealed values under the current KEK (`my kek`, ADR-0019 §6)
        # through a Store port and the sealed columns that the composition root takes from the
        # modules; it owns no tables and depends only on kernel (Sealer) and uow.
        app-rewrap:
          list-mode: strict
          files:
            - "**/internal/app/rewrap/**"
          allow:
            - $gostd
            - github.com/mycroblog/my/internal/app/rewrap
            - github.com/mycroblog/my/internal/app/kernel
            - github.com/mycroblog/my/internal/app/uow
        # app/stream holds the ports of the real-time updates (Publisher / Subscriber, Bus,
        # Sweeper), the in-process broker, and the cross-process Relay shared by the modules that
        # publish, the streaming endpoint, and the Bus adapters; it depends only on kernel (the
        # liveness marker in the KeyValueStore) and queue (the sweep job).
        app-stream:
          list-mode: strict
          files:
            - "**/internal/app/stream/**"
          allow:
            - $gostd
            - github.com/mycroblog/my/internal/app/stream
            - github.com/mycroblog/my/internal/app/kernel
            - github.com/mycroblog/my/internal/app/queue
        # app/metrics keeps the snapshot of the instance-wide gauges (ADR-0055 §4) in the
        # KeyValueStore and computes it through the queue's BacklogReader and a function that the
        # composition root takes from the modules; it depends only on kernel and queue.
        app-metrics:
          list-mode: strict
          files:
            - "**/internal/app/metrics/**"
          allow:
            - $gostd
            - github.com/mycroblog/my/internal/app/metrics
            - github.com/mycroblog/my/internal/app/kernel
            - github.com/mycroblog/my/internal/app/queue
        # app/blob (BlobStore) and app/media (MediaProcessor) hold ports shared by every module that
        # keeps files and by their adapters; like kernel, they depend on nothing in the repository.
        app-blob:
          list-mode: strict
          files:
            - "**/internal/app/blob/**"
          allow:
            - $gostd
            - github.com/mycroblog/my/internal/app/blob
        app-media:
          list-mode: strict
          files:
            - "**/internal/app/media/**"
          allow:
            - $gostd
            - github.com/mycroblog/my/internal/app/media
        i18n:
          list-mode: strict
          files:
            - "**/internal/i18n/**"
          allow:
            - $gostd
            - github.com/mycroblog/my/internal/i18n
            - github.com/mycroblog/my/locales
            - github.com/kaptinlin/messageformat-go/mf1
            # BCP 47 tag parsing for Canonicalize, the same as the language preferences: pure-Go data, not an external resource.
            - golang.org/x/text/language
        # bluemonday is the remote HTML sanitizer (ADR-0019 §2); it stays inside the adapter of
        # kernel.HTMLSanitizer so that every caller goes through the port and its policy version,
        # and holds the allowlist of the instance's documents (htmlsanitizer.SanitizeDocument).
        bluemonday:
          list-mode: lax
          files:
            - $all
            - "!**/internal/adapter/htmlsanitizer/**"
          deny:
            - pkg: github.com/microcosm-cc/bluemonday
              desc: sanitize HTML through kernel.HTMLSanitizer (internal/adapter/htmlsanitizer)
        # goldmark renders the instance's documents (#489); it stays inside the adapter of
        # instance.DocumentRenderer, which sanitizes what it renders with the document allowlist.
        goldmark:
          list-mode: lax
          files:
            - $all
            - "!**/internal/adapter/markdown/**"
          deny:
            - pkg: github.com/yuin/goldmark
              desc: render Markdown through instance.DocumentRenderer (internal/adapter/markdown)
        # The HTTP signature libraries (ADR-0006) stay inside the adapter of federation.Signer and
        # federation.Verifier, so that every signature goes through the policy of ADR-0032.
        httpsig:
          list-mode: lax
          files:
            - $all
            - "!**/internal/adapter/httpsig/**"
          deny:
            - pkg: github.com/dadrus/httpsig
              desc: sign and verify through federation.Signer / federation.Verifier (internal/adapter/httpsig)
            - pkg: code.superseriousbusiness.org/httpsig
              desc: sign and verify through federation.Signer / federation.Verifier (internal/adapter/httpsig)
            - pkg: github.com/dunglas/httpsfv
              desc: Structured Fields of HTTP signatures are parsed in internal/adapter/httpsig
        # The WebAuthn library stays inside the adapter of identity.PasskeyCeremonies (FR-004), so that
        # every passkey ceremony asks for the same discoverable, user-verified credential.
        webauthn:
          list-mode: lax
          files:
            - $all
            - "!**/internal/adapter/webauthn/**"
          deny:
            - pkg: github.com/go-webauthn
              desc: run WebAuthn ceremonies through identity.PasskeyCeremonies (internal/adapter/webauthn)
        # The OpenTelemetry SDK and the Prometheus client stay inside the adapters of kernel.Meter and kernel.Tracer
        # (ADR-0055 §1, ADR-0063 §1), so that the core, the interfaces, and the other adapters measure and trace through the ports.
        # The otlp error exporter (ADR-0103 §4 (3)) sends the error reports as OpenTelemetry log records.
        opentelemetry:
          list-mode: lax
          files:
            - $all
            - "!**/internal/adapter/telemetry/**"
            - "!**/internal/adapter/errorreport/otlp/**"
          deny:
            - pkg: go.opentelemetry.io
              desc: measure and trace through kernel.Meter and kernel.Tracer (internal/adapter/telemetry)
            - pkg: github.com/prometheus
              desc: measure and trace through kernel.Meter and kernel.Tracer (internal/adapter/telemetry)
        interface:
          list-mode: lax
          files:
            - "**/internal/interface/**"
            - "!$test"
          deny:
            - pkg: github.com/mycroblog/my/internal/adapter
              desc: interface code reaches adapters only through application ports
            - pkg: github.com/mycroblog/my/internal/platform
              desc: only cmd imports the composition root
            - pkg: github.com/mycroblog/my/pkg/testkit
              desc: testkit is for adapter contract tests
        interface-tests:
          # Tests may use pkg/testkit fakes (clock, IDs, fixtures); production interface code may not.
          list-mode: lax
          files:
            - "**/internal/interface/**/*_test.go"
          deny:
            - pkg: github.com/mycroblog/my/internal/adapter
              desc: interface tests reach adapters only through application ports
            - pkg: github.com/mycroblog/my/internal/platform
              desc: only cmd imports the composition root
        adapter:
          list-mode: lax
          files:
            - "**/internal/adapter/**"
          deny:
            - pkg: github.com/mycroblog/my/internal/interface
              desc: adapters implement application ports and never call inbound interfaces
            - pkg: github.com/mycroblog/my/internal/platform
              desc: only cmd imports the composition root
        testkit:
          list-mode: lax
          files:
            - "**/pkg/testkit/**"
          deny:
            - pkg: github.com/mycroblog/my/internal/interface
              desc: testkit depends only on application ports and domain types
            - pkg: github.com/mycroblog/my/internal/adapter
              desc: testkit depends only on application ports and domain types
            - pkg: github.com/mycroblog/my/internal/platform
              desc: testkit depends only on application ports and domain types
        # The fake payment provider records payments as paid without any money moving: besides the tests, only the
        # test builds (build tag e2e_fakes) link it, through one file (ADR-0117 §2; scripts/go-build-tags.sh checks it).
        payment-fake:
          list-mode: lax
          files:
            - $all
            - "!$test"
            - "!**/internal/adapter/payment/fake/**"
            - "!**/internal/platform/adapters_payments_fake.go"
          deny:
            - pkg: github.com/mycroblog/my/internal/adapter/payment/fake
              desc: only internal/platform/adapters_payments_fake.go (build tag e2e_fakes) and tests import the fake payment provider
        # The fake push service accepts any push message for its own subscriptions: besides the tests, only the test
        # builds (build tag e2e_fakes) link it, through the one file of my dev push-service (ADR-0118 §1).
        push-service-fake:
          list-mode: lax
          files:
            - $all
            - "!$test"
            - "!**/internal/adapter/pushservice/fake/**"
            - "!**/cmd/my/dev_push_service.go"
          deny:
            - pkg: github.com/mycroblog/my/internal/adapter/pushservice/fake
              desc: only cmd/my/dev_push_service.go (build tag e2e_fakes) and tests import the fake push service
        # The live interoperability scenarios are black-box clients of running servers (federation.md §12):
        # HTTP to the client APIs and a read of this server's database (pgx), nothing of this module.
        federation-live:
          list-mode: strict
          files:
            - "**/deploy/docker/federation-live/**"
          allow:
            - $gostd
            - github.com/jackc/pgx/v5
    # Only the struct types marked //exhaustruct:enforce must list every field: the generated
    # <Accessor>Args of an i18n message with two or more arguments (ADR-0009, tools/i18n/src/generate.ts),
    # where a field left out is a missing argument.
    exhaustruct_v5:
      explicit-mode: true
    # Every outbound request goes through the SSRF-guarded kernel.HTTPClient (ADR-0019 §1);
    # http.DefaultClient and the package-level helpers that use it bypass the guard.
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^http\.(DefaultClient|Get|Head|Post|PostForm)$
          pkg: ^net/http$
          msg: send outbound requests through kernel.HTTPClient (ADR-0019 §1)
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/mycroblog/my
  exclusions:
    generated: lax

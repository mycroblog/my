# SPDX-License-Identifier: AGPL-3.0-only
#
# Code generated by `scripts/task.sh api:generate` from api/spec/ with `redocly bundle`. DO NOT EDIT.
# The client API (ADR-0007, ADR-0016): edit the files in api/spec/ and run `scripts/task.sh api:generate` (ADR-0066).
# docs/architecture/client-api.md explains how to add an endpoint.
openapi: 3.1.0
info:
  title: my client API
  version: 0.1.0
  description: |
    The client API of my, an ActivityPub microblog server. It is not compatible with the
    Mastodon client API.

    - Every error is an RFC 9457 problem document (`application/problem+json`) whose `title`
      and `detail` are localized from `Accept-Language`. Clients branch on `type` and `status`,
      never on the text.
    - Requests authenticate with an OAuth 2.0 access token in `Authorization: Bearer`, never
      with cookies. Each operation lists the scopes it needs under `security`; a broad scope
      (`read`, `write`, `follow`, `admin`) grants the fine-grained scopes under it. A missing or
      invalid token is a 401 with `WWW-Authenticate`, a token without the scope a 403
      `insufficient_scope`.
    - Every response carries the `RateLimit` and `RateLimit-Policy` fields
      (draft-ietf-httpapi-ratelimit-headers): anonymous requests share a limit per client IP,
      authenticated requests one per account. Past the limit the answer is 429 with
      `Retry-After`.
    - IDs are UUIDv7 strings. Collections use keyset pagination: pass the `next_cursor` of a
      page as `cursor` to get the next page.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: /api/v1
security:
  - oauth2: []
tags:
  - name: instance
    description: Public information about the instance.
  - name: accounts
    description: Accounts and the authenticated user's own account.
  - name: media
    description: Media files that the user uploads to attach to posts.
  - name: preferences
    description: The authenticated user's preferences.
  - name: two_factor
    description: The authenticated user's two-factor authentication.
  - name: passkeys
    description: The authenticated user's passkeys, which sign in instead of the password.
  - name: authorized_apps
    description: The apps the authenticated user authorized with OAuth, and revoking them.
  - name: oauth-apps
    description: The OAuth apps that the authenticated user registered, and tokens of them for the user's own account.
  - name: moderation
    description: The moderation actions on the authenticated user's own account.
  - name: notifications
    description: The authenticated user's notifications, their read marker, and dismissals.
  - name: push
    description: The Web Push subscription of the access token's grant.
  - name: statuses
    description: Posts, their threads and edit history, and boosts, favourites, bookmarks, and pins of them.
  - name: timelines
    description: The home, local, hashtag, and account timelines.
  - name: reports
    description: Reports of accounts and posts to the moderators.
  - name: streaming
    description: Real-time updates of the home timeline, the notifications, and the announcements.
  - name: announcements
    description: The server's announcements to every local user and which of them the user has read.
  - name: custom-emojis
    description: |
      The custom emoji that the holders of the `create_custom_emojis` permission request and
      made (ADR-0070 §6): their requests for new emoji and new images, which a holder of
      `manage_custom_emojis` approves, and the emoji they made. The operations need a
      `read:custom_emojis` or `write:custom_emojis` scope and the `create_custom_emojis`
      permission, never an `admin` scope.
  - name: finance
    description: |
      The instance's finances as the holders of the `view_finance` permission read them, as far
      as the instance settings show (ADR-0070 §5). The operations need a `read` scope and the
      `view_finance` or the `manage_finance` permission, never an `admin` scope.
  - name: supporters
    description: |
      The authenticated user's own subscription to the supporter plans (ADR-0072 §18):
      subscribing through the payment provider's hosted checkout, changing the plan, canceling
      and resuming, and the provider's portal. The operations need a `read:supporters` or
      `write:supporters` scope.
  - name: admin-moderation
    description: |
      The staff's moderation: reports, appeals, accounts and the actions on them, registrations,
      sign-up blocks, invites, domain actions, the health of remote servers, the audit log, and
      the counts of what awaits the moderators (ADR-0058). The operations need an `admin` scope and a
      permission of the user's roles in the moderation category; a user without it gets a 403
      `/api/v1/problems/missing-permission`.
  - name: admin-server
    description: |
      The administration of the server itself: its settings and texts, its rules, the roles and
      granting them, the custom emoji, the webhooks, the announcements, and the dead jobs of the
      job queue (ADR-0058). The
      operations need an `admin` scope and a permission of the user's roles in the server
      category; a user without it gets a 403 `/api/v1/problems/missing-permission`.
paths:
  /instance:
    get:
      operationId: getInstance
      summary: Get the public information of the instance
      tags:
        - instance
      security: []
      responses:
        '200':
          description: |
            The instance. The texts that its administrators write (the name, the descriptions,
            the rules, the alternative text of the thumbnail) hold one value each, which is the
            same in every locale. Like every response of the API, it varies with
            `Accept-Language`.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
        default:
          $ref: '#/components/responses/Problem'
  /custom_emojis:
    get:
      operationId: listCustomEmojis
      summary: List the custom emoji of the picker
      description: |
        The custom emoji of the instance that the picker offers (FR-111, ADR-0051 §4): every
        enabled local emoji that is not hidden from the picker, by category (those without one
        first) and shortcode. A text can use every enabled local emoji, hidden or not. The list
        is not paginated.
      tags:
        - instance
      security:
        - {}
        - oauth2:
            - read
      responses:
        '200':
          description: The custom emoji.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PickerCustomEmojiList'
        default:
          $ref: '#/components/responses/Problem'
  /custom_emojis/mine:
    get:
      operationId: listOwnCustomEmojis
      summary: List the custom emoji that the user made
      description: |
        The local custom emoji that the user made (ADR-0070 §6), newest first, with what the user
        used of their limit: their emoji and their pending requests to create one, and the limit,
        which a supporter plan sets and which is absent for no limit (ADR-0070 §4). Needs the `create_custom_emojis` permission (a 403 `/api/v1/problems/missing-permission` otherwise).
      tags:
        - custom-emojis
      security:
        - oauth2:
            - read:custom_emojis
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of the emoji.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnCustomEmojiPage'
        default:
          $ref: '#/components/responses/Problem'
  /custom_emojis/mine/{id}:
    parameters:
      - $ref: '#/components/parameters/CustomEmojiId'
    patch:
      operationId: updateOwnCustomEmoji
      summary: Change a custom emoji that the user made
      description: |
        Changes the aliases, the category, and the place in the picker of a local emoji that the
        user made, and keeps the rest (ADR-0070 §3); a new image is a request
        (`POST /custom_emoji_requests`). The rules of `PATCH /admin/custom_emojis/{id}` apply, and
        the change is recorded in the audit log. An emoji that is not one the user made is a 404.
        Needs the `create_custom_emojis` permission (a 403 `/api/v1/problems/missing-permission` otherwise).
      tags:
        - custom-emojis
      security:
        - oauth2:
            - write:custom_emojis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOwnCustomEmojiRequest'
      responses:
        '200':
          $ref: '#/components/responses/OwnCustomEmoji'
        '422':
          $ref: '#/components/responses/CustomEmojiProblem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteOwnCustomEmoji
      summary: Delete a custom emoji that the user made
      description: |
        Deletes a local emoji that the user made for good, as `DELETE /admin/custom_emojis/{id}`
        does, which frees a place of the user's limit; a pending request for a new image of it
        lapses. The deletion is recorded in the audit log. An emoji that is not one the user made
        is a 404. Needs the `create_custom_emojis` permission (a 403 `/api/v1/problems/missing-permission` otherwise).
      tags:
        - custom-emojis
      security:
        - oauth2:
            - write:custom_emojis
      responses:
        '204':
          description: The emoji is deleted.
        default:
          $ref: '#/components/responses/Problem'
  /custom_emoji_requests:
    get:
      operationId: listCustomEmojiRequests
      summary: List the user's custom emoji requests
      description: |
        The user's requests for new custom emoji and new images of their own (ADR-0070 §6),
        newest first, in every state. Needs the `create_custom_emojis` permission (a 403 `/api/v1/problems/missing-permission` otherwise).
      tags:
        - custom-emojis
      security:
        - oauth2:
            - read:custom_emojis
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of the requests.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomEmojiRequestPage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createCustomEmojiRequest
      summary: Request a custom emoji or a new image of one
      description: |
        Requests a new local custom emoji (`create`) or a new image of a local emoji that the user
        made (`image`), which a holder of `manage_custom_emojis` approves or rejects (ADR-0070 §2,
        §3). Until then, the request is no emoji: nothing shows its image. A pending `create`
        request reserves its shortcode. The image follows the rules of `POST /admin/custom_emojis`.
        A shortcode or an image that breaks the rules, a shortcode that a local emoji has or a
        pending request reserves, a `create` request once the user's emoji and pending `create`
        requests are as many as their limit (`limit_reached`), and a second pending `image`
        request for an emoji (`request_pending`) are a 422
        `/api/v1/problems/invalid-custom-emoji` whose `reason` says which. A `create` request
        without `shortcode` and an `image` request without `emoji_id` are a 422 naming the
        property, and an `image` request for an emoji that is not one the user made is a 404.
        The request is recorded in the audit log and notified to the holders of
        `manage_custom_emojis`. Needs the `create_custom_emojis` permission (a 403 `/api/v1/problems/missing-permission` otherwise).
      tags:
        - custom-emojis
      security:
        - oauth2:
            - write:custom_emojis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCustomEmojiRequest'
      responses:
        '200':
          $ref: '#/components/responses/CustomEmojiRequest'
        '422':
          $ref: '#/components/responses/CustomEmojiProblem'
        default:
          $ref: '#/components/responses/Problem'
  /custom_emoji_requests/{id}/withdraw:
    parameters:
      - $ref: '#/components/parameters/CustomEmojiRequestId'
    post:
      operationId: withdrawCustomEmojiRequest
      summary: Withdraw a custom emoji request
      description: |
        Withdraws a pending request of the user, which frees its shortcode; the withdrawal is
        recorded in the audit log. A request that is not pending is a 409
        `/api/v1/problems/custom-emoji-request-conflict` (`not_pending`), and an unknown request
        or one of another user a 404. Needs the `create_custom_emojis` permission (a 403 `/api/v1/problems/missing-permission` otherwise).
      tags:
        - custom-emojis
      security:
        - oauth2:
            - write:custom_emojis
      responses:
        '200':
          $ref: '#/components/responses/CustomEmojiRequest'
        '409':
          $ref: '#/components/responses/CustomEmojiRequestProblem'
        default:
          $ref: '#/components/responses/Problem'
  /instance/documents/{kind}:
    get:
      operationId: getInstanceDocument
      summary: Get a document of the instance
      description: |
        The body of the terms of service (`terms`), the privacy policy (`privacy_policy`) or the
        commerce disclosures of the supporter plans (`commerce_disclosure`) that the instance
        has published, as sanitized HTML with the time of its last revision. A 404 when the
        instance has not published the document (`Instance.terms_url`,
        `Instance.privacy_policy_url` and `Instance.commerce_disclosure_url` are omitted then),
        and for an unknown kind. The web client shows it at `/about/terms`, `/about/privacy`
        and `/about/commerce`.
      tags:
        - instance
      security: []
      parameters:
        - $ref: '#/components/parameters/InstanceDocumentKind'
      responses:
        '200':
          description: The document.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceDocument'
        default:
          $ref: '#/components/responses/Problem'
  /instance/domain_actions:
    get:
      operationId: listInstanceDomainActions
      summary: List the domains that the instance moderates
      description: |
        The moderation actions in effect on remote domains that the instance lists publicly
        (FR-718): `limit` and `suspend`, one item per action, newest first. The instance
        setting `domain_actions_visibility` decides who may read it: `none` makes it a 404,
        `users` a 401 `/api/v1/problems/unauthenticated` for a request without an access
        token, and `all` serves everyone. The setting `domain_actions_rationale_visibility`
        decides, in the same way, who gets each action's public comment. The moderators'
        private notes are never listed.
      tags:
        - instance
      security: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of domain actions.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceDomainActionPage'
        default:
          $ref: '#/components/responses/Problem'
  /instance/cost_totals:
    get:
      operationId: getInstanceCostTotals
      summary: Total the instance's public costs by period
      description: |
        The totals of the instance's costs that the instance setting `finance_visibility`
        publishes (FR-903, ADR-0067 §8, §9). It takes the query of `GET /admin/cost_totals` and
        answers the same shape: `private` makes it a 404; `totals` leaves every `breakdown` empty
        and the `rules` without `sources`, which would name the providers; `breakdown` gives the
        breakdown by provider, category, and currency, and the providers' rules. No level returns
        the names, memos, or individual payments of the cost items. The periods stop at the one
        that holds today (UTC): a `to` after today reads as today, and a `from` after today gives
        no period. More than 104 weeks, 60 months, or 20 years, and `to` before `from`, are a 422
        naming `to`.
      tags:
        - instance
      security: []
      parameters:
        - name: granularity
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/CostGranularity'
        - name: from
          in: query
          required: true
          description: A date in the first period.
          schema:
            $ref: '#/components/schemas/CalendarDate'
        - name: to
          in: query
          required: true
          description: A date in the last period; a date after today reads as today.
          schema:
            $ref: '#/components/schemas/CalendarDate'
        - name: basis
          in: query
          required: false
          description: How the totals place a payment; `amortized` by default.
          schema:
            $ref: '#/components/schemas/CostBasis'
      responses:
        '200':
          description: The public totals.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostTotals'
        default:
          $ref: '#/components/responses/Problem'
  /instance/income_totals:
    get:
      operationId: getInstanceIncomeTotals
      summary: Total the instance's public income by period
      description: |
        The net income that the instance setting `income_visibility` publishes (FR-917,
        ADR-0073 §7, §9). It takes the query of `GET /admin/cost_totals`: `private` makes it a
        404; `totals` gives the net of each currency by period; `plans` adds `plans`, the number
        of members of each supporter plan now. Each period carries `balance`, the net less the
        costs, only while `finance_visibility` is not `private` either, since the balance would
        otherwise tell the hidden side. No level returns individual payments, the subscribers,
        the amounts of each plan, or the gross and the fees. The periods stop at the one that
        holds today (UTC): a `to` after today reads as today, and a `from` after today gives no
        period. More than 104 weeks, 60 months, or 20 years, and `to` before `from`, are a 422
        naming `to`.
      tags:
        - instance
      security: []
      parameters:
        - name: granularity
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/CostGranularity'
        - name: from
          in: query
          required: true
          description: A date in the first period.
          schema:
            $ref: '#/components/schemas/CalendarDate'
        - name: to
          in: query
          required: true
          description: A date in the last period; a date after today reads as today.
          schema:
            $ref: '#/components/schemas/CalendarDate'
        - name: basis
          in: query
          required: false
          description: How the totals place a payment; `amortized` by default.
          schema:
            $ref: '#/components/schemas/CostBasis'
      responses:
        '200':
          description: The public income totals.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomeTotals'
        default:
          $ref: '#/components/responses/Problem'
  /instance/supporter_plans:
    get:
      operationId: listSupporterPlans
      summary: List the supporter plans
      description: |
        The supporter plans that take subscriptions, by rank, with their monthly and yearly
        prices (ADR-0072 §18). A 404 while the supporter program is disabled
        (`Instance.supporters_enabled`).
      tags:
        - instance
      security: []
      responses:
        '200':
          description: The plans.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupporterPlanList'
        default:
          $ref: '#/components/responses/Problem'
  /instance/supporters:
    get:
      operationId: listInstanceSupporters
      summary: List the supporters who chose to be listed
      description: |
        The members of the supporter plans who chose to be listed (`PUT
        /preferences/supporter_listing`), by plan in the plans' order and newest first within a
        plan, with the plans that are not retired for the headings (ADR-0071 §4). Only each
        member's account is listed: never an amount, an interval, a date, or a count. Accounts
        that the viewer may not see are left out, so a page may be shorter than `limit`. The
        instance setting `supporter_list_visibility` decides who may read it: `off` makes it a
        404, `signed_in` a 401 `/api/v1/problems/unauthenticated` for a request without an access
        token, and `public` serves everyone. The responses always carry `X-Robots-Tag: noindex,
        noarchive`.
      tags:
        - instance
      security:
        - {}
        - oauth2:
            - read:accounts
      parameters:
        - name: plan_id
          in: query
          description: Only the members of this plan.
          schema:
            $ref: '#/components/schemas/Id'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of listed supporters.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Robots-Tag:
              $ref: '#/components/headers/XRobotsTag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupporterListPage'
        default:
          $ref: '#/components/responses/Problem'
  /accounts/verify_credentials:
    get:
      operationId: verifyAccountCredentials
      summary: Get the authenticated user's own account
      tags:
        - accounts
      security:
        - oauth2:
            - read:accounts
      responses:
        '200':
          description: The account that the access token acts as, with the source of its profile.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialAccount'
        default:
          $ref: '#/components/responses/Problem'
  /accounts/update_credentials:
    patch:
      operationId: updateAccountCredentials
      summary: Change the authenticated user's profile
      description: |
        Records a new revision of the profile. Properties left out of the request keep their
        current values. The note and the field values are plain text that the server renders
        to HTML like the text of a post (mentions, hashtags, and URLs become links). A 422
        problem names the property that is invalid in `detail`.
      tags:
        - accounts
      security:
        - oauth2:
            - write:accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCredentialsRequest'
      responses:
        '200':
          description: The account with its new profile.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialAccount'
        default:
          $ref: '#/components/responses/Problem'
  /preferences:
    get:
      operationId: getPreferences
      summary: Get the authenticated user's preferences
      tags:
        - preferences
      security:
        - oauth2:
            - read:accounts
      responses:
        '200':
          description: The preferences.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updatePreferences
      summary: Change the authenticated user's preferences
      description: |
        Properties left out of the request keep their current values. Language tags are
        canonicalized (`ja-jp` becomes `ja-JP`). A 422 problem names the property that is
        invalid in `detail`.
      tags:
        - preferences
      security:
        - oauth2:
            - write:accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePreferencesRequest'
      responses:
        '200':
          description: The preferences after the change.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        default:
          $ref: '#/components/responses/Problem'
  /preferences/auto_delete:
    get:
      operationId: getAutoDeletePolicy
      summary: Get the authenticated user's automatic deletion of old posts
      description: |
        The policy that deletes the user's own posts some days after their publication (FR-118).
        A user who has never saved one gets the default policy, which is disabled.
      tags:
        - preferences
      security:
        - oauth2:
            - read:accounts
      responses:
        '200':
          description: The policy.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoDeletePolicy'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateAutoDeletePolicy
      summary: Replace the authenticated user's automatic deletion of old posts
      description: |
        Replaces the whole policy. Once it is enabled, an hourly job deletes the user's posts
        published more than `min_age_days` days ago, unless an exception keeps them, as the user
        would delete them: each deletion is sent to the servers the post went to. A run deletes
        at most 100 posts of a user, so a policy that finds more spreads their deletion over the
        following hours. Boosts are not deleted. A 422 problem names the property that is invalid
        in `detail`.
      tags:
        - preferences
      security:
        - oauth2:
            - write:accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoDeletePolicy'
      responses:
        '200':
          description: The policy as saved.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoDeletePolicy'
        default:
          $ref: '#/components/responses/Problem'
  /preferences/badges:
    get:
      operationId: listBadgeChoices
      summary: List the badges that the authenticated user may show
      description: |
        The roles that the user holds and that have a badge, highest position first, with whether
        the user shows each badge on their profile (ADR-0071). Every badge is hidden until the user
        shows it.
      tags:
        - preferences
      security:
        - oauth2:
            - read:accounts
      responses:
        '200':
          description: The badges.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadgeChoiceList'
        default:
          $ref: '#/components/responses/Problem'
  /preferences/badges/{role_id}:
    parameters:
      - $ref: '#/components/parameters/BadgeRoleId'
    put:
      operationId: updateBadgeChoice
      summary: Show or hide the badge of a role on the authenticated user's profile
      description: |
        Shows or hides the badge of a role that the user holds on their profile (ADR-0071). The
        badge appears in `Account.badges` of the user's own account endpoints only, never on
        posts, in lists of accounts, or to other servers. A role that the user does not hold, or
        that has no badge, is a 404.
      tags:
        - preferences
      security:
        - oauth2:
            - write:accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBadgeChoiceRequest'
      responses:
        '200':
          description: The choice as saved.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadgeChoice'
        default:
          $ref: '#/components/responses/Problem'
  /preferences/supporter_listing:
    get:
      operationId: getSupporterListing
      summary: Get whether the authenticated user is on the supporter list
      description: |
        Whether the user chose to be listed on the supporter list (`GET /instance/supporters`,
        ADR-0071 §4). Nobody is listed until they choose to be, and the choice ends with the
        subscription. A 404 for a user who is not a member of a plan (an `active`, `canceling`,
        or `past_due` subscription) and while the program is disabled.
      tags:
        - preferences
      security:
        - oauth2:
            - read:accounts
      responses:
        '200':
          description: The choice.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupporterListing'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateSupporterListing
      summary: Choose whether the authenticated user is on the supporter list
      description: |
        Lists the user on the supporter list or takes them off it. The choice is one per user,
        whichever plan they are a member of; it stays when the plan changes and is deleted when
        the subscription ends. A 404 for a user who is not a member of a plan and while the
        program is disabled.
      tags:
        - preferences
      security:
        - oauth2:
            - write:accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupporterListing'
      responses:
        '200':
          description: The choice as saved.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupporterListing'
        default:
          $ref: '#/components/responses/Problem'
  /accounts/delete:
    post:
      operationId: deleteOwnAccount
      x-first-party-only: true
      summary: Delete the authenticated user's account
      description: |
        Deletes the user's own account at once, after checking the user's current `password`
        or a `passkey` of the user (FR-008); a user without a password confirms with a passkey.
        The account and its posts disappear, every session and token of the user ends, and the
        other servers get a `Delete` of the actor; the data is erased 7 days later. It cannot be
        undone, and the username is never reused. A wrong password is a 422
        `/api/v1/problems/wrong-password`, a passkey that does not verify a 422
        `/api/v1/problems/invalid-passkey`, and an expired confirmation a 422
        `/api/v1/problems/passkey-confirmation-expired`; at most 5 attempts per account are
        accepted every hour.
      tags:
        - accounts
      security:
        - oauth2:
            - write:accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteOwnAccountRequest'
      responses:
        '204':
          description: The account is deleted.
        default:
          $ref: '#/components/responses/Problem'
  /accounts/password:
    get:
      operationId: getPasswordStatus
      x-first-party-only: true
      summary: Get whether the authenticated user has a password
      description: |
        Whether the user signs in with a password, or with passkeys only after removing it
        (FR-004).
      tags:
        - accounts
      security:
        - oauth2:
            - read:accounts
      responses:
        '200':
          description: Whether the user has a password.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordStatus'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: changePassword
      x-first-party-only: true
      summary: Change or set the authenticated user's password
      description: |
        Replaces the user's password with `new_password` after checking `current_password` or
        a `passkey` of the user (FR-002); a user without a password sets one with a passkey.
        Every other session and grant of the user ends: the user is signed out of the server's
        sign-in pages and of every app but the one that makes the request, whose tokens keep
        working. Passkeys and two-factor authentication stay as they are, and the user is told
        by email when the server sends email. A wrong current password is a 422
        `/api/v1/problems/wrong-password`, a passkey that does not verify a 422
        `/api/v1/problems/invalid-passkey`, and an expired confirmation a 422
        `/api/v1/problems/passkey-confirmation-expired`; at most 5 wrong ones per user are
        accepted every hour. A new password that is not 8 to 128 characters is a 400 that
        names `new_password`.
      tags:
        - accounts
      security:
        - oauth2:
            - write:accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: The password is changed.
        default:
          $ref: '#/components/responses/Problem'
  /accounts/password/remove:
    post:
      operationId: removePassword
      x-first-party-only: true
      summary: Remove the authenticated user's password
      description: |
        Removes the password of a user who has a passkey, after checking a `passkey` of the
        user (FR-004): from then on only the passkeys sign in, and a user with two-factor
        authentication still enters a code after one. A password reset link or
        `POST /accounts/password` with a passkey sets a password again. Every other session and
        grant of the user ends, as a change of the password does, and the user is told by email
        when the server sends email. A user without a password gets a 204 and nothing changes.
        A user without a passkey gets a 409 `/api/v1/problems/last-sign-in-method`; a passkey
        that does not verify is a 422 `/api/v1/problems/invalid-passkey`, an expired
        confirmation a 422 `/api/v1/problems/passkey-confirmation-expired`, and at most 5 wrong
        ones per user are accepted every hour.
      tags:
        - accounts
      security:
        - oauth2:
            - write:accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemovePasswordRequest'
      responses:
        '204':
          description: The user has no password.
        default:
          $ref: '#/components/responses/Problem'
  /exports:
    get:
      operationId: listDataExports
      summary: List the authenticated user's data exports
      description: |
        Lists the user's latest 10 data exports, newest first. An archive can be downloaded
        while its export is `ready`; exports are removed 7 days after they end.
      tags:
        - accounts
      security:
        - oauth2:
            - read:accounts
      responses:
        '200':
          description: The exports.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataExportList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: requestDataExport
      summary: Request an archive of the authenticated user's data
      description: |
        Starts building a ZIP archive of the user's data (FR-008): `actor.json` (the actor),
        `outbox.json` (every post as an ActivityStreams `OrderedCollection` of `Create`
        activities), `moderation.json` (the moderation actions on the account, its appeals, and
        the reports it filed), and the CSV files of `exportCsv` (`following_accounts.csv`,
        `blocked_accounts.csv`, `muted_accounts.csv`, `bookmarks.csv`). The export is
        `pending` until the archive is built. While
        another export is `pending` the request is a 409 `/api/v1/problems/export-in-progress`;
        at most 3 requests per account are accepted every day.
      tags:
        - accounts
      security:
        - oauth2:
            - write:accounts
      responses:
        '202':
          description: The export, being built.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataExport'
        default:
          $ref: '#/components/responses/Problem'
  /exports/{id}/archive:
    get:
      operationId: downloadDataExport
      summary: Download the archive of a data export
      description: |
        Returns the ZIP archive of one of the user's exports. An export that is not `ready` is
        a 409 `/api/v1/problems/export-not-ready`; another user's export is a 404.
      tags:
        - accounts
      security:
        - oauth2:
            - read:accounts
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the export.
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: The archive.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: Names the file to save the archive as.
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Problem'
  /csv_exports/{kind}:
    get:
      operationId: exportCsv
      summary: Export the authenticated user's follows, blocks, mutes, muted domains, or bookmarks as CSV
      description: |
        Returns what the user has of `kind` now as the CSV file that Mastodon exports, which
        Mastodon and this server import (FR-008): `following` is `following_accounts.csv`
        (`Account address,Show boosts,Notify on new posts,Languages`, the active follows),
        `blocks` is `blocked_accounts.csv` (one address per line), `mutes` is
        `muted_accounts.csv` (`Account address,Hide notifications`, the mutes in effect),
        `domain_mutes` is `blocked_domains.csv` (one domain per line, the domains the user
        mutes, which Mastodon imports as blocked domains), and `bookmarks` is `bookmarks.csv`
        (one post URI per line, the posts the user may still see).
        Addresses are `username@domain`, with the account domain for this server's accounts;
        remote accounts whose handle is unconfirmed are left out. At most 30 exports per account
        are accepted every hour.
      tags:
        - accounts
      security:
        - oauth2:
            - read:accounts
      parameters:
        - name: kind
          in: path
          required: true
          description: What to export.
          schema:
            $ref: '#/components/schemas/DataImportKind'
      responses:
        '200':
          description: The CSV file.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: Names the file to save the CSV as, the name Mastodon gives it.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Problem'
  /imports:
    get:
      operationId: listDataImports
      summary: List the authenticated user's imports
      description: |
        Lists the user's latest 10 imports of CSV files, newest first, with their progress.
        Imports are removed 7 days after they start.
      tags:
        - accounts
      security:
        - oauth2:
            - read:accounts
      responses:
        '200':
          description: The imports.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataImportList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: startDataImport
      summary: Import a CSV file of follows, blocks, mutes, muted domains, or bookmarks
      description: |
        Imports a CSV file in the format that Mastodon exports (`exportCsv`; FR-008). The file's
        entries are what `previewDataImport` reports; `merge` adds them and keeps the rest, and
        `overwrite` also removes what the user has of `kind` that the file does not list. The
        server carries the import out in the background: it resolves remote accounts and posts
        on their servers, sends the follows, and counts the entries it could not carry out
        (an account or post that cannot be found or acted on). The import is `in_progress`
        until every entry is done. While another import of the user is `in_progress` the
        request is a 409 `/api/v1/problems/import-in-progress`. At most 10 imports per account
        are accepted every day.
      tags:
        - accounts
      security:
        - oauth2:
            - write:accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataImportRequest'
      responses:
        '202':
          description: The import, being carried out.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataImport'
        default:
          $ref: '#/components/responses/Problem'
  /imports/preview:
    post:
      operationId: previewDataImport
      summary: Preview an import of a CSV file
      description: |
        Reads a CSV file as `startDataImport` would and tells what importing it would do,
        changing nothing. The header row is optional, a leading `@` of an address is dropped,
        and blank lines are ignored; a line that names no address (or for `bookmarks`, no
        `http(s)` URL) is skipped as `invalid`, and one that repeats an earlier entry as
        `duplicate`. Settings left out default as in Mastodon: boosts shown, no notifications of
        new posts, notifications of a muted account hidden. The `Languages` column of a follow
        is ignored. A file that is not CSV or has more than 10,000 entries is a 422.
      tags:
        - accounts
      security:
        - oauth2:
            - write:accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataImportRequest'
      responses:
        '200':
          description: What the import would do.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataImportPreview'
        default:
          $ref: '#/components/responses/Problem'
  /two_factor:
    get:
      operationId: getTwoFactor
      x-first-party-only: true
      summary: Get where the authenticated user's two-factor authentication stands
      tags:
        - two_factor
      security:
        - oauth2:
            - read:accounts
      responses:
        '200':
          description: The two-factor authentication of the user.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactor'
        default:
          $ref: '#/components/responses/Problem'
  /two_factor/totp/setup:
    post:
      operationId: setUpTotp
      x-first-party-only: true
      summary: Generate a TOTP secret for the authenticated user to add to an authenticator app
      description: |
        A new secret (RFC 6238: HMAC-SHA-1, six digits, 30-second steps) as text, as an
        `otpauth://` URI, and as a QR code of the URI, with a `setup_token` that carries the
        secret to `POST /two_factor/totp` for 15 minutes. Nothing is stored until then. A user
        who has two-factor authentication enabled gets a 409
        `/api/v1/problems/two-factor-enabled`.
      tags:
        - two_factor
      security:
        - oauth2:
            - write:accounts
      responses:
        '200':
          description: The new secret.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetup'
        default:
          $ref: '#/components/responses/Problem'
  /two_factor/totp:
    post:
      operationId: enableTotp
      x-first-party-only: true
      summary: Enable two-factor authentication with the secret of a setup
      description: |
        Enrolls the secret of `setup_token` once `code` shows that the app has it, and returns
        the recovery codes, which are shown only this once. From then on, signing in asks for
        a code after the password. A wrong code is a 422
        `/api/v1/problems/invalid-two-factor-code`, an expired or unknown setup a 422
        `/api/v1/problems/totp-setup-expired`, and too many wrong codes a 429.
      tags:
        - two_factor
      security:
        - oauth2:
            - write:accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnableTotpRequest'
      responses:
        '200':
          description: The recovery codes.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodes'
        default:
          $ref: '#/components/responses/Problem'
  /two_factor/totp/disable:
    post:
      operationId: disableTotp
      x-first-party-only: true
      summary: Disable two-factor authentication
      description: |
        Ends the enrollment once `code`, a code of the app or an unused recovery code, confirms
        it. A wrong code is a 422 `/api/v1/problems/invalid-two-factor-code`, too many wrong
        codes a 429, and a user without two-factor authentication a 409
        `/api/v1/problems/two-factor-not-enabled`.
      tags:
        - two_factor
      security:
        - oauth2:
            - write:accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorCodeRequest'
      responses:
        '200':
          description: The two-factor authentication of the user, disabled.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactor'
        default:
          $ref: '#/components/responses/Problem'
  /two_factor/recovery_codes:
    post:
      operationId: regenerateRecoveryCodes
      x-first-party-only: true
      summary: Replace the recovery codes
      description: |
        Returns new recovery codes, shown only this once, once `code` confirms it; the previous
        ones stop working and the app keeps working. The problems are those of
        `POST /two_factor/totp/disable`.
      tags:
        - two_factor
      security:
        - oauth2:
            - write:accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorCodeRequest'
      responses:
        '200':
          description: The new recovery codes.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodes'
        default:
          $ref: '#/components/responses/Problem'
  /passkeys:
    get:
      operationId: listPasskeys
      x-first-party-only: true
      summary: List the authenticated user's passkeys
      description: The passkeys that sign the user in, oldest first; there are at most 20.
      tags:
        - passkeys
      security:
        - oauth2:
            - read:accounts
      responses:
        '200':
          description: The passkeys.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createPasskey
      x-first-party-only: true
      summary: Register a passkey with the browser's response to a registration
      description: |
        Verifies `credential`, the browser's answer to the `options` of
        `POST /passkeys/registration`, and stores the passkey under the name given there. From
        then on the passkey signs in on the server's sign-in page instead of the password; a
        user with two-factor authentication still enters a code after it. A response that does
        not verify (another origin, no user verification, a credential that is registered
        already) is a 422 `/api/v1/problems/invalid-passkey`, an expired or unknown
        `registration_token` a 422 `/api/v1/problems/passkey-registration-expired`, and a user
        with 20 passkeys a 409 `/api/v1/problems/too-many-passkeys`.
      tags:
        - passkeys
      security:
        - oauth2:
            - write:accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePasskeyRequest'
      responses:
        '201':
          description: The new passkey.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Passkey'
        default:
          $ref: '#/components/responses/Problem'
  /passkeys/registration:
    post:
      operationId: beginPasskeyRegistration
      x-first-party-only: true
      summary: Start the registration of a passkey
      description: |
        Checks the user's current `password` or a `passkey` of the user (a user without a
        password confirms with a passkey) and returns the options of a WebAuthn registration (a
        discoverable credential with user verification, no attestation) for the browser's
        `navigator.credentials.create()`, with a `registration_token` that carries them and
        `name` to `POST /passkeys` for 5 minutes. Nothing is stored until then. A wrong
        password is a 422 `/api/v1/problems/wrong-password`, a passkey that does not verify a
        422 `/api/v1/problems/invalid-passkey`, and an expired confirmation a 422
        `/api/v1/problems/passkey-confirmation-expired`; at most 5 wrong ones per user are
        accepted every hour. A user with 20 passkeys gets a 409
        `/api/v1/problems/too-many-passkeys`.
      tags:
        - passkeys
      security:
        - oauth2:
            - write:accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyRegistrationRequest'
      responses:
        '200':
          description: The options of the registration.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyRegistration'
        default:
          $ref: '#/components/responses/Problem'
  /passkeys/confirmation:
    post:
      operationId: beginPasskeyConfirmation
      x-first-party-only: true
      summary: Start a confirmation with a passkey
      description: |
        Returns the options of a WebAuthn authentication (with user verification) for the
        browser's `navigator.credentials.get()`, with a `confirmation_token` that carries them
        for 5 minutes, once, in the `passkey` of an operation that a passkey of the user confirms
        in place of the current password: deleting the account, changing or removing the
        password, and registering a passkey. Nothing is stored.
      tags:
        - passkeys
      security:
        - oauth2:
            - write:accounts
      responses:
        '200':
          description: The options of the confirmation.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyConfirmation'
        default:
          $ref: '#/components/responses/Problem'
  /passkeys/{id}:
    delete:
      operationId: deletePasskey
      x-first-party-only: true
      summary: Remove a passkey
      description: |
        The passkey no longer signs in. An unknown or removed passkey is a 404, and the last
        passkey of a user without a password a 409 `/api/v1/problems/last-sign-in-method`.
      tags:
        - passkeys
      security:
        - oauth2:
            - write:accounts
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the passkey.
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '204':
          description: The passkey is removed.
        default:
          $ref: '#/components/responses/Problem'
  /authorized_apps:
    get:
      operationId: listAuthorizedApps
      x-first-party-only: true
      summary: List the apps the authenticated user authorized
      description: |
        One entry per client for which the user holds a grant that still works, most recently used
        first (an app without a recorded use after those with one, newest authorization first). A
        revoked or expired grant is not listed. The server's own web client is listed too
        (`first_party`). Only the server's own clients may call it (ADR-0090 §4).
      tags:
        - authorized_apps
      security:
        - oauth2:
            - read:accounts
      responses:
        '200':
          description: The authorized apps.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizedAppList'
        default:
          $ref: '#/components/responses/Problem'
  /authorized_apps/{id}:
    delete:
      operationId: revokeAuthorizedApp
      x-first-party-only: true
      summary: Revoke an authorized app
      description: |
        Revokes every grant of the app that the user holds, so that its access and refresh tokens
        stop working at once (the next request with one is a 401). Revoking the server's own web
        client signs the user out of every browser, this one included. An app the user holds no
        working grant of is a 404. Only the server's own clients may call it (ADR-0090 §4).
      tags:
        - authorized_apps
      security:
        - oauth2:
            - write:accounts
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the app (the `id` of an authorized app).
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '204':
          description: The app is revoked.
        default:
          $ref: '#/components/responses/Problem'
  /oauth_apps:
    get:
      operationId: listOAuthApps
      x-first-party-only: true
      summary: List the OAuth apps that the authenticated user registered
      description: The apps that the user registered and has not deleted, oldest first.
      tags:
        - oauth-apps
      security:
        - oauth2:
            - read:accounts
      responses:
        '200':
          description: The apps.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthAppList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createOAuthApp
      x-first-party-only: true
      summary: Register an OAuth app
      description: |
        Registers a public or confidential app of the user for a bot, a script, or a client of
        their own (ADR-0090). A confidential app's `client_secret` is in this response only.
        Other users authorize the app at `/oauth/authorize` as any third-party app, and the user
        may issue its tokens to their own account with `POST /oauth_apps/{id}/tokens`. The app
        stops working while the user cannot use the server (suspended or deleted).

        A setting that breaks a rule is a 422 naming it, a user with 25 apps a 409
        `/api/v1/problems/too-many-oauth-apps`, and a server that does not let users register
        apps (the instance setting `user_app_registration`) a 403
        `/api/v1/problems/oauth-app-registration-disabled`.
      tags:
        - oauth-apps
      security:
        - oauth2:
            - write:accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOAuthAppRequest'
      responses:
        '201':
          description: The new app.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthAppCreated'
        default:
          $ref: '#/components/responses/Problem'
  /oauth_apps/{id}:
    parameters:
      - $ref: '#/components/parameters/OAuthAppId'
    get:
      operationId: getOAuthApp
      x-first-party-only: true
      summary: Get an OAuth app that the authenticated user registered
      description: An unknown or deleted app, or one that another user registered, is a 404.
      tags:
        - oauth-apps
      security:
        - oauth2:
            - read:accounts
      responses:
        '200':
          $ref: '#/components/responses/OAuthApp'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateOAuthApp
      x-first-party-only: true
      summary: Change an OAuth app
      description: |
        Changes what the request names and keeps the rest, checked as for a new app; a setting
        that breaks a rule is a 422 naming it. The type (public or confidential) never changes.
        The tokens of the app keep working. An unknown or deleted app, or one that another user
        registered, is a 404.
      tags:
        - oauth-apps
      security:
        - oauth2:
            - write:accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOAuthAppRequest'
      responses:
        '200':
          $ref: '#/components/responses/OAuthApp'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteOAuthApp
      x-first-party-only: true
      summary: Delete an OAuth app
      description: |
        Deletes the app for good and revokes every token of it, also those of the other users
        who authorized it. An unknown or deleted app, or one that another user registered, is a
        404.
      tags:
        - oauth-apps
      security:
        - oauth2:
            - write:accounts
      responses:
        '204':
          description: The app is deleted.
        default:
          $ref: '#/components/responses/Problem'
  /oauth_apps/{id}/secret:
    parameters:
      - $ref: '#/components/parameters/OAuthAppId'
    post:
      operationId: rotateOAuthAppSecret
      x-first-party-only: true
      summary: Issue a new secret to a confidential OAuth app
      description: |
        The old secret stops working at once: refreshing the app's tokens takes the new one,
        which is in this response only. The tokens of the app keep working. A public app is a
        409 `/api/v1/problems/public-oauth-app`. An unknown or deleted app, or one that another
        user registered, is a 404.
      tags:
        - oauth-apps
      security:
        - oauth2:
            - write:accounts
      responses:
        '200':
          description: The new secret.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthAppSecret'
        default:
          $ref: '#/components/responses/Problem'
  /oauth_apps/{id}/tokens:
    parameters:
      - $ref: '#/components/parameters/OAuthAppId'
    post:
      operationId: issueOAuthAppToken
      x-first-party-only: true
      summary: Issue tokens of an OAuth app to the authenticated user
      description: |
        Issues an access token and a refresh token of the app for the user's own account,
        without the consent screen and a redirect (ADR-0090 §2): the usual pair with the usual
        lifetimes, refreshed and revoked at the token endpoints as any other. A scope beyond the
        app's is a 422 naming `scope`, and an app that an administrator disabled a 409
        `/api/v1/problems/oauth-app-disabled`. An unknown or deleted app, or one that another
        user registered, is a 404.
      tags:
        - oauth-apps
      security:
        - oauth2:
            - write:accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueOAuthAppTokenRequest'
      responses:
        '200':
          description: The tokens.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthAppToken'
        default:
          $ref: '#/components/responses/Problem'
  /accounts/lookup:
    get:
      operationId: lookupAccount
      summary: Look up or resolve an account by its handle or URL
      description: |
        Finds `username` (a local account), `username@domain`, or the `https` URL of an actor
        (its `uri`, or a profile page that serves the actor) among the accounts that the instance
        knows. A leading `@` of a handle is ignored. An account that blocks the viewer, is
        deactivated, or is deleted is a 404, the same as an unknown one.

        With `resolve=true`, a remote account that the instance does not know yet is fetched
        from its server (FR-305): a handle through WebFinger, a URL directly. Only accounts
        whose handle WebFinger confirms are returned; a handle or URL that does not lead to one
        is a 404. Resolving needs an access token (anonymous requests get the 401 of
        `/api/v1/problems/unauthenticated`) and is limited to 30 fetches per account every
        5 minutes (429 with `Retry-After`); finding a known account is not limited. While the
        instance takes nothing in from other servers (`Instance.federation.mode` `off` or
        `outbound`), only the known accounts are found: resolving one that the instance does
        not know is a 403 `/api/v1/problems/federation-restricted`, and nothing is fetched.
      tags:
        - accounts
      security:
        - {}
        - oauth2:
            - read:accounts
      parameters:
        - name: acct
          in: query
          required: true
          description: The handle, `username` or `username@domain`, or the `https` URL of an actor.
          schema:
            type: string
            minLength: 1
            maxLength: 2048
        - name: resolve
          in: query
          required: false
          description: Fetch a remote account that the instance does not know yet.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          $ref: '#/components/responses/AccountProfile'
        default:
          $ref: '#/components/responses/Problem'
  /accounts/relationships:
    get:
      operationId: getRelationships
      summary: Get the viewer's relationships with accounts
      description: |
        Returns one relationship per requested account, in the order of the request. Accounts
        that do not exist, are not active, or block the viewer are left out.
      tags:
        - accounts
      security:
        - oauth2:
            - read:follows
      parameters:
        - name: id
          in: query
          required: true
          description: The account IDs, repeated (`?id=a&id=b`).
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 40
            items:
              $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: The relationships.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Relationship'
        default:
          $ref: '#/components/responses/Problem'
  /accounts/search:
    get:
      operationId: searchAccounts
      summary: Search accounts by prefix
      description: |
        The accounts whose username, `username@domain`, or a word of the display name starts
        with `q`, for the autocomplete of mentions and the account search (FR-119, FR-306,
        ADR-0092). The search covers the local accounts and the remote accounts that the
        instance knows with a handle WebFinger confirmed; it fetches nothing from other servers
        (look an unknown `username@domain` up with `GET /api/v1/accounts/lookup` and
        `resolve=true`).

        `q` is compared under NFKC and lowercase. A display name is matched whole and word by
        word, split at white space and without its `:shortcode:`s, so a display name in a script
        without spaces (Chinese, Japanese) matches from its start.

        Accounts that the viewer blocks, mutes, or is blocked by, accounts that are deactivated,
        deleted, or suspended, and accounts of a suspended domain are left out. An account's
        `indexable` does not matter. The results come in this order: an exact match of the
        username or `username@domain`, then the accounts that the viewer follows, then the local
        accounts, then those with more followers. There is no paging.
      tags:
        - accounts
      security:
        - oauth2:
            - read:accounts
      parameters:
        - name: q
          in: query
          required: true
          description: |
            The start of a username, a `username@domain`, or a word of a display name: 1 to 100
            characters after a leading `@`, which is ignored. Anything else is a 400.
          schema:
            type: string
            minLength: 1
            maxLength: 101
        - $ref: '#/components/parameters/SearchLimit'
      responses:
        '200':
          description: The accounts, best match first.
          headers:
            Cache-Control:
              description: '`private, max-age=30`: the results depend on the viewer.'
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
        default:
          $ref: '#/components/responses/Problem'
  /accounts/{id}:
    get:
      operationId: getAccount
      summary: Get an account
      description: |
        An account that blocks the viewer, is deactivated, or is deleted is a 404, the same as
        an unknown one.
      tags:
        - accounts
      security:
        - {}
        - oauth2:
            - read:accounts
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          $ref: '#/components/responses/AccountProfile'
        default:
          $ref: '#/components/responses/Problem'
  /accounts/{id}/block:
    post:
      operationId: blockAccount
      summary: Block an account
      description: |
        Ends the follows between the viewer and the account in both directions and keeps
        either from following the other until the block is lifted (FR-303). Blocking an
        account that the viewer already blocks changes nothing. Blocking a remote account
        also sends a Block to its server.
      tags:
        - accounts
      security:
        - oauth2:
            - write:blocks
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          $ref: '#/components/responses/Relationship'
        default:
          $ref: '#/components/responses/Problem'
  /accounts/{id}/follow:
    post:
      operationId: followAccount
      summary: Follow an account
      description: |
        Follows the account at once, or sends a follow request when the account is locked:
        then `requested` is true until the account accepts it (FR-301, FR-302). Following an
        account that the viewer already follows or has requested to follow changes only the
        preferences in the body. Following an account that the viewer blocks is a 409
        `/api/v1/problems/blocking`. A follow of an account on another server is a request
        until that server accepts it. While the instance does not follow remote accounts
        (`Instance.federation.mode` `off` or `outbound`), following an account on another
        server that the viewer does not follow or request yet is a 403
        `/api/v1/problems/federation-restricted`.
      tags:
        - accounts
      security:
        - oauth2:
            - write:follows
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FollowAccountRequest'
      responses:
        '200':
          $ref: '#/components/responses/Relationship'
        default:
          $ref: '#/components/responses/Problem'
  /accounts/{id}/followers:
    get:
      operationId: listAccountFollowers
      summary: List the followers of an account
      description: |
        The accounts that actively follow the account, newest follow first. Followers that
        block the viewer, are deactivated, or are deleted are left out, so a page may hold
        fewer than `limit` accounts before the last.
      tags:
        - accounts
      security:
        - {}
        - oauth2:
            - read:accounts
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/AccountPage'
        default:
          $ref: '#/components/responses/Problem'
  /accounts/{id}/following:
    get:
      operationId: listAccountFollowing
      summary: List the accounts that an account follows
      description: |
        The accounts that the account actively follows, newest follow first, leaving out the
        same accounts as `listAccountFollowers`.
      tags:
        - accounts
      security:
        - {}
        - oauth2:
            - read:accounts
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/AccountPage'
        default:
          $ref: '#/components/responses/Problem'
  /accounts/{id}/mute:
    post:
      operationId: muteAccount
      summary: Mute an account
      description: |
        Hides the account's posts, and unless `notifications` is false its notifications,
        from the viewer (FR-303). Muting an account that the viewer already mutes replaces the
        settings and the expiry.
      tags:
        - accounts
      security:
        - oauth2:
            - write:mutes
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MuteAccountRequest'
      responses:
        '200':
          $ref: '#/components/responses/Relationship'
        default:
          $ref: '#/components/responses/Problem'
  /accounts/{id}/remove_from_followers:
    post:
      operationId: removeAccountFromFollowers
      summary: Remove an account from the viewer's followers
      description: |
        Ends the account's active follow of the viewer. Without one it changes nothing; a
        pending request is declined with `rejectFollowRequest` instead.
      tags:
        - accounts
      security:
        - oauth2:
            - write:follows
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          $ref: '#/components/responses/Relationship'
        default:
          $ref: '#/components/responses/Problem'
  /accounts/{id}/unblock:
    post:
      operationId: unblockAccount
      summary: Unblock an account
      description: The follows that the block ended stay ended. Without a block it changes nothing.
      tags:
        - accounts
      security:
        - oauth2:
            - write:blocks
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          $ref: '#/components/responses/Relationship'
        default:
          $ref: '#/components/responses/Problem'
  /accounts/{id}/unfollow:
    post:
      operationId: unfollowAccount
      summary: Unfollow an account
      description: Ends the follow or withdraws the follow request. Without one it changes nothing.
      tags:
        - accounts
      security:
        - oauth2:
            - write:follows
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          $ref: '#/components/responses/Relationship'
        default:
          $ref: '#/components/responses/Problem'
  /accounts/{id}/unmute:
    post:
      operationId: unmuteAccount
      summary: Unmute an account
      description: Without a mute it changes nothing.
      tags:
        - accounts
      security:
        - oauth2:
            - write:mutes
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          $ref: '#/components/responses/Relationship'
        default:
          $ref: '#/components/responses/Problem'
  /blocks:
    get:
      operationId: listBlocks
      summary: List the accounts that the viewer blocks
      description: Newest block first. Deactivated and deleted accounts are left out.
      tags:
        - accounts
      security:
        - oauth2:
            - read:blocks
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/AccountPage'
        default:
          $ref: '#/components/responses/Problem'
  /follow_requests:
    get:
      operationId: listFollowRequests
      summary: List the follow requests to the viewer
      description: |
        The accounts whose follow requests await the viewer's approval, newest first.
        Deactivated and deleted accounts are left out.
      tags:
        - accounts
      security:
        - oauth2:
            - read:follows
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/AccountPage'
        default:
          $ref: '#/components/responses/Problem'
  /follow_requests/{id}/authorize:
    post:
      operationId: acceptFollowRequest
      summary: Accept a follow request
      description: |
        Makes the account's pending follow of the viewer active (FR-302). Accepting a follow
        that is already active changes nothing; without a follow it is a 404.
      tags:
        - accounts
      security:
        - oauth2:
            - write:follows
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          $ref: '#/components/responses/Relationship'
        default:
          $ref: '#/components/responses/Problem'
  /follow_requests/{id}/reject:
    post:
      operationId: rejectFollowRequest
      summary: Reject a follow request
      description: Declines the account's pending follow request (FR-302); without one it is a 404.
      tags:
        - accounts
      security:
        - oauth2:
            - write:follows
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          $ref: '#/components/responses/Relationship'
        default:
          $ref: '#/components/responses/Problem'
  /mutes:
    get:
      operationId: listMutes
      summary: List the accounts that the viewer mutes
      description: |
        Mutes that have not expired, newest first. Deactivated and deleted accounts are left
        out.
      tags:
        - accounts
      security:
        - oauth2:
            - read:mutes
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of mutes.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutePage'
        default:
          $ref: '#/components/responses/Problem'
  /domain_mutes:
    get:
      operationId: listDomainMutes
      summary: List the domains that the viewer mutes
      description: In the order of the domains.
      tags:
        - accounts
      security:
        - oauth2:
            - read:mutes
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of domain mutes.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainMutePage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: muteDomain
      summary: Mute a domain
      description: |
        Hides the posts of a remote domain and of its subdomains from the viewer's timelines
        other than home, their boosts from home, and their notifications (FR-304). The accounts
        of the domain that the viewer follows stay on the home timeline. Nothing is sent to the
        domain. Muting a domain that the viewer already mutes changes nothing. The domain is
        normalized (IDNA A-labels in lower case, without a trailing dot); one that is not a
        valid remote domain, or this server's own, is a 422 naming `domain`. A viewer mutes at
        most 1000 domains; one more is a 422 `/api/v1/problems/too-many-domain-mutes`.
      tags:
        - accounts
      security:
        - oauth2:
            - write:mutes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MuteDomainRequest'
      responses:
        '200':
          description: The domain mute.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainMute'
        default:
          $ref: '#/components/responses/Problem'
  /domain_mutes/{domain}:
    delete:
      operationId: unmuteDomain
      summary: Unmute a domain
      description: The domain is normalized as in `muteDomain`. Without a mute it changes nothing.
      tags:
        - accounts
      security:
        - oauth2:
            - write:mutes
      parameters:
        - name: domain
          in: path
          required: true
          description: The muted domain, such as `mastodon.example`.
          schema:
            type: string
            minLength: 1
            maxLength: 253
      responses:
        '204':
          description: The domain is not muted.
        default:
          $ref: '#/components/responses/Problem'
  /media:
    post:
      operationId: uploadMedia
      summary: Upload a media file
      description: |
        Uploads an image to attach to a post or to use as an avatar, a header, or a custom
        emoji (`purpose`), or a video or audio file to attach to a post. The server checks the
        format from the content (images: JPEG, PNG, GIF, or WebP, the last two animated or not;
        video: MP4, QuickTime, or WebM of H.264, VP8, VP9, or AV1; audio: MP3, Ogg, M4A, or WebM
        of AAC, Opus, Vorbis, or MP3; the declared type must match it) and the size, dimension,
        and duration limits before it accepts the file, then processes it in the background: it
        removes the metadata (such as the location) by re-encoding the image into small,
        medium, and large variants for its purpose, still and, for an animation, moving ones,
        and makes a blurhash. A video or audio file is not re-encoded: the server writes its
        streams again without metadata, and makes the variants and the blurhash of its
        `thumbnail`, or of the cover image in the file. The answer is 202 with the file in its
        current `state`, usually `processing`; poll `getMedia` until it is `ready` or
        `failed`. A file used for another purpose later is processed again for it.

        The size limits of images and of video and audio files differ, and the limits of video
        and audio files are set by the operator (`media_max_av_bytes`,
        `media_max_video_duration`, `media_max_audio_duration` in the server configuration).

        A body larger than the size limit is refused with a 413 before it is read. Uploads
        count against a limit per account besides the API-wide one. Only the uploader can
        read and change the file.
      tags:
        - media
      security:
        - oauth2:
            - write:media
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MediaUpload'
      responses:
        '202':
          description: The file is accepted and being processed.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAttachment'
        default:
          $ref: '#/components/responses/Problem'
  /media/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The ID of the media file.
        schema:
          $ref: '#/components/schemas/Id'
    get:
      operationId: getMedia
      summary: Get a media file that the user uploaded
      description: |
        Returns a media file of the authenticated user with its processing state. A file of
        another account is a 404: other accounts see a file only as an attachment of a post.
      tags:
        - media
      security:
        - oauth2:
            - write:media
      responses:
        '200':
          description: The media file.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAttachment'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateMedia
      summary: Change the description or focal point of a media file
      description: |
        Changes the description (alternative text) or the focal point of a media file of the
        authenticated user that no post attaches yet; a property left out keeps its value. A
        post copies the description when it attaches the file, so a file that a post attaches
        is a 409 `media-attached`: edit the post instead. A file of another account is a 404.
      tags:
        - media
      security:
        - oauth2:
            - write:media
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaUpdate'
      responses:
        '200':
          description: The changed media file.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAttachment'
        default:
          $ref: '#/components/responses/Problem'
  /moderation/actions:
    get:
      operationId: listOwnModerationActions
      summary: List the moderation actions on the authenticated user's account
      description: |
        The actions that moderators took on the user's own account (FR-715), newest first,
        lifted and expired ones included unless `active` is set, also those that the user was
        not notified of. Each carries what the moderators chose to tell the user; never their
        private note, the report the action follows from, or who filed it. `kind_label` and
        `reason_category_label` are in the user's language.
      tags:
        - moderation
      security:
        - oauth2:
            - read:accounts
      parameters:
        - name: active
          in: query
          required: false
          description: Keep only the actions in effect now, neither lifted nor expired.
          schema:
            type: boolean
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of the actions on the user's account.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationActionPage'
        default:
          $ref: '#/components/responses/Problem'
  /moderation/actions/{id}/appeal:
    post:
      operationId: appealModerationAction
      summary: Appeal a moderation action on the authenticated user's account
      description: |
        Asks the moderators to reconsider an action on the user's own account (FR-707), once
        per action and until its `appeal_deadline` (the instance's appeal window from the
        action, 180 days by default; for a `ban`, also no later than the deletion of the
        account 30 days after it). The moderators get an `admin_appeal` notification, and
        the user an `appeal_decided` one when they decide. A second appeal of the action is a
        422 `/api/v1/problems/already-appealed`, an appeal after the deadline a 422
        `/api/v1/problems/appeal-window-closed`, and an appeal of a `ban` whose account is
        deleted a 422 `/api/v1/problems/not-appealable`. A `text` that is empty, too long, or
        contains U+0000 is a 422 naming `text`. An action that is not on the user's account is a
        404.
      tags:
        - moderation
      security:
        - oauth2:
            - write:accounts
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the action.
          schema:
            $ref: '#/components/schemas/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppealModerationActionRequest'
      responses:
        '200':
          description: The action, with the appeal.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationAction'
        default:
          $ref: '#/components/responses/Problem'
  /notifications:
    get:
      operationId: listNotifications
      summary: List the authenticated user's notifications
      description: |
        The user's notifications, newest first. Dismissed notifications, notifications about
        deleted posts, and notifications from accounts that the user blocks, is blocked by, or
        mutes with notifications hidden are left out, also those that came before the block or
        mute. The moderator notifications (`admin_report`, `admin_sign_up`, `admin_appeal`,
        `admin_webhook_disabled`, `admin_custom_emoji_request`) are left out once
        the user's roles no longer grant the permission they need.
      tags:
        - notifications
      security:
        - oauth2:
            - read:notifications
      parameters:
        - name: types
          in: query
          description: Keep only notifications of these types; omitted keeps every type.
          required: false
          style: form
          explode: true
          schema:
            type: array
            maxItems: 11
            items:
              $ref: '#/components/schemas/NotificationType'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of notifications.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        default:
          $ref: '#/components/responses/Problem'
  /notifications/marker:
    get:
      operationId: getNotificationMarker
      summary: Get the read marker and the unread count
      tags:
        - notifications
      security:
        - oauth2:
            - read:notifications
      responses:
        '200':
          description: The read marker.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationMarker'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateNotificationMarker
      summary: Mark notifications read
      description: |
        Marks the notifications up to and including `last_read_id` as read. The marker only
        moves forward: a `last_read_id` older than the current marker changes nothing, so
        clients that report their positions concurrently never move it back. A
        `last_read_id` that is not one of the user's notifications is a 404.
      tags:
        - notifications
      security:
        - oauth2:
            - write:notifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationMarkerUpdate'
      responses:
        '200':
          description: The read marker after the update.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationMarker'
        default:
          $ref: '#/components/responses/Problem'
  /notifications/{id}/dismiss:
    post:
      operationId: dismissNotification
      summary: Dismiss a notification
      description: |
        Removes the notification from the list and the unread count. Dismissing it again
        changes nothing; a notification that is not the user's is a 404.
      tags:
        - notifications
      security:
        - oauth2:
            - write:notifications
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the notification.
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '204':
          description: The notification is dismissed.
        default:
          $ref: '#/components/responses/Problem'
  /push/subscription:
    get:
      operationId: getPushSubscription
      summary: Get the Web Push subscription of the grant
      description: |
        The subscription that this grant (the access token and the tokens that refreshing it
        issues) registered; a 404 when it has none. A subscription ends when the push service
        reports it expired or the grant ends (sign-out, revocation, expiry).
      tags:
        - push
      security:
        - oauth2:
            - push
      responses:
        '200':
          description: The subscription.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushSubscription'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: putPushSubscription
      summary: Register the Web Push subscription of the grant
      description: |
        Registers the browser's push subscription (`PushSubscription.toJSON()`, subscribed with
        the instance's `push_server_key`) for the user's notifications of the `alerts` types,
        replacing the grant's earlier subscription and any subscription with the same endpoint.
        Sending it again with other `alerts` changes the types. The endpoint must be an
        `https` URL; an invalid endpoint, key, or type is a 422 that names the property. A 404
        means that the instance sends no Web Push (`Instance.push_server_key` is omitted).
      tags:
        - push
      security:
        - oauth2:
            - push
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushSubscriptionRequest'
      responses:
        '200':
          description: The registered subscription.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushSubscription'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deletePushSubscription
      summary: Delete the Web Push subscription of the grant
      description: Deleting it when there is none changes nothing.
      tags:
        - push
      security:
        - oauth2:
            - push
      responses:
        '204':
          description: The grant has no subscription.
        default:
          $ref: '#/components/responses/Problem'
  /bookmarks:
    get:
      operationId: listBookmarks
      summary: List the posts the authenticated user bookmarked, newest bookmark first
      tags:
        - statuses
      security:
        - oauth2:
            - read:bookmarks
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: |
            A page of bookmarked posts. Posts that the user can no longer see are left out, so
            a page may hold fewer posts than `limit` and still have a `next_cursor`.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusPage'
        default:
          $ref: '#/components/responses/Problem'
  /statuses:
    post:
      operationId: createStatus
      summary: Post a status
      description: |
        Posts a status as the authenticated user. Retrying with the same `Idempotency-Key`
        returns the status posted with it. Attached media must be the user's own uploads that
        finished processing (422 otherwise). A status with a `poll` attaches no media, and a
        poll outside the limits of `PollInput` is a 422 (FR-112).
      tags:
        - statuses
      security:
        - oauth2:
            - write:statuses
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStatusRequest'
      responses:
        '200':
          description: The posted status.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        default:
          $ref: '#/components/responses/Problem'
  /statuses/{id}:
    parameters:
      - $ref: '#/components/parameters/StatusId'
    get:
      operationId: getStatus
      summary: Get a status
      description: A status that the viewer may not see is a 404, the same as a missing one.
      tags:
        - statuses
      security:
        - {}
        - oauth2:
            - read:statuses
      responses:
        '200':
          description: The status.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: editStatus
      summary: Edit the authenticated user's status
      description: |
        Replaces the text, content warning, sensitivity, language, and media of a status; the
        previous content stays in the edit history. The visibility and reply target never
        change. Attached media must be the user's own uploads that finished processing (422
        otherwise). A status with a poll cannot be edited (422): its votes belong to its poll.
      tags:
        - statuses
      security:
        - oauth2:
            - write:statuses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditStatusRequest'
      responses:
        '200':
          description: The edited status.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteStatus
      summary: Delete the authenticated user's status
      tags:
        - statuses
      security:
        - oauth2:
            - write:statuses
      responses:
        '204':
          description: The status is deleted.
        default:
          $ref: '#/components/responses/Problem'
  /statuses/{id}/bookmark:
    parameters:
      - $ref: '#/components/parameters/StatusId'
    post:
      operationId: bookmarkStatus
      summary: Bookmark a status
      description: Bookmarking a status that is already bookmarked changes nothing.
      tags:
        - statuses
      security:
        - oauth2:
            - write:bookmarks
      responses:
        '200':
          $ref: '#/components/responses/StatusAfterAction'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: unbookmarkStatus
      summary: Remove the bookmark of a status
      description: Without a bookmark it changes nothing.
      tags:
        - statuses
      security:
        - oauth2:
            - write:bookmarks
      responses:
        '200':
          $ref: '#/components/responses/StatusAfterAction'
        default:
          $ref: '#/components/responses/Problem'
  /statuses/{id}/boost:
    parameters:
      - $ref: '#/components/parameters/StatusId'
    post:
      operationId: boostStatus
      summary: Boost a status
      description: |
        Boosting a status that is already boosted changes nothing. A status whose visibility
        does not allow boosting is a 422.
      tags:
        - statuses
      security:
        - oauth2:
            - write:statuses
      responses:
        '200':
          $ref: '#/components/responses/StatusAfterAction'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: unboostStatus
      summary: Retract the boost of a status
      description: Without a boost it changes nothing.
      tags:
        - statuses
      security:
        - oauth2:
            - write:statuses
      responses:
        '200':
          $ref: '#/components/responses/StatusAfterAction'
        default:
          $ref: '#/components/responses/Problem'
  /statuses/{id}/context:
    parameters:
      - $ref: '#/components/parameters/StatusId'
    get:
      operationId: getStatusContext
      summary: Get the thread around a status
      description: |
        The ancestors and descendants of a status that the viewer may see. A status that the
        viewer may not see is a 404, the same as a missing one.
      tags:
        - statuses
      security:
        - {}
        - oauth2:
            - read:statuses
      responses:
        '200':
          description: The thread.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusContext'
        default:
          $ref: '#/components/responses/Problem'
  /statuses/{id}/favourite:
    parameters:
      - $ref: '#/components/parameters/StatusId'
    post:
      operationId: favouriteStatus
      summary: Favourite a status
      description: |
        Favouriting a status that is already favourited changes nothing. A user has one
        favourite or one emoji reaction on a status, so favouriting takes back the reaction.
      tags:
        - statuses
      security:
        - oauth2:
            - write:favourites
      responses:
        '200':
          $ref: '#/components/responses/StatusAfterAction'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: unfavouriteStatus
      summary: Remove the favourite of a status
      description: Without a favourite it changes nothing.
      tags:
        - statuses
      security:
        - oauth2:
            - write:favourites
      responses:
        '200':
          $ref: '#/components/responses/StatusAfterAction'
        default:
          $ref: '#/components/responses/Problem'
  /statuses/{id}/history:
    parameters:
      - $ref: '#/components/parameters/StatusId'
    get:
      operationId: getStatusHistory
      summary: Get the edit history of a status
      description: |
        Every revision of a status, oldest first; the last one is the current content. A
        status that the viewer may not see is a 404, the same as a missing one.
      tags:
        - statuses
      security:
        - {}
        - oauth2:
            - read:statuses
      responses:
        '200':
          description: The revisions.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusHistory'
        default:
          $ref: '#/components/responses/Problem'
  /statuses/{id}/pin:
    parameters:
      - $ref: '#/components/parameters/StatusId'
    post:
      operationId: pinStatus
      summary: Pin the authenticated user's status to the profile
      description: |
        Pinning a status that is already pinned changes nothing. Another account's status, a
        direct status, or a pin beyond the limit is a 422.
      tags:
        - statuses
      security:
        - oauth2:
            - write:statuses
      responses:
        '200':
          $ref: '#/components/responses/StatusAfterAction'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: unpinStatus
      summary: Unpin a status
      description: Without a pin it changes nothing.
      tags:
        - statuses
      security:
        - oauth2:
            - write:statuses
      responses:
        '200':
          $ref: '#/components/responses/StatusAfterAction'
        default:
          $ref: '#/components/responses/Problem'
  /statuses/{id}/poll/votes:
    parameters:
      - $ref: '#/components/parameters/StatusId'
    post:
      operationId: voteInPoll
      summary: Vote in the poll of a status
      description: |
        Votes for one or more choices of the poll of a status (FR-112). `poll_id` names the poll
        the user saw: a poll that an edit of the status replaced is a 409. A status without a
        poll, a poll that has ended, a second vote, or choices the poll does not take (none, an
        unknown one, the same one twice, or several in a single-choice poll) is a 422. A vote in
        a poll of another server is sent to that server, whose counts in `poll` include it once
        the server reports them again.
      tags:
        - statuses
      security:
        - oauth2:
            - write:statuses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoteInPollRequest'
      responses:
        '200':
          $ref: '#/components/responses/StatusAfterAction'
        default:
          $ref: '#/components/responses/Problem'
  /statuses/{id}/reaction:
    parameters:
      - $ref: '#/components/parameters/StatusId'
    put:
      operationId: reactToStatus
      summary: React to a status with an emoji
      description: |
        Sets the authenticated user's emoji reaction to a status: a Unicode emoji, or a custom
        emoji of this server that is enabled. A user has one favourite or one reaction on a
        status, so reacting takes back the favourite and the reaction with another emoji;
        reacting again with the same emoji changes nothing. A custom emoji of another server,
        or anything else that is not one emoji, is a 422.
      tags:
        - statuses
      security:
        - oauth2:
            - write:favourites
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReactToStatusRequest'
      responses:
        '200':
          $ref: '#/components/responses/StatusAfterAction'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: unreactToStatus
      summary: Take back the emoji reaction to a status
      description: Without a reaction it changes nothing.
      tags:
        - statuses
      security:
        - oauth2:
            - write:favourites
      responses:
        '200':
          $ref: '#/components/responses/StatusAfterAction'
        default:
          $ref: '#/components/responses/Problem'
  /statuses/{id}/reactions:
    parameters:
      - $ref: '#/components/parameters/StatusId'
    get:
      operationId: listStatusReactions
      summary: List the emoji reactions to a status
      description: |
        The emoji reactions to a status that the viewer may see, newest first, each with the
        account that reacted, only those with one emoji when `emoji` is given. Accounts that
        block the viewer, are deactivated, or are deleted are left out, so a page may hold fewer
        than `limit` reactions before the last. A status that the viewer may not see is a 404,
        the same as a missing one.
      tags:
        - statuses
      security:
        - {}
        - oauth2:
            - read:statuses
      parameters:
        - name: emoji
          in: query
          description: |
            The `name` of an emoji (`ReactionEmoji`) to list the reactions with; an emoji that no
            reaction has gives an empty page.
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of the reactions.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusReactionPage'
        default:
          $ref: '#/components/responses/Problem'
  /statuses/{id}/quote_policy:
    parameters:
      - $ref: '#/components/parameters/StatusId'
    put:
      operationId: setStatusQuotePolicy
      summary: Change who may quote the authenticated user's status
      description: |
        Changes the `quote_policy` of a status of the user (ADR-0069 §1); the approvals given
        before stay, and each is revoked on its own. Another account's status is a 403 when the
        user may see it and a 404 otherwise.
      tags:
        - statuses
      security:
        - oauth2:
            - write:statuses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetQuotePolicyRequest'
      responses:
        '200':
          $ref: '#/components/responses/StatusAfterAction'
        default:
          $ref: '#/components/responses/Problem'
  /statuses/{id}/quotes:
    parameters:
      - $ref: '#/components/parameters/StatusId'
    get:
      operationId: listStatusQuotes
      summary: List the statuses that quote the authenticated user's status
      description: |
        The statuses that quote a status of the user, newest first, each with its `quote` and
        its state (ADR-0069 §5). Statuses the user may not see, and quotes taken away, are left
        out, so a page may hold fewer than `limit` statuses before the last. Another account's
        status is a 404.
      tags:
        - statuses
      security:
        - oauth2:
            - read:statuses
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/StatusPage'
        default:
          $ref: '#/components/responses/Problem'
  /statuses/{id}/quotes/{quote_id}/revoke:
    parameters:
      - $ref: '#/components/parameters/StatusId'
      - name: quote_id
        in: path
        description: The ID of the status that quotes.
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    post:
      operationId: revokeStatusQuote
      summary: Revoke the approval of a quote of the authenticated user's status
      description: |
        Withdraws this server's approval of the quote (ADR-0069 §3): the quote shows the quoted
        status no more, and the quoting server is told. A quote without this server's approval
        (from software without approvals, or of the user's own status) is a 404, as is one revoked
        already.
      tags:
        - statuses
      security:
        - oauth2:
            - write:statuses
      responses:
        '204':
          description: The approval is revoked.
        default:
          $ref: '#/components/responses/Problem'
  /statuses/{id}/source:
    parameters:
      - $ref: '#/components/parameters/StatusId'
    get:
      operationId: getStatusSource
      summary: Get the source of the authenticated user's status, for editing it
      description: Another account's status is a 404, the same as a missing one.
      tags:
        - statuses
      security:
        - oauth2:
            - read:statuses
      responses:
        '200':
          description: The source.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusSource'
        default:
          $ref: '#/components/responses/Problem'
  /accounts/{id}/statuses:
    get:
      operationId: listAccountStatuses
      summary: List the posts and boosts of an account
      description: |
        The account's posts and boosts that the viewer may see, newest first: its public posts
        for everyone, its local posts for logged-in viewers, its followers-only posts for its
        followers, and its direct posts addressed to the viewer. With `pinned`, the page lists
        the account's pinned posts instead, newest pin first, in a single page.

        The page lists only the posts this server has received. For a remote account, the first
        page (no `cursor`, no `pinned`) of a logged-in viewer may start fetching the account's
        recent public posts from its server in the background; `remote_fetch_started` tells
        that it did. It does at most once a day per account, for at most 30 accounts per viewer
        in 5 minutes, and never for an account that the viewer blocks or that blocks the viewer.
      tags:
        - timelines
      security:
        - {}
        - oauth2:
            - read:statuses
      parameters:
        - name: id
          in: path
          required: true
          description: The account.
          schema:
            $ref: '#/components/schemas/Id'
        - name: exclude_replies
          in: query
          required: false
          description: Leave out the account's replies.
          schema:
            type: boolean
            default: false
        - name: exclude_boosts
          in: query
          required: false
          description: Leave out the account's boosts.
          schema:
            type: boolean
            default: false
        - name: pinned
          in: query
          required: false
          description: List only the account's pinned posts.
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/AccountStatusPage'
        default:
          $ref: '#/components/responses/Problem'
  /tags/search:
    get:
      operationId: searchTags
      summary: Search hashtags by prefix
      description: |
        The hashtags whose name starts with `q`, for the autocomplete of hashtags in the compose
        form and the hashtag search (FR-119, FR-306, ADR-0092). `q` and the names are compared
        under NFKC and lowercase.

        Only the hashtags that a post of visibility `public`, `local`, or `unlisted` carries now
        are found: a hashtag of private and direct posts only, or one whose posts are all deleted
        or edited away, is left out. The results come in this order: the hashtag equal to `q`,
        then those carried by more posts, then the more recently used. There is no paging.
      tags:
        - statuses
      security:
        - oauth2:
            - read:statuses
      parameters:
        - name: q
          in: query
          required: true
          description: |
            The start of a hashtag: 1 to 100 characters after a leading `#`, which is ignored.
            Anything else is a 400.
          schema:
            type: string
            minLength: 1
            maxLength: 101
        - $ref: '#/components/parameters/SearchLimit'
      responses:
        '200':
          description: The hashtags, best match first.
          headers:
            Cache-Control:
              description: '`private, max-age=30`: a client may reuse the results while the user types the same prefix again.'
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TagSuggestion'
        default:
          $ref: '#/components/responses/Problem'
  /timelines/home:
    get:
      operationId: getHomeTimeline
      summary: Get the home timeline
      description: |
        The viewer's own posts and boosts and those of the accounts the viewer follows, newest
        first, in the viewer's timeline languages.
      tags:
        - timelines
      security:
        - oauth2:
            - read:statuses
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/StatusPage'
        default:
          $ref: '#/components/responses/Problem'
  /timelines/local:
    get:
      operationId: getLocalTimeline
      summary: Get the local timeline
      description: |
        The public posts of the instance's accounts, newest first, and their local posts for a
        logged-in viewer, in the viewer's timeline languages. The instance setting
        `local_timeline_access` decides who may read it: while it is `off` it is a 404, and while it
        is `logged_in` an anonymous request is a 401.
      tags:
        - timelines
      security:
        - {}
        - oauth2:
            - read:statuses
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/StatusPage'
        default:
          $ref: '#/components/responses/Problem'
  /timelines/public:
    get:
      operationId: getPublicTimeline
      summary: Get the federated timeline
      description: |
        The public posts of the instance's accounts and of the remote accounts whose posts the
        instance holds, newest first, in the viewer's timeline languages (FR-202). Posts of other
        visibilities, `local` ones included, and boosts never appear on it. The instance setting
        `federated_timeline_access` decides who may read it: while it is `off` it is a 404, and while it
        is `logged_in` an anonymous request is a 401.
      tags:
        - timelines
      security:
        - {}
        - oauth2:
            - read:statuses
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/StatusPage'
        default:
          $ref: '#/components/responses/Problem'
  /timelines/tag/{hashtag}:
    get:
      operationId: getHashtagTimeline
      summary: Get the timeline of a hashtag
      description: |
        The public posts with the hashtag, newest first, and its local posts for a logged-in
        viewer, in the viewer's timeline languages. A hashtag that no post uses has an empty
        timeline.
      tags:
        - timelines
      security:
        - {}
        - oauth2:
            - read:statuses
      parameters:
        - name: hashtag
          in: path
          required: true
          description: The hashtag without the `#`, matched case-insensitively.
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/StatusPage'
        default:
          $ref: '#/components/responses/Problem'
  /reports:
    get:
      operationId: listOwnReports
      summary: List the reports that the authenticated user filed
      description: |
        The reports that the user filed, newest first, each with whether it is still open or
        resolved (FR-711). A report reopened by the moderators is open again. It never tells how
        a report was resolved, which actions it led to, the reasons given to the account, or
        who handles it.
      tags:
        - reports
      security:
        - oauth2:
            - read:reports
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of the user's reports.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportPage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createReport
      summary: Report an account
      description: |
        Reports an account, and optionally some of its posts, to the moderators (FR-701). The
        report waits, open, in the moderators' queue; nothing tells the account of it, and
        nothing that the account can read names the reporter. 422 when the account does not
        exist or is the user's own (`account_id`), when a post is not the account's or the
        user may not see it (`status_ids`), when `rule_ids` cite a rule that is not in effect
        or the category is not `violation`, or when the comment is too long. Reports are
        limited to 30 per hour per account (429 beyond).
      tags:
        - reports
      security:
        - oauth2:
            - write:reports
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReportRequest'
      responses:
        '200':
          description: The filed report.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        default:
          $ref: '#/components/responses/Problem'
  /announcements:
    get:
      operationId: listAnnouncements
      summary: List the announcements
      description: |
        The server's announcements that every local user sees now (FR-726): published, and
        within their window. The ones whose `published_at` is the latest come first, each with
        whether the user has read it. The list is not paginated.
      tags:
        - announcements
      security:
        - oauth2:
            - read:notifications
      responses:
        '200':
          description: The announcements.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementList'
        default:
          $ref: '#/components/responses/Problem'
  /announcements/{id}/read:
    post:
      operationId: markAnnouncementRead
      summary: Mark an announcement read
      description: |
        Records that the user read the announcement; marking it again changes nothing. An
        announcement that the users do not see now (a draft, a withdrawn one, one outside its
        window, an unknown ID) is a 404.
      tags:
        - announcements
      security:
        - oauth2:
            - write:notifications
      parameters:
        - $ref: '#/components/parameters/AnnouncementId'
      responses:
        '200':
          description: The announcement, read.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
        default:
          $ref: '#/components/responses/Problem'
  /streaming:
    get:
      operationId: streamEvents
      summary: Stream real-time updates
      description: |
        A Server-Sent Events stream (`text/event-stream`) of the authenticated user's new home
        timeline entries, notifications, and announcements, from the moment it opens. Read it with `fetch` and
        send the access token in `Authorization`, like every other operation (`EventSource`
        cannot send it).

        Events:

        - `update`: a new post or boost in the home timeline, as it would appear there (the
          viewer's follows, timeline languages, blocks, and mutes apply). `data` is a `Status`.
        - `notification`: a new notification. `data` is a `Notification`.
        - `announcement`: an announcement that the users see was published or changed. `data`
          is an `Announcement`.
        - `announcement_removed`: an announcement no longer shows (it was withdrawn, or its
          window changed). `data` is `{"id": "<announcement id>"}`.

        A comment line (`: heartbeat`) arrives every 30 seconds. The server ends the stream when
        the access token stops being valid, when the client does not keep up, and when it shuts
        down; nothing is replayed, so after reconnecting read the home timeline and the
        notifications again for what was missed. Announcements whose window starts later
        arrive with no event: list the announcements again from time to time. A user may hold a limited number of streams
        open at once; past it the answer is 429 with type
        `/api/v1/problems/too-many-streams`. While the server cannot receive updates (its
        broker is not ready, or it is shutting down) the answer is 503 with `Retry-After`; try
        again after that many seconds. The server may also end an open stream when it may have
        missed updates; reconnect and read again, as after any other end.

        Each server process delivers only the updates that it produced itself, so a deployment
        that runs several web processes, or separate web and worker processes, misses updates
        on some streams.
      tags:
        - streaming
      security:
        - oauth2:
            - read:statuses
            - read:notifications
      responses:
        '200':
          description: The event stream. It stays open until the client or the server ends it.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Problem'
  /finance/cost_totals:
    get:
      operationId: getFinanceCostTotals
      summary: Total the costs by period for the finance viewers
      description: |
        The totals of the instance's costs for the holders of `view_finance` (ADR-0070 §5). It
        takes the query of `GET /admin/cost_totals` and always answers its totals, their breakdown
        by provider, category, and currency, and the rules that cut the periods. Each period adds
        `items`, the amount of each cost item and each service of the imported costs, only while
        the instance setting `finance_viewer_item_names` or `finance_viewer_item_memos` is on: an
        item line carries `name` while names are shown and `memo` while memos are shown, so with
        memos only it has a memo and no name. A holder of `manage_finance` reads every item line
        with its name and memo whatever the settings. `viewer` reports the three settings. No
        answer carries who paid what, the revisions of the prices, or who recorded the items. More
        than 104 weeks, 60 months, or 20 years, and `to` before `from`, are a 422 naming `to`.
        Needs the `view_finance` or the `manage_finance` permission (a 403
        `/api/v1/problems/missing-permission` otherwise).
      tags:
        - finance
      security:
        - oauth2:
            - read:finance
      parameters:
        - name: granularity
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/CostGranularity'
        - name: from
          in: query
          required: true
          description: A date in the first period.
          schema:
            $ref: '#/components/schemas/CalendarDate'
        - name: to
          in: query
          required: true
          description: A date in the last period.
          schema:
            $ref: '#/components/schemas/CalendarDate'
        - name: basis
          in: query
          required: false
          description: How the totals place a payment; `amortized` by default.
          schema:
            $ref: '#/components/schemas/CostBasis'
      responses:
        '200':
          description: The totals.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceCostTotals'
        default:
          $ref: '#/components/responses/Problem'
  /finance/income_totals:
    get:
      operationId: getFinanceIncomeTotals
      summary: Total the income by period for the finance viewers
      description: |
        The income totals for the holders of `view_finance` (ADR-0073 §6, ADR-0070 §5). It takes
        the query of `GET /admin/cost_totals` and always answers the net of each currency by
        period with its `balance` against the costs, whatever `income_visibility` and
        `finance_visibility` publish. `plans`, the number of members of each supporter plan now,
        is present while the instance setting `finance_viewer_income` is `plans` or
        `income_visibility` publishes the plans; a holder of `manage_finance` always reads it. No
        answer carries individual payments, the subscribers, the amounts of each plan, or the
        gross and the fees. More than 104 weeks, 60 months, or 20 years, and `to` before `from`,
        are a 422 naming `to`. Needs the `view_finance` or the `manage_finance` permission (a 403
        `/api/v1/problems/missing-permission` otherwise).
      tags:
        - finance
      security:
        - oauth2:
            - read:finance
      parameters:
        - name: granularity
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/CostGranularity'
        - name: from
          in: query
          required: true
          description: A date in the first period.
          schema:
            $ref: '#/components/schemas/CalendarDate'
        - name: to
          in: query
          required: true
          description: A date in the last period.
          schema:
            $ref: '#/components/schemas/CalendarDate'
        - name: basis
          in: query
          required: false
          description: How the totals place a payment; `amortized` by default.
          schema:
            $ref: '#/components/schemas/CostBasis'
      responses:
        '200':
          description: The income totals.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomeTotals'
        default:
          $ref: '#/components/responses/Problem'
  /supporter/subscription:
    get:
      operationId: getOwnSupporterSubscription
      summary: Get the authenticated user's supporter subscription
      description: |
        The user's subscription that goes on (any state but `expired`, `revoked`, and
        `abandoned`), and why the user cannot subscribe when they cannot (ADR-0072 §6, §18). A 404
        while the supporter program is disabled (`Instance.supporters_enabled`).
      tags:
        - supporters
      security:
        - oauth2:
            - read:supporters
      responses:
        '200':
          description: The subscription, or none.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnSupporterSubscription'
        default:
          $ref: '#/components/responses/Problem'
  /supporter/checkout:
    post:
      operationId: startSupporterCheckout
      summary: Start a subscription to a supporter plan
      description: |
        Starts a subscription to a plan at an interval and returns the payment provider's hosted
        checkout, which the client opens in the same tab; no card details reach this server
        (ADR-0072 §6, ADR-0074). The checkout returns to `/settings/supporter` of the web client.
        Starting again while the subscription is `pending` makes a new checkout of the same
        subscription. Only a local user with a verified primary address and without another
        subscription may subscribe: a 422 `/api/v1/problems/supporter-ineligible` otherwise, a 409
        `/api/v1/problems/supporter-subscribed` with a subscription that is not pending, and a 422
        `/api/v1/problems/supporter-plan-unavailable` for a plan that takes no subscriptions. A 404
        for an unknown plan and while the program is disabled.
      tags:
        - supporters
      security:
        - oauth2:
            - write:supporters
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupporterPlanChoice'
      responses:
        '200':
          description: The checkout to open.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupporterCheckout'
        default:
          $ref: '#/components/responses/Problem'
  /supporter/subscription/sync:
    post:
      operationId: syncOwnSupporterSubscription
      summary: Re-read the authenticated user's subscription from the payment provider
      description: |
        What the web client sends when the payment provider's checkout or portal returns to it:
        it queues a re-read of the user's subscription from the provider, without waiting for its
        webhook (ADR-0072 §6), and answers the subscription as it is now. Read it again to see the
        result. A 404 while the program is disabled.
      tags:
        - supporters
      security:
        - oauth2:
            - write:supporters
      responses:
        '200':
          description: The subscription as it is now, or none.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnSupporterSubscription'
        default:
          $ref: '#/components/responses/Problem'
  /supporter/subscription/change:
    post:
      operationId: changeOwnSupporterSubscription
      summary: Change the plan or the interval of the authenticated user's subscription
      description: |
        Changes an `active` subscription to another plan or interval (ADR-0072 §8): to a higher
        plan or to the yearly price at once, with the difference charged pro rata; to a lower plan
        or to the monthly price at the end of the period, as `scheduled_change`. The new plan's
        current price applies. A 409 `/api/v1/problems/supporter-subscription-state` unless the
        subscription is `active`, a 422 `/api/v1/problems/supporter-plan-unavailable` for a plan
        that takes no subscriptions, and a 422 `/api/v1/problems/supporter-same-plan` for the
        current plan and interval.
      tags:
        - supporters
      security:
        - oauth2:
            - write:supporters
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupporterPlanChoice'
      responses:
        '200':
          description: The subscription after the change.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupporterSubscription'
        default:
          $ref: '#/components/responses/Problem'
  /supporter/subscription/cancel:
    post:
      operationId: cancelOwnSupporterSubscription
      summary: Cancel the authenticated user's subscription at the end of its period
      description: |
        Cancels an `active` or `past_due` subscription at the end of its period: the plan's role
        stays until then (`canceling`, ADR-0072 §7). A 409
        `/api/v1/problems/supporter-subscription-state` in another state.
      tags:
        - supporters
      security:
        - oauth2:
            - write:supporters
      responses:
        '200':
          description: The subscription after the cancellation.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupporterSubscription'
        default:
          $ref: '#/components/responses/Problem'
  /supporter/subscription/resume:
    post:
      operationId: resumeOwnSupporterSubscription
      summary: Withdraw the cancellation of the authenticated user's subscription
      description: |
        Withdraws the cancellation of a `canceling` subscription, which then renews as before. A
        409 `/api/v1/problems/supporter-subscription-state` in another state.
      tags:
        - supporters
      security:
        - oauth2:
            - write:supporters
      responses:
        '200':
          description: The subscription after the resumption.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupporterSubscription'
        default:
          $ref: '#/components/responses/Problem'
  /supporter/subscription/cancel_scheduled_change:
    post:
      operationId: cancelOwnSupporterScheduledChange
      summary: Withdraw the scheduled change of the authenticated user's subscription
      description: |
        Withdraws the change to a lower plan or to the monthly price that waits for the end of
        the period (ADR-0072 §8); the subscription renews at its current plan and interval. A 409
        `/api/v1/problems/supporter-subscription-state` without a scheduled change.
      tags:
        - supporters
      security:
        - oauth2:
            - write:supporters
      responses:
        '200':
          description: The subscription without the scheduled change.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupporterSubscription'
        default:
          $ref: '#/components/responses/Problem'
  /supporter/portal:
    post:
      operationId: openSupporterPortal
      summary: Open the payment provider's portal of the authenticated user
      description: |
        The payment provider's portal of the user's payment methods and invoices, which returns
        to `/settings/supporter` of the web client (ADR-0072 §8). Plans change on this server, not in
        the portal. A 409 `/api/v1/problems/subscription-ended` for a user whom the provider does not
        know.
      tags:
        - supporters
      security:
        - oauth2:
            - write:supporters
      responses:
        '200':
          description: The portal to open.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupporterPortal'
        default:
          $ref: '#/components/responses/Problem'
  /admin/queue:
    get:
      operationId: getAdminQueue
      summary: Get the state of the job queue
      description: |
        The jobs of the job queue by state and type, when the oldest due job has been waiting
        since, and what the queue can list (ADR-0064). The database queue and the inline queue
        list their pending jobs (`queued`, `running`, `retrying`); the queues of the platforms
        (Cloud Tasks, SQS) do not (`pending_listing` is `false`): then `counts` is empty and the
        backlog is read from the platform's metrics, while `GET /admin/jobs?state=dead` and the
        attempts still list the dead jobs and the failed runs, which are in the database with
        every queue. Needs the `manage_jobs`
        permission; a user without it gets a 403 `/api/v1/problems/missing-permission`.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:read
      responses:
        '200':
          description: The state of the queue.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminQueue'
        default:
          $ref: '#/components/responses/Problem'
  /admin/jobs:
    get:
      operationId: listAdminJobs
      summary: List the jobs of the job queue
      description: |
        The jobs in one state, or the pending jobs of every state when `state` is omitted.
        Pending jobs (`queued`, `running`, `retrying`) come the earliest `run_at` first; on a
        queue that cannot list them (`pending_listing` of `GET /admin/queue` is `false`) the page
        is empty. Dead jobs (`state=dead`) come the most recently failed first. Needs the
        `manage_jobs` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:read
      parameters:
        - name: state
          in: query
          required: false
          description: Keep only the jobs in this state; omitted keeps the pending ones.
          schema:
            $ref: '#/components/schemas/AdminJobState'
        - name: type
          in: query
          required: false
          description: Keep only the jobs of this type, such as `federation.deliver`.
          schema:
            type: string
            maxLength: 200
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of jobs.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminJobPage'
        default:
          $ref: '#/components/responses/Problem'
  /admin/jobs/{id}/attempts:
    get:
      operationId: listAdminJobAttempts
      summary: List the attempts of a job that did not succeed
      description: |
        The records of the runs of the job that did not succeed (a retry, or the run that made
        it a dead job), the most recently finished first. Successful runs are not recorded, and
        records are deleted after the server's `job_attempt_retention`, so a job without
        failures, or an unknown ID, has an empty page. A requeued dead job counts its attempts
        again from 1. Needs the `manage_jobs` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:read
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the job.
          schema:
            $ref: '#/components/schemas/Id'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of attempts.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminJobAttemptPage'
        default:
          $ref: '#/components/responses/Problem'
  /admin/jobs/{id}/retry:
    post:
      operationId: retryAdminJob
      summary: Run a dead job again
      description: |
        Enqueues the dead job again with a fresh attempt count, to run now, and removes it from
        the dead jobs. When a pending job has the same idempotency key, that job stands in for
        it. An unknown ID, one that is not a dead job, or one already retried, is a 404. Needs
        the `manage_jobs` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the dead job.
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '204':
          description: The job is enqueued.
        default:
          $ref: '#/components/responses/Problem'
  /admin/instances:
    get:
      operationId: listInstanceHealth
      summary: List the remote servers with delivery failures or marked unavailable
      description: |
        The health of the remote servers that deliveries failed to reach on some days, or that
        are marked unavailable, in domain order. A server that is not listed is available and
        has no failures. Unavailable servers are sent only `Follow`, `Accept`, and `Reject`
        until a delivery succeeds, they send a signed request, the daily probe reaches them, or
        an operator marks them available. Needs the `manage_domains` permission.
      tags:
        - admin-moderation
      security:
        - oauth2:
            - admin:read
      parameters:
        - name: state
          in: query
          required: false
          description: Keep only the servers in this state; omitted keeps both.
          schema:
            $ref: '#/components/schemas/AdminInstanceState'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of server health.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminInstanceHealthPage'
        default:
          $ref: '#/components/responses/Problem'
  /admin/instances/{domain}:
    get:
      operationId: getInstanceHealth
      summary: Get the health of a remote server
      description: |
        The health of the server; one without failures is `available`, without `since`. Needs
        the `manage_domains` permission.
      tags:
        - admin-moderation
      security:
        - oauth2:
            - admin:read
      parameters:
        - $ref: '#/components/parameters/InstanceDomain'
      responses:
        '200':
          $ref: '#/components/responses/AdminInstanceHealth'
        default:
          $ref: '#/components/responses/Problem'
  /admin/instances/{domain}/availability_events:
    get:
      operationId: listInstanceAvailabilityEvents
      summary: List the times a remote server was marked unavailable or available
      description: |
        Why and when the server was marked unavailable or available again, newest first. Needs
        the `manage_domains` permission.
      tags:
        - admin-moderation
      security:
        - oauth2:
            - admin:read
      parameters:
        - $ref: '#/components/parameters/InstanceDomain'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of availability events.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAvailabilityEventPage'
        default:
          $ref: '#/components/responses/Problem'
  /admin/instances/{domain}/mark_available:
    post:
      operationId: markInstanceAvailable
      summary: Mark a remote server available
      description: |
        Clears the failure days of the server and, when it is unavailable, marks it available
        again with the reason `operator`, so that deliveries to it resume. A server that is
        already available without failures stays as it is. Needs the `manage_domains`
        permission.
      tags:
        - admin-moderation
      security:
        - oauth2:
            - admin:write
      parameters:
        - $ref: '#/components/parameters/InstanceDomain'
      responses:
        '200':
          $ref: '#/components/responses/AdminInstanceHealth'
        default:
          $ref: '#/components/responses/Problem'
  /admin/audit_log:
    get:
      operationId: listAuditLog
      summary: List the audit log
      description: |
        The operations of the moderators and administrators (FR-704), newest first: who did
        what to which target and when. Each entry keeps the target's display name as it was
        (`target_label`), so it stays readable after the target is gone; the reasons and notes
        stay with the operation itself (`source_event_id`). The audit log cannot be changed or
        deleted through the API. An unknown `action` or `target_kind`, or a `target_id`
        without its `target_kind`, is a 400. Needs the `view_audit` permission.
      tags:
        - admin-moderation
      security:
        - oauth2:
            - admin:read
      parameters:
        - name: actor_account_id
          in: query
          required: false
          description: |
            Keep only the operations of the user of this local account. An account that is not
            local, or not known, has no operations.
          schema:
            $ref: '#/components/schemas/Id'
        - name: action
          in: query
          required: false
          description: Keep only this kind of operation.
          schema:
            $ref: '#/components/schemas/AdminAuditAction'
        - name: target_kind
          in: query
          required: false
          description: Keep only the operations on this kind of target.
          schema:
            $ref: '#/components/schemas/AdminAuditTargetKind'
        - name: target_id
          in: query
          required: false
          description: Keep only the operations on this target, of the kind `target_kind`.
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of the audit log.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuditEntryPage'
        default:
          $ref: '#/components/responses/Problem'
  /admin/billing_imports:
    get:
      operationId: listBillingImports
      summary: List the state of the billing imports
      description: |
        The state of the imports of every cloud provider of `billing_sources` (ADR-0068), in its
        order: the last attempt and its failure, the last success, the billed requests of the UTC
        day and month with their caps, the bytes billed this month, and the billing months of the
        last year with imported costs, each an estimate, final, or corrected, with its totals. The
        list is empty when nothing is imported. Needs the `manage_finance` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:read
      responses:
        '200':
          description: The billing sources.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingImportList'
        default:
          $ref: '#/components/responses/Problem'
  /admin/billing_imports/{source}/runs:
    post:
      operationId: runBillingImport
      summary: Import a provider's usage charges now
      description: |
        Queues an import of the billing source now, besides the daily one (ADR-0068 §2). Its
        billed requests count toward the caps like the others. One import per source and UTC
        hour: another request in the hour after its import ran is a 429. A source that
        `billing_sources` does not enable is a 404. The request is recorded in the audit log.
        Needs the `manage_finance` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      parameters:
        - name: source
          in: path
          required: true
          description: The billing source.
          schema:
            $ref: '#/components/schemas/BillingSourceName'
      responses:
        '204':
          description: The import is queued.
        default:
          $ref: '#/components/responses/Problem'
  /admin/cost_items:
    get:
      operationId: listCostItems
      summary: List the cost items
      description: |
        The instance's cost items that are not canceled, newest first (ADR-0067, FR-901).
        Needs the `manage_finance` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of cost items.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostItemPage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createCostItem
      summary: Record a cost item
      description: |
        Records a cost of the instance: once, or every N weeks, months, or years from the start
        date (ADR-0067 §3). A value the server rejects is a 422 naming it: `interval` outside 1
        to 99 (1 for `once`), an invalid date, `ends_on` before `starts_on`, an empty or too long
        `name` or `provider`, a too long `memo`, an unknown currency, a negative amount, or an
        amount with more digits than its currency (`price`). Recorded in the audit log.
        Needs the `manage_finance` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CostItemCreateRequest'
      responses:
        '200':
          $ref: '#/components/responses/CostItem'
        default:
          $ref: '#/components/responses/Problem'
  /admin/cost_items/{id}:
    get:
      operationId: getCostItem
      summary: Get a cost item
      description: An unknown or canceled item is a 404. Needs the `manage_finance` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:read
      parameters:
        - $ref: '#/components/parameters/CostItemId'
      responses:
        '200':
          $ref: '#/components/responses/CostItem'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateCostItem
      summary: Change a cost item's label
      description: |
        Records a new name, provider, category, or memo of a cost item; an omitted property keeps
        its value. The values are checked as for a new item (422). An unknown or canceled item is
        a 404. Recorded in the audit log. Needs the `manage_finance` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      parameters:
        - $ref: '#/components/parameters/CostItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CostItemLabelRequest'
      responses:
        '200':
          $ref: '#/components/responses/CostItem'
        default:
          $ref: '#/components/responses/Problem'
  /admin/cost_items/{id}/price_revisions:
    post:
      operationId: reviseCostItemPrice
      summary: Revise a cost item's price
      description: |
        Records the price of the payments on or after `effective_on`. A date before the start
        date (`effective_on`) and an invalid price (`price`) are a 422. An unknown or canceled
        item is a 404. Recorded in the audit log. Needs the `manage_finance` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      parameters:
        - $ref: '#/components/parameters/CostItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CostPriceRevisionRequest'
      responses:
        '200':
          $ref: '#/components/responses/CostItem'
        default:
          $ref: '#/components/responses/Problem'
  /admin/cost_items/{id}/end:
    put:
      operationId: setCostItemEnd
      summary: Set a cost item's end
      description: |
        Ends a cost item on `ends_on` (a cancellation of the subscription: the payments after it
        go away, the past ones stay), or makes it endless again without `ends_on`. A date before
        the start date is a 422 naming `ends_on`. An unknown or canceled item is a 404. Recorded
        in the audit log. Needs the `manage_finance` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      parameters:
        - $ref: '#/components/parameters/CostItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CostItemEndRequest'
      responses:
        '200':
          $ref: '#/components/responses/CostItem'
        default:
          $ref: '#/components/responses/Problem'
  /admin/cost_items/{id}/cancel:
    post:
      operationId: cancelCostItem
      summary: Cancel a cost item
      description: |
        Removes a cost item recorded by mistake from every period, past ones included. There is
        no undo: record the item again. An unknown or already canceled item is a 404. Recorded in
        the audit log. Needs the `manage_finance` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      parameters:
        - $ref: '#/components/parameters/CostItemId'
      responses:
        '204':
          description: The item is canceled.
        default:
          $ref: '#/components/responses/Problem'
  /admin/cost_totals:
    get:
      operationId: getCostTotals
      summary: Total the costs by period
      description: |
        The totals of the cost items and the imported usage charges for each week, month, or
        year from the one that holds `from` to the one that holds `to` (ADR-0067 §4, §5), by
        currency and broken down by provider and category, with the rules that cut the periods.
        The totals are computed on every read. More than 104 weeks, 60 months, or 20 years, and
        `to` before `from`, are a 422 naming `to`. Needs the `manage_finance` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:read
      parameters:
        - name: granularity
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/CostGranularity'
        - name: from
          in: query
          required: true
          description: A date in the first period.
          schema:
            $ref: '#/components/schemas/CalendarDate'
        - name: to
          in: query
          required: true
          description: A date in the last period.
          schema:
            $ref: '#/components/schemas/CalendarDate'
        - name: basis
          in: query
          required: false
          description: How the totals place a payment; `amortized` by default.
          schema:
            $ref: '#/components/schemas/CostBasis'
      responses:
        '200':
          description: The totals.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostTotals'
        default:
          $ref: '#/components/responses/Problem'
  /admin/income_totals:
    get:
      operationId: getIncomeTotals
      summary: Total the income by period
      description: |
        The totals of the payment provider's money movements for each week, month, or year from
        the one that holds `from` to the one that holds `to` (ADR-0073 §5, §6): the gross, the
        provider's fees, and the net of each currency, the balance against the costs of
        `GET /admin/cost_totals` under the same basis, the number of members of each supporter
        plan now, and the rules that cut the periods. The totals are computed on every read. More
        than 104 weeks, 60 months, or 20 years, and `to` before `from`, are a 422 naming `to`.
        Needs the `manage_finance` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:read
      parameters:
        - name: granularity
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/CostGranularity'
        - name: from
          in: query
          required: true
          description: A date in the first period.
          schema:
            $ref: '#/components/schemas/CalendarDate'
        - name: to
          in: query
          required: true
          description: A date in the last period.
          schema:
            $ref: '#/components/schemas/CalendarDate'
        - name: basis
          in: query
          required: false
          description: How the totals place a payment; `amortized` by default.
          schema:
            $ref: '#/components/schemas/CostBasis'
      responses:
        '200':
          description: The income totals.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminIncomeTotals'
        default:
          $ref: '#/components/responses/Problem'
  /admin/income_movements:
    get:
      operationId: listIncomeMovements
      summary: List the money movements of the income
      description: |
        The payment provider's money movements that the income records keep (ADR-0073 §6), newest
        first by the time the provider booked them, narrowed to the dates they fall on and a
        kind, with the subscriber's account of each. Only this operation and the admin screen
        show individual movements and their subscribers. Needs the `manage_finance` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:read
      parameters:
        - name: from
          in: query
          description: Only the movements on or after this date.
          schema:
            $ref: '#/components/schemas/CalendarDate'
        - name: to
          in: query
          description: Only the movements on or before this date.
          schema:
            $ref: '#/components/schemas/CalendarDate'
        - name: kind
          in: query
          description: Only the movements of this kind.
          schema:
            $ref: '#/components/schemas/IncomeKind'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of money movements.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomeMovementPage'
        default:
          $ref: '#/components/responses/Problem'
  /admin/domain_actions:
    get:
      operationId: listDomainActions
      summary: List the moderation actions on domains
      description: |
        The actions that moderators took on remote domains (FR-702), newest first, lifted and
        expired ones included unless `active` is set. Needs the `manage_domains` permission.
      tags:
        - admin-moderation
      security:
        - oauth2:
            - admin:read
      parameters:
        - name: domain
          in: query
          required: false
          description: |
            Keep only the actions on this domain (not those on its parent domains). It is
            normalized like the domain of a new action.
          schema:
            type: string
            minLength: 1
            maxLength: 253
        - name: active
          in: query
          required: false
          description: Keep only the actions in effect now, neither lifted nor expired.
          schema:
            type: boolean
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of domain actions.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDomainActionPage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createDomainAction
      summary: Take a moderation action on a domain
      description: |
        Records an action on a remote domain and its subdomains (FR-702), in effect at once and
        until it expires or is lifted. A `suspend` stops every delivery to the domain, every
        fetch from it, and every activity received from it, and hides its accounts and posts
        from the timelines; `limit` keeps its posts off the public timelines and its accounts
        from reaching users who do not follow them; `reject_media` stops fetching its media;
        `reject_reports` drops the reports it sends; `force_sensitive` marks its media
        sensitive. The domain is normalized (IDNA A-labels in lower case, without a trailing
        dot); one that is not a valid domain is a 422 naming `domain`. A `public_comment` or
        `private_note` that is too long or contains U+0000 is a 422 naming it. Needs the
        `manage_domains` permission.
      tags:
        - admin-moderation
      security:
        - oauth2:
            - admin:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDomainActionRequest'
      responses:
        '200':
          $ref: '#/components/responses/AdminDomainAction'
        default:
          $ref: '#/components/responses/Problem'
  /admin/domain_actions/{id}:
    get:
      operationId: getDomainAction
      summary: Get a moderation action on a domain
      description: An unknown ID is a 404. Needs the `manage_domains` permission.
      tags:
        - admin-moderation
      security:
        - oauth2:
            - admin:read
      parameters:
        - $ref: '#/components/parameters/DomainActionId'
      responses:
        '200':
          $ref: '#/components/responses/AdminDomainAction'
        default:
          $ref: '#/components/responses/Problem'
  /admin/domain_actions/{id}/lift:
    post:
      operationId: liftDomainAction
      summary: Lift a moderation action on a domain
      description: |
        Ends the action's restrictions at once; those of other actions on the domain stay.
        Lifting a lifted action changes nothing. An unknown ID is a 404. Needs the
        `manage_domains` permission.
      tags:
        - admin-moderation
      security:
        - oauth2:
            - admin:write
      parameters:
        - $ref: '#/components/parameters/DomainActionId'
      responses:
        '200':
          $ref: '#/components/responses/AdminDomainAction'
        default:
          $ref: '#/components/responses/Problem'
  /admin/reports:
    get:
      operationId: listReports
      summary: List the reports
      description: |
        The reports in the moderators' queue (FR-701), newest first. Needs the `manage_reports`
        permission.
      tags:
        - admin-moderation
      security:
        - oauth2:
            - admin:read
      parameters:
        - name: state
          in: query
          required: false
          description: Keep only the reports in this state; omitted keeps both.
          schema:
            $ref: '#/components/schemas/AdminReportState'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of reports.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminReportPage'
        default:
          $ref: '#/components/responses/Problem'
  /admin/reports/{id}:
    get:
      operationId: getReport
      summary: Get a report
      description: |
        The report as a moderator opens it, with the posts it points at whatever their
        visibility. An unknown ID is a 404. Needs the `manage_reports` permission.
      tags:
        - admin-moderation
      security:
        - oauth2:
            - admin:read
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          $ref: '#/components/responses/AdminReportDetail'
        default:
          $ref: '#/components/responses/Problem'
  /admin/reports/{id}/assign_to_self:
    post:
      operationId: assignReportToSelf
      summary: Take a report
      description: |
        Makes the authenticated user the moderator who handles the report. An unknown ID is a
        404. Needs the `manage_reports` permission.
      tags:
        - admin-moderation
      security:
        - oauth2:
            - admin:write
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          $ref: '#/components/responses/AdminReportDetail'
        default:
          $ref: '#/components/responses/Problem'
  /admin/reports/{id}/unassign:
    post:
      operationId: unassignReport
      summary: Leave a report to nobody
      description: |
        Removes the moderator who handles the report, whoever it is. An unknown ID is a 404.
        Needs the `manage_reports` permission.
      tags:
        - admin-moderation
      security:
        - oauth2:
            - admin:write
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          $ref: '#/components/responses/AdminReportDetail'
        default:
          $ref: '#/components/responses/Problem'
  /admin/reports/{id}/resolve:
    post:
      operationId: resolveReport
      summary: Resolve a report
      description: |
        Resolves an open report with an outcome. Resolving a resolved report changes nothing
        and keeps its outcome. An unknown ID is a 404. Needs the `manage_reports` permission.
      tags:
        - admin-moderation
      security:
        - oauth2:
            - admin:write
      parameters:
        - $ref: '#/components/parameters/ReportId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveReportRequest'
      responses:
        '200':
          $ref: '#/components/responses/AdminReportDetail'
        default:
          $ref: '#/components/responses/Problem'
  /admin/reports/{id}/notes:
    post:
      operationId: addReportNote
      summary: Write a note on a report
      description: |
        Adds an internal note to the report (FR-710). Notes are shown to the moderators only,
        never to the target or the reporter, and cannot be edited or removed. An unknown ID is
        a 404. Needs the `manage_reports` permission.
      tags:
        - admin-moderation
      security:
        - oauth2:
            - admin:write
      parameters:
        - $ref: '#/components/parameters/ReportId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReportNoteRequest'
      responses:
        '200':
          $ref: '#/components/responses/AdminReportDetail'
        default:
          $ref: '#/components/responses/Problem'
  /admin/reports/{id}/reopen:
    post:
      operationId: reopenReport
      summary: Reopen a resolved report
      description: |
        Puts a resolved report back in the queue as `open`, keeping its assignee. Resolving it
        again does not notify the reporter again. An open report is a 409, an unknown ID a
        404. Needs the `manage_reports` permission.
      tags:
        - admin-moderation
      security:
        - oauth2:
            - admin:write
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          $ref: '#/components/responses/AdminReportDetail'
        default:
          $ref: '#/components/responses/Problem'
  /admin/accounts/{id}/actions:
    get:
      operationId: listAccountActions
      summary: List the moderation actions on an account
      description: |
        The actions that moderators took on an account (FR-703), newest first, lifted and
        expired ones included unless `active` is set. An unknown account is a 404. Needs the
        `manage_accounts` permission.
      tags:
        - admin-moderation
      security:
        - oauth2:
            - admin:read
      parameters:
        - $ref: '#/components/parameters/AdminAccountId'
        - name: active
          in: query
          required: false
          description: Keep only the actions in effect now, neither lifted nor expired.
          schema:
            type: boolean
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of account actions.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccountActionPage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createAccountAction
      summary: Take a moderation action on an account
      description: |
        Records an action on an account (FR-703), in effect at once and until it expires or is
        lifted; several actions on one account add up. On a local account: `warn` only tells
        the account; `force_sensitive` shows its media as sensitive; `limit` makes its posts,
        past ones included, followers-only and keeps them off the public timelines;
        `restrict_posting` stops it posting, replying, boosting, and editing;
        `restrict_interaction` stops it following, favouriting, boosting, and replying;
        `disable_login` ends its sessions and tokens and stops it logging in; `suspend` does all
        of these and hides its profile and posts from everyone else; `ban` is a `suspend` that
        is never lifted and deletes the account 30 days later. `delete_statuses` deletes the
        posts of the account that `status_ids` names, for everyone, the account included, and
        sends their deletion like the account's own; `mark_statuses_sensitive` shows their
        media as sensitive until it is lifted. A remote account takes `limit`, `suspend`, and
        `force_sensitive`, with the same effects here: a `suspend` also drops what the account
        sends, and its lift brings the profile and posts back. An action on a remote account is
        not sent to its server, and `notify_target` does not apply to it. Another kind, the instance actor, or a `report_id` that is not a
        report of the account is a 422 naming `kind`, `id`, or `report_id`. `status_ids` on
        another kind, missing, repeated, or too many on an action on posts, or naming a post
        that does not exist, is deleted, or is of another account is a 422 naming `status_ids`;
        `expires_in` on a `ban` or an action on posts is a 422 naming `expires_in`. A text that
        is too long or contains U+0000 is a 422 naming it. An unknown account is a 404. Needs
        the `manage_accounts` permission.
      tags:
        - admin-moderation
      security:
        - oauth2:
            - admin:write
      parameters:
        - $ref: '#/components/parameters/AdminAccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountActionRequest'
      responses:
        '200':
          $ref: '#/components/responses/AdminAccountAction'
        default:
          $ref: '#/components/responses/Problem'
  /admin/account_actions/{id}:
    get:
      operationId: getAccountAction
      summary: Get a moderation action on an account
      description: An unknown ID is a 404. Needs the `manage_accounts` permission.
      tags:
        - admin-moderation
      security:
        - oauth2:
            - admin:read
      parameters:
        - $ref: '#/components/parameters/AccountActionId'
      responses:
        '200':
          $ref: '#/components/responses/AdminAccountAction'
        default:
          $ref: '#/components/responses/Problem'
  /admin/account_actions/{id}/lift:
    post:
      operationId: liftAccountAction
      summary: Lift a moderation action on an account
      description: |
        Ends the action's restrictions at once; those of other actions on the account stay.
        Sessions and tokens that the action ended stay ended, and so do the posts that
        `delete_statuses` deleted; the posts that `mark_statuses_sensitive` marked are shown as
        they were. Lifting a lifted action changes nothing and keeps its first reason. A `ban`
        is never lifted: a 422 naming `id`. A `reason` that is too long or contains U+0000 is a
        422 naming `reason`. An unknown ID is a 404. Needs the `manage_accounts` permission.
      tags:
        - admin-moderation
      security:
        - oauth2:
            - admin:write
      parameters:
        - $ref: '#/components/parameters/AccountActionId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LiftAccountActionRequest'
      responses:
        '200':
          $ref: '#/components/responses/AdminAccountAction'
        default:
          $ref: '#/components/responses/Problem'
  /admin/rules:
    get:
      operationId: listInstanceRules
      summary: List the instance rules
      description: |
        Every rule (FR-705): the rules in effect by position, followed, when
        `include_retired` is set, by the retired ones. The list is not paginated; at most 100
        rules are in effect. Needs the `manage_rules` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:read
      parameters:
        - name: include_retired
          in: query
          required: false
          description: Also list the retired rules, after the rules in effect.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: The rules.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRuleList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createInstanceRule
      summary: Add an instance rule
      description: |
        Adds a rule after the rules in effect. A text that is blank, longer than 300
        characters, or on more than one line, or a hint longer than 1,000 characters, is a 422
        naming the property (`text`, `hint`). With 100 rules in effect it is a 422 naming
        `rules`. Needs the `manage_rules` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceRuleInput'
      responses:
        '200':
          $ref: '#/components/responses/AdminRule'
        default:
          $ref: '#/components/responses/Problem'
  /admin/rules/{id}:
    get:
      operationId: getInstanceRule
      summary: Get an instance rule
      description: |
        A rule, retired or not; reports cite rules by ID. An unknown ID is a 404. Needs the
        `manage_rules` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:read
      parameters:
        - $ref: '#/components/parameters/RuleId'
      responses:
        '200':
          $ref: '#/components/responses/AdminRule'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateInstanceRule
      summary: Revise the text of an instance rule
      description: |
        Records a revision whose text and hint replace those of the rule; the rule keeps its ID
        and position. They are checked as for a new rule (422). A retired rule is a 409
        and an unknown ID a 404. Needs the `manage_rules` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      parameters:
        - $ref: '#/components/parameters/RuleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceRuleInput'
      responses:
        '200':
          $ref: '#/components/responses/AdminRule'
        default:
          $ref: '#/components/responses/Problem'
  /admin/rules/{id}/move:
    post:
      operationId: moveInstanceRule
      summary: Move an instance rule
      description: |
        Moves the rule to a place among the rules in effect and numbers them 1, 2, ... in their
        new order; a place after the last rule moves it last. A `position` below 1 is a 422, a
        retired rule a 409, and an unknown ID a 404. Needs the `manage_rules` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      parameters:
        - $ref: '#/components/parameters/RuleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveInstanceRuleRequest'
      responses:
        '200':
          $ref: '#/components/responses/AdminRule'
        default:
          $ref: '#/components/responses/Problem'
  /admin/rules/{id}/retire:
    post:
      operationId: retireInstanceRule
      summary: Retire an instance rule
      description: |
        Removes the rule from the rules in effect, at once and for good; reports that cite it
        still refer to it. Retiring a retired rule changes nothing. An unknown ID is a 404.
        Needs the `manage_rules` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      parameters:
        - $ref: '#/components/parameters/RuleId'
      responses:
        '200':
          $ref: '#/components/responses/AdminRule'
        default:
          $ref: '#/components/responses/Problem'
  /admin/announcements:
    get:
      operationId: listAdminAnnouncements
      summary: List the announcements
      description: |
        Every announcement, drafts and withdrawn ones included, newest first (FR-726). The
        list is not paginated. Needs the `manage_announcements` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:read
      responses:
        '200':
          description: The announcements.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAnnouncementList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createAdminAnnouncement
      summary: Write an announcement
      description: |
        Writes an announcement to every local user, a draft unless `publish` is set. The text
        is Markdown; the users get it as sanitized HTML. A blank text or one longer than 5,000
        characters is a 422 naming `text`, and a window that ends when or before it starts a
        422 naming `ends_at`. Recorded in the audit log. Needs the `manage_announcements`
        permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAnnouncementCreateRequest'
      responses:
        '200':
          $ref: '#/components/responses/AdminAnnouncement'
        default:
          $ref: '#/components/responses/Problem'
  /admin/announcements/{id}:
    get:
      operationId: getAdminAnnouncement
      summary: Get an announcement
      description: An unknown ID is a 404. Needs the `manage_announcements` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:read
      parameters:
        - $ref: '#/components/parameters/AnnouncementId'
      responses:
        '200':
          $ref: '#/components/responses/AdminAnnouncement'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateAdminAnnouncement
      summary: Revise an announcement
      description: |
        Replaces the text and the window of a draft or a published announcement, which keeps
        its state; an omitted `starts_at` or `ends_at` leaves that side of the window open. The
        input is checked as for a new announcement (422). A withdrawn announcement is a 409 and
        an unknown ID a 404. Recorded in the audit log. Needs the `manage_announcements`
        permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      parameters:
        - $ref: '#/components/parameters/AnnouncementId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAnnouncementInput'
      responses:
        '200':
          $ref: '#/components/responses/AdminAnnouncement'
        default:
          $ref: '#/components/responses/Problem'
  /admin/announcements/{id}/publish:
    post:
      operationId: publishAdminAnnouncement
      summary: Publish an announcement
      description: |
        Publishes a draft to every local user, within its window. Publishing a published
        announcement changes nothing. A withdrawn announcement is a 409 and an unknown ID a 404.
        Recorded in the audit log. Needs the `manage_announcements` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      parameters:
        - $ref: '#/components/parameters/AnnouncementId'
      responses:
        '200':
          $ref: '#/components/responses/AdminAnnouncement'
        default:
          $ref: '#/components/responses/Problem'
  /admin/announcements/{id}/withdraw:
    post:
      operationId: withdrawAdminAnnouncement
      summary: Withdraw an announcement
      description: |
        Withdraws an announcement for good: no user sees it again, and it can no longer change
        or be published. Withdrawing a withdrawn announcement changes nothing. An unknown ID is
        a 404. Recorded in the audit log. Needs the `manage_announcements` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      parameters:
        - $ref: '#/components/parameters/AnnouncementId'
      responses:
        '200':
          $ref: '#/components/responses/AdminAnnouncement'
        default:
          $ref: '#/components/responses/Problem'
  /admin/theme:
    get:
      operationId: getAdminTheme
      summary: Read the instance theme
      description: |
        The current theme of the web client (ADR-0059, FR-605): the overridden design tokens and the
        custom CSS. A server that never saved a theme, or reset it, answers an empty theme. Needs the
        `manage_settings` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:read
      responses:
        '200':
          $ref: '#/components/responses/AdminTheme'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: setAdminTheme
      summary: Replace the instance theme
      description: |
        Records a revision of the theme, which every visitor's web client and the server-rendered
        pages load as the stylesheet `stylesheet_url` (after the shell's shared cache of up to a
        few minutes). `tokens` lists every overridden token; the tokens it leaves out go back to
        their defaults, and no tokens and an empty `custom_css` reset the theme. The revision and the
        change are kept (`instance_theme_revisions`, the audit log's `setting_changed` of `theme`).

        The overridable tokens are the web client's design tokens except the primitive palette
        (the generated list of `@my/ui`). A color token takes `light` and `dark`, each `#rrggbb`
        (`#rrggbbaa` for `color-overlay`); the other tokens take `value`: a length is `0` or a `rem`
        / `px` value within the token's bounds, a line height a number, a duration `ms` / `s`, an
        easing a keyword or `cubic-bezier()`, a font family a list of family names, and an
        `elevation-*` shadow `none` or up to four `[inset] <x> <y> [<blur> [<spread>]] <#color>`
        layers. Every contrast pair of the color tokens, with the defaults of the tokens not
        overridden, must meet WCAG 2.2 AA (4.5:1 for text, 3:1 for controls) in both color schemes.
        The custom CSS (at most 65,536 bytes) is served as it is after the token rules; the server
        does not read it, it runs under the same Content-Security-Policy as the client (only
        same-origin resources), and what it does to contrast, layout, and focus is the
        administrator's responsibility. A theme that breaks any rule is a 422
        `/api/v1/problems/invalid-theme` listing every problem in `theme_errors`. Needs the
        `manage_settings` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetThemeRequest'
      responses:
        '200':
          $ref: '#/components/responses/AdminTheme'
        '422':
          description: The theme breaks a rule; nothing was saved.
          headers:
            Content-Language:
              description: The locale of `title` and `detail`.
              schema:
                type: string
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ThemeProblem'
        default:
          $ref: '#/components/responses/Problem'
  /admin/custom_emojis:
    get:
      operationId: listAdminCustomEmojis
      summary: List the custom emoji
      description: |
        The custom emoji, local and remote, newest first (ADR-0051 §4). `local` keeps the
        emoji of this instance (`true`) or of other servers (`false`); `domain` keeps those of
        one remote domain; `shortcode` keeps those whose shortcode contains it, ignoring case.
        Needs the `manage_custom_emojis` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:read
      parameters:
        - name: local
          in: query
          required: false
          description: Keep the local emoji (`true`) or the remote ones (`false`).
          schema:
            type: boolean
        - name: domain
          in: query
          required: false
          description: Keep the emoji of this remote domain.
          schema:
            type: string
            minLength: 1
            maxLength: 253
        - name: shortcode
          in: query
          required: false
          description: Keep the emoji whose shortcode contains this text, ignoring case.
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of the custom emoji.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCustomEmojiPage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createCustomEmoji
      summary: Register a local custom emoji
      description: |
        Registers a local emoji with the image of a media file that the user uploaded and that
        finished processing (upload it with the `emoji` purpose). The image must be a PNG, a
        GIF, or a WebP, at most `custom_emoji_max_bytes` (256 KiB by default) and 1,024 pixels
        on its longer side; an APNG shows only its first frame. A shortcode that breaks the
        rules or that a local emoji has, an alias or a category that breaks the rules, or an
        image that does not qualify is a 422 `/api/v1/problems/invalid-custom-emoji` whose
        `reason` says which. The registration is recorded in the audit log. Needs the
        `manage_custom_emojis` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomEmojiRequest'
      responses:
        '200':
          $ref: '#/components/responses/AdminCustomEmoji'
        '422':
          $ref: '#/components/responses/CustomEmojiProblem'
        default:
          $ref: '#/components/responses/Problem'
  /admin/custom_emojis/{id}:
    parameters:
      - $ref: '#/components/parameters/CustomEmojiId'
    get:
      operationId: getAdminCustomEmoji
      summary: Get a custom emoji
      description: An unknown ID is a 404. Needs the `manage_custom_emojis` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:read
      responses:
        '200':
          $ref: '#/components/responses/AdminCustomEmoji'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateCustomEmoji
      summary: Change the settings of a custom emoji
      description: |
        Changes what the request names and keeps the rest. A remote emoji can only be enabled
        and disabled (`enabled`); a change of its other settings is a 422 with the reason
        `remote_emoji`. A disabled emoji is shown nowhere: its `:shortcode:` stays text.
        `category` is trimmed, and an empty one removes the category; `aliases` replace the
        aliases. Each change is recorded in the audit log. An unknown ID is a 404. Needs the
        `manage_custom_emojis` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomEmojiRequest'
      responses:
        '200':
          $ref: '#/components/responses/AdminCustomEmoji'
        '422':
          $ref: '#/components/responses/CustomEmojiProblem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteCustomEmoji
      summary: Delete a local custom emoji
      description: |
        Deletes a local emoji for good, with its images; the posts and profiles that used it
        show its `:shortcode:` as text. A new emoji with the same shortcode is another emoji.
        A remote emoji is a 422 with the reason `remote_emoji` (disable it instead). The
        deletion is recorded in the audit log. An unknown ID is a 404. Needs the
        `manage_custom_emojis` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      responses:
        '204':
          description: The emoji is deleted.
        '422':
          $ref: '#/components/responses/CustomEmojiProblem'
        default:
          $ref: '#/components/responses/Problem'
  /admin/custom_emojis/{id}/image:
    put:
      operationId: replaceCustomEmojiImage
      summary: Replace the image of a local custom emoji
      description: |
        Makes the image of a media file the new image of a local emoji, checked as for a new
        emoji; the servers that have the emoji fetch it again (its `updated_at` changes). A
        remote emoji is a 422 with the reason `remote_emoji`. The change is recorded in the
        audit log. An unknown ID is a 404. Needs the `manage_custom_emojis` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      parameters:
        - $ref: '#/components/parameters/CustomEmojiId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceCustomEmojiImageRequest'
      responses:
        '200':
          $ref: '#/components/responses/AdminCustomEmoji'
        '422':
          $ref: '#/components/responses/CustomEmojiProblem'
        default:
          $ref: '#/components/responses/Problem'
  /admin/custom_emojis/{id}/copy:
    post:
      operationId: copyCustomEmoji
      summary: Copy a remote custom emoji into a local one
      description: |
        Registers a new local emoji with the image of a remote emoji, under the shortcode of the
        request or the remote one's. The image is fetched through the media proxy, so the
        instance does not fetch the media of a domain whose media it rejects, and is checked as
        the image of a new emoji (`createCustomEmoji`); it shrinks into the boxes of an emoji.
        The new emoji is in the picker, without a category or aliases. A local emoji is a 422
        with the reason `local_emoji`; an image that cannot be fetched is a 422 with the reason
        `fetch_failed`; a shortcode or an image that does not qualify is a 422 whose `reason`
        says which, and keeps nothing of the copy. The copy is recorded in the audit log
        (`custom_emoji_copied` on the new emoji). An unknown ID is a 404. Needs the
        `manage_custom_emojis` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      parameters:
        - $ref: '#/components/parameters/CustomEmojiId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyCustomEmojiRequest'
      responses:
        '200':
          $ref: '#/components/responses/AdminCustomEmoji'
        '422':
          $ref: '#/components/responses/CustomEmojiProblem'
        default:
          $ref: '#/components/responses/Problem'
  /admin/custom_emoji_requests:
    get:
      operationId: listAdminCustomEmojiRequests
      summary: List the custom emoji requests
      description: |
        The custom emoji requests of the holders of `create_custom_emojis` (ADR-0070 §6), newest
        first, with their requesters: the pending ones unless `state` names another state. Needs the `manage_custom_emojis` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:read
      parameters:
        - name: state
          in: query
          required: false
          description: Keep the requests in this state; `pending` by default.
          schema:
            $ref: '#/components/schemas/CustomEmojiRequestState'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of the requests.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCustomEmojiRequestPage'
        default:
          $ref: '#/components/responses/Problem'
  /admin/custom_emoji_requests/{id}/approve:
    parameters:
      - $ref: '#/components/parameters/CustomEmojiRequestId'
    post:
      operationId: approveCustomEmojiRequest
      summary: Approve a custom emoji request
      description: |
        Approves a pending request (ADR-0070 §2): a `create` request makes the local emoji,
        without a category, in the picker, and enabled, whose creator is the requester; an `image`
        request gives the emoji the requested image. The image is copied as an upload of the
        instance. The approval and the emoji's registration or new image are recorded in the
        audit log, and the requester is notified. A request that is not pending, whose requester
        no longer may create custom emoji, or whose shortcode a local emoji has is a 409
        `/api/v1/problems/custom-emoji-request-conflict` whose `reason` says which (reject it
        instead); an image that no longer qualifies is a 422. An unknown request is a 404.
        Needs the `manage_custom_emojis` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      responses:
        '200':
          $ref: '#/components/responses/AdminCustomEmojiRequest'
        '409':
          $ref: '#/components/responses/CustomEmojiRequestProblem'
        '422':
          $ref: '#/components/responses/CustomEmojiProblem'
        default:
          $ref: '#/components/responses/Problem'
  /admin/custom_emoji_requests/{id}/reject:
    parameters:
      - $ref: '#/components/parameters/CustomEmojiRequestId'
    post:
      operationId: rejectCustomEmojiRequest
      summary: Reject a custom emoji request
      description: |
        Rejects a pending request, with an optional reason that the requester sees, which frees
        its shortcode (ADR-0070 §2). The rejection is recorded in the audit log, and the requester
        is notified. A reason longer than 500 characters is a 422 with the reason
        `invalid_reason`; a request that is not pending is a 409
        `/api/v1/problems/custom-emoji-request-conflict` (`not_pending`). An unknown request is a
        404. Needs the `manage_custom_emojis` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectCustomEmojiRequestRequest'
      responses:
        '200':
          $ref: '#/components/responses/AdminCustomEmojiRequest'
        '409':
          $ref: '#/components/responses/CustomEmojiRequestProblem'
        '422':
          $ref: '#/components/responses/CustomEmojiProblem'
        default:
          $ref: '#/components/responses/Problem'
  /admin/instance_texts:
    get:
      operationId: listInstanceTexts
      summary: List the instance texts
      description: |
        The current text of every key that has one (FR-705): the name, the descriptions, the
        terms of service, the privacy policy, and the alternative texts of the preview image and
        the thumbnail, by key. Each holds one value, shown as it is in every locale. Cleared
        texts are not listed. The list is not paginated. Needs the `manage_settings` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:read
      responses:
        '200':
          description: The texts.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminInstanceTextList'
        default:
          $ref: '#/components/responses/Problem'
  /admin/instance_texts/{key}:
    put:
      operationId: setInstanceText
      summary: Set an instance text
      description: |
        Records a revision of the text of `key`, which becomes its current text in every locale:
        the administrator writes it once, in any language, and readers of every locale see the
        same value. An empty `body` clears the text. The revision and the change are kept
        (`instance_text_revisions`, the audit log's `text_changed`). The terms of service and the privacy policy are Markdown, which the server renders and
        sanitizes for the web client's pages of them (`GET /instance/documents/{kind}`, linked from
        `Instance.terms_url`, `Instance.privacy_policy_url` and `Instance.commerce_disclosure_url`);
        the other texts are plain text. The display name (`name`) names the instance to people
        in place of its domain: the web client's navigation and tab title, the server-rendered
        pages, emails, link previews, the Web App Manifest, and NodeInfo's `metadata.nodeName`;
        without a name, the domain names it, and handles and URLs always use the domain. An
        unknown key is a 404. A body longer than the key allows (100 characters for
        `name`, 500 for `short_description`, 1,500 for `preview_image_alt` and `thumbnail_alt`, 20,000 for
        `description`, 100,000 for `terms` and `privacy_policy`), or with a line break in `name`
        or of only spaces in `name`, is a 422 naming `body`. Needs the `manage_settings`
        permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      parameters:
        - $ref: '#/components/parameters/InstanceTextKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetInstanceTextRequest'
      responses:
        '200':
          description: The text as recorded; `body` is empty when the text was cleared.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminInstanceText'
        default:
          $ref: '#/components/responses/Problem'
  /admin/counts:
    get:
      operationId: getAdminCounts
      summary: Count what awaits the moderators
      description: |
        The number of open reports (with the `manage_reports` permission), and of registrations
        that await approval and appeals that await a decision (with the `manage_accounts`
        permission), for the badges of the admin menu (FR-712). A count whose permission the user's roles lack is omitted, so a
        user without either gets an empty object.
      tags:
        - admin-moderation
      security:
        - oauth2:
            - admin:read
      responses:
        '200':
          description: The counts that the user may see.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCounts'
        default:
          $ref: '#/components/responses/Problem'
  /admin/accounts:
    get:
      operationId: listAdminAccounts
      summary: Search the accounts
      description: |
        The local and remote accounts (FR-714), newest first, without the instance actor:
        those whose handle's username starts with `username` (case-insensitively; a remote
        account whose handle is not verified has none), on a `domain`, local or remote
        (`origin`), in a `state`, and, for local accounts, of a primary email address (`email`,
        case-insensitively), an email domain (`email_domain`), or an IP address that the
        account registered or signed in from (`ip`). At most one of `email`, `email_domain`,
        and `ip` is given. The results never include an email or IP address. A search reads at
        most 400 accounts per page, so a page can be short, or empty, and still have a
        `next_cursor`. An unknown `origin` or `state`, an `ip` that is not an IP address, an
        `email_domain` with an `@` inside, more than one of `email`, `email_domain`, and `ip`,
        or a parameter longer than 320 characters is a 400 naming it. Needs the
        `manage_accounts` permission.
      tags:
        - admin-moderation
      security:
        - oauth2:
            - admin:read
      parameters:
        - name: username
          in: query
          required: false
          description: Keep the accounts whose username starts with this.
          schema:
            type: string
            minLength: 1
            maxLength: 320
        - name: domain
          in: query
          required: false
          description: Keep the remote accounts of this domain (its punycode form).
          schema:
            type: string
            minLength: 1
            maxLength: 320
        - name: origin
          in: query
          required: false
          description: Keep the local or the remote accounts.
          schema:
            type: string
            enum:
              - local
              - remote
        - name: state
          in: query
          required: false
          description: Keep the accounts in this state.
          schema:
            $ref: '#/components/schemas/AdminAccountState'
        - name: email
          in: query
          required: false
          description: Keep the local account whose primary email address is this.
          schema:
            type: string
            minLength: 1
            maxLength: 320
        - name: email_domain
          in: query
          required: false
          description: |
            Keep the local accounts whose primary email address is at this domain
            (`example.com` or `@example.com`).
          schema:
            type: string
            minLength: 1
            maxLength: 320
        - name: ip
          in: query
          required: false
          description: |
            Keep the local accounts that registered or signed in from this IP address, within
            the retention of the sign-in and registration origins.
          schema:
            type: string
            minLength: 1
            maxLength: 320
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of accounts.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccountPage'
        default:
          $ref: '#/components/responses/Problem'
  /admin/accounts/{id}:
    get:
      operationId: getAdminAccount
      summary: Get the details of an account
      description: |
        An account as the moderators see it (FR-714): its state, the restrictions of its own
        actions, and, for a local account, its registration, whether its email address is
        verified, and its roles, with its newest 20 actions and reports. The email address and
        the IP addresses are not included; `POST .../reveal` shows them. An unknown account is
        a 404. Needs the `manage_accounts` permission.
      tags:
        - admin-moderation
      security:
        - oauth2:
            - admin:read
      parameters:
        - $ref: '#/components/parameters/AdminAccountId'
      responses:
        '200':
          description: The account.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccountDetail'
        default:
          $ref: '#/components/responses/Problem'
  /admin/accounts/{id}/reveal:
    post:
      operationId: revealAdminAccount
      summary: Show the email address and the IP addresses of a local account
      description: |
        The primary email address of a local account, where it registered and its newest 20
        sign-ins came from, and up to 20 other accounts per IP address that used the same one
        (FR-714). Each call is recorded in the audit log as `revealed_private_data` before
        anything is returned; it changes nothing else. IP addresses are kept for the retention
        of the sign-in and registration origins only (ADR-0038). A remote account or the
        instance actor is a 422 naming `id`. An unknown account is a 404. Needs the
        `manage_accounts` permission.
      tags:
        - admin-moderation
      security:
        - oauth2:
            - admin:read
      parameters:
        - $ref: '#/components/parameters/AdminAccountId'
      responses:
        '200':
          description: The email address and the IP addresses of the account.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccountPrivateData'
        default:
          $ref: '#/components/responses/Problem'
  /admin/accounts/{id}/two_factor/disable:
    post:
      operationId: disableAdminAccountTwoFactor
      summary: Remove the two-factor authentication of a local account
      description: |
        Ends the TOTP enrollment of a local account's user, who lost their authenticator app
        and recovery codes, so that they sign in with the password alone (FR-005). It is
        recorded in the audit log as `two_factor_disabled`. A remote account or the instance
        actor is a 422 naming `id`, an account without two-factor authentication a 409
        `/api/v1/problems/two-factor-not-enabled`, and an unknown account a 404. Needs the
        `manage_login_recovery` permission, which only the built-in admin role has by default.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      parameters:
        - $ref: '#/components/parameters/AdminAccountId'
      responses:
        '204':
          description: The two-factor authentication is removed.
        default:
          $ref: '#/components/responses/Problem'
  /admin/accounts/{id}/password_reset_link:
    post:
      operationId: issueAdminAccountPasswordResetLink
      summary: Issue a password reset link for a local account
      description: |
        Issues a link that sets a new password for a local account's user, for an
        administrator to hand to the user, such as when the server sends no email or the
        email does not arrive (FR-002). The link works once, for an hour, and stops working
        when the password changes otherwise; only its hash is stored, so this response is the
        only place it is shown. It is recorded in the audit log as `password_reset_link_issued`.
        Whoever holds the link can set the password: confirm who the user is through another
        channel first. A remote account or the instance actor is a 422 naming `id`, and an
        unknown account a 404. Needs the `manage_login_recovery` permission, which only the
        built-in admin role has by default.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      parameters:
        - $ref: '#/components/parameters/AdminAccountId'
      responses:
        '201':
          description: The link is issued.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPasswordResetLink'
        default:
          $ref: '#/components/responses/Problem'
  /admin/roles:
    get:
      operationId: listRoles
      summary: List the roles
      description: |
        The roles of the instance, highest position first, with the permissions they grant
        (FR-720). Every instance has `admin` (position 1000, every permission, never changed)
        and `moderator` (position 100 with `manage_reports`, `manage_accounts`, and
        `view_audit` until an administrator changes them). Needs the `manage_roles` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:read
      responses:
        '200':
          $ref: '#/components/responses/AdminRoleList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createRole
      summary: Create a role
      description: |
        Creates a role with a key, a position below `admin` (0 to 999), and permissions; the
        audit log records `role_created`. A position above every role of the viewer is a 403.
        A key, position, or permissions that break a rule, a key that another role has
        (`admin` and `moderator` included), or a permission that the viewer's roles do not
        grant is a 422 `/api/v1/problems/invalid-role` whose `reason` says which. Needs the
        `manage_roles` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '200':
          $ref: '#/components/responses/AdminRole'
        '422':
          $ref: '#/components/responses/RoleProblem'
        default:
          $ref: '#/components/responses/Problem'
  /admin/roles/{role}:
    parameters:
      - $ref: '#/components/parameters/RoleKey'
    patch:
      operationId: updateRole
      summary: Change a role
      description: |
        Changes the position, the permissions, the badge, or several of them of a role; the
        change applies to its holders from their next request, and the audit log records
        `role_updated`. A request that changes nothing records nothing. The key never changes.
        `admin` changes only its badge (a new position or permissions is a 422 `builtin`);
        `moderator` takes a new position and permissions like any other role. Removing the badge
        hides it from every holder's profile (ADR-0071). A role, or a new position, above every
        role of the viewer is a 403. A position, permissions, or badge that break a rule, or
        adding or removing a permission that the viewer's roles do not grant, is a 422
        `/api/v1/problems/invalid-role` whose `reason` says which. An unknown role is a 404.
        Needs the `manage_roles` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '200':
          $ref: '#/components/responses/AdminRole'
        '422':
          $ref: '#/components/responses/RoleProblem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteRole
      summary: Delete a role
      description: |
        Deletes a role that nobody holds; the audit log records `role_deleted`. `admin` and
        `moderator` are never deleted (a 422 `builtin`), and a role that users hold is a 422
        `held`: revoke it from them first. A role above every role of the viewer is a 403. An
        unknown role is a 404. Needs the `manage_roles` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      responses:
        '204':
          description: The role is deleted.
        '422':
          $ref: '#/components/responses/RoleProblem'
        default:
          $ref: '#/components/responses/Problem'
  /admin/accounts/{id}/roles:
    get:
      operationId: listAccountRoles
      summary: List the roles of a local account
      description: |
        The roles that the user of a local account holds, highest position first. An unknown
        account, or one that is not local, is a 404. Needs the `manage_roles` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:read
      parameters:
        - $ref: '#/components/parameters/AdminAccountId'
      responses:
        '200':
          $ref: '#/components/responses/AdminRoleList'
        default:
          $ref: '#/components/responses/Problem'
  /admin/accounts/{id}/roles/{role}:
    put:
      operationId: grantAccountRole
      summary: Grant a role to a local account
      description: |
        Grants the role to the user of a local account; its permissions apply from the user's
        next request, and the audit log records `role_granted`. Granting a role that the user
        holds changes nothing and records nothing. A role whose position is above every role
        of the viewer is a 403. An unknown account, one that is not local, or an unknown role
        is a 404. Answers the roles that the user holds afterwards. Needs the `manage_roles`
        permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      parameters:
        - $ref: '#/components/parameters/AdminAccountId'
        - $ref: '#/components/parameters/RoleKey'
      responses:
        '200':
          $ref: '#/components/responses/AdminRoleList'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: revokeAccountRole
      summary: Revoke a role from a local account
      description: |
        Revokes the role from the user of a local account; its permissions stop applying from
        the user's next request, and the audit log records `role_revoked`. Revoking a role
        that the user does not hold changes nothing and records nothing. A role whose
        position is above every role of the viewer is a 403, and revoking `admin` from its
        only holder is a 409. An unknown account, one that is not local, or an unknown role
        is a 404. Answers the roles that the user holds afterwards. Needs the `manage_roles`
        permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      parameters:
        - $ref: '#/components/parameters/AdminAccountId'
        - $ref: '#/components/parameters/RoleKey'
      responses:
        '200':
          $ref: '#/components/responses/AdminRoleList'
        default:
          $ref: '#/components/responses/Problem'
  /admin/appeals:
    get:
      operationId: listAppeals
      summary: List the appeals of moderation actions
      description: |
        The appeals that local users made of the actions on their accounts (FR-707), newest
        first, each with its action. Needs the `manage_accounts` permission.
      tags:
        - admin-moderation
      security:
        - oauth2:
            - admin:read
      parameters:
        - name: state
          in: query
          required: false
          description: Keep only the appeals in this state; omitted keeps every state.
          schema:
            $ref: '#/components/schemas/ModerationAppealState'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of appeals.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAppealPage'
        default:
          $ref: '#/components/responses/Problem'
  /admin/appeals/{id}:
    get:
      operationId: getAppeal
      summary: Get an appeal of a moderation action
      description: An unknown ID is a 404. Needs the `manage_accounts` permission.
      tags:
        - admin-moderation
      security:
        - oauth2:
            - admin:read
      parameters:
        - $ref: '#/components/parameters/AppealId'
      responses:
        '200':
          $ref: '#/components/responses/AdminAppeal'
        default:
          $ref: '#/components/responses/Problem'
  /admin/appeals/{id}/overturn:
    post:
      operationId: overturnAppeal
      summary: Overturn an appeal, lifting its action
      description: |
        Grants the appeal and lifts its action at once, as `POST /admin/account_actions/{id}/lift`
        does: the posts that `delete_statuses` deleted stay deleted. An action lifted meanwhile
        stays as it is. Overturning the appeal of a `ban`, which nothing else lifts, also
        cancels the scheduled deletion of the account; a `ban` whose account is deleted is a
        422 `/api/v1/problems/not-appealable`. The user who appealed gets an `appeal_decided` notification with
        `decision_reason`. Deciding a decided appeal the same way again changes nothing and
        keeps the first reason; deciding it the other way is a 409
        `/api/v1/problems/appeal-decided`. A `public_reason` that is too long or contains
        U+0000 is a 422 naming `public_reason`. An unknown ID is a 404. Needs the
        `manage_accounts` permission.
      tags:
        - admin-moderation
      security:
        - oauth2:
            - admin:write
      parameters:
        - $ref: '#/components/parameters/AppealId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideAppealRequest'
      responses:
        '200':
          $ref: '#/components/responses/AdminAppeal'
        default:
          $ref: '#/components/responses/Problem'
  /admin/appeals/{id}/uphold:
    post:
      operationId: upholdAppeal
      summary: Uphold an appeal, keeping its action
      description: |
        Rejects the appeal; the action stays as it is. The user who appealed gets an `appeal_decided` notification with
        `decision_reason`. Deciding a decided appeal the same way again changes nothing and
        keeps the first reason; deciding it the other way is a 409
        `/api/v1/problems/appeal-decided`. A `public_reason` that is too long or contains
        U+0000 is a 422 naming `public_reason`. An unknown ID is a 404. Needs the
        `manage_accounts` permission.
      tags:
        - admin-moderation
      security:
        - oauth2:
            - admin:write
      parameters:
        - $ref: '#/components/parameters/AppealId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideAppealRequest'
      responses:
        '200':
          $ref: '#/components/responses/AdminAppeal'
        default:
          $ref: '#/components/responses/Problem'
  /admin/registrations:
    get:
      operationId: listPendingRegistrations
      summary: List the registrations that await approval
      description: |
        The sign-ups that wait for a moderator's decision (FR-721), with the reasons their
        applicants gave, longest waiting first. Needs the `manage_accounts` permission.
      tags:
        - admin-moderation
      security:
        - oauth2:
            - admin:read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of pending registrations.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRegistrationPage'
        default:
          $ref: '#/components/responses/Problem'
  /admin/registrations/{user_id}/approve:
    post:
      operationId: approveRegistration
      summary: Approve a registration
      description: |
        Approves a pending registration, so that its user can sign in, with an optional note
        for the moderators; the decision is audited. Deciding a decided registration changes
        nothing and keeps its decision. A user without a registration is a 404. Needs the
        `manage_accounts` permission.
      tags:
        - admin-moderation
      security:
        - oauth2:
            - admin:write
      parameters:
        - $ref: '#/components/parameters/RegistrationUserId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationDecisionRequest'
      responses:
        '200':
          $ref: '#/components/responses/AdminRegistration'
        default:
          $ref: '#/components/responses/Problem'
  /admin/registrations/{user_id}/reject:
    post:
      operationId: rejectRegistration
      summary: Reject a registration
      description: |
        Rejects a pending registration, so that its user cannot sign in, with an optional note
        for the moderators; the decision is audited. Deciding a decided registration changes
        nothing and keeps its decision. A user without a registration is a 404. Needs the
        `manage_accounts` permission.
      tags:
        - admin-moderation
      security:
        - oauth2:
            - admin:write
      parameters:
        - $ref: '#/components/parameters/RegistrationUserId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationDecisionRequest'
      responses:
        '200':
          $ref: '#/components/responses/AdminRegistration'
        default:
          $ref: '#/components/responses/Problem'
  /admin/signup_blocks:
    get:
      operationId: listSignupBlocks
      summary: List the sign-up blocks
      description: |
        The blocks on sign-ups from the registration page (FR-719), newest first, lifted and
        expired ones included unless `active` is set. Needs the `manage_accounts` permission.
      tags:
        - admin-moderation
      security:
        - oauth2:
            - admin:read
      parameters:
        - name: kind
          in: query
          required: false
          description: Keep only the blocks of this kind.
          schema:
            $ref: '#/components/schemas/AdminSignupBlockKind'
        - name: active
          in: query
          required: false
          description: Keep only the blocks in effect now, neither lifted nor expired.
          schema:
            type: boolean
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of sign-up blocks.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSignupBlockPage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createSignupBlock
      summary: Block sign-ups
      description: |
        Records a block on sign-ups from the registration page (FR-719), in effect at once and
        until it expires or is lifted; the block is audited. A sign-up whose email address or
        client address it matches is refused (`reject`) or starts pending for a moderator
        whatever the registration mode (`require_approval`); the page does not tell the
        applicant why. The value is stored in its canonical form: an `email_domain` in IDNA
        A-labels (it covers the subdomains), an `email_hash` as the hash of the canonical
        address (an email address given is hashed and not kept), an `ip_range` as a masked
        CIDR prefix (a single address is a prefix of its full length). A value that is not
        valid for its kind, or a `comment` that is too long or contains U+0000, is a 422.
        Needs the `manage_accounts` permission.
      tags:
        - admin-moderation
      security:
        - oauth2:
            - admin:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSignupBlockRequest'
      responses:
        '200':
          $ref: '#/components/responses/AdminSignupBlock'
        default:
          $ref: '#/components/responses/Problem'
  /admin/signup_blocks/{id}:
    get:
      operationId: getSignupBlock
      summary: Get a sign-up block
      description: An unknown ID is a 404. Needs the `manage_accounts` permission.
      tags:
        - admin-moderation
      security:
        - oauth2:
            - admin:read
      parameters:
        - $ref: '#/components/parameters/SignupBlockId'
      responses:
        '200':
          $ref: '#/components/responses/AdminSignupBlock'
        default:
          $ref: '#/components/responses/Problem'
  /admin/signup_blocks/{id}/lift:
    post:
      operationId: liftSignupBlock
      summary: Lift a sign-up block
      description: |
        The block stops matching sign-ups at once; the lift is audited. Lifting a lifted block
        changes nothing. An unknown ID is a 404. Needs the `manage_accounts` permission.
      tags:
        - admin-moderation
      security:
        - oauth2:
            - admin:write
      parameters:
        - $ref: '#/components/parameters/SignupBlockId'
      responses:
        '200':
          $ref: '#/components/responses/AdminSignupBlock'
        default:
          $ref: '#/components/responses/Problem'
  /admin/signup_blocks/import:
    post:
      operationId: importSignupBlocks
      summary: Block sign-ups from a list
      description: |
        Adds a block on sign-ups (FR-719) for each value of a list, such as a public list of
        disposable email domains, all with the same kind, severity, comment, and duration. The
        list has one value per line in any form that `createSignupBlock` takes, or a CSV row
        whose first field is the value; blank lines and lines starting with `#` are ignored.
        It adds what it can and reports the lines it skipped: a value that is not valid for the
        kind (`invalid`), that repeats an earlier line once in canonical form (`duplicate`), or
        that a block in effect of the same kind and value with a severity at least as strong
        already covers (`already_blocked`). Each block added is audited like one added on its
        own. The blocks are written a few hundred at a time, so an error part way keeps the
        ones before it; sending the list again skips them as `already_blocked`. More than
        10,000 values, an invalid kind or severity, or a `comment` that is too long or contains
        U+0000 is a 422 that adds nothing. Needs the `manage_accounts` permission.
      tags:
        - admin-moderation
      security:
        - oauth2:
            - admin:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportSignupBlocksRequest'
      responses:
        '200':
          description: What the import added and skipped.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupBlockImportResult'
        default:
          $ref: '#/components/responses/Problem'
  /admin/domain_actions/export:
    get:
      operationId: exportDomainBlocks
      summary: Export the domain actions as Mastodon's domain block CSV
      description: |
        The domain actions in effect (FR-706) as the CSV that Mastodon's moderation screens
        import, with the header
        `#domain,#severity,#reject_media,#reject_reports,#public_comment,#obfuscate`: one row
        per domain in domain order. `#severity` is `suspend` when a `suspend` is in effect on
        the domain, `silence` for a `limit`, and `noop` otherwise; `#reject_media`,
        `#reject_reports`, and `#obfuscate` are `true` when one of the domain's actions has
        them. A domain whose only actions are `force_sensitive`, which Mastodon's domain blocks
        cannot hold, is left out. Private notes and expiry dates are not exported. Needs the
        `manage_domains` permission.
      tags:
        - admin-moderation
      security:
        - oauth2:
            - admin:read
      responses:
        '200':
          description: The CSV.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: Names the file to save the CSV as.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Problem'
  /admin/domain_actions/import/preview:
    post:
      operationId: previewDomainBlockImport
      summary: Preview the import of a Mastodon domain block CSV
      description: |
        Reads a domain block CSV that Mastodon exported (FR-706) and says what importing each
        row would do, without changing anything. A file whose first field is `#domain` has a
        header naming the columns; any other file is a list of domains, one per row, each
        suspended. An empty `#severity` is `suspend`, and a boolean is false when empty, `0`,
        `f`, `false`, or `off`. A row of `suspend` issues a `suspend`, `silence` a `limit`, and
        `noop` nothing, plus `reject_media` and `reject_reports` when set. A file that is not
        CSV or has more than 5,000 rows is a 422 naming `csv`. Needs the `manage_domains`
        permission.
      tags:
        - admin-moderation
      security:
        - oauth2:
            - admin:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewDomainBlockImportRequest'
      responses:
        '200':
          description: What importing each row would do, in row order.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainBlockImportPreview'
        default:
          $ref: '#/components/responses/Problem'
  /admin/domain_actions/import:
    post:
      operationId: importDomainBlocks
      summary: Import the chosen rows of a Mastodon domain block CSV
      description: |
        Issues the domain actions of each block (FR-706), as the preview names them: the kinds
        of the block that no action in effect on the domain or a parent domain has already. The
        actions last until they are lifted, carry the block's public comment and obfuscation
        and the request's private note, and are audited like actions issued one at a time. A
        block that would issue nothing is skipped with the reason. The actions are written a
        few dozen at a time, so an error part way keeps the ones before it; sending the blocks
        again skips them as `already_applied`. More than 5,000 blocks or a `private_note` that
        is too long or contains U+0000 is a 422 that issues nothing. Needs the `manage_domains`
        permission.
      tags:
        - admin-moderation
      security:
        - oauth2:
            - admin:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportDomainBlocksRequest'
      responses:
        '200':
          description: What the import issued and skipped.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainBlockImportResult'
        default:
          $ref: '#/components/responses/Problem'
  /admin/settings:
    get:
      operationId: listInstanceSettings
      summary: List the instance settings
      description: |
        Every instance setting (FR-705, docs/operations/instance-settings.md): its current
        value, or its default when it has never been set, with what it accepts. The policies
        that administrators change at run time live here; the deployment configuration does
        not. Needs the `manage_settings` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:read
      responses:
        '200':
          $ref: '#/components/responses/AdminSettingList'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateInstanceSettings
      summary: Change instance settings
      description: |
        Sets the settings named in `values`, all of them or none: each value is checked against
        its key and stored in its canonical form (`TRUE` is `true`, `ja_jp` is `ja-JP`), and
        each change is kept as a revision and audited (`setting_changed`). Setting the current
        value again still records a revision, so clients send only the settings they change.
        The changes take effect on the next request. An unknown key, or a value its key
        rejects, is a 422 naming the key, and nothing is changed. Needs the `manage_settings`
        permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInstanceSettingsRequest'
      responses:
        '200':
          $ref: '#/components/responses/AdminSettingList'
        default:
          $ref: '#/components/responses/Problem'
  /admin/invites:
    get:
      operationId: listInvites
      summary: List the invites
      description: |
        The invites that let people sign up while the registration mode is `invite` (FR-001),
        newest first, with how they have been used. Needs the `manage_invites` permission.
      tags:
        - admin-moderation
      security:
        - oauth2:
            - admin:read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of invites.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminInvitePage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createInvite
      summary: Create an invite
      description: |
        Creates an invite with a new random code. It works only while the registration mode is
        `invite`. `max_uses` outside 1 to 1,000,000 or `expires_in` outside 1 second to 10
        years is a 422 naming it. Needs the `manage_invites` permission.
      tags:
        - admin-moderation
      security:
        - oauth2:
            - admin:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInviteRequest'
      responses:
        '200':
          $ref: '#/components/responses/AdminInvite'
        default:
          $ref: '#/components/responses/Problem'
  /admin/invites/{id}/revoke:
    post:
      operationId: revokeInvite
      summary: Revoke an invite
      description: |
        The invite stops working at once; the people who signed up with it keep their
        accounts. Revoking a revoked invite changes nothing. An unknown ID is a 404. Needs the
        `manage_invites` permission.
      tags:
        - admin-moderation
      security:
        - oauth2:
            - admin:write
      parameters:
        - $ref: '#/components/parameters/InviteId'
      responses:
        '200':
          $ref: '#/components/responses/AdminInvite'
        default:
          $ref: '#/components/responses/Problem'
  /admin/webhooks:
    get:
      operationId: listAdminWebhooks
      summary: List the webhooks
      description: |
        The webhook endpoints of the instance that are not deleted, newest first (ADR-0060).
        Needs the `manage_webhooks` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:read
      responses:
        '200':
          description: The webhooks.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminWebhookList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createWebhook
      summary: Set up a webhook
      description: |
        Sets up an endpoint, enabled, that receives the messages of the `events` it subscribes
        to, signed with Standard Webhooks v1 (`docs/reference/webhooks.md`). The answer carries
        its secret, which is shown only now. The user needs the permission of every event
        besides `manage_webhooks` (`WebhookEventType`). A URL, a description, or events that
        break a rule, or an event whose permission the user lacks, is a 422
        `/api/v1/problems/invalid-webhook` whose `reason` says which. The URL may name any
        destination: whether the server may reach it is decided on every delivery, which a
        refused destination fails. The setup is recorded in the audit log under the
        description and the host name of the URL. Needs the `manage_webhooks` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookRequest'
      responses:
        '200':
          description: The new webhook and its secret.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminWebhookCreated'
        '422':
          $ref: '#/components/responses/WebhookProblem'
        default:
          $ref: '#/components/responses/Problem'
  /admin/webhooks/{id}:
    parameters:
      - $ref: '#/components/parameters/WebhookId'
    get:
      operationId: getAdminWebhook
      summary: Get a webhook
      description: An unknown or deleted ID is a 404. Needs the `manage_webhooks` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:read
      responses:
        '200':
          $ref: '#/components/responses/AdminWebhook'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateWebhook
      summary: Change a webhook
      description: |
        Changes what the request names and keeps the rest; an empty `description` removes it.
        The events need the permissions as for a new webhook, and a refused change is a 422
        `/api/v1/problems/invalid-webhook`. A change is recorded in the audit log. An unknown
        or deleted ID is a 404. Needs the `manage_webhooks` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWebhookRequest'
      responses:
        '200':
          $ref: '#/components/responses/AdminWebhook'
        '422':
          $ref: '#/components/responses/WebhookProblem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteWebhook
      summary: Delete a webhook
      description: |
        Deletes the endpoint for good: it receives nothing more, and its deliveries are no
        longer listed. The deletion is recorded in the audit log. An unknown or deleted ID is a
        404. Needs the `manage_webhooks` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      responses:
        '204':
          description: The webhook is deleted.
        default:
          $ref: '#/components/responses/Problem'
  /admin/webhooks/{id}/enable:
    post:
      operationId: enableWebhook
      summary: Enable a webhook
      description: |
        The endpoint receives the messages of its events again; the messages of the time it was
        disabled are not sent. Enabling an enabled webhook changes nothing. The change is
        recorded in the audit log. An unknown or deleted ID is a 404. Needs the
        `manage_webhooks` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      parameters:
        - $ref: '#/components/parameters/WebhookId'
      responses:
        '200':
          $ref: '#/components/responses/AdminWebhook'
        default:
          $ref: '#/components/responses/Problem'
  /admin/webhooks/{id}/disable:
    post:
      operationId: disableWebhook
      summary: Disable a webhook
      description: |
        The endpoint receives nothing until it is enabled again, also of the deliveries waiting
        to be retried. Disabling a disabled webhook changes nothing. The change is recorded in
        the audit log. An unknown or deleted ID is a 404. Needs the `manage_webhooks`
        permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      parameters:
        - $ref: '#/components/parameters/WebhookId'
      responses:
        '200':
          $ref: '#/components/responses/AdminWebhook'
        default:
          $ref: '#/components/responses/Problem'
  /admin/webhooks/{id}/rotate_secret:
    post:
      operationId: rotateWebhookSecret
      summary: Give a webhook a new secret
      description: |
        Makes a new secret, shown only now, that signs every message from now on. For 24 hours
        the previous secret signs them too (`webhook-signature` carries both), so that the
        receiver can switch without losing a message. The rotation is recorded in the audit
        log. An unknown or deleted ID is a 404. Needs the `manage_webhooks` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      parameters:
        - $ref: '#/components/parameters/WebhookId'
      responses:
        '200':
          description: The new secret.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminWebhookSecret'
        default:
          $ref: '#/components/responses/Problem'
  /admin/webhooks/{id}/test:
    post:
      operationId: testWebhook
      summary: Send a test message to a webhook
      description: |
        Sends a `webhook.test` message to the endpoint, whatever it subscribes to, and returns
        its delivery, which the job queue sends soon. A disabled webhook receives nothing. It is
        not recorded in the audit log. An unknown or deleted ID is a 404. Needs the
        `manage_webhooks` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      parameters:
        - $ref: '#/components/parameters/WebhookId'
      responses:
        '200':
          $ref: '#/components/responses/AdminWebhookDelivery'
        default:
          $ref: '#/components/responses/Problem'
  /admin/webhooks/{id}/deliveries:
    get:
      operationId: listWebhookDeliveries
      summary: List the deliveries of a webhook
      description: |
        The messages sent to the endpoint in the last 14 days, newest first, with their
        attempts. An unknown or deleted ID is a 404. Needs the `manage_webhooks` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:read
      parameters:
        - $ref: '#/components/parameters/WebhookId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of the deliveries.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminWebhookDeliveryPage'
        default:
          $ref: '#/components/responses/Problem'
  /admin/webhooks/{id}/deliveries/{delivery_id}/redeliver:
    post:
      operationId: redeliverWebhookDelivery
      summary: Send a delivery of a webhook again
      description: |
        Sends the message again with the same `webhook-id`, also after it succeeded or used up
        its attempts; the job queue sends it soon. A disabled webhook receives nothing. It is
        not recorded in the audit log. An unknown webhook or delivery is a 404. Needs the
        `manage_webhooks` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      parameters:
        - $ref: '#/components/parameters/WebhookId'
        - name: delivery_id
          in: path
          required: true
          description: The ID of the delivery.
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '200':
          $ref: '#/components/responses/AdminWebhookDelivery'
        default:
          $ref: '#/components/responses/Problem'
  /admin/relays:
    get:
      operationId: listAdminRelays
      summary: List the relays
      description: |
        The relays that the instance joins or joined (ADR-0061), in registration order, with
        the state of the membership and what each brought in during the last 24 hours. Needs the
        `manage_settings` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:read
      responses:
        '200':
          description: The relays.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRelayList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createRelay
      summary: Register a relay and join it
      description: |
        Registers a relay and sends the instance actor's `Follow`; the relay is `pending` until
        it answers. `url` is the relay's inbox for a `mastodon` relay and its actor for a
        `litepub` one, whose inbox the server fetches. Without `protocol`, a URL that serves an
        actor is a `litepub` relay and any other a `mastodon` one. Only public posts go to the
        relay; with `receive`, the public posts it relays come in too. A URL that is not https,
        is registered already, is on a suspended server, or (for `litepub`) serves no actor is a
        422 `/api/v1/problems/invalid-relay` whose `reason` says which. The registration and the
        `Follow` are recorded in the audit log. Needs the `manage_settings` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRelayRequest'
      responses:
        '200':
          $ref: '#/components/responses/AdminRelay'
        '422':
          $ref: '#/components/responses/RelayProblem'
        default:
          $ref: '#/components/responses/Problem'
  /admin/relays/{id}:
    parameters:
      - $ref: '#/components/parameters/RelayId'
    delete:
      operationId: deleteRelay
      summary: Delete a relay
      description: |
        Deletes the registration of a relay that the instance left or that rejected it, with the
        history of its membership. The edits and deletions of the posts that went to it still go
        there. A relay that is `pending` or `accepted` is a 422
        `/api/v1/problems/invalid-relay` (`state`): leave it first. The deletion is recorded in
        the audit log. An unknown ID is a 404. Needs the `manage_settings` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      responses:
        '204':
          description: The relay is deleted.
        '422':
          $ref: '#/components/responses/RelayProblem'
        default:
          $ref: '#/components/responses/Problem'
  /admin/relays/{id}/follow:
    post:
      operationId: followRelay
      summary: Join a relay again
      description: |
        Sends a new `Follow` to a relay that rejected the instance or that the instance left;
        the relay is `pending` again. A relay that is `pending` or `accepted`, or on a suspended
        server, is a 422 `/api/v1/problems/invalid-relay`. The `Follow` is recorded in the audit
        log. An unknown ID is a 404. Needs the `manage_settings` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      parameters:
        - $ref: '#/components/parameters/RelayId'
      responses:
        '200':
          $ref: '#/components/responses/AdminRelay'
        '422':
          $ref: '#/components/responses/RelayProblem'
        default:
          $ref: '#/components/responses/Problem'
  /admin/relays/{id}/unfollow:
    post:
      operationId: unfollowRelay
      summary: Leave a relay
      description: |
        Sends the `Undo` of the `Follow` of a `pending` or `accepted` relay; the relay is `left`,
        and nothing goes to it or comes from it any more. The posts it brought in stay until
        their retention ends. A relay in another state is a 422 `/api/v1/problems/invalid-relay`
        (`state`). The `Undo` is recorded in the audit log. An unknown ID is a 404. Needs the
        `manage_settings` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      parameters:
        - $ref: '#/components/parameters/RelayId'
      responses:
        '200':
          $ref: '#/components/responses/AdminRelay'
        '422':
          $ref: '#/components/responses/RelayProblem'
        default:
          $ref: '#/components/responses/Problem'
  /admin/statuses/{id}/refetch:
    post:
      operationId: refetchStatus
      summary: Refetch a remote post from its origin
      description: |
        Queues a fetch of the remote post from its server (FR-407). The job records what the
        server serves now, as a received `Update` would: a newer revision, the counts of its
        poll, or, when the server answers 410 Gone or serves a `Tombstone`, the post's
        deletion. A post that cannot be fetched is left as it is. An unknown or deleted post is
        a 404; a local post is a 422. Needs the `manage_domains` permission. The request is recorded in the audit log;
        nothing schedules a refetch on its own.
      tags:
        - admin-moderation
      security:
        - oauth2:
            - admin:write
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the remote post.
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '204':
          description: The refetch is queued.
        default:
          $ref: '#/components/responses/Problem'
  /admin/accounts/{id}/refetch_statuses:
    post:
      operationId: refetchAccountStatuses
      summary: Refetch the posts of a remote account from its server
      description: |
        Queues the refetch, as `POST /admin/statuses/{id}/refetch` does, of the newest 1000
        posts of the remote account that are stored and not deleted. The posts are fetched in
        batches of 100, a minute apart. An unknown account is a 404; a local account is a 422.
        Needs the `manage_domains` permission. The request is recorded in the audit log;
        nothing schedules a refetch on its own.
      tags:
        - admin-moderation
      security:
        - oauth2:
            - admin:write
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the remote account.
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '204':
          description: The refetch is queued.
        default:
          $ref: '#/components/responses/Problem'
  /admin/instances/{domain}/refetch_statuses:
    post:
      operationId: refetchInstanceStatuses
      summary: Refetch the posts of the accounts of a remote server
      description: |
        Queues the refetch, as `POST /admin/statuses/{id}/refetch` does, of the stored posts of
        the server's accounts that are not deleted: the newest 20 of each account, newest
        accounts first, 1000 in all, in batches of 5 accounts a minute apart. A domain that is
        not a host name is a 400; this server's domain is a 422. Needs the `manage_domains` permission. The request is recorded in the audit log;
        nothing schedules a refetch on its own.
      tags:
        - admin-moderation
      security:
        - oauth2:
            - admin:write
      parameters:
        - $ref: '#/components/parameters/InstanceDomain'
      responses:
        '204':
          description: The refetch is queued.
        default:
          $ref: '#/components/responses/Problem'
  /admin/payment_status:
    get:
      operationId: getPaymentStatus
      summary: Get the state of the payment provider
      description: |
        The payment provider of the deployment's configuration (ADR-0074 §4): its name and mode
        (test or live), when it last delivered a webhook, and the last attempt of the
        reconciliation with its failure. `warnings` names the signs of a webhook that is not set
        up right: no delivery is recorded, or the last reconciliation corrected subscriptions
        that the webhooks had not. A deployment without a payment provider is a 404. Needs the
        `manage_supporters` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:read
      responses:
        '200':
          description: The state of the payment provider.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStatus'
        default:
          $ref: '#/components/responses/Problem'
  /admin/payment_reconciles:
    post:
      operationId: runPaymentReconcile
      summary: Reconcile with the payment provider now
      description: |
        Queues a reconciliation with the payment provider now, besides the periodic one
        (ADR-0074 §4). Its requests count toward `payments_reconcile_max_requests` like the
        others. One per UTC hour: another request in the hour after its reconciliation ran is a
        429. A deployment without a payment provider is a 404. The request is recorded in the
        audit log. Needs the `manage_supporters` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      responses:
        '204':
          description: The reconciliation is queued.
        default:
          $ref: '#/components/responses/Problem'
  /admin/supporter_program:
    get:
      operationId: getSupporterProgram
      summary: Get the supporter program
      description: Whether the supporter program is enabled, and what it needs. Needs the `manage_supporters` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:read
      responses:
        '200':
          $ref: '#/components/responses/AdminSupporterProgram'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: setSupporterProgram
      summary: Enable or disable the supporter program
      description: |
        Enables or disables the supporter program (ADR-0072 §2). Enabling it without a payment
        provider in the deployment's configuration or without email is a 409
        `/api/v1/problems/supporters-unavailable`; disabling it while subscriptions go on is a
        409 `/api/v1/problems/live-subscriptions` (retire the plans first). Asking for the state
        it is in changes nothing. Recorded in the audit log. Needs the `manage_supporters`
        permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSupporterProgramRequest'
      responses:
        '200':
          $ref: '#/components/responses/AdminSupporterProgram'
        default:
          $ref: '#/components/responses/Problem'
  /admin/supporter_plans:
    get:
      operationId: listAdminSupporterPlans
      summary: List the supporter plans
      description: Every supporter plan, retired ones too, by rank. Needs the `manage_supporters` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:read
      responses:
        '200':
          description: The plans.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSupporterPlanList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createSupporterPlan
      summary: Create a supporter plan
      description: |
        Creates a supporter plan on a role, which then only the plan's subscriptions grant
        (ADR-0072 §3, §5). The prices are made at the payment provider after the answer; the
        plan takes subscriptions once `prices_ready`. A plan that breaks a rule is a 422
        `/api/v1/problems/invalid-supporter-plan`, an unknown role a 404, and a server without a
        payment provider a 409 `/api/v1/problems/supporters-unavailable`. Recorded in the audit
        log. Needs the `manage_supporters` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSupporterPlanCreateRequest'
      responses:
        '200':
          $ref: '#/components/responses/AdminSupporterPlan'
        '422':
          $ref: '#/components/responses/SupporterPlanProblem'
        default:
          $ref: '#/components/responses/Problem'
  /admin/supporter_plans/{id}:
    patch:
      operationId: updateSupporterPlan
      summary: Change a supporter plan
      description: |
        Changes a supporter plan's terms and its role's permissions and position (ADR-0072 §3,
        §5, §9). New prices apply to new subscriptions and changes of plan only. A change that
        breaks a rule is a 422 `/api/v1/problems/invalid-supporter-plan`, a retired plan a 409
        `/api/v1/problems/supporter-plan-retired`, and an unknown plan a 404. Recorded in the
        audit log. Needs the `manage_supporters` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      parameters:
        - $ref: '#/components/parameters/SupporterPlanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSupporterPlanUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/AdminSupporterPlan'
        '422':
          $ref: '#/components/responses/SupporterPlanProblem'
        default:
          $ref: '#/components/responses/Problem'
  /admin/supporter_plans/{id}/retire:
    post:
      operationId: retireSupporterPlan
      summary: Retire a supporter plan
      description: |
        Retires a supporter plan for good (ADR-0072 §9): it takes no subscriptions any more, and
        every subscription of it ends at the end of its period (a pending one at once). A
        retired plan is a 409 `/api/v1/problems/supporter-plan-retired`, and an unknown one a
        404. Recorded in the audit log. Needs the `manage_supporters` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      parameters:
        - $ref: '#/components/parameters/SupporterPlanId'
      responses:
        '204':
          description: The plan is retired.
        default:
          $ref: '#/components/responses/Problem'
  /admin/supporter_subscriptions:
    get:
      operationId: listSupporterSubscriptions
      summary: List the subscriptions
      description: |
        The subscriptions to the supporter plans, newest first, narrowed to a plan and a state.
        Needs the `manage_supporters` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:read
      parameters:
        - name: plan_id
          in: query
          description: Only the subscriptions of this plan.
          schema:
            $ref: '#/components/schemas/Id'
        - name: state
          in: query
          description: Only the subscriptions in this state.
          schema:
            $ref: '#/components/schemas/SupporterSubscriptionState'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of subscriptions.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSupporterSubscriptionPage'
        default:
          $ref: '#/components/responses/Problem'
  /admin/supporter_subscriptions/{id}/cancel:
    post:
      operationId: cancelSupporterSubscription
      summary: Cancel a subscription at once
      description: |
        Ends a subscription at once, without a refund (ADR-0072 §10): the role goes now, and the
        payment provider stops billing. A refund is the operator's to make at the provider. A
        subscription that has ended is a 409 `/api/v1/problems/subscription-ended`, and an
        unknown one a 404. Recorded in the audit log. Needs the `manage_supporters` permission.
      tags:
        - admin-server
      security:
        - oauth2:
            - admin:write
      parameters:
        - $ref: '#/components/parameters/SupporterSubscriptionId'
      responses:
        '204':
          description: The subscription has ended.
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: |
        An OAuth 2.0 access token (Authorization Code + PKCE S256), sent as
        `Authorization: Bearer <token>`. `read`, `write`, `follow`, and `admin` grant every scope
        under them (`read` grants `read:accounts`; `follow` grants `read:follows`, `read:blocks`,
        `read:mutes`, `write:follows`, `write:blocks`, and `write:mutes`; `admin` grants
        `admin:read` and `admin:write`). `read` and `write` do not grant the admin scopes.

        `read:statuses` does not show posts whose visibility is `direct`, in timelines, in a post's
        thread, or in a post's own response, nor in the posts of a notification; `read:direct` (which
        `read` grants) does. Sending a `direct` post needs only `write:statuses`.

        Only the server's own (first-party) clients may hold `admin`, `admin:read`, `admin:write`,
        and `write:supporters`: an authorization request of any other client that asks for one is
        refused with `invalid_scope`, and a broad scope such as `write` does not give such a client
        `write:supporters`. The operations that change how the user signs in or ends the account
        (password, two-factor authentication, passkeys, authorized apps, deleting the account, the user's own
        OAuth apps) are marked
        `x-first-party-only: true`; whatever its scopes, the token of another client gets a 403
        `/api/v1/problems/first-party-only` from them.
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          tokenUrl: /oauth/token
          refreshUrl: /oauth/token
          scopes:
            admin: Administer the instance, as far as the user's roles allow (first-party clients only).
            admin:read: Read the instance's administration data, as far as the user's roles allow (first-party clients only).
            admin:write: Change the instance's administration data, as far as the user's roles allow (first-party clients only).
            read: Read everything the user can read.
            write: Change everything the user can change.
            follow: Read and change follows, blocks, and mutes.
            push: Receive Web Push notifications.
            read:accounts: Read accounts, including the user's own.
            read:blocks: Read the accounts the user blocks.
            read:bookmarks: Read the user's bookmarks.
            read:favourites: Read the user's favourites.
            read:custom_emojis: Read the custom emoji the user made and their requests for new ones.
            read:direct: Read the direct posts the user sends and receives (`read:statuses` does not show them).
            read:finance: Read the totals of the instance's costs, as far as the user's roles allow.
            read:follows: Read follows and follow requests.
            read:mutes: Read the accounts and domains the user mutes.
            read:notifications: Read the user's notifications.
            read:reports: Read the reports the user filed and whether they are resolved.
            read:statuses: Read posts and timelines.
            read:supporters: Read the user's own supporter subscription.
            write:accounts: Change the user's profile and preferences.
            write:blocks: Block and unblock accounts.
            write:bookmarks: Bookmark posts and remove bookmarks.
            write:custom_emojis: Request new custom emoji, and change and delete the ones the user made.
            write:favourites: Favourite posts and react to them with emoji, and take both back.
            write:follows: Follow and unfollow accounts and answer follow requests.
            write:media: Upload media and change their descriptions.
            write:mutes: Mute and unmute accounts and domains.
            write:notifications: Mark notifications read and dismiss them.
            write:reports: Report accounts and posts to the moderators.
            write:statuses: Post, edit, delete, boost, and pin posts.
            write:supporters: Subscribe to the supporter plans, and change, cancel, and resume the subscription (first-party clients only).
  headers:
    CacheControl:
      description: The caching policy. Anonymous public GETs are cacheable by shared caches (ADR-0016).
      schema:
        type: string
    XRobotsTag:
      description: The statement to search engines (ADR-0057) of a response that states more than the default `noindex`.
      schema:
        type: string
  parameters:
    AccountActionId:
      name: id
      in: path
      required: true
      description: The ID of the account action.
      schema:
        $ref: '#/components/schemas/Id'
    AccountId:
      name: id
      in: path
      required: true
      description: The account ID.
      schema:
        $ref: '#/components/schemas/Id'
    AdminAccountId:
      name: id
      in: path
      required: true
      description: The ID of the account, local or remote.
      schema:
        $ref: '#/components/schemas/Id'
    AnnouncementId:
      name: id
      in: path
      required: true
      description: The ID of the announcement.
      schema:
        $ref: '#/components/schemas/Id'
    AppealId:
      name: id
      in: path
      required: true
      description: The ID of the appeal.
      schema:
        $ref: '#/components/schemas/Id'
    BadgeRoleId:
      name: role_id
      in: path
      required: true
      description: The ID of the role whose badge it is.
      schema:
        $ref: '#/components/schemas/Id'
    CostItemId:
      name: id
      in: path
      required: true
      description: The ID of the cost item.
      schema:
        $ref: '#/components/schemas/Id'
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page; omitted for the first page.
      required: false
      schema:
        $ref: '#/components/schemas/Cursor'
    CustomEmojiId:
      name: id
      in: path
      required: true
      description: The ID of the custom emoji.
      schema:
        $ref: '#/components/schemas/Id'
    CustomEmojiRequestId:
      name: id
      in: path
      required: true
      description: The ID of the custom emoji request.
      schema:
        $ref: '#/components/schemas/Id'
    DomainActionId:
      name: id
      in: path
      required: true
      description: The ID of the domain action.
      schema:
        $ref: '#/components/schemas/Id'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        A key the client chooses per new status; a retry with the same key returns the status
        posted with it instead of posting again. A key longer than 256 characters, or one
        that is not UTF-8 without U+0000, is a 422.
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 256
    InstanceDocumentKind:
      name: kind
      in: path
      required: true
      description: The kind of the document.
      schema:
        $ref: '#/components/schemas/InstanceDocumentKind'
    InstanceDomain:
      name: domain
      in: path
      required: true
      description: The domain of the remote server, such as `mastodon.example`.
      schema:
        type: string
        minLength: 1
        maxLength: 253
    InstanceTextKey:
      name: key
      in: path
      required: true
      description: The key of the text.
      schema:
        $ref: '#/components/schemas/InstanceTextKey'
    InviteId:
      name: id
      in: path
      required: true
      description: The ID of the invite.
      schema:
        $ref: '#/components/schemas/Id'
    Limit:
      name: limit
      in: query
      description: The maximum number of items in the page.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 40
        default: 20
    OAuthAppId:
      name: id
      in: path
      required: true
      description: The ID of the OAuth app (not its `client_id`).
      schema:
        $ref: '#/components/schemas/Id'
    RegistrationUserId:
      name: user_id
      in: path
      required: true
      description: The ID of the user who signed up.
      schema:
        $ref: '#/components/schemas/Id'
    RelayId:
      name: id
      in: path
      required: true
      description: The ID of the relay.
      schema:
        $ref: '#/components/schemas/Id'
    ReportId:
      name: id
      in: path
      required: true
      description: The ID of the report.
      schema:
        $ref: '#/components/schemas/Id'
    RoleKey:
      name: role
      in: path
      required: true
      description: The key of the role, such as `moderator`.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    RuleId:
      name: id
      in: path
      required: true
      description: The ID of the rule.
      schema:
        $ref: '#/components/schemas/Id'
    SearchLimit:
      name: limit
      in: query
      description: The maximum number of results of a prefix search for the autocomplete (ADR-0092).
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 20
        default: 8
    SignupBlockId:
      name: id
      in: path
      required: true
      description: The ID of the sign-up block.
      schema:
        $ref: '#/components/schemas/Id'
    StatusId:
      name: id
      in: path
      description: The ID of the status.
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    SupporterPlanId:
      name: id
      in: path
      required: true
      description: The ID of the supporter plan.
      schema:
        $ref: '#/components/schemas/Id'
    SupporterSubscriptionId:
      name: id
      in: path
      required: true
      description: The ID of the subscription.
      schema:
        $ref: '#/components/schemas/Id'
    WebhookId:
      name: id
      in: path
      required: true
      description: The ID of the webhook.
      schema:
        $ref: '#/components/schemas/Id'
  responses:
    AccountPage:
      description: A page of accounts.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:

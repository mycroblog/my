  schemas:
    AIUsage:
      description: |
        What the instance states to AI crawlers (the instance setting `ai_usage`, FR-725, ADR-0057).
        `allow`: no reservation; `deny_training`: no training of AI models; `deny`: no training
        and no use by AI search, assistants, and agents. An account can opt out of what the
        instance allows (`ai_opt_out`), never the reverse.
      type: string
      enum:
        - allow
        - deny_training
        - deny
    Account:
      description: An account, as clients show it (FR-006).
      type: object
      required:
        - id
        - username
        - acct
        - domain
        - uri
        - display_name
        - note
        - fields
        - emojis
        - badges
        - url
        - locked
        - bot
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        username:
          description: The username, without the domain.
          type: string
        acct:
          description: The username for local accounts, `username@domain` for remote ones.
          type: string
        domain:
          description: |
            The domain of the account: the domain of its handle, which for local accounts is the
            instance's account domain, or the host of its `uri` when a remote account has no
            confirmed handle.
          type: string
        uri:
          description: The ActivityPub id of the account's actor, on the server it belongs to.
          type: string
          format: uri
        display_name:
          description: The display name; empty when the account has none.
          type: string
        note:
          description: The profile text as sanitized HTML; empty when there is none.
          type: string
        url:
          description: |
            The account's profile page: on this instance for a local account, and for a remote
            one the page its actor declares (`url`), or its `uri` when it declares none.
          type: string
          format: uri
        locked:
          description: Whether follow requests need the account's approval.
          type: boolean
        bot:
          description: Whether the account is automated.
          type: boolean
        created_at:
          description: When the account was created.
          type: string
          format: date-time
        fields:
          description: The profile's metadata fields, in their order; empty when there are none.
          type: array
          items:
            $ref: '#/components/schemas/ProfileField'
        emojis:
          description: |
            The custom emoji of the display name, the note, and the fields' names and values
            (ADR-0051). Clients show each `:shortcode:` of those texts that is in this list as its
            image, and the rest as text.
          type: array
          items:
            $ref: '#/components/schemas/CustomEmoji'
        badges:
          description: |
            The role badges that the account shows on its profile, highest role first (ADR-0071).
            Filled on the account's own endpoints (`getAccount`, `lookupAccount`,
            `verifyAccountCredentials`) only, and empty where accounts are listed or embedded (posts,
            notifications, lists of accounts) and for remote accounts. Badges are never federated.
          type: array
          items:
            $ref: '#/components/schemas/AccountBadge'
        avatar:
          description: |
            The avatar image, square; omitted when the account has none, or its image is not
            processed yet or could not be processed. Clients show a placeholder instead. For a
            remote account, every size is its media proxy URL.
          $ref: '#/components/schemas/MediaVariants'
        header:
          description: The header image; omitted when there is none, as `avatar` is.
          $ref: '#/components/schemas/MediaVariants'
        followers_count:
          description: |
            The number of accounts that actively follow the account, as far as the instance
            knows. Present on the account's own endpoints (`getAccount`, `lookupAccount`,
            `verifyAccountCredentials`) and left out where accounts are listed or embedded.
          type: integer
          minimum: 0
        following_count:
          description: The number of accounts that the account actively follows; present where `followers_count` is.
          type: integer
          minimum: 0
    AccountBadge:
      description: |
        A badge that the account shows on its profile (ADR-0071): the badge of a role that the
        account's user holds and chose to show. Clients show `label` as user content (`dir="auto"`),
        never translated.
      type: object
      required:
        - role_id
        - label
        - color
      properties:
        role_id:
          $ref: '#/components/schemas/Id'
        label:
          description: The name on the badge.
          type: string
        color:
          $ref: '#/components/schemas/BadgeColor'
    AccountFieldSource:
      description: A metadata field of a profile as the user typed it.
      type: object
      required:
        - name
        - value
      properties:
        name:
          description: The label, at most 255 characters.
          type: string
        value:
          description: The value as plain text, at most 255 characters.
          type: string
    AccountPage:
      description: A page of accounts.
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required:
            - accounts
          properties:
            accounts:
              type: array
              items:
                $ref: '#/components/schemas/Account'
    AccountSource:
      description: The profile as the user typed it, for editing.
      type: object
      required:
        - note
        - fields
      properties:
        note:
          description: The profile text as plain text; empty when there is none.
          type: string
        fields:
          description: The metadata fields as typed, in the order of the account's `fields`.
          type: array
          items:
            $ref: '#/components/schemas/AccountFieldSource'
        avatar_media_id:
          description: The media file of the avatar; omitted when there is none.
          type: string
        header_media_id:
          description: The media file of the header image; omitted when there is none.
          type: string
    AccountStatusPage:
      description: A page of the statuses of an account.
      allOf:
        - $ref: '#/components/schemas/StatusPage'
        - type: object
          properties:
            remote_fetch_started:
              description: |
                `true` when this request started fetching the remote account's recent public
                posts from its server (ADR-0044). The fetch runs in the background; read the
                first page again a few seconds later to see what it stored. Absent otherwise,
                including when a fetch started in the last day.
              type: boolean
    AdminAccount:
      description: |
        An account as the moderators see it (FR-714). It never includes an email or IP address.
      type: object
      required:
        - id
        - account
        - local
        - state
        - restrictions
      properties:
        id:
          $ref: '#/components/schemas/Id'
        account:
          $ref: '#/components/schemas/Account'
        local:
          description: Whether the account is on this server.
          type: boolean
        state:
          $ref: '#/components/schemas/AdminAccountState'
        restrictions:
          description: |
            What the account's own actions take away now (data-model §5.2), in a fixed order.
            The domain actions on its domain are listed apart.
          type: array
          items:
            $ref: '#/components/schemas/AdminAccountRestriction'
        registration_state:
          $ref: '#/components/schemas/AdminAccountRegistrationState'
    AdminAccountAction:
      description: A moderation action on an account (FR-703).
      type: object
      required:
        - id
        - account_id
        - kind
        - reason_category
        - issuer
        - notify_target
        - state
        - issued_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        account_id:
          description: The account the action is on.
          allOf:
            - $ref: '#/components/schemas/Id'
        kind:
          $ref: '#/components/schemas/AdminAccountActionKind'
        reason_category:
          $ref: '#/components/schemas/AdminAccountActionCategory'
        public_reason:
          description: The reason shown to the account; omitted when there is none.
          type: string
        private_note:
          description: The moderators' note; omitted when there is none.
          type: string
        report_id:
          description: The report the action follows from; omitted when there is none.
          allOf:
            - $ref: '#/components/schemas/Id'
        issuer:
          description: |
            `moderator`: a moderator or the CLI. `system`: this server by itself. `remote`: the
            account's own server.
          type: string
          enum:
            - moderator
            - system
            - remote
        issued_by_account_id:
          description: |
            The account of the moderator who took the action; omitted for the CLI and the
            system.
          allOf:
            - $ref: '#/components/schemas/Id'
        notify_target:
          description: Whether the account is told of the action.
          type: boolean
        state:
          $ref: '#/components/schemas/AdminAccountActionState'
        issued_at:
          type: string
          format: date-time
        expires_at:
          description: When the action ends by itself; omitted for one that lasts until lifted.
          type: string
          format: date-time
        lifted_at:
          description: When the action was lifted; omitted until it is.
          type: string
          format: date-time
        lift_reason:
          description: Why the action was lifted; omitted until it is or when no reason was given.
          type: string
        status_ids:
          description: |
            The posts of the account that `delete_statuses` or `mark_statuses_sensitive` acts
            on, in ID order; omitted for the other kinds.
          type: array
          items:
            $ref: '#/components/schemas/Id'
    AdminAccountActionCategory:
      description: The kind of reason for an action.
      type: string
      enum:
        - spam
        - legal
        - violation
        - other
    AdminAccountActionKind:
      description: |
        `warn`: a notice only. `mark_statuses_sensitive` and `delete_statuses`: actions on
        posts. `force_sensitive`: every attachment is shown as sensitive. `limit`: every post is
        followers-only and stays off the public timelines. `restrict_posting`: no posting.
        `restrict_interaction`: no following, favouriting, boosting, or replying.
        `disable_login`: no logging in. `suspend`: all of these, and the profile and posts are
        hidden. `ban`: a suspension that never ends, with the deletion of the account.
      type: string
      enum:
        - warn
        - mark_statuses_sensitive
        - delete_statuses
        - force_sensitive
        - limit
        - restrict_posting
        - restrict_interaction
        - disable_login
        - suspend
        - ban
    AdminAccountActionPage:
      description: A page of account actions, newest first.
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminAccountAction'
    AdminAccountActionState:
      description: |
        `active`: in effect now. `expired`: it ended at `expires_at`. `lifted`: a moderator
        lifted it.
      type: string
      enum:
        - active
        - expired
        - lifted
    AdminAccountDetail:
      description: The details of an account (FR-714).
      allOf:
        - $ref: '#/components/schemas/AdminAccount'
        - type: object
          required:
            - roles
            - actions
            - reports
          properties:
            registration:
              $ref: '#/components/schemas/AdminAccountRegistration'
            email_verified:
              description: |
                Whether the primary email address of a local account is verified; omitted when
                it has none.
              type: boolean
            two_factor_enabled:
              description: |
                Whether the user of a local account signs in with two-factor authentication;
                omitted for a remote account.
              type: boolean
            roles:
              description: The keys of the user's roles, highest position first; empty for a remote account.
              type: array
              items:
                type: string
            actions:
              description: The newest 20 actions on the account, newest first.
              type: array
              items:
                $ref: '#/components/schemas/AdminAccountAction'
            reports:
              description: The newest 20 reports of the account, newest first.
              type: array
              items:
                $ref: '#/components/schemas/AdminReport'
    AdminAccountPage:
      description: A page of accounts, newest first.
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminAccount'
    AdminAccountPrivateData:
      description: |
        The email address and the IP addresses of a local account (FR-714). Showing them is
        recorded in the audit log.
      type: object
      required:
        - sign_ins
        - same_ip_accounts
      properties:
        email:
          description: The primary email address; omitted when there is none.
          type: string
        email_verified:
          description: Whether the primary email address is verified; omitted with `email`.
          type: boolean
        registration_ip:
          description: |
            The IP address the account registered from; omitted for a registration from an
            unknown address, by the command line, or past the retention.
          type: string
        registered_at:
          description: When the account registered from `registration_ip`; omitted with it.
          type: string
          format: date-time
        sign_ins:
          description: The newest 20 sign-ins within the retention, newest first.
          type: array
          items:
            $ref: '#/components/schemas/AdminAccountSignIn'
        same_ip_accounts:
          description: |
            For each IP address of `sign_ins` and `registration_ip`, newest first, up to 20
            other accounts that registered or signed in from it, newest first.
          type: array
          items:
            $ref: '#/components/schemas/AdminSameIpAccounts'
    AdminAccountRegistration:
      description: The registration application of a local account.
      type: object
      required:
        - submitted_at
        - state_changed_at
      properties:
        submitted_at:
          type: string
          format: date-time
        reason:
          description: Why the applicant wants to join; omitted when not asked or not given.
          type: string
        invite_id:
          $ref: '#/components/schemas/Id'
        state_changed_at:
          description: When the registration entered its `registration_state`.
          type: string
          format: date-time
    AdminAccountRegistrationState:
      description: |
        Where the registration of a local account stands; a user made with the command line is
        `approved`. Omitted for a remote account.
      type: string
      enum:
        - pending
        - approved
        - rejected
    AdminAccountRestriction:
      description: |
        A capability that an action takes away (data-model §5.2). `login`: logging in and the
        API. `post`: posting, replying, boosting, editing. `interact`: following, favouriting,
        boosting, voting. `visibility_ceiling_private`: posts are followers-only.
        `public_discovery`: posts stay off the public timelines and search.
        `unsolicited_reach`: notifications reach followers only. `media_sensitive`: media shows
        as sensitive. `profile_view`: the profile and posts are hidden. `federation`: nothing is
        delivered or received.
      type: string
      enum:
        - login
        - post
        - interact
        - visibility_ceiling_private
        - public_discovery
        - unsolicited_reach
        - media_sensitive
        - profile_view
        - federation
    AdminAccountSignIn:
      description: Where one sign-in came from.
      type: object
      required:
        - signed_in_at
      properties:
        ip:
          description: The IP address; omitted when unknown.
          type: string
        user_agent:
          description: The User-Agent; omitted when unknown.
          type: string
        signed_in_at:
          type: string
          format: date-time
    AdminAccountState:
      description: |
        The state of an account, the first that applies: `deleted` (deleted here or on its
        server), `suspended` (a `suspend` or `ban`), `disabled` (a `disable_login`), `rejected`
        and `pending` (the registration of a local account), `limited` (a `limit`), and
        `active`.
      type: string
      enum:
        - active
        - pending
        - rejected
        - limited
        - disabled
        - suspended
        - deleted
    AdminAnnouncement:
      description: An announcement with its Markdown text and its state.
      type: object
      required:
        - id
        - text
        - content
        - state
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        text:
          description: The text, in Markdown.
          type: string
        content:
          description: The text as the users get it, an HTML fragment (`Announcement.content`).
          type: string
        state:
          $ref: '#/components/schemas/AdminAnnouncementState'
        starts_at:
          description: When it starts to show once published; omitted to show it from its publication.
          type: string
          format: date-time
        ends_at:
          description: When it stops showing; omitted to show it until it is withdrawn.
          type: string
          format: date-time
        published_at:
          description: When it was last published; omitted for a draft.
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          description: When its text or window last changed.
          type: string
          format: date-time
    AdminAnnouncementCreateRequest:
      description: A new announcement, with its text and its window.
      type: object
      required:
        - text
      properties:
        text:
          description: The text, in Markdown.
          type: string
          minLength: 1
          maxLength: 5000
        starts_at:
          description: When it starts to show once published; omitted to show it from its publication.
          type: string
          format: date-time
        ends_at:
          description: When it stops showing, after `starts_at`; omitted to show it until it is withdrawn.
          type: string
          format: date-time
        publish:
          description: Publish it at once instead of keeping it a draft.
          type: boolean
          default: false
    AdminAnnouncementInput:
      description: The text and the window of an announcement.
      type: object
      required:
        - text
      properties:
        text:
          description: The text, in Markdown.
          type: string
          minLength: 1
          maxLength: 5000
        starts_at:
          description: When it starts to show once published; omitted to show it from its publication.
          type: string
          format: date-time
        ends_at:
          description: When it stops showing, after `starts_at`; omitted to show it until it is withdrawn.
          type: string
          format: date-time
    AdminAnnouncementList:
      description: The announcements, newest first.
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminAnnouncement'
    AdminAnnouncementState:
      description: |
        `draft`: no user sees it. `published`: every local user sees it within its window.
        `withdrawn`: taken down for good.
      type: string
      enum:
        - draft
        - published
        - withdrawn
    AdminAppeal:
      description: |
        A local user's appeal of an action on their account, as the moderators see it, with the
        action.
      type: object
      required:
        - id
        - account_id
        - text
        - state
        - submitted_at
        - action
      properties:
        id:
          $ref: '#/components/schemas/Id'
        account_id:
          description: The account that appealed, which the action is on.
          allOf:
            - $ref: '#/components/schemas/Id'
        text:
          description: What the user wrote, as plain text.
          type: string
        state:
          $ref: '#/components/schemas/ModerationAppealState'
        submitted_at:
          type: string
          format: date-time
        action:
          $ref: '#/components/schemas/AdminAccountAction'
        decided_at:
          description: When a moderator decided the appeal; omitted while pending.
          type: string
          format: date-time
        decision_reason:
          description: The moderators' explanation of the decision to the user; omitted when there is none.
          type: string
        decided_by_account_id:
          description: |
            The account of the moderator who decided; omitted while pending and for a decision
            from the command line.
          allOf:
            - $ref: '#/components/schemas/Id'
    AdminAppealPage:
      description: A page of appeals, newest first.
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminAppeal'
    AdminAuditAction:
      description: |
        The kind of an audited operation, each on one kind of target. On an `account`:
        `account_action_issued`, `account_action_lifted`, `account_deletion_cancelled`,
        `revealed_private_data` (a moderator was shown the account's email address and IP
        addresses), `two_factor_disabled` (an administrator removed the account's two-factor
        authentication), `password_reset_link_issued` (an administrator issued a link that sets
        a new password for the account's user). On a `domain`:
        `domain_action_issued`, `domain_action_lifted`. On a `report`: `report_assigned`,
        `report_unassigned`, `report_resolved`, `report_reopened`, `report_note_added`. On a
        `user` (a registration):
        `registration_approved`, `registration_rejected`. On a `setting`: `setting_changed`
        (an instance setting), `text_changed` (an instance text). On a `rule`:
        `rule_added`, `rule_revised`, `rule_moved`, `rule_retired`. On a `role`: `role_granted`,
        `role_revoked` (a role of a user; the label is the key and the handle), `role_created`,
        `role_updated` (its position or permissions), `role_deleted` (the label is the key). On
        an `appeal`:
        `appeal_upheld`, `appeal_overturned` (which also records the action's
        `account_action_lifted`, and for a `ban` the `account_deletion_cancelled` on the
        `account`). On a `signup_block`: `signup_block_added`, `signup_block_lifted`. On a
        `custom_emoji`: `custom_emoji_created`, `custom_emoji_image_replaced`,
        `custom_emoji_copied` (a new local emoji copied from a remote one),
        `custom_emoji_updated` (its category, aliases, or place in the picker),
        `custom_emoji_enabled`, `custom_emoji_disabled`, `custom_emoji_deleted`. On a `webhook`:
        `webhook_created`, `webhook_updated` (its URL, description, or events),
        `webhook_deleted`, `webhook_enabled`, `webhook_disabled` (by the `system` when the
        endpoint answered 410 Gone or kept failing), `webhook_secret_rotated`; the label is its
        description and the host name of its URL, never the URL. On an `announcement`:
        `announcement_created`, `announcement_updated` (its text or window),
        `announcement_published`, `announcement_withdrawn`; the label is the first line of its
        text. On an `invite`: `invite_created`, `invite_revoked`; the label is the first
        characters of its code, never the whole code. On a `relay`: `relay_added`,
        `relay_followed`, `relay_unfollowed`, `relay_removed`, and `relay_accepted`,
        `relay_rejected` (by the `remote` relay); the label is its URL. The refetch of remote
        posts from their servers: `status_refetch_queued` on a `status` (the label is its URI),
        `account_statuses_refetch_queued` on an `account`, and `domain_statuses_refetch_queued`
        on a `domain`. On a `billing_source`: `billing_import_queued`, an import started by hand;
        the ID is the source (`aws`, `gcp`) and the label the provider's name. On a `cost_item`:
        `cost_item_created`, `cost_item_relabeled` (its name, provider, category, or memo),
        `cost_item_price_revised`, `cost_item_end_changed`, and `cost_item_canceled`; the label is
        the item's name. On the `supporter_program`: `supporter_program_enabled`,
        `supporter_program_disabled`; the label is the payment provider's name. On a
        `supporter_plan`: `supporter_plan_created`, `supporter_plan_revised`, and
        `supporter_plan_retired`; the label is the plan's name. On a `supporter_subscription`:
        `supporter_subscription_canceled`, an administrator's cancellation without a refund; the
        label is the plan's name and the subscriber's handle. On a `custom_emoji_request`:
        `custom_emoji_request_submitted` and `custom_emoji_request_withdrawn` by the requester, and
        `custom_emoji_request_approved` (which also records the emoji's `custom_emoji_created` or
        `custom_emoji_image_replaced`) and `custom_emoji_request_rejected`; the label is the
        `:shortcode:` of the request. On a `payment_provider`: `payment_reconcile_queued`, a
        reconciliation with the payment provider started by hand; the ID and the label are the
        provider's name (`stripe`).
      type: string
      enum:
        - account_action_issued
        - account_action_lifted
        - domain_action_issued
        - domain_action_lifted
        - report_assigned
        - report_unassigned
        - report_resolved
        - report_reopened
        - report_note_added
        - registration_approved
        - registration_rejected
        - setting_changed
        - text_changed
        - rule_added
        - rule_revised
        - rule_moved
        - rule_retired
        - role_granted
        - role_revoked
        - role_created
        - role_updated
        - role_deleted
        - appeal_upheld
        - appeal_overturned
        - account_deletion_cancelled
        - revealed_private_data
        - signup_block_added
        - signup_block_lifted
        - two_factor_disabled
        - password_reset_link_issued
        - custom_emoji_created
        - custom_emoji_image_replaced
        - custom_emoji_copied
        - custom_emoji_updated
        - custom_emoji_enabled
        - custom_emoji_disabled
        - custom_emoji_deleted
        - webhook_created
        - webhook_updated
        - webhook_deleted
        - webhook_enabled
        - webhook_disabled
        - webhook_secret_rotated
        - announcement_created
        - announcement_updated
        - announcement_published
        - announcement_withdrawn
        - invite_created
        - invite_revoked
        - relay_added
        - relay_followed
        - relay_unfollowed
        - relay_removed
        - relay_accepted
        - relay_rejected
        - status_refetch_queued
        - account_statuses_refetch_queued
        - domain_statuses_refetch_queued
        - billing_import_queued
        - cost_item_created
        - cost_item_relabeled
        - cost_item_price_revised
        - cost_item_end_changed
        - cost_item_canceled
        - supporter_program_enabled
        - supporter_program_disabled
        - supporter_plan_created
        - supporter_plan_revised
        - supporter_plan_retired
        - supporter_subscription_canceled
        - custom_emoji_request_submitted
        - custom_emoji_request_withdrawn
        - custom_emoji_request_approved
        - custom_emoji_request_rejected
        - payment_reconcile_queued
    AdminAuditActorKind:
      description: |
        Who performed the operation. `user`: a signed-in moderator or administrator.
        `cli`: the `my` command line, which acts as no user. `system`: the server itself.
        `remote`: another server.
      type: string
      enum:
        - user
        - cli
        - system
        - remote
    AdminAuditEntry:
      description: One operation of a moderator or an administrator (FR-704).
      type: object
      required:
        - id
        - actor_kind
        - action
        - target_kind
        - target_id
        - target_label
        - target_exists
        - occurred_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        actor_kind:
          $ref: '#/components/schemas/AdminAuditActorKind'
        actor_account_id:
          description: |
            The local account of the user who performed the operation; omitted unless
            `actor_kind` is `user`, and when the user has no account.
          allOf:
            - $ref: '#/components/schemas/Id'
        actor_account:
          description: The account of `actor_account_id`; omitted when it is gone.
          allOf:
            - $ref: '#/components/schemas/Account'
        action:
          $ref: '#/components/schemas/AdminAuditAction'
        target_kind:
          $ref: '#/components/schemas/AdminAuditTargetKind'
        target_id:
          description: |
            The target: the ID of an account, a report, an appeal, a user, a role, a rule, a
            sign-up block, a custom emoji, a webhook, or an invite, the domain of a domain action,
            or the key of a setting or a text.
          type: string
        target_label:
          description: |
            The target's display name when the operation happened, such as `@alice`,
            `@bob@example.com`, a domain, a setting's key, a rule's text, or a sign-up block's
            kind and value (`email_domain spam.example`); up to 512 characters.
          type: string
        target_exists:
          description: |
            Whether the target is still there to look at. It is `false` for an account, a report,
            an appeal, or a sign-up block that is gone (erased past its retention), and for a
            role, a custom emoji, a webhook, or a relay that was deleted, which only `target_label`
            names now. It is `true` for the other kinds of targets, which are never removed.
          type: boolean
        source_event_id:
          description: |
            The ID of the record of the operation (the domain action, the assignment, the
            resolution, the reopening, the note, the decision, the revision), which holds its
            reasons and notes; omitted when the operation has none.
          type: string
        occurred_at:
          type: string
          format: date-time
    AdminAuditEntryPage:
      description: A page of the audit log, newest first.
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminAuditEntry'
    AdminAuditTargetKind:
      description: The kind of what an audited operation acted on.
      type: string
      enum:
        - account
        - status
        - domain
        - report
        - appeal
        - user
        - role
        - setting
        - rule
        - signup_block
        - custom_emoji
        - webhook
        - announcement
        - invite
        - relay
        - billing_source
        - cost_item
        - supporter_program
        - supporter_plan
        - supporter_subscription
        - custom_emoji_request
        - payment_provider
    AdminAvailabilityEvent:
      description: The time a remote server was marked unavailable or available again, and why.
      type: object
      required:
        - id
        - kind
        - reason
        - occurred_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
          type: string
          enum:
            - marked_unavailable
            - marked_available
        reason:
          description: |
            `failure_days`: deliveries failed on 7 distinct days. `delivery_succeeded`: a delivery
            succeeded. `inbound_request`: the server sent a signed request. `probe_succeeded`: the
            daily probe fetched its NodeInfo. `operator`: an operator marked it.
          type: string
          enum:
            - failure_days
            - delivery_succeeded
            - inbound_request
            - probe_succeeded
            - operator
        occurred_at:
          type: string
          format: date-time
    AdminAvailabilityEventPage:
      description: A page of availability events, newest first.
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminAvailabilityEvent'
    AdminCounts:
      description: What awaits the moderators; a count whose permission the user lacks is omitted.
      type: object
      properties:
        open_reports:
          description: The reports that are open. Needs `manage_reports`.
          type: integer
          format: int64
          minimum: 0
        pending_registrations:
          description: The registrations that await approval. Needs `manage_accounts`.
          type: integer
          format: int64
          minimum: 0
        pending_appeals:
          description: The appeals of moderation actions that await a decision. Needs `manage_accounts`.
          type: integer
          format: int64
          minimum: 0
    AdminCustomEmoji:
      description: |
        A custom emoji as the administrators manage it (ADR-0051 §4): a local one, or a remote
        one recorded from the posts and profiles of another server.
      type: object
      required:
        - id
        - shortcode
        - local
        - enabled
        - visible_in_picker
        - aliases
        - created_by_deleted
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        shortcode:
          description: The shortcode, without the colons around it.
          type: string
        local:
          description: Whether the emoji is of this instance.
          type: boolean
        domain:
          description: The domain of a remote emoji; absent for a local one.
          type: string
        uri:
          description: |
            The ActivityPub `id` of the emoji: `https://{host}/ap/emojis/{id}` for a local one,
            and the recorded one for a remote one; absent when a remote emoji has none.
          type: string
          format: uri
        url:
          description: |
            The URL of the image, animated when the emoji is; absent when the image cannot be
            shown (such as a remote one from a domain whose media the instance rejects).
          type: string
          format: uri
        static_url:
          description: The URL of a still image of the emoji; absent with `url`.
          type: string
          format: uri
        enabled:
          description: Whether the emoji is shown; a disabled one stays `:shortcode:` text.
          type: boolean
        visible_in_picker:
          description: Whether the picker offers the local emoji; always `true` for a remote one.
          type: boolean
        category:
          description: The category of a local emoji in the picker; absent for none.
          type: string
        aliases:
          description: The other names of a local emoji that the picker finds it by.
          type: array
          items:
            type: string
        created_by:
          description: |
            The account of the user who made a local emoji (ADR-0070 §7): the requester of an
            approved request, or the administrator who registered or copied it. Absent for an emoji
            made with the CLI, a remote one, and one whose creator's account is deleted
            (`created_by_deleted`).
          $ref: '#/components/schemas/Account'
        created_by_deleted:
          description: Whether a user made the emoji whose account no longer exists.
          type: boolean
        created_at:
          description: When the emoji was registered or first seen.
          type: string
          format: date-time
        updated_at:
          description: When its current image was set, its ActivityPub `updated`.
          type: string
          format: date-time
    AdminCustomEmojiPage:
      description: A page of custom emoji.
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminCustomEmoji'
    AdminCustomEmojiRequest:
      description: A custom emoji request as the administrators review it, with the requester.
      allOf:
        - $ref: '#/components/schemas/CustomEmojiRequest'
        - type: object
          properties:
            requester:
              description: The account of the requester; absent when it is deleted.
              allOf:
                - $ref: '#/components/schemas/Account'
    AdminCustomEmojiRequestPage:
      description: A page of custom emoji requests with their requesters.
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminCustomEmojiRequest'
    AdminDomainAction:
      description: A moderation action on a remote domain and its subdomains (FR-702).
      type: object
      required:
        - id
        - domain
        - kind
        - obfuscate
        - state
        - issued_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        domain:
          description: The domain, in IDNA A-labels.
          type: string
        kind:
          $ref: '#/components/schemas/AdminDomainActionKind'
        public_comment:
          description: The reason that may be shown publicly; omitted when there is none.
          type: string
        private_note:
          description: The moderators' note; omitted when there is none.
          type: string
        obfuscate:
          description: Whether a public list of the domain actions hides part of the domain.
          type: boolean
        state:
          $ref: '#/components/schemas/AdminDomainActionState'
        issued_at:
          type: string
          format: date-time
        expires_at:
          description: When the action ends by itself; omitted for one that lasts until lifted.
          type: string
          format: date-time
        lifted_at:
          description: When the action was lifted; omitted until it is.
          type: string
          format: date-time
    AdminDomainActionKind:
      description: |
        `suspend`: no federation with the domain at all. `limit`: its posts stay off the public
        timelines and its accounts reach only their followers. `reject_media`: its media are
        not fetched. `reject_reports`: its reports are dropped. `force_sensitive`: its media
        are marked sensitive.
      type: string
      enum:
        - limit
        - suspend
        - reject_media
        - reject_reports
        - force_sensitive
    AdminDomainActionPage:
      description: A page of domain actions, newest first.
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminDomainAction'
    AdminDomainActionState:
      description: |
        `active`: in effect now. `expired`: it ended at `expires_at`. `lifted`: a moderator
        lifted it.
      type: string
      enum:
        - active
        - expired
        - lifted
    AdminIncomePeriodTotal:
      description: |
        A week, month, or year of the income totals as the administrators see it: the `gross`, the
        provider's `fee`, and the `net` (gross less fee) of each currency, sorted by currency code,
        and the `balance`, the net less the costs of each currency under the same basis.
      type: object
      required:
        - label
        - starts_on
        - ends_on
        - gross
        - fee
        - net
        - balance
      properties:
        label:
          type: string
        starts_on:
          $ref: '#/components/schemas/CalendarDate'
        ends_on:
          $ref: '#/components/schemas/CalendarDate'
        gross:
          type: array
          items:
            $ref: '#/components/schemas/Money'
        fee:
          type: array
          items:
            $ref: '#/components/schemas/Money'
        net:
          type: array
          items:
            $ref: '#/components/schemas/Money'
        balance:
          type: array
          items:
            $ref: '#/components/schemas/Money'
    AdminIncomeTotals:
      description: |
        The income totals as the administrators see them over the periods from the one that holds
        `from` to the one that holds `to`, oldest first, with the number of members of each
        supporter plan now (ADR-0073 §6).
      type: object
      required:
        - granularity
        - basis
        - periods
        - plans
        - rules
      properties:
        granularity:
          $ref: '#/components/schemas/CostGranularity'
        basis:
          $ref: '#/components/schemas/CostBasis'
        periods:
          type: array
          items:
            $ref: '#/components/schemas/AdminIncomePeriodTotal'
        plans:
          type: array
          items:
            $ref: '#/components/schemas/IncomePlanCount'
        rules:
          $ref: '#/components/schemas/IncomeTotalsRules'
    AdminInstanceHealth:
      description: Whether deliveries go to a remote server (federation.md §7.3).
      type: object
      required:
        - domain
        - state
        - failure_days
      properties:
        domain:
          type: string
        state:
          $ref: '#/components/schemas/AdminInstanceState'
        since:
          description: When the server entered its state; omitted for a server without failures.
          type: string
          format: date-time
        failure_days:
          description: The number of distinct UTC days of the latest run of failed deliveries.
          type: integer
          minimum: 0
        last_failure_day:
          description: The latest of those days; omitted without failures.
          type: string
          format: date
    AdminInstanceHealthPage:
      description: A page of server health, in domain order.
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminInstanceHealth'
    AdminInstanceState:
      description: |
        `available` servers get every delivery; `unavailable` ones only `Follow`, `Accept`, and
        `Reject`.
      type: string
      enum:
        - available
        - unavailable
    AdminInstanceText:
      description: The current text of a key, the same in every locale.
      type: object
      required:
        - key
        - body
        - revised_at
      properties:
        key:
          $ref: '#/components/schemas/InstanceTextKey'
        body:
          description: |
            The text: Markdown for `terms` and `privacy_policy`, plain text for the other keys.
            Empty only in the answer to clearing it.
          type: string
        revised_at:
          description: When the revision was recorded.
          type: string
          format: date-time
    AdminInstanceTextList:
      description: The current instance texts, by key.
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminInstanceText'
    AdminInvite:
      description: An invite that lets people sign up while the registration mode is `invite`.
      type: object
      required:
        - id
        - code
        - url
        - uses
        - state
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        code:
          description: The code people enter on the registration page, 16 characters.
          type: string
        url:
          description: The registration page with the code filled in, to send to people.
          type: string
          format: uri
        max_uses:
          description: How many sign-ups the invite allows; omitted when there is no limit.
          type: integer
          minimum: 1
        uses:
          description: How many people have signed up with the invite.
          type: integer
          minimum: 0
        state:
          $ref: '#/components/schemas/AdminInviteState'
        expires_at:
          description: When the invite stops working; omitted when it never does.
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    AdminInvitePage:
      description: A page of invites, newest first.
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminInvite'
    AdminInviteState:
      description: |
        What the invite allows now. `usable`: people may sign up with it. `revoked`: a staff
        member revoked it. `expired`: it passed `expires_at`. `exhausted`: it was used
        `max_uses` times.
      type: string
      enum:
        - usable
        - revoked
        - expired
        - exhausted
    AdminJob:
      description: A job of the job queue.
      type: object
      required:
        - id
        - type
        - state
        - payload
        - attempts
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        type:
          description: The job type, such as `federation.deliver`.
          type: string
        state:
          $ref: '#/components/schemas/AdminJobState'
        payload:
          description: The job's payload, a JSON document as text.
          type: string
        idempotency_key:
          type: string
        ordering_key:
          type: string
        attempts:
          description: The number of runs the job had, the one in progress included.
          type: integer
          minimum: 0
        last_error:
          description: Why the last run failed; omitted for a job whose runs did not fail.
          type: string
        run_at:
          description: When a pending job is due; omitted for a dead job.
          type: string
          format: date-time
        worker:
          description: The worker that runs a `running` job.
          type: string
        locked_until:
          description: When the lease of a `running` job ends; another worker may run it after.
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        failed_at:
          description: When a dead job failed.
          type: string
          format: date-time
    AdminJobAttempt:
      description: A run of a job that did not succeed.
      type: object
      required:
        - attempt
        - type
        - outcome
        - error
        - worker
        - started_at
        - finished_at
      properties:
        attempt:
          description: The number of the run, from 1.
          type: integer
          minimum: 1
        type:
          description: The job type.
          type: string
        outcome:
          description: '`retry`: the job runs again. `dead`: it failed for good.'
          type: string
          enum:
            - retry
            - dead
        error:
          description: Why the run failed, at most 2,000 bytes.
          type: string
        worker:
          description: The worker that ran it.
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
    AdminJobAttemptPage:
      description: A page of attempts, the most recently finished first.
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminJobAttempt'
    AdminJobCount:
      description: The number of jobs of one type in one state.
      type: object
      required:
        - state
        - type
        - count
      properties:
        state:
          $ref: '#/components/schemas/AdminJobState'
        type:
          type: string
        count:
          type: integer
          format: int64
          minimum: 1
    AdminJobPage:
      description: A page of jobs.
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminJob'
    AdminJobState:
      description: |
        The state of a job. `queued`: it has not run yet and waits for its `run_at` or a worker.
        `running`: a worker holds it. `retrying`: it ran and waits to run again. `dead`: it
        failed for good (its handler gave up, or it used up its attempts).
      type: string
      enum:
        - queued
        - running
        - retrying
        - dead
    AdminPasswordResetLink:
      description: |
        A password reset link that an administrator issued for a local account (FR-002). It is
        shown once.
      type: object
      required:
        - url
        - expires_at
      properties:
        url:
          description: The link that sets a new password; it works once.
          type: string
          format: uri
        expires_at:
          description: When the link stops working.
          type: string
          format: date-time
    AdminQueue:
      description: The state of the job queue (ADR-0064).
      type: object
      required:
        - adapter
        - pending_listing
        - counts
      properties:
        adapter:
          description: The queue the server runs, the `queue` setting (`db`, `inline`, `sqs`, `cloudtasks`).
          type: string
        pending_listing:
          description: Whether the queue lists its pending jobs (`queued`, `running`, `retrying`).
          type: boolean
        counts:
          description: |
            The jobs by state (`queued`, `running`, `retrying`, `dead`) then type; states and
            types without jobs are left out. Empty without `pending_listing`.
          type: array
          items:
            $ref: '#/components/schemas/AdminJobCount'
        oldest_ready_at:
          description: |
            The earliest `run_at` among the due jobs that no worker holds: how long the queue
            has kept a job waiting. Omitted when no job waits, or without `pending_listing`.
          type: string
          format: date-time
    AdminRegistration:
      description: A user's registration as the moderators review it (FR-721).
      type: object
      required:
        - user_id
        - state
        - since
        - email
        - email_verified
        - submitted_at
      properties:
        user_id:
          $ref: '#/components/schemas/Id'
        account_id:
          description: The user's local account; omitted when it is gone.
          allOf:
            - $ref: '#/components/schemas/Id'
        username:
          description: The username of the user's local account; omitted when it is gone.
          type: string
        state:
          $ref: '#/components/schemas/RegistrationState'
        since:
          description: When the registration entered its state.
          type: string
          format: date-time
        email:
          description: The user's primary email address; empty when there is none.
          type: string
        email_verified:
          description: Whether the user confirmed the email address.
          type: boolean
        reason:
          description: Why the user wants to join, as plain text; omitted when they gave none.
          type: string
        invite_id:
          description: The invite the user signed up with; omitted for none.
          allOf:
            - $ref: '#/components/schemas/Id'
        submitted_at:
          description: When the user signed up.
          type: string
          format: date-time
    AdminRegistrationPage:
      description: A page of registrations, longest in their state first.
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminRegistration'
    AdminRelay:
      description: A relay that the instance joins or joined (ADR-0061).
      type: object
      required:
        - id
        - protocol
        - url
        - inbox_url
        - receive
        - state
        - state_changed_at
        - taken_last_day
        - dropped_last_day
        - domain_suspended
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        protocol:
          $ref: '#/components/schemas/RelayProtocol'
        url:
          description: The URL it was registered with, its inbox or its actor.
          type: string
        inbox_url:
          description: Where the public posts are delivered.
          type: string
        receive:
          description: Whether the public posts it relays are taken in; `false` only sends.
          type: boolean
        state:
          $ref: '#/components/schemas/RelayState'
        state_changed_at:
          type: string
          format: date-time
        actor_uri:
          description: The relay's actor, which accepted the `Follow`; omitted unless `accepted`.
          type: string
        taken_last_day:
          description: The activities it brought in during the last 24 hours that were taken in.
          type: integer
          minimum: 0
        dropped_last_day:
          description: |
            The activities it brought in during the last 24 hours that were dropped over the
            hourly limit (`relay_ingest_hourly_limit`).
          type: integer
          minimum: 0
        domain_suspended:
          description: |
            Whether a domain action suspends its server: nothing goes to it or comes from it
            while it does, whatever `state` says.
          type: boolean
        created_at:
          type: string
          format: date-time
    AdminRelayList:
      description: The relays, in registration order.
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminRelay'
    AdminReport:
      description: A report of an account to the moderators (FR-701).
      type: object
      required:
        - id
        - category
        - comment
        - forwarded
        - filed_at
        - state
        - state_changed_at
        - reporter_account_id
        - target_account_id
        - status_ids
        - rule_ids
      properties:
        id:
          $ref: '#/components/schemas/Id'
        uri:
          description: |
            The `id` of the `Flag` activity that another server sent; omitted for a report
            made on this server.
          type: string
        category:
          type: string
          enum:
            - spam
            - legal
            - violation
            - other
        comment:
          description: The reporter's comment as plain text, up to 5,000 characters.
          type: string
        forwarded:
          description: Whether the report was forwarded to the target's server.
          type: boolean
        filed_at:
          type: string
          format: date-time
        state:
          $ref: '#/components/schemas/AdminReportState'
        outcome:
          $ref: '#/components/schemas/AdminReportOutcome'
        state_changed_at:
          description: When the report entered its state (when it was filed, resolved, or reopened).
          type: string
          format: date-time
        assignee_account_id:
          description: |
            The account of the moderator who handles the report; omitted when nobody does.
          allOf:
            - $ref: '#/components/schemas/Id'
        reporter_account_id:
          $ref: '#/components/schemas/Id'
        reporter_account:
          description: The reporter, often the instance actor of a remote server; omitted when the account is gone.
          allOf:
            - $ref: '#/components/schemas/Account'
        target_account_id:
          $ref: '#/components/schemas/Id'
        target_account:
          description: The account reported; omitted when the account is gone.
          allOf:
            - $ref: '#/components/schemas/Account'
        status_ids:
          description: The IDs of the target's posts that the report points at.
          type: array
          items:
            $ref: '#/components/schemas/Id'
        rule_ids:
          description: |
            The IDs of the instance rules that the report cites, retired ones included; only a
            report of the `violation` category cites rules.
          type: array
          items:
            $ref: '#/components/schemas/Id'
    AdminReportDetail:
      description: |
        A report as a moderator opens it: the report with its internal notes, the posts it
        points at, and what the moderators had about its target.
      allOf:
        - $ref: '#/components/schemas/AdminReport'
        - type: object
          required:
            - notes
            - target_history
            - statuses
          properties:
            notes:
              description: The moderators' notes on the report, oldest first.
              type: array
              items:
                $ref: '#/components/schemas/AdminReportNote'
            target_history:
              $ref: '#/components/schemas/AdminReportTargetHistory'
            statuses:
              description: |
                The posts that the report points at, in the order of `status_ids`, whatever
                their visibility and also when their author deleted them, for the moderators to
                review. A post that the server no longer has is left out.
              type: array
              items:
                $ref: '#/components/schemas/AdminReportStatus'
    AdminReportNote:
      description: A moderator's internal note on a report; never shown to the target or the reporter.
      type: object
      required:
        - id
        - body
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        author_account_id:
          description: |
            The account of the moderator who wrote the note; omitted for a note from the
            command line and when the moderator has no account.
          allOf:
            - $ref: '#/components/schemas/Id'
        body:
          description: The note as plain text, up to 2,000 characters.
          type: string
        created_at:
          type: string
          format: date-time
    AdminReportOutcome:
      description: |
        How the report was resolved, present only while it is resolved. `actioned`: a moderator
        took an action on the target. `dismissed`: there was nothing to act on.
      type: string
      enum:
        - actioned
        - dismissed
    AdminReportPage:
      description: A page of reports, newest first.
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminReport'
    AdminReportState:
      description: '`open` reports await the moderators; `resolved` ones are handled.'
      type: string
      enum:
        - open
        - resolved
    AdminReportStatus:
      description: |
        A post that a report points at, as a moderator reviews it. `status` is the post as it
        was last, without the moderator's own relation to it (`favourited`, `boosted`,
        `bookmarked`, and `pinned` are omitted).
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/Status'
        deleted_at:
          description: When the post was deleted, by its author or otherwise; omitted when it is not.
          type: string
          format: date-time
    AdminReportTargetHistory:
      description: What the moderators had about the target of a report.
      type: object
      required:
        - reports_count
        - actions_count
      properties:
        reports_count:
          description: The number of the target's other reports, open and resolved.
          type: integer
          format: int64
          minimum: 0
        actions_count:
          description: The number of moderation actions on the target, ended ones included.
          type: integer
          format: int64
          minimum: 0
    AdminRole:
      description: |
        A role (FR-720): a named set of permissions. A higher position outranks a lower one;
        a user may grant, revoke, create, change, and delete only the roles at or below their
        highest one, and give or take only the permissions they hold.
      type: object
      required:
        - id
        - key
        - position
        - permissions
      properties:
        id:
          $ref: '#/components/schemas/Id'
        key:
          description: The name of the role, such as `admin` or `moderator`.
          type: string
          minLength: 1
          maxLength: 64
        position:
          type: integer
        permissions:
          description: The permissions that the role grants, in the order of `Permission`.
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        badge:
          description: The badge of the role, which its holders may show on their profile; omitted when it has none.
          $ref: '#/components/schemas/RoleBadge'
    AdminRoleList:
      description: Roles, highest position first.
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminRole'
    AdminRule:
      description: |
        A rule of the instance (FR-705). Its ID stays the same across revisions, so reports keep
        citing it.
      type: object
      required:
        - id
        - position
        - text
        - created_at
        - revised_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        position:
          description: |
            The sort key of the rule; the rules in effect are listed by it. Retiring a rule
            leaves a gap until the next move.
          type: integer
          minimum: 1
        text:
          description: The rule, on one line, as plain text.
          type: string
        hint:
          description: An explanation of the rule, as plain text; omitted when there is none.
          type: string
        created_at:
          type: string
          format: date-time
        revised_at:
          description: When the current revision was recorded.
          type: string
          format: date-time
        retired_at:
          description: When the rule was retired; omitted for a rule in effect.
          type: string
          format: date-time
    AdminRuleList:
      description: The rules.
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminRule'
    AdminSameIpAccounts:
      description: The other accounts that used one IP address.
      type: object
      required:
        - ip
        - accounts
      properties:
        ip:
          type: string
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/AdminAccount'
    AdminSetting:
      description: |
        An instance setting: its value and what it accepts. Every value is a string in its
        canonical form, whatever its kind.
      type: object
      required:
        - key
        - kind
        - value
        - default
        - stored
      properties:
        key:
          $ref: '#/components/schemas/InstanceSettingKey'
        kind:
          $ref: '#/components/schemas/InstanceSettingKind'
        value:
          description: The current value, which is `default` when `stored` is false.
          type: string
        default:
          description: The value of the setting while it has never been set.
          type: string
        stored:
          description: Whether the setting has been set; false means its default applies.
          type: boolean
        choices:
          description: The values an `enum` setting accepts, in order; omitted for other kinds.
          type: array
          items:
            type: string
        minimum:
          description: The least value of an `int` setting; omitted for other kinds.
          type: integer
        maximum:
          description: The greatest value of an `int` setting; omitted for other kinds.
          type: integer
    AdminSettingList:
      description: Every instance setting, in a fixed order.
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminSetting'
    AdminSignupBlock:
      description: A block on sign-ups from the registration page (FR-719).
      type: object
      required:
        - id
        - kind
        - value
        - severity
        - state
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
          $ref: '#/components/schemas/AdminSignupBlockKind'
        value:
          description: |
            What the block matches, in canonical form: a domain in IDNA A-labels
            (`email_domain`), the hex SHA-256 of a canonical email address (`email_hash`), or a
            masked CIDR prefix (`ip_range`).
          type: string
        severity:
          $ref: '#/components/schemas/AdminSignupBlockSeverity'
        comment:
          description: The moderators' comment; omitted when there is none.
          type: string
        moderation_action_id:
          description: The ban the block was made from; omitted for a block added on its own.
          allOf:
            - $ref: '#/components/schemas/Id'
        state:
          $ref: '#/components/schemas/AdminSignupBlockState'
        created_at:
          type: string
          format: date-time
        expires_at:
          description: When the block ends by itself; omitted for one that lasts until lifted.
          type: string
          format: date-time
        lifted_at:
          description: When the block was lifted; omitted until it is.
          type: string
          format: date-time
    AdminSignupBlockKind:
      description: |
        `email_domain`: the domain of the email address and its subdomains. `email_hash`: one
        email address, compared in lower case without the part of the local part from its first
        `+`. `ip_range`: the client addresses in a CIDR prefix.
      type: string
      enum:
        - email_domain
        - email_hash
        - ip_range
    AdminSignupBlockPage:
      description: A page of sign-up blocks, newest first.
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminSignupBlock'
    AdminSignupBlockSeverity:
      description: |
        `reject`: the sign-up is refused. `require_approval`: the registration starts pending
        for a moderator, whatever the registration mode.
      type: string
      enum:
        - reject
        - require_approval
    AdminSignupBlockState:
      description: |
        `active`: in effect now. `expired`: it ended at `expires_at`. `lifted`: a moderator
        lifted it.
      type: string
      enum:
        - active
        - expired
        - lifted
    AdminSupporterPlan:
      description: |
        A supporter plan as the administrators see it (ADR-0072 §3). The yearly price is the
        monthly one × 12, discounted by `annual_discount_percent`, rounded down. A plan takes
        subscriptions while it is public, not retired, and `prices_ready` (the provider has the
        prices of its current terms).
      type: object
      required:
        - id
        - name
        - description
        - rank
        - visibility
        - monthly_price
        - yearly_price
        - annual_discount_percent
        - emoji_limit
        - role
        - prices_ready
        - retired
        - members
        - created_at
        - revised_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        description:
          type: string
        rank:
          description: A higher rank is a higher plan, which includes everything of the lower ones.
          type: integer
        visibility:
          $ref: '#/components/schemas/SupporterPlanVisibility'
        monthly_price:
          $ref: '#/components/schemas/Money'
        yearly_price:
          $ref: '#/components/schemas/Money'
        annual_discount_percent:
          type: integer
        emoji_limit:
          description: How many custom emoji the members may create when the role lets them.
          type: integer
        role:
          $ref: '#/components/schemas/AdminSupporterPlanRole'
        prices_ready:
          type: boolean
        retired:
          type: boolean
        retired_at:
          type: string
          format: date-time
        members:
          description: The subscriptions that hold the role (active, canceling, or past due).
          type: integer
        created_at:
          type: string
          format: date-time
        revised_at:
          type: string
          format: date-time
    AdminSupporterPlanCreateRequest:
      description: |
        A new supporter plan on a role that nobody holds, whose permissions are member
        permissions and whose position is below every staff role. The currency never changes.
      type: object
      required:
        - role
        - name
        - monthly_price
        - annual_discount_percent
        - emoji_limit
        - rank
        - visibility
      properties:
        role:
          description: The key of the role.
          type: string
        name:
          description: 1 to 50 characters on one line.
          type: string
        description:
          description: Up to 1,000 characters of plain text.
          type: string
        monthly_price:
          $ref: '#/components/schemas/Money'
        annual_discount_percent:
          description: 0 to 90.
          type: integer
        emoji_limit:
          description: 0 to 10,000.
          type: integer
        rank:
          description: 0 to 1,000,000, unique among the plans that are not retired.
          type: integer
        visibility:
          $ref: '#/components/schemas/SupporterPlanVisibility'
    AdminSupporterPlanList:
      description: Every supporter plan, retired ones too, by rank.
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminSupporterPlan'
    AdminSupporterPlanRole:
      description: The role of a supporter plan, which only its subscriptions grant.
      type: object
      required:
        - id
        - key
        - position
        - permissions
      properties:
        id:
          $ref: '#/components/schemas/Id'
        key:
          type: string
        position:
          type: integer
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
    AdminSupporterPlanUpdateRequest:
      description: |
        A change of a supporter plan; an omitted property keeps its value. A new monthly price,
        in the plan's currency, or discount makes new prices for the new subscriptions and the
        changes of plan; the subscriptions on the old ones keep them. `role_position` and
        `role_permissions` change the plan's role, kept to member permissions below every staff
        role.
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        monthly_price:
          $ref: '#/components/schemas/Money'
        annual_discount_percent:
          type: integer
        emoji_limit:
          type: integer
        rank:
          type: integer
        visibility:
          $ref: '#/components/schemas/SupporterPlanVisibility'
        role_position:
          type: integer
        role_permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
    AdminSupporterProgram:
      description: |
        The supporter program (ADR-0072 §2). It is disabled by default; enabling it needs a
        payment provider in the deployment's configuration (`configured_provider`) and a server
        that sends email (`sends_email`). `warnings` lists what an administrator should look at.
      type: object
      required:
        - enabled
        - sends_email
        - commerce_disclosure
        - live_subscriptions
        - can_enable
        - warnings
      properties:
        enabled:
          type: boolean
        provider:
          description: The payment provider the program was enabled with; omitted while disabled.
          type: string
        configured_provider:
          description: The payment provider of the deployment's configuration; omitted for none.
          type: string
        sends_email:
          type: boolean
        commerce_disclosure:
          description: Whether the instance publishes its commerce disclosures (`/about/commerce`).
          type: boolean
        live_subscriptions:
          description: The subscriptions that go on, which keep the program from being disabled.
          type: integer
        can_enable:
          description: Whether the program can be enabled now.
          type: boolean
        changed_at:
          description: When the program was last enabled or disabled; omitted for never.
          type: string
          format: date-time
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/SupporterProgramWarning'
    AdminSupporterProgramRequest:
      description: Enables or disables the supporter program.
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
    AdminSupporterSubscription:
      description: |
        A subscription as the administrators see it, without the history of its payments.
      type: object
      required:
        - id
        - state
        - plan_id
        - plan_name
        - interval
        - price
        - started_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        state:
          $ref: '#/components/schemas/SupporterSubscriptionState'
        plan_id:
          $ref: '#/components/schemas/Id'
        plan_name:
          type: string
        interval:
          $ref: '#/components/schemas/SupporterInterval'
        price:
          $ref: '#/components/schemas/Money'
        period_ends_at:
          description: The end of the current period; omitted for `pending` and `abandoned`.
          type: string
          format: date-time
        grace_ends_at:
          description: When a `past_due` subscription loses its role.
          type: string
          format: date-time
        scheduled_plan_id:
          $ref: '#/components/schemas/Id'
        scheduled_interval:
          $ref: '#/components/schemas/SupporterInterval'
        account_id:
          $ref: '#/components/schemas/Id'
        username:
          description: The subscriber's username; omitted with `account_id` for an erased account.
          type: string
        started_at:
          type: string
          format: date-time
    AdminSupporterSubscriptionPage:
      description: A page of subscriptions, newest first.
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminSupporterSubscription'
    AdminTheme:
      description: The instance theme as its administrators edit it.
      type: object
      required:
        - tokens
        - custom_css
      properties:
        revision:
          description: The ID of the current theme revision; omitted when no theme was ever saved.
          type: string
        stylesheet_url:
          description: The stylesheet of the theme; omitted when the theme changes nothing.
          type: string
          format: uri
        tokens:
          description: The overridden tokens, in the order of the token list.
          type: array
          items:
            $ref: '#/components/schemas/ThemeTokenValue'
        custom_css:
          description: The custom CSS; empty for none.
          type: string
        revised_at:
          description: When the current revision was recorded; omitted when no theme was ever saved.
          type: string
          format: date-time
    AdminWebhook:
      description: |
        A webhook endpoint (ADR-0060). Its secret is never shown again after it is made.
      type: object
      required:
        - id
        - url
        - events
        - state
        - state_reason
        - state_changed_at
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        url:
          description: Where the messages are posted.
          type: string
        description:
          description: What the webhook is for; omitted for none.
          type: string
        events:
          description: The events it subscribes to, in a stable order.
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventType'
        state:
          $ref: '#/components/schemas/AdminWebhookState'
        state_reason:
          $ref: '#/components/schemas/AdminWebhookStateReason'
        state_changed_at:
          type: string
          format: date-time
        failure:
          $ref: '#/components/schemas/AdminWebhookFailure'
        created_at:
          type: string
          format: date-time
        updated_at:
          description: When the URL, the description, or the events last changed.
          type: string
          format: date-time
    AdminWebhookAttempt:
      description: The last attempt of a delivery.
      type: object
      required:
        - outcome
        - duration_ms
        - attempted_at
      properties:
        outcome:
          $ref: '#/components/schemas/AdminWebhookAttemptOutcome'
        status_code:
          description: The status code of the answer; omitted without one.
          type: integer
        duration_ms:
          type: integer
          minimum: 0
        attempted_at:
          type: string
          format: date-time
    AdminWebhookAttemptOutcome:
      description: |
        `succeeded`: a 2xx answer. `http_error`: another answer, a redirect included.
        `timeout`: no answer within 15 seconds. `connection_error`: the connection failed.
        `forbidden_destination`: the server may not reach the URL (a loopback or private address
        that `webhook_allowed_destinations` does not list).
      type: string
      enum:
        - succeeded
        - http_error
        - timeout
        - connection_error
        - forbidden_destination
    AdminWebhookCreated:
      description: A new webhook and its secret.
      type: object
      required:
        - webhook
        - secret
      properties:
        webhook:
          $ref: '#/components/schemas/AdminWebhook'
        secret:
          description: |
            The secret that signs the messages, `whsec_` and the base64 of 32 bytes, as the
            Standard Webhooks libraries take it. It is shown only now.
          type: string
    AdminWebhookDelivery:
      description: A message to a webhook and its attempts.
      type: object
      required:
        - id
        - message_id
        - event_type
        - status
        - attempts
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        message_id:
          description: The `webhook-id` of the message, the same on every attempt.
          allOf:
            - $ref: '#/components/schemas/Id'
        event_type:
          $ref: '#/components/schemas/WebhookMessageType'
        status:
          $ref: '#/components/schemas/AdminWebhookDeliveryStatus'
        attempts:
          description: How many times it was sent.
          type: integer
          minimum: 0
        last_attempt:
          $ref: '#/components/schemas/AdminWebhookAttempt'
        created_at:
          type: string
          format: date-time
    AdminWebhookDeliveryPage:
      description: A page of the deliveries of a webhook, newest first.
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminWebhookDelivery'
    AdminWebhookDeliveryStatus:
      description: |
        `pending`: not sent yet. `succeeded`: an attempt got a 2xx answer. `failing`: every
        attempt so far failed; it is retried over about 27 hours, 8 attempts in all, and can be
        sent again by hand after that.
      type: string
      enum:
        - pending
        - succeeded
        - failing
    AdminWebhookFailure:
      description: |
        The attempts that failed since the last success; omitted when the last attempt
        succeeded. The server disables the webhook once they span 72 hours and number 20.
      type: object
      required:
        - consecutive_failures
        - first_failed_at
      properties:
        consecutive_failures:
          type: integer
          minimum: 1
        first_failed_at:
          type: string
          format: date-time
    AdminWebhookList:
      description: The webhooks, newest first.
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminWebhook'
    AdminWebhookSecret:
      description: A new secret of a webhook.
      type: object
      required:
        - secret
      properties:
        secret:
          description: The new secret, as in `AdminWebhookCreated`. It is shown only now.
          type: string
    AdminWebhookState:
      description: Whether the webhook receives the messages of its events.
      type: string
      enum:
        - enabled
        - disabled
    AdminWebhookStateReason:
      description: |
        Who set `state` last. `admin`: a staff member, or the `my` command line. `gone`: the
        server disabled it after the endpoint answered 410 Gone. `failing`: the server disabled
        it after the deliveries kept failing, without a success, for 72 hours and 20 attempts.
      type: string
      enum:
        - admin
        - gone
        - failing
    Announcement:
      description: An announcement of the server to every local user (FR-726), as the user sees it.
      type: object
      required:
        - id
        - content
        - published_at
        - updated_at
        - read
      properties:
        id:
          $ref: '#/components/schemas/Id'
        content:
          description: |
            The text as an HTML fragment, sanitized (paragraphs, emphasis, lists, quotes, code,
            headings from `h2`, and `http`, `https`, and `mailto` links).
          type: string
        published_at:
          description: When it started to show to the users, its publication or the start of its window.
          type: string
          format: date-time
        ends_at:
          description: When it stops showing; omitted when it shows until it is withdrawn.
          type: string
          format: date-time
        updated_at:
          description: When its text or window last changed.
          type: string
          format: date-time
        read:
          description: Whether the user has marked it read.
          type: boolean
    AnnouncementList:
      description: The announcements.
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Announcement'
    AppealModerationActionRequest:
      description: An appeal of an action on the user's own account.
      type: object
      required:
        - text
      properties:
        text:
          description: Why the moderators should reconsider the action, as plain text.
          type: string
          minLength: 1
          maxLength: 2000
    AutoDeletePolicy:
      description: |
        The authenticated user's automatic deletion of their own old posts (FR-118). A post is
        deleted once it was published more than `min_age_days` days ago, unless one of the
        exceptions (the `keep_` properties) keeps it.
      type: object
      required:
        - enabled
        - min_age_days
        - keep_pinned
        - keep_bookmarked
        - keep_favourited
        - keep_media
        - keep_polls
        - keep_visibilities
        - keep_min_boosts
        - keep_min_favourites
      properties:
        enabled:
          description: Whether old posts are deleted.
          type: boolean
        min_age_days:
          description: How many days after its publication a post is deleted.
          type: integer
          minimum: 1
          maximum: 3650
        keep_pinned:
          description: Keep the posts pinned to the profile.
          type: boolean
        keep_bookmarked:
          description: Keep the posts that the user bookmarked.
          type: boolean
        keep_favourited:
          description: Keep the posts that the user favourited.
          type: boolean
        keep_media:
          description: Keep the posts with media attachments.
          type: boolean
        keep_polls:
          description: Keep the posts with a poll.
          type: boolean
        keep_visibilities:
          description: Keep the posts with these visibilities, from the widest audience to the narrowest; empty keeps none for their visibility.
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/Visibility'
        keep_min_boosts:
          description: Keep the posts boosted at least this many times; 0 keeps none for their boosts.
          type: integer
          minimum: 0
          maximum: 1000000
        keep_min_favourites:
          description: Keep the posts favourited at least this many times; 0 keeps none for their favourites.
          type: integer
          minimum: 0
          maximum: 1000000
    BadgeChoice:
      description: |
        A role that the authenticated user holds and that has a badge, with whether the user shows
        the badge on their profile (ADR-0071). A badge is hidden until the user shows it; losing the
        role or its badge hides it again.
      type: object
      required:
        - role_id
        - label
        - color
        - displayed
      properties:
        role_id:
          $ref: '#/components/schemas/Id'
        label:
          description: The name on the badge.
          type: string
        color:
          $ref: '#/components/schemas/BadgeColor'
        displayed:
          description: Whether the user shows the badge on their profile.
          type: boolean
    BadgeChoiceList:
      description: The roles with a badge that the authenticated user holds, highest position first; empty when there are none.
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BadgeChoice'
    BadgeColor:
      description: |
        The color of a role badge (ADR-0071): the name of a pair of the web client's design tokens
        for its background and its text, which keep their contrast in the light and the dark theme.
        Server themes do not change them. The color is decoration; the badge's `label` carries its
        meaning.
      type: string
      enum:
        - neutral
        - red
        - orange
        - yellow
        - green
        - teal
        - blue
        - purple
        - pink
    BillingImport:
      description: The state of the imports of a billing source (ADR-0068 §9).
      type: object
      required:
        - source
        - provider
        - time_zone
        - method
        - requests_today
        - requests_this_month
        - bytes_billed_this_month
        - months
      properties:
        source:
          $ref: '#/components/schemas/BillingSourceName'
        provider:
          description: The provider's name, as the breakdown of the totals shows it.
          type: string
        method:
          description: |
            How the source reads the provider's data (ADR-0068 §1, §7): `cost_explorer` (AWS Cost
            Explorer) and `bigquery` (the Cloud Billing export to BigQuery, `billing_gcp_method =
            bigquery`) by service and charge type; `budget` (the notifications of a Cloud Billing budget,
            `billing_gcp_method = budget`) an approximation, one estimated total per budget and month
            without a breakdown by service.
          type: string
          enum:
            - cost_explorer
            - bigquery
            - budget
        time_zone:
          description: |
            The IANA time zone of the provider's billing months (`UTC`, `America/Los_Angeles`),
            kept as the provider reports them.
          type: string
        last_run:
          $ref: '#/components/schemas/BillingImportRun'
        last_success_at:
          description: When the last successful import ran; omitted before the first.
          type: string
          format: date-time
        requests_today:
          description: The billed requests of the imports this UTC day.
          type: integer
          minimum: 0
        requests_this_month:
          description: The billed requests of the imports this UTC month.
          type: integer
          minimum: 0
        max_requests_per_day:
          description: |
            The cap of the billed requests per UTC day (`billing_aws_max_requests_per_day`);
            omitted for a source without caps.
          type: integer
          minimum: 1
        max_requests_per_month:
          description: |
            The cap of the billed requests per UTC month (`billing_aws_max_requests_per_month`);
            omitted for a source without caps.
          type: integer
          minimum: 1
        bytes_billed_this_month:
          description: The BigQuery bytes billed this UTC month; 0 for the other sources.
          type: integer
          format: int64
          minimum: 0
        months:
          description: The billing months of the last year with imported costs, newest first.
          type: array
          items:
            $ref: '#/components/schemas/BillingImportMonth'
    BillingImportList:
      description: The billing sources and the state of their imports.
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BillingImport'
    BillingImportMonth:
      description: |
        A billing month of a source: an `estimate` while the provider has not closed it, `final`
        once it has, `correction` once a value changed after that; with its totals by currency.
      type: object
      required:
        - month
        - kind
        - totals
      properties:
        month:
          description: The billing month, `YYYY-MM` in the source's time zone.
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}$
        kind:
          type: string
          enum:
            - estimate
            - final
            - correction
        totals:
          type: array
          items:
            $ref: '#/components/schemas/Money'
    BillingImportRun:
      description: The last attempt of a billing import; omitted before the first.
      type: object
      required:
        - outcome
        - error_kind
        - requests
        - bytes_billed
        - occurred_at
      properties:
        outcome:
          type: string
          enum:
            - succeeded
            - failed
        error_kind:
          description: |
            Why it failed: `permission` (the credentials may not read the billing data),
            `not_enabled` (the billing data is not enabled), `not_found` (the dataset, table, or
            subscription does not exist), `throttled` and `unavailable` (retried), `request_cap`
            (the cap of the day or the month is reached; nothing was called), `bytes_cap` (the
            query would scan too much), `invalid_response`; `none` for a success.
          type: string
          enum:
            - none
            - permission
            - not_enabled
            - not_found
            - throttled
            - request_cap
            - bytes_cap
            - invalid_response
            - unavailable
        requests:
          description: The billed requests it made.
          type: integer
          minimum: 0
        bytes_billed:
          type: integer
          format: int64
          minimum: 0
        occurred_at:
          type: string
          format: date-time
    BillingSourceName:
      description: A cloud provider of the billing imports (`billing_sources`).
      type: string
      enum:
        - aws
        - gcp
    CalendarDate:
      description: |
        A calendar date `YYYY-MM-DD` without a time or a time zone (ADR-0067 §5), such as the day
        of a payment on a card statement or an invoice.
      type: string
      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
    ChangePasswordRequest:
      description: |
        A change of the user's password, confirmed with `current_password` or `passkey`.
      type: object
      required:
        - new_password
      properties:
        current_password:
          description: The user's current password, which confirms the change.
          type: string
          minLength: 1
          maxLength: 1024
        passkey:
          $ref: '#/components/schemas/PasskeyAssertion'
        new_password:
          description: The new password, 8 to 128 characters.
          type: string
          minLength: 1
          maxLength: 1024
    CopyCustomEmojiRequest:
      description: The local custom emoji that a copy of a remote one becomes.
      type: object
      properties:
        shortcode:
          description: |
            The shortcode of the local emoji: 2 to 30 letters (A to Z, a to z), digits, and
            underscores; case matters. Absent, the remote emoji's.
          type: string
          minLength: 2
          maxLength: 30
    CostBasis:
      description: |
        How the totals place a payment (ADR-0067 §4). `amortized` (the default) spreads each
        payment of a schedule longer than a month (every 2 or more months, every year, every 5 or
        more weeks) by day over the days up to the next payment, with the cumulative rounding;
        the other payments stay on their dates. `cash` places every payment on its date. Imported
        usage charges spread by day over their billing period under both.
      type: string
      enum:
        - amortized
        - cash
    CostBreakdownLine:
      description: |
        The amount of a provider, category, and currency in a period. The costs group by the provider
        in NFKC and lower case, so `ConoHa`, `conoha`, and `ＣｏｎｏＨａ` share a line.
      type: object
      required:
        - provider
        - category
        - amount
      properties:
        provider:
          type: string
          description: |
            The provider as entered (ADR-0098), one spelling for every line of the same grouped provider
            in the period: the provider of the cost item whose current label was revised last among the
            items with payments in the period (the larger revision ID on a tie), or, for a provider of
            imported costs only, the import's provider name (`AWS`, `Google Cloud`).
        category:
          $ref: '#/components/schemas/CostCategory'
        amount:
          $ref: '#/components/schemas/Money'
    CostCategory:
      description: The fixed category of a cost (ADR-0067 §2); clients translate its name.
      type: string
      enum:
        - compute
        - database
        - storage
        - network
        - domain
        - email
        - software
        - other
    CostGranularity:
      description: |
        The periods of the totals: ISO 8601 weeks (Monday to Sunday), calendar months, or calendar
        years, cut by date (ADR-0067 §5).
      type: string
      enum:
        - week
        - month
        - year
    CostItem:
      description: |
        A cost of the instance that is not canceled (ADR-0067 §2), with its current label and end
        and every price revision. Never published: the public totals carry no item.
      type: object
      required:
        - id
        - schedule
        - interval
        - starts_on
        - name
        - provider
        - category
        - memo
        - prices
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        schedule:
          $ref: '#/components/schemas/CostSchedule'
        interval:
          description: The N of every N weeks, months, or years; 1 for `once`.
          type: integer
          minimum: 1
          maximum: 99
        starts_on:
          $ref: '#/components/schemas/CalendarDate'
        ends_on:
          $ref: '#/components/schemas/CalendarDate'
        name:
          type: string
        provider:
          description: Who is paid, as written; the breakdown groups it in NFKC and lower case.
          type: string
        category:
          $ref: '#/components/schemas/CostCategory'
        memo:
          description: The operator's note, never published; empty for none.
          type: string
        prices:
          description: |
            Every price revision, in the order they were recorded; the first one starts on
            `starts_on`. `ends_on` is the last date a payment can fall on (included), omitted for
            no end; `starts_on` is the first payment date, the payment date of `once`.
          type: array
          items:
            $ref: '#/components/schemas/CostPriceRevision'
        created_at:
          type: string
          format: date-time
    CostItemCreateRequest:
      description: |
        A new cost item. The schedule and the start date never change: to change them, end the
        item and record a new one. `ends_on` is the last date a payment can fall on, omitted for
        no end; `price` is the price of every payment from the start date, 0 or more.
      type: object
      required:
        - schedule
        - interval
        - starts_on
        - name
        - provider
        - category
        - price
      properties:
        schedule:
          $ref: '#/components/schemas/CostSchedule'
        interval:
          description: The N of every N weeks, months, or years, 1 to 99; 1 for `once`.
          type: integer
        starts_on:
          $ref: '#/components/schemas/CalendarDate'
        ends_on:
          $ref: '#/components/schemas/CalendarDate'
        name:
          description: 1 to 100 characters without control characters.
          type: string
        provider:
          description: 1 to 100 characters without control characters.
          type: string
        category:
          $ref: '#/components/schemas/CostCategory'
        memo:
          description: Up to 10,000 characters, never published.
          type: string
        price:
          $ref: '#/components/schemas/Money'
    CostItemEndRequest:
      description: |
        The end of a cost item: `ends_on` is the last date a payment can fall on (included), on or
        after the start date, and omitted for no end. The last payment before it still covers the
        days up to the next payment date.
      type: object
      properties:
        ends_on:
          $ref: '#/components/schemas/CalendarDate'
    CostItemLabelRequest:
      description: A change of a cost item's label; an omitted property keeps its value.
      type: object
      properties:
        name:
          type: string
        provider:
          type: string
        category:
          $ref: '#/components/schemas/CostCategory'
        memo:
          description: The note; empty removes it.
          type: string
    CostItemPage:
      description: A page of cost items, newest first.
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/CostItem'
    CostPeriodTotal:
      description: |
        A week, month, or year of the totals (`label`: `2026-W17`, `2026-04`, or `2026`): the total
        of each currency, never converted (ADR-0067 §6), sorted by currency code, and the breakdown
        by provider, category, and currency. A currency appears when a cost meets the period, even
        with a zero amount. `estimated` reports that an imported usage charge of a billing month
        that its provider has not closed meets the period (ADR-0068 §3): its amount may still
        change.
      type: object
      required:
        - label
        - starts_on
        - ends_on
        - totals
        - breakdown
        - estimated
      properties:
        label:
          type: string
        starts_on:
          $ref: '#/components/schemas/CalendarDate'
        ends_on:
          $ref: '#/components/schemas/CalendarDate'
        totals:
          type: array
          items:
            $ref: '#/components/schemas/Money'
        breakdown:
          type: array
          items:
            $ref: '#/components/schemas/CostBreakdownLine'
        estimated:
          type: boolean
    CostPriceRevision:
      description: |
        A price of a cost item for its payments on or after `effective_on`, until a later
        revision; of revisions with the same date, the last recorded wins.
      type: object
      required:
        - effective_on
        - price
        - revised_at
      properties:
        effective_on:
          $ref: '#/components/schemas/CalendarDate'
        price:
          $ref: '#/components/schemas/Money'
        revised_at:
          type: string
          format: date-time
    CostPriceRevisionRequest:
      description: |
        A price for the payments on or after `effective_on`, on or after the start date: a raise,
        a cut, or the correction of a mistake (`effective_on` = the start date corrects every
        payment).
      type: object
      required:
        - effective_on
        - price
      properties:
        effective_on:
          $ref: '#/components/schemas/CalendarDate'
        price:
          $ref: '#/components/schemas/Money'
    CostSchedule:
      description: |
        The unit of a cost item's payment schedule (ADR-0067 §3): `once` (one payment on the start
        date), or every `interval` `weeks`, `months`, or `years`, counted from the start date. A
        monthly payment on a day that a month does not have falls on the month's last day.
      type: string
      enum:
        - once
        - weeks
        - months
        - years
    CostSourceRule:
      description: |
        The cut of an imported provider's billing months: the IANA time zone they are kept in
        (`UTC`, `America/Los_Angeles`), as the provider bills them.
      type: object
      required:
        - source
        - provider
        - time_zone
      properties:
        source:
          $ref: '#/components/schemas/BillingSourceName'
        provider:
          type: string
        time_zone:
          type: string
    CostTotals:
      description: |
        The totals of the instance's costs over the periods from the one that holds `from` to the
        one that holds `to`, oldest first.
      type: object
      required:
        - granularity
        - basis
        - periods
        - rules
      properties:
        granularity:
          $ref: '#/components/schemas/CostGranularity'
        basis:
          $ref: '#/components/schemas/CostBasis'
        periods:
          type: array
          items:
            $ref: '#/components/schemas/CostPeriodTotal'
        rules:
          $ref: '#/components/schemas/CostTotalsRules'
    CostTotalsRules:
      description: |
        How the totals cut the periods (ADR-0067 §5), to show next to them: by calendar date
        without a time zone, weeks from `week_start` (ISO 8601), and each imported provider's
        billing months in its own time zone (`billing_sources`, in its order).
      type: object
      required:
        - week_start
        - sources
      properties:
        week_start:
          type: string
          enum:
            - monday
        sources:
          type: array
          items:
            $ref: '#/components/schemas/CostSourceRule'
    CreateAccountActionRequest:
      description: A moderation action to take on an account.
      type: object
      required:
        - kind
      properties:
        kind:
          $ref: '#/components/schemas/AdminAccountActionKind'
        reason_category:
          allOf:
            - $ref: '#/components/schemas/AdminAccountActionCategory'
          default: other
        public_reason:
          description: The reason shown to the account.
          type: string
          maxLength: 5000
        private_note:
          description: A note for the moderators only.
          type: string
          maxLength: 5000
        report_id:
          description: |
            The report of the account that the action follows from. The action resolves an open
            report as `actioned` in the same operation; a resolved report stays as it is.
          allOf:
            - $ref: '#/components/schemas/Id'
        notify_target:
          description: Whether a local account is told of the action; ignored for a remote one.
          type: boolean
          default: true
        expires_in:
          description: |
            The seconds the action lasts; omitted, it lasts until it is lifted. A `ban` and the
            actions on posts take none.
          type: integer
          minimum: 1
        status_ids:
          description: |
            The posts of the account that `delete_statuses` or `mark_statuses_sensitive` acts
            on; required for them and taken by no other kind.
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Id'
        block_email:
          description: |
            Whether a `ban` also blocks sign-ups with the email address of the account's user (a
            `reject` sign-up block of kind `email_hash`, FR-719); only a `ban` of a local
            account takes it, and a user without an email address is a 422. Omitted, nothing is
            blocked.
          type: boolean
    CreateCustomEmojiRequest:
      description: A new local custom emoji.
      type: object
      required:
        - shortcode
        - media_id
      properties:
        shortcode:
          description: 2 to 30 letters (A to Z, a to z), digits, and underscores; case matters.
          type: string
          minLength: 2
          maxLength: 30
        media_id:
          $ref: '#/components/schemas/Id'
        category:
          description: The category in the picker, up to 64 characters; empty for none.
          type: string
          maxLength: 64
        aliases:
          description: Other names, each following the rules of a shortcode; at most 10.
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 2
            maxLength: 30
        visible_in_picker:
          description: Whether the picker offers the emoji.
          type: boolean
          default: true
    CreateDomainActionRequest:
      description: A moderation action to take on a domain.
      type: object
      required:
        - domain
        - kind
      properties:
        domain:
          description: |
            The remote domain, such as `spam.example`; a U-label spelling such as `例え.jp` is
            accepted. The action covers its subdomains.
          type: string
          minLength: 1
          maxLength: 253
        kind:
          $ref: '#/components/schemas/AdminDomainActionKind'
        public_comment:
          type: string
          maxLength: 5000
        private_note:
          type: string
          maxLength: 5000
        obfuscate:
          type: boolean
          default: false
        expires_in:
          description: The seconds the action lasts; omitted, it lasts until it is lifted.
          type: integer
          minimum: 1
    CreateInviteRequest:
      description: A new invite.
      type: object
      properties:
        max_uses:
          description: How many sign-ups the invite allows; omitted for no limit.
          type: integer
          minimum: 1
          maximum: 1000000
        expires_in:
          description: How many seconds the invite works; omitted for an invite that never expires.
          type: integer
          minimum: 1
          maximum: 315360000
    CreateOAuthAppRequest:
      description: A new OAuth app.
      type: object
      required:
        - name
        - redirect_uris
        - scope
        - client_type
      properties:
        name:
          description: The app's name, 1 to 100 characters on one line.
          type: string
          maxLength: 100
        website:
          description: The app's home page, an absolute `https` or `http` URL of at most 2048 bytes.
          type: string
          maxLength: 2048
        redirect_uris:
          description: |
            1 to 10 redirect URIs (RFC 8252): an `https` URL, a private-use scheme in reverse domain
            notation (`com.example.app:/callback`), or an `http` loopback URL on `127.0.0.1` or
            `[::1]` (not `localhost`), none with a fragment or user info.
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            maxLength: 2048
        scope:
          description: |
            The most the app may request, space-separated scopes: not empty, and without the
            first-party-only scopes (`admin`, `admin:read`, `admin:write`, `write:supporters`).
          type: string
        client_type:
          $ref: '#/components/schemas/OAuthAppClientType'
    CreatePasskeyRequest:
      description: The browser's answer to a passkey registration.
      type: object
      required:
        - registration_token
        - credential
      properties:
        registration_token:
          description: The `registration_token` of `POST /passkeys/registration`.
          type: string
          maxLength: 4096
        credential:
          description: |
            The `RegistrationResponseJSON` of WebAuthn Level 3 (§5.1): what
            `PublicKeyCredential.toJSON()` returns for the new credential.
          type: object
          additionalProperties: true
    CreateRelayRequest:
      description: A relay to register and join.
      type: object
      required:
        - url
      properties:
        protocol:
          $ref: '#/components/schemas/RelayProtocol'
        url:
          description: The relay's inbox (`mastodon`) or actor (`litepub`), an https URL.
          type: string
          minLength: 1
          maxLength: 2048
        receive:
          description: Whether to take in the public posts it relays; `true` when omitted.
          type: boolean
    CreateReportNoteRequest:
      description: A note to add to a report.
      type: object
      required:
        - body
      properties:
        body:
          description: The note as plain text; it may not be blank.
          type: string
          minLength: 1
          maxLength: 2000
    CreateReportRequest:
      description: A report of an account to the moderators.
      type: object
      required:
        - account_id
        - category
      properties:
        account_id:
          description: The account reported, local or remote.
          allOf:
            - $ref: '#/components/schemas/Id'
        status_ids:
          description: Posts of the account that the user can see, up to 20.
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Id'
        category:
          $ref: '#/components/schemas/ReportCategory'
        rule_ids:
          description: |
            Instance rules in effect that the account broke, up to 20; only with the
            `violation` category.
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Id'
        comment:
          description: A comment for the moderators as plain text.
          type: string
          maxLength: 1000
        forward:
          description: |
            Asks to forward the report to the server of a remote account, without naming the
            reporter. It means nothing for a local account.
          type: boolean
          default: false
    CreateRoleRequest:
      description: A new role.
      type: object
      required:
        - key
        - position
        - permissions
      properties:
        key:
          description: The name of the role, 1 to 64 lowercase ASCII letters, digits, `_`, and `-`.
          type: string
          minLength: 1
          maxLength: 64
        position:
          description: The rank of the role, from 0 to 999 (below `admin`).
          type: integer
        permissions:
          description: The permissions that the role grants, each once.
          type: array
          items:
            $ref: '#/components/schemas/Permission'
    CreateSignupBlockRequest:
      description: A new block on sign-ups.
      type: object
      required:
        - kind
        - value
        - severity
      properties:
        kind:
          $ref: '#/components/schemas/AdminSignupBlockKind'
        value:
          description: |
            A domain such as `spam.example` or `例え.jp` (`email_domain`), an email address or
            the hex SHA-256 of a canonical one (`email_hash`), or a CIDR prefix such as
            `192.0.2.0/24` or a single IP address (`ip_range`).
          type: string
          minLength: 1
          maxLength: 320
        severity:
          $ref: '#/components/schemas/AdminSignupBlockSeverity'
        comment:
          type: string
          maxLength: 1000
        expires_in:
          description: The seconds the block lasts; omitted, it lasts until it is lifted.
          type: integer
          minimum: 1
    CreateStatusRequest:
      description: A new status.
      type: object
      required:
        - text
        - visibility
      properties:
        text:
          $ref: '#/components/schemas/StatusText'
        spoiler_text:
          $ref: '#/components/schemas/SpoilerText'
        sensitive:
          description: Whether the media are sensitive.
          type: boolean
        language:
          $ref: '#/components/schemas/StatusLanguageInput'
        visibility:
          $ref: '#/components/schemas/Visibility'
        in_reply_to_id:
          $ref: '#/components/schemas/Id'
        media:
          $ref: '#/components/schemas/StatusMediaInput'
        poll:
          $ref: '#/components/schemas/PollInput'
        quoted_status_id:
          description: |
            The status to quote (FR-114, ADR-0069). It must be one the user may see and may quote
            (`Status.quotable`); a quote of a boost is a quote of the boosted status. Quoting a
            remote status while the instance does not send posts out (`Instance.federation.mode`
            `off` or `inbound`) is the 403 `/api/v1/problems/federation-restricted`.
          allOf:
            - $ref: '#/components/schemas/Id'
        quote_policy:
          description: Who may quote the new status; the user's `default_quote_policy` when left out.
          allOf:
            - $ref: '#/components/schemas/QuotePolicy'
    CreateWebhookRequest:
      description: A new webhook.
      type: object
      required:
        - url
        - events
      properties:
        url:
          description: |
            An absolute `https` (or `http`) URL of at most 2048 bytes, without user info or a
            fragment. A destination on loopback or a private network is reached only when the
            operator allows it (`webhook_allowed_destinations`).
          type: string
          maxLength: 2048
        description:
          description: What the webhook is for, up to 200 characters.
          type: string
          maxLength: 200
        events:
          description: The events to subscribe to, at least one.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WebhookEventType'
    CredentialAccount:
      description: The authenticated user's own account, with what only its owner sees.
      allOf:
        - $ref: '#/components/schemas/Account'
        - type: object
          required:
            - discoverable
            - indexable
            - ai_opt_out
            - source
            - posting
            - permissions
          properties:
            discoverable:
              description: Whether the account may be suggested to others and listed in directories.
              type: boolean
            indexable:
              description: |
                Whether the account's profile and public posts may be indexed for search: by this
                instance's search and, when the instance's `search_indexing` is `allow`, by search
                engines (FR-412, ADR-0057). New accounts take the instance's default.
              type: boolean
            ai_opt_out:
              description: |
                Whether the account's pages state that AI may neither train on nor use them
                (FR-412, ADR-0057), whatever the instance's `ai_usage`. The statement is made by the
                pages of this instance only; other servers and the media files do not carry it.
              type: boolean
            source:
              $ref: '#/components/schemas/AccountSource'
            posting:
              $ref: '#/components/schemas/PostingLimits'
            permissions:
              description: |
                The permissions that the user's roles grant, which the admin operations need; empty
                for a user without roles. Clients show the admin screens by them; the server checks
                the permission of each admin operation regardless.
              type: array
              items:
                $ref: '#/components/schemas/Permission'
    Cursor:
      description: An opaque pagination cursor. Clients pass it back unchanged and never parse it.
      type: string
      minLength: 1
      maxLength: 256
    CustomEmoji:
      description: |
        A custom emoji that a text uses (FR-111, ADR-0051 §4). The text has it as `:shortcode:`.
        An emoji that is disabled or deleted, or whose images come from a domain whose media the
        instance rejects (FR-702), is not listed, and its `:shortcode:` stays text. Clients show
        `static_url` when animations should not play (`prefers-reduced-motion`), and `url`
        otherwise.
      type: object
      required:
        - shortcode
        - url
        - static_url
      properties:
        shortcode:
          description: The shortcode, without the colons around it.
          type: string
        url:
          description: The URL of the image, animated when the emoji is.
          type: string
          format: uri
        static_url:
          description: The URL of a still image of the emoji; the same as `url` when no still version is served.
          type: string
          format: uri
    CustomEmojiProblem:
      description: |
        The problem of a custom emoji that breaks a rule (422,
        `/api/v1/problems/invalid-custom-emoji`); `reason` says which. Another 422 (a malformed
        request) has none.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            reason:
              $ref: '#/components/schemas/CustomEmojiProblemReason'
    CustomEmojiProblemReason:
      description: |
        Why a custom emoji is refused. `invalid_shortcode`: not 2 to 30 letters, digits, and
        underscores. `shortcode_taken`: a local emoji has the shortcode. `invalid_alias`: an
        alias breaks the rules of a shortcode, or there are more than 10. `invalid_category`:
        the category is longer than 64 characters or not text. `media_not_found`: the media
        file is not an upload of the user. `media_not_ready`: it has not finished processing.
        `unsupported_format`: it is not a PNG, a GIF, or a WebP. `too_large`: it is larger
        than `custom_emoji_max_bytes`. `too_big`: it is larger than 1,024 pixels on a side.
        `remote_emoji`: the operation is for local emoji only. `local_emoji`: the operation is
        for remote emoji only. `fetch_failed`: the image of the remote emoji could not be
        fetched (its server did not return it, or the instance rejects the media of its domain).
        `limit_reached`: the user's custom emoji and pending requests to create one are as many as
        their limit. `request_pending`: the emoji already has a pending request for a new image.
        `invalid_reason`: the reason of a rejection is longer than 500 characters or not text.
      type: string
      enum:
        - invalid_shortcode
        - shortcode_taken
        - invalid_alias
        - invalid_category
        - media_not_found
        - media_not_ready
        - unsupported_format
        - too_large
        - too_big
        - remote_emoji
        - local_emoji
        - fetch_failed
        - limit_reached
        - request_pending
        - invalid_reason
    CustomEmojiRequest:
      description: |
        A request of a holder of `create_custom_emojis` for a new local custom emoji, or for a new
        image of one they made, which a holder of `manage_custom_emojis` approves or rejects
        (ADR-0070 §2). A request is not an emoji: no picker, post, reaction, or other server shows
        its image until it is approved.
      type: object
      required:
        - id
        - kind
        - state
        - shortcode
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
          $ref: '#/components/schemas/CustomEmojiRequestKind'
        state:
          $ref: '#/components/schemas/CustomEmojiRequestState'
        shortcode:
          description: |
            The shortcode of the new emoji, without the colons around it, or of the emoji whose image
            the request replaces.
          type: string
        emoji_id:
          description: |
            The emoji of an `image` request, and the emoji that an approved `create` request made;
            absent otherwise.
          allOf:
            - $ref: '#/components/schemas/Id'
        url:
          description: |
            The URL of the requested image, animated when it is; absent once it cannot be shown (the
            upload of a request that ended goes with the unattached uploads).
          type: string
          format: uri
        static_url:
          description: The URL of a still image of the requested image; absent with `url`.
          type: string
          format: uri
        reason:
          description: The reason of a rejection that the administrator gave; absent for none.
          type: string
        created_at:
          description: When the request was made.
          type: string
          format: date-time
        decided_at:
          description: |
            When the request was approved, rejected, withdrawn, or lapsed; absent while it is
            pending.
          type: string
          format: date-time
    CustomEmojiRequestConflictReason:
      description: |
        Why a custom emoji request cannot be decided or withdrawn. `not_pending`: it was already
        approved, rejected, withdrawn, or lapsed. `requester_cannot_create`: the requester no longer
        holds `create_custom_emojis` or can no longer use the server. `shortcode_taken`: a local
        emoji has the shortcode of the request. The last two can only be rejected.
      type: string
      enum:
        - not_pending
        - requester_cannot_create
        - shortcode_taken
    CustomEmojiRequestKind:
      description: |
        What a custom emoji request asks for (ADR-0070 §2, §3): `create` a new local custom emoji,
        or `image` a new image of a local emoji that the requester made.
      type: string
      enum:
        - create
        - image
    CustomEmojiRequestPage:
      description: A page of custom emoji requests.
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/CustomEmojiRequest'
    CustomEmojiRequestProblem:
      description: |
        The problem of a custom emoji request that cannot be decided or withdrawn (409,
        `/api/v1/problems/custom-emoji-request-conflict`); `reason` says why.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            reason:
              $ref: '#/components/schemas/CustomEmojiRequestConflictReason'
    CustomEmojiRequestState:
      description: |
        The state of a custom emoji request: `pending` until an administrator decides it, then
        `approved` or `rejected`; `withdrawn` by the requester before that; or `lapsed`, a request
        for a new image of an emoji that was deleted.
      type: string
      enum:
        - pending
        - approved
        - rejected
        - withdrawn
        - lapsed
    DataExport:
      description: A request for an archive of the user's data.
      type: object
      required:
        - id
        - state
        - requested_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        state:
          description: |
            `pending` while the archive is being built, `ready` while it can be downloaded,
            `failed` when it could not be built (request another one).
          type: string
          enum:
            - pending
            - ready
            - failed
        requested_at:
          description: When the user asked for the export.
          type: string
          format: date-time
        completed_at:
          description: When the build ended; omitted while `pending`.
          type: string
          format: date-time
        expires_at:
          description: When the export and its archive are removed; omitted while `pending`.
          type: string
          format: date-time
        file_size:
          description: The size of the archive in bytes; only for `ready`.
          type: integer
          format: int64
          minimum: 0
    DataExportList:
      description: The user's latest data exports, newest first.
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DataExport'
    DataImport:
      description: An import of a CSV file, with its progress.
      type: object
      required:
        - id
        - kind
        - mode
        - state
        - created_at
        - total
        - processed
        - failed
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
          $ref: '#/components/schemas/DataImportKind'
        mode:
          $ref: '#/components/schemas/DataImportMode'
        state:
          description: '`in_progress` until every entry and removal is done, then `finished`.'
          type: string
          enum:
            - in_progress
            - finished
        created_at:
          description: When the import started.
          type: string
          format: date-time
        total:
          description: The number of entries to add and things to remove.
          type: integer
          minimum: 0
        processed:
          description: How many of them are done, including the failed ones.
          type: integer
          minimum: 0
        failed:
          description: |
            How many of them could not be carried out: an account or post that cannot be found
            or acted on, a follow that a block stops, or a domain that cannot be muted (this
            server's own, or one beyond the most muted domains allowed).
          type: integer
          minimum: 0
    DataImportKind:
      description: |
        What a CSV file lists: `following` (the accounts the user follows), `blocks` (the
        accounts the user blocks), `mutes` (the accounts the user mutes), `domain_mutes` (the
        domains the user mutes, FR-304; Mastodon's `blocked_domains.csv` with the header
        `#domain`, which a Mastodon user's blocked domains become here), or `bookmarks` (the
        posts the user bookmarked).
      type: string
      enum:
        - following
        - blocks
        - mutes
        - domain_mutes
        - bookmarks
    DataImportList:
      description: The user's latest imports, newest first.
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DataImport'
    DataImportMode:
      description: |
        `merge` adds the file's entries and keeps what the user has; `overwrite` also removes
        what the user has that the file does not list.
      type: string
      enum:
        - merge
        - overwrite
    DataImportPreview:
      description: What an import of a CSV file would do.
      type: object
      required:
        - entries
        - present
        - removals
        - skipped
      properties:
        entries:
          description: The number of entries of the file, each of which the import adds.
          type: integer
          minimum: 0
        present:
          description: How many of the entries the user has already.
          type: integer
          minimum: 0
        removals:
          description: |
            How many things the user has of the kind that the file does not list, which an
            `overwrite` removes; 0 for a `merge`.
          type: integer
          minimum: 0
        skipped:
          description: The lines that are not entries, in line order.
          type: array
          items:
            $ref: '#/components/schemas/DataImportSkipped'
    DataImportRequest:
      description: A CSV file to import, and how.
      type: object
      required:
        - kind
        - mode
        - text
      properties:
        kind:
          $ref: '#/components/schemas/DataImportKind'
        mode:
          $ref: '#/components/schemas/DataImportMode'
        text:
          description: The content of the CSV file, in UTF-8.
          type: string
          maxLength: 1000000
    DataImportSkipped:
      description: A line of a CSV file that is not an entry.
      type: object
      required:
        - line
        - value
        - reason
      properties:
        line:
          description: The line of the file, from 1.
          type: integer
          minimum: 1
        value:
          description: The line as written.
          type: string
        reason:
          description: |
            `invalid`: the line names no account address (for bookmarks, no post URL; for
            domain mutes, no domain).
            `duplicate`: an earlier line names the same account, post, or domain.
          type: string
          enum:
            - invalid
            - duplicate
    DecideAppealRequest:
      description: The moderators' explanation of a decision on an appeal.
      type: object
      properties:
        public_reason:
          description: Shown to the user who appealed, as plain text.
          type: string
          maxLength: 2000
    DeleteOwnAccountRequest:
      description: |
        The confirmation of the deletion of the user's own account: `password` or `passkey`.
      type: object
      properties:
        password:
          description: The user's current password.
          type: string
          minLength: 1
          maxLength: 1024
        passkey:
          $ref: '#/components/schemas/PasskeyAssertion'
    DomainBlock:
      description: |
        A row of Mastodon's domain block CSV. The server checks the domain (a U-label spelling
        such as `例え.jp` is accepted) and the public comment (at most 5,000 characters).
      type: object
      required:
        - domain
        - severity
        - reject_media
        - reject_reports
        - obfuscate
      properties:
        domain:
          type: string
        severity:
          $ref: '#/components/schemas/DomainBlockSeverity'
        reject_media:
          type: boolean
        reject_reports:
          type: boolean
        public_comment:
          type: string
        obfuscate:
          type: boolean
    DomainBlockImportPreview:
      description: What importing each row of a domain block CSV would do, in row order.
      type: object
      required:
        - rows
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/DomainBlockImportRow'
    DomainBlockImportResult:
      description: What an import of domain blocks did.
      type: object
      required:
        - issued
        - skipped
      properties:
        issued:
          description: The actions issued, in the order of the blocks.
          type: array
          items:
            $ref: '#/components/schemas/AdminDomainAction'
        skipped:
          description: The blocks that issued nothing, in their order.
          type: array
          items:
            $ref: '#/components/schemas/DomainBlockImportSkipped'
    DomainBlockImportRow:
      description: A row of a domain block CSV and what importing it would do.
      type: object
      required:
        - line
        - written_domain
        - status
        - issue
      properties:
        line:
          description: The line of the file the row starts on, from 1.
          type: integer
          minimum: 1
        written_domain:
          description: The domain as written in the row.
          type: string
        block:
          description: |
            The row, with its domain normalized (IDNA A-labels in lower case); absent when
            the row is `invalid`. The import takes it as it is.
          $ref: '#/components/schemas/DomainBlock'
        status:
          $ref: '#/components/schemas/DomainBlockImportStatus'
        issue:
          description: The kinds of the actions the import would issue; empty unless `importable`.
          type: array
          items:
            $ref: '#/components/schemas/AdminDomainActionKind'
    DomainBlockImportSkipped:
      description: A block of an import that issued nothing.
      type: object
      required:
        - domain
        - reason
      properties:
        domain:
          description: The domain as sent.
          type: string
        reason:
          description: Why it issued nothing; never `importable`.
          $ref: '#/components/schemas/DomainBlockImportStatus'
    DomainBlockImportStatus:
      description: |
        What importing a row would do. `importable`: it issues the actions of `issue`.
        `already_applied`: an action in effect of each of the row's kinds covers the domain
        already, on it or on a parent domain. `no_action`: the row stands for no action (a
        `noop` without rejections). `duplicate`: an earlier row has the same domain once
        normalized. `invalid`: the domain, the severity, or the public comment is not valid.
      type: string
      enum:
        - importable
        - already_applied
        - no_action
        - duplicate
        - invalid
    DomainBlockSeverity:
      description: |
        The `#severity` of Mastodon's domain block CSV. `suspend`: the action `suspend`.
        `silence`: Mastodon's name of the action `limit`. `noop`: no action but the rejections.
      type: string
      enum:
        - suspend
        - silence
        - noop
    DomainMute:
      description: A domain that the viewer mutes, with its subdomains.
      type: object
      required:
        - domain
        - created_at
      properties:
        domain:
          description: The domain, in IDNA A-labels.
          type: string
        created_at:
          description: When the viewer muted the domain.
          type: string
          format: date-time
    DomainMutePage:
      description: A page of domain mutes.
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required:
            - domain_mutes
          properties:
            domain_mutes:
              type: array
              items:
                $ref: '#/components/schemas/DomainMute'
    EditStatusRequest:
      description: The new content of a status.
      type: object
      required:
        - text
      properties:
        text:
          $ref: '#/components/schemas/StatusText'
        spoiler_text:
          $ref: '#/components/schemas/SpoilerText'
        sensitive:
          description: Whether the media are sensitive.
          type: boolean
        language:
          $ref: '#/components/schemas/StatusLanguageInput'
        media:
          $ref: '#/components/schemas/StatusMediaInput'
        remove_quote:
          description: |
            Takes the status's quote away for good (ADR-0069 §3). A status keeps the status it
            quotes otherwise: an edit cannot change it.
          type: boolean
    EnableTotpRequest:
      description: The setup to enroll and a code of the app that shows it has the secret.
      type: object
      required:
        - setup_token
        - code
      properties:
        setup_token:
          description: The `setup_token` of `POST /two_factor/totp/setup`.
          type: string
          maxLength: 1024
        code:
          description: The six-digit code that the app shows now.
          type: string
          maxLength: 64
    FinanceCostItemLine:
      description: |
        The amount of a cost item, or of a service of the imported costs, in a currency over a
        period, with the provider and the category of its breakdown line. `provider` is the spelling
        that the period's breakdown lines of the item's grouped provider show (`CostBreakdownLine`).
        `name` is the item's name or the service, present only while the instance shows the names;
        `memo` is the item's memo, present only while the instance shows the memos and the item has
        one (an imported cost has none).
      type: object
      required:
        - provider
        - category
        - amount
      properties:
        provider:
          type: string
        category:
          $ref: '#/components/schemas/CostCategory'
        amount:
          $ref: '#/components/schemas/Money'
        name:
          type: string
        memo:
          type: string
    FinanceCostPeriodTotal:
      description: |
        A week, month, or year of the totals, as in `CostPeriodTotal`, with the item lines of the
        period: empty unless the instance shows the names or the memos of the items, and sorted by
        provider, category, name, and currency; without the names, by provider,
        category, currency, and the larger amount first.
      type: object
      required:
        - label
        - starts_on
        - ends_on
        - totals
        - breakdown
        - estimated
        - items
      properties:
        label:
          type: string
        starts_on:
          $ref: '#/components/schemas/CalendarDate'
        ends_on:
          $ref: '#/components/schemas/CalendarDate'
        totals:
          type: array
          items:
            $ref: '#/components/schemas/Money'
        breakdown:
          type: array
          items:
            $ref: '#/components/schemas/CostBreakdownLine'
        estimated:
          type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/FinanceCostItemLine'
    FinanceCostTotals:
      description: |
        The totals of the instance's costs as the holders of `view_finance` read them over the
        periods from the one that holds `from` to the one that holds `to`, oldest first, and the
        instance settings that decide what they read (ADR-0070 §5).
      type: object
      required:
        - granularity
        - basis
        - periods
        - rules
        - viewer
      properties:
        granularity:
          $ref: '#/components/schemas/CostGranularity'
        basis:
          $ref: '#/components/schemas/CostBasis'
        periods:
          type: array
          items:
            $ref: '#/components/schemas/FinanceCostPeriodTotal'
        rules:
          $ref: '#/components/schemas/CostTotalsRules'
        viewer:
          $ref: '#/components/schemas/FinanceViewerSettings'
    FinanceViewerIncome:
      description: |
        How much of the income the holders of `view_finance` read (the instance setting
        `finance_viewer_income`, ADR-0070 §5). `totals`: the total of each currency by period;
        `plans`: also the number of members of each plan. No value shows the amounts of each plan or
        who paid.
      type: string
      enum:
        - totals
        - plans
    FinanceViewerSettings:
      description: |
        What the holders of `view_finance` read of the instance's finances beyond the totals and
        their breakdown (the instance settings of ADR-0070 §5): `item_names`
        (`finance_viewer_item_names`) shows the names of the cost items and the services of the
        imported costs, `item_memos` (`finance_viewer_item_memos`) the memos of the cost items, and
        `income` (`finance_viewer_income`) the income as totals only or with the number of members
        of each plan.
      type: object
      required:
        - item_names
        - item_memos
        - income
      properties:
        item_names:
          type: boolean
        item_memos:
          type: boolean
        income:
          $ref: '#/components/schemas/FinanceViewerIncome'
    FinanceVisibility:
      description: |
        How much of the instance's costs everyone may read (the instance setting
        `finance_visibility`, FR-903, ADR-0067 §8). `private`: nothing, and
        `GET /instance/cost_totals` is a 404; `totals`: the total of each currency by period;
        `breakdown`: the totals and their breakdown by provider and category. No level publishes
        the names, memos, or individual payments of the cost items.
      type: string
      enum:
        - private
        - totals
        - breakdown
    FollowAccountRequest:
      description: The viewer's preferences of the follow; a preference left out keeps its value.
      type: object
      properties:
        show_boosts:
          description: Show the account's boosts in the home timeline. New follows show them.
          type: boolean
        notify:
          description: Notify the viewer of the account's new posts. New follows do not.
          type: boolean
    Id:
      description: The ID of a resource, a UUIDv7 in its canonical string form.
      type: string
      format: uuid
      examples:
        - 01890a5d-ac96-774b-bcce-b302099a8057
      x-go-type: string
    ImportDomainBlocksRequest:
      description: The rows of a domain block CSV to import.
      type: object
      required:
        - blocks
      properties:
        blocks:
          type: array
          maxItems: 5000
          items:
            $ref: '#/components/schemas/DomainBlock'
        private_note:
          description: The private note of every action issued.
          type: string
          maxLength: 5000
    ImportSignupBlocksRequest:
      description: A list of values to block sign-ups by, all with the same settings.
      type: object
      required:
        - kind
        - text
        - severity
      properties:
        kind:
          $ref: '#/components/schemas/AdminSignupBlockKind'
        text:
          description: |
            The list: one value per line, or a CSV row whose first field is the value; blank
            lines and lines starting with `#` are ignored. At most 10,000 values.
          type: string
        severity:
          $ref: '#/components/schemas/AdminSignupBlockSeverity'
        comment:
          description: The comment of every block added.
          type: string
          maxLength: 1000
        expires_in:
          description: The seconds each block lasts; omitted, they last until they are lifted.
          type: integer
          minimum: 1
    IncomeKind:
      description: |
        The kind of a money movement of the payment provider (ADR-0073 §2): `payment` of a
        subscription, `refund` and `chargeback` of a payment (a negative gross), the
        `chargeback_reversal` that gives a chargeback back, and a `fee` of the provider that
        belongs to no payment (a zero gross and a negative net).
      type: string
      enum:
        - payment
        - refund
        - chargeback
        - chargeback_reversal
        - fee
    IncomeMovement:
      description: |
        A money movement of the payment provider as the income records keep it (ADR-0073 §2, §6):
        recorded once its amounts are final, and never edited. `occurred_on` is `occurred_at` as a
        date in the provider's reporting time zone. A payment carries the billing period it pays
        for (`covers_starts_on` to `covers_ends_on`) when it has one; a refund, a chargeback, or a
        reversal carries the provider ID of its payment (`parent_provider_id`). `subscription_id`
        names the subscription while it is known, and `account_id` and `username` its subscriber's
        local account while the account exists; a fee of no subscription has none of them.
      type: object
      required:
        - id
        - provider
        - provider_id
        - kind
        - occurred_at
        - occurred_on
        - gross
        - fee
        - net
        - recorded_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        provider:
          type: string
        provider_id:
          type: string
        kind:
          $ref: '#/components/schemas/IncomeKind'
        parent_provider_id:
          type: string
        subscription_id:
          $ref: '#/components/schemas/Id'
        account_id:
          $ref: '#/components/schemas/Id'
        username:
          description: The subscriber's username; omitted with `account_id` for an erased account.
          type: string
        occurred_at:
          type: string
          format: date-time
        occurred_on:
          $ref: '#/components/schemas/CalendarDate'
        covers_starts_on:
          $ref: '#/components/schemas/CalendarDate'
        covers_ends_on:
          $ref: '#/components/schemas/CalendarDate'
        gross:
          $ref: '#/components/schemas/Money'
        fee:
          $ref: '#/components/schemas/Money'
        net:
          $ref: '#/components/schemas/Money'
        recorded_at:
          type: string
          format: date-time
    IncomeMovementPage:
      description: A page of money movements, newest first.
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/IncomeMovement'
    IncomePeriodTotal:
      description: |
        A week, month, or year of the income totals (`label`: `2026-W17`, `2026-04`, or `2026`):
        the net income of each currency (what the payments brought less the provider's fees and the
        refunds), never converted, sorted by currency code. `balance` is the net less the costs of
        each currency under the same basis, present only where the balance is shown: a currency of
        one side alone shows that side's amount.
      type: object
      required:
        - label
        - starts_on
        - ends_on
        - net
      properties:
        label:
          type: string
        starts_on:
          $ref: '#/components/schemas/CalendarDate'
        ends_on:
          $ref: '#/components/schemas/CalendarDate'
        net:
          type: array
          items:
            $ref: '#/components/schemas/Money'
        balance:
          type: array
          items:
            $ref: '#/components/schemas/Money'
    IncomePlanCount:
      description: |
        The number of members of a supporter plan now (ADR-0073 §7): the subscriptions that hold
        the plan's role (active, canceling, or past due within the grace period). A retired plan
        appears while it has members. Never the plan's amounts.
      type: object
      required:
        - plan_id
        - name
        - members
      properties:
        plan_id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        members:
          type: integer
          format: int64
          minimum: 0
    IncomeProviderRule:
      description: |
        The IANA time zone (`UTC`, `Asia/Tokyo`) in which a payment provider's money movements fall
        on their dates: the provider's reporting time zone, or `UTC` when it could not be read
        (ADR-0073 §3).
      type: object
      required:
        - provider
        - time_zone
      properties:
        provider:
          type: string
        time_zone:
          type: string
    IncomeTotals:
      description: |
        The income totals over the periods from the one that holds `from` to the one that holds
        `to`, oldest first (ADR-0073 §9). `plans`, the number of members of each supporter plan
        now, is present only where the plans are shown. No answer carries individual payments, the
        subscribers, the amounts of each plan, or the gross and the fees.
      type: object
      required:
        - granularity
        - basis
        - periods
        - rules
      properties:
        granularity:
          $ref: '#/components/schemas/CostGranularity'
        basis:
          $ref: '#/components/schemas/CostBasis'
        periods:
          type: array
          items:
            $ref: '#/components/schemas/IncomePeriodTotal'
        plans:
          type: array
          items:
            $ref: '#/components/schemas/IncomePlanCount'
        rules:
          $ref: '#/components/schemas/IncomeTotalsRules'
    IncomeTotalsRules:
      description: |
        How the income totals cut the periods and place the payments (ADR-0073 §3, §5), to show
        next to them: by calendar date without a time zone, weeks from `week_start` (ISO 8601),
        each money movement on its date in its payment provider's reporting time zone
        (`providers`), and under the `amortized` basis a payment that covers more than
        `amortize_after_days` days spread by day over the days it covers, with its refunds and
        chargebacks taking back the days before them on their own date and cancelling the later
        ones.
      type: object
      required:
        - week_start
        - providers
        - amortize_after_days
      properties:
        week_start:
          type: string
          enum:
            - monday
        providers:
          type: array
          items:
            $ref: '#/components/schemas/IncomeProviderRule'
        amortize_after_days:
          type: integer
    IncomeVisibility:
      description: |
        How much of the instance's income everyone may read (the instance setting
        `income_visibility`, FR-917, ADR-0073 §7), apart from `finance_visibility`. `private`:
        nothing, and `GET /instance/income_totals` is a 404; `totals`: the net income of each
        currency by period; `plans`: also the number of members of each supporter plan now. No
        level publishes individual payments, the subscribers, the amounts of each plan, or the
        gross and the fees.
      type: string
      enum:
        - private
        - totals
        - plans
    Instance:
      description: Public information about the instance.
      type: object
      required:
        - domain
        - name
        - version
        - source_url
        - registrations
        - limits
        - timelines
        - federation
        - sends_email
        - rules
        - search_indexing
        - ai_usage
        - finance_visibility
        - income_visibility
        - supporters_enabled
        - supporter_list_visibility
      properties:
        domain:
          description: The domain that serves the instance.
          type: string
        name:
          description: The display name of the instance; the domain when the instance has none.
          type: string
        short_description:
          description: A one-paragraph summary of the instance, as plain text; omitted when there is none.
          type: string
        description:
          description: The full description of the instance, as plain text; omitted when there is none.
          type: string
        registrations:
          $ref: '#/components/schemas/InstanceRegistrations'
        version:
          description: The server version.
          type: string
        source_url:
          description: Where users get the source code of the running server (AGPL-3.0 section 13), as an https URL to read it at or a mailto URI to request it by email.
          type: string
          format: uri
        limits:
          $ref: '#/components/schemas/InstanceLimits'
        timelines:
          $ref: '#/components/schemas/InstanceTimelines'
        federation:
          $ref: '#/components/schemas/InstanceFederation'
        sends_email:
          description: |
            Whether the instance sends email (the server setting `mail` is not `none`). Without
            email, the moderator notifications come only in the app, so clients do not offer
            the preference `email_moderator_notifications`.
          type: boolean
        push_server_key:
          description: |
            The instance's VAPID public key (RFC 8292), an uncompressed P-256 point in unpadded
            base64url: the `applicationServerKey` that browsers subscribe with before
            `putPushSubscription`. Omitted when the instance sends no Web Push.
          type: string
        rules:
          description: The rules in effect, in order.
          type: array
          items:
            $ref: '#/components/schemas/InstanceRule'
        terms_url:
          description: |
            The web client's page of the instance's terms of service (`/about/terms`), which needs no
            sign-in and shows `GET /instance/documents/terms`; omitted when the instance has none,
            so that clients do not link to it.
          type: string
          format: uri
        privacy_policy_url:
          description: |
            The web client's page of the instance's privacy policy (`/about/privacy`), which needs no
            sign-in and shows `GET /instance/documents/privacy_policy`; omitted when the instance has
            none.
          type: string
          format: uri
        commerce_disclosure_url:
          description: |
            The web client's page of the commerce disclosures of the supporter plans (`/about/commerce`,
            the URL that the operators give the payment provider), which needs no sign-in and shows
            `GET /instance/documents/commerce_disclosure`; omitted when the instance has none.
          type: string
          format: uri
        supporters_enabled:
          description: |
            Whether the supporter program is enabled: its plans (`GET /instance/supporter_plans`)
            and the subscriptions show only then.
          type: boolean
        supporter_list_visibility:
          $ref: '#/components/schemas/SupporterListVisibility'
        theme:
          $ref: '#/components/schemas/InstanceTheme'
        contact:
          $ref: '#/components/schemas/InstanceContact'
        thumbnail:
          $ref: '#/components/schemas/InstanceThumbnail'
        search_indexing:
          $ref: '#/components/schemas/SearchIndexing'
        ai_usage:
          $ref: '#/components/schemas/AIUsage'
        finance_visibility:
          $ref: '#/components/schemas/FinanceVisibility'
        income_visibility:
          $ref: '#/components/schemas/IncomeVisibility'
    InstanceContact:
      description: |
        How people reach the instance's operators (the instance settings `contact_account` and
        `contact_email`). Omitted when the instance has neither.
      type: object
      properties:
        account:
          description: |
            The local account to contact; omitted when there is none, or when the account
            cannot be shown (it is suspended or deleted).
          allOf:
            - $ref: '#/components/schemas/Account'
        email:
          description: The email address to contact; omitted when there is none.
          type: string
    InstanceDomainAction:
      description: A moderation action in effect on a remote domain and its subdomains, as the instance lists it publicly (FR-718).
      type: object
      required:
        - domain
        - digest
        - kind
      properties:
        domain:
          description: |
            The domain, in IDNA A-labels. When the moderators chose to obfuscate it, the
            characters of its middle half other than dots are replaced with `*`.
          type: string
        digest:
          description: The SHA-256 of the domain (not obfuscated) in lower-case hexadecimal, to check a known domain against an obfuscated item.
          type: string
          pattern: ^[0-9a-f]{64}$
        kind:
          description: |
            `suspend`: no federation with the domain at all. `limit`: its posts stay off the
            public timelines and its accounts reach only their followers.
          type: string
          enum:
            - limit
            - suspend
        comment:
          description: The public reason for the action; omitted when there is none or the viewer may not read it.
          type: string
    InstanceDomainActionPage:
      description: A page of public domain actions, newest first.
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/InstanceDomainAction'
    InstanceFederation:
      description: |
        How the instance federates with other servers (FR-413), so that clients offer only the
        operations on remote accounts and posts that can work.
      type: object
      required:
        - mode
      properties:
        mode:
          description: |
            The direction the instance federates in (the instance setting `federation_mode`):

            - `off`: neither way. Following, looking up with `resolve`, and quoting remote
              accounts and posts are refused with the 403 `/api/v1/problems/federation-restricted`.
            - `inbound`: the instance follows and reads remote accounts but sends none of the local
              posts, profiles, and reactions out. Favourites, boosts, reactions, and replies to
              remote posts are recorded here but do not reach their servers; quoting a remote post
              is refused with the 403 `/api/v1/problems/federation-restricted`, since the quote
              request cannot be sent.
            - `outbound`: the instance delivers the local posts to remote followers but takes none
              of the remote posts and reactions in. Following and resolving remote accounts are
              refused with the 403 `/api/v1/problems/federation-restricted`.
            - `both`: both ways.
          type: string
          enum:
            - 'off'
            - inbound
            - outbound
            - both
    InstanceLimits:
      description: Limits that clients check before sending a request.
      type: object
      required:
        - max_post_characters
        - require_media_description
      properties:
        max_post_characters:
          description: The maximum number of characters in the text and content warning of a post.
          type: integer
          minimum: 1
        require_media_description:
          description: |
            Whether every media file attached to a post needs an alternative text (the instance
            setting `require_media_description`, FR-105). While it is on, a post or an edit with
            a media file without one is a 422, so clients ask for it before sending.
          type: boolean
    InstanceRegistrations:
      description: How people sign up on the instance.
      type: object
      required:
        - mode
      properties:
        mode:
          description: |
            Who may sign up: `open` (anyone), `approval` (sign-ups wait for a moderator's
            approval), `invite` (only with an invite), or `closed` (nobody).
          type: string
          enum:
            - open
            - approval
            - invite
            - closed
    InstanceRule:
      description: |
        A rule of the instance (FR-705). Its text and hint hold one value each, written in any
        language and the same in every locale. Reports cite it by `id`.
      type: object
      required:
        - id
        - text
      properties:
        id:
          $ref: '#/components/schemas/Id'
        text:
          description: The rule, on one line, as plain text.
          type: string
        hint:
          description: An explanation of the rule, as plain text; omitted when there is none.
          type: string
    InstanceRuleInput:
      description: |
        The text and the hint of a rule, written once in any language and shown as they are in
        every locale; they replace the earlier ones.
      type: object
      required:
        - text
      properties:
        text:
          description: The rule, on one line, as plain text.
          type: string
          minLength: 1
          maxLength: 300
        hint:
          description: An explanation of the rule, as plain text; omitted or empty for none.
          type: string
          maxLength: 1000
    InstanceDocument:
      description: |
        A document that the instance has published, rendered for reading. The administrators write
        it once, in any language, so every locale gets the same text.
      type: object
      required:
        - kind
        - html
        - revised_at
      properties:
        kind:
          $ref: '#/components/schemas/InstanceDocumentKind'
        html:
          description: |
            The document as HTML, which the server renders from the administrators' Markdown and
            sanitizes (headings from `h2`, paragraphs, lists, quotes, code, rules, tables, and links
            to `http`, `https` and `mailto`; no raw HTML, scripts or images). Clients put it in the
            page as it is. The language of the text is unknown: mark it `lang=""`.
          type: string
        revised_at:
          description: When the current revision of the document was recorded.
          type: string
          format: date-time
    InstanceDocumentKind:
      description: |
        The kind of an instance document: the terms of service, the privacy policy, and the
        commerce disclosures of the supporter plans. Each is the instance text of the same name
        (`terms`, `privacy_policy`, `commerce_disclosure`).
      type: string
      enum:
        - terms
        - privacy_policy
        - commerce_disclosure
    InstanceSettingKey:
      description: |
        The key of an instance setting (docs/operations/instance-settings.md). New keys may be
        added; clients show the ones they know.
      type: string
      enum:
        - registration_mode
        - max_status_length
        - default_locale
        - local_timeline_access
        - federated_timeline_access
        - preview_image
        - contact_account
        - contact_email
        - thumbnail
        - remote_media_policy
        - remote_media_cache_ttl
        - authorized_fetch
        - domain_actions_visibility
        - domain_actions_rationale_visibility
        - appeal_window
        - retention_session_origins
        - retention_registration_origins
        - retention_reports
        - retention_moderation_actions
        - retention_audit_log
        - search_indexing
        - ai_usage
        - indexable_default
        - security_contact
        - require_media_description
        - link_cards_enabled
        - finance_visibility
        - finance_viewer_item_names
        - finance_viewer_item_memos
        - finance_viewer_income
        - supporter_list_visibility
        - income_visibility
        - federation_mode
        - user_app_registration
        - dynamic_client_registration
        - oauth_metadata_document_clients
    InstanceSettingKind:
      description: |
        The type of a setting's value. `bool`: `true` or `false`. `int`: a decimal integer from
        `minimum` to `maximum`. `enum`: one of `choices`. `locale`: a BCP 47 language tag.
        `media`: the ID of an image uploaded with `POST /media`, or empty for none. `account`:
        the username of a local account, or empty for none. `email`: an email address such as
        `admin@example.com`, or empty for none. `uri`: an `https:` or `mailto:` URI, or empty for
        none.
      type: string
      enum:
        - bool
        - int
        - enum
        - locale
        - media
        - account
        - email
        - uri
    InstanceTextKey:
      description: |
        The key of an instance text: the name (one line), the short and full descriptions,
        the terms of service and the privacy policy (Markdown), the alternative texts of the
        preview image and the thumbnail, and the commerce disclosures of the supporter plans
        (Markdown, shown at `/about/commerce`; the server does not vouch for what they say).
      type: string
      enum:
        - name
        - short_description
        - description
        - terms
        - privacy_policy
        - preview_image_alt
        - thumbnail_alt
        - commerce_disclosure
    InstanceTheme:
      description: |
        The instance's theme (ADR-0059), for clients that do not load the server's HTML shell: the
        stylesheet to apply and the overridden tokens. `Instance.theme` omits it when the
        instance has no theme.
      type: object
      required:
        - revision
        - stylesheet_url
        - tokens
      properties:
        revision:
          type: string
        stylesheet_url:
          type: string
          format: uri
        tokens:
          type: array
          items:
            $ref: '#/components/schemas/ThemeTokenValue'
    InstanceThumbnail:
      description: |
        The image that represents the instance (the instance setting `thumbnail`): the large still
        variant of the media file. Omitted when there is none, or while the file is processing.
      type: object
      required:
        - url
        - width
        - height
      properties:
        url:
          type: string
          format: uri
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        alt:
          description: |
            The alt text (the instance text `thumbnail_alt`); omitted when there is none.
          type: string
    InstanceTimelines:
      description: |
        Who may read the public timelines the instance serves (FR-202): `local` is the instance
        setting `local_timeline_access` of `GET /timelines/local`, and `federated` the instance
        setting `federated_timeline_access` of `GET /timelines/public`. Clients do not offer a
        timeline that is `off`, nor one that is `logged_in` to a visitor who is not logged in.
      type: object
      required:
        - local
        - federated
      properties:
        local:
          $ref: '#/components/schemas/TimelineAccess'
        federated:
          $ref: '#/components/schemas/TimelineAccess'
    IssueOAuthAppTokenRequest:
      description: The scope of the tokens of an app for the authenticated user.
      type: object
      properties:
        scope:
          description: Space-separated scopes within the app's; omitted or empty, the app's whole scope.
          type: string
    LiftAccountActionRequest:
      description: Why an action on an account is lifted.
      type: object
      properties:
        reason:
          type: string
          maxLength: 5000
    LinkCard:
      description: |
        The card of the first link in a status (ADR-0062): the title, description, and image
        that the linked page declares (Open Graph, X Card, and JSON-LD), fetched by the server
        after the status was posted or received. Omitted from a status with attachments or a
        poll, from a status whose link has no card yet, and when the instance setting
        `link_cards_enabled` is off. A card appears after its fetch, so a status read right after
        it was posted may have none.

        Clients show the card as one link to `url` and, under a content warning, only once the
        warning is opened. When the status is `sensitive`, the image is hidden until the viewer
        shows it.
      type: object
      required:
        - url
        - title
        - description
        - site_name
      properties:
        url:
          description: The page that the card links to, after redirects.
          type: string
          format: uri
        title:
          description: The title of the page, as plain text.
          type: string
        description:
          description: The description of the page, as plain text; empty when it has none.
          type: string
        site_name:
          description: The name of the site, as plain text; the host of `url` when the page names none.
          type: string
        author_name:
          description: The author that the page names, as plain text; omitted when it names none.
          type: string
        published_at:
          description: When the page says it was published; omitted when it does not say.
          type: string
          format: date-time
        language:
          description: The BCP 47 language of the page; omitted when it does not say.
          type: string
        image:
          $ref: '#/components/schemas/LinkCardImage'
        author:
          description: |
            The account that the page names as its creator (`fediverse:creator`), given only when
            the account's server lists the page's domain among its `attributionDomains`.
          $ref: '#/components/schemas/Account'
    LinkCardImage:
      description: |
        The image of a link card, served by this server's media proxy in the small size of an
        attachment's image. An animated image is its first frame.
      type: object
      required:
        - url
        - width
        - height
      properties:
        url:
          description: The image through the media proxy.
          type: string
          format: uri
        width:
          description: The width of the original image in pixels.
          type: integer
          minimum: 1
        height:
          description: The height of the original image in pixels.
          type: integer
          minimum: 1
        blurhash:
          description: The blurhash (https://blurha.sh) of the image, to show while it loads.
          type: string
        description:
          description: The alternative text of the image (`og:image:alt`); omitted when it has none.
          type: string
    MediaAnimatedVariants:
      description: |
        The moving renditions of an animation, absent for a still image: animated WebP for
        `small` and `medium`, and a GIF for `large`.
      type: object
      required:
        - small
        - medium
        - large
      properties:
        small:
          $ref: '#/components/schemas/MediaVariant'
        medium:
          $ref: '#/components/schemas/MediaVariant'
        large:
          $ref: '#/components/schemas/MediaVariant'
    MediaAttachment:
      description: |
        A media file, as an upload of the user (the media operations) or as an attachment of
        a status (`Status.media_attachments`). `url`, `preview_url`, `variants`, and `blurhash`
        are present once the file is `ready`; statuses attach only ready files. In a status,
        `description` is the status revision's own copy of the alternative text, absent when the
        attachment has none.

        A file of a remote status is always `ready`: the instance does not process it, so it has
        no `variants`; `url` and `preview_url` are its media proxy URLs (federation.md §9),
        `remote_url` its URL on the remote server, and `meta`, `blurhash`, and `type` what the
        remote server declared.
      type: object
      required:
        - id
        - type
        - state
        - meta
      properties:
        id:
          $ref: '#/components/schemas/Id'
        type:
          description: |
            The kind of media. An accepted upload is an `image`, a `video`, or an `audio` file;
            a file that failed processing is `unknown`. `gifv` is a remote video that plays like
            an animated image: muted, looped, without controls.
          type: string
          enum:
            - image
            - gifv
            - video
            - audio
            - unknown
        state:
          description: |
            The processing state: `processing` until the server has re-encoded the file,
            then `ready`, or `failed` when the content could not be processed.
          type: string
          enum:
            - processing
            - ready
            - failed
        description:
          description: The alternative text; absent when there is none.
          type: string
          maxLength: 1500
        blurhash:
          description: The blurhash (https://blurha.sh) of the image, to show while it loads.
          type: string
        meta:
          $ref: '#/components/schemas/MediaMeta'
        variants:
          $ref: '#/components/schemas/MediaVariants'
        url:
          description: |
            Where the file is served on this instance; for an upload, `variants.large.url`, or
            `variants.animated.large.url` for an animation, and the file itself for a video or
            audio file.
          type: string
          format: uri
        preview_url:
          description: |
            Where its preview is served; for an upload, `variants.small.url` (still). A video or
            audio file without a poster has none.
          type: string
          format: uri
        remote_url:
          description: The file's URL on the remote server, for a file of a remote status; clients load `url` instead.
          type: string
          format: uri
    MediaFocus:
      description: |
        The focal point that previews keep in view when they crop the image, from -1.0 (left,
        bottom) to 1.0 (right, top) on each axis; (0, 0) is the center.
      type: object
      required:
        - x
        - 'y'
      properties:
        x:
          type: number
          format: double
          minimum: -1
          maximum: 1
        'y':
          type: number
          format: double
          minimum: -1
          maximum: 1
    MediaMeta:
      description: What the server knows about the media file.
      type: object
      required:
        - focus
      properties:
        width:
          description: The width of the original image in pixels, after its EXIF orientation; absent until the file is ready, and for a remote file whose server declared none.
          type: integer
          minimum: 1
        height:
          description: The height of the original image in pixels, after its EXIF orientation; absent until the file is ready, and for a remote file whose server declared none.
          type: integer
          minimum: 1
        focus:
          $ref: '#/components/schemas/MediaFocus'
        duration:
          description: The length of a video or audio file in seconds; absent for an image and until the file is ready.
          type: number
          format: double
          minimum: 0
    MediaUpdate:
      description: The changes to a media file; a property left out keeps its value.
      type: object
      properties:
        description:
          description: The alternative text; an empty string removes it. Text with U+0000 is a 422.
          type: string
          maxLength: 1500
        focus:
          $ref: '#/components/schemas/MediaFocus'
    MediaUpload:
      description: An upload of a media file.
      type: object
      required:
        - file
      properties:
        file:
          description: The file. Its declared type, if any, must match its content.
          type: string
          format: binary
        description:
          description: The alternative text. Text that is not UTF-8 or has U+0000 is a 422.
          type: string
          maxLength: 1500
        purpose:
          description: |
            What the file is for, which picks the sizes of its variants: an `attachment` of a
            post (within 640 × 360, 1920 × 1080, and 3840 × 2160 pixels of area), an `avatar`
            (cropped to squares of 96, 192, and 400 pixels around the focal point), a `header`
            (within 750 × 250, 1500 × 500, and 3000 × 1000), or a custom `emoji` (within 64,
            128, and 256 pixels).
          type: string
          enum:
            - attachment
            - avatar
            - header
            - emoji
          default: attachment
        thumbnail:
          description: |
            The poster of a video or audio file: an image that it shows before it plays, which
            the client takes from the file. Its declared type is ignored; it must be an image
            within the image limits. It is ignored for an image.
          type: string
          format: binary
    MediaVariant:
      description: |
        A rendition of a media file, without metadata. Its URL never serves other content, so
        it may be cached for good. `content_type`, `width`, `height`, and `size` are present
        for an upload, and absent where unknown for a remote file served through the media
        proxy.
      type: object
      required:
        - url
      properties:
        url:
          description: Where the rendition is served.
          type: string
          format: uri
        content_type:
          description: The media type of the rendition.
          type: string
        width:
          description: The width in pixels.
          type: integer
          minimum: 1
        height:
          description: The height in pixels.
          type: integer
          minimum: 1
        size:
          description: The size of the file in bytes.
          type: integer
          format: int64
          minimum: 1
    MediaVariants:
      description: |
        The renditions of a ready media file within the sizes of its purpose (see
        `MediaUpload.purpose`), never larger than the file. `small`, `medium`, and `large` are
        still: for an animation, its first frame, and for a video or audio file, its poster
        (absent without one). Clients pick one by its width (`srcset`), and
        show `animated` instead only when the user lets animations play and does not prefer
        reduced motion.
      type: object
      required:
        - small
        - medium
        - large
      properties:
        small:
          description: The still rendition for small views; WebP for an upload.
          $ref: '#/components/schemas/MediaVariant'
        medium:
          description: The still rendition for views across a screen; WebP for an upload.
          $ref: '#/components/schemas/MediaVariant'
        large:
          description: The largest still rendition, JPEG or PNG for an upload.
          $ref: '#/components/schemas/MediaVariant'
        animated:
          $ref: '#/components/schemas/MediaAnimatedVariants'
    ModerationAction:
      description: |
        A moderation action on the authenticated user's own account (FR-715, NFR-MOD-6), as the
        user sees it. It never carries the moderators' private note, the report the action
        follows from, or who filed the report or issued the action.
      type: object
      required:
        - id
        - kind
        - kind_label
        - reason_category
        - reason_category_label
        - status_ids
        - state
        - issued_at
        - appealable
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
          $ref: '#/components/schemas/AdminAccountActionKind'
        kind_label:
          description: What the action does, in the user's language.
          type: string
        reason_category:
          $ref: '#/components/schemas/AdminAccountActionCategory'
        reason_category_label:
          description: The reason category, in the user's language.
          type: string
        public_reason:
          description: |
            The moderators' explanation to the user, as plain text; omitted when there is none.
          type: string
        status_ids:
          description: |
            The posts that an action on posts acted on; empty for an action on the whole account.
          type: array
          items:
            $ref: '#/components/schemas/Id'
        state:
          $ref: '#/components/schemas/AdminAccountActionState'
        issued_at:
          type: string
          format: date-time
        expires_at:
          description: When the action ends by itself; omitted when it lasts until it is lifted.
          type: string
          format: date-time
        lifted_at:
          description: When a moderator lifted the action; omitted unless it is lifted.
          type: string
          format: date-time
        appealable:
          description: |
            Whether the user can appeal the action now (`POST /moderation/actions/{id}/appeal`):
            it has no appeal yet, `appeal_deadline` has not passed, and for a `ban` the account
            is not deleted.
          type: boolean
        appeal_deadline:
          description: |
            The last moment the action can be appealed: the instance's appeal window from the
            action, and for a `ban` no later than the deletion of the account.
          type: string
          format: date-time
        appeal:
          description: The user's appeal of the action; omitted when there is none.
          $ref: '#/components/schemas/ModerationAppeal'
    ModerationActionPage:
      description: A page of the actions on the user's own account, newest first.
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ModerationAction'
    ModerationAppeal:
      description: |
        The authenticated user's appeal of an action on their account. It never names the
        moderator who decided it.
      type: object
      required:
        - id
        - text
        - state
        - submitted_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        text:
          description: What the user wrote, as plain text.
          type: string
        state:
          $ref: '#/components/schemas/ModerationAppealState'
        submitted_at:
          type: string
          format: date-time
        decided_at:
          description: When the moderators decided the appeal; omitted while pending.
          type: string
          format: date-time
        decision_reason:
          description: The moderators' explanation of the decision, as plain text; omitted when there is none.
          type: string
    ModerationAppealState:
      description: |
        Where an appeal stands: `pending` awaits the moderators, `upheld` kept the action, and
        `overturned` lifted it.
      type: string
      enum:
        - pending
        - upheld
        - overturned
    Money:
      description: |
        An amount of money (ADR-0067 §9): a decimal string in the major unit with the digits of
        its currency (`12.34` USD, `1650` JPY), never a JSON number, and its ISO 4217 code.
      type: object
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: ^-?[0-9]+(\.[0-9]+)?$
        currency:
          type: string
          pattern: ^[A-Z]{3}$
    MoveInstanceRuleRequest:
      description: The new place of a rule.
      type: object
      required:
        - position
      properties:
        position:
          description: The place among the rules in effect, from 1.
          type: integer
          minimum: 1
    MuteAccountRequest:
      description: The settings of a mute.
      type: object
      properties:
        notifications:
          description: Also hide the account's notifications.
          type: boolean
          default: true
        duration:
          description: How long the mute lasts, in seconds; 0 mutes until unmuted.
          type: integer
          minimum: 0
          maximum: 31536000
          default: 0
    MuteDomainRequest:
      description: The domain to mute.
      type: object
      required:
        - domain
      properties:
        domain:
          description: A remote domain, such as `mastodon.example`; its subdomains are muted too.
          type: string
          minLength: 1
          maxLength: 253
    MutePage:
      description: A page of mutes.
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required:
            - mutes
          properties:
            mutes:
              type: array
              items:
                $ref: '#/components/schemas/MutedAccount'
    MutedAccount:
      description: An account that the viewer mutes, with the mute's settings.
      type: object
      required:
        - account
        - notifications
      properties:
        account:
          $ref: '#/components/schemas/Account'
        notifications:
          description: Whether the mute also hides the account's notifications.
          type: boolean
        expires_at:
          description: When the mute ends; left out for a mute until unmuted.
          type: string
          format: date-time
    NewCustomEmojiRequest:
      description: |
        A new custom emoji request: `create` takes the `shortcode` of the new emoji, and `image` the
        `emoji_id` of a local emoji that the user made. `media_id` is an upload of the user that
        finished processing (upload it with the `emoji` purpose), under the rules of the image of a
        custom emoji.
      type: object
      required:
        - kind
        - media_id
      properties:
        kind:
          $ref: '#/components/schemas/CustomEmojiRequestKind'
        shortcode:
          description: For `create`, 2 to 30 letters (A to Z, a to z), digits, and underscores; case matters.
          type: string
          minLength: 2
          maxLength: 30
        emoji_id:
          description: For `image`, the emoji whose image the request replaces.
          allOf:
            - $ref: '#/components/schemas/Id'
        media_id:
          $ref: '#/components/schemas/Id'
    Notification:
      description: A notification of something that happened to the authenticated user.
      type: object
      required:
        - id
        - type
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        type:
          $ref: '#/components/schemas/NotificationType'
        created_at:
          description: When it happened.
          type: string
          format: date-time
        account:
          $ref: '#/components/schemas/Account'
        status:
          description: |
            The post that the notification is about, as the user sees it; omitted when the user
            may not see it.
          $ref: '#/components/schemas/Status'
        report:
          description: The user's report that a `report_resolved` tells of.
          $ref: '#/components/schemas/Report'
        moderation_action:
          description: |
            The action on the user's account that a `moderation_notice` tells of, or whose
            appeal an `appeal_decided` tells of, with the appeal.
          $ref: '#/components/schemas/ModerationAction'
        report_id:
          description: The report that an `admin_report` is about.
          allOf:
            - $ref: '#/components/schemas/Id'
        appeal_id:
          description: The appeal that an `admin_appeal` is about.
          allOf:
            - $ref: '#/components/schemas/Id'
        custom_emoji_request:
          description: |
            The custom emoji request that an `admin_custom_emoji_request` or a
            `custom_emoji_request_decided` is about, as it is now; absent when it no longer exists.
          $ref: '#/components/schemas/CustomEmojiRequest'
        supporter_subscription:
          description: |
            The user's supporter subscription that a `supporter_payment_failed`, a
            `supporter_subscription_ended`, or a `supporter_plan_retired` is about, as it is now;
            absent when it no longer exists.
          $ref: '#/components/schemas/SupporterSubscription'
        relationship_severance:
          $ref: '#/components/schemas/RelationshipSeverance'
        reaction:
          description: The emoji of a `reaction`; omitted for the other types.
          $ref: '#/components/schemas/ReactionEmoji'
    NotificationMarker:
      description: How far the authenticated user has read the notifications.
      type: object
      required:
        - unread_count
      properties:
        last_read_id:
          description: The newest notification read; omitted when the user has read none.
          $ref: '#/components/schemas/Id'
        unread_count:
          description: The number of listed notifications newer than `last_read_id`.
          type: integer
          format: int64
          minimum: 0
    NotificationMarkerUpdate:
      description: The new position of the read marker.
      type: object
      required:
        - last_read_id
      properties:
        last_read_id:
          $ref: '#/components/schemas/Id'
    NotificationPage:
      description: A page of notifications, newest first.
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Notification'
    NotificationType:
      description: |
        The kind of a notification. `account` is the account that acted: the follower
        (`follow`, `follow_request`), the followed account (`follow_accepted`), the author
        (`mention`), the booster (`boost`), the account that favourited (`favourite`), or the
        account that reacted with an emoji (`reaction`, whose `reaction` is the emoji; a reaction
        with another emoji is another notification), or the account that quoted a post of the
        user (`quote`, once the quote is approved or, from software without approvals, received).
        `status` is the post that `mention`, `boost`, `favourite`, `reaction`, and `poll_closed`
        are about, and for `quote` the post that quotes. `moderation_notice` comes from the instance and has no `account`; its
        `moderation_action` is the action on the user's account, with its kind, reason, and end.
        `report_resolved` also comes from the instance: its `report` is the user's report that
        the moderators resolved, without how they resolved it. It is sent once per report, even
        when the report is reopened and resolved again. `appeal_decided` also comes from the
        instance: the moderators decided the user's appeal, and its `moderation_action` is the
        action with the appeal and the decision.
        `relationships_severed` also comes from the instance: its `relationship_severance` tells
        how many follows the user lost when the moderators suspended a server or a remote
        account, whose `account` it carries for an account. It is sent once per suspension.
        The moderator notifications come from the instance too: `admin_report` (an account
        that had no open report was reported; `report_id` is the report) goes to the users
        with the `manage_reports` permission, `admin_sign_up` (a registration awaits
        approval; `account` is the new user's account) to those with `manage_accounts`, and
        `admin_appeal` (a user appealed an action; `appeal_id` is the appeal) to those with
        `manage_accounts`, and `admin_webhook_disabled` (the server disabled a webhook that
        answered 410 Gone or kept failing; it names none) to those with `manage_webhooks`, and
        `admin_custom_emoji_request` (a user requested a custom emoji or a new image of one;
        `custom_emoji_request` is the request) to those with `manage_custom_emojis`.
        `custom_emoji_request_decided` also comes from the instance: an administrator approved
        or rejected the user's custom emoji request, which `custom_emoji_request` carries with
        its state and the reason of a rejection.
        The supporter notifications also come from the instance and tell of the user's own
        supporter subscription, which `supporter_subscription` carries as it is now:
        `supporter_payment_failed` (a payment failed; the plan's role stays until
        `grace_ends_at` unless a payment succeeds), `supporter_subscription_ended` (the
        subscription lost the plan's role; `end_reason` says why), and `supporter_plan_retired`
        (the administrators retired the plan; the subscription ends with its period). Each is
        sent once per change of the subscription. A client must not lead from them to
        subscribing or paying where it offers no way to subscribe.
      type: string
      enum:
        - follow
        - follow_request
        - follow_accepted
        - mention
        - boost
        - favourite
        - reaction
        - quote
        - poll_closed
        - moderation_notice
        - report_resolved
        - admin_report
        - admin_sign_up
        - relationships_severed
        - appeal_decided
        - admin_appeal
        - admin_webhook_disabled
        - admin_custom_emoji_request
        - custom_emoji_request_decided
        - supporter_payment_failed
        - supporter_subscription_ended
        - supporter_plan_retired
    OAuthApp:
      description: |
        An OAuth app that the authenticated user registered (ADR-0090). Like every third-party app,
        it gets no first-party-only scope and calls no account security operation.
      type: object
      required:
        - id
        - client_id
        - name
        - redirect_uris
        - scope
        - client_type
        - disabled
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        client_id:
          description: The public identifier that the app sends as `client_id`.
          type: string
        name:
          description: The name that the consent screen shows.
          type: string
        website:
          description: The app's home page; absent when it has none.
          type: string
        redirect_uris:
          description: |
            The URIs the app may redirect to, sorted; matched exactly, except that a loopback URI
            matches any port.
          type: array
          items:
            type: string
        scope:
          description: The most the app may request, space-separated scopes.
          type: string
        client_type:
          $ref: '#/components/schemas/OAuthAppClientType'
        disabled:
          description: |
            Whether an administrator disabled the app: it cannot be authorized, get tokens, or use
            them until the administrator enables it again.
          type: boolean
        created_at:
          description: When the app was registered.
          type: string
          format: date-time
    OAuthAppClientType:
      description: |
        `public`: the app has no secret (a single-page, native, or command-line app).
        `confidential`: the app runs on a server and authenticates with its secret at the token
        endpoint, by `client_secret_basic` or `client_secret_post`. Both use PKCE (S256). The type
        never changes.
      type: string
      enum:
        - public
        - confidential
    OAuthAppCreated:
      description: A new OAuth app, with the secret of a confidential app.
      type: object
      required:
        - app
      properties:
        app:
          $ref: '#/components/schemas/OAuthApp'
        client_secret:
          description: |
            The secret of a confidential app, `my_cs_` and 43 base64url characters; absent for a
            public app. It is shown only now: the server keeps only its SHA-256 digest.
          type: string
    OAuthAppList:
      description: The OAuth apps that the authenticated user registered, oldest first; there are at most 25.
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OAuthApp'
    OAuthAppSecret:
      description: A new secret of a confidential OAuth app.
      type: object
      required:
        - client_secret
      properties:
        client_secret:
          description: The new secret, as in `OAuthAppCreated`. It is shown only now.
          type: string
    OAuthAppToken:
      description: |
        An access token and a refresh token of the app for the authenticated user, as the token
        endpoint returns them (RFC 6749 §5.1). The access token lasts an hour and the refresh token
        30 days; refreshing at `POST /oauth/token` (with the app's secret for a confidential app)
        replaces both, and presenting a used refresh token again revokes the whole grant.
      type: object
      required:
        - access_token
        - token_type
        - expires_in
        - refresh_token
        - scope
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum:
            - Bearer
        expires_in:
          description: Seconds until the access token expires.
          type: integer
        refresh_token:
          type: string
        scope:
          description: The granted scopes, space-separated.
          type: string
    OwnCustomEmoji:
      description: A local custom emoji that the user made (ADR-0070 §3).
      type: object
      required:
        - id
        - shortcode
        - enabled
        - visible_in_picker
        - aliases
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        shortcode:
          description: The shortcode, without the colons around it.
          type: string
        url:
          description: The URL of the image, animated when the emoji is; absent when it cannot be shown.
          type: string
          format: uri
        static_url:
          description: The URL of a still image of the emoji; absent with `url`.
          type: string
          format: uri
        enabled:
          description: |
            Whether the emoji is shown; an administrator disables and enables it, and a disabled one
            stays `:shortcode:` text.
          type: boolean
        visible_in_picker:
          description: Whether the picker offers the emoji.
          type: boolean
        category:
          description: The category of the emoji in the picker; absent for none.
          type: string
        aliases:
          description: The other names that the picker finds the emoji by.
          type: array
          items:
            type: string
        created_at:
          description: When the emoji was made.
          type: string
          format: date-time
        updated_at:
          description: When its current image was set.
          type: string
          format: date-time
    OwnCustomEmojiPage:
      description: |
        A page of the custom emoji that the user made, with what the user used of their limit
        (ADR-0070 §4): `used` counts the user's local emoji and their pending requests to create
        one, and `limit` is how many they may have, absent for no limit.
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required:
            - items
            - used
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/OwnCustomEmoji'
            used:
              description: The user's local emoji and pending requests to create one.
              type: integer
              minimum: 0
            limit:
              description: How many the user may have; absent for no limit.
              type: integer
              minimum: 0
    OwnSupporterSubscription:
      description: |
        The authenticated user's subscription that goes on, and whether they may subscribe.
      type: object
      properties:
        subscription:
          $ref: '#/components/schemas/SupporterSubscription'
        ineligible_reason:
          $ref: '#/components/schemas/SupporterIneligibleReason'
    PageInfo:
      description: The pagination of a collection page; collection responses embed it with allOf.
      type: object
      properties:
        next_cursor:
          $ref: '#/components/schemas/Cursor'
    Passkey:
      description: A passkey that signs the authenticated user in instead of the password.
      type: object
      required:
        - id
        - name
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          description: What the user calls the passkey, such as the device it is on.
          type: string
        created_at:
          description: When the passkey was registered.
          type: string
          format: date-time
    PasskeyAssertion:
      description: The browser's answer to a confirmation with a passkey, which confirms an operation.
      type: object
      required:
        - confirmation_token
        - credential
      properties:
        confirmation_token:
          description: The `confirmation_token` of `POST /passkeys/confirmation`.
          type: string
          maxLength: 4096
        credential:
          description: |
            The `AuthenticationResponseJSON` of WebAuthn Level 3 (§5.1): what
            `PublicKeyCredential.toJSON()` returns for the passkey.
          type: object
          additionalProperties: true
    PasskeyConfirmation:
      description: The start of a confirmation with a passkey.
      type: object
      required:
        - options
        - confirmation_token
        - expires_at
      properties:
        options:
          description: |
            The `PublicKeyCredentialRequestOptionsJSON` of WebAuthn Level 3 (§5.1.9): binary
            values in base64url, for `PublicKeyCredential.parseRequestOptionsFromJSON()`.
          type: object
          additionalProperties: true
        confirmation_token:
          description: An opaque token that carries the confirmation to the operation it confirms.
          type: string
        expires_at:
          description: When `confirmation_token` stops working.
          type: string
          format: date-time
    AuthorizedApp:
      description: |
        An app the authenticated user authorized: the user's grants of one OAuth client that still
        work. The name, the website and the logo are what the app says about itself; `registration`,
        `client_id` and `registered_by` are what the server knows (ADR-0090 §3).
      type: object
      required:
        - id
        - client_id
        - name
        - registration
        - first_party
        - scope
        - authorized_at
      properties:
        id:
          description: The ID of the client, which `DELETE /authorized_apps/{id}` takes.
          $ref: '#/components/schemas/Id'
        client_id:
          description: |
            The client's public identifier. For an app registered by its Client ID Metadata Document it
            is the document's `https` URL, whose host shows where the app comes from.
          type: string
        name:
          description: The app's name, as the app gives it.
          type: string
        website:
          description: The app's home page, as the app gives it. Absent when it gave none.
          type: string
        registration:
          description: |
            How the app was registered: `first_party` for the server's own client, `user` for an app a
            user registered, `metadata_document` for a Client ID Metadata Document, and `dynamic` for
            dynamic client registration (self-declared).
          type: string
          enum:
            - first_party
            - user
            - metadata_document
            - dynamic
        registered_by:
          description: The username of the user who registered the app (`user` only). Absent otherwise.
          type: string
        first_party:
          description: Whether the app is one of the server's own clients.
          type: boolean
        scope:
          description: The scopes the user granted, space separated, as the union of the app's working grants.
          type: string
        authorized_at:
          description: When the user first authorized the app (the oldest of its working grants).
          type: string
          format: date-time
        last_used_at:
          description: |
            When the app last made a request with a grant of the user, exact to the hour. Absent when
            no use was recorded.
          type: string
          format: date-time
    AuthorizedAppList:
      description: The apps the authenticated user authorized, one per client, most recently used first.
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuthorizedApp'
    PasskeyList:
      description: The authenticated user's passkeys, oldest first.
      type: object
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Passkey'
    PasskeyRegistration:
      description: The start of a passkey registration.
      type: object
      required:
        - options
        - registration_token
        - expires_at
      properties:
        options:
          description: |
            The `PublicKeyCredentialCreationOptionsJSON` of WebAuthn Level 3 (§5.1.8): binary
            values in base64url, for `PublicKeyCredential.parseCreationOptionsFromJSON()`.
          type: object
          additionalProperties: true
        registration_token:
          description: An opaque token that carries the registration to `POST /passkeys`.
          type: string
        expires_at:
          description: When `registration_token` stops working.
          type: string
          format: date-time
    PasskeyRegistrationRequest:
      description: |
        The name of a new passkey and what confirms it: the user's `password` or a `passkey` of
        the user.
      type: object
      required:
        - name
      properties:
        name:
          description: What the user calls the passkey; spaces around it are dropped.
          type: string
          minLength: 1
          maxLength: 64
        password:
          description: The user's current password.
          type: string
          minLength: 1
          maxLength: 1024
        passkey:
          $ref: '#/components/schemas/PasskeyAssertion'
    PasswordStatus:
      description: Whether the authenticated user has a password.
      type: object
      required:
        - has_password
      properties:
        has_password:
          description: |
            Whether the password signs in; false after the user removed it, when only the
            passkeys sign in.
          type: boolean
    PaymentReconcileRun:
      description: The last attempt of the reconciliation with the payment provider; omitted before the first.
      type: object
      required:
        - outcome
        - error_kind
        - requests
        - checked_subscriptions
        - corrected_subscriptions
        - occurred_at
      properties:
        outcome:
          description: |
            `succeeded`; `partial` when it used its `payments_reconcile_max_requests` and a
            continuation takes over; `failed` when the provider failed.
          type: string
          enum:
            - succeeded
            - partial
            - failed
        error_kind:
          description: |
            Why it stopped: `request_cap` (a partial attempt), `permission` (the API key is wrong
            or lacks permissions), `not_found`, `invalid_request`, `throttled` and `unavailable`
            (the provider is busy or down; the next reconciliation tries again),
            `invalid_signature`, `stale_signature`, `mode_mismatch` (the key's mode differs from
            the account's), `invalid_response`; `none` for a success.
          type: string
          enum:
            - none
            - request_cap
            - permission
            - not_found
            - invalid_request
            - throttled
            - unavailable
            - invalid_signature
            - stale_signature
            - mode_mismatch
            - invalid_response
        requests:
          description: The requests it sent to the provider.
          type: integer
          minimum: 0
        checked_subscriptions:
          description: The subscriptions it read again from the provider.
          type: integer
          minimum: 0
        corrected_subscriptions:
          description: The subscriptions among them whose state it changed here.
          type: integer
          minimum: 0
        occurred_at:
          type: string
          format: date-time
    PaymentStatus:
      description: The state of the payment provider (ADR-0074 §4).
      type: object
      required:
        - provider
        - mode
        - time_zone
        - warnings
      properties:
        provider:
          description: The provider of `payments_provider` (`stripe`).
          type: string
        mode:
          description: |
            `test` for test credentials, with which nothing is charged, and `live` for live
            credentials.
          type: string
          enum:
            - test
            - live
        time_zone:
          description: The IANA time zone of the provider's reports (`UTC`), in which the income is dated.
          type: string
        last_webhook_at:
          description: |
            When the newest webhook delivery was received; omitted when none is recorded (the
            deliveries are kept 45 days).
          type: string
          format: date-time
        last_reconcile:
          $ref: '#/components/schemas/PaymentReconcileRun'
        warnings:
          description: |
            The signs that the provider's webhook is not set up right: `no_webhook` (no delivery is
            recorded) and `reconcile_corrected` (the last reconciliation corrected subscriptions,
            which a webhook delivery should have done).
          type: array
          items:
            type: string
            enum:
              - no_webhook
              - reconcile_corrected
    Permission:
      description: |
        A capability that a role grants. `manage_accounts`: the accounts and their moderation
        actions.
        `manage_domains`: the health of remote servers and the moderation actions on domains.
        `manage_reports`: the reports. `manage_rules`: the instance rules. `manage_roles`: the
        roles of users. `manage_jobs`: the dead jobs of the job queue. `view_audit`: the audit
        log. `manage_login_recovery`: recovering a local user's sign-in, by removing their two-factor
        authentication or issuing a password reset link (only the built-in admin role by
        default). `manage_custom_emojis`: the custom emoji, local and
        remote. `manage_webhooks`: the webhooks of the instance. `manage_announcements`: the
        server's announcements to every local user. `manage_finance`: the instance's costs and
        the state of the billing imports (only the built-in admin role by default). `view_finance`:
        reading the totals of the instance's costs on `GET /finance/cost_totals`, a member
        permission outside the staff's areas (ADR-0070). `manage_supporters`: the supporter program, its plans, and their
        subscriptions (only the built-in admin role by default). `create_custom_emojis`: requesting
        new local custom emoji, which a holder of `manage_custom_emojis` approves, and changing and
        deleting the ones the user made, on `/custom_emoji_requests` and `/custom_emojis/mine`, a
        member permission (ADR-0070). The others guard no client API operation
        yet.
      type: string
      enum:
        - manage_reports
        - manage_accounts
        - manage_domains
        - manage_rules
        - manage_settings
        - manage_roles
        - manage_invites
        - view_audit
        - manage_jobs
        - manage_login_recovery
        - manage_custom_emojis
        - manage_webhooks
        - manage_announcements
        - manage_finance
        - view_finance
        - manage_supporters
        - create_custom_emojis
    PickerCustomEmoji:
      description: |
        A local custom emoji that the picker offers (ADR-0051 §4). Picking it inserts
        `:shortcode:` into the text.
      type: object
      required:
        - shortcode
        - url
        - static_url
        - aliases
      properties:
        shortcode:
          description: The shortcode, without the colons around it.
          type: string
        url:
          description: The URL of the image, animated when the emoji is.
          type: string
          format: uri
        static_url:
          description: The URL of a still image of the emoji.
          type: string
          format: uri
        category:
          description: The category that the picker groups the emoji in; absent for none.
          type: string
        aliases:
          description: Other names that a search of the picker finds the emoji by.
          type: array
          items:
            type: string
    PickerCustomEmojiList:
      description: The custom emoji of the picker.
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PickerCustomEmoji'
    Poll:
      description: |
        The poll of a status (FR-112); omitted when the status has none. The counts of a poll of
        another server are those its server last reported. A poll whose author hides the votes of
        each option until it ends leaves out `votes_count` of its options until then. `voted` and
        `own_votes` describe the authenticated user's vote and are omitted for anonymous requests.
      type: object
      required:
        - id
        - multiple
        - expired
        - votes_count
        - options
      properties:
        id:
          $ref: '#/components/schemas/Id'
        expires_at:
          description: When the poll ends; omitted when it has no end.
          type: string
          format: date-time
        expired:
          description: Whether the poll has ended. An ended poll takes no votes and shows its results.
          type: boolean
        multiple:
          description: Whether a vote may choose several options.
          type: boolean
        votes_count:
          description: The number of votes, one per chosen option.
          type: integer
          minimum: 0
        voters_count:
          description: |
            The number of accounts that voted; omitted when it is unknown (a multiple-choice poll
            of another server that does not report it).
          type: integer
          minimum: 0
        options:
          description: The options, in order; a vote names them by their index in this list.
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/PollOption'
        voted:
          description: Whether the authenticated user voted in the poll.
          type: boolean
        own_votes:
          description: The indexes of the options the authenticated user voted for, in order.
          type: array
          items:
            type: integer
            minimum: 0
    PollInput:
      description: |
        A poll of a new status (FR-112). It ends `expires_in` seconds after the status is
        posted; the author and the users who voted are notified then.
      type: object
      required:
        - options
        - expires_in
      properties:
        options:
          description: The options, in order, as plain text; each one different from the others.
          type: array
          minItems: 2
          maxItems: 4
          items:
            type: string
            minLength: 1
            maxLength: 50
        expires_in:
          description: How long the poll takes votes, in seconds (5 minutes to 30 days).
          type: integer
          minimum: 300
          maximum: 2592000
        multiple:
          description: Whether a vote may choose several options.
          type: boolean
        hide_totals:
          description: Whether the votes of each option are hidden until the poll ends.
          type: boolean
    PollOption:
      description: One option of a poll.
      type: object
      required:
        - title
      properties:
        title:
          description: The option as plain text.
          type: string
        votes_count:
          description: |
            The number of votes for the option; omitted while the poll hides the votes of each
            option until it ends.
          type: integer
          minimum: 0
    PostingLimits:
      description: |
        What the account's current moderation restrictions let it post (data-model/05-states-and-policies.md §5.4). The
        server applies the same policy when it posts: a status asked for with a visibility that is
        not in `visibilities` gets `visibility_ceiling` instead.
      type: object
      required:
        - visibility_ceiling
        - visibilities
      properties:
        visibility_ceiling:
          $ref: '#/components/schemas/Visibility'
        visibilities:
          description: |
            The visibilities that a new status keeps as asked for, from the widest audience to the
            narrowest; every visibility while the account is not restricted.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Visibility'
    Preferences:
      description: The authenticated user's preferences.
      type: object
      required:
        - locale
        - time_zone
        - time_zone_chosen
        - default_visibility
        - default_quote_policy
        - default_post_language
        - require_media_description
        - email_moderator_notifications
        - timeline_auto_insert
        - timeline_languages
      properties:
        locale:
          description: The UI locale, a BCP 47 language tag.
          type: string
        time_zone:
          description: The time zone, an IANA name such as `Asia/Tokyo`; `UTC` until one is chosen.
          type: string
        time_zone_chosen:
          description: |
            Whether a time zone has been chosen: false for a new user until a request sets
            `time_zone`. Clients may then set it to the device's time zone.
          type: boolean
        default_visibility:
          $ref: '#/components/schemas/Visibility'
        default_quote_policy:
          description: Who may quote the user's new statuses that name no `quote_policy`.
          allOf:
            - $ref: '#/components/schemas/QuotePolicy'
        default_post_language:
          description: The language of new posts that name none, a BCP 47 language tag; `und` when undetermined.
          type: string
        require_media_description:
          description: Whether clients ask for a description before posting media without one.
          type: boolean
        email_moderator_notifications:
          description: |
            Whether the moderator notifications (`admin_report`, `admin_sign_up`, `admin_appeal`,
            `admin_webhook_disabled`, `admin_custom_emoji_request`) also come by email, to the
            primary address. Off for a new user.
          type: boolean
        timeline_auto_insert:
          description: |
            Whether the web client inserts new timeline posts without asking, instead of offering them
            behind a "show new posts" button (ADR-0077). Off for a new user; the same on every device.
          type: boolean
        timeline_languages:
          description: The languages that timelines show, sorted; empty shows every language.
          type: array
          items:
            type: string
    PreviewDomainBlockImportRequest:
      description: A domain block CSV to preview.
      type: object
      required:
        - csv
      properties:
        csv:
          description: The file's text, with a header or as a list of domains; at most 5,000 rows.
          type: string
    Problem:
      description: |
        An RFC 9457 problem document. Besides `about:blank`, `type` is one of

        - `/api/v1/problems/unauthenticated` (401): the operation needs an access token and
          the request has none.
        - `/api/v1/problems/invalid-token` (401): the access token is malformed, unknown,
          expired, or revoked. Refresh it or sign in again.
        - `/api/v1/problems/insufficient-scope` (403): the access token lacks the scope that
          `WWW-Authenticate` names.
        - `/api/v1/problems/first-party-only` (403): the operation (password, two-factor
          authentication, passkeys, deleting the account) takes only the token of one of the
          server's own clients, whatever its scopes.
        - `/api/v1/problems/account-unavailable` (403): the token is valid, but its user cannot
          use the app (registration pending or rejected, email unverified, the account
          deactivated or deleted, or a moderation action that disables its login). The user
          can still sign in to the server's sign-in page, which says why.
        - `/api/v1/problems/blocking` (409): the viewer blocks the account, which keeps them
          from following it. Unblock it first.
        - `/api/v1/problems/federation-restricted` (403): the instance's federation mode
          (`Instance.federation.mode`) does not let the operation through: following a remote
          account or resolving one (`off`, `outbound`), or quoting a remote status (`off`,
          `inbound`).
        - `/api/v1/problems/media-too-large` (413): the uploaded file is larger than the
          instance accepts.
        - `/api/v1/problems/unsupported-media-format` (415): the uploaded file is not in an
          accepted format or codec (such as HEVC video), or its declared type does not match its
          content.
        - `/api/v1/problems/media-dimensions` (422): the image is too wide or tall, or has too
          many pixels or frames; or the video has too many pixels or frames per second.
        - `/api/v1/problems/media-too-long` (422): the video or audio file is longer than the
          instance accepts.
        - `/api/v1/problems/media-corrupt` (422): the uploaded file cannot be read as a file of
          its format.
        - `/api/v1/problems/media-attached` (409): the media file is attached to a post and can
          no longer be changed on its own.
        - `/api/v1/problems/too-many-streams` (429): the user already has as many streams
          (`GET /streaming`) open as the server allows. Close one first.
        - `/api/v1/problems/missing-permission` (403): the user's roles lack the permission
          that an admin operation needs.
        - `/api/v1/problems/already-appealed` (422): the user already appealed the moderation
          action; an action is appealed once.
        - `/api/v1/problems/appeal-window-closed` (422): the time to appeal the moderation
          action has passed.
        - `/api/v1/problems/not-appealable` (422): the moderation action is a ban whose
          account is deleted, so it can no longer be appealed or overturned.
        - `/api/v1/problems/appeal-decided` (409): the appeal was already decided the other way.
        - `/api/v1/problems/wrong-password` (422): the password given to confirm the operation is
          not the user's current password.
        - `/api/v1/problems/export-in-progress` (409): another data export of the user is being
          built. Wait for it to end.
        - `/api/v1/problems/export-not-ready` (409): the data export has no archive to download:
          it is being built, failed, or expired.
        - `/api/v1/problems/import-in-progress` (409): another import of the user is being
          carried out. Wait for it to finish.
        - `/api/v1/problems/invalid-two-factor-code` (422): the two-factor code is wrong, was
          already used, or is not a code.
        - `/api/v1/problems/totp-setup-expired` (422): the TOTP setup is unknown or expired.
          Start a new one.
        - `/api/v1/problems/two-factor-enabled` (409): the user already has two-factor
          authentication.
        - `/api/v1/problems/two-factor-not-enabled` (409): the user, or the account of an admin
          operation, has no two-factor authentication.
        - `/api/v1/problems/invalid-passkey` (422): the browser's response to a passkey
          registration or confirmation does not verify, the passkey is registered already, or
          the passkey that confirms an operation is not one of the user's.
        - `/api/v1/problems/passkey-registration-expired` (422): the passkey registration is
          unknown or expired. Start a new one.
        - `/api/v1/problems/passkey-confirmation-expired` (422): the confirmation with a passkey
          is unknown, expired, or used. Start a new one.
        - `/api/v1/problems/too-many-passkeys` (409): the user already has the most passkeys
          allowed. Remove one first.
        - `/api/v1/problems/last-sign-in-method` (409): the operation would leave the user no
          way to sign in: the password without a passkey, or the last passkey without a password.
        - `/api/v1/problems/too-many-oauth-apps` (409): the user already has the most OAuth apps
          allowed (25). Delete one first.
        - `/api/v1/problems/oauth-app-registration-disabled` (403): the server does not let users
          register OAuth apps.
        - `/api/v1/problems/public-oauth-app` (409): the OAuth app is public and has no secret.
        - `/api/v1/problems/oauth-app-disabled` (409): an administrator disabled the OAuth app.
        - `/api/v1/problems/invalid-custom-emoji` (422): a custom emoji breaks a rule; `reason`
          says which.
        - `/api/v1/problems/invalid-webhook` (422): a webhook breaks a rule; `reason` says
          which.
        - `/api/v1/problems/invalid-relay` (422): a relay cannot be registered, joined, left, or
          deleted; `reason` says why.
        - `/api/v1/problems/invalid-theme` (422): the theme breaks a rule; the problem lists every
          reason in `theme_errors` (`PUT /admin/theme`).
        - `/api/v1/problems/too-many-domain-mutes` (422): the user already mutes the most domains
          allowed. Unmute one first.
        - `/api/v1/problems/role-managed-by-plan` (409): the role is the role of a supporter plan:
          only its subscriptions grant and revoke it, and its permissions and position change from
          the plan (`PATCH /admin/supporter_plans/{id}`). Its badge changes as any role's.
        - `/api/v1/problems/breaks-supporter-roles` (409): the change would put a staff role (one
          with a moderation or server permission) at or below the role of a supporter plan.
        - `/api/v1/problems/supporters-unavailable` (409): the supporter program needs a payment
          provider in the deployment's configuration and a server that sends email.
        - `/api/v1/problems/live-subscriptions` (409): subscriptions to the supporter plans go on;
          retire the plans and wait for the subscriptions to end before disabling the program.
        - `/api/v1/problems/invalid-supporter-plan` (422): a supporter plan breaks a rule;
          `reason` says which.
        - `/api/v1/problems/supporter-plan-retired` (409): the supporter plan is retired and does
          not change any more.
        - `/api/v1/problems/subscription-ended` (409): the subscription has ended already.
        - `/api/v1/problems/supporter-ineligible` (422): the user may not subscribe to a supporter
          plan: not a local user, the primary email address is not verified, or the account is
          restricted.
        - `/api/v1/problems/supporter-subscribed` (409): the user has a subscription that goes on
          already; change its plan instead.
        - `/api/v1/problems/supporter-plan-unavailable` (422): the supporter plan takes no
          subscriptions: hidden, retired, not ready, or of another currency.
        - `/api/v1/problems/supporter-subscription-state` (409): the subscription's state does not
          allow the operation.
        - `/api/v1/problems/supporter-same-plan` (422): the subscription has that plan and interval
          already.
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          description: |
            A URI that identifies the problem type, stable for clients to branch on.
            It is `about:blank` when the problem means no more than its HTTP status.
          type: string
          format: uri-reference
        title:
          description: A short summary of the problem type, localized from `Accept-Language`.
          type: string
        status:
          description: The HTTP status code.
          type: integer
          minimum: 400
          maximum: 599
        detail:
          description: An explanation of this occurrence, localized from `Accept-Language`.
          type: string
        request_id:
          description: The request ID (the `X-Request-Id` response header), for reporting the problem.
          type: string
    ProfileField:
      description: One metadata field of a profile.
      type: object
      required:
        - name
        - value
      properties:
        name:
          description: The field's name, as plain text.
          type: string
        value:
          description: The field's value as sanitized HTML.
          type: string
    PushSubscription:
      description: The Web Push subscription of a grant.
      type: object
      required:
        - id
        - endpoint
        - alerts
        - server_key
      properties:
        id:
          $ref: '#/components/schemas/Id'
        endpoint:
          description: The push service URL of the browser's subscription.
          type: string
          format: uri
        alerts:
          description: The notification types that are pushed, in a stable order.
          type: array
          items:
            $ref: '#/components/schemas/NotificationType'
        server_key:
          description: |
            The instance's VAPID public key now. When it differs from the key the browser
            subscribed with, the subscription receives nothing; subscribe again.
          type: string
    PushSubscriptionKeys:
      description: The keys of a browser's push subscription (RFC 8291 §3), in base64url.
      type: object
      required:
        - p256dh
        - auth
      properties:
        p256dh:
          description: The browser's P-256 public key, an uncompressed point.
          type: string
          maxLength: 128
        auth:
          description: The 16-byte authentication secret.
          type: string
          maxLength: 32
    PushSubscriptionRequest:
      description: A browser's push subscription and the notification types to push to it.
      type: object
      required:
        - endpoint
        - keys
        - alerts
      properties:
        endpoint:
          description: The push service URL (`PushSubscription.endpoint`), an `https` URL.
          type: string
          maxLength: 2048
        keys:
          $ref: '#/components/schemas/PushSubscriptionKeys'
        alerts:
          description: The notification types to push; empty pushes none.
          type: array
          maxItems: 14
          items:
            $ref: '#/components/schemas/NotificationType'
    QrCode:
      description: |
        A QR code as an SVG path: draw `path` filled in a `size` × `size` view box (the quiet
        zone of four modules included) on a light background.
      type: object
      required:
        - size
        - path
      properties:
        size:
          description: The width and height of the view box, in modules.
          type: integer
          minimum: 1
        path:
          description: The path data (`d`) of the dark modules, one unit per module.
          type: string
    QuotePolicy:
      description: |
        Who may quote a status (FR-114, ADR-0069): `public` anyone who may see it, `followers`
        the author's followers, `nobody` the author alone. A followers-only status is quoted only
        by its author, in a followers-only or direct status, and a direct one by nobody, whatever
        its policy.
      type: string
      enum:
        - public
        - followers
        - nobody
    QuoteState:
      description: |
        The state of a quote as the viewer sees it (ADR-0069), with the values of Mastodon's
        `Quote.state` and `legacy`. The quoted status is shown for `accepted` and `legacy`, and
        behind the reason for `muted_account` and `blocked_domain`:

        - `pending`: the quoted author has not approved the quote yet, or the quoted status is not
          fetched yet.
        - `accepted`: the quoted author approved the quote.
        - `rejected`: the quoted author refused the quote.
        - `revoked`: the quoted author withdrew the approval.
        - `legacy`: a quote from software without approvals (Misskey, Akkoma), shown as it is.
        - `deleted`: the quoted status is deleted.
        - `unauthorized`: the viewer may not see the quoted status.
        - `blocked_account`: the viewer blocks the quoted author, or is blocked by them.
        - `blocked_domain`: the viewer mutes the domain of the quoted author.
        - `muted_account`: the viewer mutes the quoted author.
      type: string
      enum:
        - pending
        - accepted
        - rejected
        - revoked
        - legacy
        - deleted
        - unauthorized
        - blocked_account
        - blocked_domain
        - muted_account
    ReactToStatusRequest:
      description: The emoji to react with.
      type: object
      required:
        - emoji
      properties:
        emoji:
          description: |
            A Unicode emoji, or the shortcode of a custom emoji of this server (the `name` of
            its `ReactionEmoji`; colons around it are accepted).
          type: string
          minLength: 1
          maxLength: 130
    ReactionEmoji:
      description: |
        The emoji of a reaction: a Unicode emoji, or a custom emoji with its image. A custom
        emoji of another server is shown as it is and cannot be used to react from here.
      type: object
      required:
        - name
      properties:
        name:
          description: |
            The emoji as `listStatusReactions` takes it: the Unicode emoji, the shortcode of a
            custom emoji of this server, or `shortcode@domain` for a custom emoji of another
            server.
          type: string
        shortcode:
          description: The shortcode of a custom emoji, without colons; omitted for a Unicode emoji.
          type: string
        domain:
          description: The server of a custom emoji of another server; omitted otherwise.
          type: string
        emoji:
          description: |
            The custom emoji with its image; omitted for a Unicode emoji and when the image cannot
            be shown (as `CustomEmoji` leaves such an emoji out).
          $ref: '#/components/schemas/CustomEmoji'
    RecoveryCodes:
      description: |
        Recovery codes, each of which signs in once in place of a code of the app. They are
        shown only once.
      type: object
      required:
        - recovery_codes
      properties:
        recovery_codes:
          type: array
          items:
            type: string
    RegistrationDecisionRequest:
      description: A moderator's decision on a registration.
      type: object
      properties:
        note:
          description: A note for the moderators, as plain text; omitted or empty for none.
          type: string
          maxLength: 1000
    RegistrationState:
      description: |
        Where a registration stands: `pending` waits for a moderator, `approved` lets the user
        sign in, and `rejected` keeps them out.
      type: string
      enum:
        - pending
        - approved
        - rejected
    RejectCustomEmojiRequestRequest:
      description: The rejection of a custom emoji request.
      type: object
      properties:
        reason:
          description: Why, up to 500 characters, which the requester sees; empty or absent for none.
          type: string
          maxLength: 500
    Relationship:
      description: |
        The viewer's relationship with an account. It never says whether the account blocks
        the viewer: such an account is not found at all.
      type: object
      required:
        - id
        - following
        - requested
        - followed_by
        - requested_by
        - show_boosts
        - notify
        - blocking
        - muting
        - muting_notifications
      properties:
        id:
          $ref: '#/components/schemas/Id'
        following:
          description: Whether the viewer actively follows the account.
          type: boolean
        requested:
          description: Whether the viewer's follow request awaits the account's approval.
          type: boolean
        followed_by:
          description: Whether the account actively follows the viewer.
          type: boolean
        requested_by:
          description: Whether the account's follow request awaits the viewer's approval.
          type: boolean
        show_boosts:
          description: Whether the viewer's follow shows the account's boosts in the home timeline (true without a follow).
          type: boolean
        notify:
          description: Whether the viewer's follow notifies them of the account's new posts.
          type: boolean
        blocking:
          description: Whether the viewer blocks the account.
          type: boolean
        muting:
          description: Whether the viewer mutes the account (a mute that has not expired).
          type: boolean
        muting_notifications:
          description: Whether the viewer's mute also hides the account's notifications.
          type: boolean
    RelationshipSeverance:
      description: |
        The follows that a `relationships_severed` tells of: the user lost them when the
        moderators suspended a server (`domain_suspension`, `domain` is the server) or a remote
        account (`account_suspension`, the notification's `account` is the account). Both
        directions end, follow requests too, and lifting the suspension does not restore them;
        the counts are of the accepted follows.
      type: object
      required:
        - kind
        - followers_lost
        - following_lost
      properties:
        kind:
          type: string
          enum:
            - domain_suspension
            - account_suspension
        domain:
          description: The suspended server of a `domain_suspension`; omitted otherwise.
          type: string
        followers_lost:
          description: The accounts that followed the user and no longer do.
          type: integer
          minimum: 0
        following_lost:
          description: The accounts that the user followed and no longer does.
          type: integer
          minimum: 0
    RelayProblem:
      description: |
        The problem of a relay operation that breaks a rule (422,
        `/api/v1/problems/invalid-relay`); `reason` says which. Another 422 (a malformed
        request) has none.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            reason:
              $ref: '#/components/schemas/RelayProblemReason'
    RelayProblemReason:
      description: |
        Why a relay operation is refused. `url`: not an https URL of at most 2048 bytes.
        `exists`: a relay with the URL is registered. `domain_suspended`: a domain action
        suspends its server. `not_actor`: the URL of a `litepub` relay serves no actor with an
        inbox. `state`: the relay is not in a state that allows it (joining a `pending` or
        `accepted` relay, leaving or deleting one that is not).
      type: string
      enum:
        - url
        - exists
        - domain_suspended
        - not_actor
        - state
    RelayProtocol:
      description: |
        How a relay is joined (ADR-0061). `mastodon`: at its inbox, by a `Follow` of the Public
        collection. `litepub`: at its actor, by a `Follow` of the actor.
      type: string
      enum:
        - mastodon
        - litepub
    RelayState:
      description: |
        Where the membership of a relay stands. `pending`: the `Follow` is sent and not
        answered. `accepted`: public posts go to the relay and, with `receive`, come from it.
        `rejected`: the relay rejected the `Follow` or ended the membership. `left`: the
        instance sent the `Undo` of its `Follow`.
      type: string
      enum:
        - pending
        - accepted
        - rejected
        - left
    RemovePasswordRequest:
      description: The passkey that confirms the removal of the user's password.
      type: object
      required:
        - passkey
      properties:
        passkey:
          $ref: '#/components/schemas/PasskeyAssertion'
    ReplaceCustomEmojiImageRequest:
      description: The new image of a local custom emoji.
      type: object
      required:
        - media_id
      properties:
        media_id:
          $ref: '#/components/schemas/Id'
    Report:
      description: |
        A report that the user filed. It never names the reporter, and tells only whether the
        moderators resolved it, never how.
      type: object
      required:
        - id
        - category
        - comment
        - forwarded
        - filed_at
        - target_account
        - status_ids
        - rule_ids
        - state
      properties:
        id:
          $ref: '#/components/schemas/Id'
        category:
          $ref: '#/components/schemas/ReportCategory'
        comment:
          description: The comment as plain text.
          type: string
        forwarded:
          description: Whether the report is to be forwarded to the target's server.
          type: boolean
        filed_at:
          type: string
          format: date-time
        target_account:
          $ref: '#/components/schemas/Account'
        status_ids:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        rule_ids:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        state:
          $ref: '#/components/schemas/ReportState'
    ReportCategory:
      description: |
        Why the account is reported. `spam`: spam or unwanted promotion. `legal`: content that
        is illegal. `violation`: it breaks the instance rules that `rule_ids` cite. `other`:
        anything else.
      type: string
      enum:
        - spam
        - legal
        - violation
        - other
    ReportPage:
      description: A page of the user's reports, newest first.
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Report'
    ReportState:
      description: |
        `open`: the report awaits the moderators. `resolved`: the moderators handled it.
      type: string
      enum:
        - open
        - resolved
    ResolveReportRequest:
      description: How a report is resolved.
      type: object
      required:
        - outcome
      properties:
        outcome:
          $ref: '#/components/schemas/AdminReportOutcome'
    RoleBadge:
      description: |
        The badge of a role (ADR-0071), which its holders may show on their profile. The label is
        the staff's own text, the same in every locale: clients show it as user content
        (`dir="auto"`), never translated.
      type: object
      required:
        - label
        - color
      properties:
        label:
          description: The name on the badge, 1 to 32 characters on one line; white space around it is removed.
          type: string
          minLength: 1
          maxLength: 32
        color:
          $ref: '#/components/schemas/BadgeColor'
    RoleProblem:
      description: |
        The problem of a role change that breaks a rule (422, `/api/v1/problems/invalid-role`);
        `reason` says which. Another 422 (a malformed request) has none.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            reason:
              $ref: '#/components/schemas/RoleProblemReason'
            missing_permissions:
              description: The permissions that the change needs and the viewer lacks, for `missing_permission`.
              type: array
              items:
                $ref: '#/components/schemas/Permission'
    RoleProblemReason:
      description: |
        Why a role change is refused. `key`: not 1 to 64 lowercase ASCII letters, digits, `_`,
        and `-`. `key_taken`: another role has the key. `position`: outside 0 to 999.
        `permissions`: an unknown permission, or one twice. `builtin`: `admin` changes only its
        badge, and neither `admin` nor `moderator` can be deleted. `held`: users hold the role.
        `missing_permission`: the change adds or removes permissions that the viewer's roles
        do not grant (`missing_permissions`). `badge_label`: a badge label that is not 1 to 32
        characters on one line. `badge_color`: an unknown badge color.
      type: string
      enum:
        - key
        - key_taken
        - position
        - permissions
        - builtin
        - held
        - missing_permission
        - badge_label
        - badge_color
    SearchIndexing:
      description: |
        Whether the instance lets search engines index its pages (the instance setting
        `search_indexing`, FR-725, ADR-0057). `allow`: the profiles and public posts of the accounts
        that are `indexable`; `deny`: no page. An account can deny what the instance allows, never
        the reverse.
      type: string
      enum:
        - allow
        - deny
    SetInstanceTextRequest:
      description: A new revision of an instance text.
      type: object
      required:
        - body
      properties:
        body:
          description: The text, in any language; empty clears it.
          type: string
          maxLength: 100000
    SetQuotePolicyRequest:
      description: Who may quote the status from now on. Approvals given before stay.
      type: object
      required:
        - quote_policy
      properties:
        quote_policy:
          $ref: '#/components/schemas/QuotePolicy'
    SetThemeRequest:
      description: The whole theme; tokens left out go back to their defaults.
      type: object
      required:
        - tokens
        - custom_css
      properties:
        tokens:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ThemeTokenValue'
        custom_css:
          type: string
    SignupBlockImportResult:
      description: What an import of a list of sign-up blocks did.
      type: object
      required:
        - added
        - skipped
      properties:
        added:
          description: The number of blocks added.
          type: integer
          minimum: 0
        skipped:
          description: The lines whose block was not added, in line order.
          type: array
          items:
            $ref: '#/components/schemas/SignupBlockImportSkipped'
    SignupBlockImportSkipped:
      description: A line of an imported list whose block was not added.
      type: object
      required:
        - line
        - value
        - reason
      properties:
        line:
          description: The line of the list, from 1.
          type: integer
          minimum: 1
        value:
          description: The value as written on the line.
          type: string
        reason:
          description: |
            `invalid`: not a valid value for the kind. `duplicate`: an earlier line has the same
            value in canonical form. `already_blocked`: a block in effect of the same kind and
            value with a severity at least as strong covers it.
          type: string
          enum:
            - invalid
            - duplicate
            - already_blocked
    SpoilerText:
      description: The content warning; omitted or empty for none. It counts toward `max_post_characters`.
      type: string
    Status:
      description: |
        A status (post), as the viewer sees it. `favourited`, `boosted`, and `bookmarked`
        describe the authenticated user's relation to it and are omitted for anonymous
        requests; `pinned` is only given to the author.

        In a timeline, a boost is a status of the booster with `boost` set to the boosted
        status: its `id` and `uri` are those of the boost, `created_at` is when it was boosted,
        `visibility` and `language` are those of the boosted status, its `content`,
        `spoiler_text`, `media_attachments`, `mentions`, `tags`, `emojis`, and `reactions` are
        empty, its `card` and `quote` are omitted, and its counts are zero.
      type: object
      required:
        - id
        - uri
        - account
        - content
        - spoiler_text
        - sensitive
        - visibility
        - language
        - created_at
        - media_attachments
        - mentions
        - tags
        - emojis
        - replies_count
        - boosts_count
        - favourites_count
        - reactions
      properties:
        id:
          $ref: '#/components/schemas/Id'
        uri:
          description: The ActivityPub ID of the status.
          type: string
          format: uri
        url:
          description: |
            The HTML page of the status, on the server it belongs to for a remote status; omitted
            when it has none.
          type: string
          format: uri
        account:
          $ref: '#/components/schemas/Account'
        content:
          description: |
            The text as sanitized HTML, with mentions, hashtags, and URLs linked. The HTML of a
            remote status is what the server's sanitizer kept of the received document (ADR-0019 §2).
          type: string
        spoiler_text:
          description: The content warning; empty when there is none.
          type: string
        sensitive:
          description: Whether the media are sensitive.
          type: boolean
        visibility:
          $ref: '#/components/schemas/Visibility'
        language:
          description: The BCP 47 language tag of the text; `und` when it is unknown.
          type: string
        in_reply_to_id:
          $ref: '#/components/schemas/Id'
        in_reply_to_account_id:
          $ref: '#/components/schemas/Id'
        created_at:
          description: When the status was posted.
          type: string
          format: date-time
        boost:
          $ref: '#/components/schemas/Status'
        edited_at:
          description: When the status was last edited; omitted when it never was.
          type: string
          format: date-time
        media_attachments:
          description: The attached media, in order.
          type: array
          items:
            $ref: '#/components/schemas/MediaAttachment'
        mentions:
          description: The accounts the text mentions.
          type: array
          items:
            $ref: '#/components/schemas/StatusMention'
        tags:
          description: The hashtags of the text.
          type: array
          items:
            $ref: '#/components/schemas/StatusTag'
        emojis:
          description: |
            The custom emoji of the text, the content warning, and the poll's choices
            (ADR-0051). Clients show each `:shortcode:` of those texts that is in this list as its
            image, and the rest as text. Empty for a boost, whose emoji are those of `boost`.
          type: array
          items:
            $ref: '#/components/schemas/CustomEmoji'
        replies_count:
          description: The number of replies.
          type: integer
          minimum: 0
        boosts_count:
          description: The number of boosts.
          type: integer
          minimum: 0
        favourites_count:
          description: The number of favourites.
          type: integer
          minimum: 0
        reactions:
          description: |
            The emoji reactions to the status, counted per emoji: the 20 emoji with the most
            reactions, the most first. The others are seen in `listStatusReactions`. Favourites
            are counted apart, in `favourites_count`.
          type: array
          items:
            $ref: '#/components/schemas/StatusReaction'
        favourited:
          description: Whether the authenticated user favourited the status.
          type: boolean
        boosted:
          description: Whether the authenticated user boosts the status.
          type: boolean
        bookmarked:
          description: Whether the authenticated user bookmarked the status.
          type: boolean
        pinned:
          description: Whether the status is pinned to the author's profile; given only to the author.
          type: boolean
        poll:
          $ref: '#/components/schemas/Poll'
        card:
          $ref: '#/components/schemas/LinkCard'
        quote:
          description: |
            The status that this status quotes; omitted when it quotes none, and in a
            `quoted_status`.
          allOf:
            - $ref: '#/components/schemas/StatusQuote'
        quotable:
          description: |
            Whether the authenticated user may quote the status (its `quote_policy`, its visibility,
            and the user's follow of the author decide it); omitted for anonymous requests.
          type: boolean
        quote_policy:
          description: Who may quote the status; given only to its author.
          allOf:
            - $ref: '#/components/schemas/QuotePolicy'
    StatusContext:
      description: The thread around a status.
      type: object
      required:
        - ancestors
        - descendants
      properties:
        ancestors:
          description: The statuses the status replies to, oldest first.
          type: array
          items:
            $ref: '#/components/schemas/Status'
        descendants:
          description: The replies to the status and their replies, depth first in posting order.
          type: array
          items:
            $ref: '#/components/schemas/Status'
    StatusEdit:
      description: One revision of a status.
      type: object
      required:
        - content
        - spoiler_text
        - sensitive
        - created_at
        - media_attachments
        - emojis
      properties:
        content:
          description: The text of the revision as sanitized HTML.
          type: string
        spoiler_text:
          description: The content warning of the revision; empty when there is none.
          type: string
        sensitive:
          description: Whether the media of the revision are sensitive.
          type: boolean
        created_at:
          description: When the revision was made; the first one is when the status was posted.
          type: string
          format: date-time
        media_attachments:
          description: The media the revision attaches, in order.
          type: array
          items:
            $ref: '#/components/schemas/MediaAttachment'
        emojis:
          description: The custom emoji of the revision's text and content warning, as `Status.emojis`.
          type: array
          items:
            $ref: '#/components/schemas/CustomEmoji'
    StatusHistory:
      description: The revisions of a status.
      type: object
      required:
        - items
      properties:
        items:
          description: The revisions, oldest first.
          type: array
          items:
            $ref: '#/components/schemas/StatusEdit'
    StatusLanguageInput:
      description: A BCP 47 language tag; omitted means the user's default post language.
      type: string
      minLength: 1
      maxLength: 35
    StatusMediaInput:
      description: The media to attach, in order.
      type: array
      maxItems: 4
      items:
        $ref: '#/components/schemas/StatusMediaItem'
    StatusMediaItem:
      description: A media file to attach, with its alternative text.
      type: object
      required:
        - id
      properties:
        id:
          $ref: '#/components/schemas/Id'
        description:
          description: |
            The alternative text; omitted or empty for none. While the instance requires alt
            text (`limits.require_media_description` of `GET /instance`), a post or an edit
            whose media file has none, or only spaces, is a 422.
          type: string
          maxLength: 1500
    StatusMention:
      description: An account that a status mentions.
      type: object
      required:
        - id
        - username
        - acct
        - url
      properties:
        id:
          $ref: '#/components/schemas/Id'
        username:
          description: The username, without the domain.
          type: string
        acct:
          description: The username for local accounts, `username@domain` for remote ones.
          type: string
        domain:
          description: |
            The domain of the account: the domain of its handle, which for local accounts is the
            instance's account domain, or the host of its `uri` when a remote account has no
            confirmed handle.
          type: string
        uri:
          description: The ActivityPub id of the account's actor, on the server it belongs to.
          type: string
          format: uri
        url:
          description: The account's profile page.
          type: string
          format: uri
    StatusPage:
      description: A page of statuses.
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required:
            - items
          properties:
            items:
              description: The statuses of the page.
              type: array
              items:
                $ref: '#/components/schemas/Status'
    StatusQuote:
      description: |
        The status that a status quotes (FR-114, ADR-0069). Quotes are shown one level deep:
        `quoted_status` has no `quote` of its own, and clients link to it instead.
      type: object
      required:
        - state
      properties:
        state:
          $ref: '#/components/schemas/QuoteState'
        quoted_status:
          $ref: '#/components/schemas/Status'
    StatusReaction:
      description: The reactions to a status with one emoji.
      allOf:
        - $ref: '#/components/schemas/ReactionEmoji'
        - type: object
          required:
            - count
          properties:
            count:
              description: The number of the reactions with the emoji.
              type: integer
              minimum: 1
            me:
              description: |
                Whether the authenticated user reacted with the emoji; omitted for anonymous
                requests.
              type: boolean
    StatusReactionPage:
      description: A page of the emoji reactions to a status, newest first.
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/StatusReactor'
    StatusReactor:
      description: One emoji reaction to a status, with the account that reacted.
      type: object
      required:
        - account
        - emoji
        - created_at
      properties:
        account:
          $ref: '#/components/schemas/Account'
        emoji:
          $ref: '#/components/schemas/ReactionEmoji'
        created_at:
          description: When the account reacted.
          type: string
          format: date-time
    StatusSource:
      description: What the author typed, for editing a status.
      type: object
      required:
        - id
        - text
        - spoiler_text
        - language
      properties:
        id:
          $ref: '#/components/schemas/Id'
        text:
          description: The plain text.
          type: string
        spoiler_text:
          description: The content warning; empty when there is none.
          type: string
        language:
          description: The BCP 47 language tag; `und` when it is unknown.
          type: string
    StatusTag:
      description: A hashtag of a status.
      type: object
      required:
        - name
        - url
      properties:
        name:
          description: The hashtag as written, without `#`.
          type: string
        url:
          description: The hashtag's page.
          type: string
          format: uri
    StatusText:
      description: The plain text; the server links mentions, hashtags, and URLs.
      type: string
      minLength: 1
    SupporterCheckout:
      description: The payment provider's hosted checkout of a subscription.
      type: object
      required:
        - subscription_id
        - redirect_url
      properties:
        subscription_id:
          $ref: '#/components/schemas/Id'
        redirect_url:
          description: The checkout, to open in the same tab.
          type: string
          format: uri
    SupporterIneligibleReason:
      description: |
        Why the user may not subscribe to a supporter plan (ADR-0072 §6): `not_local`, not a user
        of this server; `email_unverified`, the primary email address is not verified;
        `restricted`, the account is suspended or its deletion is done or scheduled. Omitted when
        the user may subscribe.
      type: string
      enum:
        - not_local
        - email_unverified
        - restricted
    SupporterEndReason:
      description: |
        Why a `lapsed`, `expired`, or `revoked` subscription lost the plan's role; omitted in the
        other states. `lapsed`: no payment succeeded within 7 days after a payment failed, or the
        subscription is paused. `reversed`: a payment was refunded in full or charged back.
        `plan_retired`: the administrators retired the plan. `account_suspended`: the account was
        suspended. `account_closed`: the account was deleted. `staff`: an administrator canceled
        it. `canceled`: it was canceled, or it ended at the payment provider.
      type: string
      enum:
        - lapsed
        - reversed
        - plan_retired
        - account_suspended
        - account_closed
        - staff
        - canceled
    SupporterInterval:
      description: How often a subscription renews.
      type: string
      enum:
        - month
        - year
    SupporterListEntry:
      description: A member on the supporter list.
      type: object
      required:
        - plan_id
        - account
      properties:
        plan_id:
          $ref: '#/components/schemas/Id'
        account:
          $ref: '#/components/schemas/Account'
    SupporterListPage:
      description: |
        A page of the supporter list: the members by plan, in the order of `plans`, newest first
        within a plan.
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required:
            - plans
            - items
          properties:
            plans:
              description: The plans that are not retired, in their order (the lowest first), on every page.
              type: array
              items:
                $ref: '#/components/schemas/SupporterListPlan'
            items:
              type: array
              items:
                $ref: '#/components/schemas/SupporterListEntry'
    SupporterListPlan:
      description: |
        A plan of the supporter list. The name is written by the administrators in any language;
        render it with `dir="auto"`.
      type: object
      required:
        - id
        - name
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
    SupporterListVisibility:
      description: |
        Who may read the supporter list (the instance setting `supporter_list_visibility`, ADR-0071
        §4): `off`, nobody, and `GET /instance/supporters` is a 404; `public`, everyone;
        `signed_in`, the users signed in to this server.
      type: string
      enum:
        - 'off'
        - public
        - signed_in
    SupporterListing:
      description: Whether the user is on the supporter list.
      type: object
      required:
        - listed
      properties:
        listed:
          type: boolean
    SupporterPlan:
      description: |
        A supporter plan that takes subscriptions. The name and the description are written by
        the administrators in any language; render them with `dir="auto"`.
      type: object
      required:
        - id
        - name
        - description
        - rank
        - monthly_price
        - yearly_price
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        description:
          type: string
        rank:
          description: A higher rank is a higher plan, which includes everything of the lower ones.
          type: integer
        monthly_price:
          $ref: '#/components/schemas/Money'
        yearly_price:
          $ref: '#/components/schemas/Money'
    SupporterPlanChoice:
      description: A plan and how often its subscription renews.
      type: object
      required:
        - plan_id
        - interval
      properties:
        plan_id:
          $ref: '#/components/schemas/Id'
        interval:
          $ref: '#/components/schemas/SupporterInterval'
    SupporterPlanList:
      description: The supporter plans that take subscriptions, by rank.
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SupporterPlan'
    SupporterPlanProblem:
      description: |
        The problem of a supporter plan that breaks a rule (422,
        `/api/v1/problems/invalid-supporter-plan`); `reason` says which.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            reason:
              $ref: '#/components/schemas/SupporterPlanProblemReason'
    SupporterPlanProblemReason:
      description: |
        Why a supporter plan is refused. `name`, `description`, `monthly_price`, `currency`,
        `annual_discount_percent`, `emoji_limit`, `rank`, `visibility`: the value breaks its rule
        (a price below the provider's minimum, of its yearly price too, or a currency the
        provider does not take, included). `role_builtin`: `admin` and `moderator` cannot be a
        plan's role. `role_taken`: another plan has the role. `role_held`: users hold the role.
        `role_permissions`: the role has a permission that is not a member permission.
        `role_position`: the role is not below every staff role, or its position is outside 0 to
        999. `order_rank`: another plan has the rank. `order_position`, `order_permissions`,
        `order_emoji_limit`: a higher plan's role must be above the lower plan's, have all its
        permissions, and let its members create at least as many custom emoji.
      type: string
      enum:
        - name
        - description
        - monthly_price
        - currency
        - annual_discount_percent
        - emoji_limit
        - rank
        - visibility
        - role_builtin
        - role_taken
        - role_held
        - role_permissions
        - role_position
        - order_rank
        - order_position
        - order_permissions
        - order_emoji_limit
    SupporterPlanVisibility:
      description: |
        Whether a supporter plan takes new subscriptions. `public`: offered. `hidden`: not offered;
        its subscriptions go on.
      type: string
      enum:
        - public
        - hidden
    SupporterPortal:
      description: The payment provider's portal of the user's payment methods and invoices.
      type: object
      required:
        - url
      properties:
        url:
          description: The portal, to open in the same tab.
          type: string
          format: uri
    SupporterProgramWarning:
      description: |
        What an administrator should look at in the supporter program. `no_provider`: no payment
        provider is configured. `no_email`: the server sends no email, so nobody can verify an
        address to subscribe. `provider_mismatch`: the configured provider is not the one the
        program was enabled with; new subscriptions and changes are refused until it is disabled
        and enabled again (the subscribers subscribe again). `no_commerce_disclosure`: the
        instance publishes no commerce disclosures (the `commerce_disclosure` instance text).
      type: string
      enum:
        - no_provider
        - no_email
        - provider_mismatch
        - no_commerce_disclosure
    SupporterScheduledChange:
      description: A change to a lower plan or to the monthly price that waits for the end of the period.
      type: object
      required:
        - plan_id
        - plan_name
        - interval
        - price
        - effective_at
      properties:
        plan_id:
          $ref: '#/components/schemas/Id'
        plan_name:
          type: string
        interval:
          $ref: '#/components/schemas/SupporterInterval'
        price:
          $ref: '#/components/schemas/Money'
        effective_at:
          type: string
          format: date-time
    SupporterSubscription:
      description: |
        The authenticated user's subscription to a supporter plan. `price` is what it renews at,
        which may be lower than the plan's current price (a price change does not apply to the
        subscriptions that go on). The plan's name is written by the administrators in any
        language; render it with `dir="auto"`.
      type: object
      required:
        - id
        - state
        - plan_id
        - plan_name
        - interval
        - price
        - started_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        state:
          $ref: '#/components/schemas/SupporterSubscriptionState'
        plan_id:
          $ref: '#/components/schemas/Id'
        plan_name:
          type: string
        interval:
          $ref: '#/components/schemas/SupporterInterval'
        price:
          $ref: '#/components/schemas/Money'
        period_ends_at:
          description: |
            The end of the current period: when it renews, or, while `canceling`, when it ends;
            omitted for `pending`.
          type: string
          format: date-time
        grace_ends_at:
          description: When a `past_due` subscription loses the plan's role unless a payment succeeds.
          type: string
          format: date-time
        end_reason:
          $ref: '#/components/schemas/SupporterEndReason'
        scheduled_change:
          $ref: '#/components/schemas/SupporterScheduledChange'
        started_at:
          type: string
          format: date-time
    SupporterSubscriptionState:
      description: |
        The state of a subscription (ADR-0072 §7). `pending`: started, not paid yet. `active`:
        paid. `canceling`: canceled at the end of the period. `past_due`: a payment failed less
        than 7 days ago. `lapsed`: a payment failed more than 7 days ago, or the subscription is
        paused. `expired`: ended. `revoked`: a full refund or a chargeback. `abandoned`: ended
        before its first payment. The role is held while `active`, `canceling`, or `past_due`.
      type: string
      enum:
        - pending
        - active
        - canceling
        - past_due
        - lapsed
        - expired
        - revoked
        - abandoned
    TagSuggestion:
      description: A hashtag that the prefix search of hashtags found (ADR-0092).
      type: object
      required:
        - name
        - statuses_count
      properties:
        name:
          description: The hashtag as first written on this server, without `#`.
          type: string
        statuses_count:
          description: How many posts of visibility `public`, `local`, or `unlisted` carry the hashtag now.
          type: integer
          format: int64
          minimum: 1
    ThemeError:
      description: |
        One reason a theme cannot be saved. `code` is `unknown_token`, `duplicate_token`,
        `invalid_value` (the value does not have the token's shape; `scheme` names the color scheme
        of a color), `out_of_range` (`min` and `max` are the bounds, in rem for a length and ms for a
        duration), `low_contrast` (`token` on `background` is `ratio`:1 in `scheme` and needs
        `minimum`:1), `css_too_long` (`max` bytes), or `css_invalid` (not UTF-8 text).
      type: object
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - unknown_token
            - duplicate_token
            - invalid_value
            - out_of_range
            - low_contrast
            - css_too_long
            - css_invalid
        token:
          type: string
        scheme:
          type: string
          enum:
            - light
            - dark
        background:
          type: string
        ratio:
          type: number
        minimum:
          type: number
        min:
          type: number
        max:
          type: number
    ThemeProblem:
      description: |
        A 422 of `PUT /admin/theme`. For the type `/api/v1/problems/invalid-theme`, `theme_errors`
        lists why the theme cannot be saved; another 422 (a malformed request) has none.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            theme_errors:
              type: array
              items:
                $ref: '#/components/schemas/ThemeError'
    ThemeTokenValue:
      description: |
        The override of one design token, named without `--` (`color-accent`, `radius-md`): `light`
        and `dark` for a color token, `value` for the others.
      type: object
      required:
        - token
      properties:
        token:
          type: string
        light:
          type: string
        dark:
          type: string
        value:
          type: string
    TimelineAccess:
      description: |
        Who may read a public timeline (the instance settings `local_timeline_access` and
        `federated_timeline_access`, FR-202): `off`, nobody, and the timeline is a 404;
        `logged_in`, the users logged in to this server, and an anonymous request is a 401;
        `everyone`, everyone, anonymous visitors included.
      type: string
      enum:
        - 'off'
        - logged_in
        - everyone
    TotpSetup:
      description: A new TOTP secret to add to an authenticator app.
      type: object
      required:
        - secret
        - uri
        - qr_code
        - setup_token
        - expires_at
      properties:
        secret:
          description: The secret in base32, for typing it into the app.
          type: string
        uri:
          description: The `otpauth://totp/...` URI of the secret.
          type: string
        qr_code:
          $ref: '#/components/schemas/QrCode'
        setup_token:
          description: An opaque token that carries the secret to `POST /two_factor/totp`.
          type: string
        expires_at:
          description: When `setup_token` stops working.
          type: string
          format: date-time
    TwoFactor:
      description: Where the authenticated user's two-factor authentication (TOTP) stands.
      type: object
      required:
        - enabled
      properties:
        enabled:
          description: Whether signing in asks for a code after the password.
          type: boolean
        enrolled_at:
          description: When the authenticator app was enrolled; omitted when not enabled.
          type: string
          format: date-time
        recovery_codes_remaining:
          description: How many recovery codes are unused; omitted when not enabled.
          type: integer
          minimum: 0
    TwoFactorCodeRequest:
      description: A code that confirms an operation on two-factor authentication.
      type: object
      required:
        - code
      properties:
        code:
          description: A six-digit code of the app or an unused recovery code.
          type: string
          maxLength: 64
    UpdateBadgeChoiceRequest:
      description: Whether to show the badge of the role on the authenticated user's profile.
      type: object
      required:
        - displayed
      properties:
        displayed:
          type: boolean
    UpdateCredentialsRequest:
      description: A change of the profile; properties left out keep their current values.
      type: object
      properties:
        display_name:
          description: The display name, at most 30 characters; empty removes it.
          type: string
        note:
          description: The profile text as plain text, at most 500 characters; empty removes it.
          type: string
        fields:
          description: The metadata fields, replacing the current ones; at most 4.
          type: array
          items:
            $ref: '#/components/schemas/AccountFieldSource'
        avatar_media_id:
          description: |
            The ID of a processed image that the user uploaded, to become the avatar; empty
            removes the avatar.
          type: string
        header_media_id:
          description: |
            The ID of a processed image that the user uploaded, to become the header image;
            empty removes the header image.
          type: string
        locked:
          description: Whether follow requests need the user's approval.
          type: boolean
        bot:
          description: Whether the account is automated.
          type: boolean
        discoverable:
          description: Whether the account may be suggested to others and listed in directories.
          type: boolean
        indexable:
          description: Whether the account's profile and public posts may be indexed for search (FR-412).
          type: boolean
        ai_opt_out:
          description: Whether the account's pages state that AI may neither train on nor use them (FR-412).
          type: boolean
    UpdateCustomEmojiRequest:
      description: The settings of a custom emoji to change; absent ones stay.
      type: object
      properties:
        enabled:
          description: Whether the emoji is shown.
          type: boolean
        visible_in_picker:
          description: Whether the picker offers the local emoji.
          type: boolean
        category:
          description: The category in the picker, up to 64 characters; empty removes it.
          type: string
          maxLength: 64
        aliases:
          description: The new aliases, each following the rules of a shortcode; at most 10.
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 2
            maxLength: 30
    UpdateInstanceSettingsRequest:
      description: New values of some instance settings, saved together.
      type: object
      required:
        - values
      properties:
        values:
          description: The new value of each setting to change, by key, as a string.
          type: object
          minProperties: 1
          maxProperties: 64
          additionalProperties:
            type: string
            maxLength: 320
    UpdateOAuthAppRequest:
      description: The changes to an OAuth app, checked as for a new one; what is omitted stays.
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        website:
          description: The new home page; empty removes it.
          type: string
          maxLength: 2048
        redirect_uris:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            maxLength: 2048
        scope:
          description: The new most scope. The tokens that the app holds keep the scope they were granted.
          type: string
    UpdateOwnCustomEmojiRequest:
      description: The settings of a custom emoji that the user made to change; absent ones stay.
      type: object
      properties:
        visible_in_picker:
          description: Whether the picker offers the emoji.
          type: boolean
        category:
          description: The category in the picker, up to 64 characters; empty removes it.
          type: string
          maxLength: 64
        aliases:
          description: The new aliases, each following the rules of a shortcode; at most 10.
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 2
            maxLength: 30
    UpdatePreferencesRequest:
      description: A change of the preferences; properties left out keep their current values.
      type: object
      properties:
        locale:
          description: The UI locale, a BCP 47 language tag.
          type: string
        time_zone:
          description: The time zone, an IANA name.
          type: string
        default_visibility:
          $ref: '#/components/schemas/Visibility'
        default_quote_policy:
          $ref: '#/components/schemas/QuotePolicy'
        default_post_language:
          description: The language of new posts that name none; `und` for undetermined.
          type: string
        require_media_description:
          description: Whether clients ask for a description before posting media without one.
          type: boolean
        email_moderator_notifications:
          description: Whether the moderator notifications also come by email.
          type: boolean
        timeline_auto_insert:
          description: Whether the web client inserts new timeline posts without asking.
          type: boolean
        timeline_languages:
          description: The languages that timelines show, at most 64; empty shows every language.
          type: array
          maxItems: 64
          items:
            type: string
    UpdateRoleRequest:
      description: The changes to a role; what is omitted stays.
      type: object
      properties:
        position:
          description: The new rank of the role, from 0 to 999.
          type: integer
        permissions:
          description: The new permissions of the role, each once; empty removes them all.
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        badge:
          description: |
            The new badge of the role (ADR-0071). Its holders keep their choice to show it.
          $ref: '#/components/schemas/RoleBadge'
        remove_badge:
          description: |
            `true` removes the badge of the role, and every holder's choice to show it; a new badge
            starts hidden. Sending it with `badge` is a 422 whose `detail` names `remove_badge`.
          type: boolean
    UpdateWebhookRequest:
      description: The changes to a webhook; what is omitted stays.
      type: object
      properties:
        url:
          type: string
          maxLength: 2048
        description:
          description: The new description; empty removes it.
          type: string
          maxLength: 200
        events:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WebhookEventType'
    Visibility:
      description: |
        Who may see a status (ADR-0017): `public` everyone, listed on public timelines;
        `local` logged-in users of this instance and followers; `unlisted` everyone, kept off
        public timelines; `private` followers and mentioned accounts; `direct` mentioned
        accounts.
      type: string
      enum:
        - public
        - local
        - unlisted
        - private
        - direct
    VoteInPollRequest:
      description: A vote in the poll of a status.
      type: object
      required:
        - poll_id
        - choices
      properties:
        poll_id:
          $ref: '#/components/schemas/Id'
        choices:
          description: The indexes of the chosen options in `Poll.options`; one for a single-choice poll.
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            type: integer
            minimum: 0
            maximum: 19
    WebhookCustomEmoji:
      description: |
        The emoji of a `custom_emoji.*` message: `AdminCustomEmoji` with the operation. A
        `custom_emoji.deleted` message presents the emoji as it was before the deletion.
      allOf:
        - $ref: '#/components/schemas/AdminCustomEmoji'
        - type: object
          required:
            - operation
          properties:
            operation:
              description: |
                The operation, named as in the audit log: `custom_emoji_created`,
                `custom_emoji_image_replaced`, `custom_emoji_copied`, `custom_emoji_updated`,
                `custom_emoji_enabled`, `custom_emoji_disabled`, or `custom_emoji_deleted`.
              type: string
    WebhookEventType:
      description: |
        An event that a webhook subscribes to (ADR-0060). Subscribing needs, besides
        `manage_webhooks`, `manage_reports` for `report.*`; `manage_accounts` for
        `registration.pending`, `account.*`, `moderation_action.*`, and `appeal.created`;
        `manage_domains` for `domain_moderation_action.*`; `manage_custom_emojis` for
        `custom_emoji.*`; and nothing more for `status.created`. `report.created`: a report,
        local or from another server. `report.resolved`, `report.reopened`. `registration.pending`:
        a registration awaits a moderator. `account.created`: a registration was approved, at
        the sign-up or by a moderator. `account.updated`: a local account changed its profile.
        `moderation_action.created`, `moderation_action.lifted`: an action on an account.
        `appeal.created`. `domain_moderation_action.created`, `domain_moderation_action.lifted`.
        `status.created`: a public post of a local account. `custom_emoji.created`,
        `custom_emoji.updated` (its image, settings, aliases, or whether it is enabled), and
        `custom_emoji.deleted`: an administrator's operation on a custom emoji.
      type: string
      enum:
        - report.created
        - report.resolved
        - report.reopened
        - registration.pending
        - account.created
        - account.updated
        - moderation_action.created
        - moderation_action.lifted
        - appeal.created
        - domain_moderation_action.created
        - domain_moderation_action.lifted
        - status.created
        - custom_emoji.created
        - custom_emoji.updated
        - custom_emoji.deleted
    WebhookMessage:
      description: |
        The body of a message that a webhook receives (ADR-0060, Standard Webhooks), posted as
        `application/json` with the headers `webhook-id`, `webhook-timestamp`, and
        `webhook-signature`. `data` is what the admin API answers for the object of the event,
        presented in the transaction of the event: `AdminReport` for `report.*`,
        `AdminRegistration` for `registration.pending` and `account.created`, `AdminAccount`
        for `account.updated`, `AdminAccountAction` for `moderation_action.*`, `AdminAppeal`
        for `appeal.created`, `AdminDomainAction` for `domain_moderation_action.*`,
        `WebhookCustomEmoji` for `custom_emoji.*`, `WebhookStatus` for `status.created`, and
        `WebhookTest` for `webhook.test`. No operation returns it; docs/reference/webhooks.md
        describes it.
      type: object
      required:
        - type
        - timestamp
        - data
      properties:
        type:
          $ref: '#/components/schemas/WebhookMessageType'
        timestamp:
          description: When the event happened.
          type: string
          format: date-time
        data:
          type: object
    WebhookMessageType:
      description: |
        The type of a message: a `WebhookEventType`, or `webhook.test`, the test message of
        `POST /admin/webhooks/{id}/test`.
      type: string
      enum:
        - report.created
        - report.resolved
        - report.reopened
        - registration.pending
        - account.created
        - account.updated
        - moderation_action.created
        - moderation_action.lifted
        - appeal.created
        - domain_moderation_action.created
        - domain_moderation_action.lifted
        - status.created
        - custom_emoji.created
        - custom_emoji.updated
        - custom_emoji.deleted
        - webhook.test
    WebhookProblem:
      description: |
        The problem of a webhook that breaks a rule (422, `/api/v1/problems/invalid-webhook`);
        `reason` says which. Another 422 (a malformed request) has none.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            reason:
              $ref: '#/components/schemas/WebhookProblemReason'
            missing_permissions:
              description: The permissions that the events need and the user lacks, for `missing_permission`.
              type: array
              items:
                $ref: '#/components/schemas/Permission'
    WebhookProblemReason:
      description: |
        Why a webhook is refused. `url`: not an absolute http or https URL of at most 2048
        bytes without user info or a fragment. `description`: longer than 200 characters or with
        control characters. `events`: none, or one twice. `missing_permission`: the user lacks
        the permission of an event (`missing_permissions`).
      type: string
      enum:
        - url
        - description
        - events
        - missing_permission
    WebhookStatus:
      description: The post of a `status.created` message, always `public` and local.
      type: object
      required:
        - id
        - uri
        - account_id
        - visibility
        - spoiler_text
        - sensitive
        - language
        - content
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        uri:
          type: string
        account_id:
          $ref: '#/components/schemas/Id'
        visibility:
          type: string
        in_reply_to_uri:
          type: string
        spoiler_text:
          type: string
        sensitive:
          type: boolean
        language:
          type: string
        content:
          description: Sanitized HTML.
          type: string
        created_at:
          type: string
          format: date-time
    WebhookTest:
      description: The data of a `webhook.test` message.
      type: object
      required:
        - endpoint_id
      properties:
        endpoint_id:
          $ref: '#/components/schemas/Id'

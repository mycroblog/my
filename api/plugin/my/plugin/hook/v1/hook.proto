syntax = "proto3";

// The decision hooks: the server asks a plugin whether to accept one subject before it does. The
// plugin returns a verdict from a fixed vocabulary. It rewrites nothing, and it takes no action on
// an account. Every hook has its own destination, and one plugin may serve several of them.
package my.plugin.hook.v1;

service HookService {
  // Check returns the verdict on one subject. The server calls it again for the same subject_key
  // only when an earlier call failed, so a plugin should give the same answer again.
  rpc Check(CheckRequest) returns (CheckResponse);
}

message CheckRequest {
  // The hook that asks: inbound.status, inbound.follow, signup.check, media.check, or local.status.
  string hook = 1;
  // What identifies the subject for the hook, such as the URI of a received activity.
  string subject_key = 2;
  // True for a call of `my plugin test`, which is about no real subject and acts on nothing.
  bool probe = 3;
  // What inbound.status reviews; empty on the calls of the other hooks and on probes.
  InboundStatus inbound_status = 4;
  // The two parties of the follow, for inbound.follow.
  FollowSubject follow = 5;
  // What signup.check reviews; empty on the calls of the other hooks and on probes.
  SignupSubject signup = 6;
  // What local.status reviews; empty on the calls of the other hooks and on probes.
  LocalStatus local_status = 7;
  // What media.check reviews; empty on the calls of the other hooks and on probes.
  MediaSubject media = 8;
}

// A post from another server, or a new revision of one, for inbound.status. It holds the post as
// that server sent it. No field holds anything of a local post or of a local account, and a post
// is sent only when it is related to a local account: a local account follows its author, it names a
// local account, or it is in a thread with a local post.
message InboundStatus {
  // The type of the activity that carried the post: Create or Update. Every revision is its own subject.
  string activity_type = 1;
  string status_uri = 2;
  // The address of the post for a person; empty when it is the same as status_uri.
  string status_url = 3;
  string author_uri = 4;
  string author_domain = 5;
  // public, unlisted, private, or direct.
  string visibility = 6;
  // Whether a local account follows the author.
  bool any_local_follower = 7;
  // The post this one replies to; empty for none. The parent's text is not sent.
  string in_reply_to_uri = 8;
  string spoiler_text = 9;
  // Whether the author marked the post as sensitive.
  bool sensitive = 10;
  // When the author published it, in RFC 3339; empty when the post does not say.
  string published_at = 11;
  repeated Body bodies = 12;
  repeated Attachment attachments = 13;
  repeated string poll_options = 14;
  repeated string hashtags = 15;
  // How many accounts the post names, and how many of them are local.
  int32 mention_count = 16;
  int32 local_mention_count = 17;

  // The text of the post in one language, as sanitized HTML.
  message Body {
    // A language tag; empty when the post does not say.
    string language = 1;
    string html = 2;
  }

  // A media attachment by its URL on the remote server. The server sends no bytes of it.
  message Attachment {
    // The ActivityStreams type: Document, Image, Video, or Audio.
    string type = 1;
    string url = 2;
    // The media type, empty when the post does not say.
    string content_type = 3;
    string description = 4;
  }
}

// What inbound.follow asks about: a follow from another server of an account on this one.
message FollowSubject {
  // The ActivityPub id of the account that follows.
  string follower_uri = 1;
  // The ActivityPub id of the account on this server that it follows.
  string followee_uri = 2;
}

// SignupSubject is a sign-up that is not from an invitation, once its CAPTCHA and the sign-up block
// list passed it. The subject_key of the call is the ID the account would get, which identifies
// this attempt alone: an applicant who tries again is a new subject.
message SignupSubject {
  // The email address the applicant entered.
  string email = 1;
  // The client's IP address, empty when the server does not know it.
  string ip = 2;
}

// A post of an account on this server, before the server creates it or stores an edit of it, for
// local.status. For a new post, the subject_key of the call is the ID the post would get, which
// identifies this attempt alone: an author who posts again is a new subject. For an edit, it is the
// post's ID, "#", and the ID of the new revision, and the fields hold the post as edited; a reject
// refuses the edit alone. Only public, local, and unlisted posts are sent, by default only those of
// accounts created recently, and never those of an account whose appeal a moderator granted.
message LocalStatus {
  // The ActivityPub id the post would get.
  string status_uri = 1;
  // The ActivityPub id of the author.
  string author_uri = 2;
  // The author's username on this server.
  string author_username = 3;
  // When the author's account was created, in RFC 3339.
  string account_created_at = 4;
  // public, local, or unlisted. A local post never leaves this server.
  string visibility = 5;
  // The post this one replies to; empty for none. The parent's text is not sent.
  string in_reply_to_uri = 6;
  // The post this one quotes; empty for none. Its text is not sent.
  string quote_uri = 7;
  // A language tag; "und" when the author's language is not known.
  string language = 8;
  string spoiler_text = 9;
  // Whether the author marked the media as sensitive.
  bool sensitive = 10;
  // The text as the author typed it.
  string text = 11;
  // The text as the server renders it, in HTML.
  string html = 12;
  // The alt texts of the attachments in order, empty for one without. The server sends no media.
  repeated string attachment_descriptions = 13;
  repeated string poll_options = 14;
  repeated string hashtags = 15;
  // How many accounts the post names.
  int32 mention_count = 16;
}

// MediaSubject is a file a local account uploaded, once it is processed and before anyone can use
// it. The subject_key of the call is the ID of the file. The original file is never sent: the
// server sends the smallest image it made of the file, which has no metadata. Nothing else of the
// account or of a post is sent, not even the alt text.
message MediaSubject {
  // What the file is for: attachment, avatar, header, or emoji.
  string purpose = 1;
  // image, video, or audio.
  string media_type = 2;
  // The smallest still image made of the file, for a video or audio file of its poster or cover.
  // Empty when there is none, such as for audio without a cover.
  bytes image = 3;
  // The media type of image, such as image/webp; empty when image is.
  string image_content_type = 4;
  int32 image_width = 5;
  int32 image_height = 6;
  // The size of the file as uploaded, in pixels; 0 for audio.
  int32 width = 7;
  int32 height = 8;
  // How long a video or audio file plays, in milliseconds; 0 for an image.
  int64 duration_ms = 9;
  // Whether the image moves: an animation, or a video. image holds its first frame or poster.
  bool animated = 10;
}

message CheckResponse {
  // A name in JSON. VERDICT_UNSPECIFIED, an empty response included, a name this version does not
  // know, and a verdict the hook does not take are all failures and follow the hook's failure
  // behaviour.
  Verdict verdict = 1;
  // A name in JSON. May be left out. A name this version does not know reads as left out.
  Reason reason = 2;
  // A short note for the moderators, in plain text. The server keeps the first 200 characters on
  // one line and shows it to nobody else.
  string note = 3;
}

// The verdicts. Which of them a hook takes:
// inbound.status: ALLOW, DROP, FLAG, MARK_SENSITIVE.
// inbound.follow: ALLOW, DROP, FLAG.
// signup.check: ALLOW, REQUIRE_APPROVAL, REJECT.
// media.check: ALLOW, MARK_SENSITIVE, FLAG, REJECT.
// local.status: ALLOW, FLAG, REJECT. A REJECT can be appealed by the author, which people review.
enum Verdict {
  VERDICT_UNSPECIFIED = 0;
  // Go on as if the hook were not there.
  VERDICT_ALLOW = 1;
  // Stop the subject and store nothing of it.
  VERDICT_DROP = 2;
  // Go on, and file a report for the moderators.
  VERDICT_FLAG = 3;
  // Go on, and show the attachments as sensitive.
  VERDICT_MARK_SENSITIVE = 4;
  // Go on, and hold the sign-up for approval.
  VERDICT_REQUIRE_APPROVAL = 5;
  // Refuse the subject and keep nothing of it. A person told about it sees fixed text that holds
  // nothing of the response.
  VERDICT_REJECT = 6;
}

enum Reason {
  REASON_UNSPECIFIED = 0;
  REASON_SPAM = 1;
  REASON_HARASSMENT = 2;
  REASON_SEXUAL = 3;
  REASON_VIOLENCE = 4;
  REASON_ILLEGAL = 5;
  REASON_MALWARE = 6;
  REASON_OTHER = 7;
}

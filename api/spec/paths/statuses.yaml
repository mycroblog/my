# SPDX-License-Identifier: MIT
post:
  operationId: createStatus
  summary: Post a status
  description: |
    Posts a status as the authenticated user. Retrying with the same `Idempotency-Key`
    returns the status posted with it. Attached media must be the user's own uploads that
    finished processing (422 otherwise). A status with a `poll` attaches no media, and a
    poll outside the limits of `PollInput` is a 422 (FR-112).
  tags: [statuses]
  security:
    - oauth2: ["write:statuses"]
  parameters:
    - $ref: ../components/parameters/IdempotencyKey.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CreateStatusRequest.yaml
  responses:
    "200":
      description: The posted status.
      headers:
        Cache-Control:
          $ref: ../components/headers/CacheControl.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Status.yaml
    default:
      $ref: ../components/responses/Problem.yaml

# SPDX-License-Identifier: MIT
get:
  operationId: getNotificationRequest
  summary: Get a notification request
  description: The request of a source account; a 404 when the list of requests does not show one.
  tags: [notifications]
  security:
    - oauth2: ["read:notifications"]
  parameters:
    - $ref: ../components/parameters/AccountId.yaml
  responses:
    "200":
      description: The request.
      headers:
        Cache-Control:
          $ref: ../components/headers/CacheControl.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/NotificationRequest.yaml
    default:
      $ref: ../components/responses/Problem.yaml

# SPDX-License-Identifier: MIT
get:
  operationId: listLinkCardDomainRules
  summary: List the rules of the link card crawler
  description: |
    Every rule by which the crawler of link cards fetches nothing, or no images, from a domain
    and its subdomains, by domain. The list is not paginated; a server keeps at most 1,000
    rules. Needs the `manage_settings` permission.
  tags: [admin-server]
  security:
    - oauth2: ["admin:read"]
  responses:
    "200":
      description: The rules.
      headers:
        Cache-Control:
          $ref: ../components/headers/CacheControl.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/LinkCardDomainRuleList.yaml
    default:
      $ref: ../components/responses/Problem.yaml
post:
  operationId: setLinkCardDomainRule
  summary: Set the rule of a domain for the link card crawler
  description: |
    Records the rule of a domain, replacing the rule it has, and records the change in the
    audit log. The rule takes effect at once, also on the cards already kept, and bears only on
    link cards: federation and other remote media follow the domain actions. A domain that is
    not a host, a note longer than 5,000 characters, or a new rule beyond 1,000 is a 422 naming
    the property (`domain`, `note`, `rules`). Needs the `manage_settings` permission.
  tags: [admin-server]
  security:
    - oauth2: ["admin:write"]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/SetLinkCardDomainRuleRequest.yaml
  responses:
    "200":
      description: The rule.
      headers:
        Cache-Control:
          $ref: ../components/headers/CacheControl.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/LinkCardDomainRule.yaml
    default:
      $ref: ../components/responses/Problem.yaml

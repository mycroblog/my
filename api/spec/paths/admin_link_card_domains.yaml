# SPDX-License-Identifier: MIT
get:
  operationId: listLinkCardDomainRules
  summary: List the rules of the link card crawler
  description: |
    Every rule by which the crawler of link cards fetches nothing, or no images, from a domain
    and its subdomains, by domain. The list is not paginated; a server keeps at most 1,000
    rules. Needs the `manage_settings` permission.
  tags: [admin-server]
  security:
    - oauth2: ["admin:read"]
  responses:
    "200":
      description: The rules.
      headers:
        Cache-Control:
          $ref: ../components/headers/CacheControl.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/LinkCardDomainRuleList.yaml
    default:
      $ref: ../components/responses/Problem.yaml

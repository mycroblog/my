parameters:
  - $ref: ../components/parameters/InteractionRequestId.yaml
post:
  operationId: rejectInteractionRequest
  summary: Refuse an interaction request
  description: |
    Refuses the reply, boost, or quote: it stays out of the thread and the counts. The account is told, and its server gets a `Reject`.
    A request that is answered already is a 409; one of another user's status, or of a deleted
    status, is a 404.
  tags: [statuses]
  security:
    - oauth2: ["write:statuses"]
  responses:
    "200":
      description: The request, answered.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/InteractionRequest.yaml
    default:
      $ref: ../components/responses/Problem.yaml

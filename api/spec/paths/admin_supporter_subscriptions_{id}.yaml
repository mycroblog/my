# SPDX-License-Identifier: MIT
get:
  operationId: getSupporterSubscription
  summary: Get a subscription
  description: |
    One subscription to a supporter plan, as the list shows it. An unknown subscription is a 404.
    Needs the `manage_supporters` permission.
  tags: [admin-server]
  security:
    - oauth2: ["admin:read"]
  parameters:
    - $ref: ../components/parameters/SupporterSubscriptionId.yaml
  responses:
    "200":
      description: The subscription.
      headers:
        Cache-Control:
          $ref: ../components/headers/CacheControl.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AdminSupporterSubscription.yaml
    default:
      $ref: ../components/responses/Problem.yaml

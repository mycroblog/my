# SPDX-License-Identifier: MIT
get:
  operationId: getAppeal
  summary: Get an appeal of a moderation action
  description: An unknown ID is a 404. Needs the `manage_accounts` permission.
  tags: [admin-moderation]
  security:
    - oauth2: ["admin:read"]
  parameters:
    - $ref: ../components/parameters/AppealId.yaml
  responses:
    "200":
      $ref: ../components/responses/AdminAppeal.yaml
    default:
      $ref: ../components/responses/Problem.yaml

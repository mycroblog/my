# SPDX-License-Identifier: MIT
parameters:
  - $ref: ../components/parameters/StatusId.yaml
put:
  operationId: setStatusQuotePolicy
  summary: Change who may quote the authenticated user's status
  description: |
    Changes the `quote_policy` of a status of the user (ADR-0069 §1); the approvals given
    before stay, and each is revoked on its own. Another account's status is a 403 when the
    user may see it and a 404 otherwise.
  tags: [statuses]
  security:
    - oauth2: ["write:statuses"]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/SetQuotePolicyRequest.yaml
  responses:
    "200":
      $ref: ../components/responses/StatusAfterAction.yaml
    default:
      $ref: ../components/responses/Problem.yaml

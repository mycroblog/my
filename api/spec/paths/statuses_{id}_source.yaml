# SPDX-License-Identifier: MIT
parameters:
  - $ref: ../components/parameters/StatusId.yaml
get:
  operationId: getStatusSource
  summary: Get the source of the authenticated user's status, for editing it
  description: Another account's status is a 404, the same as a missing one.
  tags: [statuses]
  security:
    - oauth2: ["read:statuses"]
  responses:
    "200":
      description: The source.
      headers:
        Cache-Control:
          $ref: ../components/headers/CacheControl.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/StatusSource.yaml
    default:
      $ref: ../components/responses/Problem.yaml

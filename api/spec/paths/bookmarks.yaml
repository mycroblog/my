# SPDX-License-Identifier: MIT
get:
  operationId: listBookmarks
  summary: List the posts the authenticated user bookmarked, newest bookmark first
  tags: [statuses]
  security:
    - oauth2: ["read:bookmarks"]
  parameters:
    - $ref: ../components/parameters/Cursor.yaml
    - $ref: ../components/parameters/Limit.yaml
  responses:
    "200":
      description: |
        A page of bookmarked posts. Posts that the user can no longer see are left out, so
        a page may hold fewer posts than `limit` and still have a `next_cursor`.
      headers:
        Cache-Control:
          $ref: ../components/headers/CacheControl.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/StatusPage.yaml
    default:
      $ref: ../components/responses/Problem.yaml

# SPDX-License-Identifier: MIT
get:
  operationId: verifyAccountCredentials
  summary: Get the authenticated user's own account
  tags: [accounts]
  security:
    - oauth2: ["read:accounts"]
  responses:
    "200":
      description: The account that the access token acts as, with the source of its profile.
      headers:
        Cache-Control:
          $ref: ../components/headers/CacheControl.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CredentialAccount.yaml
    default:
      $ref: ../components/responses/Problem.yaml

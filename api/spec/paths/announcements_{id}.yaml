# SPDX-License-Identifier: MIT
get:
  operationId: getAnnouncement
  summary: Get an announcement
  description: |
    One announcement of `listAnnouncementHistory`: a published one whose `published_at`
    has passed, one whose window has ended included (`ended`), with whether the user has read
    it. A draft, a withdrawn one, one that has not started to show, or an unknown ID is a 404.
  tags: [announcements]
  security:
    - oauth2: ["read:notifications"]
  parameters:
    - $ref: ../components/parameters/AnnouncementId.yaml
  responses:
    "200":
      description: The announcement.
      headers:
        Cache-Control:
          $ref: ../components/headers/CacheControl.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Announcement.yaml
    default:
      $ref: ../components/responses/Problem.yaml

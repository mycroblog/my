# SPDX-License-Identifier: MIT
get:
  operationId: getTwoFactor
  x-first-party-only: true
  summary: Get where the authenticated user's two-factor authentication stands
  tags: [two_factor]
  security:
    - oauth2: ["read:accounts"]
  responses:
    "200":
      description: The two-factor authentication of the user.
      headers:
        Cache-Control:
          $ref: ../components/headers/CacheControl.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/TwoFactor.yaml
    default:
      $ref: ../components/responses/Problem.yaml

# SPDX-License-Identifier: MIT
get:
  operationId: listPendingRegistrations
  summary: List the registrations that await approval
  description: |
    The sign-ups that wait for a moderator's decision (FR-721), with the reasons their
    applicants gave, longest waiting first. Needs the `manage_accounts` permission.
  tags: [admin-moderation]
  security:
    - oauth2: ["admin:read"]
  parameters:
    - $ref: ../components/parameters/Cursor.yaml
    - $ref: ../components/parameters/Limit.yaml
  responses:
    "200":
      description: A page of pending registrations.
      headers:
        Cache-Control:
          $ref: ../components/headers/CacheControl.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AdminRegistrationPage.yaml
    default:
      $ref: ../components/responses/Problem.yaml

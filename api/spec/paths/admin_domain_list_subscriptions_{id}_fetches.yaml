# SPDX-License-Identifier: MIT
get:
  operationId: listDomainListFetches
  summary: List the fetches of a subscription
  description: |
    The fetches of the list, newest first, failed ones included with why they failed. An
    unknown or deleted ID is a 404. Needs the `manage_domains` permission.
  tags: [admin-moderation]
  security:
    - oauth2: ["admin:read"]
  parameters:
    - $ref: ../components/parameters/DomainListSubscriptionId.yaml
    - $ref: ../components/parameters/Cursor.yaml
    - $ref: ../components/parameters/Limit.yaml
  responses:
    "200":
      description: A page of fetches.
      headers:
        Cache-Control:
          $ref: ../components/headers/CacheControl.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AdminDomainListFetchPage.yaml
    default:
      $ref: ../components/responses/Problem.yaml

# SPDX-License-Identifier: MIT
get:
  operationId: listFavourites
  summary: List the posts the authenticated user favourited, newest favourite first
  tags: [statuses]
  security:
    - oauth2: ["read:favourites"]
  parameters:
    - $ref: ../components/parameters/Cursor.yaml
    - $ref: ../components/parameters/Limit.yaml
  responses:
    "200":
      description: |
        A page of favourited posts. Posts that the user can no longer see, and the posts of the
        boards of events, are left out, so a page may hold fewer posts than `limit` and still have
        a `next_cursor`. `direct` posts need `read:direct`.
      headers:
        Cache-Control:
          $ref: ../components/headers/CacheControl.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/StatusPage.yaml
    default:
      $ref: ../components/responses/Problem.yaml

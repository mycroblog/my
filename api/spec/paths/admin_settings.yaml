get:
  operationId: listInstanceSettings
  summary: List the instance settings
  description: |
    Every instance setting (FR-705, docs/operations/instance-settings.md): its current
    value, or its default when it has never been set, with what it accepts. The policies
    that administrators change at run time live here; the deployment configuration does
    not. Needs the `manage_settings` permission.
  tags: [admin-server]
  security:
    - oauth2: ["admin:read"]
  responses:
    "200":
      $ref: ../components/responses/AdminSettingList.yaml
    default:
      $ref: ../components/responses/Problem.yaml
patch:
  operationId: updateInstanceSettings
  summary: Change instance settings
  description: |
    Sets the settings named in `values`, all of them or none: each value is checked against
    its key and stored in its canonical form (`TRUE` is `true`, `ja_jp` is `ja-JP`), and
    each change is kept as a revision and audited (`setting_changed`). Setting the current
    value again still records a revision, so clients send only the settings they change.
    The changes take effect on the next request. An unknown key, or a value its key
    rejects, is a 422 naming the key, and nothing is changed. Needs the `manage_settings`
    permission.
  tags: [admin-server]
  security:
    - oauth2: ["admin:write"]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/UpdateInstanceSettingsRequest.yaml
  responses:
    "200":
      $ref: ../components/responses/AdminSettingList.yaml
    default:
      $ref: ../components/responses/Problem.yaml

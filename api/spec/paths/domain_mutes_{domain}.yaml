# SPDX-License-Identifier: MIT
delete:
  operationId: unmuteDomain
  summary: Unmute a domain
  description: The domain is normalized as in `muteDomain`. Without a mute it changes nothing.
  tags: [accounts]
  security:
    - oauth2: ["write:mutes"]
  parameters:
    - name: domain
      in: path
      required: true
      description: The muted domain, such as `mastodon.example`.
      schema:
        type: string
        minLength: 1
        maxLength: 253
  responses:
    "204":
      description: The domain is not muted.
    default:
      $ref: ../components/responses/Problem.yaml

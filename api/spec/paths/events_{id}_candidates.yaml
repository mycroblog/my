parameters:
  - $ref: ../components/parameters/EventId.yaml
get:
  operationId: listEventCandidates
  summary: List the candidate dates of an event
  description: |
    The candidate dates of the event's date poll that were not withdrawn, the earliest start
    first, with how many users answered each `yes`, `maybe`, or `no` and the user's own answer,
    for everyone who sees the event. An event created with a date has none.
  tags: [events]
  security:
    - oauth2: ["read:events"]
  responses:
    "200":
      description: The candidates.
      headers:
        Cache-Control:
          $ref: ../components/headers/CacheControl.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/EventCandidateList.yaml
    default:
      $ref: ../components/responses/Problem.yaml
post:
  operationId: addEventCandidate
  summary: Add a candidate date to an event
  description: |
    Adds a candidate date to the date poll of an event that has no date yet, by the organizer or
    a co-organizer. A poll has up to 20 candidates; one more, the same date twice, and a date in
    the past are a 422.
    A 403 `/api/v1/problems/event-not-organizer` for a user who neither organizes nor co-organizes
    the event. A 409 `/api/v1/problems/event-closed` for a cancelled event, and a 409
    `/api/v1/problems/event-scheduled` for an event whose date was confirmed.
  tags: [events]
  security:
    - oauth2: ["write:events"]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/EventCandidateCreate.yaml
  responses:
    "201":
      description: The candidate.
      headers:
        Cache-Control:
          $ref: ../components/headers/CacheControl.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/EventCandidate.yaml
    default:
      $ref: ../components/responses/Problem.yaml

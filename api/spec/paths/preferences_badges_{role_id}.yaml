# SPDX-License-Identifier: MIT
parameters:
  - $ref: ../components/parameters/BadgeRoleId.yaml
put:
  operationId: updateBadgeChoice
  summary: Show or hide the badge of a role on the authenticated user's profile
  description: |
    Shows or hides the badge of a role that the user holds on their profile (ADR-0071). The
    badge appears in `Account.badges` of the user's own account endpoints only, never on
    posts, in lists of accounts, or to other servers. A role that the user does not hold, or
    that has no badge, is a 404.
  tags: [preferences]
  security:
    - oauth2: ["write:accounts"]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/UpdateBadgeChoiceRequest.yaml
  responses:
    "200":
      description: The choice as saved.
      headers:
        Cache-Control:
          $ref: ../components/headers/CacheControl.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BadgeChoice.yaml
    default:
      $ref: ../components/responses/Problem.yaml

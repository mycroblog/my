# SPDX-License-Identifier: MIT
get:
  operationId: getDomainAction
  summary: Get a moderation action on a domain
  description: An unknown ID is a 404. Needs the `manage_domains` permission.
  tags: [admin-moderation]
  security:
    - oauth2: ["admin:read"]
  parameters:
    - $ref: ../components/parameters/DomainActionId.yaml
  responses:
    "200":
      $ref: ../components/responses/AdminDomainAction.yaml
    default:
      $ref: ../components/responses/Problem.yaml

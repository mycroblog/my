# SPDX-License-Identifier: MIT
get:
  operationId: listFollowRequests
  summary: List the follow requests to the viewer
  description: |
    The accounts whose follow requests await the viewer's approval, newest first.
    Deactivated and deleted accounts are left out.
  tags: [accounts]
  security:
    - oauth2: ["read:follows"]
  parameters:
    - $ref: ../components/parameters/Cursor.yaml
    - $ref: ../components/parameters/Limit.yaml
  responses:
    "200":
      $ref: ../components/responses/AccountPage.yaml
    default:
      $ref: ../components/responses/Problem.yaml

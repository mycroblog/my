# SPDX-License-Identifier: MIT
get:
  operationId: listAdminAnnouncements
  summary: List the announcements
  description: |
    Every announcement, drafts and withdrawn ones included, newest first (FR-726). The
    list is not paginated. Needs the `manage_announcements` permission.
  tags: [admin-server]
  security:
    - oauth2: ["admin:read"]
  responses:
    "200":
      description: The announcements.
      headers:
        Cache-Control:
          $ref: ../components/headers/CacheControl.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AdminAnnouncementList.yaml
    default:
      $ref: ../components/responses/Problem.yaml
post:
  operationId: createAdminAnnouncement
  summary: Write an announcement
  description: |
    Writes an announcement to every local user, a draft unless `publish` is set. The title is
    plain text and the text Markdown; the users get the text as sanitized HTML. Once it starts
    to show (its publication, or the start of its window when that comes later), every local
    user gets an `announcement` notification, unless they turned it off. A blank title, one of
    more than 100 grapheme clusters or of more than one line, is a 422 naming `title`; a blank
    text or one longer than 5,000 characters is a 422 naming `text`, and a window that ends when or before it starts a
    422 naming `ends_at`. Recorded in the audit log. Needs the `manage_announcements`
    permission.
  tags: [admin-server]
  security:
    - oauth2: ["admin:write"]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/AdminAnnouncementCreateRequest.yaml
  responses:
    "200":
      $ref: ../components/responses/AdminAnnouncement.yaml
    default:
      $ref: ../components/responses/Problem.yaml

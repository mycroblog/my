# SPDX-License-Identifier: MIT
post:
  operationId: fetchDomainListSubscription
  summary: Fetch a subscribed list now
  description: |
    Queues a fetch of the list, which then applies it as the daily fetch does. The request is
    audited. An unknown or deleted ID is a 404. Needs the `manage_domains` permission.
  tags: [admin-moderation]
  security:
    - oauth2: ["admin:write"]
  parameters:
    - $ref: ../components/parameters/DomainListSubscriptionId.yaml
  responses:
    "202":
      description: The fetch is queued.
    default:
      $ref: ../components/responses/Problem.yaml

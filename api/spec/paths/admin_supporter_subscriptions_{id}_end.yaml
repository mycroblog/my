# SPDX-License-Identifier: MIT
post:
  operationId: endSupporterSubscription
  summary: End a subscription at once
  description: |
    Ends a subscription at once, without a refund: the role goes now, and the
    payment provider stops billing. A refund is the operator's to make at the provider. A
    subscription that has ended is a 409 `/api/v1/problems/subscription-ended`, and an
    unknown one a 404. Recorded in the audit log. Needs the `manage_supporters` permission.
  tags: [admin-server]
  security:
    - oauth2: ["admin:write"]
  parameters:
    - $ref: ../components/parameters/SupporterSubscriptionId.yaml
  responses:
    "200":
      description: The subscription after it ended.
      headers:
        Cache-Control:
          $ref: ../components/headers/CacheControl.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AdminSupporterSubscription.yaml
    default:
      $ref: ../components/responses/Problem.yaml

# SPDX-License-Identifier: MIT
get:
  operationId: listUXMeasurements
  x-permission: manage_errors
  summary: List the UX measurements
  description: |
    The samples of how fast the web client responded (`POST /client_measurements`), summed over
    the last `hours` hours, the current one included, by metric and name, with their buckets and
    75th percentile. The server keeps the hourly counts for 30 days. Needs the `manage_errors`
    permission.
  tags: [admin-server]
  security:
    - oauth2: ["admin:read"]
  parameters:
    - name: hours
      in: query
      required: false
      description: The hours of the window, 24 by default.
      schema:
        type: integer
        minimum: 1
        maximum: 720
        default: 24
  responses:
    "200":
      description: The measurements of the window.
      headers:
        Cache-Control:
          $ref: ../components/headers/CacheControl.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/UXMeasurementList.yaml
    default:
      $ref: ../components/responses/Problem.yaml

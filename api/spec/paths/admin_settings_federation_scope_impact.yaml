# SPDX-License-Identifier: MIT
get:
  operationId: getFederationScopeImpact
  summary: Count what switching federation to the allowlist would end
  description: |
    How many follows switching the instance setting `federation_scope` to `allowlist` with the
    current allowlist would end, how many local accounts would lose one, and the servers with the
    most of them. Administrators read it before they switch, which ends those follows for good.
    Needs the `manage_settings` permission.
  tags: [admin-server]
  security:
    - oauth2: ["admin:read"]
  responses:
    "200":
      description: The count.
      headers:
        Cache-Control:
          $ref: ../components/headers/CacheControl.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/FederationScopeImpact.yaml
    default:
      $ref: ../components/responses/Problem.yaml

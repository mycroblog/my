# SPDX-License-Identifier: MIT
get:
  operationId: getAccountAction
  summary: Get a moderation action on an account
  description: An unknown ID is a 404. Needs the `manage_accounts` permission.
  tags: [admin-moderation]
  security:
    - oauth2: ["admin:read"]
  parameters:
    - $ref: ../components/parameters/AccountActionId.yaml
  responses:
    "200":
      $ref: ../components/responses/AdminAccountAction.yaml
    default:
      $ref: ../components/responses/Problem.yaml

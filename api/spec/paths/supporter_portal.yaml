# SPDX-License-Identifier: MIT
post:
  operationId: openSupporterPortal
  summary: Open the payment provider's portal of the authenticated user
  description: |
    The payment provider's portal of the user's payment methods and invoices, which returns
    to `/settings/supporter` of the web client (ADR-0072 §8). Plans change on this server, not in
    the portal. A 409 `/api/v1/problems/subscription-ended` for a user whom the provider does not
    know.
  tags: [supporters]
  security:
    - oauth2: ["write:supporters"]
  responses:
    "200":
      description: The portal to open.
      headers:
        Cache-Control:
          $ref: ../components/headers/CacheControl.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/SupporterPortal.yaml
    default:
      $ref: ../components/responses/Problem.yaml

# SPDX-License-Identifier: MIT
post:
  operationId: addReportNote
  summary: Write a note on a report
  description: |
    Adds an internal note to the report (FR-710). Notes are shown to the moderators only,
    never to the target or the reporter, and cannot be edited or removed. An unknown ID is
    a 404. Needs the `manage_reports` permission.
  tags: [admin-moderation]
  security:
    - oauth2: ["admin:write"]
  parameters:
    - $ref: ../components/parameters/ReportId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CreateReportNoteRequest.yaml
  responses:
    "200":
      $ref: ../components/responses/AdminReportDetail.yaml
    default:
      $ref: ../components/responses/Problem.yaml

get:
  operationId: listOAuthApps
  x-first-party-only: true
  summary: List the OAuth apps that the authenticated user registered
  description: The apps that the user registered and has not deleted, oldest first.
  tags: [oauth-apps]
  security:
    - oauth2: ["read:accounts"]
  responses:
    "200":
      description: The apps.
      headers:
        Cache-Control:
          $ref: ../components/headers/CacheControl.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/OAuthAppList.yaml
    default:
      $ref: ../components/responses/Problem.yaml
post:
  operationId: createOAuthApp
  x-first-party-only: true
  summary: Register an OAuth app
  description: |
    Registers a public or confidential app of the user for a bot, a script, or a client of
    their own (ADR-0090). A confidential app's `client_secret` is in this response only.
    Other users authorize the app at `/oauth/authorize` as any third-party app, and the user
    may issue its tokens to their own account with `POST /oauth_apps/{id}/tokens`. The app
    stops working while the user cannot use the server (suspended or deleted).

    A setting that breaks a rule is a 422 naming it, a user with 25 apps a 409
    `/api/v1/problems/too-many-oauth-apps`, and a server that does not let users register
    apps (the instance setting `user_app_registration`) a 403
    `/api/v1/problems/oauth-app-registration-disabled`.
  tags: [oauth-apps]
  security:
    - oauth2: ["write:accounts"]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CreateOAuthAppRequest.yaml
  responses:
    "201":
      description: The new app.
      headers:
        Cache-Control:
          $ref: ../components/headers/CacheControl.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/OAuthAppCreated.yaml
    default:
      $ref: ../components/responses/Problem.yaml

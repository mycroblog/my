# SPDX-License-Identifier: MIT
parameters:
  - $ref: ../components/parameters/LoginProviderId.yaml
get:
  operationId: getAdminLoginProvider
  summary: Get a login provider
  description: An unknown or deleted ID is a 404. Needs the `manage_login_providers` permission.
  tags: [admin-server]
  security:
    - oauth2: ["admin:read"]
  responses:
    "200":
      $ref: ../components/responses/AdminLoginProvider.yaml
    default:
      $ref: ../components/responses/Problem.yaml
patch:
  operationId: updateLoginProvider
  summary: Change a login provider
  description: |
    Changes what the request names and keeps the rest; empty `scopes`, `claims`, or
    `organizations`, or `guilds` remove them. A refused change is a 422
    `/api/v1/problems/invalid-login-provider`. A change is recorded in the audit log. An
    unknown or deleted ID is a 404. Needs the `manage_login_providers` permission.
  tags: [admin-server]
  security:
    - oauth2: ["admin:write"]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/UpdateLoginProviderRequest.yaml
  responses:
    "200":
      $ref: ../components/responses/AdminLoginProvider.yaml
    "422":
      $ref: ../components/responses/LoginProviderProblem.yaml
    default:
      $ref: ../components/responses/Problem.yaml
delete:
  operationId: deleteLoginProvider
  summary: Delete a login provider
  description: |
    Deletes the provider for good: the users linked to it no longer sign in with it. The
    deletion is recorded in the audit log. An unknown or deleted ID is a 404. Needs the `manage_login_providers` permission.
  tags: [admin-server]
  security:
    - oauth2: ["admin:write"]
  responses:
    "204":
      description: The login provider is deleted.
    default:
      $ref: ../components/responses/Problem.yaml

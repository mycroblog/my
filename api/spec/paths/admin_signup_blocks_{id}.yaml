# SPDX-License-Identifier: MIT
get:
  operationId: getSignupBlock
  summary: Get a sign-up block
  description: An unknown ID is a 404. Needs the `manage_accounts` permission.
  tags: [admin-moderation]
  security:
    - oauth2: ["admin:read"]
  parameters:
    - $ref: ../components/parameters/SignupBlockId.yaml
  responses:
    "200":
      $ref: ../components/responses/AdminSignupBlock.yaml
    default:
      $ref: ../components/responses/Problem.yaml

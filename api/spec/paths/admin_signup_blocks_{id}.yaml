# SPDX-License-Identifier: MIT
get:
  operationId: getSignupBlock
  summary: Get a sign-up block
  description: |
    An unknown ID is a 404. Needs the `manage_accounts` permission.

    On a one-person server (`Instance.single_user`) it is a 404 of the type
    `/api/v1/problems/single-user-mode`.
  tags: [admin-moderation]
  security:
    - oauth2: ["admin:read"]
  parameters:
    - $ref: ../components/parameters/SignupBlockId.yaml
  responses:
    "200":
      $ref: ../components/responses/AdminSignupBlock.yaml
    default:
      $ref: ../components/responses/Problem.yaml

# SPDX-License-Identifier: MIT
parameters:
  - $ref: ../components/parameters/EventId.yaml
get:
  operationId: listEventAttendees
  summary: List the attendees of an event
  description: |
    The attendees who answer `going` or `maybe`, in the order of their answers, for everyone who
    sees the event.
  tags: [events]
  security:
    - oauth2: ["read:events"]
  parameters:
    - $ref: ../components/parameters/Cursor.yaml
    - $ref: ../components/parameters/Limit.yaml
  responses:
    "200":
      description: A page of the attendees.
      headers:
        Cache-Control:
          $ref: ../components/headers/CacheControl.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/EventAttendeePage.yaml
    default:
      $ref: ../components/responses/Problem.yaml

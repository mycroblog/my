# SPDX-License-Identifier: MIT
post:
  operationId: resolveReport
  summary: Resolve a report
  description: |
    Resolves an open report with an outcome. Resolving a resolved report changes nothing
    and keeps its outcome. An unknown ID is a 404. Needs the `manage_reports` permission.
  tags: [admin-moderation]
  security:
    - oauth2: ["admin:write"]
  parameters:
    - $ref: ../components/parameters/ReportId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ResolveReportRequest.yaml
  responses:
    "200":
      $ref: ../components/responses/AdminReportDetail.yaml
    default:
      $ref: ../components/responses/Problem.yaml

# SPDX-License-Identifier: MIT
get:
  operationId: listAnnouncements
  summary: List the announcements
  description: |
    The server's announcements that every local user sees now (FR-726): published, and
    within their window. The ones whose `published_at` is the latest come first, each with
    whether the user has read it. The list is not paginated; `listAnnouncementHistory` pages
    through the past ones too.
  tags: [announcements]
  security:
    - oauth2: ["read:notifications"]
  responses:
    "200":
      description: The announcements.
      headers:
        Cache-Control:
          $ref: ../components/headers/CacheControl.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AnnouncementList.yaml
    default:
      $ref: ../components/responses/Problem.yaml

# SPDX-License-Identifier: MIT
post:
  operationId: syncOwnSupporterSubscription
  summary: Re-read the authenticated user's subscription from the payment provider
  description: |
    What the web client sends when the payment provider's checkout or portal returns to it:
    it queues a re-read of the user's subscription from the provider, without waiting for its
    webhook (ADR-0072 §6), and answers the subscription as it is now. Read it again to see the
    result. A 404 while the program is disabled.
  tags: [supporters]
  security:
    - oauth2: ["write:supporters"]
  responses:
    "200":
      description: The subscription as it is now, or none.
      headers:
        Cache-Control:
          $ref: ../components/headers/CacheControl.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/OwnSupporterSubscription.yaml
    default:
      $ref: ../components/responses/Problem.yaml

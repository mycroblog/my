# SPDX-License-Identifier: MIT
get:
  operationId: listBillingImports
  summary: List the state of the billing imports
  description: |
    The state of the imports of every cloud provider of `billing_sources` (ADR-0068), in its
    order: the last attempt and its failure, the last success, the billed requests of the UTC
    day and month with their caps, the bytes billed this month, and the billing months of the
    last year with imported costs, each an estimate, final, or corrected, with its totals. The
    list is empty when nothing is imported. Needs the `manage_finance` permission.
  tags: [admin-server]
  security:
    - oauth2: ["admin:read"]
  responses:
    "200":
      description: The billing sources.
      headers:
        Cache-Control:
          $ref: ../components/headers/CacheControl.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BillingImportList.yaml
    default:
      $ref: ../components/responses/Problem.yaml

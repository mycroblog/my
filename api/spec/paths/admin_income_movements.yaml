# SPDX-License-Identifier: MIT
get:
  operationId: listIncomeMovements
  summary: List the money movements of the income
  description: |
    The payment provider's money movements that the income records keep (ADR-0073 §6), newest
    first by the time the provider booked them, narrowed to the dates they fall on and a
    kind, with the subscriber's account of each. Only this operation and the admin screen
    show individual movements and their subscribers. Needs the `manage_finance` permission.
  tags: [admin-server]
  security:
    - oauth2: ["admin:read"]
  parameters:
    - name: from
      in: query
      description: Only the movements on or after this date.
      schema:
        $ref: ../components/schemas/CalendarDate.yaml
    - name: to
      in: query
      description: Only the movements on or before this date.
      schema:
        $ref: ../components/schemas/CalendarDate.yaml
    - name: kind
      in: query
      description: Only the movements of this kind.
      schema:
        $ref: ../components/schemas/IncomeKind.yaml
    - $ref: ../components/parameters/Cursor.yaml
    - $ref: ../components/parameters/Limit.yaml
  responses:
    "200":
      description: A page of money movements.
      headers:
        Cache-Control:
          $ref: ../components/headers/CacheControl.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/IncomeMovementPage.yaml
    default:
      $ref: ../components/responses/Problem.yaml

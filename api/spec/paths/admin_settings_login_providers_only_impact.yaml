get:
  operationId: getLoginProvidersOnlyImpact
  summary: Count who limiting sign-in to login providers would affect
  description: |
    How many active local users have no link to a login provider that users can sign in with
    now, and so could not sign in while the instance setting `login_providers_only` applies, and
    whether the user who asks is one of them. Administrators read it before they turn the setting
    on. Needs the `manage_settings` permission.
  tags: [admin-server]
  security:
    - oauth2: ["admin:read"]
  responses:
    "200":
      description: The count.
      headers:
        Cache-Control:
          $ref: ../components/headers/CacheControl.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/LoginProvidersOnlyImpact.yaml
    default:
      $ref: ../components/responses/Problem.yaml

# SPDX-License-Identifier: MIT
patch:
  operationId: updateSupporterPlan
  summary: Change a supporter plan
  description: |
    Changes a supporter plan's terms and its role's permissions and position (ADR-0072 §3,
    §5, §9). New prices apply to new subscriptions and changes of plan only. A change that
    breaks a rule is a 422 `/api/v1/problems/invalid-supporter-plan`, a retired plan a 409
    `/api/v1/problems/supporter-plan-retired`, and an unknown plan a 404. Recorded in the
    audit log. Needs the `manage_supporters` permission.
  tags: [admin-server]
  security:
    - oauth2: ["admin:write"]
  parameters:
    - $ref: ../components/parameters/SupporterPlanId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/AdminSupporterPlanUpdateRequest.yaml
  responses:
    "200":
      $ref: ../components/responses/AdminSupporterPlan.yaml
    "422":
      $ref: ../components/responses/SupporterPlanProblem.yaml
    default:
      $ref: ../components/responses/Problem.yaml

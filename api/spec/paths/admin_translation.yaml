# SPDX-License-Identifier: MIT
get:
  operationId: getAdminTranslationOverview
  summary: Show how translation is used
  description: |
    The characters of posts sent to providers in the current month, the cache hit rate, and the
    providers that this server has. Months are in UTC. The settings of translation are instance
    settings (`GET /admin/settings`). Needs the `manage_settings` permission.
  tags: [admin-server]
  security:
    - oauth2: ["admin:read"]
  responses:
    "200":
      description: The use of the current month.
      headers:
        Cache-Control:
          $ref: ../components/headers/CacheControl.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AdminTranslationOverview.yaml
    default:
      $ref: ../components/responses/Problem.yaml

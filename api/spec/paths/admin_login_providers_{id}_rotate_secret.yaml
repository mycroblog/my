# SPDX-License-Identifier: MIT
post:
  operationId: rotateLoginProviderSecret
  summary: Give a login provider a new client secret
  description: |
    Replaces the client secret with the one the request gives, which the provider issued;
    the previous one is no longer used. The secret is never shown again. A secret that
    breaks a rule is a 422 `/api/v1/problems/invalid-login-provider`. The rotation is
    recorded in the audit log. An unknown or deleted ID is a 404. Needs the `manage_login_providers` permission.
  tags: [admin-server]
  security:
    - oauth2: ["admin:write"]
  parameters:
    - $ref: ../components/parameters/LoginProviderId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/RotateLoginProviderSecretRequest.yaml
  responses:
    "200":
      $ref: ../components/responses/AdminLoginProvider.yaml
    "422":
      $ref: ../components/responses/LoginProviderProblem.yaml
    default:
      $ref: ../components/responses/Problem.yaml

# SPDX-License-Identifier: MIT
post:
  operationId: revokeOtherSessions
  x-first-party-only: true
  summary: Sign out every browser but the one that asks
  description: |
    Does for every other browser of the list what `DELETE /sessions/{id}` does for one, and
    succeeds when there is no other browser. Only the server's own clients may call it
    (ADR-0090 §4).
  tags: [sessions]
  security:
    - oauth2: ["write:accounts"]
  responses:
    "204":
      description: Every other browser is signed out.
    default:
      $ref: ../components/responses/Problem.yaml

# SPDX-License-Identifier: MIT
description: |
  The income totals over the periods from the one that holds `from` to the one that holds
  `to`, oldest first (ADR-0073 §9). `plans`, the number of members of each supporter plan
  now, is present only where the plans are shown. No answer carries individual payments, the
  subscribers, the amounts of each plan, or the gross and the fees.
type: object
required: [granularity, basis, periods, rules]
properties:
  granularity:
    $ref: ./CostGranularity.yaml
  basis:
    $ref: ./CostBasis.yaml
  periods:
    type: array
    items:
      $ref: ./IncomePeriodTotal.yaml
  plans:
    type: array
    items:
      $ref: ./IncomePlanCount.yaml
  rules:
    $ref: ./IncomeTotalsRules.yaml

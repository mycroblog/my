# SPDX-License-Identifier: MIT
description: |
  An event of the local users of this server, as the user sees it. Times are in UTC;
  `time_zone` is the event's own time zone, to show next to the user's. `places` holds only the
  places that the user sees: `hidden_places` lists the kinds of the others, whose details never
  reach the client.
type: object
required: [id, organizer, coorganizers, title, description, visibility, time_zone, place_disclosure, capacity, places, hidden_places, starts_at, ends_at, state, going_count, created_at, revised_at, revision_count, viewer]
properties:
  id:
    $ref: ./Id.yaml
  organizer:
    $ref: ./Account.yaml
  coorganizers:
    description: The co-organizers, in the order the organizer named them; up to 3.
    type: array
    items:
      $ref: ./Account.yaml
  title:
    type: string
  description:
    description: Plain text; empty for none.
    type: string
  visibility:
    $ref: ./EventVisibility.yaml
  time_zone:
    description: The IANA name of the event's time zone, such as `Asia/Tokyo`.
    type: string
  place_disclosure:
    $ref: ./EventPlaceDisclosure.yaml
  capacity:
    description: How many attendees may answer `going`; 0 for no limit.
    type: integer
  places:
    type: array
    items:
      $ref: ./EventPlace.yaml
  hidden_places:
    description: The kinds of the places that the user does not see.
    type: array
    items:
      $ref: ./EventPlaceKind.yaml
  starts_at:
    description: |
      The start of the event; for an `unscheduled` event, the earliest start of its candidate
      dates (`GET /events/{id}/candidates`).
    type: string
    format: date-time
  ends_at:
    description: |
      The end of the event; for an `unscheduled` event, the latest end of its candidate dates.
    type: string
    format: date-time
  state:
    $ref: ./EventState.yaml
  cancellation:
    $ref: ./EventCancellation.yaml
  going_count:
    description: How many attendees answer `going`.
    type: integer
  created_at:
    type: string
    format: date-time
  revised_at:
    description: When the settings were last changed (the creation for an event never changed).
    type: string
    format: date-time
  revision_count:
    description: How many versions the settings have had, the first included.
    type: integer
  viewer:
    $ref: ./EventViewer.yaml

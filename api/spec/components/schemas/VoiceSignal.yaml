# SPDX-License-Identifier: MIT
description: |
  A WebRTC signal from a session of the user to another session of a voice chat room. An
  `offer` and an `answer` carry `sdp`, a `candidate` carries `candidate`, and a `restart` asks
  the other session to restart ICE.
type: object
required: [session, to, kind]
properties:
  session:
    description: The `session` of the user's join.
    type: string
  to:
    description: The session that receives the signal.
    type: string
  kind:
    $ref: ./VoiceSignalKind.yaml
  sdp:
    description: The session description of an offer or an answer.
    type: string
    maxLength: 16384
  candidate:
    description: An ICE candidate, as the JSON of an `RTCIceCandidateInit`.
    type: string
    maxLength: 16384

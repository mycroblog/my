# SPDX-License-Identifier: MIT
description: |
  The confirmation of the deactivation of the user's own account: `password`,
  `two_factor_code`, `passkey`, or `external_confirmation`.
type: object
properties:
  password:
    description: The user's current password.
    type: string
    minLength: 1
    maxLength: 1024
  two_factor_code:
    description: A code of the user's authenticator app, or a recovery code.
    type: string
    minLength: 1
    maxLength: 64
  passkey:
    $ref: ./PasskeyAssertion.yaml
  external_confirmation:
    $ref: ./ExternalConfirmationToken.yaml

# SPDX-License-Identifier: MIT
title: speaking
description: |
  Who makes sound now, from the audio levels that the node receives; it arrives at most every
  250 milliseconds.
type: object
required: [v, type, participants]
properties:
  v:
    $ref: ./VoiceSFUVersion.yaml
  type:
    type: string
    enum: [speaking]
  participants:
    description: The account IDs of the speakers who make sound; empty when nobody does.
    type: array
    items:
      $ref: ./Id.yaml

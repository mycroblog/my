# SPDX-License-Identifier: MIT
description: |
  A list of accounts that the user follows, which only the user sees. Its timeline shows the
  posts and boosts of its members.
type: object
required: [id, name, created_at]
properties:
  id:
    $ref: ./Id.yaml
  name:
    description: The name of the list, 1 to 50 characters.
    type: string
  created_at:
    description: When the user created the list.
    type: string
    format: date-time

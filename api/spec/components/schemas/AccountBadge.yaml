# SPDX-License-Identifier: MIT
description: |
  A badge that the account shows on its profile (ADR-0071): the badge of a role that the
  account's user holds and chose to show. Clients show `label` as user content (`dir="auto"`),
  never translated.
type: object
required: [role_id, label, color]
properties:
  role_id:
    $ref: ./Id.yaml
  label:
    description: The name on the badge.
    type: string
  color:
    $ref: ./BadgeColor.yaml

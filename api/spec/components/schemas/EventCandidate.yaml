# SPDX-License-Identifier: MIT
description: |
  A candidate date of an event's date poll, with how many users answered it each way. Times are
  in UTC.
type: object
required: [id, starts_at, ends_at, yes_count, maybe_count, no_count, confirmed]
properties:
  id:
    $ref: ./Id.yaml
  starts_at:
    type: string
    format: date-time
  ends_at:
    type: string
    format: date-time
  yes_count:
    type: integer
  maybe_count:
    type: integer
  no_count:
    type: integer
  vote:
    description: The user's own answer; absent before the user answers.
    allOf:
      - $ref: ./EventVote.yaml
  confirmed:
    description: Whether the organizers fixed the event's date to this candidate.
    type: boolean

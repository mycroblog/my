# SPDX-License-Identifier: MIT
description: |
  The number of members of a supporter plan now (ADR-0073 §7): the subscriptions that hold
  the plan's role (active, canceling, or past due within the grace period). A retired plan
  appears while it has members. Never the plan's amounts.
type: object
required: [plan_id, name, members]
properties:
  plan_id:
    $ref: ./Id.yaml
  name:
    type: string
  members:
    type: integer
    format: int64
    minimum: 0

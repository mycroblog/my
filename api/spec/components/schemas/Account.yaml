# SPDX-License-Identifier: MIT
description: An account, as clients show it (FR-006).
type: object
required: [id, username, acct, domain, uri, display_name, note, fields, emojis, badges, url, locked, bot, created_at]
properties:
  id:
    $ref: ./Id.yaml
  username:
    description: The username, without the domain.
    type: string
  acct:
    description: The username for local accounts, `username@domain` for remote ones.
    type: string
  domain:
    description: |
      The domain of the account: the domain of its handle, which for local accounts is the
      instance's account domain, or the host of its `uri` when a remote account has no
      confirmed handle.
    type: string
  uri:
    description: The ActivityPub id of the account's actor, on the server it belongs to.
    type: string
    format: uri
  display_name:
    description: The display name; empty when the account has none.
    type: string
  note:
    description: The profile text as sanitized HTML; empty when there is none.
    type: string
  url:
    description: |
      The account's profile page: on this instance for a local account, and for a remote
      one the page its actor declares (`url`), or its `uri` when it declares none.
    type: string
    format: uri
  locked:
    description: Whether follow requests need the account's approval.
    type: boolean
  bot:
    description: Whether the account is automated.
    type: boolean
  created_at:
    description: When the account was created.
    type: string
    format: date-time
  fields:
    description: The profile's metadata fields, in their order; empty when there are none.
    type: array
    items:
      $ref: ./ProfileField.yaml
  emojis:
    description: |
      The custom emoji of the display name, the note, and the fields' names and values
      (ADR-0051). Clients show each `:shortcode:` of those texts that is in this list as its
      image, and the rest as text.
    type: array
    items:
      $ref: ./CustomEmoji.yaml
  badges:
    description: |
      The role badges that the account shows on its profile, highest role first (ADR-0071).
      Filled on the account's own endpoints (`getAccount`, `lookupAccount`,
      `verifyAccountCredentials`) only, and empty where accounts are listed or embedded (posts,
      notifications, lists of accounts) and for remote accounts. Badges are never federated.
    type: array
    items:
      $ref: ./AccountBadge.yaml
  avatar:
    description: |
      The avatar image, square; omitted when the account has none, or its image is not
      processed yet or could not be processed. Clients show a placeholder instead. For a
      remote account, every size is its media proxy URL.
    $ref: ./MediaVariants.yaml
  header:
    description: The header image; omitted when there is none, as `avatar` is.
    $ref: ./MediaVariants.yaml
  followers_count:
    description: |
      The number of accounts that actively follow the account, as far as the instance
      knows. Present on the account's own endpoints (`getAccount`, `lookupAccount`,
      `verifyAccountCredentials`) and left out where accounts are listed or embedded.
    type: integer
    minimum: 0
  following_count:
    description: The number of accounts that the account actively follows; present where `followers_count` is.
    type: integer
    minimum: 0

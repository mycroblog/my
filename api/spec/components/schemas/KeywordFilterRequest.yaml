# SPDX-License-Identifier: MIT
description: |
  A keyword filter as the user writes it. A field that is not one is a 422 naming it; the
  same word twice (once normalized) is kept once.
type: object
required: [title, action, contexts, keywords]
properties:
  title:
    description: |
      1 to 50 characters (grapheme clusters) on one line, without control characters. White
      space around it is removed.
    type: string
    minLength: 1
    maxLength: 400
  action:
    $ref: ./KeywordFilterAction.yaml
  contexts:
    description: Where the filter applies, at least one.
    type: array
    minItems: 1
    items:
      $ref: ./KeywordFilterContext.yaml
  keywords:
    description: |
      1 to 100 words. White space around each is removed. The user's filters have at most
      1,000 words in all.
    type: array
    minItems: 1
    maxItems: 100
    items:
      $ref: ./KeywordFilterKeyword.yaml
  expires_at:
    description: When the filter stops applying; omit it for a filter that never does.
    type: string
    format: date-time

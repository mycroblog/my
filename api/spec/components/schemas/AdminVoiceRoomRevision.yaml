# SPDX-License-Identifier: MIT
description: |
  A revision of the settings of a voice chat room. The name and the description are empty
  once the account that wrote them is erased.
type: object
required: [id, name, description, hashtags, visibility, speakers, revised_by_account_id, revised_at]
properties:
  id:
    $ref: ./Id.yaml
  name:
    type: string
  description:
    type: string
  hashtags:
    description: The hashtags as the host typed them.
    type: array
    items:
      type: string
  visibility:
    $ref: ./VoiceRoomVisibility.yaml
  speakers:
    $ref: ./VoiceRoomSpeakers.yaml
  revised_by_account_id:
    $ref: ./Id.yaml
  revised_at:
    type: string
    format: date-time

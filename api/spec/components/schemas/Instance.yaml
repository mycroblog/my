# SPDX-License-Identifier: MIT
description: Public information about the instance.
type: object
required: [domain, name, version, source_url, registrations, limits, timelines, federation, sends_email, rules, search_indexing, ai_usage, finance_visibility, income_visibility, supporters_enabled, supporter_list_visibility, voice_enabled, voice_room_starters]
properties:
  domain:
    description: The domain that serves the instance.
    type: string
  name:
    description: The display name of the instance; the domain when the instance has none.
    type: string
  short_description:
    description: A one-paragraph summary of the instance, as plain text; omitted when there is none.
    type: string
  description:
    description: The full description of the instance, as plain text; omitted when there is none.
    type: string
  registrations:
    $ref: ./InstanceRegistrations.yaml
  version:
    description: The server version.
    type: string
  source_url:
    description: Where users get the source code of the running server (AGPL-3.0 section 13), as an https URL to read it at or a mailto URI to request it by email.
    type: string
    format: uri
  status_page_url:
    description: The https address of the instance's status page, on a service apart from the server (ADR-0085). Absent when the operator has not set one.
    type: string
    format: uri
  limits:
    $ref: ./InstanceLimits.yaml
  timelines:
    $ref: ./InstanceTimelines.yaml
  federation:
    $ref: ./InstanceFederation.yaml
  closure:
    $ref: ./InstanceClosure.yaml
  sends_email:
    description: |
      Whether the instance sends email (the server setting `mail` is not `none`). Without
      email, notifications come only in the app, so clients do not offer the email column of
      the notification settings (`GET /preferences/notifications`).
    type: boolean
  push_server_key:
    description: |
      The instance's VAPID public key (RFC 8292), an uncompressed P-256 point in unpadded
      base64url: the `applicationServerKey` that browsers subscribe with before
      `putPushSubscription`. Omitted when the instance sends no Web Push.
    type: string
  rules:
    description: The rules in effect, in order.
    type: array
    items:
      $ref: ./InstanceRule.yaml
  terms_url:
    description: |
      The web client's page of the instance's terms of service (`/about/terms`), which needs no
      sign-in and shows `GET /instance/documents/terms`; omitted when the instance has none,
      so that clients do not link to it.
    type: string
    format: uri
  privacy_policy_url:
    description: |
      The web client's page of the instance's privacy policy (`/about/privacy`), which needs no
      sign-in and shows `GET /instance/documents/privacy_policy`; omitted when the instance has
      none.
    type: string
    format: uri
  commerce_disclosure_url:
    description: |
      The web client's page of the commerce disclosures of the supporter plans (`/about/commerce`,
      the URL that the operators give the payment provider), which needs no sign-in and shows
      `GET /instance/documents/commerce_disclosure`; omitted when the instance has none.
    type: string
    format: uri
  supporters_enabled:
    description: |
      Whether the supporter program is enabled: its plans (`GET /instance/supporter_plans`)
      and the subscriptions show only then.
    type: boolean
  supporter_list_visibility:
    $ref: ./SupporterListVisibility.yaml
  voice_enabled:
    description: |
      Whether the voice chat rooms are on: the voice operations (`/voice/...`) answer 404 while
      they are off, and clients then show no entry to them.
    type: boolean
  voice_room_starters:
    description: |
      Who may open voice chat rooms: `everyone` (every local user who is not limited) or
      `permitted` (only the users whose roles have `start_voice_rooms`). `permitted` while the
      voice chat is off.
    type: string
    enum: [everyone, permitted]
  theme:
    $ref: ./InstanceTheme.yaml
  contact:
    $ref: ./InstanceContact.yaml
  thumbnail:
    $ref: ./InstanceThumbnail.yaml
  search_indexing:
    $ref: ./SearchIndexing.yaml
  ai_usage:
    $ref: ./AIUsage.yaml
  finance_visibility:
    $ref: ./FinanceVisibility.yaml
  income_visibility:
    $ref: ./IncomeVisibility.yaml

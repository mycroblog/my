# SPDX-License-Identifier: MIT
description: A message to a webhook and its attempts.
type: object
required: [id, message_id, event_type, status, attempts, created_at]
properties:
  id:
    $ref: ./Id.yaml
  message_id:
    description: The `webhook-id` of the message, the same on every attempt.
    allOf:
      - $ref: ./Id.yaml
  event_type:
    $ref: ./WebhookMessageType.yaml
  status:
    $ref: ./AdminWebhookDeliveryStatus.yaml
  attempts:
    description: How many times it was sent.
    type: integer
    minimum: 0
  last_attempt:
    $ref: ./AdminWebhookAttempt.yaml
  created_at:
    type: string
    format: date-time
  request_body:
    description: |
      The body of the request that every attempt sent, byte for byte as the receiver got it: a
      JSON document, which can carry personal data (an applicant's email address, a report's
      comment). It is kept as long as the delivery, 14 days. Omitted where the reader lacks the
      permission that subscribing to its event needs besides `manage_webhooks`.
    type: string

# SPDX-License-Identifier: MIT
description: A hashtag that the prefix search of hashtags found (ADR-0092).
type: object
required: [name, statuses_count]
properties:
  name:
    description: The hashtag as first written on this server, without `#`.
    type: string
  statuses_count:
    description: How many posts of visibility `public`, `local`, or `unlisted` carry the hashtag now.
    type: integer
    format: int64
    minimum: 1

# SPDX-License-Identifier: MIT
description: |
  An external login provider that users sign in, sign up, and link their accounts with.
  Its client secret is never shown.
type: object
required: [id, kind, display_name, client_id, scopes, allow_signup, allow_link, claims, organizations, guilds,
  state, state_changed_at, callback_url, linked_users, created_at, updated_at]
properties:
  id:
    $ref: ./Id.yaml
  kind:
    $ref: ./LoginProviderKind.yaml
  display_name:
    description: |
      The name of the provider on the administration screens, and on the sign-in button of
      an `oidc` provider as it is written.
    type: string
  issuer:
    description: |
      The OpenID Connect issuer of an `oidc` provider, or the server's URL
      (`https://<host>`) of a `mastodon` one; omitted for `github` and `discord`.
    type: string
  client_id:
    type: string
  scopes:
    description: The scopes asked for besides the ones the kind needs, sorted.
    type: array
    items:
      type: string
  allow_signup:
    description: Whether new users may sign up with the provider.
    type: boolean
  allow_link:
    description: Whether users may link their account to the provider.
    type: boolean
  claims:
    description: The conditions of an `oidc` provider, by claim; empty lets every user in.
    type: array
    items:
      $ref: ./LoginProviderClaimCondition.yaml
  organizations:
    description: |
      The GitHub Organizations, in lower case and sorted, one of which a user of a `github`
      provider must belong to; empty lets every GitHub user in.
    type: array
    items:
      type: string
  guilds:
    description: |
      The IDs of the Discord servers (guilds), sorted, one of which a user of a `discord`
      provider must belong to; empty lets every Discord user in.
    type: array
    items:
      type: string
  state:
    $ref: ./AdminLoginProviderState.yaml
  state_changed_at:
    type: string
    format: date-time
  callback_url:
    description: |
      The redirect URI to register at the provider:
      `https://<host>/auth/external/<id>/callback`.
    type: string
  linked_users:
    description: |
      The number of users whose accounts are linked to the provider; disabling or deleting it
      keeps them from signing in with it.
    type: integer
    minimum: 0
  created_at:
    type: string
    format: date-time
  updated_at:
    description: When the settings last changed.
    type: string
    format: date-time

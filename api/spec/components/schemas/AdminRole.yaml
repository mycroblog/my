# SPDX-License-Identifier: MIT
description: |
  A role (FR-720): a named set of permissions. A higher position outranks a lower one;
  a user may grant, revoke, create, change, and delete only the roles at or below their
  highest one, and give or take only the permissions they hold.
type: object
required: [id, key, position, permissions]
properties:
  id:
    $ref: ./Id.yaml
  key:
    description: The name of the role, such as `admin` or `moderator`.
    type: string
    minLength: 1
    maxLength: 64
  position:
    description: The rank of the role, from 0 to 999, and 1000 for `admin`.
    type: integer
    minimum: 0
    maximum: 1000
  permissions:
    description: The permissions that the role grants, in the order of `Permission`.
    type: array
    items:
      $ref: ./Permission.yaml
  badge:
    description: The badge of the role, which its holders may show on their profile; omitted when it has none.
    $ref: ./RoleBadge.yaml

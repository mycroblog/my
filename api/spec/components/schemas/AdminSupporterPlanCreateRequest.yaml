# SPDX-License-Identifier: MIT
description: |
  A new supporter plan on a role that nobody holds, whose permissions are member
  permissions and whose position is below every staff role. The currency never changes.
type: object
required: [role, name, monthly_price, annual_discount_percent, emoji_limit, rank, visibility]
properties:
  role:
    description: The key of the role.
    type: string
  name:
    description: 1 to 50 characters on one line.
    type: string
  description:
    description: Up to 1,000 characters of plain text.
    type: string
  monthly_price:
    $ref: ./Money.yaml
  annual_discount_percent:
    description: 0 to 90.
    type: integer
  emoji_limit:
    description: 0 to 10,000.
    type: integer
  rank:
    description: 0 to 1,000,000, unique among the plans that are not retired.
    type: integer
  visibility:
    $ref: ./SupporterPlanVisibility.yaml

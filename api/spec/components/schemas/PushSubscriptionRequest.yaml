# SPDX-License-Identifier: MIT
description: A browser's push subscription and the notification types to push to it.
type: object
required: [endpoint, keys, alerts]
properties:
  endpoint:
    description: The push service URL (`PushSubscription.endpoint`), an `https` URL.
    type: string
    maxLength: 2048
  keys:
    $ref: ./PushSubscriptionKeys.yaml
  alerts:
    description: The notification types to push, each at most once; empty pushes none.
    type: array
    maxItems: 30
    items:
      $ref: ./NotificationType.yaml

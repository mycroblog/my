description: |
  A 422 of `PUT /admin/theme`. For the type `/api/v1/problems/invalid-theme`, `theme_errors`
  lists why the theme cannot be saved; another 422 (a malformed request) has none.
allOf:
  - $ref: ./Problem.yaml
  - type: object
    properties:
      theme_errors:
        type: array
        items:
          $ref: ./ThemeError.yaml

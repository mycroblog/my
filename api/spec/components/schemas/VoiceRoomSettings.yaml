# SPDX-License-Identifier: MIT
description: The settings of a new voice chat room.
type: object
required: [name]
properties:
  name:
    description: 1 to 100 characters on one line.
    type: string
  icon:
    description: |
      The emoji shown before the name: one Unicode emoji, or the shortcode of an enabled custom
      emoji of this server, with or without colons. Omitted or empty for none. Any other value,
      such as a custom emoji of another server, is refused with `422`.
    type: string
  description:
    description: Up to 500 characters; line breaks are kept.
    type: string
  hashtags:
    description: Up to 5 hashtags, with or without the `#`, each one a hashtag as in a post.
    type: array
    items:
      type: string
  visibility:
    $ref: ./VoiceRoomVisibility.yaml
  speakers:
    $ref: ./VoiceRoomSpeakers.yaml
  post:
    $ref: ./VoiceStartPost.yaml

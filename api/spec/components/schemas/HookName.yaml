# SPDX-License-Identifier: MIT
description: |
  A decision hook, where the server asks an external review before it accepts something:
  `inbound.status` (posts from other servers), `inbound.follow` (follows from other servers),
  `signup.check` (sign-ups), `media.check` (uploaded media), `local.status` (local posts), `local.profile` (local profiles).
type: string
enum: [inbound.status, inbound.follow, signup.check, media.check, local.status, local.profile]

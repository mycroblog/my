# SPDX-License-Identifier: MIT
description: |
  The image of a `media` setting (`preview_image`, `thumbnail`): the large still variant of its
  media file, as link previews and the about page use it.
type: object
required: [url, width, height]
properties:
  url:
    type: string
    format: uri
  width:
    type: integer
    minimum: 1
  height:
    type: integer
    minimum: 1

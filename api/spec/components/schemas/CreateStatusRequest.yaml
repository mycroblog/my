# SPDX-License-Identifier: MIT
description: A new status.
type: object
required: [text, visibility]
properties:
  text:
    $ref: ./StatusText.yaml
  spoiler_text:
    $ref: ./SpoilerText.yaml
  sensitive:
    description: Whether the media are sensitive.
    type: boolean
  language:
    $ref: ./StatusLanguageInput.yaml
  visibility:
    $ref: ./Visibility.yaml
  in_reply_to_id:
    $ref: ./Id.yaml
  media:
    $ref: ./StatusMediaInput.yaml
  poll:
    $ref: ./PollInput.yaml
  quoted_status_id:
    description: |
      The status to quote (FR-114, ADR-0069). It must be one the user may see and may quote
      (`Status.quotable`); a quote of a boost is a quote of the boosted status. Quoting a
      remote status while the instance does not send posts out (`Instance.federation.mode`
      `off` or `inbound`) is the 403 `/api/v1/problems/federation-restricted`.
    allOf:
      - $ref: ./Id.yaml
  quote_policy:
    description: Who may quote the new status; the user's `default_quote_policy` when left out.
    allOf:
      - $ref: ./QuotePolicy.yaml

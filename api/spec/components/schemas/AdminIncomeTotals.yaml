# SPDX-License-Identifier: MIT
description: |
  The income totals as the administrators see them over the periods from the one that holds
  `from` to the one that holds `to`, oldest first, with the number of members of each
  supporter plan now, and `tips`, whether the server takes tips now.
type: object
required: [granularity, basis, periods, plans, tips, rules]
properties:
  granularity:
    $ref: ./CostGranularity.yaml
  basis:
    $ref: ./CostBasis.yaml
  periods:
    type: array
    items:
      $ref: ./AdminIncomePeriodTotal.yaml
  plans:
    type: array
    items:
      $ref: ./IncomePlanCount.yaml
  tips:
    type: boolean
  rules:
    $ref: ./IncomeTotalsRules.yaml

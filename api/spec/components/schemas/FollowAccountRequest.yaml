# SPDX-License-Identifier: MIT
description: The viewer's preferences of the follow; a preference left out keeps its value.
type: object
properties:
  show_boosts:
    description: Show the account's boosts in the home timeline. New follows show them.
    type: boolean
  notify:
    description: |
      Subscribe to the account's new posts (true) or stop (false), as `subscribeAccount` and
      `unsubscribeAccount` do; left out, the subscription stays as it is. For an account on another
      server, the subscription starts when that server accepts the follow.
    type: boolean

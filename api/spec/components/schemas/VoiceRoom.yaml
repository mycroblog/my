# SPDX-License-Identifier: MIT
description: |
  An open voice chat room: its settings, its host, and its participants in the order they
  joined. Everyone who sees the room sees its participants.
type: object
required: [id, name, description, hashtags, visibility, speakers, max_participants, host, opened_at, participants_count, participants, can_speak]
properties:
  id:
    $ref: ./Id.yaml
  name:
    description: The name of the room, 1 to 100 characters.
    type: string
  icon:
    $ref: ./VoiceRoomIcon.yaml
  description:
    description: The description of the room, up to 500 characters; empty for none.
    type: string
  hashtags:
    description: The hashtags of the room, without the `#`, as the host typed them.
    type: array
    items:
      type: string
  visibility:
    $ref: ./VoiceRoomVisibility.yaml
  speakers:
    $ref: ./VoiceRoomSpeakers.yaml
  max_participants:
    description: |
      How many people the room holds, the host included: the host's maximum, or the server's
      (`voice_max_participants` of `Instance`) when the host set none or the server's is lower.
      A join while the room holds as many people is a 409. The room may hold more after the
      host lowered it; nobody leaves for it.
    type: integer
  host:
    $ref: ./Account.yaml
  opened_at:
    description: When the room opened.
    type: string
    format: date-time
  participants_count:
    description: How many people are in the room, the host included.
    type: integer
  participants:
    type: array
    items:
      $ref: ./VoiceRoomParticipant.yaml
  can_speak:
    description: |
      Whether the user may become a speaker in the room now without raising a hand
      (`POST /voice/rooms/{id}/speaker`): true for the host and the co-hosts, and for the
      participants with a permission to speak (a granted raised hand, a grant, or an invitation
      as a speaker) or whom the room's speakers setting covers, unless a moderator limited them
      and they have no permission. False for any other user who is not in the room.
    type: boolean

# SPDX-License-Identifier: MIT
description: The new content of a status.
type: object
required: [text]
properties:
  text:
    $ref: ./StatusText.yaml
  spoiler_text:
    $ref: ./SpoilerText.yaml
  sensitive:
    description: Whether the media are sensitive.
    type: boolean
  language:
    $ref: ./StatusLanguageInput.yaml
  media:
    $ref: ./StatusMediaInput.yaml
  remove_quote:
    description: |
      Takes the status's quote away for good (ADR-0069 §3). A status keeps the status it
      quotes otherwise: an edit cannot change it.
    type: boolean

# SPDX-License-Identifier: MIT
description: A notification of something that happened to the authenticated user.
type: object
required: [id, type, created_at]
properties:
  id:
    $ref: ./Id.yaml
  type:
    $ref: ./NotificationType.yaml
  created_at:
    description: When it happened.
    type: string
    format: date-time
  account:
    $ref: ./Account.yaml
  status:
    description: |
      The post that the notification is about, as the user sees it; omitted when the user
      may not see it.
    $ref: ./Status.yaml
  report:
    description: The user's report that a `report_resolved` tells of.
    $ref: ./Report.yaml
  moderation_action:
    description: |
      The action on the user's account that a `moderation_notice` tells of, or whose
      appeal an `appeal_decided` tells of, with the appeal.
    $ref: ./ModerationAction.yaml
  report_id:
    description: The report that an `admin_report` is about.
    allOf:
      - $ref: ./Id.yaml
  appeal_id:
    description: The appeal that an `admin_appeal` is about.
    allOf:
      - $ref: ./Id.yaml
  custom_emoji_request:
    description: |
      The custom emoji request that an `admin_custom_emoji_request` or a
      `custom_emoji_request_decided` is about, as it is now; absent when it no longer exists.
    $ref: ./CustomEmojiRequest.yaml
  supporter_subscription:
    description: |
      The user's supporter subscription that a `supporter_payment_failed`, a
      `supporter_subscription_ended`, or a `supporter_plan_retired` is about, as it is now;
      absent when it no longer exists.
    $ref: ./SupporterSubscription.yaml
  relationship_severance:
    $ref: ./RelationshipSeverance.yaml
  account_move:
    $ref: ./AccountMove.yaml
  service_closure:
    $ref: ./ServiceClosureNotice.yaml
  reaction:
    description: The emoji of a `reaction`; omitted for the other types.
    $ref: ./ReactionEmoji.yaml
  voice_room_id:
    description: The voice chat room that a `voice_room_started` or a `voice_room_invited` is about.
    allOf:
      - $ref: ./Id.yaml
  voice_room:
    description: |
      The voice chat room that a `voice_room_started` or a `voice_room_invited` is about, while
      it is open and the user sees it; omitted otherwise.
    $ref: ./VoiceRoom.yaml

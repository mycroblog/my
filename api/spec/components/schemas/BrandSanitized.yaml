# SPDX-License-Identifier: MIT
description: |
  An SVG as the server would save it: the sanitized document, the size of its viewBox, the
  renditions to draw from it with their sizes, and what was removed.
type: object
required: [svg, view_box_width, view_box_height, renditions, dropped]
properties:
  svg:
    description: The sanitized SVG document.
    type: string
  view_box_width:
    type: number
  view_box_height:
    type: number
  renditions:
    type: array
    items:
      $ref: ./BrandRenditionSize.yaml
  dropped:
    type: array
    items:
      $ref: ./BrandDropped.yaml

# SPDX-License-Identifier: MIT
description: |
  The decision hook that filed the report; omitted for a report that a person or another server
  filed. Such a report has the instance actor as its reporter, is not forwarded, and nobody is
  notified when it is resolved.
type: object
required: [hook, decision_id]
properties:
  hook:
    $ref: ./HookName.yaml
  decision_id:
    description: The decision that filed the report, which can be gone after its retention.
    type: string
  reason:
    $ref: ./HookReason.yaml

# SPDX-License-Identifier: MIT
description: A tip of the authenticated user.
type: object
required: [id, state, amount, created_at]
properties:
  id:
    $ref: ./Id.yaml
  state:
    $ref: ./SupporterTipState.yaml
  amount:
    $ref: ./Money.yaml
  created_at:
    type: string
    format: date-time
  paid_at:
    description: When the payment was recorded; omitted unless `paid`.
    type: string
    format: date-time

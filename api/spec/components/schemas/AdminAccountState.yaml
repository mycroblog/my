# SPDX-License-Identifier: MIT
description: |
  The state of an account, the first that applies: `deleted` (deleted here or on its
  server), `suspended` (a `suspend` or `ban`), `disabled` (a `disable_login`), `rejected`
  and `pending` (the registration of a local account), `limited` (a `limit`), and
  `active`.
type: string
enum: [active, pending, rejected, limited, disabled, suspended, deleted]

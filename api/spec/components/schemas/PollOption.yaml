# SPDX-License-Identifier: MIT
description: One option of a poll.
type: object
required: [title]
properties:
  title:
    description: The option as plain text.
    type: string
  votes_count:
    description: |
      The number of votes for the option; omitted while the poll hides the votes of each
      option until it ends.
    type: integer
    minimum: 0

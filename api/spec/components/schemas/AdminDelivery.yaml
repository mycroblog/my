# SPDX-License-Identifier: MIT
description: |
  The delivery of an activity to one inbox of a remote server, with its attempts. `sender`,
  `activity_uri`, and a personal `inbox_url` are absent when `mask` is present.
type: object
required: [id, domain, activity_type, activity_created_at, created_at, shared_inbox, attempts]
properties:
  id:
    $ref: ./Id.yaml
  domain:
    type: string
  activity_type:
    description: The type of the activity, such as `Create`, `Follow`, or `Accept`.
    type: string
  activity_created_at:
    description: When the activity was recorded.
    type: string
    format: date-time
  created_at:
    description: When the inbox was added to the activity.
    type: string
    format: date-time
  shared_inbox:
    description: Whether the inbox is a shared inbox of the server, which names no recipient.
    type: boolean
  mask:
    $ref: ./AdminDeliveryMask.yaml
  sender:
    $ref: ./AdminDeliverySender.yaml
  activity_uri:
    type: string
  inbox_url:
    type: string
  attempts:
    description: The attempts, oldest first.
    type: array
    items:
      $ref: ./AdminDeliveryAttempt.yaml

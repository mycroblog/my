# SPDX-License-Identifier: MIT
description: |
  A custom emoji as the administrators manage it (ADR-0051 §4): a local one, or a remote
  one recorded from the posts and profiles of another server.
type: object
required: [id, shortcode, local, enabled, visible_in_picker, aliases, created_by_deleted, created_at, updated_at]
properties:
  id:
    $ref: ./Id.yaml
  shortcode:
    description: The shortcode, without the colons around it.
    type: string
  local:
    description: Whether the emoji is of this instance.
    type: boolean
  domain:
    description: The domain of a remote emoji; absent for a local one.
    type: string
  uri:
    description: |
      The ActivityPub `id` of the emoji: `https://{host}/ap/emojis/{id}` for a local one,
      and the recorded one for a remote one; absent when a remote emoji has none.
    type: string
    format: uri
  url:
    description: |
      The URL of the image, animated when the emoji is; absent when the image cannot be
      shown (such as a remote one from a domain whose media the instance rejects).
    type: string
    format: uri
  static_url:
    description: The URL of a still image of the emoji; absent with `url`.
    type: string
    format: uri
  enabled:
    description: Whether the emoji is shown; a disabled one stays `:shortcode:` text.
    type: boolean
  visible_in_picker:
    description: Whether the picker offers the local emoji; always `true` for a remote one.
    type: boolean
  category:
    description: The category of a local emoji in the picker; absent for none.
    type: string
  aliases:
    description: The other names of a local emoji that the picker finds it by.
    type: array
    items:
      type: string
  created_by:
    description: |
      The account of the user who made a local emoji (ADR-0070 §7): the requester of an
      approved request, or the administrator who registered or copied it. Absent for an emoji
      made with the CLI, a remote one, and one whose creator's account is deleted
      (`created_by_deleted`).
    $ref: ./Account.yaml
  created_by_deleted:
    description: Whether a user made the emoji whose account no longer exists.
    type: boolean
  created_at:
    description: When the emoji was registered or first seen.
    type: string
    format: date-time
  updated_at:
    description: When its current image was set, its ActivityPub `updated`.
    type: string
    format: date-time

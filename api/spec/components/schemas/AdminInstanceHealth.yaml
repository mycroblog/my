# SPDX-License-Identifier: MIT
description: A remote server, whether deliveries go to it, and what it runs.
type: object
required: [domain, state, failure_days]
properties:
  domain:
    type: string
  state:
    $ref: ./AdminInstanceState.yaml
  state_changed_at:
    description: When the server entered its state; omitted for a server without failures.
    type: string
    format: date-time
  failure_days:
    description: The number of distinct UTC days of the latest run of failed deliveries.
    type: integer
    minimum: 0
  last_failure_day:
    description: The latest of those days; omitted without failures.
    type: string
    format: date
  first_seen_at:
    description: |
      When this instance first stored a document of the server; omitted for a server known
      only from deliveries.
    type: string
    format: date-time
  software:
    $ref: ./AdminInstanceSoftware.yaml

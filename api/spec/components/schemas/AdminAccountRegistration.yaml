# SPDX-License-Identifier: MIT
description: The registration application of a local account.
type: object
required: [id, submitted_at, state_changed_at]
properties:
  id:
    description: The ID that `approveRegistration` and `rejectRegistration` take.
    allOf:
      - $ref: ./Id.yaml
  submitted_at:
    type: string
    format: date-time
  reason:
    description: Why the applicant wants to join; omitted when not asked or not given.
    type: string
  decision_note:
    description: |
      The moderators' note on the decision, as plain text; omitted while the registration is
      pending and when the decision has no note.
    type: string
  invite_id:
    $ref: ./Id.yaml
  invite:
    $ref: ./AdminAccountInvite.yaml
  state_changed_at:
    description: When the registration entered its `registration_state`.
    type: string
    format: date-time

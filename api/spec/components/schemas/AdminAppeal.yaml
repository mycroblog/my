# SPDX-License-Identifier: MIT
description: |
  A local user's appeal of an action on their account, as the moderators see it, with the
  action.
type: object
required: [id, account_id, text, state, submitted_at, action]
properties:
  id:
    $ref: ./Id.yaml
  account_id:
    description: The account that appealed, which the action is on.
    allOf:
      - $ref: ./Id.yaml
  text:
    description: What the user wrote, as plain text.
    type: string
  state:
    $ref: ./ModerationAppealState.yaml
  submitted_at:
    type: string
    format: date-time
  action:
    $ref: ./AdminAccountAction.yaml
  decided_at:
    description: When a moderator decided the appeal; omitted while pending.
    type: string
    format: date-time
  decision_reason:
    description: The moderators' explanation of the decision to the user; omitted when there is none.
    type: string
  decided_by_account_id:
    description: |
      The account of the moderator who decided; omitted while pending and for a decision
      from the command line.
    allOf:
      - $ref: ./Id.yaml

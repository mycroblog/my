# SPDX-License-Identifier: MIT
description: A change to a lower plan or to the monthly price that waits for the end of the period.
type: object
required: [plan_id, plan_name, interval, price, effective_at]
properties:
  plan_id:
    $ref: ./Id.yaml
  plan_name:
    type: string
  interval:
    $ref: ./SupporterInterval.yaml
  price:
    $ref: ./Money.yaml
  effective_at:
    type: string
    format: date-time

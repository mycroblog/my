# SPDX-License-Identifier: MIT
description: |
  A week, month, or year of the totals, as in `CostPeriodTotal`, with the item lines of the
  period: empty unless the instance shows the names or the memos of the items, and sorted by
  provider, category, name, and currency; without the names, by provider,
  category, currency, and the larger amount first.
type: object
required: [label, starts_on, ends_on, totals, breakdown, estimated, items]
properties:
  label:
    type: string
  starts_on:
    $ref: ./CalendarDate.yaml
  ends_on:
    $ref: ./CalendarDate.yaml
  totals:
    type: array
    items:
      $ref: ./Money.yaml
  breakdown:
    type: array
    items:
      $ref: ./CostBreakdownLine.yaml
  estimated:
    type: boolean
  items:
    type: array
    items:
      $ref: ./FinanceCostItemLine.yaml

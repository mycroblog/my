# SPDX-License-Identifier: MIT
description: |
  An account as the moderators see it. It never includes an email or IP address.
type: object
required: [id, account, local, state, restrictions]
properties:
  id:
    $ref: ./Id.yaml
  account:
    $ref: ./Account.yaml
  local:
    description: Whether the account is on this server.
    type: boolean
  state:
    $ref: ./AdminAccountState.yaml
  restrictions:
    description: |
      What the account's own actions take away now, in a fixed order.
      The domain actions on its domain are listed apart.
    type: array
    items:
      $ref: ./AdminAccountRestriction.yaml
  registration_state:
    description: |
      Where the registration of a local account stands; a user made with the command line is
      `approved`. Omitted for a remote account.
    allOf:
      - $ref: ./RegistrationState.yaml

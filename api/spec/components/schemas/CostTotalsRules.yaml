# SPDX-License-Identifier: MIT
description: |
  How the totals cut the periods (ADR-0067 §5), to show next to them: by calendar date
  without a time zone, weeks from `week_start` (ISO 8601), and each imported provider's
  billing months in its own time zone (`billing_sources`, in its order).
type: object
required: [week_start, sources]
properties:
  week_start:
    type: string
    enum: [monday]
  sources:
    type: array
    items:
      $ref: ./CostSourceRule.yaml

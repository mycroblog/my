# SPDX-License-Identifier: MIT
description: What awaits the moderators; a count whose permission the user lacks is omitted.
type: object
properties:
  open_reports:
    description: The reports that are open. Needs `manage_reports`.
    type: integer
    format: int64
    minimum: 0
  pending_registrations:
    description: The registrations that await approval. Needs `manage_accounts`.
    type: integer
    format: int64
    minimum: 0
  pending_appeals:
    description: The appeals of moderation actions that await a decision. Needs `manage_accounts`.
    type: integer
    format: int64
    minimum: 0
  oldest_open_report_filed_at:
    description: |
      When the open report that has waited longest was filed; omitted when no report is open.
      Needs `manage_reports`.
    type: string
    format: date-time

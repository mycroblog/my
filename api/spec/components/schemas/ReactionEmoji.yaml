# SPDX-License-Identifier: MIT
description: |
  The emoji of a reaction: a Unicode emoji, or a custom emoji with its image. A custom
  emoji of another server is shown as it is and cannot be used to react from here.
type: object
required: [name]
properties:
  name:
    description: |
      The emoji as `listStatusReactions` takes it: the Unicode emoji, the shortcode of a
      custom emoji of this server, or `shortcode@domain` for a custom emoji of another
      server.
    type: string
  shortcode:
    description: The shortcode of a custom emoji, without colons; omitted for a Unicode emoji.
    type: string
  domain:
    description: The server of a custom emoji of another server; omitted otherwise.
    type: string
  emoji:
    description: |
      The custom emoji with its image; omitted for a Unicode emoji and when the image cannot
      be shown (as `CustomEmoji` leaves such an emoji out).
    $ref: ./CustomEmoji.yaml

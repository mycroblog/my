# SPDX-License-Identifier: MIT
description: |
  A change of the user's password, confirmed with `current_password` or `passkey`.
type: object
required: [new_password]
properties:
  current_password:
    description: The user's current password, which confirms the change.
    type: string
    minLength: 1
    maxLength: 1024
  passkey:
    $ref: ./PasskeyAssertion.yaml
  new_password:
    description: The new password, 8 to 128 characters.
    type: string
    minLength: 1
    maxLength: 1024

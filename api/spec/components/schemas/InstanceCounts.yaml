# SPDX-License-Identifier: MIT
description: |
  How many members the instance has, how many public posts they made lately, and since when it
  runs, as counted at `counted_at`. Omitted while the instance setting `public_counts` is off.
type: object
required: [members, daily_posts, started_at, counted_at]
properties:
  members:
    description: The local accounts that are not deleted, the instance's own actor aside.
    type: integer
    minimum: 0
  daily_posts:
    description: |
      The public posts of local accounts that are not deleted, in each of the 7 periods of 24
      hours before `counted_at`, oldest first: the last item counts the posts of the 24 hours
      up to `counted_at`.
    type: array
    minItems: 7
    maxItems: 7
    items:
      type: integer
      minimum: 0
  started_at:
    description: When the instance was set up.
    type: string
    format: date-time
  counted_at:
    description: When the counts were taken.
    type: string
    format: date-time

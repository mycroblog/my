# SPDX-License-Identifier: MIT
description: |
  The problem of a role change that breaks a rule (422, `/api/v1/problems/invalid-role`);
  `reason` says which. Another 422 (a malformed request) has none.
allOf:
  - $ref: ./Problem.yaml
  - type: object
    properties:
      reason:
        $ref: ./RoleProblemReason.yaml
      missing_permissions:
        description: The permissions that the change needs and the viewer lacks, for `missing_permission`.
        type: array
        items:
          $ref: ./Permission.yaml

# SPDX-License-Identifier: MIT
description: The changes to a role; what is omitted stays.
type: object
properties:
  position:
    description: The new rank of the role, from 0 to 999.
    type: integer
  permissions:
    description: The new permissions of the role, each once; empty removes them all.
    type: array
    items:
      $ref: ./Permission.yaml
  badge:
    description: |
      The new badge of the role (ADR-0071). Its holders keep their choice to show it.
    $ref: ./RoleBadge.yaml
  remove_badge:
    description: |
      `true` removes the badge of the role, and every holder's choice to show it; a new badge
      starts hidden. Sending it with `badge` is a 422 whose `detail` names `remove_badge`.
    type: boolean

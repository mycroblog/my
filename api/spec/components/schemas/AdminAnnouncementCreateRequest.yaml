# SPDX-License-Identifier: MIT
description: A new announcement, with its title, its text, and its window.
type: object
required: [title, text]
properties:
  title:
    description: |
      The heading, in plain text: 1 to 100 grapheme clusters on one line, without control
      characters. White space around it is trimmed.
    type: string
    minLength: 1
  text:
    description: The text, in Markdown.
    type: string
    minLength: 1
    maxLength: 5000
  starts_at:
    description: When it starts to show once published; omitted to show it from its publication.
    type: string
    format: date-time
  ends_at:
    description: When it stops showing, after `starts_at`; omitted to show it until it is withdrawn.
    type: string
    format: date-time
  publish:
    description: Publish it at once instead of keeping it a draft.
    type: boolean
    default: false

# SPDX-License-Identifier: MIT
description: |
  A page of the supporter list: the members by plan, in the order of `plans`, newest first
  within a plan.
allOf:
  - $ref: ./PageInfo.yaml
  - type: object
    required: [plans, items]
    properties:
      plans:
        description: The plans that are not retired, in their order (the lowest first), on every page.
        type: array
        items:
          $ref: ./SupporterListPlan.yaml
      items:
        type: array
        items:
          $ref: ./SupporterListEntry.yaml

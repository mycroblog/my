# SPDX-License-Identifier: MIT
description: |
  A report that the user filed. It never names the reporter, and tells only whether the
  moderators resolved it, never how.
type: object
required: [id, category, comment, forwarded, filed_at, status_ids, rule_ids, state]
properties:
  id:
    $ref: ./Id.yaml
  category:
    $ref: ./ReportCategory.yaml
  comment:
    description: The comment as plain text.
    type: string
  forwarded:
    description: Whether the report is to be forwarded to the target's server.
    type: boolean
  filed_at:
    type: string
    format: date-time
  target_account:
    description: |
      The account reported, as the user would see it through `getAccount`; omitted when that
      answers 404, because the account is suspended, deleted, or blocks the user.
    allOf:
      - $ref: ./Account.yaml
  status_ids:
    type: array
    items:
      $ref: ./Id.yaml
  rule_ids:
    type: array
    items:
      $ref: ./Id.yaml
  voice_room_id:
    description: The voice chat room reported; omitted for none.
    allOf:
      - $ref: ./Id.yaml
  state:
    $ref: ./ReportState.yaml

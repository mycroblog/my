# SPDX-License-Identifier: MIT
description: |
  The name of a new passkey and what confirms it: the user's `password`, a `passkey` of
  the user, or an `external_confirmation`.
type: object
required: [name]
properties:
  name:
    description: What the user calls the passkey; spaces around it are dropped.
    type: string
    minLength: 1
    maxLength: 64
  password:
    description: The user's current password.
    type: string
    minLength: 1
    maxLength: 1024
  passkey:
    $ref: ./PasskeyAssertion.yaml
  external_confirmation:
    $ref: ./ExternalConfirmationToken.yaml

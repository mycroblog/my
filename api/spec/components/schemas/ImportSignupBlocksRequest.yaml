# SPDX-License-Identifier: MIT
description: A list of values to block sign-ups by, all with the same settings.
type: object
required: [kind, text, severity]
properties:
  kind:
    $ref: ./AdminSignupBlockKind.yaml
  text:
    description: |
      The list: one value per line, or a CSV row whose first field is the value; blank
      lines and lines starting with `#` are ignored. At most 10,000 values.
    type: string
  severity:
    $ref: ./AdminSignupBlockSeverity.yaml
  comment:
    description: The comment of every block added.
    type: string
    maxLength: 1000
  expires_in:
    description: |
      The seconds each block lasts, at most ten years (315360000); omitted, they last until
      they are lifted.
    type: integer
    minimum: 1
    maximum: 315360000

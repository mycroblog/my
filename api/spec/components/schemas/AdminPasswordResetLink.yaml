# SPDX-License-Identifier: MIT
description: |
  A password reset link that an administrator issued for a local account (FR-002). It is
  shown once.
type: object
required: [url, expires_at, login_providers_only]
properties:
  url:
    description: The link that sets a new password; it works once.
    type: string
    format: uri
  expires_at:
    description: When the link stops working.
    type: string
    format: date-time
  login_providers_only:
    description: |
      Whether registration and sign-in are limited to the login providers now. While they are, the
      link sets no password; it works only if the limit ends before `expires_at`.
    type: boolean

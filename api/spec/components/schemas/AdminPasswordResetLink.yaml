# SPDX-License-Identifier: MIT
description: |
  A password reset link that an administrator issued for a local account (FR-002). It is
  shown once.
type: object
required: [url, expires_at]
properties:
  url:
    description: The link that sets a new password; it works once.
    type: string
    format: uri
  expires_at:
    description: When the link stops working.
    type: string
    format: date-time

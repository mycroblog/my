# SPDX-License-Identifier: MIT
description: A moderator's internal note on a report; never shown to the target or the reporter.
type: object
required: [id, body, created_at]
properties:
  id:
    $ref: ./Id.yaml
  author_account_id:
    description: |
      The account of the moderator who wrote the note; omitted for a note from the
      command line and when the moderator has no account.
    allOf:
      - $ref: ./Id.yaml
  body:
    description: The note as plain text, up to 2,000 characters.
    type: string
  created_at:
    type: string
    format: date-time

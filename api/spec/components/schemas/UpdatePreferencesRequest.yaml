# SPDX-License-Identifier: MIT
description: A change of the preferences; properties left out keep their current values.
type: object
properties:
  locale:
    description: The UI locale, a BCP 47 language tag. Without `locale_follows_browser`, it stops following the browser.
    type: string
  locale_follows_browser:
    description: Whether clients with a browser show its language instead of `locale`.
    type: boolean
  time_zone:
    description: The time zone, an IANA name. Without `time_zone_follows_browser`, it stops following the browser.
    type: string
  time_zone_follows_browser:
    description: Whether clients with a browser show dates in its time zone instead of `time_zone`.
    type: boolean
  default_visibility:
    $ref: ./Visibility.yaml
  default_quote_policy:
    $ref: ./QuotePolicy.yaml
  default_post_language:
    description: The language of new posts that name none; `und` for undetermined.
    type: string
  require_media_description:
    description: Whether clients ask for a description before posting media without one.
    type: boolean
  timeline_auto_insert:
    description: Whether the web client inserts new timeline posts without asking.
    type: boolean
  link_card_size:
    $ref: ./LinkCardSize.yaml
  timeline_languages:
    description: The languages that timelines show, at most 64; empty shows every language.
    type: array
    maxItems: 64
    items:
      type: string

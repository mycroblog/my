# SPDX-License-Identifier: AGPL-3.0-only
#
# The map from the repository's paths to what governs them: the document sections an agent reads before
# changing them (docs), the user and operator documents that describe them and change with them (userdocs), the
# `scripts/task.sh check` contexts they need (checks), whether parallel work must treat them as shared files (shared,
# docs/agents/workflow.md §9), and short notes printed in every context pack.
#
# `agentkit ctx` and `agentkit map show <path>` read it. `agentkit map check` (agentkit:check, CI) fails when
# a tracked file matches no entry and no ignore pattern, when a directory matching a strict pattern is not
# named literally by some entry, when a docs or userdocs reference names a missing file or heading, or when a
# document of userdocs.cover is the userdocs of no entry. `agentkit docs impact` lists the userdocs of the changed
# paths, which a pull request changes or explains (AGENTS.md#documentation).
# When you add a directory, a module, an adapter, or a feature, add or extend its entry in the same change; when
# you add a user or operator document, name it in the userdocs of the entries whose paths it describes. Keep
# userdocs precise: a document belongs to the paths whose change can make it wrong, not to every path it mentions.
#
# Patterns: `*` matches within one path segment, `**` any number of segments.
# Docs and userdocs: <path> or <path>#<anchor>, the anchor as GitHub generates it (agentkit outline <path> prints them).

ignore:
  - "**/*.gen.go"
  - "**/*.gen.ts"
  - "**/testdata/**"
  - "**/__screenshots__/**"
  - "internal/adapter/db/*/*gen/**"
  - "internal/adapter/queue/db/internal/**"
  - "api/openapi.yaml"
  - "internal/interface/web/dist/**"
  - ".tmp/**"

strict:
  - "*"
  - "docs/*"
  - "internal/*"
  - "internal/domain/*"
  - "internal/app/*"
  - "internal/adapter/*"
  - "internal/interface/*"
  - "app/*"
  - "app/web/src/features/*"
  - "app/web/src/lib/*"
  - "pkg/testkit/*"

userdocs:
  # The user and operator documents: each is the userdocs of some entry.
  cover:
    - "docs/operations/*.md"
    - "docs/reference/*.md"
  # Changed paths that no document describes, which `agentkit docs impact` passes over: tests, their fixtures and
  # stories, and the test-only deployments.
  skip:
    - "**/*_test.go"
    - "**/*.test.ts"
    - "**/*.test.tsx"
    - "**/*.stories.tsx"
    - "**/testdata/**"
    - "**/e2e/**"
    - "pkg/testkit/**"
    - "deploy/docker/federation-live/**"

entries:
  # --- Repository-wide ------------------------------------------------------------------------------
  - name: repo-meta
    paths: ["*.md", "LICENSE", ".editorconfig", ".gitattributes", ".git-blame-ignore-revs", ".gitignore", ".dockerignore", ".markdownlint-cli2.jsonc", ".tool-versions"]
    docs: ["AGENTS.md#hard-rules", "AGENTS.md#documentation"]
    checks: [docs]
  - name: build-and-ci
    paths: ["Taskfile.yml", "tasks/**", ".github/**", "scripts/**", ".claude/**"]
    docs: ["docs/agents/workflow.md#what-ci-runs-where", "docs/adr/0079-ci-single-gate-merge-queue.md", "docs/adr/0080-task-runner-go-task.md", "docs/adr/0083-ci-steps-not-tasks.md", "docs/operations/releasing.md"]
    checks: [docs, go, i18n, api, ui, web, docker, agentkit, mykit]
    shared: true
    notes:
      - "Taskfile.yml, tasks/, workflows and scripts/changed-contexts.sh select every check context: run `scripts/task.sh check`."
      - "Each job of .github/workflows/ci.yml runs its checks as parallel steps, each calling one area task (ADR-0083): a new check in a `<context>:check` task also needs a step, or `docs:ci-coverage` fails."
  - name: tasks
    paths: ["Taskfile.yml", "tasks/**"]
    userdocs: ["docs/reference/commands.md"]
    notes:
      - "Every task with a desc appears in docs/reference/commands.md (`agentkit docs inventory`)."
  - name: release
    paths: [".github/workflows/release.yml", ".github/workflows/slow-suite.yml", "scripts/release-libraries.sh"]
    userdocs: ["docs/operations/releasing.md"]

  # --- Documents --------------------------------------------------------------------------------------
  - name: adr
    paths: ["docs/adr/**"]
    docs: ["docs/agents/writing-adrs.md", "AGENTS.md#hard-rules"]
    checks: [docs]
    shared: true
    notes:
      - "Never set Accepted/Rejected yourself; create ADRs with `scripts/task.sh docs:adr-new`, which avoids the numbers of open PRs."
  - name: requirements
    paths: ["docs/requirements/**"]
    docs: ["docs/requirements/00-vision.md"]
    checks: [docs]
    shared: true
  - name: architecture-docs
    paths: ["docs/architecture/*.md", "docs/README.md"]
    docs: ["AGENTS.md#hard-rules"]
    checks: [docs]
    shared: true
    notes:
      - "Documents describe the present (ADR-0021): no history, no changelog wording."
  - name: design-doc-sections
    paths: ["docs/architecture/web-client/**", "docs/architecture/data-model/**"]
    docs: ["AGENTS.md#hard-rules", "docs/adr/0082-conflict-free-file-layout.md"]
    checks: [docs]
    notes:
      - "One file per section (ADR-0082): a change goes into its section's file; a new section is a new <NN>-<slug>.md listed in the directory's README.md."
      - "Documents describe the present (ADR-0021): no history, no changelog wording."
  - name: agent-docs
    paths: ["docs/agents/**"]
    docs: ["docs/adr/0014-task-management-and-agent-workflow.md", "AGENTS.md#documentation"]
    checks: [docs]
    notes:
      - "Written in English (AGENTS.md#documentation)."
  - name: operations-docs
    paths: ["docs/operations/**"]
    docs: ["AGENTS.md#documentation", "AGENTS.md#hard-rules"]
    checks: [docs]
    notes:
      - "English only, and no links to or citations of ADRs, docs/requirements, docs/architecture, or issues and PRs: explain the behaviour itself. A new file is linked from docs/README.md and named in the userdocs of the entries whose paths it describes."
  - name: reference-docs
    paths: ["docs/reference/**"]
    docs: ["docs/reference/build-tags.md", "AGENTS.md#documentation"]
    checks: [docs, go]
    notes:
      - "docs/reference/configuration.md is generated: `scripts/task.sh go:config-docs`."
      - "English only, and no links to or citations of ADRs, docs/requirements, docs/architecture, or issues and PRs (AGENTS.md#documentation)."
  - name: doc-rules
    paths: ["docs/lint.yaml", "tools/agentkit/internal/docslint/**", "tools/agentkit/internal/docsync/**"]
    docs: ["AGENTS.md#documentation", "tools/agentkit/README.md#documentation-rules"]
    checks: [docs, agentkit]
    notes:
      - "docs/lint.yaml says which files each rule of `agentkit docs lint` (scripts/task.sh docs:rules) covers, and what `agentkit docs inventory` (scripts/task.sh agentkit:inventory) excludes; its pending and exclude lists only shrink."

  # --- Server: shared rules ---------------------------------------------------------------------------
  - name: go-server
    paths: ["internal/**", "cmd/**", "pkg/**", "go.mod", "go.sum", ".golangci.yml"]
    docs: ["AGENTS.md#design-rules", "docs/architecture/overview.md#依存ルール"]
    checks: [go]
    notes:
      - "depguard enforces the layer rules; restructure instead of weakening a rule."
      - "Transactions are short and free of external I/O; enqueue jobs via the outbox; handlers are idempotent."
  - name: go-module-index
    paths: ["internal/domain/**", "internal/app/**"]
    docs: ["docs/architecture/overview.md#2-モジュール境界づけられたコンテキスト", "docs/architecture/data-model/04-tables/README.md#40-所有モジュール"]
    checks: [go]
  - name: i18n
    paths: ["internal/i18n/**", "locales/**", "tools/i18n/**"]
    docs: ["docs/adr/0009-internationalization.md"]
    checks: [i18n, go, web]
    shared: true
    notes:
      - "Add messages to locales/en and locales/ja, each key in the file of its area: locales/<locale>/<namespace>/<first segment>.json, or <namespace>/admin/<second segment>.json under admin (ADR-0082); a new area is a new file."
      - "Then `scripts/task.sh i18n:gen` and commit the files Go reads (client pseudo-locales and TS accessors are not committed)."
      - "Call each thing by the term of tools/i18n/glossary.json (web-client G21); `i18n:check` rejects the variants it lists, and a new term goes there."
  - name: mail-templates
    paths: ["app/mail/**", "internal/app/kernel/mail_composer.go", "internal/app/kernel/mail_frame.gen.html"]
    docs: ["docs/adr/0086-email-delivery.md#2-組み立てテンプレートと外枠", "docs/adr/0081-generated-files-policy.md"]
    userdocs: ["docs/operations/email.md#the-html-version"]
    checks: [mail, web, go]
    notes:
      - "Edit app/mail/frame.mjml, never mail_frame.gen.html; then `scripts/task.sh mail:gen` and commit the generated template."
      - "Every value goes through html/template; the HTML links to https URLs only and loads no external font, image or style sheet."
  - name: mail-preview
    paths: ["internal/platform/mailpreview/**", "scripts/mail-preview/**", "internal/app/identity/mail_drafts.go", "internal/app/notification/mail_drafts.go"]
    docs: ["docs/adr/0086-email-delivery.md#2-組み立てテンプレートと外枠"]
    userdocs: ["docs/reference/commands.md"]
    checks: [go]
    notes:
      - "Every email is a pure draft function (internal/app/<module>/mail_drafts.go) and entries in internal/platform/mailpreview/catalog.go; TestCatalogHasEveryEmail fails without them."
      - "A change to an email or the frame rewrites the golden files: `scripts/task.sh mail:golden`, then review the diff. `scripts/task.sh mail:preview` writes .tmp/mail/preview/index.html."
  - name: platform
    paths: ["internal/platform/**", "cmd/my/**"]
    docs: ["docs/architecture/overview.md#6-リポジトリ構成", "docs/adr/0010-configuration-and-packaging.md", "docs/operations/production-checklist.md"]
    checks: [go, docker]
    notes:
      - "A change to the config schema regenerates docs/reference/configuration.md (`scripts/task.sh go:config-docs`)."
  - name: config-schema
    paths: ["internal/platform/config/schema.go", "internal/platform/config/reference.go", "internal/platform/config/retired.go"]
    userdocs: ["docs/reference/configuration.md"]
    notes:
      - "docs/reference/configuration.md is generated from the schema: `scripts/task.sh go:config-docs` (go:test fails when it is stale)."
  - name: config-readiness
    paths: ["internal/platform/config/readiness.go", "cmd/my/config.go", "cmd/my/configerror.go"]
    userdocs: ["docs/operations/production-checklist.md", "docs/operations/key-management.md#web-push-vapid-key"]
  - name: build-tags
    paths: ["internal/platform/adapters*.go", "internal/platform/config/adapters*.go", "scripts/go-build-tags.sh"]
    docs: ["docs/reference/build-tags.md"]
    userdocs: ["docs/reference/build-tags.md"]
  - name: fake-push-service
    paths: ["internal/adapter/pushservice/**", "cmd/my/dev_push_service.go"]
    docs: ["docs/adr/0118-demo-web-push.md", "docs/adr/0117-demo-environment.md", "docs/reference/build-tags.md"]
    userdocs: ["docs/reference/build-tags.md#the-fake-push-service"]
    notes:
      - "Only the test builds (build tag e2e_fakes) link it, through cmd/my/dev_push_service.go; scripts/go-build-tags.sh and depguard check it."
      - "Its receiving side (VAPID verification, RFC 8291 decryption) is written apart from internal/adapter/webpush; both are tested against RFC 8291 Appendix A."
  - name: server-process
    paths: ["cmd/my/main.go", "cmd/my/serve.go", "cmd/my/job.go", "internal/platform/serve.go", "internal/platform/http.go", "internal/platform/log.go", "internal/platform/health.go"]
    userdocs: ["docs/operations/running.md", "docs/operations/monitoring.md#which-url-to-monitor"]
  - name: telemetry
    paths: ["internal/platform/telemetry.go", "internal/platform/tracing.go", "internal/app/metrics/**", "internal/adapter/telemetry/**", "internal/app/queue/metrics.go", "internal/app/federation/metrics.go", "internal/interface/clientapi/streaming.go"]
    docs: ["docs/operations/running.md#metrics"]
    userdocs: ["docs/operations/running.md#metrics", "docs/operations/alerts.md"]
    notes:
      - "Every metric (kernel.Instrument) is listed in docs/operations/running.md#metrics (`agentkit docs inventory`); a renamed metric or label also updates deploy/monitoring and docs/operations/alerts.md."
  - name: error-reporting
    paths: ["internal/app/kernel/errorreport.go", "internal/app/kernel/errorreport_test.go", "internal/app/kernel/errorscrub.go", "internal/app/kernel/errorscrub_test.go", "internal/platform/errorreport.go", "internal/platform/errorreport_test.go", "internal/platform/errorreport_*.go", "internal/platform/errorexport.go", "internal/platform/errorexport_test.go", "internal/adapter/errorreport/**", "internal/platform/errorscrub.go", "internal/platform/errorscrub_test.go", "internal/platform/errorlog.go", "internal/platform/errorlog_test.go", "internal/app/queue/errors_test.go"]
    docs: ["docs/adr/0103-error-reporting.md", "docs/architecture/overview.md#3-ポート一覧"]
    userdocs: ["docs/reference/configuration.md", "docs/operations/running.md#metrics", "docs/operations/running.md#error-reports", "docs/operations/alerts.md#myerrorreportsincreasing", "docs/operations/error-reporting.md"]
    notes:
      - "kernel.ErrorReporter and ErrorEvent use the standard library only; every report goes through the one platform.ErrorReporter, which fills the version, role, environment, and correlation IDs and hands the event to its sinks."
      - "A new output is an ErrorSink (ErrorSinkCloser when it flushes at close) added with App.ErrorReporter.AddSink from the setup of its module; an exporter of errors_exporter registers its ErrorExporter in errorExporters from the init of its own file and flips its choice to inV0 in the config schema."
      - "Sinks never report their own failures, never block a request for long, and run concurrently; the sink that panics is skipped."
      - "Exporters share platform.ExportQueue (1,000 reports, drop and count when full, 2 s drain, my.errors.exported): the adapter in internal/adapter/errorreport/<name> only implements SendError(ctx, kernel.ErrorEvent) error (platform.ErrorSender) and returns an error with Dropped() bool for a rate-limited report; adapters never import platform, and import another adapter only as errorreport/otlp takes the resource of telemetry/otel."
      - "errorreport/otlp is the one OpenTelemetry package outside internal/adapter/telemetry (depguard): it emits exception log records through a SimpleProcessor, never Record.SetErr (the SDK would copy the unscrubbed err.Error()), takes the trace and span IDs from the event into the Emit ctx, and is left out by no_otel through internal/platform/errorreport_otlp.go."
      - "Report scrubs the message and the stack and sets the fingerprint (errorscrub.go) before any sink; the log sink (errorlog.go) is always there, and the exporter sits behind exportLimiter (one per fingerprint a minute, 60 a minute)."
      - "Capture points pass an empty where inside a request: the reporter names it <surface> <method> <route>. Report only 5xx causes, job panics and dead jobs, and startup failures; a failure caused by a remote server (a delivery) uses queue.RetryRemote and is not reported."
      - "Start goroutines with kernel.Go(ctx, name, reporter, fn): its panic is reported as fatal and stops Serve through ErrorReporter.StopProcess."
  - name: cli-admin
    paths: ["cmd/my/admin.go", "cmd/my/role.go", "cmd/my/audit.go"]
    userdocs: ["docs/operations/admin-cli.md"]
  - name: cli-moderation
    paths: ["cmd/my/account_actions.go", "cmd/my/appeal.go", "cmd/my/moderation.go", "cmd/my/domain_block.go", "cmd/my/refetch.go", "cmd/my/retention.go", "cmd/my/two_factor.go"]
    userdocs: ["docs/operations/moderation.md"]
  - name: cli-registration
    paths: ["cmd/my/registration.go", "cmd/my/signup_block.go", "cmd/my/password_reset.go"]
    userdocs: ["docs/operations/registration.md", "docs/operations/moderation.md"]
  - name: cli-login-provider
    paths: ["cmd/my/login_provider.go", "internal/app/identity/login_provider_admin.go", "internal/interface/clientapi/admin_login_providers.go"]
    userdocs: ["docs/operations/login-providers.md"]
  - name: cli-instance
    paths: ["cmd/my/instance*.go", "cmd/my/emoji*.go", "cmd/my/federation.go"]
    userdocs: ["docs/operations/instance-settings.md"]
  - name: cli-closure
    paths: ["cmd/my/closure.go"]
    userdocs: ["docs/operations/service-closure.md", "docs/operations/admin-cli.md#announcing-the-end-of-the-service"]

  # --- Server: modules (internal/domain/<m>, internal/app/<m>) ----------------------------------------
  - name: module-identity
    paths: ["internal/domain/identity/**", "internal/app/identity/**"]
    docs: ["docs/architecture/data-model/04-tables/01-identity.md#41-identity", "docs/operations/registration.md"]
    userdocs: ["docs/operations/registration.md"]
  - name: module-account
    paths: ["internal/domain/account/**", "internal/app/account/**"]
    docs: ["docs/architecture/data-model/04-tables/02-account.md#42-account", "docs/architecture/data-model/05-states-and-policies.md#5-状態とポリシー"]
  - name: module-moderation
    paths: ["internal/domain/moderation/**", "internal/app/moderation/**"]
    docs: ["docs/architecture/data-model/04-tables/03-moderation.md#43-moderation", "docs/operations/moderation.md", "docs/adr/0058-moderation-admin-separation.md"]
    userdocs: ["docs/operations/moderation.md"]
  - name: module-content
    paths: ["internal/domain/content/**", "internal/app/content/**"]
    docs: ["docs/architecture/data-model/04-tables/04-content.md#44-content", "docs/architecture/visibility.md"]
    notes:
      - "Visibility checks go through the single domain policy function; never re-implement them."
  - name: text-tokens
    paths: ["pkg/testkit/fixtures/text/**", "internal/app/content/text.go", "internal/domain/content/custom_emoji.go", "app/web/src/lib/textTokens.ts", "app/web/src/lib/textHighlights.ts"]
    docs: ["docs/adr/0092-composer-autocomplete-highlight.md#decision決定"]
    checks: [go, web]
    notes:
      - "ParseText, ScanShortcodes and app/web/src/lib/textTokens.ts follow the same rules: change them together with the shared vectors pkg/testkit/fixtures/text/tokens.json, which the Go tests and Vitest both read."
  - name: module-graph
    paths: ["internal/domain/graph/**", "internal/app/graph/**"]
    docs: ["docs/architecture/data-model/04-tables/05-graph.md#45-graph"]
  - name: account-move
    paths: ["internal/domain/account/move*.go", "internal/app/account/move.go", "internal/app/graph/migrate.go", "internal/app/federation/move.go", "internal/app/federation/move_out.go", "internal/interface/clientapi/account_move.go", "pkg/testkit/account_move_contract.go", "pkg/testkit/account_move_out_contract.go", "internal/domain/account/alias.go", "internal/app/account/alias.go", "internal/interface/clientapi/aliases.go", "pkg/testkit/account_alias_contract.go"]
    docs: ["docs/adr/0089-account-migration-move.md#decision決定", "docs/architecture/federation.md#34-アクティビティごとのハンドラ", "docs/architecture/federation.md#71-記録", "docs/architecture/data-model/04-tables/02-account.md#移転adr-0089"]
    notes:
      - "A Move is recorded by the account module (account.moved); the graph module migrates the local follows, blocks and mutes in graph.migrate_follows, idempotently."
      - "A local move is checked by federation.LocalMoves before account.RecordLocalMove; account.moved (self) queues the Update(Actor) with movedTo and the Move (flow retract), and a moved account is refused posting and following with 403 account-moved."
      - "Aliases (account_aliases) are added by the client API after it resolves the handle or URL outside the transaction; account.aliases_changed records the Update of the actor only when the federation mode publishes."
  - name: module-timeline
    paths: ["internal/domain/timeline/**", "internal/app/timeline/**"]
    docs: ["docs/architecture/data-model/04-tables/06-timeline.md#46-timeline", "docs/architecture/data-model/06-timeline-queries.md#6-タイムラインのクエリ", "docs/adr/0013-timeline-strategy.md"]
  - name: module-notification
    paths: ["internal/domain/notification/**", "internal/app/notification/**"]
    docs: ["docs/architecture/data-model/04-tables/07-notification.md#47-notification"]
  - name: module-federation
    paths: ["internal/domain/federation/**", "internal/app/federation/**"]
    docs: ["docs/architecture/data-model/04-tables/08-federation.md#48-federation", "docs/architecture/federation.md#1-構成"]
    notes:
      - "ActivityPub wire formats and federated URIs stay spec-compliant even in v0."
  - name: module-instance
    paths: ["internal/domain/instance/**", "internal/app/instance/**"]
    docs: ["docs/architecture/data-model/04-tables/09-instance.md#49-instance", "docs/operations/instance-settings.md", "docs/adr/0088-service-shutdown-modes.md"]
    userdocs: ["docs/operations/instance-settings.md", "docs/operations/service-closure.md"]
  - name: module-webhook
    paths: ["internal/domain/webhook/**", "internal/app/webhook/**"]
    docs: ["docs/architecture/data-model/04-tables/11-webhook.md#411-webhook", "docs/reference/webhooks.md"]
    userdocs: ["docs/reference/webhooks.md", "docs/operations/webhooks.md"]
  - name: module-finance
    paths: ["internal/domain/finance/**", "internal/app/finance/**"]
    docs: ["docs/architecture/data-model/04-tables/12-finance.md#412-finance", "docs/adr/0067-finance-cost-records.md", "docs/adr/0068-billing-import.md", "docs/adr/0073-income-records-and-publication.md"]
  - name: module-supporters
    paths: ["internal/domain/supporters/**", "internal/app/supporters/**", "cmd/my/supporters.go"]
    docs: ["docs/architecture/data-model/04-tables/13-supporters.md#413-supporters", "docs/adr/0072-supporter-plans-and-roles.md", "docs/operations/supporters.md"]
    userdocs: ["docs/operations/supporters.md"]
  - name: module-voice
    paths: ["internal/domain/voice/**", "internal/app/voice/**", "internal/platform/voice.go", "internal/adapter/voice/**", "internal/adapter/db/*/voice.go", "internal/interface/voice/**", "schema/*/14-voice.sql", "queries/*/voice.sql", "pkg/testkit/voice_*contract.go", "pkg/testkit/livekittest/**", "internal/platform/adapters_*voice_livekit.go", "internal/platform/adapters_*voice_sora.go", "internal/platform/config/adapters_no_voice_*.go", "internal/interface/clientapi/voice*.go", "api/spec/paths/voice_*.yaml", "api/spec/components/*/Voice*.yaml", "app/web/src/features/voice/**"]
    docs: ["docs/architecture/data-model/04-tables/14-voice.md#414-voice", "docs/architecture/data-model/05-states-and-policies.md#55-通話のルームの判定", "docs/adr/0100-voice-chat-rooms.md", "docs/adr/0101-voice-chat-transport.md", "docs/adr/0102-voice-chat-sfu-adapters.md"]
    notes:
      - "Every place that shows a room or lets someone join or speak goes through voice.CanSee and voice.CanSpeakFreely (ADR-0100 §4); internal/app/voice gathers the facts."
      - "A command writes the rows of its events, then emits the matching voice event in the same transaction; the projectors rebuild voice_room_heads and voice_room_participants with the same SQL as the rebuild."
      - "The heartbeats and the session IDs live only in the KeyValueStore (voice.heartbeat, voice.session); the room requests and voice.sweep evaluate the expiry with conditional writes that apply once. Transport calls never run in a transaction: voice.apply (outbox) makes them after the commit."
      - "The SFU adapters (internal/adapter/voice/livekit, internal/adapter/voice/sora) call the operator's server with their own HTTP client and sign HS256 tokens and join values with crypto/hmac (no SDK). Their webhooks go through internal/interface/voice (routes per method, not in the OpenAPI) to ReceiveMediaEvents, which queues voice.media_event keyed by the event ID, and to AuthorizeMediaConnect (Sora's auth webhook), which decides from the projections and the KeyValueStore only; voice.sweep reconciles each open room with Sessions. The Sora adapter is tested only on its httptest fake (no real Sora). The LiveKit contract also runs on livekit-server --dev only with TEST_LIVEKIT=container: `scripts/task.sh go:test-voice` (CI job voice-contract in the slow suite)."
      - "The room streams (voice_stream.go) carry the voice_* signals of stream.Hub / stream.Relay, each at most 1 KiB: a signal or a grant for one session waits in the KeyValueStore (voice.message, 30 s) and only its ID crosses the Bus; mic, reactions, and mutes are never recorded."
    userdocs: ["docs/operations/voice.md"]
  - name: module-diagnostics
    paths: ["internal/domain/diagnostics/**", "internal/app/diagnostics/**", "internal/platform/diagnostics.go", "internal/adapter/db/*/diagnostics.go", "schema/*/15-diagnostics.sql", "queries/*/diagnostics.sql", "pkg/testkit/diagnostics_contract.go"]
    docs: ["docs/architecture/data-model/04-tables/15-diagnostics.md#415-diagnostics", "docs/adr/0103-error-reporting.md"]
    notes:
      - "diagnostics.Recorder is an ErrorSink of platform.ErrorReporter: the first occurrence of a fingerprint and version in the process runs Service.RecordFirst (one short transaction for the group and a regression, then one statement each for the count and the sample); the rest are counted in memory by hour and flushed every 60 s and at App.Close. Writes run in the Recorder's goroutine and are dropped when they fail; the sink never reports its own errors."
      - "Counts and samples are current values written outside transactions with additive upserts keyed by the fingerprint; error_group_states is the projection of the group events (diagnostics.Next), rebuilt from the newest event of each group."
      - "diagnostics.error_group_created, diagnostics.error_group_regressed, and diagnostics.error_group_confirmed are the events that the administrators' notifications and the webhooks subscribe to; a group created by an unauthenticated web report (Group.Unauthenticated) notifies only when the first report with a session confirms it."

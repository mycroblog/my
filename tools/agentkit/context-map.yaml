      - "Unicode emoji are drawn with the Noto Color Emoji web font of @my/ui/emoji.css everywhere (ADR-0095), never with an OS-font check: the fonts cover every emoji of EMOJI_VERSION."
  - name: web-feature-search
    paths: ["app/web/src/features/search/**"]
    docs: ["docs/architecture/web-client/15-search-and-remote-follow.md#15-検索とほかのサーバーのアカウントのフォロー"]
  - name: web-feature-report
    paths: ["app/web/src/features/report/**"]
    docs: ["docs/architecture/web-client/17-reports.md#17-通報", "docs/architecture/web-client/18-account-status-and-appeals.md#18-アカウントの状態と異議申し立て"]
  - name: web-feature-settings
    paths: ["app/web/src/features/settings/**", "app/web/src/features/session/**"]
    docs: ["docs/architecture/web-client/19-import-and-export.md#19-インポートとエクスポート", "docs/architecture/web-client/10-api-client-and-auth.md#10-api-クライアントと認証", "docs/architecture/web-client/screens/badges.md", "docs/architecture/web-client/screens/settings-menu.md", "docs/architecture/web-client/screens/settings.md", "docs/architecture/web-client/screens/settings-preferences.md", "docs/architecture/web-client/screens/settings-notifications.md", "docs/architecture/web-client/screens/settings-profile.md", "docs/architecture/web-client/screens/settings-auto-delete.md"]
  - name: web-feature-supporters
    paths: ["app/web/src/features/supporters/**"]
    docs: ["docs/adr/0072-supporter-plans-and-roles.md", "docs/adr/0071-role-badges-and-supporter-list.md", "docs/operations/supporters.md", "docs/architecture/web-client/screens/badges.md"]
  - name: web-feature-public
    paths: ["app/web/src/features/about/**", "app/web/src/features/landing/**", "app/web/src/features/costs/**"]
    docs: ["docs/architecture/web-client/09-app-shell.md#9-アプリの外枠", "docs/adr/0073-income-records-and-publication.md", "docs/architecture/web-client/screens/landing.md"]

  # --- Deployment -----------------------------------------------------------------------------------------
  - name: deploy
    paths: ["deploy/**", "Dockerfile"]
    docs: ["docs/architecture/deployment-targets.md#self-hosteddocker--microk8s", "docs/operations/running.md"]
    checks: [docker]
  - name: docker-compose
    paths: ["deploy/docker/compose.yaml", "Dockerfile"]
    userdocs: ["README.md#quick-start-docker-compose", "docs/operations/database.md#docker-compose", "docs/operations/maintenance.md#docker-compose"]
  - name: monitoring
    paths: ["deploy/monitoring/**", "docs/operations/alerts.md"]
    docs: ["docs/operations/alerts.md", "docs/operations/monitoring.md"]
    userdocs: ["docs/operations/alerts.md"]
    checks: [docker, docs]
    notes:
      - "The alerting rules use the metric names as Prometheus shows them (internal/platform/telemetry.go, internal/app/metrics, internal/adapter/telemetry); a renamed metric or label updates alerts.yml, alerts.test.yml, and docs/operations/alerts.md together. `scripts/task.sh docker:alert-rules` runs promtool on them."
  - name: upgrade-test
    paths: ["deploy/docker/upgrade-test/**", "scripts/upgrade-test.sh", "scripts/previous-minor.sh", "scripts/previous-minor-test.sh", "scripts/web-sign-in.sh"]
    docs: ["docs/operations/releasing.md#the-upgrade-test", "docs/operations/database.md#upgrading"]
    userdocs: ["docs/operations/releasing.md#the-upgrade-test"]
    checks: [docker, shell]
    notes:
      - "The release gate's upgrade test (slow-suite.yml job upgrade): scripts/upgrade-test.sh fills a database through the previous release's images and upgrades it with this tree's, on both dialects; run `scripts/task.sh docker:upgrade-test PREVIOUS=<tag>`. scripts/previous-minor.sh picks the tag (`scripts/task.sh shell:test`). The data it seeds and reads goes through the client API and the CLI only, so it works against any earlier release."

  # --- Tools ----------------------------------------------------------------------------------------------
  - name: agentkit
    paths: ["tools/agentkit/**"]
    docs: ["tools/agentkit/README.md"]
    checks: [agentkit]
  - name: go-tools
    paths: ["tools/go.mod", "tools/go.sum"]
    docs: ["docs/reference/commands.md"]
    checks: [go]

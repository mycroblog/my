  # --- Client libraries -----------------------------------------------------------------------------------
  - name: mykit
    paths: ["pkg/mykit/**", "scripts/mykit-mod-check.sh", "internal/platform/platformtest/**"]
    docs: ["docs/adr/0093-api-client-library-mykit.md", "docs/architecture/client-api.md#4-認可oauth-20"]
    checks: [mykit]
    notes:
      - "pkg/mykit is a Go module of its own under MIT (`// SPDX-License-Identifier: MIT`): it never imports or requires the server module, and its dependencies are permissive only (`scripts/task.sh mykit:check`)."
      - "api.gen.go is generated from api/openapi.yaml by `scripts/task.sh api:generate` (pkg/mykit/oapi-codegen.yaml); the hand-written files hold only the cross-cutting layer (auth, errors, paging, retries, uploads), never per-endpoint helpers."
      - "pkg/mykit/integration is an unpublished test module (MIT headers, as all of pkg/mykit) that joins the server and pkg/mykit by `replace`; its tests start the server with internal/platform/platformtest (which pkg/testkit may not import, ADR-0002) and drive it with the Go client only. Run `scripts/task.sh mykit:integration-test`."
  - name: mykit-ts
    paths: ["pkg/mykit/ts/**"]
    docs: ["docs/adr/0093-api-client-library-mykit.md", "docs/adr/0029-api-code-generation.md"]
    checks: [mykit]
    notes:
      - "@mycroblog/mykit (pkg/mykit/ts) is an MIT npm package of the client workspace (app/package.json `workspaces`): ESM only, openapi-fetch its only dependency, no Node.js built-in module in src/ (tsconfig.lib.json has no Node.js types; .oxlintrc.json `import/no-nodejs-modules`); `scripts/task.sh mykit:check` runs its ts-* tasks."
      - "src/schema.gen.ts is generated by `scripts/task.sh api:generate` and committed; the other files of src/ hold only the cross-cutting layer, never per-endpoint helpers, and no user-facing strings (i18n is the caller's)."
      - "app/web consumes the source through the `@mycroblog/source` export condition (ADR-0093 §3), so a change for the web client is a change of the library's public API."
  - name: mybot
    paths: ["pkg/mybot/**"]
    docs: ["docs/adr/0094-bot-library-mybot.md", "docs/adr/0093-api-client-library-mykit.md"]
    checks: [mykit]
    notes:
      - "pkg/mybot is a Go module of its own under MIT (`// SPDX-License-Identifier: MIT`) that requires pkg/mykit alone, replaced with ../mykit, and never the server module; the mykit context checks it (`scripts/task.sh mykit:check`, the mybot-* tasks)."
      - "What mykit lacks (stream reconnection, token rotation, retries) goes into mykit, never into mybot (ADR-0094 §2); mybot holds the receiving (catch-up, dedupe, Store), handlers, middleware, manners, and the send budget."
      - "@mycroblog/mybot (pkg/mybot/ts) is the MIT npm package of the same library, a package of the client workspace that depends on @mycroblog/mykit alone (`workspace:*`): ESM only, no static Node.js built-in import in src/ (FileStore loads node:fs/promises dynamically, for Node.js, Bun, and Deno); its names, options, defaults, idempotency keys, and state file match the Go library, and a difference goes into its README. `scripts/task.sh mykit:check` runs its mybot-ts-* tasks; `mykit:mybot-ts-runtimes` (Node.js 22 and Deno) runs in CI."
      - "Every parses its five-field cron expressions in pkg/mybot itself (schedule.go, no dependency; ADR-0094 §5); pkg/mybot/testdata/cron.json holds the accepted and refused expressions and their times, shared with the TypeScript mybot so that both take the same range. The TypeScript mybot (pkg/mybot/ts/src/schedule.ts) refuses the same expressions itself and uses croner only to compute the times, skipping a time that croner moves out of a daylight saving gap; its schedule.test.ts runs the same fixture."
      - "pkg/mybot/mybottest is the fake server for the authors' tests (ADR-0094 §10): it answers only the operations that mybot calls, with the types of api/openapi.yaml; a new call of mybot needs its operation there, and pkg/mybot/integration checks the fake against the spec. @mycroblog/mybot/testing (pkg/mybot/ts/src/testing, a subpath export) mirrors it as a fetch-level fake with a Clock: a new call of the TS mybot needs its operation there too."
      - "pkg/mybot/integration is an unpublished test module (MIT headers) that joins the server, pkg/mykit, and pkg/mybot by `replace`; an echo bot runs against internal/platform/platformtest across a cut stream and a restart, and the fake of mybottest is checked with internal/interface/clientapi/apitest. Run `scripts/task.sh mykit:mybot-integration-test`."
      - "The example bots, echo, schedule, and commands, live in pkg/mybot/examples (Go, package main, tested against mybottest; with examples/login, the Authorization Code + PKCE flow on a loopback redirect) and pkg/mybot/ts/examples (TS, tested against @mycroblog/mybot/testing, typechecked by tsconfig.examples.json): keep the two sets doing the same, and the READMEs (pkg/mybot/README.md, pkg/mybot/ts/README.md) naming them. pkg/mybot/examples/Dockerfile builds a Go example from the repository root (`docker build -f pkg/mybot/examples/Dockerfile --build-arg EXAMPLE=echo .`), with its context kept by Dockerfile.dockerignore; its image pins match the root Dockerfile's."


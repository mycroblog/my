# SPDX-License-Identifier: AGPL-3.0-only
#
# The map from the repository's paths to what governs them: the document sections an agent reads before
# changing them (docs), the `scripts/task.sh check` contexts they need (checks), whether parallel work must treat them as
# shared files (shared, docs/agents/workflow.md §9), and short notes printed in every context pack.
#
# `agentkit ctx` and `agentkit map show <path>` read it. `agentkit map check` (agentkit:check, CI) fails when
# a tracked file matches no entry and no ignore pattern, when a directory matching a strict pattern is not
# named literally by some entry, or when a docs reference names a missing file or heading.
# When you add a directory, a module, an adapter, or a feature, add or extend its entry in the same change.
#
# Patterns: `*` matches within one path segment, `**` any number of segments.
# Docs: <path> or <path>#<anchor>, the anchor as GitHub generates it (agentkit outline <path> prints them).

ignore:
  - "**/*.gen.go"
  - "**/*.gen.ts"
  - "**/testdata/**"
  - "**/__screenshots__/**"
  - "internal/adapter/db/*/*gen/**"
  - "internal/adapter/queue/db/internal/**"
  - "api/openapi.yaml"
  - "internal/interface/web/dist/**"
  - ".tmp/**"

strict:
  - "*"
  - "docs/*"
  - "internal/*"
  - "internal/domain/*"
  - "internal/app/*"
  - "internal/adapter/*"
  - "internal/interface/*"
  - "app/*"
  - "app/web/src/features/*"
  - "app/web/src/lib/*"
  - "pkg/testkit/*"

entries:
  # --- Repository-wide ------------------------------------------------------------------------------
  - name: repo-meta
    paths: ["*.md", "LICENSE", ".editorconfig", ".gitattributes", ".gitignore", ".dockerignore", ".markdownlint-cli2.jsonc", ".tool-versions"]
    docs: ["AGENTS.md#hard-rules"]
    checks: [docs]
  - name: build-and-ci
    paths: ["Taskfile.yml", "tasks/**", ".github/**", "scripts/**", ".claude/**"]
    docs: ["docs/agents/workflow.md#what-ci-runs-where", "docs/adr/0079-ci-single-gate-merge-queue.md", "docs/adr/0080-task-runner-go-task.md", "docs/adr/0083-ci-steps-not-tasks.md", "docs/operations/releasing.md"]
    checks: [docs, go, i18n, api, ui, web, docker, agentkit, mykit]
    shared: true
    notes:
      - "Taskfile.yml, tasks/, workflows and scripts/changed-contexts.sh select every check context: run `scripts/task.sh check`."
      - "Each job of .github/workflows/ci.yml runs its checks as parallel steps, each calling one area task (ADR-0083): a new check in a `<context>:check` task also needs a step, or `docs:ci-coverage` fails."

  # --- Documents --------------------------------------------------------------------------------------
  - name: adr
    paths: ["docs/adr/**"]
    docs: ["docs/agents/writing-adrs.md", "AGENTS.md#hard-rules"]
    checks: [docs]
    shared: true
    notes:
      - "Never set Accepted/Rejected yourself; create ADRs with `scripts/task.sh docs:adr-new`, which avoids the numbers of open PRs."
  - name: requirements
    paths: ["docs/requirements/**"]
    docs: ["docs/requirements/00-vision.md"]
    checks: [docs]
    shared: true
  - name: architecture-docs
    paths: ["docs/architecture/*.md", "docs/README.md"]
    docs: ["AGENTS.md#hard-rules"]
    checks: [docs]
    shared: true
    notes:
      - "Documents describe the present (ADR-0021): no history, no changelog wording."
  - name: design-doc-sections
    paths: ["docs/architecture/web-client/**", "docs/architecture/data-model/**"]
    docs: ["AGENTS.md#hard-rules", "docs/adr/0082-conflict-free-file-layout.md"]
    checks: [docs]
    notes:
      - "One file per section (ADR-0082): a change goes into its section's file; a new section is a new <NN>-<slug>.md listed in the directory's README.md."
      - "Documents describe the present (ADR-0021): no history, no changelog wording."
  - name: agent-docs
    paths: ["docs/agents/**"]
    docs: ["docs/adr/0014-task-management-and-agent-workflow.md"]
    checks: [docs]
  - name: operations-docs
    paths: ["docs/operations/**"]
    docs: ["AGENTS.md#hard-rules"]
    checks: [docs]
  - name: reference-docs
    paths: ["docs/reference/**"]
    docs: ["docs/reference/build-tags.md"]
    checks: [docs, go]
    notes:
      - "docs/reference/configuration.md is generated: `scripts/task.sh go:config-docs`."

  # --- Server: shared rules ---------------------------------------------------------------------------
  - name: go-server
    paths: ["internal/**", "cmd/**", "pkg/**", "go.mod", "go.sum", ".golangci.yml"]
    docs: ["AGENTS.md#design-rules", "docs/architecture/overview.md#依存ルール"]
    checks: [go]
    notes:
      - "depguard enforces the layer rules; restructure instead of weakening a rule."
      - "Transactions are short and free of external I/O; enqueue jobs via the outbox; handlers are idempotent."
  - name: go-module-index
    paths: ["internal/domain/**", "internal/app/**"]
    docs: ["docs/architecture/overview.md#2-モジュール境界づけられたコンテキスト", "docs/architecture/data-model/04-tables/README.md#40-所有モジュール"]
    checks: [go]
  - name: i18n
    paths: ["internal/i18n/**", "locales/**", "tools/i18n/**"]
    docs: ["docs/adr/0009-internationalization.md"]
    checks: [i18n, go, web]
    shared: true
    notes:
      - "Add messages to locales/en and locales/ja, each key in the file of its area: locales/<locale>/<namespace>/<first segment>.json, or <namespace>/admin/<second segment>.json under admin (ADR-0082); a new area is a new file."
      - "Then `scripts/task.sh i18n:gen` and commit the files Go reads (client pseudo-locales and TS accessors are not committed)."
  - name: platform
    paths: ["internal/platform/**", "cmd/my/**"]
    docs: ["docs/architecture/overview.md#6-リポジトリ構成", "docs/adr/0010-configuration-and-packaging.md"]
    checks: [go, docker]
    notes:
      - "A change to the config schema regenerates docs/reference/configuration.md (`scripts/task.sh go:config-docs`)."

  # --- Server: modules (internal/domain/<m>, internal/app/<m>) ----------------------------------------
  - name: module-identity
    paths: ["internal/domain/identity/**", "internal/app/identity/**"]
    docs: ["docs/architecture/data-model/04-tables/01-identity.md#41-identity", "docs/operations/registration.md"]
  - name: module-account
    paths: ["internal/domain/account/**", "internal/app/account/**"]
    docs: ["docs/architecture/data-model/04-tables/02-account.md#42-account", "docs/architecture/data-model/05-states-and-policies.md#5-状態とポリシー"]
  - name: module-moderation
    paths: ["internal/domain/moderation/**", "internal/app/moderation/**"]
    docs: ["docs/architecture/data-model/04-tables/03-moderation.md#43-moderation", "docs/operations/moderation.md", "docs/adr/0058-moderation-admin-separation.md"]
  - name: module-content
    paths: ["internal/domain/content/**", "internal/app/content/**"]
    docs: ["docs/architecture/data-model/04-tables/04-content.md#44-content", "docs/architecture/visibility.md"]
    notes:
      - "Visibility checks go through the single domain policy function; never re-implement them."
  - name: text-tokens
    paths: ["pkg/testkit/fixtures/text/**", "internal/app/content/text.go", "internal/domain/content/custom_emoji.go", "app/web/src/lib/textTokens.ts", "app/web/src/lib/textHighlights.ts"]
    docs: ["docs/adr/0092-composer-autocomplete-highlight.md#decision決定"]
    checks: [go, web]
    notes:
      - "ParseText, ScanShortcodes and app/web/src/lib/textTokens.ts follow the same rules: change them together with the shared vectors pkg/testkit/fixtures/text/tokens.json, which the Go tests and Vitest both read."
  - name: module-graph
    paths: ["internal/domain/graph/**", "internal/app/graph/**"]
    docs: ["docs/architecture/data-model/04-tables/05-graph.md#45-graph"]
  - name: account-move
    paths: ["internal/domain/account/move*.go", "internal/app/account/move.go", "internal/app/graph/migrate.go", "internal/app/federation/move.go", "internal/app/federation/move_out.go", "internal/interface/clientapi/account_move.go", "pkg/testkit/account_move_contract.go", "pkg/testkit/account_move_out_contract.go"]
    docs: ["docs/adr/0089-account-migration-move.md#decision決定", "docs/architecture/federation.md#34-アクティビティごとのハンドラ", "docs/architecture/federation.md#71-記録", "docs/architecture/data-model/04-tables/02-account.md#移転adr-0089"]
    notes:
      - "A Move is recorded by the account module (account.moved); the graph module migrates the local follows, blocks and mutes in graph.migrate_follows, idempotently."
      - "A local move is checked by federation.LocalMoves before account.RecordLocalMove; account.moved (self) queues the Update(Actor) with movedTo and the Move (flow retract), and a moved account is refused posting and following with 403 account-moved."
  - name: module-timeline
    paths: ["internal/domain/timeline/**", "internal/app/timeline/**"]
    docs: ["docs/architecture/data-model/04-tables/06-timeline.md#46-timeline", "docs/architecture/data-model/06-timeline-queries.md#6-タイムラインのクエリ", "docs/adr/0013-timeline-strategy.md"]
  - name: module-notification
    paths: ["internal/domain/notification/**", "internal/app/notification/**"]
    docs: ["docs/architecture/data-model/04-tables/07-notification.md#47-notification"]
  - name: module-federation
    paths: ["internal/domain/federation/**", "internal/app/federation/**"]
    docs: ["docs/architecture/data-model/04-tables/08-federation.md#48-federation", "docs/architecture/federation.md#1-構成"]
    notes:
      - "ActivityPub wire formats and federated URIs stay spec-compliant even in v0."
  - name: module-instance
    paths: ["internal/domain/instance/**", "internal/app/instance/**"]
    docs: ["docs/architecture/data-model/04-tables/09-instance.md#49-instance", "docs/operations/instance-settings.md"]
  - name: module-webhook
    paths: ["internal/domain/webhook/**", "internal/app/webhook/**"]
    docs: ["docs/architecture/data-model/04-tables/11-webhook.md#411-webhook", "docs/reference/webhooks.md"]
  - name: module-finance
    paths: ["internal/domain/finance/**", "internal/app/finance/**"]
    docs: ["docs/architecture/data-model/04-tables/12-finance.md#412-finance", "docs/adr/0067-finance-cost-records.md", "docs/adr/0068-billing-import.md", "docs/adr/0073-income-records-and-publication.md"]
  - name: module-supporters
    paths: ["internal/domain/supporters/**", "internal/app/supporters/**"]
    docs: ["docs/architecture/data-model/04-tables/13-supporters.md#413-supporters", "docs/adr/0072-supporter-plans-and-roles.md", "docs/operations/supporters.md"]
  - name: app-infrastructure
    paths: ["internal/app/kernel/**", "internal/app/uow/**", "internal/app/queue/**", "internal/app/stream/**", "internal/app/projection/**", "internal/app/blob/**", "internal/app/media/**", "internal/app/metrics/**"]
    docs: ["docs/architecture/overview.md#3-ポート一覧", "docs/architecture/data-model/02-consistency.md#2-整合性モデル"]
    notes:
      - "Every external resource goes through a port, and every adapter passes the port's contract suite (pkg/testkit)."

  # --- Server: adapters ---------------------------------------------------------------------------------
  - name: adapter-db
    paths: ["internal/adapter/db/**", "internal/adapter/kv/**", "internal/adapter/queue/**"]
    docs: ["docs/architecture/data-model/01-conventions.md#1-共通規約", "docs/architecture/data-model/02-consistency.md#2-整合性モデル", "docs/adr/0003-database-abstraction.md", "docs/operations/database.md"]
    checks: [go, schema]
  - name: adapter-messaging
    paths: ["internal/adapter/stream/**", "internal/adapter/valkey/**", "internal/adapter/telemetry/**"]
    docs: ["docs/adr/0050-stream-pubsub-across-processes.md", "docs/architecture/deployment-targets.md#ストリームプロセス間の知らせ"]
  - name: adapter-media
    paths: ["internal/adapter/blob/**", "internal/adapter/media/**"]
    docs: ["docs/adr/0005-blob-storage-and-media.md", "docs/adr/0054-media-variants-video-audio.md"]
  - name: adapter-federation
    paths: ["internal/adapter/httpsig/**", "internal/adapter/jsonld/**", "internal/adapter/htmlsanitizer/**", "internal/adapter/keymanager/**"]
    docs: ["docs/architecture/federation.md#2-署名", "docs/architecture/federation.md#4-as2-の正規化", "docs/architecture/federation.md#5-リモート-html-のサニタイズ", "docs/operations/key-management.md"]
  - name: adapter-http
    paths: ["internal/adapter/httpclient/**"]
    docs: ["docs/adr/0019-security-baseline.md"]
    notes:
      - "Outbound HTTP that remote parties influence goes through the SSRF-guarded kernel.HTTPClient."
  - name: adapter-user-facing
    paths: ["internal/adapter/mail/**", "internal/adapter/captcha/**", "internal/adapter/webauthn/**", "internal/adapter/webpush/**", "internal/adapter/markdown/**", "internal/adapter/system/**"]
    docs: ["docs/architecture/overview.md#3-ポート一覧", "docs/operations/captcha.md"]
  - name: adapter-billing
    paths: ["internal/adapter/billing/**"]
    docs: ["docs/adr/0068-billing-import.md", "docs/operations/billing-import.md"]
  - name: adapter-payment
    paths: ["internal/adapter/payment/**"]
    docs: ["docs/adr/0074-payment-provider-port.md", "docs/operations/payments-stripe.md"]

  # --- Server: interfaces -------------------------------------------------------------------------------
  - name: client-api
    paths: ["internal/interface/clientapi/**", "api/**"]
    docs: ["docs/architecture/client-api.md#3-エンドポイントを追加する手順", "docs/architecture/client-api.md#2-規約"]
    checks: [api, go, web, mykit]
    shared: true
    notes:
      - "Edit api/spec/ (one file per path and component; list new files in api/spec/openapi.yaml), never api/openapi.yaml; then `scripts/task.sh api:generate`."
  - name: oauth
    paths: ["internal/interface/oauth/**", "internal/interface/authpages/**"]
    docs: ["docs/architecture/client-api.md#4-認可oauth-20", "docs/architecture/web-client/08-server-rendered-pages.md#8-サーバーが描画する画面"]
  - name: activitypub
    paths: ["internal/interface/activitypub/**"]
    docs: ["docs/architecture/federation.md#3-受信inbox", "docs/architecture/federation.md#10-コレクションとオブジェクトの-get"]
  - name: maintenance
    paths: ["internal/interface/maintenance/**", "internal/platform/maintenance.go"]
    docs: ["docs/adr/0084-maintenance-mode.md#decision決定", "docs/adr/0085-uptime-monitoring-status-page.md#4-メンテナンスモードとの関係"]
    notes:
      - "internal/interface/maintenance depends only on the standard library and internal/i18n; the maintenance mode opens no adapter (platform.NewMaintenanceApp never calls NewApp)."
      - "The maintenance responses (ADR-0084 §3) and `my maintenance export` render the same template (maintenance.Render)."
  - name: interface-other
    paths: ["internal/interface/media/**", "internal/interface/payments/**", "internal/interface/web/**"]
    docs: ["docs/architecture/overview.md#6-リポジトリ構成", "docs/adr/0028-html-shell-link-previews-and-pwa.md"]

  # --- Schema and queries -------------------------------------------------------------------------------
  - name: schema
    paths: ["schema/**", "queries/**", "sqlc.yaml"]
    docs: ["docs/architecture/data-model/01-conventions.md#1-共通規約", "docs/adr/0020-data-modeling-principles.md", "docs/adr/0023-declarative-schema-management.md"]
    checks: [schema, go]
    shared: true
    notes:
      - "Edit the owning module's file schema/<dialect>/<NN>-<module>.sql in every dialect together (schema/README.md); never hand-write migrations; `scripts/task.sh go:sqlc` after query changes. Query files stay ASCII-only."

  # --- Test kits ------------------------------------------------------------------------------------------
  - name: testkit
    paths: ["pkg/testkit/**"]
    docs: ["docs/adr/0015-testing-strategy.md", "docs/adr/0041-postgres-tests-on-pgmem.md"]
  - name: testkit-backends
    paths: ["pkg/testkit/pgtest/**", "pkg/testkit/valkeytest/**", "pkg/testkit/awstest/**", "pkg/testkit/fixtures/**"]
    docs: ["docs/adr/0041-postgres-tests-on-pgmem.md"]

  # --- Client libraries -----------------------------------------------------------------------------------
  - name: mykit
    paths: ["pkg/mykit/**", "scripts/mykit-mod-check.sh"]
    docs: ["docs/adr/0093-api-client-library-mykit.md", "docs/architecture/client-api.md#4-認可oauth-20"]
    checks: [mykit]
    notes:
      - "pkg/mykit is a Go module of its own under MIT (`// SPDX-License-Identifier: MIT`): it never imports or requires the server module, and its dependencies are permissive only (`scripts/task.sh mykit:check`)."
      - "api.gen.go is generated from api/openapi.yaml by `scripts/task.sh api:generate` (pkg/mykit/oapi-codegen.yaml); the hand-written files hold only the cross-cutting layer (auth, errors, paging, retries, uploads), never per-endpoint helpers."

  # --- Clients --------------------------------------------------------------------------------------------
  - name: client-workspace
    paths: ["app/*", "app/oxlint/**"]
    docs: ["docs/adr/0025-web-client-stack.md", "docs/adr/0049-client-lint-oxlint.md"]
    checks: [web]
    shared: true
  - name: ui-emoji-fonts
    paths: ["app/ui/src/fonts/emoji/**", "app/ui/src/emoji.css", "scripts/emoji-fonts/**"]
    docs: ["docs/adr/0095-noto-color-emoji.md", "app/ui/README.md#typography"]
    checks: [ui, web]
    notes:
      - "app/ui/src/emoji.css and the WOFF2 files and OFL.txt of app/ui/src/fonts/emoji/ are generated by `scripts/task.sh emoji:generate` (tasks/emoji.yml, scripts/emoji-fonts through uv); never edit them by hand. The text symbols left out of unicode-range are TEXT_CODE_POINTS in scripts/emoji-fonts/emoji_fonts.py."
      - "The Service Worker caches the fonts at run time, never in the precache (globIgnores in app/web/vite.config.ts, sw/routing.ts)."
  - name: ui-kit
    paths: ["app/ui/**"]
    docs: ["app/ui/README.md", "docs/architecture/web-client/16-look-states-and-wording.md#16-見た目状態文言", "docs/architecture/web-client/README.md#5-アクセシビリティ"]
    checks: [ui, web]
  - name: web-client
    paths: ["app/web/**"]
    docs: ["docs/architecture/web-client/README.md#1-react-の基本", "docs/architecture/web-client/README.md#2-状態とデータ", "docs/architecture/web-client/README.md#3-構成と責務分離", "docs/architecture/web-client/README.md#5-アクセシビリティ"]
    checks: [web]
    notes:
      - "Follow docs/architecture/web-client/ (the principles in its README.md and the section of the screen); never write React from memory. User-facing strings go through `client*` messages."
  - name: web-tests
    paths: ["app/web/e2e/**", "app/web/src/test/**", "app/web/**/*.test.ts", "app/web/**/*.test.tsx"]
    docs: ["docs/architecture/web-client/README.md#テストの置き場所と道具"]
  - name: web-shell
    paths: ["app/web/src/*", "app/web/src/routes/**", "app/web/sw/**", "app/web/public/**", "app/web/vite-plugins/**", "app/web/scripts/**", "app/web/*"]
    docs: ["docs/architecture/web-client/09-app-shell.md#9-アプリの外枠", "docs/architecture/web-client/11-pwa.md#11-pwa"]
    shared: true
    notes:
      - "app/web/src/routeTree.gen.ts is generated from src/routes before every task that reads it and is not committed (ADR-0081)."
  - name: web-server-pages
    paths: ["app/web/src/server-pages/**", "app/web/src/server-pages.css"]
    docs: ["docs/architecture/web-client/08-server-rendered-pages.md#8-サーバーが描画する画面"]
  - name: web-lib
    paths: ["app/web/src/lib/api/**", "app/web/src/lib/auth/**", "app/web/src/lib/sse/**"]
    docs: ["docs/architecture/web-client/10-api-client-and-auth.md#10-api-クライアントと認証", "docs/adr/0030-web-client-token-handling.md", "docs/adr/0045-client-server-cache-policy.md"]
  - name: web-feature-admin
    paths: ["app/web/src/features/admin/**", "app/web/src/features/moderation/**", "app/web/src/features/announcements/**", "app/web/src/features/documents/**"]
    docs: ["docs/architecture/web-client/14-admin.md#14-管理画面"]
  - name: web-feature-compose
    paths: ["app/web/src/features/compose/**"]
    docs: ["docs/architecture/web-client/12-compose.md#12-投稿フォーム", "docs/adr/0039-mobile-navigation-and-compose-entry.md"]
  - name: web-feature-status
    paths: ["app/web/src/features/status/**", "app/web/src/features/timeline/**", "app/web/src/features/notifications/**", "app/web/src/features/profile/**"]
    docs: ["docs/architecture/web-client/13-status-detail-and-actions.md#13-投稿の詳細と投稿への操作", "docs/architecture/web-client/09-app-shell.md#9-アプリの外枠"]
  - name: web-feature-emoji
    paths: ["app/web/src/features/emoji/**", "app/web/src/features/custom-emojis/**"]
    docs: ["docs/adr/0051-custom-emoji.md", "docs/adr/0052-emoji-reactions.md", "docs/adr/0070-permission-split-emoji-finance.md", "docs/adr/0091-composer-emoji-picker.md"]
    notes:
      - "features/emoji/unicode/*.gen.json are generated by `scripts/task.sh emoji:generate` (tasks/emoji.yml, scripts/emoji-table) with the server's emoji_table.gen.go; never edit them by hand."
      - "Unicode emoji are drawn with the Noto Color Emoji web font of @my/ui/emoji.css everywhere (ADR-0095), never with an OS-font check: the fonts cover every emoji of EMOJI_VERSION."
  - name: web-feature-search
    paths: ["app/web/src/features/search/**"]
    docs: ["docs/architecture/web-client/15-search-and-remote-follow.md#15-検索とほかのサーバーのアカウントのフォロー"]
  - name: web-feature-report
    paths: ["app/web/src/features/report/**"]
    docs: ["docs/architecture/web-client/17-reports.md#17-通報", "docs/architecture/web-client/18-account-status-and-appeals.md#18-アカウントの状態と異議申し立て"]
  - name: web-feature-settings
    paths: ["app/web/src/features/settings/**", "app/web/src/features/session/**"]
    docs: ["docs/architecture/web-client/19-import-and-export.md#19-インポートとエクスポート", "docs/architecture/web-client/10-api-client-and-auth.md#10-api-クライアントと認証"]
  - name: web-feature-supporters
    paths: ["app/web/src/features/supporters/**"]
    docs: ["docs/adr/0072-supporter-plans-and-roles.md", "docs/adr/0071-role-badges-and-supporter-list.md", "docs/operations/supporters.md"]
  - name: web-feature-public
    paths: ["app/web/src/features/about/**", "app/web/src/features/landing/**", "app/web/src/features/costs/**"]
    docs: ["docs/architecture/web-client/09-app-shell.md#9-アプリの外枠", "docs/adr/0073-income-records-and-publication.md"]

  # --- Deployment -----------------------------------------------------------------------------------------
  - name: deploy
    paths: ["deploy/**", "Dockerfile"]
    docs: ["docs/architecture/deployment-targets.md#self-hosteddocker--microk8s", "docs/operations/running.md"]
    checks: [docker]

  # --- Tools ----------------------------------------------------------------------------------------------
  - name: agentkit
    paths: ["tools/agentkit/**"]
    docs: ["tools/agentkit/README.md"]
    checks: [agentkit]
  - name: go-tools
    paths: ["tools/go.mod", "tools/go.sum"]
    docs: ["docs/reference/commands.md"]
    checks: [go]

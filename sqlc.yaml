# SPDX-License-Identifier: AGPL-3.0-only
#
# sqlc configuration (ADR-0003). The sqlc version is pinned in tools/go.mod. Regenerate with
# `scripts/task.sh go:sqlc`; `scripts/task.sh go:sqlc-check` (part of `scripts/task.sh check`) fails when the committed code is stale.
#
# Product queries are split by module (ADR-0153 §3): one entry per module and dialect reads
# queries/<dialect>/<module>/*.sql and generates the package internal/adapter/db/<dialect>/<module>gen,
# so a change to one module's queries regenerates only that package. An entry's schema is the files
# of schema/<dialect>/ of the module and of the modules it depends on (the imports of
# internal/app/<module>, with the queue's tables in 10-infrastructure.sql), so a query can join the
# tables of those modules. omit_unused_structs keeps a package's models.go to the tables that its
# own queries return whole, and every query names its tables, so the other files of the schema
# add no code. The one exception: content's retention query keeps a status deletion while a
# notification names the status, so the content entries also read 07-notification.sql. The first
# entry of a dialect holds its generator options (&sqlite-go, &postgres-go); the others merge them
# and set their own package and out.
# Comments above a query become the doc comment of its generated method.
#
# The queue entries generate the queries of the database job queue (internal/adapter/queue/db)
# from queries/<dialect>/queue/*.sql into internal/adapter/queue/db/internal/<dialect>queue.
#
# Keep query files ASCII-only: the sqlite engine of sqlc miscounts byte offsets after a
# multi-byte character, which cuts generated queries short or rejects sqlc.arg / @name rewrites.
version: "2"
sql:
  - name: sqlite-account
    engine: sqlite
    schema:
      - schema/sqlite/02-account.sql
      - schema/sqlite/10-infrastructure.sql
      - schema/sqlite/16-hook.sql
    queries: queries/sqlite/account
    gen:
      go: &sqlite-go
        package: accountgen
        out: internal/adapter/db/sqlite/accountgen
        emit_empty_slices: true
        omit_unused_structs: true

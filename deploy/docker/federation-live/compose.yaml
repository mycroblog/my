# SPDX-License-Identifier: AGPL-3.0-only
#
# Live interoperability stack (ADR-0006, ADR-0015, docs/architecture/federation.md §12): this server, Mastodon,
# GoToSocial, Misskey, and Akkoma federating over HTTPS with a private CA, and an Activity-Relay relay (ADR-0061). scripts/federation-live.sh generates the CA, the
# certificate, and the secrets, starts this file, creates one user on each server, runs the scenarios, and
# collects the logs; run it with `scripts/task.sh docker:federation-live` (README.md next to this file).
#
# Container DNS: the proxy holds the network aliases my.test, mastodon.test, gts.test, misskey.test,
# akkoma.test, and relay.test, so every server reaches every other one (and itself) through the proxy, which terminates TLS with a certificate
# of the private CA and forwards by host name. Every server trusts that CA (SSL_CERT_FILE, Misskey's
# NODE_EXTRA_CA_CERTS, the system store of Akkoma's image), and every server but Akkoma, which has no such setting, is
# allowed to reach the private addresses of this network only.
#
# Third-party images are pinned by tag and digest; Akkoma, which publishes no image, is built from its release zip,
# pinned by SHA-256 (akkoma/Dockerfile).

name: my-federation-live

x-mastodon: &mastodon
  image: ghcr.io/mastodon/mastodon:v4.7.3@sha256:0bf26ebfb7d694bddd2fcf0c5769642ac29d997eb42169c540963cf0f27ee6ca
  environment: &mastodon-env
    RAILS_ENV: production
    NODE_ENV: production
    LOCAL_DOMAIN: mastodon.test
    SECRET_KEY_BASE: ${MASTODON_SECRET_KEY_BASE:?generated by scripts/federation-live.sh}
    OTP_SECRET: ${MASTODON_OTP_SECRET:?generated by scripts/federation-live.sh}
    ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${MASTODON_AR_DETERMINISTIC_KEY:?generated by scripts/federation-live.sh}
    ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${MASTODON_AR_KEY_DERIVATION_SALT:?generated by scripts/federation-live.sh}
    ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${MASTODON_AR_PRIMARY_KEY:?generated by scripts/federation-live.sh}
    DB_HOST: db
    DB_PORT: "5432"
    DB_NAME: mastodon
    DB_USER: postgres
    DB_PASS: postgres
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    # Secure mode: Mastodon requires a signature on every ActivityPub GET, so the scenarios exercise the
    # signed fetches of this server (federation.md §2).
    AUTHORIZED_FETCH: "true"
    # The other servers live on this network's private addresses.
    ALLOWED_PRIVATE_ADDRESSES: ${FEDERATION_LIVE_SUBNET:-172.29.58.0/24}
    TRUSTED_PROXY_IP: ${FEDERATION_LIVE_SUBNET:-172.29.58.0/24}
    SSL_CERT_FILE: /certs/ca.pem
    SMTP_DELIVERY_METHOD: test
    RAILS_LOG_LEVEL: info
    RAILS_LOG_TO_STDOUT: enabled
  volumes:
    - ${FEDERATION_LIVE_CERTS:?generated by scripts/federation-live.sh}:/certs:ro
  networks:
    - fed

services:
  proxy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${FEDERATION_LIVE_CERTS:?generated by scripts/federation-live.sh}:/certs:ro
    environment:
      # eve@mastodon.test, whose draft-cavage POSTs the Caddyfile refuses; the script recreates the
      # proxy with her actor URI once Mastodon has created her.
      FEDERATION_LIVE_SIGNER_ACTOR: ${FEDERATION_LIVE_SIGNER_ACTOR:-https://mastodon.test/users/eve}
      FEDERATION_LIVE_SIGNER_INBOX: ${FEDERATION_LIVE_SIGNER_INBOX:-/users/eve/inbox}
    ports:
      # The scenarios reach every server here, sending the server's host name as SNI and Host.
      - "127.0.0.1:${FEDERATION_LIVE_HTTPS_PORT:-18443}:443"
    networks:
      fed:
        aliases:
          - my.test
          - mastodon.test
          - gts.test
          - misskey.test
          - akkoma.test
          - relay.test

  db:
    # One PostgreSQL for this server (`my`, with the Atlas dev database `my_dev`), Mastodon (`mastodon`),
    # Misskey (`misskey`), and Akkoma (`akkoma`).
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-my.sh:ro
      - ../../../schema/postgres.bootstrap.sql:/bootstrap/postgres.bootstrap.sql:ro
    ports:
      # The scenarios read what this server recorded (received activities) from here.
      - "127.0.0.1:${FEDERATION_LIVE_DB_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "my", "-h", "127.0.0.1"]
      interval: 2s
      timeout: 5s
      retries: 60
    networks:
      - fed

  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 60
    networks:
      - fed

  # --- this server ------------------------------------------------------------------------------

  my-schema:
    build:
      context: ../../..
      target: schema
    image: my-schema:${MY_VERSION:-federation-live}
    command:
      - schema
      - apply
      - --url=postgres://my:my@db:5432/my?sslmode=disable&search_path=public
      - --to=file:///schema/postgres
      - --dev-url=postgres://my:my@db:5432/my_dev?sslmode=disable&search_path=public
      - --auto-approve
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - fed

  my:
    build:
      context: ../../..
      target: app
      args:
        VERSION: ${MY_VERSION:-federation-live}
    image: my:${MY_VERSION:-federation-live}
    depends_on:
      my-schema:
        condition: service_completed_successfully
    environment:
      MY_HOST: my.test
      MY_ROLE: all
      MY_DB: postgres
      MY_DATABASE_URL: postgres://my:my@db:5432/my?sslmode=disable
      MY_KEK: ${MY_KEK:?generated by scripts/federation-live.sh}
      # The peers are on private addresses (ADR-0019 §1 allows this only in the development profile).
      MY_PROFILE: development
      MY_HTTP_ALLOW_PRIVATE_NETWORKS: "true"
      SSL_CERT_FILE: /certs/ca.pem
    volumes:
      - ${FEDERATION_LIVE_CERTS:?generated by scripts/federation-live.sh}:/certs:ro
    networks:
      - fed

  # --- Mastodon ---------------------------------------------------------------------------------

  mastodon-init:
    <<: *mastodon
    command: ["bundle", "exec", "rails", "db:prepare"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  mastodon-web:
    <<: *mastodon
    command: ["bundle", "exec", "puma", "-C", "config/puma.rb"]
    depends_on:
      mastodon-init:
        condition: service_completed_successfully

  mastodon-sidekiq:
    <<: *mastodon
    command: ["bundle", "exec", "sidekiq"]
    depends_on:
      mastodon-init:
        condition: service_completed_successfully

  # --- GoToSocial -------------------------------------------------------------------------------

  gotosocial:
    image: superseriousbusiness/gotosocial:0.22.1@sha256:0078ca451dda5e8c4a8630784519f99b69f48c3dda79586a9703d4bf8ea14dae
    environment:
      GTS_HOST: gts.test
      GTS_PROTOCOL: https
      GTS_BIND_ADDRESS: 0.0.0.0
      GTS_PORT: "8080"
      GTS_DB_TYPE: sqlite
      GTS_DB_ADDRESS: /gotosocial/storage/sqlite.db
      GTS_LETSENCRYPT_ENABLED: "false"
      GTS_ACCOUNTS_REGISTRATION_OPEN: "false"
      GTS_TRUSTED_PROXIES: ${FEDERATION_LIVE_SUBNET:-172.29.58.0/24}
      GTS_HTTP_CLIENT_ALLOW_IPS: ${FEDERATION_LIVE_SUBNET:-172.29.58.0/24}
      GTS_LOG_LEVEL: info
      SSL_CERT_FILE: /certs/ca.pem
    volumes:
      - ${FEDERATION_LIVE_CERTS:?generated by scripts/federation-live.sh}:/certs:ro
    networks:
      - fed

  # --- Misskey ----------------------------------------------------------------------------------

  misskey:
    image: misskey/misskey:2026.10.0@sha256:399a176e8e0e0a84829e8b7f27d2140bcd463ef58bdfb5bf1ce91b12567bd66f
    # The image runs the database migrations, then the server and its job workers in one process.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_EXTRA_CA_CERTS: /certs/ca.pem
    configs:
      - source: misskey
        target: /misskey/.config/default.yml
    volumes:
      - ${FEDERATION_LIVE_CERTS:?generated by scripts/federation-live.sh}:/certs:ro
    networks:
      - fed

  # --- Akkoma (the LitePub relay of ADR-0061) ---------------------------------------------------

  akkoma:
    build: ./akkoma
    image: my-federation-live-akkoma:v3.20.0
    # The release zip is built for linux/amd64.
    platform: linux/amd64
    depends_on:
      db:
        condition: service_healthy
    configs:
      # The entrypoint copies it to /etc/akkoma/config.exs, which Akkoma refuses to read with world permissions.
      - source: akkoma
        target: /config/akkoma.exs
    volumes:
      - ${FEDERATION_LIVE_CERTS:?generated by scripts/federation-live.sh}:/certs:ro
    networks:
      - fed

  # --- Activity-Relay (ADR-0061) -----------------------------------------------------------------

  relay-server:
    image: &relay-image yukimochi/activity-relay:v2.0.11@sha256:5798afb692163dfe5e89ec2a1e48a59f7ea26f828837f9810a2f4b866190b024
    command: ["relay", "server"]
    environment: &relay-env
      # No config.yml: Activity-Relay reads its settings from the environment. The actor key is the
      # PKCS #1 RSA key that scripts/federation-live.sh generates; Redis database 2 keeps its keys apart.
      ACTOR_PEM: /certs/relay-actor.pem
      REDIS_URL: redis://redis:6379/2
      RELAY_BIND: 0.0.0.0:8080
      RELAY_DOMAIN: relay.test
      RELAY_SERVICENAME: federation-live relay
      JOB_CONCURRENCY: "5"
      SSL_CERT_FILE: /certs/ca.pem
    volumes:
      - ${FEDERATION_LIVE_CERTS:?generated by scripts/federation-live.sh}:/certs:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - fed

  relay-worker:
    image: *relay-image
    command: ["relay", "worker"]
    environment: *relay-env
    volumes:
      - ${FEDERATION_LIVE_CERTS:?generated by scripts/federation-live.sh}:/certs:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - fed

configs:
  misskey:
    # Misskey's configuration file (.config/example.yml of Misskey). Redis database 1 keeps its keys apart
    # from Mastodon's (database 0).
    content: |
      url: https://misskey.test/
      port: 3000
      db:
        host: db
        port: 5432
        db: misskey
        user: misskey
        pass: misskey
      dbReplications: false
      redis:
        host: redis
        port: 6379
        db: 1
      fulltextSearch:
        provider: sqlLike
      id: aidx
      # The other servers live on this network's private addresses.
      allowedPrivateNetworks:
        - ${FEDERATION_LIVE_SUBNET:-172.29.58.0/24}
      trustProxy:
        - ${FEDERATION_LIVE_SUBNET:-172.29.58.0/24}

  akkoma:
    # Akkoma's configuration file (priv/templates/sample_config.eex of Akkoma). `allow_relay` serves the relay
    # actor (/relay), which announces every local public post to its followers.
    content: |
      import Config

      config :pleroma, Pleroma.Web.Endpoint,
        url: [host: "akkoma.test", scheme: "https", port: 443],
        http: [ip: {0, 0, 0, 0}, port: 4000],
        secret_key_base: "${AKKOMA_SECRET_KEY_BASE:?generated by scripts/federation-live.sh}",
        live_view: [signing_salt: "${AKKOMA_SIGNING_SALT:?generated by scripts/federation-live.sh}"],
        signing_salt: "${AKKOMA_SIGNING_SALT:?generated by scripts/federation-live.sh}"

      config :pleroma, :instance,
        name: "federation-live",
        email: "admin@akkoma.test",
        notify_email: "admin@akkoma.test",
        registrations_open: false,
        allow_relay: true,
        static_dir: "/var/lib/akkoma/static"

      config :pleroma, :media_proxy, enabled: false

      config :pleroma, Pleroma.Repo,
        adapter: Ecto.Adapters.Postgres,
        username: "akkoma",
        password: "akkoma",
        database: "akkoma",
        hostname: "db"

      config :pleroma, :database, rum_enabled: false
      config :pleroma, Pleroma.Uploaders.Local, uploads: "/var/lib/akkoma/uploads"
      config :pleroma, Pleroma.Upload, base_url: "https://akkoma.test/media"
      config :joken, default_signer: "${AKKOMA_SECRET_KEY_BASE:?generated by scripts/federation-live.sh}"
      config :pleroma, configurable_from_database: false

networks:
  fed:
    ipam:
      config:
        - subnet: ${FEDERATION_LIVE_SUBNET:-172.29.58.0/24}
